# Sprint **Φ-D-MODE2 Completion (D66)** — bench catalog #01 / 10.
#
# Cf. docs/EFE_MODE2_ANCHORS_COMPLETION_ARCHITECTURE.md § 13.1.
#
# Frozen schema for cross-provider recall@1 benchmark. The 10 catalogs
# share the same structure ; this file is the canonical example. The
# 9 others are generated by `eval/mode2/catalogs/generate.py`.

id: router-v1
version: 1.0.0
description: |
  Customer-support routing — classify a user message into 5 categories
  for downstream agent assignment. Multi-lingual coverage : English (60%),
  French (20%), Spanish (10%), German (5%), CJK (5%).

labels:
  - id: billing-dispute
    description: |
      The customer challenges a charge, fee, or transaction on their
      account. Common triggers : duplicate charges, unauthorized
      transactions, disputed refunds.
    examples:
      - "I want to dispute the charge on my account"
      - "My card was charged twice for the same order"
      - "I did not authorize this transaction"
      - "Je conteste un prélèvement sur mon compte"
      - "Quiero disputar un cargo en mi tarjeta"

  - id: tech-support
    description: |
      The product or service is malfunctioning. Common triggers : login
      failures, crashes, performance issues, integration bugs.
    examples:
      - "The app keeps crashing when I open it"
      - "I cannot log into my account"
      - "Two-factor authentication is failing"
      - "L'application plante au démarrage"
      - "Die App stürzt ständig ab"

  - id: refund-request
    description: |
      The customer wants money back for a product or service. Distinct
      from billing-dispute : the customer agrees the charge was valid
      but wants to return / cancel.
    examples:
      - "I want a refund for order #12345"
      - "Please cancel my subscription and refund this month"
      - "The product arrived damaged, I want my money back"
      - "Je voudrais un remboursement pour ma commande"
      - "退款"

  - id: general-inquiry
    description: |
      The customer asks a general question that doesn't fit billing
      / tech / refund. Pricing, policies, hours, etc.
    examples:
      - "What are your business hours?"
      - "Do you offer student discounts?"
      - "How long does shipping take?"
      - "Quels sont vos délais de livraison ?"
      - "¿Cuánto cuesta el plan premium?"

  - id: other
    description: |
      Catch-all for messages that don't fit any of the above. Should
      be ≤ 5 % of production traffic.
    examples:
      - "Hello"
      - "Random message"
      - "Test"
      - "Bonjour"

