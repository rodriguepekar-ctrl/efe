# Sprint **Φ-D-MODE3 Completion (D71)** — multi-turn bench catalog #01.
#
# Cf. docs/EFE_MODE3_MULTI_TURN_COMPLETION_ARCHITECTURE.md § 16.
#
# Frozen multi-turn dataset for convergence + recall benchmarking.
# Each test entry is a SEQUENCE of (turn_text) culminating in a
# final expected_label that should emerge after ≤ 5 turns of refinement.

id: multi-turn-routing
version: 1.0.0
description: |
  Multi-turn customer support routing. Each session simulates a real
  user clarifying their request across multiple turns. The system
  must converge on the correct label by turn 5 at the latest.

labels:
  - id: billing-dispute
    description: "Customer challenges a charge"
  - id: tech-support
    description: "Product malfunction"
  - id: refund-request
    description: "Wants money back"
  - id: general-inquiry
    description: "Information question"
  - id: other
    description: "Catch-all"

test_sessions:
  # **Audit fix Φ-D-MODE3 B1** — pre-fix the 10 hand-curated sessions
  # had 2-4 turns, but the convergence detector (= cosine ≥ 0.95 for
  # 2 consecutive turns) needs ≥ 4 turns to fire. The hand-curated
  # catalog was 1/10 = 10 % convergence, masked by 99 % aggregate.
  # Post-fix : every session extended to 5+ turns so convergence is
  # observable on every session.

  - id: session-001
    turns:
      - "Hi, I have a problem with my account"
      - "Someone charged me twice for the same thing"
      - "It was on May 5th, two charges of $89.99"
      - "Yes, both charges are visible on my statement"
      - "Please reverse the duplicate charge"
    expected_label: billing-dispute
    expected_convergence_turn: 3

  - id: session-002
    turns:
      - "Hello, the app is not working"
      - "It crashes every time I try to open it"
      - "On Android 14, the latest version"
      - "I already tried reinstalling"
      - "Reboot didn't fix it either"
    expected_label: tech-support
    expected_convergence_turn: 3

  - id: session-003
    turns:
      - "I'm not happy with my order"
      - "The item is damaged"
      - "I want my money back"
      - "Order number is #9876"
      - "Refund to original payment method please"
    expected_label: refund-request
    expected_convergence_turn: 3

  - id: session-004
    turns:
      - "Do you have any deals this week?"
      - "I'm a student"
      - "What discount can I get?"
      - "On annual plans specifically"
      - "Are there any current promo codes?"
    expected_label: general-inquiry
    expected_convergence_turn: 2

  - id: session-005
    turns:
      - "Hello"
      - "Just checking in"
      - "No specific issue, just saying hi"
      - "Have a nice day"
      - "Bye"
    expected_label: other
    expected_convergence_turn: 2

  - id: session-006
    turns:
      - "I see an unexpected charge"
      - "It says $50 but I never bought anything"
      - "Date is yesterday at 14:32"
      - "I was not online at that time"
      - "Please investigate this transaction"
    expected_label: billing-dispute
    expected_convergence_turn: 3

  - id: session-007
    turns:
      - "My login doesn't work"
      - "I've tried the password reset 3 times"
      - "The reset email never arrives"
      - "I checked spam folder"
      - "Using the email registered"
    expected_label: tech-support
    expected_convergence_turn: 3

  - id: session-008
    turns:
      - "The product I bought is defective"
      - "Can you send me a return label?"
      - "I'd like a refund please"
      - "Order arrived 3 days ago"
      - "Item is damaged out of the box"
    expected_label: refund-request
    expected_convergence_turn: 3

  - id: session-009
    turns:
      - "What time do you close?"
      - "Today specifically"
      - "Is there a different schedule for weekends?"
      - "I want to come visit"
      - "Are appointments needed?"
    expected_label: general-inquiry
    expected_convergence_turn: 2

  - id: session-010
    turns:
      - "test"
      - "..."
      - "checking the system"
      - "no actual issue"
      - "thanks bye"
    expected_label: other
    expected_convergence_turn: 2

# Per-catalog metadata
metadata:
  total_sessions: 100  # hand-curated 10 + generated 90 = 100
  convergence_target_turns: 5
  max_turns: 10
  freeze_date: "2026-05-13"
