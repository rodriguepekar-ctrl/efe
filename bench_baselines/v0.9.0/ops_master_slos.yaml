# Sprint Φ-D-OPS (D95-D99) — Master SLO bundle.
# Consolidates 105 surface SLOs across 6 sprint suites (AL, Stream,
# Compliance, LATACT, Mode-2, Mode-3) into 18 master operational SLOs.
#
# Cf. `docs/EFE_OPERATIONAL_PRODUCTION_ARCHITECTURE.md` § 8.
# Doctrine anti-Φ-D.A1 : every SLO is either ACTIVE or SKIPPED-with-DT.
# A "silent skip" (= SLO defined but not measured and not waived) is a
# build-breaker handled by `master_gate_check.py --no-silent-skip`.

apiVersion: efe.io/v1
kind:       MasterSLOBundle
metadata:
  name:       ops-master-slos
  version:    v0.9.0
  sprint:     phi-d-ops
  frozen_at:  2026-05-12T00:00:00Z
  supersedes: []     # first frozen master bundle
  see_also:
    - docs/EFE_OPERATIONAL_PRODUCTION_ARCHITECTURE.md
    - bench_baselines/v0.6.0/al_slos.yaml
    - bench_baselines/v0.7.0/stream_slos.yaml
    - bench_baselines/v0.8.0/comp_slos.yaml
    - bench_baselines/v0.8.0/latact_slos.yaml

spec:
  # Burn-rate matrix dimensions used by `rules.ops/burn_rate.yaml`.
  burn_rate:
    windows:    [1h, 6h, 24h, 72h]
    severities: [critical, major, watch]

  slos:
  # ─────────────────────────────────────────────────────────────────
  # Master SLO #1 — Availability (= the most-aggregated up-down).
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-AVAILABILITY
    name:        Cross-surface monthly availability
    description: |
      Aggregate availability across Mode-1, Mode-2, Mode-3 hot path,
      Streaming, AL inference path, Compliance write path, and
      LATACT P1 SLA endpoints. Computed as the probability that ALL
      surfaces are simultaneously responsive within p99 budget.
    metric:      efe_ops_availability_30d_ratio
    target:      0.9995    # 99.95 % monthly
    operator:    ">="
    window:      30d
    severity:    critical
    status:      ACTIVE
    burn_rate:   {budget_minutes: 21.6, alert_at: [0.1, 0.5, 1.0]}
    runbook:     docs/runbooks/ops_master_gate_fail.md
    owner:       sre-team
    inherits:    []
    blast_radius: ALL-TENANTS

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #2 — Mode-1 E2E p99 latency.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-E2E-P99-MODE1
    name:        Mode-1 GPU end-to-end p99
    description: |
      End-to-end latency from gRPC ingress to classify response,
      measured at the regional load balancer. Includes embedding +
      genesis prior + decoder + audit append.
    metric:      efe_e2e_p99_ms{mode="mode-1"}
    target:      200
    operator:    "<="
    window:      30d
    severity:    critical
    status:      ACTIVE
    burn_rate:   {budget_ms_over_target: 7200, alert_at: [0.1, 0.5, 1.0]}
    inherits:    [SLO-D6-LAT-1, SLO-CUDA-FUSION-TOTAL]
    runbook:     docs/runbooks/RUNBOOK_RB_07_LATENCY_P99.md
    owner:       core-team

  - id:          SLO-OPS-E2E-P99-MODE2
    name:        Mode-2 LLM-routed p99
    target:      900
    operator:    "<="
    metric:      efe_e2e_p99_ms{mode="mode-2"}
    window:      30d
    severity:    major
    status:      ACTIVE
    inherits:    [SLO-M21-LAT-1]
    runbook:     docs/runbooks/RUNBOOK_RB_07_LATENCY_P99.md
    owner:       core-team

  - id:          SLO-OPS-E2E-P99-MODE3
    name:        Mode-3 multi-turn p99
    target:      3500
    operator:    "<="
    metric:      efe_e2e_p99_ms{mode="mode-3"}
    window:      30d
    severity:    major
    status:      ACTIVE
    inherits:    [SLO-M22-LAT-1]
    runbook:     docs/runbooks/RUNBOOK_RB_07_LATENCY_P99.md
    owner:       core-team

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #5 — Top-1 accuracy.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-ACCURACY-AGGREGATE
    name:        Aggregate macro-F1 cross-mode
    description: |
      Weighted macro-F1 across all 3 modes on the canary catalog.
      Anti-régression threshold below which any release is blocked.
    metric:      efe_eval_macro_f1{catalog="canary",mode="aggregate"}
    target:      0.82
    operator:    ">="
    window:      release-gate
    severity:    critical
    status:      ACTIVE
    inherits:    [SLO-D8-HYB-4, SLO-M22-ACC-1]
    runbook:     docs/runbooks/d13_classify_drift.md
    owner:       ml-team

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #6 — Compliance posture.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-COMPLIANCE-POSTURE
    name:        Conformity-assessment control freshness
    description: |
      Every regulatory control (GDPR Art. 5/17/22/30/32/33/35,
      AI Act Art. 9/13/14/50, SOC 2 CC1-CC9, ISO 27001 Annex A)
      must have a green evidence row updated within the last 30 days.
    metric:      efe_compliance_control_stale_count
    target:      0
    operator:    "=="
    window:      30d
    severity:    critical
    status:      ACTIVE
    inherits:    [SLO-COMP-1, SLO-COMP-2, SLO-COMP-3]
    runbook:     docs/runbooks/ops_postmortem_overdue.md
    owner:       dpo-team
    blast_radius: REGULATORY

  - id:          SLO-OPS-AUDIT-CHAIN-INTACT
    name:        Audit chain HMAC continuity
    description: |
      No chain breaks (= no gap in `chain_position` per tenant) in
      the last 24 h. A break is a Sev1 incident.
    metric:      efe_audit_chain_gap_count
    target:      0
    operator:    "=="
    window:      24h
    severity:    critical
    status:      ACTIVE
    inherits:    [SLO-D14-AUDIT-1]
    runbook:     docs/runbooks/d13_classify_drift.md
    owner:       sre-team

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #8 — Tenant lifecycle.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-PROVISION-P95
    name:        Tenant provisioning saga p95
    description: |
      Time from `signup_intent` to `active` state must be ≤ 12 min
      p95 (AWS), 18 min p95 (GCP), 22 min p95 (Azure). Aggregate.
    metric:      efe_saga_provision_total_seconds{phase="active"}
    target:      720
    operator:    "<="
    quantile:    0.95
    window:      30d
    severity:    major
    status:      ACTIVE
    inherits:    [SLO-LATACT-P2-1]
    runbook:     docs/runbooks/d15_tenant_onboarding_failed.md
    owner:       saga-team

  - id:          SLO-OPS-LIFECYCLE-INVARIANTS
    name:        Tenant FSM transitions valid
    description: |
      No tenant transitions to an invalid next state. Enforced by
      Postgres trigger + saga compensation. Pin tested by
      `tenant_state_machine_audit.py`.
    metric:      efe_tenant_invalid_transition_count
    target:      0
    operator:    "=="
    window:      24h
    severity:    critical
    status:      ACTIVE
    runbook:     docs/runbooks/ops_master_gate_fail.md
    owner:       saga-team

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #10 — Streaming durability.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-STREAM-LAG-P99
    name:        Event stream consumer lag p99
    metric:      efe_stream_consumer_lag_seconds
    target:      5
    operator:    "<="
    quantile:    0.99
    window:      24h
    severity:    major
    status:      ACTIVE
    inherits:    [SLO-STREAM-LAG-1]
    runbook:     docs/runbooks/RB_M28_CDC_LAG.md
    owner:       stream-team

  - id:          SLO-OPS-STREAM-LOSS
    name:        Event loss zero in 24h
    metric:      efe_stream_event_loss_count
    target:      0
    operator:    "=="
    window:      24h
    severity:    critical
    status:      ACTIVE
    inherits:    [SLO-STREAM-LOSS-1]
    runbook:     docs/runbooks/RB_M28_CDC_LAG.md
    owner:       stream-team

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #12 — Active learning loop health.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-AL-LOOP-FRESHNESS
    name:        AL retune freshness window
    description: |
      Time between two successful retune-promotion events.
      Stale loops drift toward catalogs that the production
      embedder has outgrown.
    metric:      efe_al_last_promotion_age_hours
    target:      168            # 7 days
    operator:    "<="
    window:      30d
    severity:    watch
    status:      ACTIVE
    inherits:    [SLO-AL-RETUNE-1]
    runbook:     docs/runbooks/M24_ACTIVE_LEARNING_RUNBOOK.md
    owner:       ml-team

  - id:          SLO-OPS-AL-COST-PER-LABEL
    name:        Active-learning cost per labelled sample
    description: |
      Cost of one promoted label (= LLM oracle + human review +
      retune amortised) below USD 0.18 — confirms loop economic
      viability.
    metric:      efe_al_cost_per_label_usd
    target:      0.18
    operator:    "<="
    window:      30d
    severity:    watch
    status:      ACTIVE
    inherits:    [SLO-AL-COST-1]
    runbook:     docs/runbooks/ops_chargeback_overrun.md
    owner:       finops-team

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #14 — Multi-cloud parity.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-CLOUD-PARITY
    name:        Cross-cloud SLO variance bounded
    description: |
      For each of the 17 inherited SLOs, the value measured on the
      best cloud and on the worst cloud must differ by ≤ 20 %.
      Validates that no cloud-specific optimisation hides a global
      bug.
    metric:      efe_cloud_parity_max_variance_ratio
    target:      0.20
    operator:    "<="
    window:      release-gate
    severity:    major
    status:      ACTIVE
    runbook:     docs/runbooks/ops_master_gate_fail.md
    owner:       sre-team

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #15 — Release safety.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-CANARY-ROLLBACK-RATE
    name:        Canary rollback rate (per release)
    description: |
      Fraction of releases that triggered an automatic rollback in
      the canary window. > 10 % indicates an unstable release
      pipeline.
    metric:      efe_release_rollback_rate
    target:      0.10
    operator:    "<="
    window:      90d
    severity:    major
    status:      ACTIVE
    runbook:     docs/runbooks/ops_master_gate_fail.md
    owner:       release-team

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #16 — Incident velocity.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-MTTR
    name:        Mean time to recovery (Sev1+Sev2)
    metric:      efe_incident_mttr_minutes{severity=~"sev1|sev2"}
    target:      60
    operator:    "<="
    window:      90d
    severity:    major
    status:      ACTIVE
    runbook:     docs/runbooks/ops_master_gate_fail.md
    owner:       sre-team

  - id:          SLO-OPS-POSTMORTEM-VELOCITY
    name:        Postmortem published ≤ 48 h
    description: |
      Every Sev1/Sev2 incident has a postmortem committed under
      `docs/postmortems/` within 48 h of resolution. Audited by
      `postmortem_velocity_audit.py`.
    metric:      efe_postmortem_overdue_count
    target:      0
    operator:    "=="
    window:      30d
    severity:    watch
    status:      ACTIVE
    runbook:     docs/runbooks/ops_postmortem_overdue.md
    owner:       eng-leadership

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #18 — DR drill cadence.
  # ─────────────────────────────────────────────────────────────────
  - id:          SLO-OPS-DR-DRILL-CADENCE
    name:        DR drill executed quarterly with RTO < 30 min
    description: |
      Quarterly cross-region failover exercise. Measures both
      cadence (≤ 100 days between drills) and RTO bound.
    metric:      efe_dr_drill_days_since_last
    target:      100
    operator:    "<="
    window:      365d
    severity:    major
    status:      ACTIVE
    runbook:     docs/runbooks/ops_dr_drill_failure.md
    owner:       sre-team
    deferred_secondary:
      - {metric: efe_dr_drill_rto_minutes_last, target: 30, operator: "<="}

  # ─────────────────────────────────────────────────────────────────
  # Master SLO #19 — Sprint A1 P1 hierarchical multi-swarm gate.
  # Added in PR #4 (Sprint A1 P1).
  # ─────────────────────────────────────────────────────────────────
  #
  # Rolls up the 7 surface SLOs that gate the `efe-meta-swarm` bench
  # (`three_swarms_kovant_latency`).  If ANY surface SLO regresses
  # beyond its threshold, this rollup FAILs, and `master_gate_check.py`
  # blocks the release.
  #
  # During the soft-launch window (3 main runs post-merge), the
  # underlying surface rows carry `deferred_ticket: DT-A1-META-SOFT-LAUNCH-3-RUNS`,
  # which downgrades any SILENT-SKIP to SKIP-DT (anti-Φ-D.A1
  # compliant).  A FAIL still propagates upward — that is intentional :
  # a real regression should block, while a missing measurement
  # (e.g. CI runner down) should not.
  #
  # Cf. `bench_baselines/v0.10.0/meta_swarm_slos.yaml` for the
  # 7 children definitions and `docs/EFE_A1_BENCH_TRACKING.md`
  # for the freeze + investigation procedure.
  - id:          SLO-OPS-A1-META-SWARM
    name:        Sprint A1 P1 hierarchical multi-swarm bench gate
    description: |
      Rolls up the 7 `SLO-A1-META-*` surface SLOs produced by the
      `three_swarms_kovant_latency` bench (latency p50/p99,
      convergence iters, residual, determinism, non-regression,
      memory peak).  Activated in PR #4 (Sprint A1 P1, week 8).
    metric:      efe_meta_swarm_a1_gate_status
    target:      1     # 1 = all-children PASS (or SKIP-DT)
    operator:    "=="
    window:      PR-bound + nightly
    severity:    major
    status:      ACTIVE
    runbook:     docs/runbooks/ops_master_gate_fail.md
    owner:       meta-swarm-team
    inherits:
      - SLO-A1-META-LATENCY-P99
      - SLO-A1-META-LATENCY-P50
      - SLO-A1-META-CONVERGENCE-ITERS
      - SLO-A1-META-RESIDUAL-FINAL
      - SLO-A1-META-DETERMINISM
      - SLO-A1-META-NON-REGRESSION
      - SLO-A1-META-MEMORY-PEAK-MB
    blast_radius: A1-PHASE1-TENANTS
