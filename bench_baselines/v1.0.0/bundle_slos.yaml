# Sprint **Φ-C D26 (Bundle embedder réel)** — Baseline SLO
# definitions pour le bundle production-grade.
#
# Cf. `docs/EFE_BUNDLE_EMBEDDER_REAL_ARCHITECTURE.md` Annexe A + § 7.4.
#
# ## Status v1.0.0
#
# Le bundle Production-Multilingue v1.0.0 (= paraphrase-multilingual-
# MiniLM-L12-v2) cible la GA v1.0.0 EFE. Les 5 SLO bundle sont
# **TOUS ACTIVE** pour cette version (= la GA n'est pas signable
# sans qu'ils soient tous PASS).
#
# Format compatible avec `eval/scripts/check_slo.py` étendu pour
# le format YAML bundle (cf. P1 surface check_slo).

version: "1.0.0"
frozen_at: "PLACEHOLDER_v1.0.0_freeze_date"
git_sha: "PLACEHOLDER_v1.0.0_git_sha"
host_fingerprint_baseline: "PLACEHOLDER_compute_at_freeze"
bundle_id: "paraphrase-multilingual-MiniLM-L12-v2"
bundle_version: "1.0.0"
expected_manifest_sha256: "PLACEHOLDER_compute_at_build"

slos:
  # ────────────────────────────────────────────────────────────
  # Hash verifiable bit-à-bit
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-HASH
    description: "manifest.json hash matches baseline (= reproductibility)"
    metric: "sha256(bundle.tar.gz) == expected_manifest_sha256"
    comparator: eq
    status: ACTIVE
    contract_clause: "Bundle Annexe A § A.4"
    source_bench: "efe-bundle verify --strict --against-baseline"
    note: "Vérifié par 3 runners distincts (= dev local + CI + audit firm)."

  # ────────────────────────────────────────────────────────────
  # Recall multilingue ≥ 0.92
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-RECALL
    description: "recall@1 multilingue vs sentence-transformers Python baseline"
    metric: "recall_at_1 (aggregated FR+EN+DE+ES on eval/golden/multilingual_recall_v1.0.jsonl)"
    comparator: gte
    threshold_ratio: 0.92
    status: ACTIVE
    source_bench: "scripts/bench/bundle_recall_bench.py"
    note: "Validation contre baseline Python ground-truth ; refus de tag si < 0.92."

  # ────────────────────────────────────────────────────────────
  # Parité linguistique max/min ≤ 1.05×
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-LINGUAL
    description: "max(recall_lang) / min(recall_lang) ≤ 1.05× (= parité FR/EN/DE/ES)"
    metric: "max(recall_at_1_per_lang) / min(recall_at_1_per_lang)"
    comparator: lte
    threshold_ratio: 1.05
    status: ACTIVE
    source_bench: "scripts/bench/bundle_recall_bench.py"
    note: "Pin contractuel : aucun marché linguistique n'est dégradé > 5 % vs autre."

  # ────────────────────────────────────────────────────────────
  # Taille .tar.gz ≤ 200 MiB
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-SIZE
    description: ".tar.gz compressed size (= wire format pulled depuis OCI)"
    metric: "stat -c %s bundle.tar.gz"
    comparator: lte
    threshold_bytes: 209715200      # 200 MiB
    status: ACTIVE
    contract_clause: "P2-§3.2 (pull < 30 s)"
    note: "Compatible avec promesse P2 30-min POC + air-gap distribution."

  # ────────────────────────────────────────────────────────────
  # Pre-warm p99 ≤ 50 ms
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-PREWARM
    description: "pre-warm 100 inférences p99 au boot"
    metric: "histogram_quantile(0.99, prewarm_durations)"
    comparator: lte
    threshold_seconds: 0.050
    status: ACTIVE
    source_bench: "efe_bundle_prewarm_p99_seconds (gauge au boot)"
    note: "Permet de prendre traffic dès ready=true sans bias initial."

  # ────────────────────────────────────────────────────────────
  # Latence inférence T4 fp16 p99 ≤ 26 ms (= source SLO-P1-BUDGET-5)
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-INFERENCE-GPU
    description: "ONNX CUDA inference p99 batch=1 seq=128 sur T4 fp16"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_bundle_inference_duration_seconds_bucket{provider="cuda",batch_size_class="1",seq_len_class="128"}[5m])))'
    comparator: lte
    threshold_seconds: 0.026
    status: PENDING_GPU_RUNNER
    contract_clause: "Bundle § 6.4 + SLO-P1-BUDGET-5"
    note: "Activé dès que le runner self-hosted GPU T4 est provisionné (D28+)."

  # ────────────────────────────────────────────────────────────
  # Latence inférence CPU fp32 p99 ≤ 180 ms
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-INFERENCE-CPU
    description: "ONNX CPU inference p99 batch=1 seq=128 sur 4 vCPU"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_bundle_inference_duration_seconds_bucket{provider="cpu",batch_size_class="1",seq_len_class="128"}[5m])))'
    comparator: lte
    threshold_seconds: 0.180
    status: ACTIVE
    contract_clause: "SLO-C-2 (Mode-1 CPU 800 ms ; bundle consomme < 25 %)"
    source_bench: "scripts/bench/bundle_latency_bench.py --provider cpu"

  # ────────────────────────────────────────────────────────────
  # VRAM peak ≤ 1 GiB
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-VRAM
    description: "VRAM peak sur T4 pendant 1 000 inférences sustained"
    metric: "max(nvidia-smi --query-gpu=memory.used)"
    comparator: lte
    threshold_bytes: 1073741824    # 1 GiB
    status: PENDING_GPU_RUNNER
    note: "Mesuré seulement sur GPU runner ; permet de cohabiter avec swarm CUDA kernels (Φ-D)."

  # ────────────────────────────────────────────────────────────
  # Sigstore Rekor entry présente
  # ────────────────────────────────────────────────────────────
  - id: SLO-BUNDLE-REKOR
    description: "Le bundle a une entrée Rekor publique vérifiable"
    metric: "cosign verify-blob --rekor-url https://rekor.sigstore.dev"
    comparator: eq
    status: ACTIVE
    contract_clause: "Bundle § 5.4 threat model"
    note: "Permet la vérification tiers sans dépendance Fournisseur."
