# Sprint **D19 (P1-Foundation)** — Baseline SLO definitions for the
# v0.2.0 release.
#
# Cf. `docs/EFE_P1_SURFACE_ARCHITECTURE.md` § 5.1 (inventaire des
# 17 SLO P1) + Annexe A (liste exhaustive).
#
# ## Status v0.2.0
#
# v0.2.0 livre l'INFRASTRUCTURE P1 (instruments + budget tracker +
# alerts + dashboard) sans GPU réel. Les SLO actifs en v0.2.0 sont :
#
# - SLO-C-2 (Mode-1 CPU 800 ms) → mesuré localement, attesté.
# - SLO-PC-REPRO (5 % drift) → mesuré localement, attesté.
# - SLO-PC-mTLS-INIT (60 ms) → mesuré localement.
# - SLO-P1-BUDGET-1..12 → emis par les instruments, gated dès
#   qu'on a 30 000 échantillons.
# - SLO-P1-TAIL-1 (p99.9 ≤ 400 ms) → idem.
# - SLO-P1-BURN (multi-window) → idem.
#
# Les SLO actifs en v0.2.0 sont **CPU-only** (pas de GPU runner CI).
# SLO-C-1 (GPU 200 ms) reste **PENDING_GPU_RUNNER** jusqu'à Φ-D D28+.
#
# ## Format
#
# Compatible avec `eval/scripts/check_slo.py` étendu pour P1.
# Champs :
#   - id           : identifiant unique du SLO
#   - description  : phrase humaine
#   - metric       : expression PromQL
#   - quantile     : float ∈ [0,1] OU n/a
#   - comparator   : "gte" | "lte"
#   - threshold_ns : seuil (en nanosecondes)
#   - status       : "ACTIVE" | "PENDING_GPU_RUNNER" | "SKIPPED"
#   - source_bench : artifact JSON consommé
#   - host_fingerprint_required : bool

version: "0.2.0"
frozen_at: "PLACEHOLDER_v0.2.0_freeze_date"
git_sha: "PLACEHOLDER_v0.2.0_git_sha"
host_fingerprint_baseline: "PLACEHOLDER_compute_at_freeze"

slos:
  # ────────────────────────────────────────────────────────────
  # Racines (C-* contractuels)
  # ────────────────────────────────────────────────────────────
  - id: SLO-C-1
    description: "Mode-1 GPU p99 latency (200 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_swarm_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 200_000_000
    status: PENDING_GPU_RUNNER
    source_bench: bench_p1_sustained.json
    host_fingerprint_required: true
    note: "Activable dès que le runner GPU T4 est provisionné (Φ-D D28+)."

  - id: SLO-C-2
    description: "Mode-1 CPU p99 latency (800 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_swarm_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 800_000_000
    status: ACTIVE
    source_bench: bench_p1_sustained.json
    host_fingerprint_required: true

  - id: SLO-PC-REPRO
    description: "Reproductibilité 2 mesures consécutives (5 % drift)"
    metric: "abs(p99_run2 - p99_run1) / p99_run1"
    comparator: lte
    threshold_ratio: 0.05
    status: ACTIVE
    source_bench: bench_p1_repro.json

  - id: SLO-PC-mTLS-INIT
    description: "mTLS handshake p99 (60 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(tonic_tls_handshake_duration_seconds_bucket[5m])))'
    comparator: lte
    threshold_ns: 60_000_000
    status: ACTIVE
    source_bench: bench_p1_mtls.json

  # ────────────────────────────────────────────────────────────
  # Budgets par étage (1 à 12)
  # ────────────────────────────────────────────────────────────
  - id: SLO-P1-BUDGET-1
    description: "Étage 1 — TCP recv + TLS framing p99 (1.5 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_grpc_recv_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 1_500_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-2
    description: "Étage 2 — Protobuf decode p99 (0.5 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_grpc_decode_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 500_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-3
    description: "Étage 3 — gRPC interceptors p99 (3 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_interceptor_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 3_000_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-4
    description: "Étage 4 — Tokenization p99 (4 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_embed_tokenize_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 4_000_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-5
    description: "Étage 5 — ONNX CUDA inference p99 (26 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_embed_inference_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 26_000_000
    status: PENDING_GPU_RUNNER
    note: "Bundle MiniLM réel + GPU T4 requis (Φ-C D22+ pour bundle, Φ-D D28+ pour GPU)."

  - id: SLO-P1-BUDGET-6
    description: "Étage 6 — Genesis p99 (5 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_genesis_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 5_000_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-7
    description: "Étage 7 — Fusion 10 rounds p99 (100 ms total ; 10 ms / round)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_fusion_round_duration_seconds_bucket{mode="mode1"}[5m]))) * 10'
    comparator: lte
    threshold_ns: 100_000_000
    status: PENDING_GPU_RUNNER
    note: "Budget CPU = 580 ms (cf. C-2). Cible 100 ms = uniquement avec custom CUDA kernel (Φ-D D28+)."

  - id: SLO-P1-BUDGET-8
    description: "Étage 8 — Consensus p99 (1 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_consensus_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 1_000_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-9
    description: "Étage 9 — Dissolution + Alignment p99 (6 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_dissolution_alignment_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 6_000_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-10
    description: "Étage 10 — Audit chain HMAC append p99 (4 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_audit_chain_append_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 4_000_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-11
    description: "Étage 11 — Protobuf encode p99 (1 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_grpc_encode_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 1_000_000
    status: ACTIVE

  - id: SLO-P1-BUDGET-12
    description: "Étage 12 — TCP send p99 (1 ms)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_grpc_send_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 1_000_000
    status: ACTIVE

  # ────────────────────────────────────────────────────────────
  # Burn + tail
  # ────────────────────────────────────────────────────────────
  - id: SLO-P1-BURN
    description: "Multi-window burn rate (1h / 6h / 24h)"
    metric: "see recording rule efe:p1_burn_rate:*"
    comparator: lte
    thresholds:
      fast_burn_1h: 14.4
      slow_burn_6h: 6.0
      ticket_24h: 1.0
    status: ACTIVE

  - id: SLO-P1-TAIL-1
    description: "Mode-1 p99.9 latency (400 ms)"
    metric: 'histogram_quantile(0.999, sum by (le) (rate(efe_swarm_duration_seconds_bucket{mode="mode1"}[5m])))'
    comparator: lte
    threshold_ns: 400_000_000
    status: ACTIVE
