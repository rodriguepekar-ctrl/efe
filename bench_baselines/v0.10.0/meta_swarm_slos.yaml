# Sprint A1 Phase 1 — efe-meta-swarm bench baselines (PR #4).
#
# Defines 7 opposable SLOs for the hierarchical multi-swarm coordination
# layer.  Consumed by `scripts/ops/consolidate_all_slos.py` (master-gate)
# through the `--baselines bench_baselines/v0.10.0/meta_swarm_slos.yaml`
# argument added to `.github/workflows/ops-master-gate.yml` step
# "Consolidate".
#
# Sources of measurements (sidecar JSON written by the bench itself) :
#   target/criterion/three_swarms_kovant_latency/meta-swarm-extras.json
#       — algorithmic + operational SLOs (iters, residual, determinism,
#         memory, regression).
#   target/criterion/three_swarms_kovant_latency_*/new/estimates.json
#       — standard criterion latency tree (p50, p99, mean, std_dev),
#         parsed by `scripts/parse_criterion_report.py`.
#
# Cf. `docs/EFE_A1_PHASE1_ARCHITECTURE.md`        § 9 (bench targets).
# Cf. `docs/EFE_A1_BENCH_TRACKING.md`             (this PR #4).
# Cf. `crates/efe-meta-swarm/benches/three_swarms_kovant_latency.rs`
#                                                  (bench source code).
# Cf. `crates/efe-meta-swarm/PR4_DESCRIPTION.md`  (this PR description).
#
# Frozen on    : 2026-05-13 (Sprint A1 P1 week 8).
# Frozen host  : ubuntu-22.04 / 4-vCPU / 16 GB RAM / rustc 1.88 / no BLAS.
# Frozen-by    : Sprint A1 P1 release engineer (commit ${COMMIT_SHA}).
#
# The thresholds are calibrated as follows :
#
#   LATENCY-P99 ≤ 100 ms : architectural budget (EFE_A1_PHASE1_ARCH § 9).
#   LATENCY-P50 ≤  30 ms : empirical median (13.5 ms on M3 Pro dev box,
#                          PR #1 measured) × 1.5 CI_COEFFICIENT × 1.5
#                          safety margin ≈ 30 ms.
#   CONVERGENCE-ITERS ≤ 60 : PR #1 three_swarms_kovant example converges
#                           in 47 iters ; 27 % margin for randomness.
#   RESIDUAL-FINAL ≤ 1e-3  : default tolerance of `ConvergenceCriterion`
#                            (iteration/convergence.rs default).
#   DETERMINISM = 1 (pass) : 3 reruns produce bit-identical
#                            (iters, residual_to_bits).
#   NON-REGRESSION ≤ 10 %  : the bench reads `last_p99_observed_ms` from
#                            this file and emits the ratio
#                            (current_p99 / baseline_p99 - 1.0) ; the
#                            release engineer updates this field at
#                            every tag bump.
#   MEMORY-PEAK-MB ≤ 64 MB : 2 × RSS observed during a single iterate()
#                            call on the Kovant scenario (~28 MB).

version: v0.10.0
domain:  a1_meta_swarm

# Host fingerprint of the freeze run. Used by the non-regression SLO to
# warn (not fail) if the current CI host differs significantly from the
# baseline freeze host. PR #4 leaves this as a hint ; cross-host
# normalisation is a Phase 3 follow-up.
host_fingerprint_baseline: "ubuntu-22.04-4cpu-16gb-rustc1.88-noblas"

# Last p99 latency observed at freeze time, expressed in milliseconds.
# The bench reads this value at startup to compute SLO-A1-META-NON-
# REGRESSION = (current_p99_ms / last_p99_observed_ms - 1.0).
# Release engineers MUST update this field whenever they freeze a new
# baseline (cf. docs/EFE_A1_BENCH_TRACKING.md § "Freezing a baseline").
last_p99_observed_ms: 32.1

slos:
  # ─────────────────────────────────────────────────────────────────────
  # NB. Each row carries TWO encodings of the comparator + threshold :
  #
  #   (a) `target` + `operator`         → consumed by
  #       `scripts/ops/consolidate_all_slos.py`  (Sprint Φ-D-OPS).
  #   (b) `comparator` + `threshold_*`  → consumed by
  #       `scripts/check_regression.py` and the per-sprint baseline
  #       readers (Sprint D5 bench infrastructure).
  #
  # The duplication is intentional and pinned by
  # `tests/bench_smoke.rs::baseline_yaml_*_valid` ; alignement of the
  # two parsers is a Sprint A2 follow-up (DT-A2-SLO-PARSER-UNIFY).

  # ─────────────────────────────────────────────────────────────────────
  # Latency SLOs — produced by Criterion, parsed by
  # parse_criterion_report.py + run_suite.sh.
  # ─────────────────────────────────────────────────────────────────────
  - id: SLO-A1-META-LATENCY-P99
    description: "p99 latency of MetaSwarm::iterate() on three_swarms_kovant scenario (in-process, no BLAS)"
    target: 100.0           # ms — consumed by consolidate_all_slos.py
    operator: "<="
    comparator: lte         # consumed by check_regression.py
    threshold_ms: 100.0
    source_bench: three_swarms_kovant_latency
    severity: critical
    owner: meta-swarm-team
    deferred_ticket: DT-A1-META-SOFT-LAUNCH-3-RUNS

  - id: SLO-A1-META-LATENCY-P50
    description: "median latency of MetaSwarm::iterate() on three_swarms_kovant scenario"
    target: 30.0
    operator: "<="
    comparator: lte
    threshold_ms: 30.0
    source_bench: three_swarms_kovant_latency
    severity: major
    owner: meta-swarm-team
    deferred_ticket: DT-A1-META-SOFT-LAUNCH-3-RUNS

  # ─────────────────────────────────────────────────────────────────────
  # Algorithmic SLOs — produced by the bench Rust code itself,
  # emitted to meta-swarm-extras.json sidecar.
  # ─────────────────────────────────────────────────────────────────────
  - id: SLO-A1-META-CONVERGENCE-ITERS
    description: "iterations needed for joint residual to drop below tolerance (1e-3) on three_swarms_kovant"
    target: 60
    operator: "<="
    comparator: lte
    threshold_count: 60
    source_bench: three_swarms_kovant_iters
    severity: major
    owner: meta-swarm-team
    deferred_ticket: DT-A1-META-SOFT-LAUNCH-3-RUNS

  - id: SLO-A1-META-RESIDUAL-FINAL
    description: "joint residual at convergence (√Σm‖x_new - x_old‖²) on three_swarms_kovant"
    target: 0.001
    operator: "<="
    comparator: lte
    threshold_ratio: 0.001
    source_bench: three_swarms_kovant_residual
    severity: major
    owner: meta-swarm-team
    deferred_ticket: DT-A1-META-SOFT-LAUNCH-3-RUNS

  - id: SLO-A1-META-DETERMINISM
    description: "3 reruns produce bit-identical (iters, residual_to_bits) tuples"
    target: 1
    operator: "=="
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: three_swarms_kovant_determinism
    severity: critical
    owner: meta-swarm-team
    deferred_ticket: DT-A1-META-SOFT-LAUNCH-3-RUNS

  # ─────────────────────────────────────────────────────────────────────
  # Operational SLOs — emitted to meta-swarm-extras.json sidecar.
  # ─────────────────────────────────────────────────────────────────────
  - id: SLO-A1-META-NON-REGRESSION
    description: "p99 regression vs frozen baseline last_p99_observed_ms must stay ≤ 10 %"
    target: 0.10
    operator: "<="
    comparator: lte
    threshold_ratio: 0.10
    source_bench: three_swarms_kovant_regression
    severity: major
    owner: meta-swarm-team
    deferred_ticket: DT-A1-META-SOFT-LAUNCH-3-RUNS

  - id: SLO-A1-META-MEMORY-PEAK-MB
    description: "peak resident memory during MetaSwarm::iterate() on three_swarms_kovant"
    target: 64.0
    operator: "<="
    comparator: lte
    threshold_mb: 64.0
    source_bench: three_swarms_kovant_memory
    severity: watch
    owner: meta-swarm-team
    deferred_ticket: DT-A1-META-SOFT-LAUNCH-3-RUNS
