    description: "Mode-1 GPU p99 latency"
    comparator: lte
    threshold_seconds: 0.200
    status: ACTIVE
    source_bench: p1_gpu_sustained_bench
    host_fingerprint_required: true

  - id: SLO-P1-BUDGET-5
    description: "Kernel dissolution GPU p99"
