# Sprint **Φ-D-AL Completion (D75-D79)** — Active Learning SLO baselines.
# Cf. `docs/EFE_ACTIVE_LEARNING_COMPLETION_ARCHITECTURE.md` § 15.

version: v0.6.0
domain: active_learning
host_fingerprint_baseline: "PLACEHOLDER_compute_at_freeze"

slos:
  - id: SLO-AL-RECALL-IMPROVEMENT
    description: "Aggregate recall@1 improvement per retune ≥ +1 %"
    comparator: gte
    threshold_ratio: 0.01
    source_bench: recall_improvement_bench

  - id: SLO-AL-UNCERTAINTY-COVERAGE
    description: "100 % of production calls have uncertainty_score"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: uncertainty_replay

  - id: SLO-AL-GDPR-CONSENT-COVERAGE
    description: "100 % of gold labels have consent traced"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: gdpr_consent_replay

  - id: SLO-AL-CANARY-DURATION
    description: "Canary phase ≥ 24 hours before promotion"
    comparator: gte
    threshold_seconds: 86400.0
    source_bench: canary_duration_audit

  - id: SLO-AL-AUDIT-CHAIN-INTEGRITY
    description: "HMAC chain replay validates all labels + retunes"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: chain_replay

  - id: SLO-AL-PROMOTION-AUTO-ROLLBACK
    description: "Auto-rollback fires on injected regression"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: auto_rollback_injection

  - id: SLO-AL-COST-PER-LABEL
    description: "p99 cost per gold label (USD)"
    comparator: lte
    threshold_ratio: 0.01
    source_bench: cost_tracker

  - id: SLO-AL-CONCEPT-DRIFT
    description: "Drift detector fires on injected drift corpus"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: drift_detector

  - id: SLO-AL-GOLD-QUEUE-SIZE
    description: "Gold queue size bounded ≤ 10 000"
    comparator: lte
    threshold_count: 10000
    source_bench: queue_monitor

  - id: SLO-AL-LLM-LABELING-LATENCY-P99
    description: "p99 LLM oracle labeling latency (seconds)"
    comparator: lte
    threshold_seconds: 30.0
    source_bench: llm_worker_bench

  - id: SLO-AL-HUMAN-REVIEW-LATENCY-P99
    description: "p99 human review latency (seconds)"
    comparator: lte
    threshold_seconds: 330.0
    source_bench: review_tracker

  - id: SLO-AL-AUTO-CONFIRM-COVERAGE
    description: "Auto-confirm rate on eligible items ≥ 60 %"
    comparator: gte
    threshold_ratio: 0.60
    source_bench: auto_confirm_stats

  - id: SLO-AL-CENTROID-UPDATE-FREQUENCY
    description: "Daily retune cycle completed"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: retune_cron_audit

  - id: SLO-AL-TENANT-ISOLATION
    description: "Adversarial cross-tenant test : 0 leak"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: isolation_test

  - id: SLO-AL-HOLDOUT-SPLIT-INTEGRITY
    description: "Holdout split has 0 % overlap with training labels"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: holdout_integrity

  - id: SLO-AL-LABEL-DRIFT-DETECTION
    description: "Per-label proportion drift detector fires correctly"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: label_drift_test

  - id: SLO-AL-RETUNE-LATENCY
    description: "Retune cycle p99 latency (seconds)"
    comparator: lte
    threshold_seconds: 3600.0
    source_bench: retune_latency

  - id: SLO-AL-REPLAY
    description: "Deterministic replay of label + retune chains"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: deterministic_replay
