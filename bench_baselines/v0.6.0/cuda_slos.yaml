# Sprint **Φ-D D30 (Bundle completion)** — Baseline SLO Φ-D pour
# la GA v0.6.0.
#
# Cf. `docs/EFE_CUDA_KERNELS_COMPLETION_ARCHITECTURE.md` § 13 + Annexe A.
#
# ## Status v0.6.0
#
# Le bundle MiniLM-L12-v2 (Φ-C) + 12 kernels CUDA custom (Φ-D)
# cible la GA v0.6.0 EFE. Les 6 SLO Φ-D sont **tous ACTIVE** —
# la GA v0.6.0 n'est pas signable sans qu'ils soient tous PASS.
#
# Au-delà : 4 SLO supplémentaires hérités du bundle Φ-C
# (`SLO-BUNDLE-INFERENCE-GPU/CPU`, `SLO-BUNDLE-VRAM`,
# `SLO-BUNDLE-PREWARM`) sont activés post-Φ-D dès que les
# benches CUDA produisent un report mesurable.

version: "0.6.0"
frozen_at: "PLACEHOLDER_v0.6.0_freeze_date"
git_sha: "PLACEHOLDER_v0.6.0_git_sha"
host_fingerprint_baseline: "PLACEHOLDER_compute_at_freeze_with_GpuFingerprint"
gpu_baseline_model: "NVIDIA T4"
gpu_baseline_compute_cap: "7.5"
expected_efe_kernels_cuda_sha256: "PLACEHOLDER_compute_at_build"

slos:
  # ────────────────────────────────────────────────────────────
  # 1. Fusion round p99 ≤ 10 ms (= source de SLO-P1-BUDGET-7 / 10)
  # ────────────────────────────────────────────────────────────
  - id: SLO-CUDA-FUSION-ROUND
    description: "p99 swarm fusion round (T4 fp16 N=128 D=384)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_gpu_kernel_duration_seconds_bucket{kernel="fusion_round"}[5m])))'
    quantile: 0.99
    comparator: lte
    threshold_seconds: 0.010
    status: ACTIVE
    source_bench: "crates/efe-kernels/benches/e2e_fusion_round_bench.rs"
    contract_clause: "P1-§3.1 (SLO-C-1 via étage 7)"
    host_fingerprint_required: true

  # ────────────────────────────────────────────────────────────
  # 2. Fusion totale 10 rounds ≤ 100 ms (= source SLO-P1-BUDGET-7)
  # ────────────────────────────────────────────────────────────
  - id: SLO-CUDA-FUSION-TOTAL
    description: "p99 swarm fusion 10 rounds total (T4 fp16)"
    metric: 'histogram_quantile(0.99, sum by (le) (rate(efe_p1_fusion_round_duration_seconds_bucket{mode="mode1"}[5m]))) * 10'
    quantile: 0.99
    comparator: lte
    threshold_seconds: 0.100
    status: ACTIVE
    contract_clause: "P1-§3.1 (SLO-C-1 directement)"
    host_fingerprint_required: true

  # ────────────────────────────────────────────────────────────
  # 3. Speedup CUDA vs CPU MVP ≥ 5×
  # ────────────────────────────────────────────────────────────
  - id: SLO-CUDA-SPEEDUP-CPU
    description: "Speedup CudaBackend vs CpuBackend (= fusion E2E)"
    metric: "ratio of bench medians : cpu / cuda"
    comparator: gte
    threshold_ratio: 5.0
    status: ACTIVE
    source_bench: "crates/efe-kernels/benches/fusion_cpu_vs_gpu.rs"
    contract_clause: "Φ-D § 4.1 (= justification commerciale 5-10×)"
    note: "Si < 2×, pivot vers ONNX CUDA EP générique (= plan B doc § 17 risque #1)."

  # ────────────────────────────────────────────────────────────
  # 4. Numerical equivalence rtol fp16 ≤ 1e-3 sur 12 kernels
  # ────────────────────────────────────────────────────────────
  - id: SLO-CUDA-NUMERICAL
    description: "Max rtol cross-arch sur 12 kernels fp16 vs CpuBackend"
    metric: "max rtol from tests/numerical_equivalence.rs report"
    comparator: lte
    threshold_ratio: 1.0e-3
    status: ACTIVE
    source_bench: "crates/efe-kernels/tests/numerical_equivalence.rs"
    contract_clause: "Φ-D § 8 + P3 audit chain (= reproductibility GPU↔CPU)"
    note: "Réfute systématiquement si un kernel mismatch entre archs."

  # ────────────────────────────────────────────────────────────
  # 5. Multi-GPU 4× T4 speedup ≥ 3× sur N=1024
  # ────────────────────────────────────────────────────────────
  - id: SLO-CUDA-MULTI-GPU-SPEEDUP
    description: "Speedup 4× T4 (NCCL all-reduce) vs 1× T4 sur swarm N=1024"
    metric: "ratio bench(4-GPU) / bench(1-GPU) sur swarm size 1024"
    comparator: gte
    threshold_ratio: 3.0
    status: PENDING_MULTI_GPU_RUNNER
    contract_clause: "GG-Φ-D.3 (doc Φ-D § 1.2)"
    note: "PENDING jusqu'à provisioning du runner self-hosted 4× T4 ; activable D31+."

  # ────────────────────────────────────────────────────────────
  # 6. Soak 24h sur 200 RPS sustained Mode-1 — RSS drift ≤ 10 MiB/h
  # ────────────────────────────────────────────────────────────
  - id: SLO-CUDA-SOAK-24H
    description: "RSS drift sur 24h soak Mode-1 200 RPS T4"
    metric: "slope OLS(RSS bytes, time hours) over 24h window"
    comparator: lte
    threshold_bytes_per_hour: 10485760    # = 10 MiB/h
    status: ACTIVE
    source_bench: "deploy/load-tests/gpu/soak_24h.yaml + scripts/bench/analyze_soak.py"
    contract_clause: "GG-Φ-D.5 (= 24h soak GPU sans memleak)"
    note: "Run nightly une fois par semaine ; alerte si drift > seuil 3 nuits consécutives."

  # ────────────────────────────────────────────────────────────
  # Bonus opérationnels (= non gating GA mais surveillés)
  # ────────────────────────────────────────────────────────────
  - id: SLO-CUDA-SM-OCCUPANCY
    description: "SM occupancy ratio steady-state 200 RPS"
    metric: 'avg_over_time(efe_gpu_sm_occupancy_ratio[10m])'
    comparator: gte
    threshold_ratio: 0.40
    status: ACTIVE
    note: "Sous-utilisation < 0.20 = over-provisioned ; alerte ops."

  - id: SLO-CUDA-OOM-RATE
    description: "GPU OOM events par hour < 1 (= circuit breaker fonctionne)"
    metric: 'sum(rate(efe_gpu_oom_total[1h])) * 3600'
    comparator: lte
    threshold_count: 1
    status: ACTIVE
    note: "OOM frequent = mauvaise calibration arena ou batch coalescing trop large."

  - id: SLO-CUDA-KERNEL-FAILURE-RATE
    description: "Kernel call failures < 0.01 % du trafic"
    metric: |
      sum(rate(efe_gpu_kernel_calls_total{outcome="fail"}[5m]))
        / sum(rate(efe_gpu_kernel_calls_total[5m]))
    comparator: lte
    threshold_ratio: 0.0001
    status: ACTIVE
    note: "Failure rate > 0.01 % indique driver instability ou GPU heat throttling."
