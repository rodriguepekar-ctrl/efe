# Sprint **Φ-C-FFI Completion (D26-D28)** — PyO3 FFI SLO baselines.
#
# Cf. `docs/EFE_PYO3_FFI_COMPLETION_ARCHITECTURE.md` § 5.
#
# Consommé par `eval/scripts/check_slo.py`. Aucun champ ici ne doit
# rester sans branche d'évaluation dans le parser, sinon il serait
# silencieusement skippé (= pattern Φ-D.A1 + Φ-D.B3b).
#
# Freeze : 2026-05-13.

version: v0.6.0
domain: ffi
description: |
  EFE PyO3 FFI SLO baselines — Φ-C-FFI freeze 2026-05-13.
  Couvre les 15 promesses contractuelles F-1..F-15 de
  `EFE_FFI_ARCHITECTURE.md` § 4.1, transformées en gates CI
  exécutables.

# host_fingerprint_baseline = computed at freeze via :
#   `python scripts/bench/freeze_ffi_attestation.py --emit-fingerprint`
# Le prefix PLACEHOLDER_* est accepté par check_slo.py (= audit fix
# Φ-D.B3b → `fingerprint.startswith("PLACEHOLDER_")` → None).
host_fingerprint_baseline: "PLACEHOLDER_compute_at_freeze"

slos:
  # ────────────────────────────────────────────────────────────────
  # Latency surface (3 SLOs)
  # ────────────────────────────────────────────────────────────────
  - id: SLO-FFI-LATENCY-P99
    description: "p99 latency of efe.classify_zero_copy() in seconds (CPU-only)"
    comparator: lte
    threshold_seconds: 0.040
    source_bench: native_vs_grpc
    host_fingerprint_required: false
    note: "F-2 (= ≤ 40 ms p99 CPU). Mesuré par `tests/bench/native_vs_grpc.py`."

  - id: SLO-FFI-SPEEDUP
    description: "Speedup ratio (gRPC p99 / native p99)"
    comparator: gte
    threshold_ratio: 5.0
    source_bench: native_vs_grpc
    host_fingerprint_required: false
    note: "F-2 (= 5× speedup p99). Skipped si efe_tool absent."

  - id: SLO-FFI-COLD-START
    description: "p95 import efe + version() in seconds"
    comparator: lte
    threshold_seconds: 0.100
    source_bench: cold_start
    host_fingerprint_required: false
    note: "F-6 (= ≤ 100 ms cold start)."

  # ────────────────────────────────────────────────────────────────
  # Correctness surface (2 SLOs) — utilise threshold_pass_count
  # (= nouveau field Φ-C-FFI ; check_slo.py étendu en conséquence).
  # ────────────────────────────────────────────────────────────────
  - id: SLO-FFI-EQUIVALENCE
    description: "Verdict bit-identical vs gRPC over 100 fixtures"
    comparator: eq
    threshold_pass_count: 100
    expected_count: 100
    source_bench: numerical_equiv
    host_fingerprint_required: false
    note: "F-7 (= 100/100 numerical equivalence)."

  - id: SLO-FFI-DETERMINISM
    description: "100 runs with (text, seed) fixed → all identical"
    comparator: eq
    threshold_pass_count: 100
    expected_count: 100
    source_bench: determinism
    host_fingerprint_required: false
    note: "F-12 (= determinism cross-runner)."

  # ────────────────────────────────────────────────────────────────
  # Resource surface (3 SLOs)
  # ────────────────────────────────────────────────────────────────
  - id: SLO-FFI-WHEEL-SIZE
    description: "Max wheel size compressed in bytes (per wheel)"
    comparator: lte
    threshold_bytes: 8388608  # 8 MiB
    source_bench: wheel_size
    host_fingerprint_required: false
    note: "F-3 (= ≤ 8 MiB wheel)."

  - id: SLO-FFI-MEMORY-DRIFT
    description: "RSS drift after 10 000 classify (ratio, 0.05 = 5 %)"
    comparator: lte
    threshold_ratio: 0.05
    source_bench: memory_leak
    host_fingerprint_required: false
    note: "F-9 (= no memory leak)."

  - id: SLO-FFI-GIL-RELEASED
    description: "Speedup with 4 threads (proxy for GIL released ratio ≥ 0.95)"
    comparator: gte
    threshold_ratio: 3.0
    source_bench: gil_release
    host_fingerprint_required: false
    note: "F-8 (= GIL released ≥ 95 %). 4-thread speedup proxy."

  # ────────────────────────────────────────────────────────────────
  # Build surface (4 SLOs)
  # ────────────────────────────────────────────────────────────────
  - id: SLO-FFI-WHEEL-COUNT
    description: "Number of wheels produced per release"
    comparator: gte
    threshold_count: 5
    source_bench: publish
    host_fingerprint_required: false
    note: "F-5 (= 5 wheels per release)."

  - id: SLO-FFI-ABI3
    description: "ABI3 strict — zero blacklisted symbols across all wheels"
    comparator: eq
    threshold_count: 0
    source_bench: abi3
    host_fingerprint_required: false
    note: "F-4 (= abi3 wheels)."

  - id: SLO-FFI-SBOM
    description: "SBOM CycloneDX present and schema-valid"
    comparator: gte
    threshold_count: 1
    source_bench: publish
    host_fingerprint_required: false
    note: "Compliance — SBOM artifact."

  - id: SLO-FFI-SIGSTORE
    description: "Sigstore signature + cert per wheel"
    comparator: gte
    threshold_count: 5
    source_bench: publish
    host_fingerprint_required: false
    note: "Compliance — signed artifacts (5 wheels)."

  # ────────────────────────────────────────────────────────────────
  # DX surface (3 SLOs)
  # ────────────────────────────────────────────────────────────────
  - id: SLO-FFI-STUB-SYNC
    description: ".pyi stub file matches Rust API surface"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: stub_sync
    host_fingerprint_required: false
    note: "F-15 (= stub files)."

  - id: SLO-FFI-CROSS-PY
    description: "Wheel loads on Python 3.10, 3.11, 3.12, 3.13"
    comparator: eq
    threshold_pass_count: 4
    expected_count: 4
    source_bench: cross_py
    host_fingerprint_required: false
    note: "F-4 (= 3.10-3.13 coverage)."

  - id: SLO-FFI-DROPIN
    description: "EfeNativeClient produces same verdict as EfeClient gRPC"
    comparator: eq
    threshold_pass_count: 1
    expected_count: 1
    source_bench: dropin
    host_fingerprint_required: false
    note: "Migration — drop-in helper."
