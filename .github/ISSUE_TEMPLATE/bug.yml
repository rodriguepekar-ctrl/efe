name: Bug Report
description: Report a reproducible bug
title: "[bug] "
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug briefly.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - M1 Core Runtime
        - M2 Memory Pool
        - M3 Genesis
        - M4 ELS
        - M5 Fusion
        - M6 Consensus
        - M7 Dissolution
        - M8 Templates
        - M9 Alignment
        - M10 API
        - M11 Telemetry
        - M12 Build/Deploy
        - Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: efe version or git sha
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust, Python, CUDA, GPU model
      value: |
        OS:
        Rust:
        Python:
        CUDA:
        GPU:
