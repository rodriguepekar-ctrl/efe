name: load-test

on:
  schedule:
    - cron: "0 2 * * *"          # every night at 02:00 UTC
  workflow_dispatch:

jobs:
  k6-staging:
    name: k6 classify (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run classify scenario
        env:
          EFE_HTTP_URL: ${{ secrets.EFE_STAGING_URL }}
          EFE_TOKEN: ${{ secrets.EFE_STAGING_QA_TOKEN }}
          EFE_TENANT: qa-team
          EFE_CATALOG: support_triage
        run: |
          k6 run --out json=results.json deploy/load-tests/k6/classify.js
      - uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: results.json
          retention-days: 30


  soak-weekly:
    name: k6 soak (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 260
    if: github.event.schedule == '0 2 * * 6'    # saturday night only
    steps:
      - uses: actions/checkout@v4
      - name: Install k6 (with keyring — reuses main job's setup)
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: 4-hour soak
        env:
          EFE_HTTP_URL: ${{ secrets.EFE_STAGING_URL }}
          EFE_TOKEN: ${{ secrets.EFE_STAGING_QA_TOKEN }}
          EFE_TENANT: qa-team
        run: k6 run --out json=soak.json deploy/load-tests/k6/soak.js
      - uses: actions/upload-artifact@v4
        with:
          name: soak-${{ github.run_id }}
          path: soak.json
          retention-days: 90
