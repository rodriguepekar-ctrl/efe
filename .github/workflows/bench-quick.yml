# PR #21 § 14.1 — bench-quick : runs S01 + S04 + S10 (~ 1 h).
# Triggered by PR label `bench` ; gates merge if any verdict=fail.

name: bench-quick

on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]

concurrency:
  group: bench-quick-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  bench-quick:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: helm/kind-action@v1
        with:
          cluster_name: bench-quick
          version: 'v0.24.0'

      # PR #21 § 14 — G1/G2 closure : harness has to talk to a real
      # controller.  We install the meta-swarm chart into the kind
      # cluster, wait for ready, then port-forward the controller to
      # localhost:50051 (the runner is NOT a node ⇒ in-cluster DNS
      # is unreachable from the runner host).
      - name: Install efe-meta-swarm chart
        run: |
          set -eo pipefail
          helm repo add efe https://efe.github.io/charts || true
          helm repo update
          helm install efe-meta-swarm efe/efe-meta-swarm \
              --namespace efe --create-namespace \
              --set image.tag=${{ github.sha }} \
              --set serviceMonitor.enabled=false \
              --wait --timeout 5m
          kubectl wait --for=condition=ready pod \
              -l app.kubernetes.io/name=efe-meta-swarm-controller \
              -n efe --timeout=180s

      - name: Port-forward controller
        run: |
          set -eo pipefail
          kubectl port-forward -n efe svc/efe-meta-swarm-controller \
              50051:50051 > /tmp/pf.log 2>&1 &
          echo $! > /tmp/pf.pid
          # Wait for the listener to be reachable.
          for i in $(seq 1 30) ; do
            nc -zv localhost 50051 2>/dev/null && exit 0
            sleep 1
          done
          echo "port-forward did not come up in 30s — log:"
          cat /tmp/pf.log
          exit 1

      - name: Build harness
        run: cargo build --release -p efe-bench-harness

      - name: Run bench-quick (S01 + S04 + S10)
        run: |
          set -o pipefail
          ./target/release/efe-bench-harness run \
              --scenario S01_baseline_100qps_5min \
              --scenario S04_chaos_participant_loss \
              --scenario S10_slo_validation_30min \
              --provisioner external \
              --kubeconfig "$HOME/.kube/config" \
              --target-override grpc://localhost:50051 \
              --pr-comment-file /tmp/pr-comment.md \
              --verdict-json-file /tmp/verdict.json

      - name: Stop port-forward
        if: always()
        run: |
          [ -f /tmp/pf.pid ] && kill "$(cat /tmp/pf.pid)" || true

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('/tmp/pr-comment.md')) {
              const body = fs.readFileSync('/tmp/pr-comment.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Upload result artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-quick-results-${{ github.run_id }}
          path: |
            bench/results/
            /tmp/pr-comment.md
            /tmp/verdict.json
          retention-days: 14
