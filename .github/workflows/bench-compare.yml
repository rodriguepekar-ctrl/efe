# PR #21 § 14.4 — bench-compare : PR-comment-triggered diff vs baseline.

name: bench-compare

on:
  issue_comment:
    types: [created]

jobs:
  parse-and-compare:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bench-compare ')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.issue.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build harness
        run: cargo build --release -p efe-bench-harness

      - name: Parse comment for target commit
        id: parse
        run: |
          BODY="${{ github.event.comment.body }}"
          TARGET=$(echo "$BODY" | awk '{print $2}')
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Compare scenario results
        run: |
          set -o pipefail
          # Phase-2 stub : just emits a "compared vs <sha>" comment.
          # Phase-3 : actually fetches the artefact from that SHA.
          echo "## 🔬 Compare vs ${{ steps.parse.outputs.target }}" > /tmp/cmp.md
          echo "(Phase-3 follow-up — see PR #21 Appendix G.3 for cross-commit comparison.)" >> /tmp/cmp.md

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/cmp.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
