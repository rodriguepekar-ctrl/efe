# Sprint M13 D27 (Φ-C) — Bundle release auto-bundling pipeline.
#
# Cf. docs/EFE_BUNDLES_EXTENSION_ARCHITECTURE.md §6 + §14 + §23.
#
# Triggered on tags `bundle-v*.*.*` (release) + workflow_dispatch
# (manual). Builds + signs + SBOMs + publishes a bundle to
# `oci://${REGISTRY}/bundles/<slug>:<version>`.
#
# 9 jobs orchestrated :
#   1. setup           — parse inputs + validate hf_revision
#   2. build-1         — first reproducibility build
#   3. build-2         — second reproducibility build (parallel)
#   4. verify-repro    — compare manifest SHA-256 across the 2 builds
#   5. sign            — Ed25519 signature with KMS-loaded privkey
#   6. sbom            — CycloneDX 1.5 ML-BOM generation + validate
#   7. license-gate    — refuses FORBIDDEN / RESTRICTED-without-ack
#   8. publish         — `oras push` to OCI registry (private/public)
#   9. verify-pull     — pull just-published artifact + verify integrity
#  10. notify          — Slack on completion (success/failure)
#
# Required GitHub Secrets :
#   - GITHUB_TOKEN                 (auto-provided)
#   - EFE_BUNDLE_PRIVKEY_PEM       (Ed25519 PEM, set per `gh secret set`)
#   - SLACK_WEBHOOK                (optional, for notifications)

name: bundle-release

on:
  push:
    tags:
      - "bundle-v*.*.*"
  workflow_dispatch:
    inputs:
      bundle_slug:
        description: "Bundle slug (e.g., all-MiniLM-L6-v2-en-1.0.0)"
        required: true
        type: string
      bundle_version:
        description: "Semver version (e.g., 1.0.0)"
        required: true
        type: string
      hf_revision:
        description: "Pinned HF revision SHA (40 chars hex) — never `main`"
        required: true
        type: string
      mode:
        description: "private (pre-GA) | public (D40 GA, requires v1.x.x)"
        required: false
        default: "private"
        type: choice
        options: [private, public]

env:
  REGISTRY_PRIVATE: "ghcr.io/efe-project/bundles-private"
  REGISTRY_PUBLIC: "registry.efe.ai/bundles"
  ORAS_VERSION: "1.0.0"
  COSIGN_VERSION: "v2.2.0"
  PYTHON_VERSION: "3.12"
  ONNXRUNTIME_VERSION: "1.16.3"
  CYCLONEDX_CLI_VERSION: "v0.25.0"

# Audit fix M12-A8 pattern reused : never cancel an in-flight bundle
# release (would leave OCI in inconsistent state).
concurrency:
  group: bundle-release-${{ github.event.inputs.bundle_slug || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read           # checkout + git log
  packages: write          # oras push to GHCR
  id-token: write          # OIDC for cosign keyless (future Q-M13-3)
  attestations: write      # GitHub artifact attestations API

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Setup + parse inputs
  # ──────────────────────────────────────────────────────────────
  setup:
    name: Setup + parse inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      bundle_name: ${{ steps.parse.outputs.bundle_name }}
      bundle_slug: ${{ steps.parse.outputs.bundle_slug }}
      bundle_version: ${{ steps.parse.outputs.bundle_version }}
      hf_revision: ${{ steps.parse.outputs.hf_revision }}
      registry: ${{ steps.parse.outputs.registry }}
      git_sha: ${{ steps.parse.outputs.git_sha }}
      source_date_epoch: ${{ steps.parse.outputs.source_date_epoch }}
      mode: ${{ steps.parse.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Parse inputs + validate hf_revision
        id: parse
        run: |
          set -euo pipefail
          # Audit fix M13-A3 (HIGH) — pre-fix the slug parsing blindly
          # appended `-${BUNDLE_VERSION}` to `inputs.bundle_slug`,
          # producing `name-1.0.0-1.0.0` when the user already provided
          # the with-version slug. Post-fix : we detect & strip a
          # trailing `-X.Y.Z` from the input before re-appending.
          #
          # Audit fix M13-A2 (HIGH) — pre-fix the OCI tag was
          # `<slug-with-version>:<version>` (redundant). Post-fix the
          # OCI tag uses canonical `<name>:<version>` per arch doc §3.3.

          if [[ "${GITHUB_REF}" =~ refs/tags/bundle-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            BUNDLE_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            BUNDLE_NAME_INPUT="${{ inputs.bundle_slug || 'all-MiniLM-L6-v2-en' }}"
            HF_REVISION="${{ inputs.hf_revision }}"
          else
            BUNDLE_NAME_INPUT="${{ inputs.bundle_slug }}"
            BUNDLE_VERSION="${{ inputs.bundle_version }}"
            HF_REVISION="${{ inputs.hf_revision }}"
          fi

          # Strip trailing -X.Y.Z if user provided slug with version.
          # bundle_name = canonical OCI name (without version)
          # bundle_slug = filesystem dir name (with version)
          if [[ "${BUNDLE_NAME_INPUT}" =~ ^(.+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BUNDLE_NAME="${BASH_REMATCH[1]}"
            INPUT_VERSION_PART="${BASH_REMATCH[2]}"
            # Sanity-check : if input version ≠ declared version, that's user error.
            if [[ "${INPUT_VERSION_PART}" != "${BUNDLE_VERSION}" ]]; then
              echo "::error::M13-A3 : bundle_slug version (${INPUT_VERSION_PART}) ≠ bundle_version (${BUNDLE_VERSION})"
              exit 1
            fi
          else
            BUNDLE_NAME="${BUNDLE_NAME_INPUT}"
          fi
          BUNDLE_SLUG="${BUNDLE_NAME}-${BUNDLE_VERSION}"

          MODE="${{ inputs.mode || 'private' }}"
          # GA gate : public mode requires bundle v1.x.x
          if [[ "${MODE}" == "public" ]]; then
            if ! [[ "${BUNDLE_VERSION}" =~ ^1\. ]]; then
              echo "::error::public mode requires bundle v1.x.x ; got ${BUNDLE_VERSION}"
              exit 1
            fi
            REGISTRY="${REGISTRY_PUBLIC}"
          else
            REGISTRY="${REGISTRY_PRIVATE}"
          fi
          # T-M13-7 : refuse `main` ; require 40-char hex SHA
          if [[ "${HF_REVISION}" == "main" || "${HF_REVISION}" == "master" ]]; then
            echo "::error::T_M13_7 : hf_revision must be a pinned SHA, never a branch name (got ${HF_REVISION})"
            exit 1
          fi
          if ! [[ "${HF_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::hf_revision must be 40-char hex SHA, got: ${HF_REVISION}"
            exit 1
          fi
          GIT_SHA=$(git rev-parse HEAD)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          {
            echo "bundle_name=${BUNDLE_NAME}"
            echo "bundle_slug=${BUNDLE_SLUG}"
            echo "bundle_version=${BUNDLE_VERSION}"
            echo "hf_revision=${HF_REVISION}"
            echo "registry=${REGISTRY}"
            echo "git_sha=${GIT_SHA}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "mode=${MODE}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Bundle release config :"
          echo "  name=${BUNDLE_NAME} (canonical OCI name)"
          echo "  slug=${BUNDLE_SLUG} (filesystem dir name)"
          echo "  version=${BUNDLE_VERSION}"
          echo "  hf_revision=${HF_REVISION}"
          echo "  mode=${MODE}"
          echo "  registry=${REGISTRY}"

  # ──────────────────────────────────────────────────────────────
  # Job 2-3 — Reproducibility builds (parallel, build twice)
  # ──────────────────────────────────────────────────────────────
  build-1:
    name: Build (run 1 / reproducibility)
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install build deps
        run: |
          pip install \
              "onnxruntime==${{ env.ONNXRUNTIME_VERSION }}" \
              "huggingface_hub>=0.20" \
              "transformers>=4.35" \
              "sentence-transformers>=2.2" \
              "onnx>=1.15" \
              "cryptography>=42" \
              "pyyaml" \
              "jsonschema"
      - name: Build (run 1)
        env:
          SOURCE_DATE_EPOCH: ${{ needs.setup.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          rm -rf "_build1/"
          mkdir -p "_build1/"
          python3 scripts/release/build_real_bundle.py \
              --out "_build1/${{ needs.setup.outputs.bundle_slug }}" \
              --slug "${{ needs.setup.outputs.bundle_slug }}" \
              --hf-revision "${{ needs.setup.outputs.hf_revision }}" \
              --ci-mode \
              --git-sha "${{ needs.setup.outputs.git_sha }}" \
              --builder-uri "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Manifest SHA-256 will be the reproducibility check anchor
          sha256sum "_build1/${{ needs.setup.outputs.bundle_slug }}/manifest.json" \
              | awk '{print $1}' > "_build1.manifest.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: build-1
          path: _build1/
          retention-days: 7
          if-no-files-found: error

  build-2:
    name: Build (run 2 / reproducibility)
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install build deps
        run: |
          pip install \
              "onnxruntime==${{ env.ONNXRUNTIME_VERSION }}" \
              "huggingface_hub>=0.20" \
              "transformers>=4.35" \
              "sentence-transformers>=2.2" \
              "onnx>=1.15" \
              "cryptography>=42" \
              "pyyaml" \
              "jsonschema"
      - name: Build (run 2)
        env:
          SOURCE_DATE_EPOCH: ${{ needs.setup.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          rm -rf "_build2/"
          mkdir -p "_build2/"
          python3 scripts/release/build_real_bundle.py \
              --out "_build2/${{ needs.setup.outputs.bundle_slug }}" \
              --slug "${{ needs.setup.outputs.bundle_slug }}" \
              --hf-revision "${{ needs.setup.outputs.hf_revision }}" \
              --ci-mode \
              --git-sha "${{ needs.setup.outputs.git_sha }}" \
              --builder-uri "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          sha256sum "_build2/${{ needs.setup.outputs.bundle_slug }}/manifest.json" \
              | awk '{print $1}' > "_build2.manifest.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: build-2
          path: _build2/
          retention-days: 7
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────
  # Job 4 — Reproducibility verification (M13-O-D27-2 gate)
  # ──────────────────────────────────────────────────────────────
  verify-repro:
    name: Verify reproducibility
    needs: [setup, build-1, build-2]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      manifest_sha256: ${{ steps.compare.outputs.manifest_sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: build-1, path: _build1/ }
      - uses: actions/download-artifact@v4
        with: { name: build-2, path: _build2/ }
      - name: Compare manifests
        id: compare
        run: |
          set -euo pipefail
          SLUG="${{ needs.setup.outputs.bundle_slug }}"
          SHA1=$(sha256sum "_build1/${SLUG}/manifest.json" | awk '{print $1}')
          SHA2=$(sha256sum "_build2/${SLUG}/manifest.json" | awk '{print $1}')
          if [ "${SHA1}" != "${SHA2}" ]; then
            echo "::error::REPRODUCIBILITY_FAIL :: build1=${SHA1}, build2=${SHA2}"
            diff -ru "_build1/${SLUG}/" "_build2/${SLUG}/" | head -200
            exit 3
          fi
          echo "::notice::REPRODUCIBILITY_OK :: ${SHA1}"
          echo "manifest_sha256=${SHA1}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────
  # Job 5 — Sign Ed25519 (with KMS / GH Secret privkey)
  # ──────────────────────────────────────────────────────────────
  sign:
    name: Sign Ed25519
    needs: [setup, verify-repro]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: production    # gates secret access (audit fix M13-A1)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install "cryptography>=42"
      - uses: actions/download-artifact@v4
        with: { name: build-1, path: _build/ }
      - name: Load privkey from GH Secret + mask immediately
        env:
          PRIVKEY_PEM: ${{ secrets.EFE_BUNDLE_PRIVKEY_PEM }}
        run: |
          # CRITICAL : audit fix M13-T-M13-6 — mask the privkey value
          # in logs as soon as we have it.
          if [ -z "${PRIVKEY_PEM:-}" ]; then
            echo "::error::EFE_BUNDLE_PRIVKEY_PEM secret is not set"
            exit 1
          fi
          echo "::add-mask::${PRIVKEY_PEM}"
          umask 077
          printf '%s\n' "${PRIVKEY_PEM}" > /tmp/efe-bundle.privkey.pem
          set +x
      - name: Ed25519 sign manifest
        env:
          BUNDLE_DIR: "_build/${{ needs.setup.outputs.bundle_slug }}"
        run: |
          set -euo pipefail
          python3 scripts/release/build_real_bundle.py \
              --out "${BUNDLE_DIR}" \
              --slug "${{ needs.setup.outputs.bundle_slug }}" \
              --hf-revision "${{ needs.setup.outputs.hf_revision }}" \
              --from-staged \
              --privkey-path /tmp/efe-bundle.privkey.pem \
              --git-sha "${{ needs.setup.outputs.git_sha }}" \
              --builder-uri "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Cleanup privkey
        if: always()
        run: rm -f /tmp/efe-bundle.privkey.pem
      - uses: actions/upload-artifact@v4
        with:
          name: build-signed
          path: _build/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 6 — SBOM CycloneDX 1.5 generation + validation
  # ──────────────────────────────────────────────────────────────
  sbom:
    name: Generate + validate SBOM
    needs: [setup, sign]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-signed, path: _build/ }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install cyclonedx-cli
        run: |
          curl -fsSL -o cyclonedx-cli \
              "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${{ env.CYCLONEDX_CLI_VERSION }}/cyclonedx-linux-x64"
          chmod +x cyclonedx-cli
          sudo mv cyclonedx-cli /usr/local/bin/
          cyclonedx-cli --version
      - name: Validate SBOM CycloneDX 1.5
        run: |
          set -euo pipefail
          BUNDLE_DIR="_build/${{ needs.setup.outputs.bundle_slug }}"
          cyclonedx-cli validate \
              --input-file "${BUNDLE_DIR}/SBOM.json" \
              --input-format json \
              --fail-on-errors

  # ──────────────────────────────────────────────────────────────
  # Job 7 — License gate
  # ──────────────────────────────────────────────────────────────
  license-gate:
    name: License allowlist gate
    needs: [setup, sbom]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-signed, path: _build/ }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: |
          set -euo pipefail
          BUNDLE_DIR="_build/${{ needs.setup.outputs.bundle_slug }}"
          python3 scripts/release/license_gate.py \
              --manifest "${BUNDLE_DIR}/manifest.json"

  # ──────────────────────────────────────────────────────────────
  # Job 8 — OCI publish via ORAS
  # ──────────────────────────────────────────────────────────────
  publish:
    name: Publish to OCI registry
    needs: [setup, license-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: build-signed, path: _build/ }
      - name: Install ORAS
        run: |
          set -euo pipefail
          curl -fsSL -o oras.tar.gz \
              "https://github.com/oras-project/oras/releases/download/v${{ env.ORAS_VERSION }}/oras_${{ env.ORAS_VERSION }}_linux_amd64.tar.gz"
          mkdir -p oras-bin
          tar -xzf oras.tar.gz -C oras-bin
          chmod +x oras-bin/oras
          sudo mv oras-bin/oras /usr/local/bin/
          oras version
      - name: Login to OCI registry
        if: contains(needs.setup.outputs.registry, 'ghcr.io')
        run: |
          set +x
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              oras login ghcr.io \
                  --username "${{ github.actor }}" \
                  --password-stdin
      - name: Push bundle as OCI artifact
        run: |
          set -euo pipefail
          BUNDLE_DIR="_build/${{ needs.setup.outputs.bundle_slug }}"
          MANIFEST_SHA=$(sha256sum "${BUNDLE_DIR}/manifest.json" | awk '{print $1}')
          cd "${BUNDLE_DIR}"
          # Audit fix M13-A2 (HIGH) — OCI tag uses canonical
          # `<name>:<version>` (per arch §3.3) rather than the
          # filesystem-style `<slug-with-version>:<version>`.
          oras push \
              "${{ needs.setup.outputs.registry }}/${{ needs.setup.outputs.bundle_name }}:${{ needs.setup.outputs.bundle_version }}" \
              --artifact-type "application/vnd.efe.bundle.v1+json" \
              --annotation "efe.bundle.id=${{ needs.setup.outputs.bundle_slug }}" \
              --annotation "efe.bundle.manifest_sha256=${MANIFEST_SHA}" \
              --annotation "efe.bundle.signature_algo=ed25519" \
              --annotation "efe.bundle.signing_key_id=efe-prod-bundle-2026q1" \
              --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --annotation "org.opencontainers.image.revision=${{ needs.setup.outputs.git_sha }}" \
              "manifest.json:application/vnd.efe.bundle.manifest.v1+json" \
              "manifest.json.sig:application/octet-stream" \
              "weights/model.onnx:application/vnd.onnx.model.v1" \
              "tokenizer/tokenizer.json:application/vnd.huggingface.tokenizer.v1+json" \
              "tokenizer/tokenizer_config.json:application/json" \
              "tokenizer/special_tokens_map.json:application/json" \
              "runtime/runtime_config.json:application/json" \
              "SBOM.json:application/vnd.cyclonedx+json" \
              "LICENSE:text/plain" \
              "README.md:text/markdown"

  # ──────────────────────────────────────────────────────────────
  # Job 9 — Post-publish verify (pull + verify integrity)
  # ──────────────────────────────────────────────────────────────
  verify-pull:
    name: Pull + verify integrity
    needs: [setup, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install "cryptography>=42"
      - name: Install ORAS
        run: |
          set -euo pipefail
          curl -fsSL -o oras.tar.gz \
              "https://github.com/oras-project/oras/releases/download/v${{ env.ORAS_VERSION }}/oras_${{ env.ORAS_VERSION }}_linux_amd64.tar.gz"
          mkdir -p oras-bin
          tar -xzf oras.tar.gz -C oras-bin
          chmod +x oras-bin/oras
          sudo mv oras-bin/oras /usr/local/bin/
      - name: Pull artifact
        run: |
          set -euo pipefail
          mkdir -p _verify/
          if [[ "${{ needs.setup.outputs.registry }}" == ghcr.io/* ]]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | \
                oras login ghcr.io \
                    --username "${{ github.actor }}" \
                    --password-stdin
          fi
          # M13-A2 — pull uses canonical `<name>:<version>` OCI tag.
          oras pull "${{ needs.setup.outputs.registry }}/${{ needs.setup.outputs.bundle_name }}:${{ needs.setup.outputs.bundle_version }}" \
              -o _verify/
          ls -la _verify/
      - name: Verify integrity
        run: |
          set -euo pipefail
          python3 scripts/release/verify_pulled_bundle.py \
              --bundle-dir _verify/ \
              --pubkey-id efe-prod-bundle-2026q1

  # ──────────────────────────────────────────────────────────────
  # Job 10 — Notify on completion
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notify on completion
    needs: [setup, verify-pull]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "::notice::SLACK_WEBHOOK not set ; skipping notification"
            exit 0
          fi
          STATUS="${{ needs.verify-pull.result }}"
          ICON="✅"
          if [ "${STATUS}" != "success" ]; then ICON="❌" ; fi
          curl -fsSL -X POST \
              -H 'Content-Type: application/json' \
              -d "{
                \"text\": \"${ICON} Bundle release ${{ needs.setup.outputs.bundle_name }}:${{ needs.setup.outputs.bundle_version }} → ${STATUS}\\nRegistry : ${{ needs.setup.outputs.registry }}\\nRun : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }" \
              "${SLACK_WEBHOOK}"
