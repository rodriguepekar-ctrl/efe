# Sprint Φ-D-OPS (D95-D99) — Master gate workflow.
#
# Orchestrates the 6 per-sprint SLO suites and the hard
# `master_gate_check.py` validator.
# Cf. `docs/EFE_OPERATIONAL_PRODUCTION_ARCHITECTURE.md` § 8.2.

name: ops-master-gate

on:
  pull_request:
  push:
    tags: ['v*.*.*']
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily nightly @ 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # post status comment on PRs

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ops-master-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consolidate:
    name: Consolidate 105 SLOs into 18 master rollups
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: AL master gate
        run: bash scripts/ops/run_suite.sh al

      - name: Streaming master gate
        run: bash scripts/ops/run_suite.sh stream

      - name: Compliance master gate
        run: bash scripts/ops/run_suite.sh compliance

      - name: LATACT master gate
        run: bash scripts/ops/run_suite.sh latact

      - name: Modes (Mode-2 + Mode-3 carry-over) master gate
        run: bash scripts/ops/run_suite.sh modes

      - name: A1 meta-swarm master gate (Sprint A1 P1 PR #4)
        # Soft-launch — `continue-on-error: true` for 3 main runs to
        # observe stability ;  a follow-up PR flips it to fail-closed
        # (same pattern as `bench-accuracy` in bench.yml).
        continue-on-error: true
        run: |
          # The A1 bench requires a Rust toolchain on PATH.  The
          # ubuntu-22.04 runner ships rustc 1.75 by default ; we
          # install 1.88 to match the workspace rust-toolchain.toml.
          rustup toolchain install 1.88 --profile minimal --no-self-update || true
          rustup default 1.88 || true
          bash scripts/ops/run_suite.sh a1_meta_swarm

      - name: Consolidate
        run: |
          python3 scripts/ops/consolidate_all_slos.py \
            --baselines bench_baselines/v0.6.0/al_slos.yaml \
            --baselines bench_baselines/v0.7.0/stream_slos.yaml \
            --baselines bench_baselines/v0.8.0/comp_slos.yaml \
            --baselines bench_baselines/v0.8.0/latact_slos.yaml \
            --baselines bench_baselines/v0.6.0/mode2_slos.yaml \
            --baselines bench_baselines/v0.6.0/mode3_slos.yaml \
            --baselines bench_baselines/v0.10.0/meta_swarm_slos.yaml \
            --master bench_baselines/v0.9.0/ops_master_slos.yaml \
            --measures target/ops/measures.json \
            --out target/ops/master_report.md \
            --out-json target/ops/master_report.json

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-master-report
          path: |
            target/ops/master_report.md
            target/ops/master_report.json
            target/ops/measures.json
          retention-days: 90

      - name: Hard gate
        run: |
          python3 scripts/ops/master_gate_check.py \
            --report target/ops/master_report.json \
            --tolerate-skip-with-dt \
            --fail-on-fail

      - name: Post summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('target/ops/master_report.md', 'utf8')
                          .substring(0, 60000);
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner, repo,
              body: "<details><summary>Φ-D-OPS master gate</summary>\n\n"
                    + body + "\n</details>",
            });
