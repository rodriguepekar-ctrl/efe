# PR #24 § 17.2 + AD40 — quarterly compliance evidence.
#
# Cron : 1st of {Jan, Apr, Jul, Oct} @ 05:00 UTC (1-day grace after Q boundary).
# Signs the PDF with cosign keyless OIDC ; opens a PR adding the
# evidence + bundle.

name: bench-publish-quarterly

on:
  schedule:
    - cron: "0 5 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      period:
        description: "Quarter (Q1-2026, Q2-2026, ...)"
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write            # OIDC for cosign keyless

jobs:
  quarterly:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build harness
        run: cargo build --release -p efe-bench-harness

      - name: Resolve quarter
        id: q
        run: |
          PERIOD="${{ github.event.inputs.period }}"
          if [ -z "$PERIOD" ] ; then
            MONTH=$(date -u -d '1 day ago' +%m)
            YEAR=$(date -u -d '1 day ago' +%Y)
            Q=$(( ( (10#$MONTH - 1) / 3 ) + 1 ))
            if [ "$Q" = "1" ] ; then Q=4 ; YEAR=$(( YEAR - 1 )) ; else Q=$(( Q - 1 )) ; fi
            PERIOD="Q${Q}-${YEAR}"
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Run publish-quarterly with cosign keyless OIDC
        env:
          EFE_CHART_VERSION: ${{ vars.BENCH_CHART_VERSION || '0.6.0' }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -eo pipefail
          ./target/release/efe-bench-harness publish-quarterly \
              --period "${{ steps.q.outputs.period }}" \
              --chart-version "$EFE_CHART_VERSION" \
              --output ./bench \
              --cosign-identity "https://token.actions.githubusercontent.com"

      - name: Verify the signed PDF locally before opening PR
        run: |
          set -eo pipefail
          PDF=./bench/v${{ vars.BENCH_CHART_VERSION || '0.6.0' }}/quarterly/${{ steps.q.outputs.period }}.pdf
          # AC22 — cross-chain verifier (frozen v1.6 § 24.5).
          # `evidence verify` validates :
          #   1. PDF file presence + sibling JSON + sibling .bundle
          #   2. Embedded SHA-256 == sha256(PDF bytes)
          #   3. Cosign keyless OIDC signature against shared identity regex
          #   4. Rekor transparency-log inclusion proof
          # Stable exit codes : 0 = verified, 2 = structural, 3 = sig, 4 = rekor.
          test -f "$PDF"
          test -f "${PDF%.pdf}.json"
          test -f "${PDF}.bundle"
          ./target/release/efe-bench-harness evidence verify "$PDF"

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(bench): quarterly evidence ${{ steps.q.outputs.period }}"
          branch: bench-quarterly-${{ steps.q.outputs.period }}
          title: "[bench] Quarterly evidence ${{ steps.q.outputs.period }} (signed)"
          body: |
            Auto-generated by `bench-publish-quarterly.yml`.

            Files :
            - `bench/v${{ vars.BENCH_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.json`
            - `bench/v${{ vars.BENCH_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.pdf`
            - `bench/v${{ vars.BENCH_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.pdf.bundle`

            Verifier :
            ```bash
            efe-bench-harness evidence verify bench/v${{ vars.BENCH_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.pdf
            ```

            STABILITY_CONTRACT v1.6 § 24.
          add-paths: |
            bench/**
