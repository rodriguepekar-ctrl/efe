# Sprint M12 — Helm chart OCI publish workflow.
#
# Cf. docs/EFE_HELM_CHART_EXTENSION_ARCHITECTURE.md §21.
#
# Triggered on tags `helm-v*.*.*`. Publishes the chart to an OCI
# registry :
#   - private (Φ-A → Φ-D pre-GA) : ghcr.io/efe-ai/charts-private
#   - public (D40 GA, v1.x.x)    : ghcr.io/efe-ai/charts
#
# Required GitHub secrets :
#   - GITHUB_TOKEN : provided automatically (write:packages scope).

name: helm-publish

on:
  push:
    tags:
      - "helm-v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode : private | public"
        required: false
        default: "private"
      version:
        description: "Chart version override (e.g., 1.0.0)"
        required: false
        default: ""

jobs:
  publish:
    name: Publish chart to OCI registry
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.13.3"

      - name: Read chart version
        id: chart
        run: |
          VERSION=${{ github.event.inputs.version }}
          if [[ -z "$VERSION" ]]; then
            VERSION=$(awk '/^version:/ {print $2}' deploy/helm/efe/Chart.yaml)
          fi
          echo "chart_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version : $VERSION"

      - name: Verify tag matches Chart.yaml version
        if: startsWith(github.ref, 'refs/tags/helm-v')
        run: |
          TAG=${GITHUB_REF#refs/tags/helm-v}
          if [[ "$TAG" != "${{ steps.chart.outputs.chart_version }}" ]]; then
            echo "::error::tag $TAG does not match Chart.yaml version ${{ steps.chart.outputs.chart_version }}"
            exit 1
          fi

      - name: Helm lint
        run: helm lint deploy/helm/efe/

      - name: Package chart
        run: |
          mkdir -p /tmp/charts
          helm package deploy/helm/efe/ -d /tmp/charts/
          ls -la /tmp/charts/

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart (private — Φ-B private registry)
        if: github.event.inputs.mode != 'public'
        run: |
          helm push "/tmp/charts/efe-${{ steps.chart.outputs.chart_version }}.tgz" \
              oci://ghcr.io/efe-ai/charts-private
          echo "✅ Pushed efe-${{ steps.chart.outputs.chart_version }}.tgz to private registry"

      - name: Push chart (public — GA D40)
        if: github.event.inputs.mode == 'public'
        run: |
          # Validate v1.x.x for public mode.
          if [[ ! "${{ steps.chart.outputs.chart_version }}" =~ ^1\. ]]; then
            echo "::error::public publish requires chart v1.x.x ; got ${{ steps.chart.outputs.chart_version }}"
            exit 5
          fi
          helm push "/tmp/charts/efe-${{ steps.chart.outputs.chart_version }}.tgz" \
              oci://ghcr.io/efe-ai/charts
          echo "✅ Pushed efe-${{ steps.chart.outputs.chart_version }}.tgz to PUBLIC registry"
          echo "Consumers : helm install efe oci://ghcr.io/efe-ai/charts/efe --version ${{ steps.chart.outputs.chart_version }}"
