# Sprint **Φ-D-AL Completion (D79)** — Active Learning drift monitor.
#
# Cf. docs/EFE_ACTIVE_LEARNING_COMPLETION_ARCHITECTURE.md § 11 + artefact #39.
#
# Runs the Wasserstein-1D concept-drift detector daily in 3 modes :
#   - synth_pass : no drift expected (sanity).
#   - synth_fail : drift expected (must fire).
#   - live       : production embedding stream (skipped without fixture).

name: al-drift-monitor

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  synth-pass:
    name: synth_pass = no drift (must NOT fire)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: synth_pass mode
        run: |
          python3 eval/scripts/al_drift_detector.py \
              --mode synth_pass \
              --out target/active_learning/drift_synth_pass.json
      - name: Verify drift NOT detected
        run: |
          python3 -c "
          import json
          d = json.load(open('target/active_learning/drift_synth_pass.json'))
          slo = d['slo_compliance']['SLO-AL-CONCEPT-DRIFT']
          # synth_pass : no drift expected → drift_detected should be False
          # → from SLO point of view this is NOT a SLO compliance event, so
          #   we just assert the underlying signal.
          assert slo.get('drift_detected') is False, f'synth_pass false positive: {slo}'
          print('synth_pass : no drift detected (= expected)')
          "

  synth-fail:
    name: synth_fail = drift expected (must FIRE)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: synth_fail mode
        run: |
          python3 eval/scripts/al_drift_detector.py \
              --mode synth_fail \
              --out target/active_learning/drift_synth_fail.json
      - name: Verify drift DETECTED
        run: |
          python3 -c "
          import json
          d = json.load(open('target/active_learning/drift_synth_fail.json'))
          slo = d['slo_compliance']['SLO-AL-CONCEPT-DRIFT']
          assert slo['measured_pass_count'] == 1, f'drift not fired: {slo}'
          assert slo['drift_detected'] is True, f'drift_detected False on synth_fail: {slo}'
          print('synth_fail : drift correctly detected')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: al-drift-synth-fail
          path: target/active_learning/drift_synth_fail.json

  live:
    name: live (= production embeddings ; skipped without fixture)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: live mode without fixture → SKIPPED
        run: |
          python3 eval/scripts/al_drift_detector.py \
              --mode live \
              --out target/active_learning/drift_live.json
      - name: Verify SKIPPED marker (= anti-faussement-PASS)
        run: |
          python3 -c "
          import json
          d = json.load(open('target/active_learning/drift_live.json'))
          slo = d['slo_compliance']['SLO-AL-CONCEPT-DRIFT']
          assert 'skip_reason' in slo, f'live mode must emit skip_reason without fixture: {slo}'
          print('live mode : SKIPPED correctly (anti-Φ-D.A1)')
          "

  label-drift-detection:
    name: Per-label proportion drift (synth_fail TVD)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Per-label drift test (synth_fail = drift expected)
        run: python3 eval/scripts/al_label_drift_test.py --mode synth_fail --out target/active_learning/label_drift.json
      - name: Sanity (= synth_pass must NOT detect drift)
        run: |
          python3 eval/scripts/al_label_drift_test.py --mode synth_pass --out /tmp/ld_pass.json
          python3 -c "
          import json
          d = json.load(open('/tmp/ld_pass.json'))
          slo = d['slo_compliance']['SLO-AL-LABEL-DRIFT-DETECTION']
          assert slo['drift_detected'] is False, f'synth_pass false positive: {slo}'
          print('synth_pass : no drift (= expected)')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: al-label-drift
          path: target/active_learning/label_drift.json

  summary:
    name: Drift summary + SLO gating
    needs: [synth-pass, synth-fail, live, label-drift-detection]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: Re-run drift + label-drift in synth_fail mode (= primary SLO sources)
        run: |
          mkdir -p target/active_learning
          # Embedding-distribution drift (SLO-AL-CONCEPT-DRIFT)
          python3 eval/scripts/al_drift_detector.py \
              --mode synth_fail \
              --out /tmp/drift1.json
          # Per-label proportion drift (SLO-AL-LABEL-DRIFT-DETECTION)
          python3 eval/scripts/al_label_drift_test.py \
              --mode synth_fail \
              --out /tmp/drift2.json
          # Merge.
          python3 -c "
          import json
          out = {'slo_compliance': {}}
          for f in ['/tmp/drift1.json', '/tmp/drift2.json']:
              d = json.load(open(f))
              for k, v in d.get('slo_compliance', {}).items():
                  out['slo_compliance'][k] = v
          json.dump(out, open('target/active_learning/drift_consolidated.json', 'w'), indent=2)
          print(f'merged {len(out[\"slo_compliance\"])} SLOs (real evidence, no stub)')
          "
      - name: Gate via check_slo.py
        run: |
          python3 eval/scripts/check_slo.py \
              --baseline bench_baselines/v0.6.0/al_slos.yaml \
              --measure target/active_learning/drift_consolidated.json \
              --report target/active_learning/drift_report.md
          cat target/active_learning/drift_report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: al-drift-monitor
          path: |
            target/active_learning/drift_*.json
            target/active_learning/drift_report.md
