# PR #23 § 16.1 — smoke-pr : hard merge gate, runs on every PR + push:main.

name: smoke-pr

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write    # post PR comment
  id-token: write         # GH Pages OIDC for badge publish (push:main only)

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 8     # AD3 — 4 min wall-clock + 4 min safety buffer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: helm/kind-action@v1
        with:
          cluster_name: smoke-pr-${{ github.run_id }}
          version: v0.24.0
          wait: 60s

      - name: Build
        run: cargo build --release -p efe-smoke

      - name: Install efe-meta-swarm chart
        run: |
          set -eo pipefail
          helm repo add efe https://efe.github.io/charts || true
          helm repo update
          helm install efe-meta-swarm efe/efe-meta-swarm \
              --namespace efe --create-namespace \
              --set image.tag=${{ github.sha }} \
              --set serviceMonitor.enabled=false \
              --wait --timeout 90s

      - name: Run smoke (all 9 checks)
        id: smoke
        env:
          EFE_CHART_VERSION: ${{ github.sha }}
        run: |
          set -o pipefail
          # D4 — `--namespace efe` colocates with the chart that the
          # previous step installed.  Skips auto-creation /
          # auto-cleanup of an `efe-smoke-<uuid>` namespace.
          ./target/release/efe-smoke run \
              --chart-version "$EFE_CHART_VERSION" \
              --provisioner external \
              --kubeconfig "$HOME/.kube/config" \
              --namespace efe \
              --output /tmp/smoke.json \
              --pr-comment-file /tmp/pr-comment.md \
              --badge-file /tmp/smoke.svg \
              --redact-logs

      - name: Gate
        run: |
          ./target/release/efe-smoke gate --input /tmp/smoke.json

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('/tmp/pr-comment.md')) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fs.readFileSync('/tmp/pr-comment.md', 'utf8'),
              });
            }

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_id }}
          path: |
            /tmp/smoke.json
            /tmp/smoke.svg
            /tmp/pr-comment.md
          retention-days: 14

      # AD44 — only push:main updates the gh-pages badge.
      - name: Publish gh-pages badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          mkdir -p /tmp/smoke-page
          cp /tmp/smoke.svg /tmp/smoke-page/badge.svg
          cp /tmp/smoke.json /tmp/smoke-page/latest.json

      - name: Deploy badge to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/smoke-page
          destination_dir: smoke
          keep_files: true
