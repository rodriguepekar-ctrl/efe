# Sprint **Φ-D-AL Completion (D79)** — Active Learning contract test workflow.
#
# Cf. docs/EFE_ACTIVE_LEARNING_COMPLETION_ARCHITECTURE.md § 16 + artefact #36.
#
# Triggers : PR + nightly + workflow_dispatch.
# Gates : structural pin tests, recall improvement, uncertainty coverage,
# holdout integrity, canary duration, label chain canonical_bytes pin.

name: al-contract

on:
  pull_request:
    paths:
      - "crates/efe-server/src/active_learning/**"
      - "crates/efe-server/src/audit/al_*"
      - "eval/scripts/al_*.py"
      - "scripts/active_learning/**"
      - "scripts/tests/test_active_learning_completion.py"
      - "schemas/al_*.json"
      - "bench_baselines/v0.6.0/al_slos.yaml"
      - ".github/workflows/al-contract.yml"
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC nightly
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  pin-tests:
    name: Structural pin tests (18)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest pyyaml
      - name: Run Active Learning pin tests
        run: pytest scripts/tests/test_active_learning_completion.py -v --tb=short

  recall-improvement-bench:
    name: Recall improvement ≥ +1 %
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Recall improvement bench
        run: python3 eval/scripts/al_recall_improvement_bench.py --out target/active_learning/recall_bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: al-recall-bench
          path: target/active_learning/recall_bench.json

  uncertainty-coverage:
    name: Uncertainty coverage = 100 %
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Uncertainty coverage replay (stub)
        run: python3 scripts/active_learning/replay_uncertainty_coverage.py --out target/active_learning/uncertainty_coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: al-uncertainty-coverage
          path: target/active_learning/uncertainty_coverage.json

  holdout-integrity:
    name: Holdout split 0 % overlap
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Holdout integrity verifier (stub)
        run: python3 scripts/active_learning/verify_holdout_integrity.py --out target/active_learning/holdout_integrity.json
      - uses: actions/upload-artifact@v4
        with:
          name: al-holdout-integrity
          path: target/active_learning/holdout_integrity.json

  canary-duration:
    name: Canary ≥ 24 h enforcement
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Canary duration verifier (stub)
        run: python3 scripts/active_learning/verify_canary_duration.py --out target/active_learning/canary_duration.json
      - uses: actions/upload-artifact@v4
        with:
          name: al-canary-duration
          path: target/active_learning/canary_duration.json

  cost-per-label:
    name: Cost per label ≤ $0.01
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Cost tracker (stub)
        run: python3 scripts/active_learning/track_label_costs.py --out target/active_learning/cost_per_label.json
      - uses: actions/upload-artifact@v4
        with:
          name: al-cost-per-label
          path: target/active_learning/cost_per_label.json

  # ── Audit-Level-1 additions : real evidence (= no more stub faussement-PASS) ──

  gdpr-consent:
    name: GDPR consent coverage = 100 % (self-test)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: GDPR consent replay (synth_pass)
        run: python3 eval/scripts/al_gdpr_consent_replay.py --mode synth_pass --out target/active_learning/gdpr_consent.json
      - name: Negative test (= synth_fail must exit 1)
        run: |
          python3 eval/scripts/al_gdpr_consent_replay.py --mode synth_fail --out /tmp/gdpr_fail.json && \
            { echo "FATAL : synth_fail did not detect missing consent" ; exit 1 ; } || \
            { echo "Negative test OK : missing consent correctly detected" ; }
      - uses: actions/upload-artifact@v4
        with:
          name: al-gdpr-consent
          path: target/active_learning/gdpr_consent.json

  auto-rollback:
    name: Auto-rollback injection (3 scenarios)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Auto-rollback injection test
        run: python3 eval/scripts/al_auto_rollback_injection_test.py --out target/active_learning/auto_rollback.json
      - uses: actions/upload-artifact@v4
        with:
          name: al-auto-rollback
          path: target/active_learning/auto_rollback.json

  tenant-isolation:
    name: Tenant isolation adversarial scan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tenant isolation test
        run: python3 eval/scripts/al_tenant_isolation_test.py --out target/active_learning/tenant_isolation.json
      - uses: actions/upload-artifact@v4
        with:
          name: al-tenant-isolation
          path: target/active_learning/tenant_isolation.json

  deterministic-replay:
    name: Deterministic replay (6 invariants)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Deterministic replay test
        run: python3 eval/scripts/al_deterministic_replay_test.py --out target/active_learning/replay_determinism.json
      - uses: actions/upload-artifact@v4
        with:
          name: al-deterministic-replay
          path: target/active_learning/replay_determinism.json

  schema-validation:
    name: AlLabelAttestation JSON schema valid
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install jsonschema
      - name: Validate schema + canonical_bytes shape + sample roundtrip
        run: |
          python3 -c "
          import sys, hmac, hashlib, json, jsonschema
          sys.path.insert(0, 'scripts/active_learning')
          from replay_label_chain import canonical_bytes, compute_hmac, CANONICAL_FIELDS
          # L2 audit fix Φ-D-AL.A12 : validate the schema file itself, then
          # validate a reference attestation against it.
          schema = json.load(open('schemas/al_label_attestation.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          ref = {
              'schema_version': 1, 'tenant_id': 'tenant-acme',
              'label_id': 'label-001', 'query_hash': 'a'*64,
              'catalog_id': 'router-v1', 'source': 'llm_oracle',
              'label_text': 'billing-dispute', 'confidence': 0.97,
              'consent_hash': 'b'*64, 'cost_usd_micros': 5000,
              'timestamp_unix_micros': 1700000000000000,
              'prev_hash': '00'*32,
          }
          # Compute HMAC then add it for full schema validation.
          ref['hmac_sha256'] = compute_hmac(bytes(32), ref)
          jsonschema.validate(ref, schema)
          # Pin canonical_bytes shape : no whitespace, sort_keys = True.
          cb = canonical_bytes(ref).decode()
          assert ' ' not in cb and '\n' not in cb
          assert cb.index('\"catalog_id\"') < cb.index('\"confidence\"')
          for f in CANONICAL_FIELDS:
              assert f'\"{f}\"' in cb, f'missing canonical field : {f}'
          # hmac_sha256 must NOT appear in canonical_bytes (= it's the OUTPUT).
          assert '\"hmac_sha256\"' not in cb, 'hmac_sha256 leaked into canonical input'
          # HMAC deterministic.
          key = bytes(32)
          assert compute_hmac(key, ref) == compute_hmac(key, ref)
          print('schema + canonical_bytes + HMAC pin : OK')
          "

  consolidated:
    name: SLO consolidated gating
    needs: [pin-tests, recall-improvement-bench, uncertainty-coverage, holdout-integrity, canary-duration, cost-per-label, schema-validation, gdpr-consent, auto-rollback, tenant-isolation, deterministic-replay]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: Merge compliance JSONs
        run: |
          mkdir -p target/active_learning
          python3 -c "
          import json, glob
          out = {'slo_compliance': {}}
          for f in glob.glob('artifacts/**/*.json', recursive=True):
              try: d = json.load(open(f))
              except Exception: continue
              for k, v in d.get('slo_compliance', {}).items():
                  out['slo_compliance'][k] = v
          json.dump(out, open('target/active_learning/consolidated.json', 'w'), indent=2)
          print(f'merged {len(out[\"slo_compliance\"])} SLOs')
          "
      - name: Gate via check_slo.py
        run: |
          python3 eval/scripts/check_slo.py \
              --baseline bench_baselines/v0.6.0/al_slos.yaml \
              --measure target/active_learning/consolidated.json \
              --report target/active_learning/contract_report.md
          cat target/active_learning/contract_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: al-contract-compliance
          path: |
            target/active_learning/*.json
            target/active_learning/*.md
