# Sprint **Φ-D-COMPLIANCE D89** — daily audit chain replay (compliance events).

name: comp-audit-replay

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  audit-replay-self-test:
    name: Compliance HMAC chain replay (100 synthetic events)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Synthetic chain self-test
        run: python3 eval/scripts/comp_audit_chain_daily.py --mode synth_pass --n-events 100 --out target/compliance/audit_chain_self_test.json
      - name: Verify SLO compliance
        run: |
          python3 -c "
          import json
          d = json.load(open('target/compliance/audit_chain_self_test.json'))
          slo = d['slo_compliance']['SLO-COMP-AUDIT-CHAIN-DAILY']
          assert slo['measured_pass_count'] == 1
          assert slo['total_broken'] == 0
          assert slo['chain_length'] == 100
          print('self-test compliance audit replay : 100/100 events, 0 broken')
          "
      - name: Negative test (= corruption injection)
        run: |
          python3 eval/scripts/comp_audit_chain_daily.py --mode synth_fail --n-events 100 --out target/compliance/audit_chain_corrupt.json
          python3 -c "
          import json
          d = json.load(open('target/compliance/audit_chain_corrupt.json'))
          slo = d['slo_compliance']['SLO-COMP-AUDIT-CHAIN-DAILY']
          # synth_fail detects → measured_pass_count = 1
          assert slo['measured_pass_count'] == 1, 'synth_fail must detect chain break'
          assert slo['total_broken'] >= 1
          print('negative test : corruption correctly detected')
          "
      - name: Gate via check_slo.py
        run: |
          python3 eval/scripts/check_slo.py \
              --baseline bench_baselines/v0.8.0/comp_slos.yaml \
              --measure target/compliance/audit_chain_self_test.json \
              --report target/compliance/audit_report.md
          cat target/compliance/audit_report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comp-audit-replay
          path: |
            target/compliance/audit_chain_*.json
            target/compliance/audit_report.md
