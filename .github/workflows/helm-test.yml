# Sprint M12 — Helm chart PR-gate test workflow.
#
# Cf. docs/EFE_HELM_CHART_EXTENSION_ARCHITECTURE.md §13.3.
#
# Runs on every PR that touches deploy/helm/efe/.
#
# Stages :
#   1. helm lint               (fast — chart well-formed)
#   2. ct lint                 (chart-testing — version bump + maintainers)
#   3. helm template            (renders all 3 values profiles)
#   4. Polaris audit            (severity=danger ; M12 gate = 0 dangers)
#   5. helm-unittest            (~30 unit tests)
#   6. ct install               (kind cluster matrix : K8s 1.26 / 1.28 / 1.30)
#   7. Pin tests Python         (anti-régression structurelle)
#   8. Bash syntax              (scripts/*.sh)

name: helm-test

on:
  pull_request:
    paths:
      - "deploy/helm/efe/**"
      - "scripts/tests/test_m12_helm_*.py"
      - ".github/workflows/helm-test.yml"
  workflow_dispatch:

env:
  HELM_VERSION: "v3.13.3"
  POLARIS_VERSION: "8.5.5"
  CT_VERSION: "v3.10.1"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Helm lint + chart-testing lint + template render.
  # ──────────────────────────────────────────────────────────────
  lint-and-render:
    name: Lint + render templates
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: helm lint
        run: helm lint deploy/helm/efe/

      - name: helm template (default)
        run: |
          # Audit fix M12-A4 (MED) — `--create-namespace` is a flag
          # for `helm install/upgrade`, NOT `helm template`. Pre-fix
          # Helm silently ignored it but emitted a deprecation-flavour
          # warning ; post-fix the flag is removed for semantic
          # correctness (template is purely a manifest renderer).
          helm template efe deploy/helm/efe/ \
              --namespace efe-test \
              > /tmp/render-default.yaml
          wc -l /tmp/render-default.yaml

      - name: helm template (staging)
        run: |
          helm template efe deploy/helm/efe/ \
              -f deploy/helm/efe/values.staging.yaml \
              --namespace efe-test \
              > /tmp/render-staging.yaml

      - name: helm template (prod)
        run: |
          helm template efe deploy/helm/efe/ \
              -f deploy/helm/efe/values.prod.yaml \
              --namespace efe-prod \
              > /tmp/render-prod.yaml

      - name: helm template (M12 features enabled — D21+D22+D27)
        run: |
          helm template efe deploy/helm/efe/ \
              --set networkPolicyStrict.enabled=true \
              --set mtls.enabled=true \
              --set mtls.issuerRef.name=test-ca \
              --set bundleReload.enabled=true \
              --set bundle.manifestSha256=abc123def456 \
              --namespace efe-test \
              > /tmp/render-m12.yaml
          # Sanity : all M12 features rendered.
          grep -q "kind: NetworkPolicy" /tmp/render-m12.yaml      # D21
          grep -q "kind: Certificate" /tmp/render-m12.yaml         # D22
          grep -q "kind: Job" /tmp/render-m12.yaml                 # D27 hook
          # D27 RBAC triplet (post-audit M12 sanity addition).
          grep -q "kind: ServiceAccount" /tmp/render-m12.yaml
          grep -q "kind: Role" /tmp/render-m12.yaml
          grep -q "kind: RoleBinding" /tmp/render-m12.yaml
          # M12-D21 strict NetworkPolicy must declare BOTH ingress + egress.
          grep -q "policyTypes:" /tmp/render-m12.yaml
          # M12-D22 — Certificate uses the right cert-manager API group.
          grep -q "apiVersion: cert-manager.io/v1" /tmp/render-m12.yaml
          echo "✅ All M12 features render correctly with --set overrides"

      - name: ct (chart-testing) lint
        uses: helm/chart-testing-action@v2.6.1
        with:
          version: ${{ env.CT_VERSION }}
      - run: |
          ct lint --target-branch=main \
              --chart-dirs=deploy/helm \
              --validate-maintainers=false \
              --check-version-increment=false

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp/render-*.yaml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Polaris validation (M12 D21 gate : 0 dangers).
  # ──────────────────────────────────────────────────────────────
  polaris:
    name: Polaris audit (severity=danger)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: lint-and-render
    steps:
      - uses: actions/checkout@v4
      # Audit fix M12-A7 (LOW) — version was hardcoded "v3.13.3" ;
      # post-fix uses the env.HELM_VERSION pin so a single bump
      # at the top of the workflow propagates to every job.
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }
      - uses: actions/download-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp

      - name: Install Polaris
        run: |
          curl -sLo polaris.tar.gz \
              "https://github.com/FairwindsOps/polaris/releases/download/${{ env.POLARIS_VERSION }}/polaris_linux_amd64.tar.gz"
          tar xzf polaris.tar.gz
          chmod +x polaris
          ./polaris version

      - name: Polaris audit (default profile)
        run: |
          ./polaris audit \
              --audit-path /tmp/render-default.yaml \
              --config deploy/helm/efe/.polaris.yaml \
              --severity danger \
              --output-format pretty

      - name: Polaris audit (prod profile — M12 GA gate)
        run: |
          ./polaris audit \
              --audit-path /tmp/render-prod.yaml \
              --config deploy/helm/efe/.polaris.yaml \
              --severity danger \
              --output-format pretty

      - name: Polaris audit (M12 features enabled)
        run: |
          ./polaris audit \
              --audit-path /tmp/render-m12.yaml \
              --config deploy/helm/efe/.polaris.yaml \
              --severity danger \
              --output-format pretty

  # ──────────────────────────────────────────────────────────────
  # Job 3 — helm-unittest (~30 unit tests YAML).
  # ──────────────────────────────────────────────────────────────
  helm-unittest:
    name: helm-unittest (~30 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Audit fix M12-A7 (LOW) — version unified on env.HELM_VERSION.
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
              --version v0.5.1

      - name: Run helm-unittest
        run: |
          helm unittest deploy/helm/efe/ \
              --color \
              --strict

  # ──────────────────────────────────────────────────────────────
  # Job 4 — chart-testing install (kind matrix : K8s 1.26 / 1.28 / 1.30).
  # ──────────────────────────────────────────────────────────────
  ct-install:
    name: ct install / K8s ${{ matrix.k8s }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - "v1.26.15"
          - "v1.28.7"
          - "v1.30.0"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Audit fix M12-A7 (LOW) — version unified on env.HELM_VERSION
      # + env.CT_VERSION (the chart-testing CLI pin).
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Setup kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          version: "v0.22.0"
          node_image: "kindest/node:${{ matrix.k8s }}"

      - name: Install cert-manager (D22 prereq)
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.3/cert-manager.yaml
          kubectl wait --for=condition=Available deployment \
              --all -n cert-manager --timeout=300s

      - name: Install ct
        uses: helm/chart-testing-action@v2.6.1
        with: { version: "${{ env.CT_VERSION }}" }

      - name: ct install (default profile)
        run: |
          ct install --target-branch=main \
              --chart-dirs=deploy/helm \
              --helm-extra-args="--timeout 600s"

  # ──────────────────────────────────────────────────────────────
  # Job 5 — Pin tests Python (anti-régression structurelle).
  # ──────────────────────────────────────────────────────────────
  pin-tests:
    name: Pin tests (Python — structure)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Audit fix M12-A6 (HIGH) — pre-fix this only installed `pytest` ;
      # the M12 pin tests `import yaml` (PyYAML) for parsing the chart's
      # YAML files, so without `pyyaml` the run crashed with
      # `ModuleNotFoundError: No module named 'yaml'`. Additionally, the
      # repo's `pyproject.toml` declares `addopts: --cov-config=...`
      # which crashed pytest at startup if `pytest-cov` wasn't installed.
      # Post-fix : install both `pyyaml` + `pytest-cov`, AND override
      # the addopts via `-c /dev/null` so pytest ignores the project
      # config (M12 pin tests don't need coverage instrumentation).
      - run: pip install pytest pyyaml pytest-cov
      - run: |
          python -m pytest scripts/tests/test_m12_helm_extension.py \
              -v --tb=short -c /dev/null

  # ──────────────────────────────────────────────────────────────
  # Job 6 — Bash syntax check (scripts within chart, if any).
  # ──────────────────────────────────────────────────────────────
  bash-syntax:
    name: Bash syntax (chart scripts)
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          # Inline bash inside templates is part of YAML — skipped.
          # Standalone .sh files in the chart files/ directory :
          for f in $(find deploy/helm/efe/files -name '*.sh' 2>/dev/null); do
            echo "Checking $f"
            bash -n "$f"
          done
          echo "✅ all chart scripts parse OK"
