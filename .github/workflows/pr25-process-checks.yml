# PR #25 — Process-invariant status checks.
#
# Three required status checks (set as required in branch protection
# out-of-band — see .github/branch-protection-rules.yml) :
#
#   pr25-i1-audit-prompt   : lessons file required for PR ≥ 1000 LOC + harness src
#   pr25-i2-sot-invariants : single-source-of-truth for parallel const lists
#   pr25-i6-audit-budget   : PR description has the `## Audit budget` section
#
# Reference : docs/architecture/EFE_A1_PHASE3_PR25_ARCHITECTURE.md
# Threat model : process gap class (PR #24 lessons § 3 — D-N, D-U, D-AS)

name: pr25-process-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# Workflow is read-only on the repo + read PR metadata.  No write.
permissions:
  contents: read
  pull-requests: read

# Re-run on the same head SHA ; cancel earlier in-progress invocations
# to avoid stacking when the author force-pushes during review.
concurrency:
  group: pr25-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default shell flags for every `run` step : strict mode + pipefail.
defaults:
  run:
    shell: bash
    working-directory: ${{ github.workspace }}

# ════════════════════════════════════════════════════════════════════
#                              I.1
# ════════════════════════════════════════════════════════════════════
#
# Conditions to require a lessons file :
#   1. PR net LOC ≥ 1000
#   2. PR touches at least one file under :
#        bench/harness/src/
#        crates/*/src/
#        tools/loadgen/src/
#   3. PR title does NOT carry [I.1-bypass] or [I.1-refactor] tag.
#
# When required : verify docs/lessons/PR-<N>-lessons.md exists in the
# PR's diff AND passes scripts/audit-prompt-validator.sh.

jobs:
  i1-audit-prompt:
    name: I.1 — audit prompt + lessons file
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    # Skip for draft PRs (will re-run when marked ready_for_review).
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR with full history
        uses: actions/checkout@v4
        with:
          # Need full history so we can diff against base.sha.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve PR metadata
        id: meta
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          echo "pr=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          # Detect bypass / refactor tags in title.
          BYPASS=false
          if [[ "$PR_TITLE" == *"[I.1-bypass]"* ]] ; then BYPASS=bypass ; fi
          if [[ "$PR_TITLE" == *"[I.1-refactor]"* ]] ; then BYPASS=refactor ; fi
          echo "bypass=${BYPASS}" >> "$GITHUB_OUTPUT"
          # Resolve sha range.
          echo "base=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Compute PR net LOC delta
        id: loc
        env:
          BASE: ${{ steps.meta.outputs.base }}
          HEAD: ${{ steps.meta.outputs.head }}
        run: |
          set -eo pipefail
          # `git diff --shortstat` output shape :
          #   "12 files changed, 1234 insertions(+), 567 deletions(-)"
          # Some lines may omit insertions or deletions on pure-delete PRs.
          STAT=$(git diff --shortstat "${BASE}...${HEAD}" || echo "")
          ADDED=$(printf '%s' "$STAT" | grep -oE '[0-9]+ insertion' | awk '{print $1}' || echo 0)
          DELETED=$(printf '%s' "$STAT" | grep -oE '[0-9]+ deletion' | awk '{print $1}' || echo 0)
          ADDED=${ADDED:-0}
          DELETED=${DELETED:-0}
          NET=$((ADDED + DELETED))
          echo "added=${ADDED}"     >> "$GITHUB_OUTPUT"
          echo "deleted=${DELETED}" >> "$GITHUB_OUTPUT"
          echo "net=${NET}"          >> "$GITHUB_OUTPUT"
          echo "::notice title=I.1 PR LOC::added=${ADDED} deleted=${DELETED} net=${NET}"

      - name: Detect harness-src touch
        id: touch
        env:
          BASE: ${{ steps.meta.outputs.base }}
          HEAD: ${{ steps.meta.outputs.head }}
        run: |
          set -eo pipefail
          TOUCHED=false
          # Capture the diff filename list once.
          DIFF_FILES=$(git diff --name-only "${BASE}...${HEAD}" || echo "")
          if printf '%s\n' "$DIFF_FILES" | grep -E '^(bench/harness|crates/[^/]+|tools/loadgen)/src/' > /dev/null ; then
              TOUCHED=true
          fi
          echo "touched=${TOUCHED}" >> "$GITHUB_OUTPUT"
          echo "::notice title=I.1 src touch::touched=${TOUCHED}"

      - name: Decide enforcement
        id: decide
        env:
          NET: ${{ steps.loc.outputs.net }}
          TOUCHED: ${{ steps.touch.outputs.touched }}
          BYPASS: ${{ steps.meta.outputs.bypass }}
        run: |
          set -eo pipefail
          REQUIRED=false
          REASON="below threshold (net=${NET} touched=${TOUCHED})"
          if [ "${NET}" -ge 1000 ] && [ "${TOUCHED}" = "true" ] ; then
              REQUIRED=true
              REASON="net=${NET} ≥ 1000 AND touches harness src"
          fi
          if [ -n "${BYPASS}" ] && [ "${BYPASS}" != "false" ] ; then
              REQUIRED=false
              REASON="bypass tag : [${BYPASS}]"
          fi
          echo "required=${REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "::notice title=I.1 decision::required=${REQUIRED} reason=${REASON}"

      - name: Verify lessons file present (if required)
        if: steps.decide.outputs.required == 'true'
        env:
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          set -eo pipefail
          LESSONS="docs/lessons/PR-${PR}-lessons.md"
          if [ ! -f "$LESSONS" ] ; then
              cat <<EOF
          ::error title=I.1 violation::Missing $LESSONS

          PR #${PR} is ≥ 1000 LOC and touches harness src.
          The I.1 process invariant (STABILITY_CONTRACT § 25.1) requires
          a lessons file at this path documenting your audit findings.

          Quick start :
            1. cp docs/lessons/_template.md docs/lessons/PR-${PR}-lessons.md
            2. Fill in all 7 sections (Headline, Timeline, Defect taxonomy,
               What worked, Process changes, Defect index, Known gaps).
            3. Run : bash scripts/audit-prompt-validator.sh docs/lessons/PR-${PR}-lessons.md
            4. Commit + push.

          If this PR genuinely needs a bypass (security hotfix or pure
          refactor with ≥ 95% whitespace), retitle with [I.1-bypass]
          or [I.1-refactor] AND file the justification per
          docs/architecture/EFE_A1_PHASE3_PR25_ARCHITECTURE.md § 3.5.
          EOF
              exit 1
          fi
          echo "::notice title=I.1 lessons file::Found $LESSONS"

      - name: Validate lessons file schema (if required)
        if: steps.decide.outputs.required == 'true'
        env:
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          set -eo pipefail
          LESSONS="docs/lessons/PR-${PR}-lessons.md"
          bash scripts/audit-prompt-validator.sh "$LESSONS"

      - name: Log bypass usage (audit trail)
        if: steps.meta.outputs.bypass == 'bypass' || steps.meta.outputs.bypass == 'refactor'
        env:
          PR: ${{ steps.meta.outputs.pr }}
          BYPASS: ${{ steps.meta.outputs.bypass }}
        run: |
          set -eo pipefail
          # Verify the bypass log carries a justification entry for this PR.
          # The log is at docs/process/i1-bypass-log.md ; release-eng reviews quarterly.
          LOG=docs/process/i1-bypass-log.md
          if [ ! -f "$LOG" ] ; then
              echo "::warning title=I.1 bypass log missing::Expected $LOG to exist (will be created in PR #25)"
              exit 0
          fi
          if ! grep -qE "^\| PR-${PR} " "$LOG" ; then
              cat <<EOF
          ::error title=I.1 bypass without log::PR-${PR} carries [I.1-${BYPASS}] tag
                but no entry in $LOG.

          Add a row to $LOG with this PR's number + justification.
          Quarterly review by release-eng ensures bypass doesn't become routine.
          EOF
              exit 1
          fi

  # ════════════════════════════════════════════════════════════════════
  #                              I.2
  # ════════════════════════════════════════════════════════════════════
  #
  # Two enforcers :
  #   a) The Rust integration test `process_invariants` walks the
  #      workspace and asserts no parallel const lists.
  #   b) The shell script `scripts/sot-audit.sh` produces a human-
  #      readable report of every canonical list found (informational).

  i2-sot-invariants:
    name: I.2 — SOT for parallel const lists
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run process_invariants Rust test (hard gate I.2)
        run: |
          set -eo pipefail
          # PR #25 day 3 made this a HARD gate (was warn-only at day 1).
          # Both the positive (workspace scan) and negative (synthetic
          # input) test files must pass.
          cargo test --release --test process_invariants -p efe-bench-harness -- --nocapture
          cargo test --release --test process_invariants_negatives -p efe-bench-harness
          # The v1.7 stability tests lock the frozen process invariants.
          cargo test --release --test stability_contract_v17 -p efe-bench-harness

      - name: Workspace-wide SOT scan (informational)
        run: |
          set -eo pipefail
          if [ -x scripts/sot-audit.sh ] ; then
              bash scripts/sot-audit.sh
          else
              echo "::warning title=I.2 placeholder::scripts/sot-audit.sh not yet present (PR #25 day 1)"
          fi

  # ════════════════════════════════════════════════════════════════════
  #                              I.6
  # ════════════════════════════════════════════════════════════════════
  #
  # Verify the PR body contains the `## Audit budget` section with the
  # four required line items (Implementation, Audit, Buffer, Total).
  # Stop the merge if the section is absent or its values are still
  # the placeholder underscores.

  i6-audit-budget:
    name: I.6 — audit budget section
    runs-on: ubuntu-22.04
    timeout-minutes: 3

    if: github.event.pull_request.draft == false

    steps:
      - name: Verify ## Audit budget section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eo pipefail

          # Bypass tag short-circuits I.6 too (security hotfix is the
          # same justification for both I.1 and I.6).
          if [[ "$PR_TITLE" == *"[I.1-bypass]"* ]] ; then
              echo "::notice title=I.6 bypass::PR carries [I.1-bypass] tag, skipping"
              exit 0
          fi

          if [ -z "${PR_BODY:-}" ] ; then
              echo "::error title=I.6 violation::PR body is empty"
              exit 1
          fi

          # Heredoc to compare against tolerant pattern (any whitespace,
          # any heading-level, optional `**` bold prefix — the EXACT
          # label "Audit budget" must appear).  Accepts :
          #   ## Audit budget
          #   ### Audit budget — required
          #   ## **Audit budget** (some authors prefer bold)
          if ! printf '%s' "$PR_BODY" | grep -qE '^##+[[:space:]]+\**Audit budget' ; then
              cat <<EOF
          ::error title=I.6 violation::PR body missing the '## Audit budget' section

          PR #${PR_NUMBER} description must contain :

              ## Audit budget

              - Implementation : N days
              - Audit (per I.1) : M days (P % of impl)
              - Buffer for unforeseen depth : K days
              - Total estimate : (N+M+K) days

          See docs/architecture/EFE_A1_PHASE3_PR25_ARCHITECTURE.md § 5 for
          the rationale and current target (30 % Phase-3 steady-state).
          EOF
              exit 1
          fi

          # Verify the 4 numeric fields are filled (not the underscore
          # placeholders from the PR template).
          MISSING=()
          if ! printf '%s' "$PR_BODY" | grep -qE 'Implementation : [0-9]+[[:space:]]*days?' ; then
              MISSING+=("Implementation")
          fi
          if ! printf '%s' "$PR_BODY" | grep -qE 'Audit \(per I\.1\) : [0-9]+[[:space:]]*days?' ; then
              MISSING+=("Audit")
          fi
          if ! printf '%s' "$PR_BODY" | grep -qE 'Buffer for unforeseen depth : [0-9]+[[:space:]]*days?' ; then
              MISSING+=("Buffer")
          fi
          if ! printf '%s' "$PR_BODY" | grep -qE 'Total estimate.{0,5}: [0-9]+[[:space:]]*days?' ; then
              MISSING+=("Total")
          fi

          if [ ${#MISSING[@]} -gt 0 ] ; then
              cat <<EOF
          ::error title=I.6 violation::Unfilled audit-budget fields : ${MISSING[*]}

          The PR template's placeholders (e.g. 'Implementation : __ days')
          still contain underscores.  Replace them with concrete numbers.

          Example :
              - Implementation : 5 days
              - Audit (per I.1) : 2 days (40 % of impl)
              - Buffer for unforeseen depth : 1 days
              - Total estimate : 8 days
          EOF
              exit 1
          fi
          echo "::notice title=I.6 ok::All 4 audit-budget fields present + numeric"

  # ════════════════════════════════════════════════════════════════════
  #                       Aggregate summary
  # ════════════════════════════════════════════════════════════════════
  #
  # Convenience job that depends on the three above ; provides a single
  # "process-checks pass" status to reference in branch protection if
  # the team prefers one required check over three.

  pr25-process-checks-pass:
    name: pr25 process checks pass
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    needs: [i1-audit-prompt, i2-sot-invariants, i6-audit-budget]
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: Aggregate
        run: |
          set -eo pipefail
          if [ "${{ needs.i1-audit-prompt.result }}" != "success" ] \
              || [ "${{ needs.i2-sot-invariants.result }}" != "success" ] \
              || [ "${{ needs.i6-audit-budget.result }}" != "success" ] ; then
              echo "::error title=PR #25 process checks::At least one check failed"
              echo "i1 : ${{ needs.i1-audit-prompt.result }}"
              echo "i2 : ${{ needs.i2-sot-invariants.result }}"
              echo "i6 : ${{ needs.i6-audit-budget.result }}"
              exit 1
          fi
          echo "::notice title=PR #25 process checks::All three checks passed"
