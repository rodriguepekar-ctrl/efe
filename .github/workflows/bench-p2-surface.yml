name: Bench — P2 Surface

# Sprint **D19 (P2-Foundation)** — CI gating for the P2 self-service
# activation surface.
#
# Cf. `docs/EFE_P2_SELF_SERVICE_ARCHITECTURE.md` § 5.3.
#
# ## Cadence
#
# - `pull_request` touching `crates/efe-server/src/v1/onboarding/**`
#   OR `crates/efe-telemetry/src/metrics/p2_instruments.rs` OR
#   `docs/quickstart/**` : RUN.
# - `push main` : RUN (gate de pré-release).
# - `schedule` nightly 03:00 UTC : RUN les jobs lourds (Playwright,
#   multi-cloud parity).
# - `release tag v*` : RUN obligatoire.
#
# ## Jobs (5)
#
# 1. `p2-onboarding-unit` — tests unitaires Rust + Python.
# 2. `p2-doc-snippet-drift` — vérifie que doc snippets compilent.
# 3. `p2-ops-smoke` — promtool + jq + YAML validators.
# 4. `p2-playwright-sandbox` — E2E sandbox 5 min (nightly).
# 5. `p2-multi-cloud-parity` — provisionning AWS / GCP / Azure (nightly,
#    gated par vars.P2_E2E_CLOUDS_ENABLED).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bench-p2-surface.yml'
      - 'crates/efe-server/src/v1/onboarding/**'
      - 'crates/efe-server/migrations/0028_d19_p2_onboarding*.sql'
      - 'crates/efe-telemetry/src/metrics/p2_instruments.rs'
      - 'deploy/observability/prometheus/rules.p2/**'
      - 'deploy/observability/grafana/efe-p2-funnel.json'
      - 'bench_baselines/**/p2_slos.yaml'
      - 'docs/quickstart/**'
      - 'docs/runbook/p2_*.md'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'crates/efe-server/src/v1/onboarding/**'
      - 'crates/efe-telemetry/src/metrics/p2_instruments.rs'
      - 'docs/quickstart/**'
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Onboarding unit tests (cheap, every PR)
  # ─────────────────────────────────────────────────────────────────
  p2-onboarding-unit:
    name: P2 onboarding unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: p2-unit
      - name: Test p2_instruments
        run: cargo test --package efe-telemetry --lib metrics::p2_instruments --release
      - name: Test v1::onboarding (types + funnel_events)
        run: cargo test --package efe-server --lib v1::onboarding --release

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Doc snippet drift (SLO-P2-DOCS-DRIFT)
  # ─────────────────────────────────────────────────────────────────
  p2-doc-snippet-drift:
    name: P2 doc snippet drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [p2-onboarding-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run doc snippet tests
        run: pytest scripts/tests/test_doc_snippets.py -q

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 — Ops manifests smoke (Prom rules + Grafana JSON + YAML)
  # ─────────────────────────────────────────────────────────────────
  p2-ops-smoke:
    name: P2 ops manifests smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus rules (promtool)
        run: |
          curl -sL https://github.com/prometheus/prometheus/releases/download/v2.55.0/prometheus-2.55.0.linux-amd64.tar.gz | tar -xz
          ./prometheus-2.55.0.linux-amd64/promtool check rules deploy/observability/prometheus/rules.p2/*.yaml
      - name: Validate Grafana dashboard JSON
        run: |
          jq '.title, (.panels | length)' deploy/observability/grafana/efe-p2-funnel.json
      - name: Validate baseline SLOs YAML
        run: python3 -c "import yaml; yaml.safe_load(open('bench_baselines/v0.2.0/p2_slos.yaml'))"

  # ─────────────────────────────────────────────────────────────────
  # JOB 4 — Playwright E2E sandbox 5-min (nightly)
  # ─────────────────────────────────────────────────────────────────
  #
  # **Audit fix D19-P2.A8** — gated par `vars.P2_E2E_PORTAL_ENABLED`
  # car les artefacts requis (Dockerfile racine + deploy/k8s/
  # p2-sandbox.yaml + portal/e2e/sandbox_5min.spec.ts) sont livrés
  # en sprint D20+ (cf. doc P2 § 12). Sans ce gate, la run nightly
  # crashait dès le premier `docker build`.
  p2-playwright-sandbox:
    name: P2 Playwright sandbox 5-min
    runs-on: ubuntu-latest
    if: |
      vars.P2_E2E_PORTAL_ENABLED == 'true' && (
        github.event_name == 'schedule' ||
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-p2-e2e'))
      )
    timeout-minutes: 20
    needs: [p2-onboarding-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Set up k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create p2-test --wait
      - name: Build efe-server image
        run: docker build -t efe-server:test .
      - name: k3d image import
        run: k3d image import efe-server:test -c p2-test
      - name: Helm install efe-stack (sandbox profile)
        run: |
          # When the chart is delivered (D21), this becomes the
          # real helm install. For now, deploy a minimal manifest.
          kubectl apply -f deploy/k8s/p2-sandbox.yaml
      - name: Wait for sandbox to be ready
        run: |
          timeout 120 bash -c 'until kubectl get pod -l app=efe-server -o jsonpath="{.items[0].status.phase}" | grep -q Running; do sleep 2; done'
      - name: Run Playwright E2E
        run: |
          cd portal
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test e2e/sandbox_5min.spec.ts --reporter=json --output=playwright-out.json
      - name: Assert T-T-Sandbox ≤ 5 min
        run: |
          duration=$(jq '.t_to_first_classify_seconds' portal/playwright-out.json)
          if [ "$duration" -gt 300 ]; then
            echo "::error::Sandbox T-T-First-Classify = ${duration} s > 300 s (SLO-P2-TTFC-2)"
            exit 1
          fi
      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-sandbox-${{ github.run_id }}
          path: portal/playwright-out.json

  # ─────────────────────────────────────────────────────────────────
  # JOB 5 — Multi-cloud parity (nightly, gated)
  # ─────────────────────────────────────────────────────────────────
  p2-multi-cloud-parity:
    name: P2 multi-cloud parity (AWS/GCP/Azure)
    if: vars.P2_E2E_CLOUDS_ENABLED == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    timeout-minutes: 60
    needs: [p2-onboarding-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: Terraform apply ${{ matrix.cloud }}
        env:
          # Auth tokens per-cloud from secrets
          AWS_ACCESS_KEY_ID: ${{ secrets.P2_AWS_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.P2_GCP_JSON }}
          AZURE_CREDENTIALS: ${{ secrets.P2_AZURE_JSON }}
        run: |
          cd terraform/examples/trial_30min
          terraform init -backend-config="cloud=${{ matrix.cloud }}"
          time terraform apply -auto-approve -var="cloud=${{ matrix.cloud }}"
      - name: Run Playwright POC 30-min flow
        run: |
          cd portal
          npm ci
          npx playwright install --with-deps chromium
          time npx playwright test e2e/poc_30min.spec.ts
      - name: Terraform destroy
        if: always()
        run: cd terraform/examples/trial_30min && terraform destroy -auto-approve
