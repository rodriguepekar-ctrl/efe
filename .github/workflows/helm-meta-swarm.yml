# PR #13 — Helm sub-chart CI gate for efe-meta-swarm.
#
# Cf. `docs/EFE_A1_PHASE2_PR13_ARCHITECTURE.md` § 27.
#
# Stages :
#   1. helm lint                    (sub-chart well-formed)
#   2. helm template (4 scenarios)  (kovant-3p / disabled / netpol / sm)
#   3. kubeconform validation       (every rendered K8s resource)
#   4. Golden snapshot diff         (catches template drift)
#   5. Manifest round-trip          (rendered manifest.yaml → Rust validator)
#   6. Parent-chart wiring          (efe-server picks up EFE_META_SWARM_* iff enabled)

name: helm-meta-swarm

on:
  pull_request:
    paths:
      - "charts/efe-stack/charts/efe-meta-swarm/**"
      - "charts/efe-stack/Chart.yaml"
      - "charts/efe-stack/Chart.lock"
      - "charts/efe-stack/values.yaml"
      - "charts/efe-stack/charts/efe-server/templates/deployment.yaml"
      - "crates/efe-meta-swarm-server/src/manifest/**"
      - "crates/efe-meta-swarm-server/tests/manifest_roundtrip.rs"
      - ".github/workflows/helm-meta-swarm.yml"
  workflow_dispatch:

env:
  HELM_VERSION: "v3.13.3"
  KUBECONFORM_VERSION: "v0.6.4"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Helm lint + template render for 4 scenarios.
  # ──────────────────────────────────────────────────────────────
  lint-and-template:
    name: Lint + template (4 scenarios)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }

      - name: helm lint (sub-chart)
        run: |
          helm lint charts/efe-stack/charts/efe-meta-swarm \
            -f charts/efe-stack/charts/efe-meta-swarm/values.yaml

      - name: helm template (kovant-3p)
        run: |
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/kovant-3p.values.yaml \
            > /tmp/kovant-3p.yaml
          wc -l /tmp/kovant-3p.yaml

      - name: helm template (kovant-disabled — expect empty render)
        run: |
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/kovant-disabled.values.yaml \
            > /tmp/kovant-disabled.yaml
          # AD2 / AC13 : disabled produces zero `kind:` lines (only the
          # "---" separator from Helm itself, ~ 1 line).
          if grep -q "^kind:" /tmp/kovant-disabled.yaml; then
            echo "FAIL — disabled scenario must produce zero resources" >&2
            cat /tmp/kovant-disabled.yaml
            exit 1
          fi

      - name: helm template (kovant-network-policy)
        run: |
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/kovant-network-policy.values.yaml \
            > /tmp/kovant-network-policy.yaml
          # Sanity : 5 NetworkPolicy objects rendered (deny-all,
          # controller-allow-ingress, controller-egress,
          # participants-allow-ingress, test-egress).
          n=$(grep -c "^kind: NetworkPolicy$" /tmp/kovant-network-policy.yaml || true)
          if [ "$n" -ne 5 ]; then
            echo "FAIL — expected 5 NetworkPolicy resources ; got $n" >&2
            exit 1
          fi

      - name: helm template (kovant-service-monitor)
        run: |
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/kovant-service-monitor.values.yaml \
            > /tmp/kovant-service-monitor.yaml
          grep -q "^kind: ServiceMonitor$" /tmp/kovant-service-monitor.yaml

      # ─── PR #14 scenarios ──────────────────────────────────────
      - name: helm template (kovant-prod)
        run: |
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/kovant-prod.values.yaml \
            > /tmp/kovant-prod.yaml
          # AC15+AC17+AC19+AC22+AC24+AC25 — full prod surface.
          grep -q "^kind: PrometheusRule$"      /tmp/kovant-prod.yaml
          grep -q "^kind: PriorityClass$"      /tmp/kovant-prod.yaml
          grep -q "^kind: NetworkPolicy$"      /tmp/kovant-prod.yaml
          grep -q "^kind: ServiceMonitor$"     /tmp/kovant-prod.yaml
          # AC18 — Grafana ConfigMap
          grep -q 'grafana_dashboard: "1"'     /tmp/kovant-prod.yaml
          # AC13 — hook SA + Role + RoleBinding present
          grep -q "^kind: Role$"               /tmp/kovant-prod.yaml
          grep -q "^kind: RoleBinding$"        /tmp/kovant-prod.yaml

      - name: helm template (kovant-hooks)
        run: |
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/kovant-hooks.values.yaml \
            > /tmp/kovant-hooks.yaml
          # AC11+AC12 — pre/post hooks rendered.
          n=$(grep -c "^kind: Job$" /tmp/kovant-hooks.yaml || true)
          if [ "$n" -ne 2 ] ; then
            echo "FAIL — expected 2 hook Jobs ; got $n" >&2 ; exit 1
          fi
          # AC14 — Role rendered.
          grep -q "^kind: Role$" /tmp/kovant-hooks.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: meta-swarm-rendered
          path: /tmp/kovant-*.yaml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 2 — kubeconform validates every rendered K8s resource.
  # CRDs (NetworkPolicy is core, ServiceMonitor is CRD) need
  # the datreeio/CRDs-catalog schema URL.
  # ──────────────────────────────────────────────────────────────
  kubeconform:
    name: kubeconform validate
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: lint-and-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meta-swarm-rendered
          path: /tmp

      - name: Install kubeconform
        run: |
          curl -L "https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz" \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: kubeconform (kovant-3p)
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.28.0 \
            -schema-location default \
            /tmp/kovant-3p.yaml

      - name: kubeconform (kovant-network-policy)
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.28.0 \
            -schema-location default \
            /tmp/kovant-network-policy.yaml

      - name: kubeconform (kovant-service-monitor — needs CRD catalog)
        run: |
          # ServiceMonitor is monitoring.coreos.com/v1 ; fetch from
          # the community CRD catalog so kubeconform doesn't choke.
          kubeconform -strict -summary \
            -kubernetes-version 1.28.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            /tmp/kovant-service-monitor.yaml

  # ──────────────────────────────────────────────────────────────
  # Job 3 — Golden snapshot diff.  Catches accidental template drift.
  # ──────────────────────────────────────────────────────────────
  golden-snapshot-diff:
    name: Golden snapshot diff
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }

      - name: Re-render + diff each scenario
        run: |
          set -euo pipefail
          for scen in kovant-3p kovant-disabled kovant-network-policy kovant-service-monitor kovant-prod kovant-hooks ; do
            echo "── ${scen} ──"
            helm template tst charts/efe-stack/charts/efe-meta-swarm \
              --namespace efe \
              -f "charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/${scen}.values.yaml" \
              > "/tmp/${scen}.rendered.yaml"
            if ! diff -u \
                "charts/efe-stack/charts/efe-meta-swarm/tests/golden/${scen}.yaml" \
                "/tmp/${scen}.rendered.yaml" ; then
              echo "FAIL — golden snapshot drift for scenario ${scen}" >&2
              echo "Run \`make update-golden\` locally + commit the diff." >&2
              exit 1
            fi
          done
          echo "✅ All golden snapshots match."

  # ──────────────────────────────────────────────────────────────
  # Job 4 — Manifest YAML round-trip through PR #8's Rust validator.
  # ──────────────────────────────────────────────────────────────
  manifest-roundtrip:
    name: Manifest YAML round-trip (Rust validator)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install yq
        run: |
          curl -L https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Extract manifest.yaml from kovant-3p render
        run: |
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/kovant-3p.values.yaml \
            | yq 'select(.kind == "ConfigMap") | .data["manifest.yaml"]' \
            > /tmp/manifest.yaml
          echo "── extracted manifest.yaml ──"
          cat /tmp/manifest.yaml

      - name: Run round-trip test
        run: |
          cd crates/efe-meta-swarm-server
          EFE_PR13_MANIFEST_PATH=/tmp/manifest.yaml \
            cargo test --test manifest_roundtrip

      # Also round-trip a poly-safety variant so the Rust validator
      # exercises the kind-discriminated path (Phase-2 PR #8 ships
      # a parser that handles all 3 variants ; we want chart-side
      # consistency).
      - name: Round-trip a poly-safety scenario
        run: |
          cat > /tmp/poly-safety.values.yaml <<'EOF'
          enabled: true
          image:
            tag: "0.2.0-test"
          manifest:
            version: "v0.2.0"
            meta:
              dim: 4
              safety:
                kind: poly
                poly:
                  dim_a: 2
                  a_flat: [1.0, 0.0, 0.0, 1.0, 1.0, 1.0, 0.0, 0.0]
                  b: [1.0, 1.0]
            iteration:
              max_iters: 100
              tolerance: 1.0e-4
              alpha_default: 0.5
              coupling_gamma: 0.2
              deterministic: true
              max_wall_ms: 15000
          EOF
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f /tmp/poly-safety.values.yaml \
            | yq 'select(.kind == "ConfigMap") | .data["manifest.yaml"]' \
            > /tmp/manifest-poly.yaml
          cd crates/efe-meta-swarm-server
          EFE_PR13_MANIFEST_PATH=/tmp/manifest-poly.yaml \
            cargo test --test manifest_roundtrip

      # AC33 — PR #14 production overlay round-trip.  The prod flavor
      # (`examples/values-prod.yaml`) bumps manifest.dim 16→32,
      # radius 50→100, tolerance 1e-4→1e-5, max_wall_ms 15000→20000.
      # We MUST guarantee Rust's `manifest::load_and_validate` accepts
      # this prod overlay byte-for-byte ; this catches silent drift
      # if anyone tweaks the schema bounds without re-running the
      # parser side.
      - name: Round-trip the PR #14 prod overlay manifest
        run: |
          helm template tst charts/efe-stack/charts/efe-meta-swarm \
            --namespace efe \
            -f charts/efe-stack/charts/efe-meta-swarm/examples/values-prod.yaml \
            | yq 'select(.kind == "ConfigMap" and (.metadata.name | test("-manifest$"))) | .data["manifest.yaml"]' \
            > /tmp/manifest-prod.yaml
          echo "── extracted prod manifest.yaml ──"
          cat /tmp/manifest-prod.yaml
          # Sanity : the prod overlay MUST set dim:32 + tolerance:1.0e-5.
          grep -q "^  dim: 32$"            /tmp/manifest-prod.yaml
          grep -q "tolerance:      1e-05"  /tmp/manifest-prod.yaml \
            || grep -q "tolerance:      1.0e-05" /tmp/manifest-prod.yaml \
            || grep -q "tolerance:      0.00001" /tmp/manifest-prod.yaml
          cd crates/efe-meta-swarm-server
          EFE_PR13_MANIFEST_PATH=/tmp/manifest-prod.yaml \
            cargo test --test manifest_roundtrip

      # AC33 — staging + canary overlays.  Cheap extra coverage —
      # the parser-side bug surface is the same regardless of values
      # but each overlay is independent territory.
      - name: Round-trip staging + canary overlays
        run: |
          for flavor in staging canary ; do
            echo "── round-trip ${flavor} overlay ──"
            helm template tst charts/efe-stack/charts/efe-meta-swarm \
              --namespace efe \
              -f "charts/efe-stack/charts/efe-meta-swarm/examples/values-${flavor}.yaml" \
              | yq 'select(.kind == "ConfigMap" and (.metadata.name | test("-manifest$"))) | .data["manifest.yaml"]' \
              > "/tmp/manifest-${flavor}.yaml"
            cd crates/efe-meta-swarm-server
            EFE_PR13_MANIFEST_PATH="/tmp/manifest-${flavor}.yaml" \
              cargo test --test manifest_roundtrip
            cd -
          done

  # ──────────────────────────────────────────────────────────────
  # Job 5 — Parent-chart wiring : verify efe-server's Deployment
  # picks up EFE_META_SWARM_* env vars iff `efe-meta-swarm.enabled = true`.
  # ──────────────────────────────────────────────────────────────
  parent-wiring:
    name: Parent efe-server wiring
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }

      - name: enabled=false — expect zero EFE_META_SWARM_* env var refs
        run: |
          out=$(helm template tst charts/efe-stack/charts/efe-server \
                  --namespace efe 2>&1 \
                | grep -c "EFE_META_SWARM" || true)
          if [ "$out" -ne 0 ]; then
            echo "FAIL — efe-server template should not contain EFE_META_SWARM_* when disabled (got $out matches)" >&2
            exit 1
          fi
          echo "✅ disabled : 0 EFE_META_SWARM_* refs"

      - name: standalone --set global.metaSwarm.enabled=true → 5 env vars
        run: |
          # ENABLED, CONTROLLER_ENDPOINT, CONNECT_TIMEOUT_MS,
          # CALL_TIMEOUT_MS, HEALTH_PROBE_AT_STARTUP = 5 var names.
          out=$(helm template tst charts/efe-stack/charts/efe-server \
                  --namespace efe \
                  --set "global.metaSwarm.enabled=true" 2>&1 \
                | grep -c "name: EFE_META_SWARM_" || true)
          if [ "$out" -ne 5 ]; then
            echo "FAIL — efe-server template should expose 5 EFE_META_SWARM_* env vars when global.metaSwarm.enabled (got $out)" >&2
            helm template tst charts/efe-stack/charts/efe-server \
              --namespace efe \
              --set "global.metaSwarm.enabled=true" 2>&1 | grep "EFE_META_SWARM_"
            exit 1
          fi
          echo "✅ standalone with global.metaSwarm.enabled : 5 EFE_META_SWARM_* env var refs"

      - name: backward-compat --set efe-meta-swarm.enabled=true → 5 env vars
        run: |
          # Backward-compat path : standalone CI callers can still
          # pass `efe-meta-swarm.enabled=true` directly (without
          # the global.metaSwarm prefix).  Template falls back to
          # the local efe-meta-swarm key when global.metaSwarm.enabled
          # is unset.
          out=$(helm template tst charts/efe-stack/charts/efe-server \
                  --namespace efe \
                  --set "efe-meta-swarm.enabled=true" 2>&1 \
                | grep -c "name: EFE_META_SWARM_" || true)
          if [ "$out" -ne 5 ]; then
            echo "FAIL — backward-compat path broken (got $out)" >&2
            exit 1
          fi
          echo "✅ backward-compat : 5 EFE_META_SWARM_* env var refs"

      - name: umbrella mode — verify efe-server inside umbrella picks up env vars
        run: |
          # The REAL test : umbrella render of the full stack, with
          # both flags flipped (Helm 3 doesn't auto-propagate sibling
          # values ; this caught a critical bug in PR #13 audit v3).
          helm dependency build charts/efe-stack
          helm template umbrella charts/efe-stack \
            --namespace efe \
            --set "efe-meta-swarm.enabled=true" \
            --set "efe-meta-swarm.image.tag=0.2.0" \
            --set "global.metaSwarm.enabled=true" \
            > /tmp/umbrella.yaml
          out=$(sed -n '/# Source: efe-stack\/charts\/efe-server\/templates\/deployment.yaml/,/^---$/p' /tmp/umbrella.yaml \
                | grep -c "name: EFE_META_SWARM_" || true)
          if [ "$out" -ne 5 ]; then
            echo "FAIL — umbrella render did not inject 5 EFE_META_SWARM_* into efe-server (got $out)" >&2
            sed -n '/# Source: efe-stack\/charts\/efe-server\/templates\/deployment.yaml/,/^---$/p' /tmp/umbrella.yaml \
              | grep "EFE_META_SWARM_" | head -20
            exit 1
          fi
          echo "✅ umbrella : efe-server receives 5 EFE_META_SWARM_* env var refs"

  # ──────────────────────────────────────────────────────────────
  # Job 6 — helm-unittest (~80 chart-level assertions across 11 suites ;
  # redundant with the umbrella workflow `helm-stack-test.yml` but
  # visible per-PR + faster failure surface).
  #
  # Suites (PR #14 audit pass) :
  #   configmap | controller | participant | hooks | observability
  #   sidecar | tenant_labels | tls | priorityclass_hpa
  #   networkpolicy | schema_rejection
  # ──────────────────────────────────────────────────────────────
  helm-unittest:
    name: helm-unittest (11 suites)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version v0.5.1

      - name: Run helm-unittest
        run: |
          helm unittest charts/efe-stack/charts/efe-meta-swarm \
            --color \
            --strict

  # ──────────────────────────────────────────────────────────────
  # Job 7 — Polaris audit on rendered manifests (severity=danger gate).
  # Aligns with the umbrella's `helm-test.yml` policy for the M12 chart.
  # ──────────────────────────────────────────────────────────────
  polaris:
    name: Polaris audit (severity=danger)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: lint-and-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meta-swarm-rendered
          path: /tmp

      - name: Install Polaris
        run: |
          curl -sLo polaris.tar.gz \
            "https://github.com/FairwindsOps/polaris/releases/download/8.5.5/polaris_linux_amd64.tar.gz"
          tar xzf polaris.tar.gz
          chmod +x polaris
          sudo mv polaris /usr/local/bin/
          polaris version

      - name: Polaris audit (kovant-3p)
        run: |
          polaris audit \
            --audit-path /tmp/kovant-3p.yaml \
            --severity danger \
            --output-format pretty

      - name: Polaris audit (kovant-network-policy)
        run: |
          polaris audit \
            --audit-path /tmp/kovant-network-policy.yaml \
            --severity danger \
            --output-format pretty

      - name: Polaris audit (kovant-service-monitor)
        run: |
          polaris audit \
            --audit-path /tmp/kovant-service-monitor.yaml \
            --severity danger \
            --output-format pretty
