name: bench-catalog

# Sprint D12.7 — runs the catalog admin scaffolding tests on every PR
# touching the catalog module, the proto, the SDK admin surface, the
# catalog CLI subcommand, or the catalog SLO registry.
#
# The full integration test suite (Rust gRPC handler + ghz load test)
# lands in D12-bis ; this workflow currently runs:
#
#   * cargo test  — the in-memory CatalogRegistry + policy + audit
#                  unit tests (27 tests, < 1 s).
#   * pytest      — Python anti-regression tests:
#                  * test_d12_disjoint_keys.py
#                  * test_d12_surface_extensions.py
#                  * test_d12_proto_contract.py
#                  * test_d12_slo_registry.py

on:
  push:
    branches: [main]
    paths:
      - "crates/efe-server/src/catalog/**"
      - "crates/efe-server/tests/d12_*.rs"
      - "protos/efe/v1/catalog.proto"
      - "clients/python/efe_tool/admin/**"
      - "clients/python/efe_tool/_proto/efe/v1/catalog_pb2*"
      - "clients/python/efe_tool/cli/commands/catalog.py"
      - "clients/python/efe_tool/cli/parser.py"
      - "scripts/parse_criterion_report.py"
      - "scripts/tests/test_d12_*.py"
      - "bench/load/parse_ghz_report.py"
      - ".github/workflows/bench-catalog.yml"
  pull_request:
    paths:
      - "crates/efe-server/src/catalog/**"
      - "crates/efe-server/tests/d12_*.rs"
      - "protos/efe/v1/catalog.proto"
      - "clients/python/efe_tool/admin/**"
      - "clients/python/efe_tool/_proto/efe/v1/catalog_pb2*"
      - "clients/python/efe_tool/cli/commands/catalog.py"
      - "clients/python/efe_tool/cli/parser.py"
      - "scripts/parse_criterion_report.py"
      - "scripts/tests/test_d12_*.py"
      - "bench/load/parse_ghz_report.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Rust : in-memory CatalogRegistry + policy + audit unit tests
  # ─────────────────────────────────────────────────────────────────
  catalog-rust:
    name: Rust catalog scaffolding tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-catalog-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run catalog module tests
        run: |
          cargo test --package efe-server --lib catalog::
        timeout-minutes: 10

      - name: Run d12 integration tests (when present)
        # When D12-bis lands `crates/efe-server/tests/d12_*.rs`
        # integration tests, they will run here automatically.
        run: |
          set -e
          count=$(find crates/efe-server/tests -name 'd12_*.rs' 2>/dev/null | wc -l)
          if [[ "$count" -gt 0 ]]; then
            echo "Found $count D12 integration test files ; running"
            cargo test --workspace --release --test 'd12_*' -- --test-threads 1
          else
            echo "::notice::No D12 integration tests yet — scaffolding only"
          fi
        timeout-minutes: 20

  # ─────────────────────────────────────────────────────────────────
  # Python anti-regression suite (proto contract + SLO registry +
  # disjoint keys)
  # ─────────────────────────────────────────────────────────────────
  catalog-python:
    name: Python anti-regression tests (D12)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install efe-tool + dev deps
        run: |
          pip install -e ./clients/python
          pip install pytest pyyaml

      - name: Run D12 anti-regression suite
        run: |
          pytest scripts/tests/test_d12_*.py -v --tb=short
