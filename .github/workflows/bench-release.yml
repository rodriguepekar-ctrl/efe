# PR #21 § 14.3 — bench-release : runs on tag, regenerates baselines, opens PR.

name: bench-release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Chart tag (e.g. v0.7.0)"
        required: true

jobs:
  bench-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: helm/kind-action@v1
        with:
          cluster_name: bench-release
          version: 'v0.24.0'

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VER="${TAG#v}"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "tag_ver=$TAG_VER" >> "$GITHUB_OUTPUT"

      # PR #21 § 14 — G1/G2 closure : install the chart version under
      # test before running the suite.
      - name: Install efe-meta-swarm chart at ${{ steps.tag.outputs.tag }}
        run: |
          set -eo pipefail
          helm repo add efe https://efe.github.io/charts || true
          helm repo update
          helm install efe-meta-swarm efe/efe-meta-swarm \
              --version ${{ steps.tag.outputs.tag_ver }} \
              --namespace efe --create-namespace \
              --set serviceMonitor.enabled=false \
              --wait --timeout 5m
          kubectl wait --for=condition=ready pod \
              -l app.kubernetes.io/name=efe-meta-swarm-controller \
              -n efe --timeout=180s

      - name: Port-forward controller
        run: |
          set -eo pipefail
          kubectl port-forward -n efe svc/efe-meta-swarm-controller \
              50051:50051 > /tmp/pf.log 2>&1 &
          echo $! > /tmp/pf.pid
          for i in $(seq 1 30) ; do
            nc -zv localhost 50051 2>/dev/null && exit 0
            sleep 1
          done
          echo "port-forward did not come up in 30s — log:"
          cat /tmp/pf.log
          exit 1

      - name: Build harness
        run: cargo build --release -p efe-bench-harness

      - name: Run full bench suite
        run: |
          set -o pipefail
          ./target/release/efe-bench-harness run \
              --all --provisioner external \
              --kubeconfig "$HOME/.kube/config" \
              --target-override grpc://localhost:50051 \
              --chart-version ${{ steps.tag.outputs.tag_ver }} \
              --verdict-json-file /tmp/verdict.json

      - name: Stop port-forward
        if: always()
        run: |
          [ -f /tmp/pf.pid ] && kill "$(cat /tmp/pf.pid)" || true

      - name: Regen baselines (AD16)
        run: |
          ./target/release/efe-bench-harness baseline-regen \
              --chart-version ${{ steps.tag.outputs.tag_ver }} \
              --release-tag-confirmed

      - name: Open baseline-update PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(bench): regen baseline ${{ steps.tag.outputs.tag }}"
          branch: bench-baseline-${{ steps.tag.outputs.tag }}
          title: "[bench] Baseline regen for ${{ steps.tag.outputs.tag }}"
          body: |
            Auto-generated baseline regen for release ${{ steps.tag.outputs.tag }}.

            Files added :
            - `bench_baselines/v${{ steps.tag.outputs.tag_ver }}/L2/*.json`
            - `bench_baselines/v${{ steps.tag.outputs.tag_ver }}/manifest.json`

            See PR #21 § 13 + § 14.3.
          add-paths: |
            bench_baselines/**
          sign-commits: true
