# Sprint **Φ-D-AL Completion (D79)** — Active Learning nightly bench.
#
# Cf. docs/EFE_ACTIVE_LEARNING_COMPLETION_ARCHITECTURE.md § 16 + artefact #37.
#
# Triggers : nightly + workflow_dispatch + release tags.
# Bench  : LLM oracle latency, human review latency, gold-queue, retune.

name: al-bench

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC nightly
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  llm-labeling-latency:
    name: LLM oracle labeling p99 ≤ 30s (stub)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stub LLM labeling latency
        run: |
          mkdir -p target/active_learning
          cat > target/active_learning/llm_latency.json << 'EOF'
          {
            "slo_compliance": {
              "SLO-AL-LLM-LABELING-LATENCY-P99": {
                "skip_reason": "Live LLM oracle bench requires provider credentials (DT-AL-LIVE-BENCH)"
              }
            }
          }
          EOF

  human-review-latency:
    name: Human review p99 ≤ 330s (stub)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stub human review latency
        run: |
          mkdir -p target/active_learning
          cat > target/active_learning/review_latency.json << 'EOF'
          {
            "slo_compliance": {
              "SLO-AL-HUMAN-REVIEW-LATENCY-P99": {
                "skip_reason": "Live human-review timing requires SaaS UI telemetry (DT-AL-REVIEW-TELEMETRY)"
              }
            }
          }
          EOF

  gold-queue-size:
    name: Gold queue ≤ 10 000
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stub gold-queue size
        run: |
          mkdir -p target/active_learning
          cat > target/active_learning/gold_queue.json << 'EOF'
          {
            "slo_compliance": {
              "SLO-AL-GOLD-QUEUE-SIZE": {
                "skip_reason": "Live Redis queue stats required (DT-AL-QUEUE-STATS)"
              }
            }
          }
          EOF

  retune-latency:
    name: Retune cycle p99 ≤ 1h (stub)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stub retune latency
        run: |
          mkdir -p target/active_learning
          cat > target/active_learning/retune_latency.json << 'EOF'
          {
            "slo_compliance": {
              "SLO-AL-RETUNE-LATENCY": {
                "skip_reason": "Live retune timing requires production-like corpus (DT-AL-RETUNE-CORPUS)"
              },
              "SLO-AL-CENTROID-UPDATE-FREQUENCY": {
                "skip_reason": "Live retune cron audit requires production schedule (DT-AL-RETUNE-CRON)"
              }
            }
          }
          EOF

  auto-confirm:
    name: Auto-confirm coverage ≥ 60 %
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stub auto-confirm coverage
        run: |
          mkdir -p target/active_learning
          cat > target/active_learning/auto_confirm.json << 'EOF'
          {
            "slo_compliance": {
              "SLO-AL-AUTO-CONFIRM-COVERAGE": {
                "skip_reason": "Live auto-confirm rate requires production telemetry (DT-AL-CONFIRM-STATS)"
              }
            }
          }
          EOF

  summary:
    name: Bench summary + SLO gating
    needs: [llm-labeling-latency, human-review-latency, gold-queue-size, retune-latency, auto-confirm]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: Recreate stub artifacts in-place
        run: |
          mkdir -p target/active_learning
          cat > target/active_learning/llm_latency.json << 'EOF'
          { "slo_compliance": { "SLO-AL-LLM-LABELING-LATENCY-P99": { "skip_reason": "Live LLM oracle bench requires provider credentials (DT-AL-LIVE-BENCH)" } } }
          EOF
          cat > target/active_learning/review_latency.json << 'EOF'
          { "slo_compliance": { "SLO-AL-HUMAN-REVIEW-LATENCY-P99": { "skip_reason": "Live human-review timing requires SaaS UI telemetry (DT-AL-REVIEW-TELEMETRY)" } } }
          EOF
          cat > target/active_learning/gold_queue.json << 'EOF'
          { "slo_compliance": { "SLO-AL-GOLD-QUEUE-SIZE": { "skip_reason": "Live Redis queue stats required (DT-AL-QUEUE-STATS)" } } }
          EOF
          cat > target/active_learning/retune_latency.json << 'EOF'
          { "slo_compliance": { "SLO-AL-RETUNE-LATENCY": { "skip_reason": "Live retune timing requires production-like corpus (DT-AL-RETUNE-CORPUS)" }, "SLO-AL-CENTROID-UPDATE-FREQUENCY": { "skip_reason": "Live retune cron audit requires production schedule (DT-AL-RETUNE-CRON)" } } }
          EOF
          cat > target/active_learning/auto_confirm.json << 'EOF'
          { "slo_compliance": { "SLO-AL-AUTO-CONFIRM-COVERAGE": { "skip_reason": "Live auto-confirm rate requires production telemetry (DT-AL-CONFIRM-STATS)" } } }
          EOF
      - name: Merge + report
        run: |
          python3 -c "
          import json, glob
          out = {'slo_compliance': {}}
          for f in glob.glob('target/active_learning/*.json'):
              try: d = json.load(open(f))
              except Exception: continue
              for k, v in d.get('slo_compliance', {}).items():
                  out['slo_compliance'][k] = v
          json.dump(out, open('target/active_learning/bench_consolidated.json', 'w'), indent=2)
          print(f'merged {len(out[\"slo_compliance\"])} SLOs (all stub)')
          "
          python3 eval/scripts/check_slo.py \
              --baseline bench_baselines/v0.6.0/al_slos.yaml \
              --measure target/active_learning/bench_consolidated.json \
              --report target/active_learning/bench_report.md
          cat target/active_learning/bench_report.md
