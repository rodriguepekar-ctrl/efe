# Sprint D26 (Φ-B) — `efe-sdk-java` PR-gate test workflow.
#
# Cf. docs/EFE_JAVA_SDK_EXTENSION_ARCHITECTURE.md.
#
# Matrix : 3 OS × 2 JDK versions (Linux/macOS/Windows × 17/21).
# A separate job runs the Python pin tests (anti-régression structurelle).
# Bundle size assertion (Core JAR ≤ 500 KB) runs post-package.

name: sdk-java-test

on:
  pull_request:
    paths:
      - "clients/java/efe-sdk/**"
      - "scripts/tests/test_d26_java_sdk_*.py"
      - ".github/workflows/sdk-java-test.yml"
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Build + test matrix.
  # ──────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        java: ["17", "21"]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/java/efe-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: "maven"

      - name: Validate POM (mvn validate)
        run: ./mvnw -B -ntp validate

      - name: Generate proto stubs
        run: ./mvnw -B -ntp -pl efe-sdk-core generate-sources

      - name: Compile (with -Werror)
        run: ./mvnw -B -ntp compile

      - name: Test (JUnit 5 + JaCoCo)
        run: ./mvnw -B -ntp test

      - name: Verify (JaCoCo coverage check + integration)
        run: ./mvnw -B -ntp verify -DskipTests=false

      - name: Package (JAR + sources JAR + javadoc JAR)
        run: ./mvnw -B -ntp -DskipTests package

      - name: Assert core JAR size ≤ 500 KB
        if: matrix.os == 'ubuntu-22.04' && matrix.java == '17'
        run: |
          set -euo pipefail
          JAR=$(find efe-sdk-core/target -maxdepth 1 -name 'efe-sdk-java-*.jar' \
                ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          SIZE=$(stat -c%s "$JAR" 2>/dev/null || stat -f%z "$JAR")
          echo "Core JAR size : $SIZE bytes"
          if [[ "$SIZE" -gt 512000 ]]; then
            echo "::error::core JAR exceeds 500 KB budget : $SIZE"
            exit 1
          fi

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-22.04' && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-java-coverage
          path: clients/java/efe-sdk/efe-sdk-core/target/site/jacoco/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Javadoc clean check.
  # ──────────────────────────────────────────────────────────────
  javadoc:
    name: Javadoc clean
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/java/efe-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17", cache: "maven" }
      - name: Run javadoc:javadoc
        run: ./mvnw -B -ntp -DskipTests javadoc:javadoc
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # Job 3 — 3 Spring Boot examples build.
  # ──────────────────────────────────────────────────────────────
  examples:
    name: Spring Boot examples build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17", cache: "maven" }

      - name: Install SDK to local Maven repo
        working-directory: clients/java/efe-sdk
        run: ./mvnw -B -ntp -DskipTests install

      - name: Build spring-boot-mvc
        working-directory: clients/java/efe-sdk/examples/spring-boot-mvc
        run: ./mvnw -B -ntp -DskipTests package
        # The example uses spring-boot-starter-parent ; mvnw is auto-downloaded
        # by Spring Boot Maven Plugin if not committed.
        continue-on-error: true

      - name: Build spring-boot-webflux
        working-directory: clients/java/efe-sdk/examples/spring-boot-webflux
        run: ./mvnw -B -ntp -DskipTests package
        continue-on-error: true

      - name: Build spring-boot-actuator
        working-directory: clients/java/efe-sdk/examples/spring-boot-actuator
        run: ./mvnw -B -ntp -DskipTests package
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # Job 4 — Python pin tests (structural anti-régression).
  # ──────────────────────────────────────────────────────────────
  pin-tests:
    name: Pin tests (Python — structure)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install pytest
        run: pip install pytest
      - name: Run efe-sdk-java pin tests
        run: |
          python -m pytest scripts/tests/test_d26_java_sdk_extension.py \
            -v --tb=short

  # ──────────────────────────────────────────────────────────────
  # Job 5 — Bash syntax check.
  # ──────────────────────────────────────────────────────────────
  bash-syntax:
    name: Bash syntax (scripts/)
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    defaults:
      run:
        working-directory: clients/java/efe-sdk
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done
          echo "✅ all scripts parse OK"
