name: portal-admin-test

on:
  pull_request:
    paths:
      - "apps/portal-admin/**"
      - ".github/workflows/portal-admin-test.yml"
  push:
    branches: [main]
    paths:
      - "apps/portal-admin/**"

defaults:
  run:
    working-directory: apps/portal-admin

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/portal-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit -- --reporter=verbose

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/portal-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - env:
          NEXTAUTH_SECRET: dummy-ci-secret
          OIDC_ISSUER: https://example.com
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
        run: pnpm build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/portal-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright install --with-deps ${{ matrix.browser }}
      - env:
          NEXTAUTH_SECRET: dummy-ci-secret
          OIDC_ISSUER: https://example.com
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
        run: pnpm test:e2e --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/portal-admin/playwright-report
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t portal-admin:ci .
      - name: Verify image size budget (<= 200 MB)
        run: |
          SIZE=$(docker image inspect portal-admin:ci --format='{{.Size}}')
          echo "Image size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt 209715200 ]; then
            echo "::error::Image size $((SIZE / 1024 / 1024)) MB exceeds 200 MB budget"
            exit 1
          fi
      - name: Trivy image scan (HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: portal-admin:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
