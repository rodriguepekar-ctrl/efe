# PR #20 § 26.2 + AC29 — nightly + on-demand SLO regression workflow.
#
# Runs the loadgen `slo-validation-5min.yaml` profile against a kind-
# cluster meta-swarm install, parses the JSON summary, and either :
#   - posts a "✅ SLO regression pass" comment on the PR (success)
#   - posts a "❌ SLO breach" comment with the violation details
#     (loadgen exit code 1 → AD17 SloBreach)
#
# Triggers :
#   - nightly (cron 03:30 UTC, when traffic is naturally low)
#   - on-demand by labelling a PR with `slo-regression`
#   - workflow_dispatch (manual via GitHub UI)

name: pr20-loadgen-slo-regression

on:
  schedule:
    - cron: '30 3 * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile YAML path (relative to repo root)"
        required: false
        default: "tools/loadgen/examples/slo-validation-5min.yaml"
      duration_override:
        description: "Optional --duration override (e.g., 2m)"
        required: false
        default: ""

concurrency:
  group: pr20-slo-regression-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  slo-regression:
    # Run only when triggered by the `slo-regression` label or schedule/manual.
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'slo-regression')
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup helm 3.14
        uses: azure/setup-helm@v4
        with: { version: '3.14.0' }

      - name: Setup kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pr20-slo-regression
          version: 'v0.24.0'

      - name: Install efe-meta-swarm (controller + 3 participants)
        run: |
          helm install efe-meta-swarm ./charts/efe-stack/charts/efe-meta-swarm \
              --namespace efe --create-namespace \
              --set enabled=true \
              --set image.tag=ci-test \
              --wait --timeout 5m

      - name: Build loadgen binary
        run: cargo build --release -p efe-meta-swarm-loadgen

      - name: Port-forward controller to localhost:50051
        run: |
          kubectl -n efe port-forward svc/efe-meta-swarm-controller 50051:50051 &
          # Allow port-forward to establish
          for i in 1 2 3 4 5 ; do
            sleep 2
            if nc -zv localhost 50051 2>/dev/null ; then break ; fi
          done

      - name: Run SLO regression profile
        id: slo
        run: |
          set -o pipefail
          PROFILE="${{ github.event.inputs.profile || 'tools/loadgen/examples/slo-validation-5min.yaml' }}"
          DURATION_OVERRIDE="${{ github.event.inputs.duration_override }}"

          mkdir -p /tmp/slo
          ARGS=(run --profile "$PROFILE")
          # Force the run to target the port-forwarded controller (override
          # the profile's in-cluster DNS endpoint).
          ARGS+=(--target "grpc://localhost:50051")
          ARGS+=(--output-format ndjson)
          ARGS+=(--output-file /tmp/slo/result.ndjson)
          if [[ -n "$DURATION_OVERRIDE" ]] ; then
            ARGS+=(--duration "$DURATION_OVERRIDE")
          fi

          # Capture exit code without aborting the workflow — we post a
          # PR comment based on the code (AD17).
          set +e
          ./target/release/efe-meta-swarm-loadgen "${ARGS[@]}" \
              | tee /tmp/slo/summary.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Extract JSON summary
        id: parse
        run: |
          # The loadgen prints the JSON summary as its last stdout block
          # (engine::dispatch_run → serde_json::to_string_pretty).
          # Grab the last JSON object from the captured output.
          python3 << 'PY'
          import json, os, re, pathlib
          raw = pathlib.Path("/tmp/slo/summary.json").read_text()
          # Match the last balanced JSON object.
          match = re.search(r'\{\s*"run_id".*\}', raw, re.DOTALL)
          if not match:
              print("::error::could not extract JSON summary from loadgen output")
              raise SystemExit(2)
          summary = json.loads(match.group(0))
          for k, v in summary.items():
              print(f"summary_{k}={v}")
              os.system(f'echo "summary_{k}={v}" >> "$GITHUB_OUTPUT"')
          PY

      - name: Comment on PR (success)
        if: |
          github.event_name == 'pull_request'
          && steps.slo.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ SLO regression check : PASS

              **Profile** : \`${{ github.event.inputs.profile || 'tools/loadgen/examples/slo-validation-5min.yaml' }}\`
              **Total requests** : ${{ steps.parse.outputs.summary_total_requests }}
              **Duration (s)** : ${{ steps.parse.outputs.summary_duration_s }}
              **p50 / p95 / p99** : ${{ steps.parse.outputs.summary_p50 }} / ${{ steps.parse.outputs.summary_p95 }} / ${{ steps.parse.outputs.summary_p99 }}
              **Error rate** : ${{ steps.parse.outputs.summary_error_rate }}
              **Stop reason** : ${{ steps.parse.outputs.summary_stop_reason }}

              All STABILITY_CONTRACT v1.1 SLOs met.`
            })

      - name: Comment on PR (breach)
        if: |
          github.event_name == 'pull_request'
          && steps.slo.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ SLO regression check : BREACH

              **Exit code** : ${{ steps.slo.outputs.exit_code }}  (AD17 — see docs/EFE_A1_PHASE2_PR20_ARCHITECTURE.md § 34)
              **Profile** : \`${{ github.event.inputs.profile || 'tools/loadgen/examples/slo-validation-5min.yaml' }}\`
              **Total requests** : ${{ steps.parse.outputs.summary_total_requests }}
              **Duration (s)** : ${{ steps.parse.outputs.summary_duration_s }}
              **p50 / p95 / p99** : ${{ steps.parse.outputs.summary_p50 }} / ${{ steps.parse.outputs.summary_p95 }} / ${{ steps.parse.outputs.summary_p99 }}
              **Error rate** : ${{ steps.parse.outputs.summary_error_rate }}
              **Stop reason** : ${{ steps.parse.outputs.summary_stop_reason }}

              Follow [RB_PR19_MSW9](docs/runbooks/RB_PR19_MSW9.md) for triage.`
            })

      - name: Upload result artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-result-${{ github.run_id }}
          path: |
            /tmp/slo/result.ndjson
            /tmp/slo/summary.json
          retention-days: 14

      - name: Fail step on SLO breach
        if: steps.slo.outputs.exit_code != '0'
        run: |
          echo "::error::Loadgen exited with code ${{ steps.slo.outputs.exit_code }} (AD17 SloBreach)"
          exit 1
