name: canary-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to roll out as canary"
        required: true
        default: "latest"
      percent:
        description: "Traffic percentage to route to canary (5/25/50/100)"
        required: true
        default: "5"

permissions:
  contents: read
  id-token: write       # OIDC for cloud auth

jobs:
  canary:
    name: canary ${{ inputs.percent }}%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod-canary
    steps:
      - uses: actions/checkout@v4

      - name: Configure cloud credentials (AWS example)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Kubeconfig
        run: aws eks update-kubeconfig --name efe-prod --region eu-west-1

      - name: Verify image signature (cosign)
        run: |
          cosign verify \
            --certificate-identity-regexp '.*' \
            --certificate-oidc-issuer-regexp '.*' \
            ghcr.io/efe-project/efe:${{ inputs.image_tag }}

      - name: Apply canary Deployment
        run: |
          helm upgrade efe-canary deploy/helm/efe \
            --namespace efe \
            --install \
            --values deploy/helm/efe/values.prod.yaml \
            --set image.tag=${{ inputs.image_tag }} \
            --set canary.enabled=true \
            --set canary.weight=${{ inputs.percent }} \
            --wait --timeout 10m

      - name: Smoke test (classify + healthcheck)
        # `kubectl run` must not use `-it` inside a GitHub Action
        # (no interactive TTY available → container fails to start).
        # We run a short-lived pod that curls the in-cluster endpoint
        # and report its exit code via `kubectl wait + logs`.
        run: |
          set -Eeuo pipefail
          kubectl -n efe run smoke-$GITHUB_RUN_ID \
            --image=curlimages/curl:8.11.0 \
            --restart=Never \
            --command -- \
            curl -sSf -o /dev/null -w '%{http_code}\n' \
              -H "Authorization: Bearer ${{ secrets.EFE_CANARY_SMOKE_TOKEN }}" \
              https://efe-server.efe.svc.cluster.local:50053/healthz
          kubectl -n efe wait --for=condition=Ready pod/smoke-$GITHUB_RUN_ID --timeout=30s
          CODE=$(kubectl -n efe logs pod/smoke-$GITHUB_RUN_ID | tail -1)
          kubectl -n efe delete pod smoke-$GITHUB_RUN_ID --wait=false
          test "$CODE" = "200" || { echo "smoke failed with code=$CODE"; exit 1; }

      - name: Wait 5 min then check SLO burn
        run: sleep 300

      - name: PromQL SLO check
        id: slo
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          ERR=$(curl -sG "$PROMETHEUS_URL/api/v1/query" \
            --data-urlencode 'query=sum(rate(efe_classify_errors_total{deployment="efe-canary"}[5m]))/sum(rate(efe_classify_requests_total{deployment="efe-canary"}[5m]))' \
            | jq -r '.data.result[0].value[1] // "0"')
          echo "error_rate=$ERR" >> "$GITHUB_OUTPUT"
          if (( $(echo "$ERR > 0.02" | bc -l) )); then
            echo "Error rate $ERR > 2 % — aborting"; exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          helm uninstall efe-canary --namespace efe --wait --timeout 5m || true
          kubectl -n efe rollout undo deployment/efe-server

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: efe-deploys
          slack-message: |
            Canary ${{ inputs.image_tag }} at ${{ inputs.percent }}%: ${{ job.status }}
            error rate observed: ${{ steps.slo.outputs.error_rate || 'n/a' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
