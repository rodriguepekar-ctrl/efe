# Sprint **Φ-C-SDK Completion (D34)** — Cross-SDK contract test workflow.
#
# Cf. docs/EFE_POLYGLOT_SDKS_COMPLETION_ARCHITECTURE.md § 5 + artefact #35.
#
# Triggers : PR + nightly + workflow_dispatch.
#
# Gates SLO-SDK-CONTRACT (= 400/400 bit-identity passes).
# Also gates SLO-SDK-PROTO-HASH, SLO-SDK-VERSION-SYNC, SLO-SDK-API-SURFACE,
# SLO-SDK-DOC-{GO,TS,JAVA}.
#
# Time budget : ~ 10 min (= docker-compose build + 4 runners + comparator).

name: sdk-quartet-contract

on:
  pull_request:
    paths:
      - "protos/**"
      - "clients/**"
      - "sdk/contract-runner/**"
      - "scripts/sdk/**"
      - "bench_baselines/v0.6.0/sdk_*.{yaml,txt}"
      - ".github/workflows/sdk-quartet-contract.yml"
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC nightly
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 1. Fast pre-flight (= file existence + structural pin tests).
  # ───────────────────────────────────────────────────────────────────
  pre-flight:
    name: Pin tests (structural)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pin test deps
        run: pip install pytest pyyaml
      - name: Run polyglot SDK pin tests
        run: pytest scripts/tests/test_polyglot_sdk_structure.py -v --tb=short

  # ───────────────────────────────────────────────────────────────────
  # 2. Proto hash + version sync (= D-SDK-2 + D-SDK-6 enforcement).
  # ───────────────────────────────────────────────────────────────────
  proto-and-version-sync:
    name: Proto + version sync
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Verify proto hash matches baseline
        run: |
          set -e
          NEW=$(find protos/efe/v1 -name '*.proto' -print0 \
              | sort -z | xargs -0 cat | sha256sum | awk '{print $1}')
          EXPECTED=$(cat bench_baselines/v0.6.0/sdk_proto_hash.txt | tr -d '[:space:]')
          echo "current : $NEW"
          echo "pinned  : $EXPECTED"
          if [ "$EXPECTED" != "PLACEHOLDER_compute_at_freeze" ] && [ "$NEW" != "$EXPECTED" ]; then
            echo "::error::Proto hash drift detected. Run scripts/sdk/regen_all.sh with SDK_PROTO_BUMP=yes if intentional."
            exit 1
          fi
      - name: Verify version sync
        run: python scripts/sdk/verify_version_sync.py
      - name: Upload version sync compliance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-version-sync
          path: target/sdk/version_sync.json

  # ───────────────────────────────────────────────────────────────────
  # 3. Contract test (= mock mode, fast — no backend needed).
  # ───────────────────────────────────────────────────────────────────
  contract-mock:
    name: Contract test (mock)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [pre-flight]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Python deps for runner-py + compare
        run: pip install numpy

      - name: Ensure fixtures exist (= regenerate if absent)
        run: |
          if [ ! -f sdk/contract-runner/fixtures/quartet_fixtures.json ]; then
            python3 sdk/contract-runner/generate_fixtures.py
          fi

      - name: Run Python runner
        run: |
          EFE_CONTRACT_MOCK=1 python3 sdk/contract-runner/runners/py/main.py \
            --fixtures sdk/contract-runner/fixtures/quartet_fixtures.json \
            --out sdk/contract-runner/shared/out_py.json

      - name: Build + run Go runner
        run: |
          cd sdk/contract-runner/runners/go
          go build -o /tmp/runner-go .
          EFE_CONTRACT_MOCK=1 /tmp/runner-go \
            -fixtures ../../fixtures/quartet_fixtures.json \
            -out ../../shared/out_go.json

      - name: Install + run TS runner
        run: |
          cd sdk/contract-runner/runners/ts
          npm install --silent --no-audit --no-fund
          EFE_CONTRACT_MOCK=1 \
            FIXTURES_PATH=../../fixtures/quartet_fixtures.json \
            OUT_PATH=../../shared/out_ts.json \
            npx tsx main.ts

      - name: Build + run Java runner
        run: |
          cd sdk/contract-runner/runners/java
          javac --release 21 Main.java
          EFE_CONTRACT_MOCK=1 \
            FIXTURES_PATH=../../fixtures/quartet_fixtures.json \
            OUT_PATH=../../shared/out_java.json \
            java Main

      - name: Compare verdicts (= SLO-SDK-CONTRACT gating)
        run: |
          python3 sdk/contract-runner/compare.py \
            --go     sdk/contract-runner/shared/out_go.json \
            --ts     sdk/contract-runner/shared/out_ts.json \
            --java   sdk/contract-runner/shared/out_java.json \
            --py     sdk/contract-runner/shared/out_py.json \
            --out    target/sdk/contract.json

      - name: Gate via check_slo.py
        run: |
          pip install pyyaml
          python3 eval/scripts/check_slo.py \
            --baseline bench_baselines/v0.6.0/sdk_slos.yaml \
            --measure target/sdk/contract.json \
            --strict-skip \
            --report target/sdk/contract_report.md
          cat target/sdk/contract_report.md

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-contract-mock
          path: |
            sdk/contract-runner/shared/*.json
            target/sdk/*.json
            target/sdk/*.md

  # ───────────────────────────────────────────────────────────────────
  # 4. Doc coverage (= 3 SDKs gated).
  # ───────────────────────────────────────────────────────────────────
  doc-coverage:
    name: Doc coverage cross-SDK
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run doc coverage verifier
        run: python3 scripts/sdk/verify_doc_coverage.py --min 0.90
      - name: Upload compliance JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-doc-coverage
          path: target/sdk/doc_coverage.json

  # ───────────────────────────────────────────────────────────────────
  # 5. Summary — fail the workflow if any prior job failed.
  # ───────────────────────────────────────────────────────────────────
  summary:
    name: Contract suite summary
    needs:
      - pre-flight
      - proto-and-version-sync
      - contract-mock
      - doc-coverage
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Aggregate
        run: |
          echo "pre-flight              : ${{ needs.pre-flight.result }}"
          echo "proto-and-version-sync  : ${{ needs.proto-and-version-sync.result }}"
          echo "contract-mock           : ${{ needs.contract-mock.result }}"
          echo "doc-coverage            : ${{ needs.doc-coverage.result }}"
          for r in "${{ needs.pre-flight.result }}" \
                   "${{ needs.proto-and-version-sync.result }}" \
                   "${{ needs.contract-mock.result }}" \
                   "${{ needs.doc-coverage.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::Φ-C-SDK contract suite FAILED — see prior jobs"
              exit 1
            fi
          done
          echo "Φ-C-SDK contract suite : ALL GREEN"
