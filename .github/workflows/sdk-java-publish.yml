# Sprint D26 (Φ-B) — `efe-sdk-java` Maven publish workflow.
#
# Triggers on tags `v*.*.*`. For v0.x : publishes to GitHub Packages
# (private). For v1.x.x : publishes to Maven Central via Sonatype
# Central Portal.
#
# Required GitHub secrets :
#   - GPG_PRIVATE_KEY : ASCII-armored GPG private key.
#   - GPG_PASSPHRASE  : passphrase for the key.
#   - CENTRAL_USERNAME / CENTRAL_PASSWORD : Sonatype Central Portal token (public mode).
#   - GITHUB_TOKEN provided by GitHub Actions automatically (private mode).

name: sdk-java-publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode : private | public"
        required: false
        default: "private"

jobs:
  publish:
    name: Publish efe-sdk-java
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/java/efe-sdk
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
          server-id: ${{ github.event.inputs.mode == 'public' && 'central' || 'github' }}
          server-username: ${{ github.event.inputs.mode == 'public' && 'CENTRAL_USERNAME' || 'GITHUB_USERNAME' }}
          server-password: ${{ github.event.inputs.mode == 'public' && 'CENTRAL_PASSWORD' || 'GITHUB_TOKEN' }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Validate POM
        run: ./mvnw -B -ntp validate

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Verify tag matches POM version
        run: |
          set -euo pipefail
          POM_VERSION=$(./mvnw -q -Dexec.executable=echo -Dexec.args='${project.version}' \
              --non-recursive exec:exec)
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" != "v$POM_VERSION" ]]; then
            echo "::error::tag $TAG does not match POM version $POM_VERSION"
            exit 1
          fi

      - name: Publish (private — GitHub Packages)
        if: github.event.inputs.mode != 'public'
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B -ntp -DskipTests deploy

      - name: Publish (public — Maven Central)
        if: github.event.inputs.mode == 'public'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          POM_VERSION=$(./mvnw -q -Dexec.executable=echo -Dexec.args='${project.version}' \
              --non-recursive exec:exec)
          if [[ ! "$POM_VERSION" =~ ^1\. ]]; then
            echo "::error::public publish requires v1.x.x ; got $POM_VERSION"
            exit 5
          fi
          ./mvnw -B -ntp -DskipTests -P release deploy
