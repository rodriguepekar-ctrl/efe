# PR #22 § 17 — slo-quarterly : T3 rollup on the 1st of {Apr,Jul,Oct,Jan}
# at 04:00 UTC.  Signs the PDF with cosign keyless OIDC and opens a PR.

name: slo-quarterly

on:
  schedule:
    - cron: "0 4 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      period:
        description: "Quarter (Q1-2026 etc — defaults to previous quarter)"
        required: false
      chart_version:
        description: "Chart version"
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write       # OIDC for cosign keyless

jobs:
  quarterly:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Build
        run: cargo build --release -p efe-slo-rollup

      - name: Resolve quarter
        id: q
        run: |
          PERIOD="${{ github.event.inputs.period }}"
          if [ -z "$PERIOD" ] ; then
            MONTH=$(date -u -d '1 day ago' +%m)
            YEAR=$(date -u -d '1 day ago' +%Y)
            Q=$(( ( (10#$MONTH - 1) / 3 ) + 1 ))
            if [ "$Q" = "1" ] ; then Q=4 ; YEAR=$(( YEAR - 1 )) ; else Q=$(( Q - 1 )) ; fi
            PERIOD="Q${Q}-${YEAR}"
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Run T3 (with cosign keyless OIDC)
        env:
          EFE_CHART_VERSION: ${{ github.event.inputs.chart_version || vars.SLO_CHART_VERSION }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -eo pipefail
          ./target/release/efe-slo-rollup rollup \
              --stage t3 \
              --period "${{ steps.q.outputs.period }}" \
              --chart-version "$EFE_CHART_VERSION" \
              --region "${{ vars.SLO_REGION || 'global' }}" \
              --storage-root ./slos \
              --cosign-identity "https://token.actions.githubusercontent.com"

      - name: Verify the signature locally before opening PR
        run: |
          ./target/release/efe-slo-rollup evidence verify \
              ./slos/v${{ vars.SLO_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.pdf

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(slo): quarterly evidence ${{ steps.q.outputs.period }}"
          branch: slo-quarterly-${{ steps.q.outputs.period }}
          title: "[SLO] Quarterly evidence ${{ steps.q.outputs.period }} (signed)"
          body: |
            Auto-generated by `slo-quarterly.yml`.  Cosign keyless OIDC signature attached.

            Files :
            - `slos/v${{ vars.SLO_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.json`
            - `slos/v${{ vars.SLO_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.pdf`
            - `slos/v${{ vars.SLO_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.pdf.bundle`

            Verifier :
            ```bash
            efe-slo-rollup evidence verify slos/v${{ vars.SLO_CHART_VERSION }}/quarterly/${{ steps.q.outputs.period }}.pdf
            ```

            STABILITY_CONTRACT v1.4 § 22.
          add-paths: |
            slos/**
