# Sprint **Φ-D-MODE3 Completion (D74)** — daily human review SLA drill.
#
# Cf. docs/EFE_MODE3_MULTI_TURN_COMPLETION_ARCHITECTURE.md § 9.4.
#
# Simulates a low_confidence escalation each day and verifies :
#   * Auto-assignment ≤ 30 s
#   * Total escalation → decided ≤ 5 min 30 s
# Failure → PagerDuty SEV2 (= human review path broken).

name: mode3-human-review-drill

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  drill:
    name: Human review escalation drill
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Simulate low_confidence escalation
        run: |
          mkdir -p target/mode3
          # Live mode would POST to efe-server simulating a session with
          # confidence < 0.5 + verify the review queue receives it within
          # 30 s + verify auto-test-reviewer approves within 5 min 30 s.
          # Stub mode emits skip_reason.
          cat > target/mode3/human_review_drill.json << 'EOF'
          {
            "slo_compliance": {
              "SLO-MODE3-HUMAN-REVIEW-LATENCY-P99": {
                "skip_reason": "Live human review drill requires production review system (DT-MODE3-DRILL-LIVE)"
              }
            }
          }
          EOF
          echo "Drill stub : SKIPPED in absence of live review system"
      - name: Gate via check_slo.py
        run: |
          python3 eval/scripts/check_slo.py \
              --baseline bench_baselines/v0.6.0/mode3_slos.yaml \
              --measure target/mode3/human_review_drill.json \
              --report target/mode3/drill_report.md
          cat target/mode3/drill_report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mode3-human-review-drill
          path: target/mode3/*.json
