name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  fast-checks:
    name: Fast checks (< 2 min)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-checks
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "0.4.x"
      - name: uv sync
        run: uv sync --all-extras --dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy python/efe || true  # strict enabled from Sprint 1+

  rust-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests
      - uses: taiki-e/install-action@nextest
      - name: Setup Python 3.12 (= required for efe-ffi pyo3-build-config)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Φ-D-OPS post-audit fix B5 : `efe-ffi` cdylib build links
      # libpython AND `cargo test` needs Python embedding via dev-dep
      # `auto-initialize` — mutually exclusive with `extension-module`.
      # We follow the same split as `release-v1-ga.yml validate-rust` :
      # workspace minus efe-ffi for build+test, then efe-ffi alone.
      - name: Build (workspace minus efe-ffi)
        run: cargo build --workspace --exclude efe-ffi --all-targets
      - name: Build (efe-ffi rlib)
        env:
          PYO3_PYTHON: python3.12
        run: cargo build -p efe-ffi --lib
      - name: Test (workspace minus efe-ffi)
        run: cargo nextest run --workspace --exclude efe-ffi
      # Couche 2 (frontière /v1/llm/*) : le build workspace ci-dessus est en features PAR DÉFAUT
      # (frontier-llm OFF) — sans ce job, la surface servie + la triade de boot M4 pourriraient
      # sans détection. On compile/teste exactement le stack de prod (cf. Dockerfile).
      - name: Test (efe-swarm-gateway — stack prod frontier-llm)
        run: cargo nextest run -p efe-swarm-gateway --features "postgres oidc pii frontier-llm"
      - name: Test (efe-ffi rlib)
        env:
          PYO3_PYTHON: python3.12
        run: cargo nextest run -p efe-ffi --lib

  # Couche 3 M1 — LE job qui défend le DoD. `rust-tests` ci-dessus exécute bien
  # `efe-meta-swarm-server` (via `nextest run --workspace`), mais aux features PAR
  # DÉFAUT : or les 5 tests qui prouvent le DoD#1 — une ronde SERVIE (Step-sur-gRPC)
  # tournée par un VRAI `SwarmController` efe-core, contenue dans la boîte de sûreté,
  # plus le gate H1 de boot et la mesure Palier-2 — vivent dans un fichier
  # `#![cfg(feature = "core-integration")]`, donc ZÉRO test exécuté. Sans ce job, le
  # seul e2e du méta-essaim peut pourrir sur une dérive d'efe-core, du contrôleur
  # latent ou de `core_engine::build` sans qu'aucun voyant ne s'allume.
  # Job SÉPARÉ plutôt qu'une étape de `rust-tests` : la feature tire efe-core ET
  # efe-server dans le graphe, un build qui ferait sauter le timeout de 15 min.
  meta-swarm-core-integration:
    name: Couche 3 — méta-essaim (vrais participants efe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 30     # build à froid efe-core + efe-server ≈ 6 min en local (debug)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-swarm-core-integration
      - uses: taiki-e/install-action@nextest
      # `protoc` n'est PAS requis : efe-meta-swarm-proto embarque protoc-bin-vendored.
      # On compile TOUTES les cibles sous la feature — c'est ce qui attrape une
      # rupture de `#[cfg]` n'importe où dans le crate, pas seulement dans la suite
      # de preuve.
      - name: Build (toutes cibles, core-integration)
        run: cargo build -p efe-meta-swarm-server --features core-integration --all-targets
      # …mais on n'EXÉCUTE que la suite de preuve. Portée volontairement étroite,
      # et il faut le dire plutôt que de laisser croire à une couverture plus large :
      #   * le reste du crate tourne DÉJÀ dans `rust-tests` (nextest --workspace),
      #     aux features par défaut — le relancer ici n'ajoute aucune couverture ;
      #   * les `integration_multiprocess_*` lancent de vrais binaires et sont
      #     connus pour flaker sous charge parallèle (ils passent isolés) ; les
      #     embarquer dans une porte bloquante apprendrait à relancer jusqu'au vert,
      #     ce qui est exactement la pathologie que ce dépôt traque.
      - name: Test (la suite de preuve du DoD #1)
        run: cargo nextest run -p efe-meta-swarm-server --features core-integration --test m1d_core_serving_e2e

  # ══════════════════════════════════════════════════════════════════════════
  # P1 — le chemin d'egress payant, enfin linté. **PAS ENCORE BLOQUANT** : voir
  # « Pourquoi ce job n'est pas dans `all-green` » plus bas.
  #
  # ## Le trou que ce job ferme
  #
  # `fast-checks` passe bien `clippy -D warnings`, mais aux features PAR DÉFAUT
  # — et `efe-swarm-gateway` déclare `default = []`. Tout ce qui vit derrière
  # `frontier-llm`, `reg-evidence`, `postgres`, `oidc` et `pii` sort donc de la
  # rigueur du dépôt : la frontière payante ET le pont M5 vers le registre.
  #
  # `rust-tests` en TESTE une partie (`--features "postgres oidc pii
  # frontier-llm"`) mais ne la LINTE pas, et n'active même pas `reg-evidence` :
  # `reg_pont::deriver` n'était compilé par AUCUN job. C'est là qu'a vécu le
  # défaut du 2026-08-26 (`fichiers` construite puis jetée, reg_pont.rs:252) —
  # visible du compilateur au premier `cargo check`, invisible de la CI.
  #
  # ## Portée réelle (à savoir avant de lire un échec)
  #
  # `cargo clippy -p X -- -D warnings` ne restreint PAS le deny à `X` : cargo
  # pose `RUSTC_WORKSPACE_WRAPPER`, donc clippy-driver tourne sur TOUS les
  # membres du workspace de l'invocation et lit le même `CLIPPY_ARGS`. Ce job
  # linte donc aussi la fermeture de path-deps que les features tirent
  # (efe-coordinator, efe-multi-llm, efe-nano-app-coordinator…) — ce qui EST la
  # couverture que la dette P1 réclame, mais explique qu'un échec puisse tomber
  # hors de la passerelle.
  #
  # ## Pourquoi ce job n'est pas (encore) dans `all-green`
  #
  # Parce qu'il est ROUGE aujourd'hui, et le déclarer bloquant tout de suite
  # bloquerait la fusion sur une dette qu'il ne fait que RÉVÉLER. Relevé du
  # 2026-08-26 (toolchain 1.88, identique au pin CI) : ~53 sites de lint sur 7
  # crates — efe-coordinator 24, efe-swarm-gateway 11, efe-multi-llm 11,
  # efe-nano-app-coordinator 3, efe-swarm-provenance 2, efe-swarm-topology 1,
  # provenance-bridge 1. Aucun n'est un défaut de correction ; ce sont des
  # lints de style et de signature (`too_many_arguments` sur des constructeurs
  # et sur `verify-meta-mini::canonical`, qui MIROITE une spec et ne doit donc
  # PAS être refactorisée à la légère).
  #
  # Le job est laissé DÉCLARÉ et NON BLOQUANT plutôt que retiré : un trou de
  # couverture qu'on nomme se referme, un trou qu'on tait grandit. Le dernier
  # geste — l'ajouter à `needs:` d'`all-green` — se fait quand le relevé
  # ci-dessus tombe à zéro, et pas avant.
  clippy-frontiere:
    name: clippy — features servies (frontière + registre) [non bloquant]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-frontiere
      # Le stack de prod exact (cf. Dockerfile) PLUS `reg-evidence` — la seule
      # feature servie qu'aucun autre job ne compile.
      - name: clippy (passerelle — toutes features servies)
        run: >-
          cargo clippy -p efe-swarm-gateway --all-targets
          --features "postgres oidc pii reg-evidence frontier-llm"
          -- -D warnings
      # Les 3 providers frontière vivent derrière leurs propres features dans
      # `efe-coordinator` (`default = []`) : `--workspace` compile ce crate SANS
      # eux. Sans cette étape, le code d'egress lui-même resterait non linté.
      - name: clippy (coordinator — les 3 providers frontière)
        run: >-
          cargo clippy -p efe-coordinator --all-targets
          --features "anthropic openai gemini"
          -- -D warnings

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: pytest
        run: uv run pytest -q --cov=efe || true  # no tests yet in S0

  cuda-build:
    name: CUDA build check
    runs-on: ubuntu-latest
    container:
      image: nvcr.io/nvidia/cuda:12.4.1-devel-ubuntu22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y cmake ninja-build git
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: astral-sh/setup-uv@v3
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit || true
      - name: pip audit
        run: |
          uv sync --all-extras --dev
          uv run pip-audit || true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2

  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [fast-checks, rust-tests, meta-swarm-core-integration, python-tests, cuda-build, security]
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.fast-checks.result }}" != "success" || \
                "${{ needs.rust-tests.result }}" != "success" || \
                "${{ needs.meta-swarm-core-integration.result }}" != "success" || \
                "${{ needs.python-tests.result }}" != "success" || \
                "${{ needs.cuda-build.result }}" != "success" || \
                "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All green"
