# PR #22 § 17 — slo-monthly : T2 rollup on the 1st of every month
# at 03:00 UTC.  Opens a PR adding the new `monthly/{yyyy-mm}.json`.

name: slo-monthly

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Period (yyyy-mm — defaults to previous month)"
        required: false
      chart_version:
        description: "Chart version"
        required: true

permissions:
  contents: write    # opens PR
  pull-requests: write
  id-token: write

jobs:
  monthly:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p efe-slo-rollup

      - name: Resolve period
        id: period
        run: |
          PERIOD="${{ github.event.inputs.period }}"
          if [ -z "$PERIOD" ] ; then
            PERIOD=$(date -u -d '1 day ago' +%Y-%m)
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Run T2
        env:
          EFE_CHART_VERSION: ${{ github.event.inputs.chart_version || vars.SLO_CHART_VERSION }}
        run: |
          set -eo pipefail
          ./target/release/efe-slo-rollup rollup \
              --stage t2 \
              --period "${{ steps.period.outputs.period }}" \
              --chart-version "$EFE_CHART_VERSION" \
              --region "${{ vars.SLO_REGION || 'global' }}" \
              --storage-root ./slos \
              --cosign-disabled

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(slo): monthly aggregate ${{ steps.period.outputs.period }}"
          branch: slo-monthly-${{ steps.period.outputs.period }}
          title: "[SLO] Monthly aggregate ${{ steps.period.outputs.period }}"
          body: |
            Auto-generated by `slo-monthly.yml`.

            New file : `slos/v${{ vars.SLO_CHART_VERSION }}/monthly/${{ steps.period.outputs.period }}.json`
          add-paths: |
            slos/**
