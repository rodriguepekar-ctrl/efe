# Sprint D24 (Φ-B) — `@efe/sdk` daily live smoke vs staging.
#
# Cf. docs/EFE_TYPESCRIPT_SDK_EXTENSION_ARCHITECTURE.md.
#
# Daily cron 06:00 UTC against the EFE staging endpoint using a real
# JWT + (optional) staging gRPC-Web port :50052.
#
# **Gates** :
#   - Triggers : daily cron + manual workflow_dispatch.
#   - Secrets required : EFE_STAGING_ENDPOINT, EFE_STAGING_JWT.
#   - On secret absence (e.g. fork PR) : skips, exit 0 (advisory).
#   - On failure : Slack ping #efe-staging-alerts.

name: sdk-typescript-smoke

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      endpoint_override:
        description: "Override EFE_STAGING_ENDPOINT (e.g. eu-staging.efe.ai:50051)"
        required: false
        default: ""

jobs:
  smoke:
    name: Live smoke vs staging
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/typescript/@efe/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }

      - name: Validate secrets present
        env:
          EFE_STAGING_ENDPOINT: ${{ secrets.EFE_STAGING_ENDPOINT }}
          EFE_STAGING_JWT: ${{ secrets.EFE_STAGING_JWT }}
        run: |
          if [[ -z "$EFE_STAGING_ENDPOINT" || -z "$EFE_STAGING_JWT" ]]; then
            echo "::warning::staging secrets not present — skipping smoke"
            echo "RUN_SMOKE=false" >> "$GITHUB_ENV"
          else
            echo "RUN_SMOKE=true" >> "$GITHUB_ENV"
          fi

      - name: pnpm install + build
        if: env.RUN_SMOKE == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run live smoke (Node SDK)
        if: env.RUN_SMOKE == 'true'
        env:
          EFE_ENDPOINT: ${{ github.event.inputs.endpoint_override || secrets.EFE_STAGING_ENDPOINT }}
          EFE_JWT_TOKEN: ${{ secrets.EFE_STAGING_JWT }}
        run: |
          node --input-type=module -e "
          import { EfeClient } from './dist/node/index.js';

          const client = new EfeClient({
            endpoint: process.env.EFE_ENDPOINT,
            auth: { kind: 'jwt', token: process.env.EFE_JWT_TOKEN },
            deadline: 10000,
          });
          try {
            await client.healthcheck();
            const v = await client.classify('smoke test : refund please');
            console.log('verdict =', JSON.stringify(v, null, 2));
            if (typeof v.label !== 'string') process.exit(2);
          } finally {
            await client.close();
          }
          "

      - name: Notify Slack on failure
        if: failure() && env.RUN_SMOKE == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_EFE_STAGING_WEBHOOK }}
        run: |
          if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\":rotating_light: @efe/sdk smoke FAILED vs staging — run ${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL" || true
          fi
