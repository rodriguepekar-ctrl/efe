# Sprint **Φ-D-COMPLIANCE D89** — nightly bench.

name: comp-bench

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC nightly
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  breach-drill:
    name: Breach drill (72h + 24h)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 eval/scripts/comp_breach_72h_evidence.py --mode synth_pass --n-breaches 100 --out target/compliance/breach_72h.json
      - run: python3 eval/scripts/comp_breach_24h_containment_evidence.py --mode synth_pass --n-incidents 100 --out target/compliance/breach_24h.json
      - uses: actions/upload-artifact@v4
        with: {name: comp-breach-drill, path: target/compliance/breach_*.json}

  erasure-drill:
    name: Erasure 30d drill
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 eval/scripts/comp_erasure_30d_evidence.py --mode synth_pass --n-requests 50 --out target/compliance/erasure_30d.json
      - run: python3 eval/scripts/comp_portability_30d_evidence.py --mode synth_pass --n-requests 50 --out target/compliance/portability_30d.json
      - uses: actions/upload-artifact@v4
        with: {name: comp-erasure-drill, path: target/compliance/*30d.json}

  residency-drill:
    name: Data residency 7 scenarios
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 eval/scripts/comp_data_residency_evidence.py --mode synth_pass --out target/compliance/residency.json
      - uses: actions/upload-artifact@v4
        with: {name: comp-residency-drill, path: target/compliance/residency.json}

  freshness-checks:
    name: DPIA + ROPA + transparency freshness
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          mkdir -p target/compliance
          for ev in dpia_freshness ropa_freshness transparency_notice subprocessor_inventory; do
            python3 eval/scripts/comp_${ev}_evidence.py --mode synth_pass --out target/compliance/_${ev}.json
          done
      - uses: actions/upload-artifact@v4
        with: {name: comp-freshness, path: target/compliance/_*.json}

  generators:
    name: DPIA + ROPA generation
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate DPIA
        run: python3 scripts/compliance/generate_dpia.py --out target/compliance/dpia_credit-decision-v1.md
      - name: Generate ROPA
        run: python3 scripts/compliance/generate_ropa.py --out target/compliance/ropa_tenant-acme.md
      - uses: actions/upload-artifact@v4
        with: {name: comp-generators, path: target/compliance/*.md}

  summary:
    name: Bench summary + SLO gating
    needs: [breach-drill, erasure-drill, residency-drill, freshness-checks, generators]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: Merge + report
        run: |
          mkdir -p target/compliance
          python3 -c "
          import json, glob
          out = {'slo_compliance': {}}
          for f in glob.glob('artifacts/**/*.json', recursive=True):
              try: d = json.load(open(f))
              except Exception: continue
              for k, v in d.get('slo_compliance', {}).items():
                  out['slo_compliance'][k] = v
          json.dump(out, open('target/compliance/bench_consolidated.json', 'w'), indent=2)
          "
          python3 eval/scripts/check_slo.py \
              --baseline bench_baselines/v0.8.0/comp_slos.yaml \
              --measure target/compliance/bench_consolidated.json \
              --report target/compliance/bench_report.md
          cat target/compliance/bench_report.md
