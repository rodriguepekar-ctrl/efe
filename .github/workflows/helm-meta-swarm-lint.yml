# ─────────────────────────────────────────────────────────────────────
# PR #15 — helm-meta-swarm-lint workflow.
# Cf. docs/EFE_A1_PHASE2_PR15_ARCHITECTURE.md
#
# 15 jobs, fast feedback (≤ 5 min p99 wall-clock) :
#   01 bootstrap           (renders 10 scenarios once, shares artifact)
#   02 style               (yamllint + shellcheck + pre-commit)
#   03 helm lint --strict  [REQUIRED]
#   04 chart-testing       (ct lint + semver bump enforcement)
#   05 schema-of-schema    (ajv vs JSON Schema 2020-12 meta-schema)
#   06 helm-docs           (README drift detection — SOFT per AD21)
#   07 kubeconform × 4     [REQUIRED]  K8s 1.28 / 1.29 / 1.30 / 1.31
#   08 Conftest            [REQUIRED]  12 EFE Rego rules (per-rule packages)
#   09 Trivy               (SARIF → Code Scanning)
#   10 Checkov             (SARIF → Code Scanning, soft-fail)
#   11 Polaris             [REQUIRED]  danger blocks, warning annotates
#   12 ArtifactHub         (metadata lint)
#   13 SBOM                (Syft → CycloneDX, 30d retention)
#   14 sticky-summary      (PR comment + workflow_call output)
#   15 version-drift       [REQUIRED]  workflow env ↔ renovate.json (AC33)
#
# REQUIRED for merge (6) : 02, 03, 07 (×4 matrix), 08, 11, 15.
# SOFT (allowed ❌)      : 06 helm-docs.
# ─────────────────────────────────────────────────────────────────────

name: helm-meta-swarm-lint

on:
  pull_request:
    paths:
      - "charts/efe-stack/charts/efe-meta-swarm/**"
      - "policies/rego/efe/**"
      - ".github/workflows/helm-meta-swarm-lint.yml"
      - ".yamllint"
      - ".pre-commit-config.yaml"
      - "chart-testing.yaml"
      - "polaris.yaml"
      - ".trivyignore"
      - ".checkov.yaml"
  workflow_call:
    inputs:
      debug:
        description: "Verbose tool output (for triage)"
        required: false
        type: boolean
        default: false
    outputs:
      lint-result:
        description: "Overall lint verdict : pass | fail"
        value: ${{ jobs.sticky-summary.outputs.verdict }}
      sbom-artifact-name:
        description: "Name of the CycloneDX SBOM artifact"
        value: ${{ jobs.sbom.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      debug:
        description: "Verbose tool output"
        required: false
        type: boolean
        default: false

# AD5 — workflow-level concurrency : cancel previous run on new push.
concurrency:
  group: helm-meta-swarm-lint-${{ github.ref }}
  cancel-in-progress: true

# AD25 — read-only by default ; explicit writes only where strictly needed.
permissions:
  contents:        read
  pull-requests:   write     # Job 14 sticky comment
  security-events: write     # SARIF uploads (Jobs 09, 10, 08)
  actions:         read      # workflow_call recursion

env:
  # AD3 — every tool version pinned + Renovate-tracked.
  HELM_VERSION:        "v3.13.3"
  KUBECONFORM_VERSION: "v0.6.4"
  CHART_TESTING_VER:   "v3.10.1"
  CONFTEST_VERSION:    "v0.49.1"
  TRIVY_VERSION:       "v0.49.1"
  CHECKOV_VERSION:     "3.1.79"
  POLARIS_VERSION:     "8.5.5"
  HELM_DOCS_VERSION:   "v1.12.0"
  AH_VERSION:          "v1.18.0"
  SYFT_VERSION:        "v1.0.1"
  AJV_VERSION:         "5.0.0"
  PYTHON_VERSION:      "3.11"

  # AD4 + AD20 — multi-K8s matrix.  Bump here ⇒ Renovate re-runs lint
  # on the bump PR.
  KUBE_VERSIONS: '["1.28.0", "1.29.0", "1.30.0", "1.31.0"]'

  # AD11 — chart-testing target branch + config path.
  CT_CONFIG: "chart-testing.yaml"

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Job 01 — bootstrap : renders 6 scenarios + 4 examples once,
  # uploads as artifact for downstream jobs.
  # ───────────────────────────────────────────────────────────────────
  bootstrap:
    name: 01 / bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      cache-key:    ${{ steps.cache-key.outputs.value }}
      artifact:     rendered-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # full history needed for helm-docs (Job 06)

      - id: cache-key
        run: |
          # Hash the tool versions block.  Renovate-bumped PRs change
          # this hash → cache invalidates → fresh tool download.
          h=$(printf '%s\n' \
            "helm=${{ env.HELM_VERSION }}" \
            "kubeconform=${{ env.KUBECONFORM_VERSION }}" \
            "ct=${{ env.CHART_TESTING_VER }}" \
            "conftest=${{ env.CONFTEST_VERSION }}" \
            "trivy=${{ env.TRIVY_VERSION }}" \
            "checkov=${{ env.CHECKOV_VERSION }}" \
            "polaris=${{ env.POLARIS_VERSION }}" \
            "ah=${{ env.AH_VERSION }}" \
            "syft=${{ env.SYFT_VERSION }}" \
            "ajv=${{ env.AJV_VERSION }}" \
            | sha1sum | head -c 12)
          echo "value=${h}" >> $GITHUB_OUTPUT
          echo "cache key : ${h}"

      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }

      - name: Render every scenario + every overlay
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          CHART="charts/efe-stack/charts/efe-meta-swarm"

          # 6 kovant scenarios.
          for scen in kovant-3p kovant-disabled kovant-network-policy \
                      kovant-service-monitor kovant-prod kovant-hooks ; do
            echo "── render ${scen} ──"
            helm template tst "$CHART" \
              --namespace efe \
              -f "$CHART/tests/scenarios/${scen}.values.yaml" \
              > "/tmp/rendered/${scen}.yaml"
            wc -l "/tmp/rendered/${scen}.yaml"
          done

          # 4 examples overlays.
          for flavor in dev staging prod canary ; do
            echo "── render values-${flavor} ──"
            helm template tst "$CHART" \
              --namespace efe \
              -f "$CHART/examples/values-${flavor}.yaml" \
              > "/tmp/rendered/values-${flavor}.yaml"
            wc -l "/tmp/rendered/values-${flavor}.yaml"
          done

          echo "── inventory ──"
          ls -la /tmp/rendered/
          du -sh /tmp/rendered/

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ github.run_id }}
          path: /tmp/rendered/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # Job 02 — style : yamllint + shellcheck + pre-commit aggregator.
  # ───────────────────────────────────────────────────────────────────
  style:
    name: 02 / style (yamllint + shellcheck + pre-commit)    # REQUIRED
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit + yamllint
        run: |
          pip install --upgrade pip
          pip install pre-commit==3.6.0 yamllint==1.35.1

      - name: pre-commit run (drives yamllint + shellcheck + helm-docs + conftest hooks)
        run: |
          pre-commit run \
            --all-files \
            --show-diff-on-failure \
            ${{ inputs.debug && '--verbose' || '' }}

  # ───────────────────────────────────────────────────────────────────
  # Job 03 — helm lint --strict.  REQUIRED for merge.
  # ───────────────────────────────────────────────────────────────────
  helm-lint:
    name: 03 / helm lint --strict
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "${{ env.HELM_VERSION }}" }

      - name: helm lint (chart-wide, default values)
        run: |
          helm lint charts/efe-stack/charts/efe-meta-swarm --strict \
            -f charts/efe-stack/charts/efe-meta-swarm/values.yaml

      - name: helm lint per scenario
        run: |
          set -euo pipefail
          CHART="charts/efe-stack/charts/efe-meta-swarm"
          for scen in kovant-3p kovant-disabled kovant-network-policy \
                      kovant-service-monitor kovant-prod kovant-hooks ; do
            echo "── lint ${scen} ──"
            helm lint "$CHART" --strict \
              -f "$CHART/tests/scenarios/${scen}.values.yaml"
          done

      - name: helm lint per overlay
        run: |
          set -euo pipefail
          CHART="charts/efe-stack/charts/efe-meta-swarm"
          for flavor in dev staging prod canary ; do
            echo "── lint values-${flavor} ──"
            helm lint "$CHART" --strict \
              -f "$CHART/examples/values-${flavor}.yaml"
          done

  # ───────────────────────────────────────────────────────────────────
  # Job 04 — chart-testing (ct lint).
  # ───────────────────────────────────────────────────────────────────
  ct-lint:
    name: 04 / chart-testing
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: helm/chart-testing-action@v2.6.1
        with: { version: "${{ env.CHART_TESTING_VER }}" }

      - name: ct lint
        run: |
          ct lint \
            --config "${{ env.CT_CONFIG }}" \
            --target-branch main \
            ${{ inputs.debug && '--debug' || '' }}

  # ───────────────────────────────────────────────────────────────────
  # Job 05 — values.schema.json self-validation.
  # PR #15 audit pass : ajv-cli only parses JSON.  We convert YAML → JSON
  # via `yq` before feeding to `ajv validate`.
  # ───────────────────────────────────────────────────────────────────
  schema-of-schema:
    name: 05 / values.schema.json self-validation
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install ajv-cli
        run: npm install -g "ajv-cli@${{ env.AJV_VERSION }}" ajv-formats@2.1.1

      - name: Install yq (for YAML → JSON conversion)
        run: |
          curl -fsSL \
            https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Validate values.schema.json against the 2020-12 meta-schema
        # `ajv compile` checks the schema's own syntax / structure under
        # the requested draft.  Fails if the schema isn't a valid JSON
        # Schema 2020-12 document.
        run: |
          ajv compile \
            --spec=draft2020 \
            -c ajv-formats \
            -s charts/efe-stack/charts/efe-meta-swarm/values.schema.json
          echo "✅ values.schema.json is a valid JSON Schema 2020-12 document"

      - name: Validate every examples overlay AGAINST values.schema.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/ajv-json
          for flavor in dev staging prod canary ; do
            yaml="charts/efe-stack/charts/efe-meta-swarm/examples/values-${flavor}.yaml"
            json="/tmp/ajv-json/values-${flavor}.json"
            yq -o json "$yaml" > "$json"
            echo "── ajv validate values-${flavor} (JSON) ──"
            ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s charts/efe-stack/charts/efe-meta-swarm/values.schema.json \
              -d "$json"
          done

      - name: Validate every scenario values file
        run: |
          set -euo pipefail
          for f in charts/efe-stack/charts/efe-meta-swarm/tests/scenarios/*.values.yaml ; do
            base="$(basename "$f" .yaml)"
            json="/tmp/ajv-json/${base}.json"
            yq -o json "$f" > "$json"
            echo "── ajv validate ${base} (JSON) ──"
            ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s charts/efe-stack/charts/efe-meta-swarm/values.schema.json \
              -d "$json"
          done

  # ───────────────────────────────────────────────────────────────────
  # Job 06 — helm-docs README sync check.
  #
  # PR #15 audit pass : AD21 promises this is SOFT for v1 ("Soft gate
  # (warning) for v1 ; will be promoted to hard gate in PR #16.").
  # Implement that as `continue-on-error: true` so a failure surfaces
  # as ❌ in the sticky comment but doesn't fail the overall workflow.
  # ───────────────────────────────────────────────────────────────────
  helm-docs:
    name: 06 / helm-docs sync
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    continue-on-error: true               # AD21 — soft gate for v1
    steps:
      - uses: actions/checkout@v4

      - name: Run helm-docs (writes README.md.generated)
        uses: docker://jnorwood/helm-docs:v1.12.0
        with:
          args: >-
            --chart-search-root=charts/efe-stack/charts/efe-meta-swarm
            --template-files=README.md.gotmpl
            --output-file=README.md.generated

      - name: Diff committed README vs regenerated
        run: |
          set -euo pipefail
          if ! diff -u \
              charts/efe-stack/charts/efe-meta-swarm/README.md \
              charts/efe-stack/charts/efe-meta-swarm/README.md.generated ; then
            echo "::warning::README.md is out of sync with values.yaml + Chart.yaml." >&2
            echo "  Run \`make helm-docs\` locally and commit the diff." >&2
            echo "  Job is SOFT for v1 (AD21) ; will be promoted to hard gate in PR #16." >&2
            exit 1
          fi
          echo "✅ README.md is in sync"

  # ───────────────────────────────────────────────────────────────────
  # Job 07 — kubeconform multi-K8s-version matrix.  REQUIRED.
  # ───────────────────────────────────────────────────────────────────
  kubeconform:
    name: 07 / kubeconform (K8s ${{ matrix.kube }})
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    strategy:
      fail-fast: false                    # AD7 — every version's signal independent
      matrix:
        kube: [ "1.28.0", "1.29.0", "1.30.0", "1.31.0" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-${{ github.run_id }}
          path: /tmp/rendered

      - name: Install kubeconform
        run: |
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz" \
            | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: kubeconform ${{ matrix.kube }} on every rendered file
        run: |
          set -euo pipefail
          for f in /tmp/rendered/*.yaml ; do
            echo "── ${matrix-kube:-${{ matrix.kube }}} : $(basename $f) ──"
            kubeconform -strict -summary \
              -kubernetes-version "${{ matrix.kube }}" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
              "$f"
          done

  # ───────────────────────────────────────────────────────────────────
  # Job 08 — Conftest (OPA Rego policy-as-code).  REQUIRED.
  # ───────────────────────────────────────────────────────────────────
  conftest:
    name: 08 / Conftest (OPA policies)
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-${{ github.run_id }}
          path: /tmp/rendered

      - name: Install Conftest
        run: |
          ver="${{ env.CONFTEST_VERSION }}"
          ver_bare="${ver#v}"
          curl -fsSL \
            "https://github.com/open-policy-agent/conftest/releases/download/${ver}/conftest_${ver_bare}_Linux_x86_64.tar.gz" \
            | tar xz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Verify the Rego rules themselves (unit tests)
        # PR #15 audit pass — per-rule packages mean `conftest verify`
        # discovers each `package efe.<rule>` automatically.  No
        # `--namespace` needed for verify ; it walks every *.rego file.
        run: |
          conftest verify \
            --policy policies/rego/efe \
            --data policies/rego/efe/data

      - name: Apply policies to rendered manifests
        # PR #15 audit pass — `--all-namespaces` is REQUIRED so that
        # Conftest collects denies from every `package efe.<rule>`.
        # Default `--namespace main` would only scan rules under
        # `package main`, missing all our per-rule packages.
        run: |
          set -euo pipefail
          for f in /tmp/rendered/*.yaml ; do
            echo "── policy check : $(basename $f) ──"
            conftest test \
              --all-namespaces \
              --policy policies/rego/efe \
              --data policies/rego/efe/data \
              --no-color \
              "$f"
          done

      - name: Emit SARIF on failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/sarif
          conftest test \
            --all-namespaces \
            --policy policies/rego/efe \
            --data policies/rego/efe/data \
            --output sarif \
            /tmp/rendered/*.yaml > /tmp/sarif/conftest.sarif
          echo "── SARIF preview ──"
          head -50 /tmp/sarif/conftest.sarif || true

      - uses: github/codeql-action/upload-sarif@v3
        if: failure()
        with:
          sarif_file: /tmp/sarif/conftest.sarif
          category: conftest

  # ───────────────────────────────────────────────────────────────────
  # Job 09 — Trivy IaC scan (SARIF → Code Scanning).
  # ───────────────────────────────────────────────────────────────────
  trivy:
    name: 09 / Trivy IaC
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-${{ github.run_id }}
          path: /tmp/rendered

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type:        config
          scan-ref:         /tmp/rendered
          format:           sarif
          output:           /tmp/trivy.sarif
          severity:         HIGH,CRITICAL
          exit-code:        '1'
          ignore-unfixed:   false
          trivyignores:     .trivyignore

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: /tmp/trivy.sarif
          category: trivy

  # ───────────────────────────────────────────────────────────────────
  # Job 10 — Checkov (soft-fail, SARIF only).
  # ───────────────────────────────────────────────────────────────────
  checkov:
    name: 10 / Checkov
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-${{ github.run_id }}
          path: /tmp/rendered

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip

      - run: pip install "checkov==${{ env.CHECKOV_VERSION }}"

      - name: Checkov scan
        run: |
          checkov \
            --directory /tmp/rendered \
            --framework kubernetes \
            --config-file .checkov.yaml \
            --output sarif \
            --output-file-path /tmp/checkov.sarif \
            --soft-fail
        # `--soft-fail` makes the step always exit 0 ; the SARIF
        # upload is the actual signal surface.

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: /tmp/checkov.sarif
          category: checkov

  # ───────────────────────────────────────────────────────────────────
  # Job 11 — Polaris severity-tiered.  REQUIRED for merge.
  # ───────────────────────────────────────────────────────────────────
  polaris:
    name: 11 / Polaris (severity-tiered)
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-${{ github.run_id }}
          path: /tmp/rendered

      - name: Install Polaris
        run: |
          curl -fsSL \
            "https://github.com/FairwindsOps/polaris/releases/download/${{ env.POLARIS_VERSION }}/polaris_linux_amd64.tar.gz" \
            | tar xz
          sudo mv polaris /usr/local/bin/
          polaris version

      - name: Polaris audit (DANGER tier — blocks merge)
        run: |
          set -euo pipefail
          mkdir -p /tmp/polaris-reports
          for f in /tmp/rendered/*.yaml ; do
            name=$(basename "$f" .yaml)
            echo "── polaris danger : $name ──"
            polaris audit \
              --audit-path "$f" \
              --config polaris.yaml \
              --severity danger \
              --output-format pretty
            # JSON dump (kept across danger + warning tiers for the
            # combined report artifact below).
            polaris audit \
              --audit-path "$f" \
              --config polaris.yaml \
              --severity danger \
              --output-format json \
              > "/tmp/polaris-reports/${name}-danger.json" || true
          done

      - name: Polaris audit (WARNING tier — annotates, doesn't block)
        if: always()
        run: |
          set +e
          for f in /tmp/rendered/*.yaml ; do
            name=$(basename "$f" .yaml)
            polaris audit \
              --audit-path "$f" \
              --config polaris.yaml \
              --severity warning \
              --output-format json \
              > "/tmp/polaris-reports/${name}-warning.json"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-${{ github.run_id }}
          path: /tmp/polaris-reports/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # Job 12 — ArtifactHub metadata lint.
  # ───────────────────────────────────────────────────────────────────
  artifacthub:
    name: 12 / ArtifactHub metadata
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Install ah
        run: |
          ver="${{ env.AH_VERSION }}"
          ver_bare="${ver#v}"
          curl -fsSL \
            "https://github.com/artifacthub/hub/releases/download/${ver}/ah_${ver_bare}_linux_amd64.tar.gz" \
            | tar xz
          sudo mv ah /usr/local/bin/
          ah version

      - name: ah lint
        # PR #15 audit pass : `ah lint` accepts the chart path as a
        # positional argument in v1.18+ (the `--path` flag was deprecated
        # in v1.16).  Positional form works across versions.
        run: |
          ah lint charts/efe-stack/charts/efe-meta-swarm/

  # ───────────────────────────────────────────────────────────────────
  # Job 13 — SBOM (Syft → CycloneDX 1.5).  30-day retention.
  # ───────────────────────────────────────────────────────────────────
  sbom:
    name: 13 / SBOM (CycloneDX)
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      artifact-name: ${{ steps.sbom.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          ver="${{ env.SYFT_VERSION }}"
          ver_bare="${ver#v}"
          curl -fsSL \
            "https://github.com/anchore/syft/releases/download/${ver}/syft_${ver_bare}_linux_amd64.tar.gz" \
            | tar xz
          sudo mv syft /usr/local/bin/
          syft version

      - id: sbom
        name: Generate CycloneDX 1.5 SBOM
        run: |
          syft scan dir:charts/efe-stack/charts/efe-meta-swarm \
            -o cyclonedx-json=/tmp/sbom.cdx.json
          echo "── SBOM summary ──"
          ls -la /tmp/sbom.cdx.json
          # Bash one-liner to count components (no jq dependency).
          n=$(grep -c '"bom-ref"' /tmp/sbom.cdx.json || echo 0)
          echo "components : ${n}"
          echo "name=sbom-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: /tmp/sbom.cdx.json
          retention-days: 30          # AD23 — SBOM kept longer than other artifacts

  # ───────────────────────────────────────────────────────────────────
  # Job 15 — version-drift detection (AC33).
  # Asserts that every `*_VERSION` env-var in this workflow is also
  # tracked by `renovate.json` (regexManagers).  Without this, a manual
  # version bump in the workflow file would NOT trigger a Renovate
  # re-lint cycle ; the version would drift unnoticed.
  # ───────────────────────────────────────────────────────────────────
  version-drift:
    name: 15 / version-drift (workflow ↔ renovate.json)
    needs: bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4

      - name: Cross-check every workflow env-var has a renovate regexManager
        run: |
          set -euo pipefail
          workflow=".github/workflows/helm-meta-swarm-lint.yml"
          renovate="renovate.json"

          # Extract every X_VERSION env-var from the workflow.
          mapfile -t versions < <(
            grep -oE '^[[:space:]]*[A-Z_]+_VERSION:' "$workflow" \
              | sed 's/[[:space:]]*//;s/://' \
              | sort -u
          )

          # Skip non-pinnable env-vars (PYTHON_VERSION points to Python
          # major.minor, KUBE_VERSIONS is the matrix list).
          excluded="^(PYTHON_VERSION|KUBE_VERSIONS)$"

          missing=()
          for v in "${versions[@]}" ; do
            if echo "$v" | grep -qE "$excluded" ; then continue ; fi
            if ! grep -qE "\"${v}:" "$renovate" ; then
              missing+=("$v")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ] ; then
            echo "::error::version-drift detected — these workflow env-vars have NO Renovate regexManager :" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "Add a regexManagers[] entry to renovate.json for each." >&2
            exit 1
          fi
          echo "✅ every workflow X_VERSION env-var is tracked by renovate.json"

  # ───────────────────────────────────────────────────────────────────
  # Job 14 — Sticky PR comment + workflow_call output aggregation.
  # ───────────────────────────────────────────────────────────────────
  sticky-summary:
    name: 14 / PR sticky summary
    needs:
      - style
      - helm-lint
      - ct-lint
      - schema-of-schema
      - helm-docs
      - kubeconform
      - conftest
      - trivy
      - checkov
      - polaris
      - artifacthub
      - sbom
      - version-drift
    runs-on: ubuntu-22.04
    if: always()                       # run even when predecessors fail
    timeout-minutes: 2
    outputs:
      verdict: ${{ steps.compose.outputs.verdict }}
    steps:
      - id: compose
        name: Compose lint verdict
        # PR #15 audit pass — AC33 (version-drift) is classified as
        # `gate` in the architecture's AC table.  Promote it to the
        # required-list : 6 required gates instead of 5.  Branch
        # protection (§ 30) should be updated accordingly.
        env:
          # Required-gate job results.
          R_STYLE:         ${{ needs.style.result }}
          R_HELM_LINT:     ${{ needs.helm-lint.result }}
          R_KUBECONFORM:   ${{ needs.kubeconform.result }}
          R_CONFTEST:      ${{ needs.conftest.result }}
          R_POLARIS:       ${{ needs.polaris.result }}
          R_VERSION_DRIFT: ${{ needs.version-drift.result }}
        run: |
          set -eu
          required_pass=true
          for r in "$R_STYLE" "$R_HELM_LINT" "$R_KUBECONFORM" "$R_CONFTEST" \
                   "$R_POLARIS" "$R_VERSION_DRIFT" ; do
            if [ "$r" != "success" ] ; then
              required_pass=false
            fi
          done
          if [ "$required_pass" = "true" ] ; then
            echo "verdict=pass" >> $GITHUB_OUTPUT
            echo "✅ All 6 required gates passed"
          else
            echo "verdict=fail" >> $GITHUB_OUTPUT
            echo "❌ At least one required gate failed"
          fi

      - name: Emoji map for result values
        id: emoji
        env:
          STYLE:           ${{ needs.style.result }}
          HELM_LINT:       ${{ needs.helm-lint.result }}
          CT_LINT:         ${{ needs.ct-lint.result }}
          SCHEMA:          ${{ needs.schema-of-schema.result }}
          HELM_DOCS:       ${{ needs.helm-docs.result }}
          KUBECONFORM:     ${{ needs.kubeconform.result }}
          CONFTEST:        ${{ needs.conftest.result }}
          TRIVY:           ${{ needs.trivy.result }}
          CHECKOV:         ${{ needs.checkov.result }}
          POLARIS:         ${{ needs.polaris.result }}
          ARTIFACTHUB:     ${{ needs.artifacthub.result }}
          SBOM:            ${{ needs.sbom.result }}
          VERSION_DRIFT:   ${{ needs.version-drift.result }}
        run: |
          map() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }
          {
            echo "E_STYLE=$(map "$STYLE")"
            echo "E_HELM_LINT=$(map "$HELM_LINT")"
            echo "E_CT_LINT=$(map "$CT_LINT")"
            echo "E_SCHEMA=$(map "$SCHEMA")"
            echo "E_HELM_DOCS=$(map "$HELM_DOCS")"
            echo "E_KUBECONFORM=$(map "$KUBECONFORM")"
            echo "E_CONFTEST=$(map "$CONFTEST")"
            echo "E_TRIVY=$(map "$TRIVY")"
            echo "E_CHECKOV=$(map "$CHECKOV")"
            echo "E_POLARIS=$(map "$POLARIS")"
            echo "E_ARTIFACTHUB=$(map "$ARTIFACTHUB")"
            echo "E_SBOM=$(map "$SBOM")"
            echo "E_VERSION_DRIFT=$(map "$VERSION_DRIFT")"
          } >> $GITHUB_OUTPUT

      - name: Sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2.9.0
        with:
          header: helm-meta-swarm-lint
          message: |
            ## helm-meta-swarm-lint summary

            | Stage                                        | Result                                                                      |
            |----------------------------------------------|-----------------------------------------------------------------------------|
            | 02 / style (yamllint + shellcheck + pre-commit) | ${{ steps.emoji.outputs.E_STYLE }} `${{ needs.style.result }}`           |
            | 03 / helm lint --strict                      | ${{ steps.emoji.outputs.E_HELM_LINT }} `${{ needs.helm-lint.result }}`     |
            | 04 / chart-testing                           | ${{ steps.emoji.outputs.E_CT_LINT }} `${{ needs.ct-lint.result }}`         |
            | 05 / values.schema.json self-validation      | ${{ steps.emoji.outputs.E_SCHEMA }} `${{ needs.schema-of-schema.result }}` |
            | 06 / helm-docs sync                          | ${{ steps.emoji.outputs.E_HELM_DOCS }} `${{ needs.helm-docs.result }}`     |
            | 07 / kubeconform (1.28/1.29/1.30/1.31)        | ${{ steps.emoji.outputs.E_KUBECONFORM }} `${{ needs.kubeconform.result }}` |
            | 08 / Conftest (11 EFE rules + CIS top-10)    | ${{ steps.emoji.outputs.E_CONFTEST }} `${{ needs.conftest.result }}`       |
            | 09 / Trivy IaC                                | ${{ steps.emoji.outputs.E_TRIVY }} `${{ needs.trivy.result }}`             |
            | 10 / Checkov (soft-fail)                      | ${{ steps.emoji.outputs.E_CHECKOV }} `${{ needs.checkov.result }}`         |
            | 11 / Polaris (severity-tiered)               | ${{ steps.emoji.outputs.E_POLARIS }} `${{ needs.polaris.result }}`         |
            | 12 / ArtifactHub metadata                     | ${{ steps.emoji.outputs.E_ARTIFACTHUB }} `${{ needs.artifacthub.result }}` |
            | 13 / SBOM (CycloneDX, 30d artifact)           | ${{ steps.emoji.outputs.E_SBOM }} `${{ needs.sbom.result }}`               |
            | 15 / version-drift (workflow ↔ renovate)      | ${{ steps.emoji.outputs.E_VERSION_DRIFT }} `${{ needs.version-drift.result }}` |

            **Overall verdict** : **${{ steps.compose.outputs.verdict }}**

            Required gates (6) : `style`, `helm-lint`, `kubeconform` (×4), `conftest`, `polaris`, `version-drift`.
            Soft gates : `helm-docs` (AD21 — promoted to hard in PR #16).
            Informational : `ct-lint`, `schema-of-schema`, `trivy`, `checkov`, `artifacthub`, `sbom`.

            <sub>Workflow : `helm-meta-swarm-lint.yml` ; cf. `docs/EFE_A1_PHASE2_PR15_ARCHITECTURE.md`.</sub>

      - name: Fail the workflow if any required gate failed
        if: steps.compose.outputs.verdict == 'fail'
        run: |
          echo "::error::At least one REQUIRED gate failed.  See sticky comment for the matrix."
          exit 1
