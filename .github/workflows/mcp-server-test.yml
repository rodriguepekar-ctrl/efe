name: mcp-server-test

on:
  push:
    branches: [ main ]
    paths:
      - 'mcp-server/**'
      - 'playground/backend/**'
      - '.github/workflows/mcp-server-test.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'playground/backend/**'
      - '.github/workflows/mcp-server-test.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit + dispatcher (no playground)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        working-directory: mcp-server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint (ruff if available)
        working-directory: mcp-server
        run: |
          pip install ruff || true
          ruff check . || true

      - name: Run unit tests (no e2e)
        working-directory: mcp-server
        run: |
          pytest -q \
            --ignore=tests/test_e2e_playground.py \
            --cov=mcp_server --cov-report=term

  e2e-playground:
    name: E2E against playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install playground deps
        run: |
          python -m pip install --upgrade pip
          pip install -r playground/backend/requirements.txt

      - name: Install mcp-server with tests
        working-directory: mcp-server
        run: |
          pip install -e ".[test]"

      - name: Run e2e tests
        working-directory: mcp-server
        env:
          PYTHONPATH: ${{ github.workspace }}/playground/backend
        run: |
          pytest -q tests/test_e2e_playground.py

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t efe-mcp-server:ci mcp-server/

      - name: Smoke check (image starts and reports startup error w/o env)
        run: |
          # No EFE_OIDC_TOKEN → exit 2 with auth error.
          # We run with a 5-second timeout to catch boot failures.
          set +e
          docker run --rm efe-mcp-server:ci 2>&1 | head -n 5
          test $? -ne 0
