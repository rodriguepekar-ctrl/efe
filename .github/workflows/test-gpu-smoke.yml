# Sprint **D28 (Φ-D)** — GPU smoke test workflow.
#
# Cf. `docs/EFE_KERNELS_ARCHITECTURE.md` § 24.
#
# **Audit fix K-A5** — pre-fix the architecture committed to a
# `test-gpu-smoke` CI workflow (architecture § 24.3) but no
# `.github/workflows/test-gpu-smoke.yml` was actually shipped with
# the D28 code drop. This file restores the contract.
#
# Triggers :
#   * Manual `workflow_dispatch` — operators kick a smoke run from
#     the GitHub UI when validating a CUDA kernel change.
#   * PRs labelled `gpu` — focused review of GPU-affecting changes.
#   * Nightly cron — soak-style full coverage.
#
# Runner :
#   * `[self-hosted, gpu, t4]` — minimum spec for SLO C-1 validation.
#   * Falls back to GitHub-hosted runners when CUDA toolchain is not
#     needed (the `cargo-check-no-cuda` job).

name: test-gpu-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened]
  schedule:
    # Every day at 03:00 UTC.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # -------------------------------------------------------------------
  # Job 1 — `cargo check` without `--features cuda` on a regular
  # GitHub-hosted Linux runner. Catches workspace breakage on the
  # default build path, which is the one most contributors will hit.
  # -------------------------------------------------------------------
  cargo-check-no-cuda:
    name: cargo check (default features)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy, rustfmt
      - name: cargo check workspace (no cuda)
        run: cargo check --workspace --all-targets
      - name: cargo build efe-kernels (no cuda)
        run: cargo build -p efe-kernels
      - name: cargo test efe-kernels (no cuda)
        run: cargo test -p efe-kernels --lib
      - name: cargo test efe-telemetry GPU instruments
        run: cargo test -p efe-telemetry --lib gpu_instruments

  # -------------------------------------------------------------------
  # Job 2 — Cross-backend smoke on a self-hosted GPU runner.
  # Skipped when the runner label is unavailable (e.g. PR from a fork
  # without GPU access).
  #
  # Only runs when the PR carries the `gpu` label OR on workflow_dispatch
  # OR on the nightly schedule. This avoids burning GPU minutes on
  # every PR.
  # -------------------------------------------------------------------
  gpu-cross-backend-smoke:
    name: cross-backend smoke (T4)
    if: |
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'gpu'))
    runs-on: [self-hosted, gpu, t4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe nvcc + GPU
        run: |
          which nvcc
          nvcc --version
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: cargo build efe-kernels --features cuda
        run: cargo build -p efe-kernels --features cuda
      - name: cargo test cross-backend (cuda)
        # All `cross_backend_*.rs` tests are #[cfg(feature = "cuda")].
        # We run them sequentially to keep VRAM pressure predictable.
        run: |
          cargo test -p efe-kernels --features cuda --tests \
            -- --test-threads=1 --nocapture
      - name: cargo test integration_smoke (cuda)
        run: cargo test -p efe-kernels --features cuda --test integration_smoke

  # -------------------------------------------------------------------
  # Job 3 — `cuda-memcheck` nightly on the smoke subset.
  # Catches device-side memory errors / use-after-free that escape
  # standard test runs. Cf. architecture § 23.2.
  # -------------------------------------------------------------------
  gpu-cuda-memcheck:
    name: cuda-memcheck (nightly)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, gpu, t4]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: build test binaries (cuda)
        run: cargo test -p efe-kernels --features cuda --no-run
      - name: cuda-memcheck cross_backend_softmax
        run: |
          # Find the freshly-built test binary (cargo emits a hash-stamped name).
          BIN=$(find target/debug/deps -maxdepth 1 -name 'cross_backend_softmax-*' -executable | head -n1)
          test -n "$BIN" || (echo "test binary not found" && exit 1)
          cuda-memcheck --tool memcheck --error-exitcode 17 "$BIN"
      - name: cuda-memcheck integration_smoke
        run: |
          BIN=$(find target/debug/deps -maxdepth 1 -name 'integration_smoke-*' -executable | head -n1)
          test -n "$BIN" || (echo "test binary not found" && exit 1)
          cuda-memcheck --tool memcheck --error-exitcode 17 "$BIN"

  # -------------------------------------------------------------------
  # Job 4 — Pin test (Python) + structural validation.
  # No GPU required ; runs on the standard Ubuntu runner so it gates
  # every PR by default.
  # -------------------------------------------------------------------
  pin-tests-structure:
    name: pin tests (efe-kernels structure + observability)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest pyyaml
      - name: Run efe-kernels pin tests
        run: |
          python -m pytest \
            scripts/tests/test_efe_kernels_structure.py \
            scripts/tests/test_efe_kernels_observability.py \
            -q --tb=short
