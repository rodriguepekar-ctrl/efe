# Sprint D24 (Φ-B) — `@efe/sdk` PR-gate test workflow.
#
# Cf. docs/EFE_TYPESCRIPT_SDK_EXTENSION_ARCHITECTURE.md.
#
# Runs on every PR that touches `clients/typescript/@efe/sdk/`.
#
# Matrix : 3 OS × 3 Node versions (Linux/macOS/Windows × 18/20/22).
# A separate job runs Playwright e2e on Linux only (Docker required
# for Envoy translator).
#
# Pin tests Python : ~32 anti-régression structurelle.
# Bundle size budget : strict ≤ 50 KB gz browser entry.

name: sdk-typescript-test

on:
  pull_request:
    paths:
      - "clients/typescript/@efe/sdk/**"
      - "scripts/tests/test_d24_typescript_sdk_*.py"
      - ".github/workflows/sdk-typescript-test.yml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

env:
  # Disable Node telemetry — CI runners shouldn't phone home.
  ADBLOCK: "1"
  DISABLE_OPENCOLLECTIVE: "1"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Vitest matrix (unit + integration + coverage).
  # ──────────────────────────────────────────────────────────────
  vitest:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        node: ["18", "20", "22"]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/typescript/@efe/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        run: pnpm typecheck

      - name: Vitest unit + integration + coverage
        run: pnpm test

      - name: Upload coverage
        if: matrix.os == 'ubuntu-22.04' && matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-typescript-coverage
          path: clients/typescript/@efe/sdk/coverage
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Build + bundle size budget.
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build + bundle size budget
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/typescript/@efe/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build dist/
        run: pnpm build

      - name: Bundle size budget
        run: pnpm bundlesize

  # ──────────────────────────────────────────────────────────────
  # Job 3 — Lint (Biome).
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: clients/typescript/@efe/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: biome check
        run: pnpm lint
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # Job 4 — 3 framework examples (smoke build).
  # ──────────────────────────────────────────────────────────────
  examples:
    name: Examples build (React + Vue + Express)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }

      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile

      - name: Build SDK (so examples can workspace:* link)
        working-directory: clients/typescript/@efe/sdk
        run: pnpm build

      - name: Build React example
        working-directory: clients/typescript/@efe/sdk/examples/react
        run: pnpm build

      - name: Build Vue example
        working-directory: clients/typescript/@efe/sdk/examples/vue
        run: pnpm build

      - name: Build Express example
        working-directory: clients/typescript/@efe/sdk/examples/express
        run: pnpm build

  # ──────────────────────────────────────────────────────────────
  # Job 5 — Playwright e2e (Chromium + WebKit + Firefox).
  # Requires Docker for the Envoy gRPC-Web translator.
  # ──────────────────────────────────────────────────────────────
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/typescript/@efe/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit firefox

      - name: Run e2e (envoy + vite + grpc mock)
        env:
          PLAYWRIGHT_USE_ENVOY: "1"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: clients/typescript/@efe/sdk/playwright-report
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # Job 6 — Pin tests (Python — structural anti-régression).
  # ──────────────────────────────────────────────────────────────
  pin-tests:
    name: Pin tests (Python — structure)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install pytest
        run: pip install pytest
      - name: Run @efe/sdk pin tests
        run: |
          python -m pytest scripts/tests/test_d24_typescript_sdk_extension.py \
            -v --tb=short

  # ──────────────────────────────────────────────────────────────
  # Job 7 — Bash syntax check (scripts/*.sh).
  # ──────────────────────────────────────────────────────────────
  bash-syntax:
    name: Bash syntax (scripts/)
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    defaults:
      run:
        working-directory: clients/typescript/@efe/sdk
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every script
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done
          echo "✅ all scripts parse OK"
