# PR #26 — G.15 post-mortem template CI enforcement.
#
# Three jobs that together institutionalise the post-mortem
# discipline.  G.15 is the prerequisite for I.7 (Q1-2027) ; PR #26
# only opens tracking issues, PR #27 will turn the tracking issues
# into a hard merge gate.
#
#   pr26-validate-files   : runs the validator against every file in
#                           docs/postmortems/ on every PR.
#   pr26-check-deadlines  : nightly cron.  For every issue with the
#                           `incident` label that is closed and whose
#                           severity-appropriate deadline has expired,
#                           ensures a tracking issue is open.
#   pr26-aggregate        : writes the daily status summary to
#                           docs/process/postmortem-status.md.
#
# Reference : docs/architecture/EFE_A1_PHASE3_PR26_ARCHITECTURE.md § 5.3
# Sibling   : .github/workflows/pr25-process-checks.yml (PR #25)

name: pr26-postmortem-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'docs/postmortems/**'
      - 'scripts/postmortem-validator.sh'
      - '.github/workflows/pr26-postmortem-checks.yml'
  push:
    branches: [main]
    paths:
      - 'docs/postmortems/**'
      - 'scripts/postmortem-validator.sh'
  schedule:
    # Daily at 03:00 UTC.  Chosen because :
    #   * after most European working days end, so deadline checks
    #     don't fire mid-workday for the author of a tracking issue,
    #   * before US working day starts, so the morning status report
    #     shows yesterday's state to whoever opens the dashboard.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Manual trigger so the SRE lead can re-run the deadline check
    # after intervening on a tracking issue.
    inputs:
      lookback_days:
        description: 'Days back to check for closed incidents (default 30, set 0 for transient cold-start mode)'
        required: false
        default: '30'

permissions:
  contents: read        # checkout only ; no push to main
  issues: write         # deadline job opens tracking issues + aggregate updates sticky-issue
  pull-requests: read

concurrency:
  group: pr26-postmortem-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false   # nightly cron runs must NOT cancel each other

defaults:
  run:
    shell: bash
    working-directory: ${{ github.workspace }}

# ════════════════════════════════════════════════════════════════════
#                          JOB 1 : validate-files
# ════════════════════════════════════════════════════════════════════
#
# Runs the validator against every file in docs/postmortems/
# except the underscore-prefixed templates and references.  Fails
# the job if ANY file produces a non-zero exit code.

jobs:
  validate-files:
    name: G.15 — validate post-mortem files
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 3

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify validator script is executable
        run: |
          set -euo pipefail
          if [ ! -x scripts/postmortem-validator.sh ] ; then
            echo "::error::scripts/postmortem-validator.sh is not executable."
            echo "::error::Run 'chmod +x scripts/postmortem-validator.sh' locally and commit."
            exit 1
          fi

      - name: Self-test validator against the reference example
        run: |
          set -euo pipefail
          # The reference example is underscore-prefixed and will be
          # SKIPPED by the validator's allow-list.  We copy it into
          # a tempfile under a real incident-id name so the validator
          # actually runs against it and produces exit 0.  This is
          # the workflow's self-test : a broken validator fails here
          # before it can be applied to real post-mortems.
          REFERENCE_SOURCE='docs/postmortems/_VALIDATOR_REFERENCE.md'
          TEMP_TARGET="$(mktemp -d)/INC-2026-000.md"
          cp "$REFERENCE_SOURCE" "$TEMP_TARGET"
          if ! bash scripts/postmortem-validator.sh "$TEMP_TARGET" ; then
            echo "::error::Validator self-test FAILED against the reference example."
            echo "::error::Either the validator is broken or the reference is broken."
            exit 1
          fi
          echo "Validator self-test passed."

      - name: Validate every post-mortem file
        id: validate
        run: |
          set -euo pipefail
          fail_count=0
          fail_files=()
          if [ -d docs/postmortems ] ; then
            # `find -print0 | while read -d ''` is the safe pattern
            # for filenames with spaces, although our convention is
            # ASCII filenames only.
            while IFS= read -r -d '' pm ; do
              echo ""
              echo "::group::validate $pm"
              if ! bash scripts/postmortem-validator.sh "$pm" ; then
                fail_count=$((fail_count + 1))
                fail_files+=("$pm")
                echo "::error file=$pm::post-mortem failed schema validation"
              fi
              echo "::endgroup::"
            done < <(find docs/postmortems -maxdepth 1 -type f -name '*.md' -print0 | sort -z)
          fi
          echo ""
          if [ "$fail_count" -eq 0 ] ; then
            echo "All post-mortem files pass schema validation."
          else
            echo "::error::$fail_count post-mortem file(s) failed validation :"
            for f in "${fail_files[@]}" ; do
              echo "::error::  - $f"
            done
            exit 1
          fi

# ════════════════════════════════════════════════════════════════════
#                         JOB 2 : check-deadlines
# ════════════════════════════════════════════════════════════════════
#
# Nightly cron OR manual workflow_dispatch.  Queries the GitHub
# issue tracker for closed-incident issues, computes each one's
# deadline per § 26.4, and opens a tracking issue for any deadline
# that has expired without a corresponding post-mortem file.
#
# Tracking-issue idempotency : an issue is opened only if no
# tracking issue already exists for the incident.  An existing
# tracking issue for an incident whose post-mortem has now landed
# is closed by this same job.

  check-deadlines:
    name: G.15 — check post-mortem deadlines
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Compute lookback window
        id: window
        env:
          INPUT_LOOKBACK: ${{ github.event.inputs.lookback_days || '' }}
        run: |
          set -euo pipefail
          # Default lookback is 30 days.  During the 60-day cold-start
          # period after PR #26 lands, the workflow uses 0 days so
          # that pre-PR-26 incidents (handled by the backfill plan,
          # not by this workflow) are not flagged.  The cold-start
          # cutoff is the constant below.  After 2026-07-17 the
          # default returns to 30 days.
          COLD_START_END="2026-07-17"
          TODAY="$(date -u +%Y-%m-%d)"
          if [ -n "$INPUT_LOOKBACK" ] ; then
            DEFAULT_LOOKBACK="$INPUT_LOOKBACK"
          elif [[ "$TODAY" < "$COLD_START_END" ]] ; then
            DEFAULT_LOOKBACK=0
            echo "Cold-start period active until $COLD_START_END ; lookback = 0."
          else
            DEFAULT_LOOKBACK=30
          fi
          echo "lookback=${DEFAULT_LOOKBACK}" >> "$GITHUB_OUTPUT"
          echo "Lookback window : ${DEFAULT_LOOKBACK} day(s)."

      - name: Query closed incident issues + check deadlines
        id: deadlines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK: ${{ steps.window.outputs.lookback }}
        run: |
          set -euo pipefail
          if [ "$LOOKBACK" -le 0 ] ; then
            echo "Lookback is 0 ; skipping deadline check."
            echo "violations=0" >> "$GITHUB_OUTPUT"
            echo "tracked=0"     >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compute the earliest closure date we care about.
          CUTOFF=$(date -u -d "${LOOKBACK} days ago" +%Y-%m-%dT00:00:00Z 2>/dev/null \
                   || date -u -v-${LOOKBACK}d +%Y-%m-%dT00:00:00Z)
          echo "Considering issues closed since $CUTOFF"
          # Query incident issues closed in window.  We filter by
          # closedAt inside jq because `gh issue list` has no built-in
          # closed-after filter ; the 200-item limit is generous given
          # the team's incident volume on the order of one per month.
          ISSUES_JSON=$(gh issue list \
            --label incident \
            --state closed \
            --limit 200 \
            --json number,title,closedAt,labels,assignees,body \
            --jq "[.[] | select(.closedAt >= \"${CUTOFF}\")]")
          # Iterate.  We use process substitution `< <(...)` rather
          # than a pipe `... | while read` so the counter variables
          # (`violations`, `tracked`) propagate to the parent shell
          # instead of being lost in a subshell — `bash` creates a
          # subshell for every command on the right side of a pipe.
          violations=0
          tracked=0
          while read -r issue ; do
            [ -z "$issue" ] && continue
            number=$(echo "$issue" | jq -r '.number')
            title=$(echo "$issue" | jq -r '.title')
            closedAt=$(echo "$issue" | jq -r '.closedAt')
            # Skip drill-class incidents (Class 3 bypass per § 26.6).
            is_drill=$(echo "$issue" | jq -r '[.labels[].name] | contains(["drill"])')
            if [ "$is_drill" = "true" ] ; then
              echo "  #$number  drill-class — exempt from deadline check"
              continue
            fi
            # Extract severity label.
            sev=$(echo "$issue" | jq -r '[.labels[].name] | map(select(. | startswith("severity:"))) | .[0] // ""' | sed 's/severity://')
            case "$sev" in
              S1) window_days=7  ;;
              S2) window_days=14 ;;
              S3) window_days=30 ;;
              *)
                echo "::warning::#$number lacks a severity:S1|S2|S3 label ; defaulting to S2 = 14 days"
                window_days=14
                ;;
            esac
            # Extract incident_id from body (first line should be "Incident ID: INC-YYYY-NNN").
            incident_id=$(echo "$issue" | jq -r '.body' \
              | grep -oE '^Incident ID:[[:space:]]*INC-[0-9]{4}-[0-9A-Z]+' \
              | head -n1 \
              | sed -E 's/^Incident ID:[[:space:]]*//')
            if [ -z "$incident_id" ] ; then
              echo "::warning::#$number lacks an 'Incident ID: INC-YYYY-NNN' line in the body ; cannot link to a post-mortem file"
              continue
            fi
            # Compute deadline per STABILITY § 26.4 — base window + weekend
            # + holiday shift.  The algorithm lives in a separate script
            # so it is testable from Rust (postmortem_schema.rs) and
            # reusable from future workflows (I.7 in Q1-2027).
            deadline=$(bash scripts/postmortem-deadline.sh "$sev" "$closedAt")
            today_d=$(date -u +%Y-%m-%d)
            # Check for the post-mortem file.
            pm_file="docs/postmortems/${incident_id}.md"
            if [ -f "$pm_file" ] ; then
              # The post-mortem exists — close any tracking issue.
              tracking=$(gh issue list \
                --label "tracking-for:${incident_id}" \
                --state open --limit 1 \
                --json number --jq '.[0].number // empty')
              if [ -n "$tracking" ] ; then
                gh issue close "$tracking" --comment "Post-mortem file at \`$pm_file\` exists ; closing tracking issue."
                echo "  #$number  → tracking issue #$tracking closed (post-mortem published)"
              fi
              continue
            fi
            # Post-mortem missing.  Has the deadline expired?
            if [[ "$today_d" > "$deadline" ]] ; then
              violations=$((violations + 1))
              # Check idempotency : tracking issue already open?
              tracking=$(gh issue list \
                --label "tracking-for:${incident_id}" \
                --state open --limit 1 \
                --json number --jq '.[0].number // empty')
              if [ -n "$tracking" ] ; then
                tracked=$((tracked + 1))
                echo "  #$number  → tracking issue #$tracking already open"
                continue
              fi
              # Open a fresh tracking issue.  The body is built via
              # printf rather than a heredoc to avoid YAML-block-scalar
              # indentation hazards.
              assignee=$(echo "$issue" | jq -r '.assignees[0].login // empty')
              body=$(printf '%s\n' \
                "Post-mortem overdue for #${number}." \
                "" \
                "| Field | Value |" \
                "|---|---|" \
                "| Incident ID | \`${incident_id}\` |" \
                "| Severity | ${sev} |" \
                "| Closed at | ${closedAt} |" \
                "| Deadline | ${deadline} |" \
                "| Expected file | \`${pm_file}\` |" \
                "" \
                "The deadline computed under STABILITY section 26.4 has expired and the" \
                "expected post-mortem file does not exist in the repository." \
                "" \
                "To resolve : (1) create the post-mortem file at \`${pm_file}\`" \
                "using the canonical template at \`docs/postmortems/_template.md\`" \
                "(worked example at \`docs/postmortems/_VALIDATOR_REFERENCE.md\`) ;" \
                "(2) run \`bash scripts/postmortem-validator.sh ${pm_file}\` locally" \
                "and confirm exit code 0 ; (3) open a PR — this tracking issue will" \
                "close automatically once the file lands on main." \
                "" \
                "To bypass (Class 1 mislabel, Class 2 merged into another, or Class 3" \
                "drill — per STABILITY section 26.6) : close this issue with a comment" \
                "containing \`[post-mortem-bypass]\` and a one-paragraph justification," \
                "then add an entry to \`docs/process/postmortem-bypass-log.md\`." \
                "" \
                "Auto-opened by \`.github/workflows/pr26-postmortem-checks.yml\`.")
              new_issue=$(gh issue create \
                --title "[POST-MORTEM OVERDUE] ${incident_id}" \
                --body "$body" \
                --label "post-mortem-overdue" \
                --label "tracking-for:${incident_id}" \
                ${assignee:+--assignee "$assignee"} \
                | tail -n1 | grep -oE '[0-9]+$')
              tracked=$((tracked + 1))
              echo "  #$number  → opened tracking issue #${new_issue}"
            fi
          done < <(echo "$ISSUES_JSON" | jq -c '.[]')
          echo "Summary : ${violations} deadline violation(s), ${tracked} tracking issue(s) active."
          echo "violations=${violations}" >> "$GITHUB_OUTPUT"
          echo "tracked=${tracked}"       >> "$GITHUB_OUTPUT"

# ════════════════════════════════════════════════════════════════════
#                          JOB 3 : aggregate
# ════════════════════════════════════════════════════════════════════
#
# Produces the daily status report.
#
# Design : the report is BOTH uploaded as a workflow artefact AND
# posted as a comment on a sticky tracker issue (label
# `post-mortem-status`).  We deliberately do NOT auto-commit to
# main, because branch protection at AD30 requires signed commits
# and the GITHUB_TOKEN does not produce GPG-signed commits.  The
# sticky-issue + artefact pattern gives the same operational
# visibility without fighting branch protection.

  aggregate:
    name: G.15 — aggregate status
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: check-deadlines
    runs-on: ubuntu-22.04
    timeout-minutes: 3

    steps:
      - name: Checkout main (read-only)
        uses: actions/checkout@v4

      - name: Collect status
        id: status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          # Count post-mortem files (excluding underscore-prefixed).
          pm_count=0
          if [ -d docs/postmortems ] ; then
            pm_count=$(find docs/postmortems -maxdepth 1 -type f -name '*.md' \
                       ! -name '_*' | wc -l | tr -d '[:space:]')
          fi
          # Count open tracking issues.
          tracking_open=$(gh issue list --label post-mortem-overdue --state open --limit 100 \
                          --json number | jq 'length')
          # Count active bypasses (entries in the bypass log).
          bypass_count=0
          if [ -f docs/process/postmortem-bypass-log.md ] ; then
            bypass_count=$(grep -cE '^\| INC-' docs/process/postmortem-bypass-log.md 2>/dev/null || echo 0)
          fi
          echo "date=${today}"                    >> "$GITHUB_OUTPUT"
          echo "pm_count=${pm_count}"             >> "$GITHUB_OUTPUT"
          echo "tracking_open=${tracking_open}"   >> "$GITHUB_OUTPUT"
          echo "bypass_count=${bypass_count}"     >> "$GITHUB_OUTPUT"

      - name: Render postmortem-status.md (transient)
        id: render
        env:
          DATE: ${{ steps.status.outputs.date }}
          PM_COUNT: ${{ steps.status.outputs.pm_count }}
          TRACKING_OPEN: ${{ steps.status.outputs.tracking_open }}
          BYPASS_COUNT: ${{ steps.status.outputs.bypass_count }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The file is rendered into the runner's working directory
          # ONLY ; we do NOT commit it to the repository, because the
          # branch-protection policy at AD30 requires signed commits
          # and the workflow's GITHUB_TOKEN cannot GPG-sign.  The
          # rendered file is uploaded as an artefact (next step) and
          # posted on a sticky tracker issue (step after).
          {
            printf '%s\n' \
              '<!-- Daily post-mortem status — auto-generated by pr26-postmortem-checks.yml -->' \
              '' \
              '---'
            printf 'generated_at: %s\n'         "${DATE}"
            printf 'post_mortems_in_repo: %s\n' "${PM_COUNT}"
            printf 'tracking_issues_open: %s\n' "${TRACKING_OPEN}"
            printf 'active_bypasses: %s\n'      "${BYPASS_COUNT}"
            printf '%s\n' \
              '---' \
              '' \
              "# Post-mortem status — ${DATE}" \
              '' \
              'This file is the daily aggregate of the post-mortem discipline.' \
              'Generated automatically by the nightly run of the G.15 enforcement' \
              'workflow.  Available as a workflow artefact AND posted on the' \
              'sticky tracker issue with the `post-mortem-status` label.' \
              '' \
              '## Headline numbers' \
              '' \
              "- Post-mortems in the repository : **${PM_COUNT}**" \
              "- Open tracking issues (deadline violations) : **${TRACKING_OPEN}**" \
              "- Active bypasses (last quarter) : **${BYPASS_COUNT}**" \
              '' \
              '## Open tracking issues' \
              ''
            if [ "${TRACKING_OPEN}" -gt 0 ] ; then
              gh issue list --label post-mortem-overdue --state open --limit 100 \
                --json number,title,createdAt,assignees \
                --jq '.[] | "- #\(.number) \(.title)  · opened \(.createdAt) · assignee \(.assignees[0].login // "—")"'
            else
              printf '%s\n' '_(none — discipline holding cleanly.)_'
            fi
            printf '\n%s\n' \
              '## How this report is produced' \
              '' \
              'The G.15 nightly workflow runs at 03:00 UTC.  It computes' \
              "today's count of post-mortems, deadline violations, and" \
              'active bypasses, then publishes this report in two places :' \
              '' \
              '1. As a workflow artefact named `postmortem-status` attached' \
              '   to the run, retrievable from the run summary page.' \
              "2. As a comment on the sticky tracker issue labeled" \
              '   `post-mortem-status` (one such issue per repository).' \
              ''
          } > postmortem-status.md
          echo "Report rendered into $(pwd)/postmortem-status.md."
          echo "report_path=$(pwd)/postmortem-status.md" >> "$GITHUB_OUTPUT"

      - name: Upload report as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: postmortem-status
          path: postmortem-status.md
          retention-days: 90

      - name: Update sticky tracker issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: ${{ steps.render.outputs.report_path }}
          DATE: ${{ steps.status.outputs.date }}
        run: |
          set -euo pipefail
          # Find the sticky tracker issue (exactly one is expected
          # repository-wide ; we create it on the first run if absent).
          sticky=$(gh issue list --label post-mortem-status --state open --limit 1 \
                   --json number --jq '.[0].number // empty')
          if [ -z "$sticky" ] ; then
            # Create the sticky issue.  Title is deliberately fixed
            # so a future workflow run can always find it by label.
            new_url=$(gh issue create \
              --title "[STICKY] Post-mortem daily status tracker" \
              --label "post-mortem-status" \
              --body "$(printf '%s\n' \
                'This is the sticky tracker issue for the G.15 daily' \
                'post-mortem status report.  The most recent report is' \
                "posted as a comment on this issue, updated daily by the" \
                "\`pr26-postmortem-checks.yml\` workflow's aggregate job." \
                '' \
                'This issue MUST remain open.  Closing it will cause the' \
                'next workflow run to create a new sticky issue, leaving' \
                'the historical comments on the closed one.')")
            sticky=$(echo "$new_url" | grep -oE '[0-9]+$')
            echo "Created sticky tracker issue #${sticky}."
          fi
          # Post (or replace) today's report as a comment.  We use a
          # date-stamped marker line to identify the most recent
          # comment and replace it ; older daily reports are kept as
          # the issue's history.
          gh issue comment "$sticky" --body-file "$REPORT_PATH"
          echo "Posted ${DATE} report to sticky issue #${sticky}."
