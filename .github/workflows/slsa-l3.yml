name: SLSA Level 3 attestation

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read           # SLSA generator inspects workflow run

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88

      - name: Build release binaries
        run: |
          cargo build --workspace --exclude efe-ffi --release --locked

      - name: Compute digests
        id: hash
        run: |
          (
            cd target/release
            shasum -a 256 efe-server efe-admin 2>/dev/null \
              | base64 -w 0
          ) > digests.b64
          echo "digests=$(cat digests.b64)" >> "$GITHUB_OUTPUT"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: efe-binaries
          path: |
            target/release/efe-server
            target/release/efe-admin

  provenance:
    needs: build
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      upload-assets: true
      upload-tag-name: ${{ github.event.release.tag_name }}

  # The SLSA generator publishes the attestation alongside the release.
  # Cosign verifies via :
  #   cosign verify-attestation \
  #     --certificate-identity-regexp ".*efe-ai/efe.*" \
  #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
  #     --type slsaprovenance \
  #     efe-server-2.4.0.intoto.jsonl
