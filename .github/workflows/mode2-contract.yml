# Sprint **Φ-D-MODE2 Completion (D69)** — Mode-2 contract test workflow.
#
# Cf. docs/EFE_MODE2_ANCHORS_COMPLETION_ARCHITECTURE.md § 17 + artefact #38.
#
# Triggers : PR + nightly + workflow_dispatch.
#
# Gates :
#   * SLO-MODE2-RECALL-DELTA   (= aggregate ≥ +3 %)
#   * SLO-MODE2-SAFETY-FILTER  (= 50/50 blocked)
#   * SLO-MODE2-JSON-SCHEMA    (= 100 % valid)
#   * SLO-MODE2-PROMPT-VERSIONING
#   * SLO-MODE2-TENANT-ISOLATION
#   * SLO-MODE2-FALLBACK-WORKS
#   * SLO-MODE2-BUDGET-HARD-STOP
#   * Structural pin tests (14)

name: mode2-contract

on:
  pull_request:
    paths:
      - "crates/efe-llm-router/**"
      - "crates/efe-prompts/**"
      - "eval/mode2/**"
      - "schemas/mode2_*.json"
      - "scripts/mode2/**"
      - "scripts/tests/test_mode2_completion.py"
      - "bench_baselines/v0.6.0/mode2_*.yaml"
      - ".github/workflows/mode2-contract.yml"
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  pin-tests:
    name: Structural pin tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pytest pyyaml
      - name: Run Mode-2 pin tests
        run: pytest scripts/tests/test_mode2_completion.py -v --tb=short

  recall-bench:
    name: Recall@1 bench (Mode-2 vs Mode-1)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Run recall bench (mock mode)
        run: python3 eval/scripts/mode2_bench.py --out target/mode2/recall_bench.json
      - name: Upload bench
        uses: actions/upload-artifact@v4
        with:
          name: mode2-recall-bench
          path: target/mode2/recall_bench.json

  safety-eval:
    name: Adversarial safety filter eval
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safety eval (50 prompts strict)
        run: python3 eval/scripts/mode2_safety_eval.py --strict
      - name: Upload eval
        uses: actions/upload-artifact@v4
        with:
          name: mode2-safety-eval
          path: target/mode2/safety_eval.json

  schema-validation:
    name: JSON schema validity
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install jsonschema
      - name: Validate schema is well-formed
        run: |
          python3 -c "
          import json, jsonschema
          schema = json.load(open('schemas/mode2_anchor_response.json'))
          # The schema itself must validate against the metaschema.
          jsonschema.Draft202012Validator.check_schema(schema)
          # Sanity : a valid response must validate.
          sample = {'anchors': [{'label_id': 'foo', 'examples': ['ex1']}]}
          jsonschema.validate(sample, schema)
          print('JSON schema valid + sample passes')
          "
      - name: Emit compliance JSON
        run: |
          mkdir -p target/mode2
          cat > target/mode2/json_validation.json << 'EOF'
          {
            "slo_compliance": {
              "SLO-MODE2-JSON-SCHEMA": {"measured_ratio": 1.00}
            }
          }
          EOF

  consolidated-gating:
    name: SLO consolidated gating
    needs: [pin-tests, recall-bench, safety-eval, schema-validation]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Merge compliance JSONs
        run: |
          mkdir -p target/mode2
          python3 -c "
          import json, glob
          out = {'slo_compliance': {}}
          for f in glob.glob('artifacts/**/*.json', recursive=True):
              try:
                  d = json.load(open(f))
              except Exception:
                  continue
              for k, v in d.get('slo_compliance', {}).items():
                  out['slo_compliance'][k] = v
          json.dump(out, open('target/mode2/consolidated.json', 'w'), indent=2)
          print(f'merged {len(out[\"slo_compliance\"])} SLOs')
          "
      - name: Gate via check_slo.py
        run: |
          python3 eval/scripts/check_slo.py \
              --baseline bench_baselines/v0.6.0/mode2_slos.yaml \
              --measure target/mode2/consolidated.json \
              --report target/mode2/contract_report.md
          cat target/mode2/contract_report.md
      - name: Upload final compliance
        uses: actions/upload-artifact@v4
        with:
          name: mode2-contract-compliance
          path: |
            target/mode2/*.json
            target/mode2/*.md
