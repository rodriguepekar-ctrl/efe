name: bench-observability

# Sprint D13.6 — runs the dashboards / alerts / log-schemas
# validation on every PR touching the observability surface.
#
# Three jobs :
#
#   1. dashboards-validate : promtool + JSON-Schema check of the 6
#      Grafana dashboards.
#   2. promtool-check : recording rules + alert rules valid PromQL.
#   3. helm-lint + helm-template : Tier 2 chart renders cleanly.
#   4. python-tests : ~ 50 D13 anti-regression tests.
#
# A 5th job (multi-tenant-isolation against a kind cluster) is
# scaffolded but disabled by default ; enable when the cluster
# bring-up step is reliable on GitHub-hosted runners.

on:
  push:
    branches: [main]
    paths:
      - "deploy/observability/**"
      - "deploy/helm/efe/templates/grafana-dashboards.yaml"
      - "deploy/helm/efe/templates/prometheusrule-d13.yaml"
      - "deploy/helm/efe/templates/promtail-config.yaml"
      - "deploy/helm/efe/templates/tests/test-dashboards-load.yaml"
      - "deploy/helm/efe/values.yaml"
      - "docs/runbooks/d13_*.md"
      - "scripts/tests/test_d13_*.py"
      - "crates/efe-telemetry/src/metrics/d13_instruments.rs"
      - ".github/workflows/bench-observability.yml"
  pull_request:
    paths:
      - "deploy/observability/**"
      - "deploy/helm/efe/templates/grafana-dashboards.yaml"
      - "deploy/helm/efe/templates/prometheusrule-d13.yaml"
      - "deploy/helm/efe/templates/promtail-config.yaml"
      - "deploy/helm/efe/templates/tests/test-dashboards-load.yaml"
      - "deploy/helm/efe/values.yaml"
      - "docs/runbooks/d13_*.md"
      - "scripts/tests/test_d13_*.py"
      - "crates/efe-telemetry/src/metrics/d13_instruments.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JSON-Schema validation of the 6 Grafana dashboards
  # ─────────────────────────────────────────────────────────────────
  dashboards-validate:
    name: Validate dashboard JSON
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install jsonschema CLI
        run: pip install jsonschema check-jsonschema

      - name: Each dashboard parses as JSON + has UID
        run: |
          set -e
          for f in deploy/observability/grafana/dashboards/d13/*.json; do
            python3 -c "
          import json, sys
          d = json.load(open('$f'))
          assert d.get('uid'), 'missing uid'
          assert d.get('title','').startswith('EFE — '), 'bad title'
          assert d.get('schemaVersion', 0) >= 39, 'schemaVersion < 39'
          assert len(d.get('panels', [])) >= 3, 'needs >= 3 panels'
          print(f'OK : {sys.argv[1]} uid={d[\"uid\"]} panels={len(d[\"panels\"])}')
          " "$f"
          done

  # ─────────────────────────────────────────────────────────────────
  # Recording + alert rules pass `promtool check rules`
  # ─────────────────────────────────────────────────────────────────
  promtool-check:
    name: promtool check rules
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run promtool against rules.d13/
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/prometheus:/work" \
            prom/prometheus:v2.49.0 \
            promtool check rules /work/rules.d13/recording.yaml \
                                 /work/rules.d13/alerts.yaml

  # ─────────────────────────────────────────────────────────────────
  # Helm chart renders cleanly with the new D13 templates
  # ─────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm lint + template
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint deploy/helm/efe

      - name: helm template (default values)
        run: helm template efe deploy/helm/efe > /dev/null

      - name: helm template (Tier 2 + dashboards on)
        run: |
          helm template efe deploy/helm/efe \
              -f deploy/helm/efe/values.tier2.yaml \
              --set "observability.dashboards.enabled=true" \
              --set "observability.recordingRules.enabled=true" \
              --set "observability.alerts.enabled=true" \
              > /tmp/render.yaml
          # Sanity : the 6 dashboards landed (audit C-2 regression).
          for uid in efe-d13-01-operator-overview \
                     efe-d13-02-tenant-drill-down \
                     efe-d13-03-catalog-version-distribution \
                     efe-d13-04-cost-attribution \
                     efe-d13-05-audit-stream \
                     efe-d13-06-capacity-planning ; do
            grep -q "$uid" /tmp/render.yaml \
              || (echo "FAIL : $uid missing from rendered chart" >&2; exit 1)
            echo "OK : $uid"
          done
          # Sanity : the rendered ConfigMap actually carries panels
          # (audit C-2 regression — pre-fix the Files.Glob escaped
          # the sandbox and produced empty data sections).
          grep -q '"panels":' /tmp/render.yaml \
            || (echo "FAIL : rendered chart has no panels — Helm Files.Glob may be escaping sandbox" >&2; exit 1)
          # Sanity : the recording rules + alerts landed too.
          grep -q "efe:rpc_p99_latency_seconds:5m" /tmp/render.yaml \
            || (echo "FAIL : recording rule missing" >&2; exit 1)
          grep -q "D13ObsHighErrorRate" /tmp/render.yaml \
            || (echo "FAIL : D13ObsHighErrorRate alert missing" >&2; exit 1)
          echo "✓ rendered chart contains dashboards + rules + alerts."

      - name: Verify chart-mirror is in sync with canonical sources
        run: |
          bash scripts/observability/sync_helm_d13_assets.sh
          if ! git diff --quiet deploy/helm/efe/d13_files/; then
            echo "FAIL : deploy/helm/efe/d13_files/ is out of sync with canonical sources" >&2
            git diff deploy/helm/efe/d13_files/
            echo
            echo "Run : bash scripts/observability/sync_helm_d13_assets.sh"
            echo "      git add deploy/helm/efe/d13_files/"
            exit 1
          fi
          echo "✓ chart mirror in sync."

  # ─────────────────────────────────────────────────────────────────
  # Python anti-regression suite
  # ─────────────────────────────────────────────────────────────────
  python-tests:
    name: Python anti-regression (D13)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install efe-tool + dev deps
        run: |
          pip install -e ./clients/python
          pip install pytest pyyaml jsonschema requests

      - name: Install promtool (for full test_d13_promtool_validation)
        run: |
          curl -sSL \
            https://github.com/prometheus/prometheus/releases/download/v2.49.0/prometheus-2.49.0.linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/prometheus-2.49.0.linux-amd64/promtool /usr/local/bin/

      - name: Run D13 anti-regression suite
        run: pytest scripts/tests/test_d13_*.py -v --tb=short

      - name: Run cross-sprint disjointness tests (D10/D11/D12 must
              continue to pass after D13's RESERVED_PREFIXES extension)
        run: |
          pytest scripts/tests/test_d10_disjoint_keys.py \
                 scripts/tests/test_d11_disjoint_keys.py \
                 scripts/tests/test_d12_disjoint_keys.py \
                 -v --tb=short

  # ─────────────────────────────────────────────────────────────────
  # Rust telemetry tests (catalog metrics)
  # ─────────────────────────────────────────────────────────────────
  rust-telemetry-tests:
    name: cargo test -p efe-telemetry
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-d13-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run telemetry tests (D13 instruments)
        run: cargo test -p efe-telemetry --lib metrics::d13_instruments

      - name: Full telemetry crate test (regression check)
        run: cargo test -p efe-telemetry --lib
