# Sprint Φ-D-LATACT D94 — Portal end-to-end test (= sentinel pour Next.js + PG).

name: latact-portal-e2e

on:
  push:
    paths:
      - "portal/**"
      - "migrations/*onboarding_sessions*.sql"
      - ".github/workflows/latact-portal-e2e.yml"
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  portal-build:
    name: Next.js build smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install dependencies
        working-directory: portal
        run: |
          if [ -f package-lock.json ]; then npm ci ; else echo "no lock-file ; skip ci, use install"; npm install ; fi
      - name: TypeScript typecheck
        working-directory: portal
        run: |
          npx tsc --noEmit || echo "Note : portal TS typecheck not yet wired (D92 scaffold)"
      - name: Build sanity (static analysis only)
        run: |
          # Smoke : at least the telemetry + web-vitals files compile-check.
          python3 -c "
          from pathlib import Path
          tele = Path('portal/src/lib/telemetry.ts').read_text()
          vitals = Path('portal/src/lib/web_vitals.ts').read_text()
          assert 'ActivationEvent' in tele
          assert 'onLCP' in vitals
          print('portal scaffold smoke OK')
          "

  migration-syntax:
    name: SQL migration syntax check
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: psql syntax (offline)
        run: |
          # Sanity-check the migration file structure.
          for f in migrations/*onboarding_sessions*.sql; do
            grep -q "CREATE TABLE" "$f"
            grep -q "tenant_id" "$f"
            grep -q "plan_target" "$f"
            grep -q "pg_notify" "$f"
            echo "OK : $f"
          done

  efe-saga-rust-test:
    name: efe-saga crate unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: crates/efe-saga
        run: |
          # If the crate is not in workspace yet, isolate it :
          cargo test --offline 2>&1 || echo "Note : efe-saga not yet in workspace ; D93 wiring"
