name: Release

# M12.16 — release pipeline.
#
# Triggered when a semver tag `vX.Y.Z` is pushed. Builds the production
# image, signs it with cosign (keyless OIDC), attaches the SBOM as an
# attestation, scans for HIGH/CRITICAL CVEs, packages the Helm chart,
# and publishes a GitHub Release with all artefacts.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Required for manual runs."
        required: true

permissions:
  # `id-token: write` is required by cosign --keyless to obtain a
  # short-lived signing certificate from Fulcio via OIDC.
  contents: write
  id-token: write
  packages: write
  attestations: write
  security-events: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-sign-publish:
    name: Build, sign and publish
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref:    ${{ steps.meta.outputs.tags }}

    steps:
      # -----------------------------------------------------------
      # Source + toolchain
      # -----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and semver
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.tag }}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          # Enforce the `vX.Y.Z[-suffix]` contract so a mis-typed tag
          # fails the workflow before any publish step runs.
          if ! [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$ref' is not a valid semver tag (vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          semver="${ref#v}"
          echo "ref=${ref}"       >> "$GITHUB_OUTPUT"   # e.g. v0.1.0
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"   # e.g. 0.1.0 (no leading v)

      - name: Compute canonical SOURCE_DATE_EPOCH
        id: sde
        run: |
          # The Dockerfile expects SOURCE_DATE_EPOCH as a Unix epoch
          # integer (seconds since 1970). `github.event.head_commit`
          # exposes an ISO-8601 timestamp and may be null on tag-push
          # events that don't carry a head_commit payload, so we derive
          # the value directly from git: it's stable, reproducible, and
          # works for both `push` and `workflow_dispatch` events.
          sde=$(git show -s --format=%ct "${{ github.sha }}")
          echo "epoch=${sde}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------
      # Buildx + QEMU (future multi-arch)
      # -----------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------
      # Registry login
      # -----------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.ref }}
            type=raw,value=latest,enable=${{ !contains(steps.tag.outputs.ref, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.ref }}
            org.opencontainers.image.licenses=Apache-2.0

      # -----------------------------------------------------------
      # Build & push (provenance + SBOM generated by buildx)
      # -----------------------------------------------------------
      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------
      # Distroless symbol compatibility check (Sprint D9.A4)
      #
      # MUST RUN BEFORE cosign sign. If we sign first and then find
      # an unresolved symbol, the image is signed-and-pushed but the
      # release is aborted — leaving a dangling cosign attestation
      # against an image we did not actually want to ship (audit
      # fix W13).
      #
      # Catches the class of bugs where a new Cargo dep silently
      # introduces a `dlopen` against a library that distroless
      # doesn't ship.
      # -----------------------------------------------------------
      - name: Pull distroless ldconfig dump
        run: |
          set -Eeuo pipefail
          # The `debug` distroless variant ships a busybox shell so
          # we can run `ldconfig -p`. We use it ONLY as a probe ;
          # the runtime image is still the non-debug variant.
          docker run --rm --entrypoint=/busybox/sh \
            gcr.io/distroless/cc-debian12:debug-nonroot \
            -c 'ldconfig -p' > /tmp/distroless_libs.txt
          echo "first 5 lines of distroless ldconfig dump:"
          head -5 /tmp/distroless_libs.txt

      - name: Pull binary deps via ldd
        run: |
          set -Eeuo pipefail
          # The release image has no shell, so we extract the
          # binary and ldd it on the host. The binary's NEEDED
          # entries are independent of host glibc resolution, so
          # ldd's report on a slightly-older host is still
          # authoritative for SONAME compatibility.
          cid=$(docker create "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}")
          docker cp "$cid:/usr/local/bin/efe-server" /tmp/efe-server-bin
          docker rm "$cid"
          ldd /tmp/efe-server-bin > /tmp/binary_deps.txt
          echo "binary deps:"
          cat /tmp/binary_deps.txt

      - name: Verify distroless symbol compatibility
        run: |
          python3 scripts/check_distroless_symbols.py \
            --distroless-libs /tmp/distroless_libs.txt \
            --binary-deps     /tmp/binary_deps.txt

      # -----------------------------------------------------------
      # Sigstore keyless signature
      # -----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        # Keyless signing is the default in cosign v2+. The old
        # COSIGN_EXPERIMENTAL=true env var has been removed because it
        # is deprecated and ignored by the installer action (v3).
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      # -----------------------------------------------------------
      # Software Bill of Materials
      # -----------------------------------------------------------
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          output-file: sbom.spdx.json

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      # -----------------------------------------------------------
      # Security gate
      # -----------------------------------------------------------
      - name: Trivy scan (HIGH/CRITICAL fails the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # -----------------------------------------------------------
      # Reproducibility manifest
      # -----------------------------------------------------------
      - name: Emit build manifest
        run: |
          cat > build-manifest.json <<EOF
          {
            "version": "${{ steps.tag.outputs.ref }}",
            "semver": "${{ steps.tag.outputs.semver }}",
            "git_sha": "${{ github.sha }}",
            "image_digest": "${{ steps.build.outputs.digest }}",
            "build_time_utc": "$(date -u +%FT%TZ)",
            "source_date_epoch": "${{ steps.sde.outputs.epoch }}",
            "registry": "${{ env.REGISTRY }}",
            "image_name": "${{ env.IMAGE_NAME }}",
            "builder": "github-actions/${{ runner.os }}"
          }
          EOF
          cat build-manifest.json

      # -----------------------------------------------------------
      # Helm chart packaging & publish (OCI)
      # -----------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/efe

      - name: Package Helm chart
        # Helm refuses a `version` that does not match SemVer 2 (no
        # leading `v`). We strip the `v` from the tag; the resulting
        # file name is `efe-<semver>.tgz`.
        run: |
          helm package deploy/helm/efe \
            --version "${{ steps.tag.outputs.semver }}" \
            --app-version "${{ steps.tag.outputs.semver }}"

      - name: Push chart to OCI registry
        run: |
          helm push "efe-${{ steps.tag.outputs.semver }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      # -----------------------------------------------------------
      # GitHub Release
      # -----------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          name: "EFE ${{ steps.tag.outputs.ref }}"
          generate_release_notes: true
          files: |
            efe-${{ steps.tag.outputs.semver }}.tgz
            sbom.spdx.json
            build-manifest.json
            trivy-results.sarif

  # ─────────────────────────────────────────────────────────────────
  # Sprint D10.5 — Publish efe-tool to PyPI via OIDC trusted publisher
  # ─────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish efe-tool to PyPI
    needs: build-sign-publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # IMPORTANT — the `pypi` environment is required for OIDC trusted
    # publisher to authenticate without a static token. Configure the
    # corresponding trusted publisher entry on pypi.org (project:
    # efe-tool, owner: efe-ai, repo: efe, workflow: release.yml,
    # environment: pypi).
    environment:
      name: pypi
      url: https://pypi.org/p/efe-tool
    permissions:
      id-token: write       # OIDC short-lived token exchange
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine semver
        id: tag
        run: |
          ref="${GITHUB_REF_NAME}"
          if ! [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release tag — skipping PyPI publish"
            exit 1
          fi
          semver="${ref#v}"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"

      - name: Sync pyproject.toml version with the git tag
        # Defensive — the SDK's _version.py must match the tag.
        # If it doesn't, fail BEFORE we publish a wrong version.
        run: |
          py_version=$(python3 -c \
            "import sys; sys.path.insert(0, 'clients/python'); \
             from efe_tool._version import __version__; print(__version__)")
          if [[ "$py_version" != "${{ steps.tag.outputs.semver }}" ]]; then
            echo "::error::version drift: tag=${{ steps.tag.outputs.semver }} _version.py=$py_version"
            exit 1
          fi
          echo "version match: $py_version"

      - name: Build sdist + wheel
        run: |
          cd clients/python
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (trusted publisher, OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
          # Skip when re-running the workflow on the same tag
          # (e.g. after a transient PyPI 503).
          skip-existing: true

  # ─────────────────────────────────────────────────────────────────
  # Sprint D10.5 — Versioned docs deploy via mike
  # ─────────────────────────────────────────────────────────────────
  deploy-docs-versioned:
    name: Deploy docs (mike) for the release tag
    needs: build-sign-publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write    # gh-pages branch push

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs deps
        run: pip install -r docs/requirements-docs.txt

      - name: Install efe-tool (for mkdocstrings)
        run: pip install -e ./clients/python

      - name: Determine semver
        id: tag
        run: |
          ref="${GITHUB_REF_NAME}"
          semver="${ref#v}"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: mike deploy versioned
        working-directory: docs
        run: |
          # Push the tag's docs as `<semver>` AND alias `latest`.
          mike deploy --push --update-aliases \
              "${{ steps.tag.outputs.semver }}" latest
          # Make `latest` the default landing page.
          mike set-default --push latest
