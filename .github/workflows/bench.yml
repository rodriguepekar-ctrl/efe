name: Bench

# Sprint D5 — DAG-orchestrated bench workflow.
#
# Five jobs :
#
#   bench-build         compile both crates' benches once, share via
#                        Swatinem/rust-cache@v2 (`shared-key: bench-build`).
#   bench-core-mocks    swarm_e2e + memory_e2e
#   bench-core-infra    memory_real_arena
#   bench-core-compute  compute_pipeline + compute_sprint{2,3,4}
#                        (TIER=all so the previously-orphan micro
#                        benches actually execute in CI).
#   bench-server        real_strategies_e2e + real_memory + server_rpc
#
#   bench-aggregate     downloads partial criterion artefacts, runs
#                        scripts/aggregate_bench_reports.py to merge,
#                        then check_regression.py + show_bench_report.py +
#                        post_bench_pr_comment.py.
#
# Wallclock target on ubuntu-latest : ~15 min (vs 30 min sequential).
# All matrix jobs `needs: bench-build`, so the first compile is shared.

on:
  pull_request:
    branches: [main]
    paths:
      # ─────────────────────────────────────────────────────────────
      # Auto-derived from `scripts/benches.list` paths-watch column +
      # fixed scaffolding paths. To regenerate (e.g. after adding a
      # new bench to the catalog) :
      #   bash scripts/regen_bench_yml_paths.sh > /tmp/expected_paths.yml
      # then replace this block with the contents of /tmp/expected_paths.yml.
      # The first line below MUST be `.github/workflows/bench.yml` (the
      # generator emits sorted output ; sort -u puts dotfiles first).
      # ─────────────────────────────────────────────────────────────
      - '.github/workflows/bench.yml'
      - 'bench_baselines/v0.10.0/**'
      - 'crates/efe-core/Cargo.toml'
      - 'crates/efe-core/benches/**'
      - 'crates/efe-core/src/compute/**'
      - 'crates/efe-core/src/compute/cpu/**'
      - 'crates/efe-core/src/compute/cpu/linalg**'
      - 'crates/efe-core/src/fusion/kernels/**'
      - 'crates/efe-core/src/memory/**'
      - 'crates/efe-core/src/swarm/**'
      - 'crates/efe-meta-swarm/Cargo.toml'
      - 'crates/efe-meta-swarm/benches/**'
      - 'crates/efe-meta-swarm/src/**'
      - 'crates/efe-server/Cargo.toml'
      - 'crates/efe-server/benches/**'
      - 'crates/efe-server/src/bridge/**'
      - 'crates/efe-server/src/interceptors/**'
      - 'crates/efe-server/src/mode1.rs'
      - 'crates/efe-server/src/services/**'
      - 'scripts/aggregate_bench_reports.py'
      - 'scripts/bench_runner.sh'
      - 'scripts/benches.list'
      - 'scripts/check_benches_list.sh'
      - 'scripts/check_regression.py'
      - 'scripts/fixtures/**'
      - 'scripts/gen_fixtures_v2.py'
      - 'scripts/parse_criterion_report.py'
      - 'scripts/post_bench_pr_comment.py'
      - 'scripts/regen_bench_yml_paths.sh'
      - 'scripts/show_bench_report.py'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier filter (default | micro | all)'
        required: false
        default: 'default'
      blas_backend:
        description: 'BLAS backend (none | accelerate | openblas)'
        required: false
        default: 'none'
      mode:
        description: 'Bench mode (quick | full | smoke)'
        required: false
        default: 'quick'

# Cancel in-progress PRs on new commits, but never cancel main pushes —
# every commit on main needs to produce a baseline measurement.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ubuntu-latest runners are ~1.5× slower than the M3 Pro reference
  # used to calibrate SLO targets. The regression gate scales the
  # threshold accordingly.
  CI_COEFFICIENT: "1.5"
  CARGO_TERM_COLOR: always
  # Shared cache key for `Swatinem/rust-cache@v2`. Same across all
  # matrix jobs so they reuse the bench-build artefacts.
  RUST_CACHE_KEY: "bench-build-d5"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 0 — Catalog lint
  # ─────────────────────────────────────────────────────────────────
  # Cheap & fast (< 30 s). Runs first ; if the catalog is malformed
  # the whole bench matrix is short-circuited rather than producing
  # mysterious cargo errors deeper in the pipeline.
  bench-lint:
    name: Lint catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts/benches.list
        run: bash scripts/check_benches_list.sh

  # ─────────────────────────────────────────────────────────────────
  # Job 1 — Pre-build benches (shared cache for matrix jobs)
  # ─────────────────────────────────────────────────────────────────
  bench-build:
    name: Pre-build benches
    needs: bench-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
          cache-on-failure: true
      - name: Pre-build efe-core + efe-server benches
        # MODE=smoke triggers `cargo build` for both crates and exits
        # without running any bench. The matrix jobs reuse the cache
        # populated here, so they don't pay the ~5 min compile cost
        # again.
        run: |
          MODE=smoke TIER=all bash scripts/bench_runner.sh

  # ─────────────────────────────────────────────────────────────────
  # Job 2.a — Sprint C mock benches
  # ─────────────────────────────────────────────────────────────────
  bench-core-mocks:
    name: Run swarm_e2e + memory_e2e (Sprint C)
    needs: bench-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
      - name: Run benches
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}" \
          BENCHES=swarm_e2e,memory_e2e \
          BENCH_TIMEOUT=300 \
          bash scripts/bench_runner.sh
      - name: Upload partial artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-partial-core-mocks-${{ github.sha }}
          path: |
            target/criterion/**/new/estimates.json
            target/bench-swarm-e2e.txt
            target/bench-memory-e2e.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 2.b — Sprint D2 memory infrastructure
  # ─────────────────────────────────────────────────────────────────
  bench-core-infra:
    name: Run memory_real_arena (Sprint D2)
    needs: bench-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
      - name: Run benches
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}" \
          BENCHES=memory_real_arena \
          BENCH_TIMEOUT=600 \
          bash scripts/bench_runner.sh
      - name: Upload partial artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-partial-core-infra-${{ github.sha }}
          path: |
            target/criterion/**/new/estimates.json
            target/bench-memory-real-arena.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 2.c — Compute pipeline (D3) + Sprint S2/S3/S4 micro
  # ─────────────────────────────────────────────────────────────────
  # `TIER=all` is the magic word that pulls in `compute_sprint{2,3,4}`
  # which were orphaned in the v1 runner and never ran in CI before
  # D5. The default `bench_runner.sh` invocation (TIER=default) skips
  # them ; this job opts in deliberately.
  bench-core-compute:
    name: Run compute_pipeline + compute_sprint{2,3,4} (D3 + S2/S3/S4)
    needs: bench-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
      - name: Run benches
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}" \
          BENCHES=compute_pipeline,compute_sprint2,compute_sprint3,compute_sprint4 \
          TIER=all \
          BENCH_TIMEOUT=600 \
          bash scripts/bench_runner.sh
      - name: Upload partial artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-partial-core-compute-${{ github.sha }}
          path: |
            target/criterion/**/new/estimates.json
            target/bench-compute-pipeline.txt
            target/bench-compute-sprint2.txt
            target/bench-compute-sprint3.txt
            target/bench-compute-sprint4.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 2.c-bis — Sprint A1 P1 PR #4 — efe-meta-swarm bench (A1)
  # ─────────────────────────────────────────────────────────────────
  # Runs the `three_swarms_kovant_latency` Criterion bench under the
  # unified runner.  The bench emits TWO outputs :
  #
  #   * target/criterion/**/new/estimates.json
  #       Standard Criterion tree, consumed by parse_criterion_report.py
  #       (drives SLO-A1-META-LATENCY-P50 / -P99).
  #   * target/criterion/three_swarms_kovant_latency/
  #     meta-swarm-extras.json
  #       Sidecar with 5 algorithmic + operational SLO values
  #       (CONVERGENCE-ITERS, RESIDUAL-FINAL, DETERMINISM,
  #       MEMORY-PEAK-MB, NON-REGRESSION).  The aggregator forwards
  #       this file to the master-gate via the
  #       `--eval-bench-format <path>` flag of parse_criterion_report.py.
  #
  # Stays `continue-on-error: true` until 3 main runs PASS post-merge,
  # then a follow-up PR flips it to fail-closed (same pattern as
  # `bench-accuracy` / `bench-accuracy-hybrid`).
  #
  # Cf. crates/efe-meta-swarm/PR4_DESCRIPTION.md.
  # Cf. bench_baselines/v0.10.0/meta_swarm_slos.yaml.
  bench-meta-swarm-a1:
    name: Run three_swarms_kovant_latency (Sprint A1 P1)
    needs: bench-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # ← flip to `false` after 3 main runs PASS
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
      - name: Run bench (three_swarms_kovant_latency)
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}" \
          BENCHES=three_swarms_kovant_latency \
          BENCH_TIMEOUT=600 \
          bash scripts/bench_runner.sh
      - name: Upload partial artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-partial-meta-swarm-a1-${{ github.sha }}
          path: |
            target/criterion/**/new/estimates.json
            target/criterion/three_swarms_kovant_latency/meta-swarm-extras.json
            target/bench-three-swarms-kovant-latency.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 2.d — efe-server benches (D1 + D4)
  # ─────────────────────────────────────────────────────────────────
  bench-server:
    name: Run real_strategies_e2e + real_memory + server_rpc (D1 + D4)
    needs: bench-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
      - name: Run benches
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}" \
          BENCHES=real_strategies_e2e,real_memory,server_rpc \
          BENCH_TIMEOUT=900 \
          bash scripts/bench_runner.sh
      - name: Upload partial artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-partial-server-${{ github.sha }}
          path: |
            target/criterion/**/new/estimates.json
            target/bench-real-strategies-e2e.txt
            target/bench-real-memory.txt
            target/bench-server-rpc.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 3 — Aggregate, gate regression, post PR comment
  # ─────────────────────────────────────────────────────────────────
  # `if: always()` so the aggregate runs even if some matrix jobs
  # failed — the partial reports are still useful, and we'd rather
  # see them in the PR comment than silently lose them.
  # ─────────────────────────────────────────────────────────────────
  # Job 2.e — Sprint D6 + D7 accuracy eval on golden catalogs
  # ─────────────────────────────────────────────────────────────────
  # Standalone job : starts a real efe-server in background and
  # produces TWO eval reports :
  #
  #   * `eval-accuracy.json` / `eval-accuracy-bench.json` — single
  #     catalog (support_triage), feeds the D6-ACC-* SLOs (40 cases).
  #   * `eval-accuracy-multi.json` / `eval-accuracy-multi-bench.json`
  #     — multi-catalog ({support_triage, fraud_alert,
  #     billing_escalation}), feeds the **D7-MC-* anti-overfit SLOs**
  #     (100 cases total).
  #
  # The job stays `continue-on-error: true` for **3 main runs PASS**
  # post-merge D7, then a follow-up PR flips it to fail-closed (the
  # transition is documented in
  # `docs/bench/d7_genesis_fusion_bias_remediation_architecture.md`
  # §14 and `docs/audits/d7_calibration_report.md` §5). Until then,
  # any FAIL is loud (visible in the PR comment) but does not block
  # merges.
  bench-accuracy:
    name: Run eval on golden catalogs (Sprint D6 + D7)
    needs: bench-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true   # ← flip to `false` after 3 main runs PASS post-D7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e clients/python
      - name: Build efe-server release
        run: cargo build -p efe-server --release --bin efe-server
      - name: Start efe-server (bg)
        run: |
          EFE_LISTEN_ADDR=127.0.0.1:50061 EFE_AUTH_ENABLED=false \
              ./target/release/efe-server > target/bench-eval-server.log 2>&1 &
          echo $! > server.pid
          # Wait for bind (up to 60 s).
          for _ in $(seq 1 60); do
            nc -z 127.0.0.1 50061 2>/dev/null && break
            sleep 1
          done
      - name: Run single-catalog eval (D6 SLOs)
        run: |
          EFE_ENDPOINT=127.0.0.1:50061 \
          EFE_EMBEDDER_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
              python3 eval/scripts/run_eval.py \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/support_triage.jsonl \
                  --endpoint 127.0.0.1:50061 \
                  --output target/eval-accuracy.json \
                  --output-bench-format target/eval-accuracy-bench.json
      - name: Run multi-catalog eval (D7 anti-overfit SLOs)
        run: |
          EFE_ENDPOINT=127.0.0.1:50061 \
          EFE_EMBEDDER_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
              python3 eval/scripts/run_eval.py \
                  --multi-catalog \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/support_triage.jsonl \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/fraud_alert.jsonl \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/billing_escalation.jsonl \
                  --endpoint 127.0.0.1:50061 \
                  --output target/eval-accuracy-multi.json \
                  --output-bench-format target/eval-accuracy-multi-bench.json
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true
      - name: Upload eval artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-partial-accuracy-${{ github.sha }}
          path: |
            target/eval-accuracy.json
            target/eval-accuracy-bench.json
            target/eval-accuracy-multi.json
            target/eval-accuracy-multi-bench.json
            target/bench-eval-server.log

  # ─────────────────────────────────────────────────────────────────
  # Job 2.f — Sprint D8 hybrid eval (Plan B)
  # ─────────────────────────────────────────────────────────────────
  # Standalone job that runs `run_eval_hybrid.py --multi-catalog` to
  # measure the hybrid decoder's accuracy. Emits keys disjoint from
  # the swarm-only ones (cf. `test_d8_hybrid_eval.py` invariant) so
  # the parser merge produces unambiguous SLO compliance for all 3
  # families (D6-ACC, D7-MC, D8-HYB).
  #
  # Stays `continue-on-error: true` until 3 main runs PASS post-D8
  # merge, then a follow-up PR flips both `bench-accuracy*` jobs to
  # fail-closed.
  bench-accuracy-hybrid:
    name: Run hybrid eval on 3 catalogs (Sprint D8 Plan B)
    needs: bench-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true   # ← flip to `false` after 3 main runs PASS
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e clients/python
      - name: Build efe-server release
        run: cargo build -p efe-server --release --bin efe-server
      - name: Start efe-server (bg)
        run: |
          EFE_LISTEN_ADDR=127.0.0.1:50063 EFE_AUTH_ENABLED=false \
              EFE_METRICS_DISABLE=1 \
              ./target/release/efe-server > target/bench-eval-hybrid-server.log 2>&1 &
          echo $! > server-hybrid.pid
          for _ in $(seq 1 60); do
            nc -z 127.0.0.1 50063 2>/dev/null && break
            sleep 1
          done
      - name: Run hybrid single-catalog eval (D8-HYB-1/2/3 SLOs)
        # Sprint D8 audit fix : the SLOs `SLO-D8-HYB-1/2/3` read the
        # single-catalog `eval_accuracy::hybrid_top1`, `::hybrid_macro_f1`,
        # `::hybrid_reject_rate` keys. Without this step they would be
        # silently SKIPPED in CI (the multi-catalog mode emits only
        # `min_*` and `aggregate_*` keys). This step + the
        # multi-catalog one below produce the full set of `hybrid_*`
        # bench keys consumed by all 4 D8-HYB SLOs.
        run: |
          EFE_ENDPOINT=127.0.0.1:50063 \
          EFE_EMBEDDER_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
              python3 eval/scripts/run_eval_hybrid.py \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/support_triage.jsonl \
                  --endpoint 127.0.0.1:50063 \
                  --output target/eval-hybrid-single.json \
                  --output-bench-format target/eval-hybrid-single-bench.json
      - name: Run hybrid multi-catalog eval (D8-HYB-4 + anti-overfit SLOs)
        run: |
          EFE_ENDPOINT=127.0.0.1:50063 \
          EFE_EMBEDDER_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
              python3 eval/scripts/run_eval_hybrid.py --multi-catalog \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/support_triage.jsonl \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/fraud_alert.jsonl \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/billing_escalation.jsonl \
                  --endpoint 127.0.0.1:50063 \
                  --output target/eval-hybrid.json \
                  --output-bench-format target/eval-hybrid-bench.json
      - name: Run decoder comparison report (single catalog, fast)
        run: |
          EFE_ENDPOINT=127.0.0.1:50063 \
          EFE_EMBEDDER_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
              python3 eval/scripts/compare_decoders.py \
                  --catalog catalogs/support_triage.yaml \
                  --golden eval/golden/support_triage.jsonl \
                  --endpoint 127.0.0.1:50063 \
                  --output-dir target/decoder_comparison
      - name: Stop server
        if: always()
        run: kill $(cat server-hybrid.pid) 2>/dev/null || true
      - name: Upload eval artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-partial-accuracy-hybrid-${{ github.sha }}
          path: |
            target/eval-hybrid.json
            target/eval-hybrid-bench.json
            target/eval-hybrid-single.json
            target/eval-hybrid-single-bench.json
            target/decoder_comparison/report.json
            target/decoder_comparison/report.md
            target/bench-eval-hybrid-server.log

  bench-aggregate:
    name: Aggregate report + regression gate + PR comment
    needs:
      - bench-core-mocks
      - bench-core-infra
      - bench-core-compute
      - bench-meta-swarm-a1     # Sprint A1 P1 PR #4
      - bench-server
      - bench-accuracy
      - bench-accuracy-hybrid
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all partial artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-partial-*-${{ github.sha }}
          path: target/_partials
      - name: Locate eval-bench-format files (D6 + D7 + D8)
        id: locate_eval
        run: |
          # The bench-accuracy[-hybrid] jobs upload three bench-format JSONs :
          #   * eval-accuracy-bench.json       (single-catalog, D6 SLOs ;
          #                                      keys: eval_accuracy::top1,
          #                                      ::macro_f1, ::mean_conf_correct,
          #                                      ::false_reject_rate, ::*latency*)
          #   * eval-accuracy-multi-bench.json (multi-catalog, D7 SLOs ;
          #                                      keys: eval_accuracy::min_top1,
          #                                      ::min_macro_f1, ::aggregate_top1,
          #                                      ::aggregate_macro_f1)
          #   * eval-hybrid-bench.json         (D8 hybrid Plan B ;
          #                                      keys: eval_accuracy::hybrid_*)
          # The three key sets are mutually DISJOINT (invariant pinned by
          # `scripts/tests/test_d7_parser_eval_merge.py` +
          # `scripts/tests/test_d8_hybrid_eval.py`), so the order of
          # forwarding to the parser is irrelevant for correctness.
          #
          # NOTE (Sprint A1 P1 PR #4) : the `meta-swarm-extras.json`
          # sidecar produced by `bench-meta-swarm-a1` is NOT forwarded
          # here.  Its keys (`SLO-A1-META-*`) are not in
          # `parse_criterion_report.py`'s SLO catalog ; they are
          # consumed exclusively by the master-gate via
          # `scripts/ops/run_suite.sh a1_meta_swarm`
          # (see `.github/workflows/ops-master-gate.yml`).  The sidecar
          # is still uploaded as a partial artefact for debugging and
          # for a future Phase-2 SLO bridge.
          SINGLE=$(find target/_partials -name "eval-accuracy-bench.json" -type f | head -1)
          MULTI=$(find target/_partials -name "eval-accuracy-multi-bench.json" -type f | head -1)
          HYBRID=$(find target/_partials -name "eval-hybrid-bench.json" -type f | head -1)
          HYBRID_SINGLE=$(find target/_partials -name "eval-hybrid-single-bench.json" -type f | head -1)
          echo "single=$SINGLE" >> $GITHUB_OUTPUT
          echo "multi=$MULTI" >> $GITHUB_OUTPUT
          echo "hybrid=$HYBRID" >> $GITHUB_OUTPUT
          echo "hybrid_single=$HYBRID_SINGLE" >> $GITHUB_OUTPUT
          echo "Single-catalog       : ${SINGLE:-(none)}"
          echo "Multi-catalog        : ${MULTI:-(none)}"
          echo "Hybrid multi (D8)    : ${HYBRID:-(none)}"
          echo "Hybrid single (D8)   : ${HYBRID_SINGLE:-(none)}"
      - name: Aggregate
        run: |
          EVAL_FLAGS=""
          if [ -n "${{ steps.locate_eval.outputs.single }}" ]; then
            EVAL_FLAGS="$EVAL_FLAGS --eval-bench-format ${{ steps.locate_eval.outputs.single }}"
          fi
          if [ -n "${{ steps.locate_eval.outputs.multi }}" ]; then
            EVAL_FLAGS="$EVAL_FLAGS --eval-bench-format ${{ steps.locate_eval.outputs.multi }}"
          fi
          if [ -n "${{ steps.locate_eval.outputs.hybrid }}" ]; then
            EVAL_FLAGS="$EVAL_FLAGS --eval-bench-format ${{ steps.locate_eval.outputs.hybrid }}"
          fi
          if [ -n "${{ steps.locate_eval.outputs.hybrid_single }}" ]; then
            EVAL_FLAGS="$EVAL_FLAGS --eval-bench-format ${{ steps.locate_eval.outputs.hybrid_single }}"
          fi
          # shellcheck disable=SC2086  # we want word-splitting on EVAL_FLAGS
          python3 scripts/aggregate_bench_reports.py \
            --inputs target/_partials \
            --merged-root target/criterion-merged \
            --output target/bench-report-aggregated.json \
            --metadata-os "ubuntu-latest" \
            --metadata-cpu "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//' || echo 'unknown')" \
            --metadata-ncpu "$(getconf _NPROCESSORS_ONLN)" \
            --metadata-ram-gb "$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)" \
            --metadata-rustc "$(rustc --version 2>/dev/null || echo 'rustc unknown')" \
            --metadata-cargo "$(cargo --version 2>/dev/null || echo 'cargo unknown')" \
            --metadata-blas "${{ github.event.inputs.blas_backend || 'none' }}" \
            --metadata-sha "${{ github.sha }}" \
            --metadata-branch "${{ github.ref_name }}" \
            --metadata-dirty "false" \
            --metadata-timestamp "$(date -u +%Y%m%dT%H%M%SZ)" \
            $EVAL_FLAGS
      - name: Show SLO compliance
        run: |
          python3 scripts/show_bench_report.py \
            target/bench-report-aggregated.json
      - name: Compare to latest baseline (regression detection)
        run: |
          # Pick the highest-version baseline that exists. The
          # `sort -V` (version sort) handles v0.1.10 > v0.1.9 correctly.
          if compgen -G "bench_baselines/v*" > /dev/null; then
            LATEST=$(ls -d bench_baselines/v* | sort -V | tail -1)
            BASELINE="$LATEST/baseline.json"
            echo "Latest baseline: $BASELINE"
            python3 scripts/check_regression.py \
              --baseline "$BASELINE" \
              --candidate target/bench-report-aggregated.json \
              --threshold 0.10 \
              --warn-threshold 0.05 \
              --ci-coefficient "$CI_COEFFICIENT"
          else
            echo "::warning::No bench_baselines/v* found ; skipping regression gate."
          fi
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pick the same baseline as the gate above (if any).
          BASELINE_FLAG=""
          if compgen -G "bench_baselines/v*" > /dev/null; then
            LATEST=$(ls -d bench_baselines/v* | sort -V | tail -1)
            BASELINE_FLAG="--baseline $LATEST/baseline.json"
          fi
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # shellcheck disable=SC2086  # BASELINE_FLAG is a single safe token-group.
          python3 scripts/post_bench_pr_comment.py \
            --report target/bench-report-aggregated.json \
            --pr "${{ github.event.pull_request.number }}" \
            --threshold 0.10 \
            --warn-threshold 0.05 \
            --ci-coefficient "$CI_COEFFICIENT" \
            --workflow-url "$WORKFLOW_URL" \
            $BASELINE_FLAG
      - name: Upload aggregated report + per-bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-${{ github.sha }}
          path: |
            target/bench-report-aggregated.json
            target/bench-*.txt
          retention-days: 30
