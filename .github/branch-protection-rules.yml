# Sprint M14 D42 — Branch protection rules (post-1.0 GA freeze).
#
# Cf. docs/EFE_COMPLIANCE_EXTENSION_ARCHITECTURE.md §15 + docs/HANDOFF_OPS.md §12.
#
# Audit fix M14-A5 (MED) — pre-fix this YAML included `lock_branch`
# (newer rulesets API field, not legacy protection) and
# `required_signatures` (separate sub-endpoint required). When applied
# via `gh api PUT /repos/.../protection`, the legacy endpoint silently
# ignores `lock_branch` and rejects `required_signatures` (must be
# enabled via separate sub-endpoint). Post-fix the YAML matches the
# legacy branch protection schema strictly + ships a separate apply
# script that handles the multi-call sequence.
#
# Effective post-J175 freeze. Applied via :
#
#   bash .github/apply-branch-protection.sh
#
# Pin tested by `test_m14_freeze_branch_protection_*`.

main:
  required_status_checks:
    strict: true
    contexts:
      - ci/build
      - ci/test
      - ci/polaris
      - ci/pin-tests
      - ci/sbom-validate
      - ci/license-gate
      - ci/helm-test
      # PR #25 — STABILITY v1.7 § 25 process invariants (I.1 + I.2 + I.6).
      # The aggregate job that fails-loud if any of i1-audit-prompt,
      # i2-sot-invariants, i6-audit-budget fail.  Matches the `name:`
      # field of the job in .github/workflows/pr25-process-checks.yml.
      - pr25 process checks pass
  enforce_admins: true
  required_pull_request_reviews:
    required_approving_review_count: 2
    dismiss_stale_reviews: true
    require_code_owner_reviews: true
    require_last_push_approval: true
  restrictions:
    apps: []
    users: []
    teams:
      - core-engineering
      - security-team
  required_conversation_resolution: true
  # Note : required_signatures + lock_branch are NOT part of the legacy
  # branch protection endpoint. They're applied via separate sub-endpoint
  # calls in `.github/apply-branch-protection.sh` (see signed_commits +
  # rulesets API).
  required_signatures: true
  block_creations: false
  allow_force_pushes: false
  allow_deletions: false
