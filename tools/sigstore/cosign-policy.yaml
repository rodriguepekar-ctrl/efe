# Cosign verification policy for EFE artifacts (R-100).
#
# Used by :
#   - `scripts/release/verify-release.sh`
#   - tenants who want to install policy-controller in their cluster
#   - CI of downstream consumers (Helm dependency lock + verify)
#
# Apply via :
#   kubectl apply -f cosign-policy.yaml
#
# References :
#   https://docs.sigstore.dev/policy-controller/overview/
#   https://github.com/sigstore/policy-controller

apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: efe-image-policy
  annotations:
    description: "Verify all EFE images are signed by the release-v1-ga.yml workflow."
    docs: "https://github.com/efe-ai/efe/blob/main/docs/release/VERIFY_RELEASE.md"
spec:
  # Apply policy to all images under ghcr.io/efe-ai
  images:
    - glob: "ghcr.io/efe-ai/**"

  # Authorities = who is allowed to sign.
  authorities:
    - name: efe-release-pipeline
      keyless:
        # The cert subject must match the GitHub Actions OIDC issuer.
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            # The signer must be the release-v1-ga.yml workflow on the
            # efe-ai/efe repository on a v* tag (NOT a feature branch).
            subjectRegExp: "^https://github\\.com/efe-ai/efe/\\.github/workflows/release-v1-ga\\.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.\\-]+)?$"
      ctlog:
        url: https://rekor.sigstore.dev
      # Require a SLSA-3 provenance attestation alongside the signature.
      attestations:
        - name: provenance-must-have
          predicateType: https://slsa.dev/provenance/v1
          policy:
            type: cue
            data: |
              predicateType: "https://slsa.dev/provenance/v1"
              predicate: {
                buildDefinition: {
                  buildType: "https://actions.github.io/buildtypes/workflow/v1"
                  externalParameters: {
                    workflow: {
                      ref: =~"^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+"
                      repository: "https://github.com/efe-ai/efe"
                      path: ".github/workflows/release-v1-ga.yml"
                    }
                  }
                }
              }
