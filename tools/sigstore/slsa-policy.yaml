# SLSA-3 policy declaration for EFE artifacts (R-100).
#
# Documents the requirements for claiming SLSA-3 compliance and lists
# the controls in place. Used by auditors and customers' compliance
# teams during procurement reviews.

apiVersion: slsa.dev/v1
kind: Policy
metadata:
  name: efe-slsa-policy
  version: 1.0.0
spec:
  # SLSA level claimed.
  level: 3

  # Build identity : who is allowed to produce SLSA-3 artifacts.
  build:
    builder:
      id: "https://github.com/actions/runner"
    sourceUri: "github.com/efe-ai/efe"
    workflow:
      ref: "refs/tags/v[0-9]+.[0-9]+.[0-9]+"
      path: ".github/workflows/release-v1-ga.yml"

  # SLSA-3 control checklist :
  # - Build platform isolated : ✓ GitHub-hosted runners (ephemeral VMs)
  # - Provenance signed : ✓ via Fulcio + Rekor
  # - Provenance non-falsifiable : ✓ generated outside user-controlled context
  # - Source verified : ✓ workflow only triggered from refs/tags/v*
  # - Hermetic builds : partial (Docker BuildKit cache is local)
  # - Reproducible builds : ✓ docker build + cargo --locked + pnpm lockfile

  controls:
    - id: SLSA-BUILD-L3-01
      description: "Build runs on isolated, ephemeral, hosted infrastructure"
      evidence: ".github/workflows/release-v1-ga.yml runs on ubuntu-latest GitHub-hosted runners"
      status: PASS

    - id: SLSA-BUILD-L3-02
      description: "Provenance is signed and non-falsifiable"
      evidence: "actions/attest-build-provenance@v1 emits Sigstore-signed in-toto attestation"
      status: PASS

    - id: SLSA-BUILD-L3-03
      description: "Source repository is verified"
      evidence: "trigger restricted to refs/tags/v*.*.* (branch protection enforced)"
      status: PASS

    - id: SLSA-SOURCE-L3-01
      description: "Source is version-controlled"
      evidence: "Git history on github.com/efe-ai/efe ; protected branch main"
      status: PASS

    - id: SLSA-SOURCE-L3-02
      description: "Source has 2-person review"
      evidence: "branch protection rule on main : required_reviews=2"
      status: PASS

  scope:
    - "ghcr.io/efe-ai/efe-server:*"
    - "ghcr.io/efe-ai/mcp-server:*"
    - "ghcr.io/efe-ai/portal-admin:*"
    - "ghcr.io/efe-ai/efe-server-migrate:*"
    - "ghcr.io/efe-ai/charts/efe-stack:*"
    - "github.com/efe-ai/efe/releases/v*"
    - "@efe/sdk on npm"

  attestations:
    - type: "https://slsa.dev/provenance/v1"
      bundle: "in-toto-attestation embedded in Sigstore signature"

  contact:
    email: "security@efe.example.com"
    pgp: "https://efe.example.com/security/pgp-key.asc"
