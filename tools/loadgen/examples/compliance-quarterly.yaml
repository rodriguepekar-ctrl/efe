# PR #20 UC7 — Compliance evidence harvest.
# Quarterly SLO compliance run.  Read-only ; production-safe.
# Result file shipped to the compliance audit Loki sink.

version: 1
name: "compliance-quarterly"
description: "Quarterly compliance SLO evidence harvest (read-only)"

target:
  endpoints:
    - url: "grpc://efe-meta-swarm-controller.efe.svc:50051"
      weight: 1.0
  role: controller
  conns_per_target: 4
  per_request_deadline: "5s"
  mtls:
    cert_path: /etc/efe/tls/tls.crt
    key_path: /etc/efe/tls/tls.key
    ca_path: /etc/efe/tls/ca.crt

pattern:
  type: constant
  qps: 20                  # gentle ; primary goal is evidence, not stress

workload:
  type: state              # read-only by design (AD40 production-safe)

rate:
  mode: open
  max_concurrency: 50

termination:
  duration: "15m"
  # No until_slo : compliance run records actuals ; never aborts early.

output:
  format: parquet
  file: /var/run/loadgen/compliance-$(date +%Y%m%d).parquet
  record: true             # archived for audit trail

observability:
  prometheus:
    listen: "0.0.0.0:9095"
  otel:
    endpoint: "http://otel-collector.observability.svc:4317"
    sampler_arg: 1.0
    service_name: "efe-meta-swarm-loadgen-compliance"

run:
  seed: 0   # deterministic = 0 (replayable for audit)
  mode: production
  allow_mutation: false    # explicit ; redundant given workload=state
