# PR #20 UC4 — Chaos bench traffic driver (consumed by PR #21).
# Bursty pattern with chaos-marker labels ; coordinates with chaos-mesh
# via the --wait-for-signal file path.

version: 1
name: "chaos-burst-30min"
description: "30-min bursty traffic for chaos bench (PR #21 driver)"

target:
  endpoints:
    - url: "grpc://efe-meta-swarm-controller.efe.svc:50051"
      weight: 1.0
  role: controller
  conns_per_target: 4
  per_request_deadline: "5s"

pattern:
  type: burst
  baseline_qps: 20
  burst_qps: 200
  burst_duration: "500ms"
  burst_interval: "60s"

workload:
  type: iterate

rate:
  mode: hybrid
  max_concurrency: 400

termination:
  duration: "30m"
  # No until_slo : chaos benches WANT to see breaches ; we record them.

output:
  format: parquet
  file: /var/run/loadgen/chaos-result.parquet
  record: true

observability:
  prometheus:
    listen: "0.0.0.0:9095"
  otel:
    endpoint: "http://otel-collector.observability.svc:4317"
    sampler_arg: 1.0
    service_name: "efe-meta-swarm-loadgen-chaos"

run:
  seed: 0xC4A05
  mode: staging
  allow_mutation: false
  chaos_marker: "pr21-baseline"
