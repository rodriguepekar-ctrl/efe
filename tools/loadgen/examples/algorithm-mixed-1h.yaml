# PR #20 UC6 — Algorithm regression bench.
# 1-hour mixed workload combining Iterate + State + occasional Reset.
# Used per-feature by meta-swarm devs to validate a new algorithm
# version doesn't regress p99 latency.

version: 1
name: "algorithm-mixed-1h"
description: "1-hour algorithm regression bench (mixed workload)"

target:
  endpoints:
    - url: "grpc://efe-meta-swarm-controller.efe.svc:50051"
      weight: 1.0
  role: controller
  conns_per_target: 4

pattern:
  type: diurnal
  daily_min_qps: 10
  daily_max_qps: 100
  period: "1h"           # 1-hour diurnal cycle (accelerated)
  phase:  "0s"

workload:
  type: mixed
  mix:
    iterate: 0.80
    state:   0.18
    reset:   0.02         # rare resets to exercise state-machine reset_gen
    step:    0.0

rate:
  mode: hybrid
  max_concurrency: 300

termination:
  duration: "1h"
  until_slo:
    iterate-latency-p99: 5.0   # algorithm-bench breach threshold

output:
  format: parquet
  file: /var/run/loadgen/algorithm-result.parquet
  record: false

observability:
  prometheus:
    listen: "0.0.0.0:9095"
  otel:
    endpoint: "http://otel-collector.observability.svc:4317"
    sampler_arg: 0.1               # lower sampling for 1h runs
    service_name: "efe-meta-swarm-loadgen-algorithm"

run:
  seed: 271828
  mode: dev
  allow_mutation: true             # reset requires mutation permission
