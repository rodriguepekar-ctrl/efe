# PR #20 UC3 — Canary roll-out validation.
# Runs 50 QPS against the canary slice for 10 min ; SLO targets
# slightly tighter than stable to detect early regression.

version: 1
name: "canary-50qps-10min"
description: "10-min canary validation at 50 QPS with tightened SLOs"

target:
  endpoints:
    - url: "grpc://ctrl-canary.efe.svc:50051"
      weight: 1.0
  role: controller
  conns_per_target: 4
  per_request_deadline: "3s"
  mtls:
    cert_path: /etc/efe/tls/tls.crt
    key_path: /etc/efe/tls/tls.key
    ca_path: /etc/efe/tls/ca.crt
    expected_san: "ctrl-canary.efe.svc"

pattern:
  type: constant
  qps: 50

workload:
  type: mixed
  mix:
    iterate: 0.95
    state:   0.05

rate:
  mode: hybrid
  max_concurrency: 200

termination:
  duration: "10m"
  until_slo:
    iterate-availability: 0.9995    # tighter than the global 99.9 %
    iterate-latency-p95:  0.8        # tighter than the global 1.0 s

output:
  format: parquet
  file: /var/run/loadgen/canary-result.parquet
  record: true                       # capture for potential replay

observability:
  prometheus:
    listen: "0.0.0.0:9095"
  otel:
    endpoint: "http://otel-collector.observability.svc:4317"
    sampler_arg: 1.0
    service_name: "efe-meta-swarm-loadgen-canary"

run:
  seed: 31415926
  mode: staging
  allow_mutation: false
