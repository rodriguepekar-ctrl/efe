# PR #20 UC1 — Smoke test before deploy.
# Hits the controller at 50 QPS for 1 minute ; fails fast if Iterate
# availability drops below 99 %.  Used by the CI workflow
# `pr20-loadgen.yml` (kind-cluster smoke job).

version: 1
name: "smoke-50qps-1min"
description: "60-second smoke test at 50 QPS — used for CI pre-deploy check"

target:
  endpoints:
    - url: "grpc://efe-meta-swarm-controller.efe.svc:50051"
      weight: 1.0
  role: controller
  conns_per_target: 2
  per_request_deadline: "3s"

pattern:
  type: constant
  qps: 50

workload:
  type: mixed
  mix:
    iterate: 0.95
    state:   0.05

rate:
  mode: hybrid
  max_concurrency: 100

termination:
  duration: "1m"
  until_slo:
    iterate-availability: 0.99

output:
  format: ndjson
  file: /var/run/loadgen/smoke-result.ndjson

observability:
  prometheus:
    listen: "0.0.0.0:9095"
  otel:
    endpoint: "http://otel-collector.observability.svc:4317"
    sampler_arg: 1.0
    service_name: "efe-meta-swarm-loadgen-smoke"

run:
  seed: 42
  mode: staging
  allow_mutation: false
