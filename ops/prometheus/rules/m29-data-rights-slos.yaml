# M29 Data rights + customer compliance SLOs.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: efe-m29-data-rights-slos
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: efe-stack
    slo: m29
spec:
  groups:
    - name: efe-m29-pii
      interval: 30s
      rules:
        - alert: M29PiiCircuitOpen
          expr: efe_pii_analyze_circuit_breaks_total > 0
          for: 5m
          labels:
            severity: P2
          annotations:
            summary: "PII analyzer circuit open — Presidio degraded"
            runbook: "https://docs.efe.ai/runbooks/RB_M29_PII_CIRCUIT_OPEN"
        - alert: M29PiiLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(efe_pii_analyze_duration_seconds_bucket[5m]))
            ) > 0.100
          for: 10m
          labels:
            severity: P3
            slo: m29-5
          annotations:
            summary: "PII analyzer p99 > 100ms"
            runbook: "https://docs.efe.ai/runbooks/RB_M29_PII_CIRCUIT_OPEN"

    - name: efe-m29-erasure
      interval: 60s
      rules:
        - alert: M29ErasureStuckInProgress
          expr: |
            (time() - max by (id) (efe_erasure_active_total{state="in_progress"})) > 7200
          for: 30m
          labels:
            severity: P1
            slo: m29-1
          annotations:
            summary: "Erasure stuck in_progress > 2h"
            runbook: "https://docs.efe.ai/runbooks/RB_M29_ERASURE_VERIFY"

    - name: efe-m29-audit-export
      interval: 60s
      rules:
        - alert: M29AuditExportSinkDegraded
          expr: |
            sum(rate(efe_audit_export_failed_total[15m])) > 0
          for: 30m
          labels:
            severity: P2
            slo: m29-3
          annotations:
            summary: "Audit export sink failing for > 30 min"
            runbook: "https://docs.efe.ai/runbooks/RB_M29_AUDIT_EXPORT_FAIL"

    - name: efe-m29-byok
      interval: 60s
      rules:
        - alert: M29ByokRotationStuck
          expr: |
            (time() - max by (id) (efe_byok_rotation_duration_seconds_count)) > 3600
          for: 1h
          labels:
            severity: P2
          annotations:
            summary: "BYOK rotation has been running > 1h"
            runbook: "https://docs.efe.ai/runbooks/RB_M29_BYOK_ROTATION_STUCK"
