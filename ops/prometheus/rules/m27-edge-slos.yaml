# M27 Commercial Edge — PrometheusRule manifests.
# Apply : kubectl apply -f ops/prometheus/rules/m27-edge-slos.yaml -n monitoring
#
# See `docs/EFE_M27_COMMERCIAL_EDGE_ARCHITECTURE.md` § 18 for the SLO
# table and burn-rate thresholds.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: efe-m27-edge-slos
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: efe-stack
    slo: m27
spec:
  groups:
    - name: efe-m27-edge-availability
      interval: 30s
      rules:
        - alert: M27EdgeAvailabilityBudgetBurn
          expr: |
            (
              sum(rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="5",envoy_cluster_name=~"efe-server.*"}[5m]))
              /
              clamp_min(sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"efe-server.*"}[5m])), 1)
            ) > 0.001
          for: 10m
          labels:
            severity: P1
            slo: m27-1
          annotations:
            summary: "Edge 5xx rate > 0.1% — availability budget burning"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_EDGE_5XX"

        - alert: M27EnvoyP99LatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"efe-server.*"}[5m]))
            ) > 0.200
          for: 10m
          labels:
            severity: P2
            slo: m27-2
          annotations:
            summary: "Envoy p99 latency > 200ms over 10m"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_LATENCY_HIGH"

    - name: efe-m27-cache
      interval: 60s
      rules:
        - alert: M27EmbeddingCacheHitRatioLow
          expr: |
            (
              sum(rate(efe_cache_hit_total{cache="embed"}[10m]))
              /
              clamp_min(
                sum(rate(efe_cache_hit_total{cache="embed"}[10m]))
                + sum(rate(efe_cache_miss_total{cache="embed"}[10m])),
                1
              )
            ) < 0.8
          for: 30m
          labels:
            severity: P2
            slo: m27-3
          annotations:
            summary: "Embedding cache hit ratio < 80% (steady-state SLO)"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_CACHE_RATIO_LOW"

        - alert: M27LlmCacheHitRatioLow
          expr: |
            (
              sum(rate(efe_cache_hit_total{cache="llm"}[15m]))
              /
              clamp_min(
                sum(rate(efe_cache_hit_total{cache="llm"}[15m]))
                + sum(rate(efe_cache_miss_total{cache="llm"}[15m])),
                1
              )
            ) < 0.4
          for: 1h
          labels:
            severity: P3
            slo: m27-4
          annotations:
            summary: "LLM cache hit ratio < 40% (informational)"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_CACHE_RATIO_LOW"

        - alert: M27CachePoisoningDetected
          expr: |
            sum(rate(efe_cache_poisoned_total[5m])) > 0
          for: 1m
          labels:
            severity: P0
            slo: m27-security
          annotations:
            summary: "CRITICAL : cache value failed HMAC verification — possible poisoning"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_CACHE_POISONED"

    - name: efe-m27-redis
      interval: 30s
      rules:
        - alert: M27RedisClusterUnhealthy
          expr: |
            redis_cluster_known_nodes != 6
          for: 5m
          labels:
            severity: P1
            slo: m27-5
          annotations:
            summary: "Redis Cluster lost a node (known_nodes != 6)"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_REDIS_FAIL"

        - alert: M27RedisClusterDown
          expr: |
            redis_cluster_state{cluster_state="ok"} != 1
          for: 2m
          labels:
            severity: P0
            slo: m27-5
          annotations:
            summary: "Redis Cluster reports CLUSTERDOWN"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_REDIS_FAIL"

    - name: efe-m27-pgbouncer
      interval: 30s
      rules:
        - alert: M27PgBouncerPoolSaturated
          expr: |
            (pgbouncer_pools_sv_active / clamp_min(pgbouncer_pools_pool_size, 1)) > 0.9
          for: 5m
          labels:
            severity: P1
            slo: m27-6
          annotations:
            summary: "PgBouncer pool > 90% utilized"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_PGBOUNCER_SAT"

    - name: efe-m27-replica-lag
      interval: 30s
      rules:
        - alert: M27PgReplicaLag
          expr: |
            efe_pg_replica_lag_seconds > 30
          for: 5m
          labels:
            severity: P1
            slo: m27-7
          annotations:
            summary: "PG replica lag > 30s — consider RO fallback to RW"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_REPLICA_LAG"

    - name: efe-m27-backpressure
      interval: 30s
      rules:
        - alert: M27BackpressureSheddingHigh
          expr: |
            sum(rate(efe_backpressure_dropped_total[5m])) > 5
          for: 5m
          labels:
            severity: P2
          annotations:
            summary: "Backpressure middleware shedding > 5 req/s — investigate load"
            runbook: "https://docs.efe.ai/runbooks/RB_M27_LATENCY_HIGH"
