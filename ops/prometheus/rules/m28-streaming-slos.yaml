# M28 Streaming + Events SLOs.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: efe-m28-streaming-slos
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: efe-stack
    slo: m28
spec:
  groups:
    - name: efe-m28-webhooks
      interval: 30s
      rules:
        - alert: M28WebhookDeliveryFailureRate
          expr: |
            (
              sum(rate(efe_webhook_delivery_total{outcome=~"fail|drop"}[10m]))
              /
              clamp_min(sum(rate(efe_webhook_delivery_total[10m])), 1)
            ) > 0.05
          for: 10m
          labels:
            severity: P2
            slo: m28-2
          annotations:
            summary: "Webhook delivery failure rate > 5% (10m)"
            runbook: "https://docs.efe.ai/runbooks/RB_M28_WEBHOOK_DELIVERY_FAIL"
        - alert: M28WebhookCircuitsOpen
          expr: count(efe_webhook_circuit_state == 1) > 10
          for: 15m
          labels:
            severity: P3
          annotations:
            summary: "More than 10 webhook circuits open"
            runbook: "https://docs.efe.ai/runbooks/RB_M28_WEBHOOK_DELIVERY_FAIL"

    - name: efe-m28-nats
      interval: 30s
      rules:
        - alert: M28NatsConsumerLag
          expr: efe_nats_subscribe_lag_seconds > 60
          for: 5m
          labels:
            severity: P1
            slo: m28-5
          annotations:
            summary: "NATS consumer lag > 60s"
            runbook: "https://docs.efe.ai/runbooks/RB_M28_NATS_FULL"
        - alert: M28NatsDiskHigh
          expr: jetstream_storage_bytes / jetstream_max_storage_bytes > 0.8
          for: 10m
          labels:
            severity: P1
          annotations:
            summary: "JetStream storage > 80%"
            runbook: "https://docs.efe.ai/runbooks/RB_M28_NATS_FULL"

    - name: efe-m28-cdc
      interval: 30s
      rules:
        - alert: M28CdcSlotLag
          expr: efe_cdc_slot_lag_bytes > 1073741824
          for: 5m
          labels:
            severity: P1
            slo: m28-6
          annotations:
            summary: "PG logical slot lag > 1 GB"
            runbook: "https://docs.efe.ai/runbooks/RB_M28_CDC_LAG"

    - name: efe-m28-batch
      interval: 60s
      rules:
        - alert: M28BatchJobStuck
          expr: |
            (time() - max by (job_id) (efe_batch_rows_processed_total{status="running"})) > 14400
          for: 30m
          labels:
            severity: P2
          annotations:
            summary: "Batch job running > 4h with no row progress"
            runbook: "https://docs.efe.ai/runbooks/RB_M28_BATCH_STUCK"
