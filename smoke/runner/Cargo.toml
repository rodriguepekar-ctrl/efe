#                              efe-smoke
#  ──────────────────────────────────────────────────────────────────
#  PR #23 — 9 smoke checks (every-PR merge gate).
#
#  Frozen contracts in STABILITY_CONTRACT v1.5 § 23.
#  Reference : docs/EFE_A1_PHASE2_PR23_ARCHITECTURE.md.

[package]
name        = "efe-smoke"
version     = "0.1.0"
edition     = "2021"
license     = "UNLICENSED"
description = "EFE 9-check smoke merge-gate suite (PR #23)."
homepage    = "https://efe.example.com/smoke"
repository  = "https://github.com/efe-ai/efe"
keywords    = ["smoke", "merge-gate", "kind", "efe"]
categories  = ["command-line-utilities", "development-tools::testing"]
publish     = false

[[bin]]
name = "efe-smoke"
path = "src/main.rs"

[lib]
name = "efe_smoke"
path = "src/lib.rs"

[features]
default = []
# AD20 — opt-in PR #20 loadgen integration (request side of S2-S5).
loadgen-source = ["dep:efe-meta-swarm-loadgen"]
# Heavyweight integration tests against a real kind cluster (CI flag).
kind-integration = []

[dependencies]
# Workspace shared.
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }
uuid        = { workspace = true }
futures     = { workspace = true }
async-trait = { workspace = true }

# Crate-specific.
clap        = { version = "4.5", features = ["derive", "env", "wrap_help"] }
humantime   = "2.1"
chrono      = { version = "0.4", features = ["serde", "clock"] }
serde_yaml  = "0.9"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile    = "3.10"
parking_lot = "0.12"

# Workspace internal — PR #23 § 10 extraction.
efe-cluster-provisioner = { path = "../../crates/efe-cluster-provisioner" }
# Optional integration (AD20).
efe-meta-swarm-loadgen  = { path = "../../tools/loadgen", optional = true }

[dev-dependencies]
proptest = "1.5"
