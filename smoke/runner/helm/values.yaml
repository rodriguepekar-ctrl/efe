# PR #23 § 15 — frozen-but-additive values surface for the smoke chart.

# Chart version under test (REQUIRED — no default).  Forwarded to
# `efe-smoke run --chart-version`.
chartVersion: ""

# Mode : `dev` (default) or `staging`.  `production` is forbidden
# (AD11 from PR #21).
mode: dev

# Restrict to a subset of checks.  Empty = all 9.
checks: []

# Namespace where the chart-under-test is already installed.  When
# unset the smoke Job auto-generates `efe-smoke-<8hex>`.
targetNamespace: ""

image:
  repository: ghcr.io/efe/efe-smoke
  tag: 0.1.0
  pullPolicy: IfNotPresent

# Pod-level hardening (AD52 / T103).
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# Namespace-scoped RBAC (AD53 / T108).
rbac:
  create: true
  namespaceScoped: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

job:
  backoffLimit: 0
  activeDeadlineSeconds: 480   # 8-min cap (matches CI `timeout-minutes: 8`)
  ttlSecondsAfterFinished: 86400
  restartPolicy: Never

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

# T107 — redact secret-like strings in emitted artefacts.
redactLogs: true

# Output : in-cluster Job writes artefacts to an emptyDir ; operators
# extract via `kubectl cp`.  Phase-3 (G.4) adds S3 / GCS output.
output:
  format: json

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
