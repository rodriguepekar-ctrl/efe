# PR #23 § 15 — optional in-cluster Helm chart for the smoke runner.
#
# Use this chart when CI cannot port-forward into the cluster (managed
# K8s, restricted CI sandboxes).  Packages the runner as a one-shot
# Kubernetes Job that runs the 9 checks in-cluster.
#
# The default CI path (`smoke-pr.yml`) uses the runner from the GitHub
# runner host with `--provisioner external --kubeconfig`.  This chart
# is the **escape hatch**.

apiVersion: v2
name: efe-smoke
description: |
  EFE 9-check smoke merge gate, packaged as a one-shot Kubernetes Job.
  See https://efe.github.io/smoke/ for the public methodology page.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://efe.github.io/smoke/
sources:
  - https://github.com/efe-ai/efe/tree/main/smoke
keywords:
  - smoke
  - merge-gate
  - efe
maintainers:
  - name: EFE Platform Team
    email: platform@efe.example.com
annotations:
  artifacthub.io/changes: |
    - PR #23 — initial release.  9 checks, namespace-scoped RBAC, Job runner.
