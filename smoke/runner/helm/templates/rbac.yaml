{{- if .Values.rbac.create -}}
{{- include "efe-smoke.validate" . -}}
# PR #23 AD53 / T108 — strictly namespace-scoped (Role, not ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "efe-smoke.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-smoke.labels" . | nindent 4 }}
rules:
  # Read pods + services + endpoints + events (S1, S6 diagnostics).
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  # Trigger restart / rollout (S5, S8, S9 manifests).
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  # Run trigger-jobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  # Read configmaps + secrets (own namespace only).
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "efe-smoke.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-smoke.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "efe-smoke.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "efe-smoke.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
