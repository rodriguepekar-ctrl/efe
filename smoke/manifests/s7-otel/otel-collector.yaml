# PR #23 § 7.7 — minimal OTel collector for S7 trace-chain probe.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    exporters:
      debug: { verbosity: detailed }
      file:  { path: /tmp/spans.jsonl }
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug, file]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: { efe.io/smoke: "true", efe.io/smoke-check: "S7_otel" }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector, efe.io/smoke: "true" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.108.0
          args: ["--config", "/etc/otel/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - containerPort: 4317   # gRPC
            - containerPort: 4318   # HTTP
          volumeMounts:
            - { name: config, mountPath: /etc/otel }
            - { name: spans, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: otel-collector-config } }
        - { name: spans, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: { efe.io/smoke: "true", efe.io/smoke-check: "S7_otel" }
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: grpc, port: 4317, targetPort: 4317 }
    - { name: http, port: 4318, targetPort: 4318 }
