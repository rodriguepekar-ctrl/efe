# PR #23 § 7.5 — Job that sends SIGHUP to the controller pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: efe-smoke-s5-sighup-trigger
  labels:
    efe.io/smoke: "true"
    efe.io/smoke-check: "S5_reload_sighup"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels: { efe.io/smoke: "true", efe.io/smoke-check: "S5_reload_sighup" }
    spec:
      restartPolicy: Never
      serviceAccountName: efe-smoke-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: trigger
          image: bitnami/kubectl:1.30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eo pipefail
              POD=$(kubectl -n efe-smoke-s5 get pods -l app.kubernetes.io/name=efe-meta-swarm-controller -o jsonpath='{.items[0].metadata.name}')
              echo "[S5] sending SIGHUP to $POD"
              kubectl -n efe-smoke-s5 exec "$POD" -- kill -HUP 1
