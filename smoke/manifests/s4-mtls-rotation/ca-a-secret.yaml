# PR #23 § 7.4 — S4 cert-rotation CA placeholder A.
#
# AD55 — secrets are GENERATED in-cluster, not committed.  The kind-
# action workflow runs `openssl genrsa | kubectl create secret` BEFORE
# applying this manifest set ; the Secret name is referenced by the
# chart's `--set tls.secretName=efe-smoke-ca-a`.
#
# This stub exists so kustomize build succeeds at lint time.  Any
# attempt to apply it directly will fail (no `data` block — operator
# must inject the cert).
apiVersion: v1
kind: Secret
metadata:
  name: efe-smoke-ca-a
  labels: { efe.io/smoke: "true", efe.io/smoke-check: "S4_mtls_rotation" }
type: kubernetes.io/tls
stringData:
  tls.crt: ""   # injected at run-time by the smoke runner
  tls.key: ""
