# PR #23 § 7.4 — S4 mTLS rotation overlay : two CAs + rotation Job.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: efe-smoke-s4
commonLabels:
  efe.io/smoke: "true"
  efe.io/smoke-check: "S4_mtls_rotation"
resources:
  - namespace.yaml
  - ca-a-secret.yaml
  - ca-b-secret.yaml
  - rotation-job.yaml
