# PR #23 § 7.8 — PodDisruptionBudget guarantees quorum during restart.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: efe-smoke-s8-participant-pdb
  labels: { efe.io/smoke: "true", efe.io/smoke-check: "S8_restart" }
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: efe-meta-swarm-participant
