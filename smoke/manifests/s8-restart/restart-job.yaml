# PR #23 § 7.8 — Job that deletes participant-0 to trigger restart.
apiVersion: batch/v1
kind: Job
metadata:
  name: efe-smoke-s8-restart-trigger
  labels:
    efe.io/smoke: "true"
    efe.io/smoke-check: "S8_restart"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels: { efe.io/smoke: "true", efe.io/smoke-check: "S8_restart" }
    spec:
      restartPolicy: Never
      serviceAccountName: efe-smoke-runner
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: trigger
          image: bitnami/kubectl:1.30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eo pipefail
              echo "[S8] deleting participant-0 to trigger restart"
              kubectl -n efe-smoke-s8 delete pod efe-meta-swarm-participant-0 --grace-period=10
