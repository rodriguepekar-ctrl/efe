# PR #23 § 7.9 — Job that triggers rollout-restart on the controller.
apiVersion: batch/v1
kind: Job
metadata:
  name: efe-smoke-s9-shutdown-trigger
  labels:
    efe.io/smoke: "true"
    efe.io/smoke-check: "S9_shutdown"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels: { efe.io/smoke: "true", efe.io/smoke-check: "S9_shutdown" }
    spec:
      restartPolicy: Never
      serviceAccountName: efe-smoke-runner
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: trigger
          image: bitnami/kubectl:1.30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eo pipefail
              echo "[S9] triggering rollout-restart on controller"
              kubectl -n efe-smoke-s9 rollout restart deployment efe-meta-swarm-controller
              kubectl -n efe-smoke-s9 rollout status deployment efe-meta-swarm-controller --timeout=15s
