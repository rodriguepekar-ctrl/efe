# PR #23 § 14 — S1 boot manifest set.
# Boots the chart with shortened readiness probes for fast pass detection.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: efe-smoke-s1

commonLabels:
  efe.io/smoke: "true"
  efe.io/smoke-check: "S1_boot"

resources:
  - namespace.yaml

patches:
  - path: readiness-probe-overlay.yaml
    target:
      kind: Deployment
      name: efe-meta-swarm-controller
  - path: readiness-probe-overlay.yaml
    target:
      kind: StatefulSet
      name: efe-meta-swarm-participant
