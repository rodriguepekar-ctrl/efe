# Sprint 8 — N11 : default values for the efe-nano-firecracker chart.

image:
  repository: registry.efe.internal/efe-nano
  tag: v0.8.0
  pullPolicy: IfNotPresent

# Backend selection.  Production : "firecracker" ; dev fallback : "stub".
vmBackend: firecracker

# DaemonSet node selector — only schedule on KVM-capable nodes.
nodeSelector:
  node.efe.io/firecracker-ready: "true"

# Tolerations — DaemonSet should tolerate the standard node taints.
tolerations:
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule

# Pod-level resources : per-NODE budget (the DaemonSet runs one pod
# per node).  Sized for c7i.metal-24xl (32 vCPUs, 128 GB) :
resources:
  requests:
    cpu: "16"
    memory: 64Gi
    ephemeral-storage: 10Gi
  limits:
    cpu: "32"
    memory: 128Gi
    ephemeral-storage: 50Gi

# Firecracker pool config.  Mirrors crates/efe-nano/src/runtime/pool/firecracker/config.rs
firecracker:
  binaryPath: /opt/firecracker/firecracker
  kernelImage: /opt/firecracker/vmlinux
  rootfsRegistry: registry.efe.internal/firecracker
  bootBudget: 500ms
  reaperInterval: 10s
  vsockTimeout: 30s
  idleEvictionAfter: 5m
  maxTotalVms: 500

  cgroup:
    root: /sys/fs/cgroup/efe-nano
    # If the parent cgroup doesn't exist, an init container creates it
    # via CgroupController::ensure_parent (Sprint 8 day 17 deliverable).
    autoCreateParent: true

  apiSocketDir: /var/run/efe-nano/sockets

  # Per-kind sub-pool sizing.  See architecture doc § 12.
  kinds:
    - modelId: ner_clinical
      modelVersion: 1.0.0
      rootfsTag: "1.0.0"
      minWarm: 20
      maxTotal: 50
      memoryMb: 256
      vcpus: 1
      cgroupCpuQuotaUs: 1000000
      cgroupMemoryHigh: 230686720
      cgroupMemoryMax: 268435456
      cgroupBlkioWeight: 100
    - modelId: ner_legal
      modelVersion: 1.0.0
      rootfsTag: "1.0.0"
      minWarm: 10
      maxTotal: 30
      memoryMb: 256
      vcpus: 1
      cgroupCpuQuotaUs: 1000000
      cgroupMemoryHigh: 230686720
      cgroupMemoryMax: 268435456
      cgroupBlkioWeight: 100
    - modelId: intent_classify
      modelVersion: 1.0.0
      rootfsTag: "1.0.0"
      minWarm: 30
      maxTotal: 80
      memoryMb: 128
      vcpus: 1
      cgroupCpuQuotaUs: 1000000
      cgroupMemoryHigh: 115343360
      cgroupMemoryMax: 134217728
      cgroupBlkioWeight: 100
    - modelId: lang_detect
      modelVersion: 1.0.0
      rootfsTag: "1.0.0"
      minWarm: 20
      maxTotal: 50
      memoryMb: 64
      vcpus: 1
      cgroupCpuQuotaUs: 500000
      cgroupMemoryHigh: 57671680
      cgroupMemoryMax: 67108864
      cgroupBlkioWeight: 100
    - modelId: embedder
      modelVersion: 1.0.0
      rootfsTag: "1.0.0"
      minWarm: 30
      maxTotal: 80
      memoryMb: 384
      vcpus: 1
      cgroupCpuQuotaUs: 1000000
      cgroupMemoryHigh: 346030080
      cgroupMemoryMax: 402653184
      cgroupBlkioWeight: 100
    - modelId: llm_caller
      modelVersion: 1.0.0
      rootfsTag: "1.0.0"
      minWarm: 30
      maxTotal: 80
      memoryMb: 512
      vcpus: 2
      cgroupCpuQuotaUs: 2000000
      cgroupMemoryHigh: 461373440
      cgroupMemoryMax: 536870912
      cgroupBlkioWeight: 100

# Audit chain HMAC master key.  In production, sourced from a Secret
# managed by AWS Secrets Manager or HashiCorp Vault.
audit:
  hmacMasterSecretName: efe-audit-master
  hmacMasterSecretKey: master

# Observability.
metrics:
  enabled: true
  port: 9090
  scrapeInterval: 15s

tracing:
  enabled: true
  otelCollectorEndpoint: http://otel-collector.efe.svc.cluster.local:4317
