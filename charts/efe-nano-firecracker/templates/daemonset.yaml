# Sprint 8 — N11 : DaemonSet that runs EFE Nano with the Firecracker
# backend on every KVM-capable node.
#
# Why DaemonSet (not Deployment) :
# - The pool's warm VMs are node-local (no cross-node sharing).
# - Cgroup management is per-node (one cgroup hierarchy per kernel).
# - Each node holds its own /dev/kvm.
# - Failure isolation is per-node : one bad pod doesn't take down a region.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "efe-nano-firecracker.fullname" . }}
  labels:
    {{- include "efe-nano-firecracker.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "efe-nano-firecracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "efe-nano-firecracker.selectorLabels" . | nindent 8 }}
      annotations:
        # Tell Prometheus to scrape /metrics on the pod IP.
        prometheus.io/scrape: "{{ .Values.metrics.enabled }}"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "efe-nano-firecracker.serviceAccountName" . }}
      # hostPID needed so the runtime can read /proc/{pid}/status for
      # liveness checks on child Firecracker processes.
      hostPID: true
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

      {{- if .Values.firecracker.cgroup.autoCreateParent }}
      initContainers:
        - name: ensure-cgroup
          image: alpine:3.20
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          command:
            - sh
            - -c
            - |
              set -eu
              CGROUP="{{ .Values.firecracker.cgroup.root }}"
              mkdir -p "$CGROUP"
              # Idempotent : echo to subtree_control.
              echo "+cpu +memory +io" > "$CGROUP/cgroup.subtree_control" 2>/dev/null || true
              echo "cgroup parent ready : $CGROUP"
          volumeMounts:
            - { name: cgroup, mountPath: /sys/fs/cgroup }
      {{- end }}

      containers:
        - name: efe-nano
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # Required for : cgroup writes, /dev/kvm, fork()ing
            # firecracker with cap_sys_admin, vsock setup.
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN", "KILL"]
          env:
            - name: EFE_NANO_VM_BACKEND
              value: "{{ .Values.vmBackend }}"
            - name: EFE_NANO_FIRECRACKER_CONFIG
              value: /etc/efe-nano/firecracker-config.json
            - name: EFE_NANO_AUDIT_HMAC_MASTER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.audit.hmacMasterSecretName }}
                  key: {{ .Values.audit.hmacMasterSecretKey }}
            {{- if .Values.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.otelCollectorEndpoint }}
            {{- end }}
            - name: RUST_LOG
              value: "info,efe_nano=debug"
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # /dev/kvm — required for KVM.
            - { name: dev-kvm, mountPath: /dev/kvm }
            # Firecracker binary + kernel image directory.
            - { name: firecracker-bin, mountPath: /opt/firecracker, readOnly: true }
            # Per-tenant rootfs images cache (populated by initContainer ;
            # could also be a separate sidecar Job that pulls from OCI).
            - { name: rootfs-cache, mountPath: /opt/efe-nano/rootfs }
            # API socket dir (host-visible Unix sockets for Firecracker control).
            - { name: api-sockets, mountPath: {{ .Values.firecracker.apiSocketDir }} }
            # Cgroup root (privileged write).
            - { name: cgroup, mountPath: /sys/fs/cgroup, mountPropagation: HostToContainer }
            # Pool config.
            - { name: config, mountPath: /etc/efe-nano, readOnly: true }
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - { name: dev-kvm, hostPath: { path: /dev/kvm, type: CharDevice } }
        - { name: firecracker-bin, hostPath: { path: /opt/firecracker } }
        - { name: rootfs-cache, hostPath: { path: /var/lib/efe-nano/rootfs, type: DirectoryOrCreate } }
        - { name: api-sockets, emptyDir: {} }
        - { name: cgroup, hostPath: { path: /sys/fs/cgroup } }
        - name: config
          configMap:
            name: {{ include "efe-nano-firecracker.fullname" . }}-config
