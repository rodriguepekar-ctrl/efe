# Sprint 8 — N11 : ServiceAccount + RBAC for the DaemonSet.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "efe-nano-firecracker.serviceAccountName" . }}
  labels:
    {{- include "efe-nano-firecracker.labels" . | nindent 4 }}
---
# Sprint 8 — N11 : minimal RBAC.  The DaemonSet does NOT need to
# read/write k8s resources at runtime ; all per-VM state is per-node.
# This ClusterRole is empty by default ; Phase 4 may grant access to
# read the audit chain ConfigMap or write metrics CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "efe-nano-firecracker.fullname" . }}
  labels:
    {{- include "efe-nano-firecracker.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "efe-nano-firecracker.fullname" . }}
  labels:
    {{- include "efe-nano-firecracker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "efe-nano-firecracker.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "efe-nano-firecracker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
