# Sprint 8 — N11 : ConfigMap containing the FirecrackerPoolConfig JSON.
# Mounted at /etc/efe-nano/firecracker-config.json in the DaemonSet pod.

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe-nano-firecracker.fullname" . }}-config
  labels:
    {{- include "efe-nano-firecracker.labels" . | nindent 4 }}
data:
  firecracker-config.json: |
    {
      "binary_path": "{{ .Values.firecracker.binaryPath }}",
      "kernel_image": "{{ .Values.firecracker.kernelImage }}",
      "cgroup_root": "{{ .Values.firecracker.cgroup.root }}",
      "api_socket_dir": "{{ .Values.firecracker.apiSocketDir }}",
      "boot_budget": { "secs": 0, "nanos": 500000000 },
      "reaper_interval": { "secs": 10, "nanos": 0 },
      "vsock_timeout": { "secs": 30, "nanos": 0 },
      "idle_eviction_after": { "secs": 300, "nanos": 0 },
      "max_total_vms": {{ .Values.firecracker.maxTotalVms }},
      "per_kind": [
        {{- range $i, $k := .Values.firecracker.kinds }}
        {{- if $i }},{{ end }}
        {
          "kind": "{{ if eq $k.modelId "llm_caller" }}llm_caller{{ else }}model_inference{{ end }}",
          "model_id": "{{ $k.modelId }}",
          "model_version": "{{ $k.modelVersion }}",
          "rootfs_path": "/opt/efe-nano/rootfs/{{ $k.modelId }}-{{ $k.rootfsTag }}.ext4",
          "min_warm": {{ $k.minWarm }},
          "max_total": {{ $k.maxTotal }},
          "memory_mb": {{ $k.memoryMb }},
          "vcpus": {{ $k.vcpus }},
          "cgroup_cpu_quota_us": {{ $k.cgroupCpuQuotaUs }},
          "cgroup_memory_high": {{ $k.cgroupMemoryHigh }},
          "cgroup_memory_max": {{ $k.cgroupMemoryMax }},
          "cgroup_blkio_weight": {{ $k.cgroupBlkioWeight }}
        }
        {{- end }}
      ],
      "tenant_class_overrides": {}
    }
