# Sprint Φ-D-OPS (D96) — Catalog CRD.
#
# Declarative representation of a tenant's anchor catalog. GitOps-
# managed ; reconciled by the catalog controller.
#
# Cf. `docs/EFE_OPERATIONAL_PRODUCTION_ARCHITECTURE.md` § 7.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: catalogs.efe.io
spec:
  group: efe.io
  names:
    kind: Catalog
    plural: catalogs
    singular: catalog
    shortNames: [cat]
    categories: [efe]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [tenantRef, catalogId, bundleUri, bundleVersion]
              properties:
                tenantRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
                catalogId:
                  type: string
                  pattern: "^[a-z0-9_-]{1,64}$"
                bundleUri:
                  type: string
                  description: |
                    Where the bundle lives. Supported schemes :
                      - `s3://…`  (= production)
                      - `gs://…`  (= GCP path)
                      - `oci://…` (= bundle as OCI artifact)
                      - `file://…` (= local dev)
                bundleVersion:
                  type: string
                  pattern: '^\d+\.\d+\.\d+$'
                bundleSha256:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                  description: |
                    SHA-256 of the JSONL bundle. Required when bundleUri
                    is not `oci://` (= OCI carries its own digest).
                anchorCount:
                  type: integer
                  minimum: 1
                  maximum: 100000
                routing:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [mode-1, mode-2, mode-3, hybrid]
                      default: mode-1
                    hybrid:
                      type: object
                      properties:
                        agreeMinConf:       {type: number, default: 0.45}
                        swarmOverrideConf:  {type: number, default: 0.85}
                promotionPolicy:
                  type: string
                  enum: [automatic, manual]
                  default: manual
                canaryFraction:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.10
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [pending, seeding, ready, promoting, retired]
                seededAt:
                  type: string
                  format: date-time
                lastEvaluation:
                  type: object
                  properties:
                    top1Accuracy: {type: number}
                    macroF1:      {type: number}
                    measuredAt:   {type: string, format: date-time}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantRef.name
        - name: Catalog
          type: string
          jsonPath: .spec.catalogId
        - name: Version
          type: string
          jsonPath: .spec.bundleVersion
        - name: Mode
          type: string
          jsonPath: .spec.routing.mode
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Top1
          type: number
          jsonPath: .status.lastEvaluation.top1Accuracy
      subresources:
        status: {}
