{{/*
  HMAC chain seed Secret. Used by efe-server to compute the D14-bis
  audit chain HMAC. Generated ONCE at install time and pinned via
  `lookup` thereafter — rotation requires the documented RB-04
  procedure (NEVER auto-rotate).
*/}}
{{- $auditSecretName := "efe-audit-hmac" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $auditSecretName -}}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $auditSecretName }}
  labels:
    {{- include "efe-stack.labels" . | nindent 4 }}
    efe.io/criticality: p0
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  seed: {{ randAlphaNum 64 | quote }}
{{- end }}
