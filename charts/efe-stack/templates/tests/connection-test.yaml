apiVersion: v1
kind: Pod
metadata:
  name: {{ include "efe-stack.fullname" . }}-connection-test
  labels:
    {{- include "efe-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
  containers:
    - name: connection-test
      image: curlimages/curl:8.10.0
      command: ["/bin/sh"]
      args:
        - -c
        - |
          set -e
          echo "Testing efe-server health endpoint..."
          curl -fsS -m 5 http://{{ .Release.Name }}-efe-server:8081/healthz
          echo
          echo "Testing mcp-server health endpoint..."
          curl -fsS -m 5 http://{{ .Release.Name }}-mcp-server:8080/healthz
          echo
          echo "ALL TESTS PASSED"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
