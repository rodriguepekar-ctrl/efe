{{/*
  Pod Security Standards labels on the release namespace.
  K8s 1.25+ enforces these via the built-in PSA controller.

  We use `kubectl annotate / label` post-install rather than templating
  the namespace itself (Helm doesn't manage the namespace by default
  and forcing it would conflict with `--create-namespace`).

  The values supported are : privileged, baseline, restricted.
*/}}
{{- if .Values.podSecurityPolicy.enforce }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "efe-stack.fullname" . }}-pss-label
  labels:
    {{- include "efe-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "efe-stack.fullname" . }}-pss
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          image: bitnami/kubectl:1.30
          command:
            - /bin/sh
            - -c
            - |
              kubectl label --overwrite ns {{ .Release.Namespace }} \
                pod-security.kubernetes.io/enforce={{ .Values.podSecurityPolicy.enforce }} \
                pod-security.kubernetes.io/audit={{ .Values.podSecurityPolicy.enforce }} \
                pod-security.kubernetes.io/warn={{ .Values.podSecurityPolicy.enforce }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "efe-stack.fullname" . }}-pss
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "efe-stack.fullname" . }}-pss
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["{{ .Release.Namespace }}"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "efe-stack.fullname" . }}-pss
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
subjects:
  - kind: ServiceAccount
    name: {{ include "efe-stack.fullname" . }}-pss
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "efe-stack.fullname" . }}-pss
  apiGroup: rbac.authorization.k8s.io
{{- end }}
