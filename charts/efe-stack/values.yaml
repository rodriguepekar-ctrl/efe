# Default values for efe-stack umbrella chart.
# Override per environment with `--values <file>`.

# ─── Global settings (shared by all sub-charts) ───────────────────────
global:
  domain: efe.example.com
  imageRegistry: ghcr.io/efe-ai
  imagePullSecrets: []
  storageClass: gp3
  # Tenant slug used for resource naming + tagging. MUST be set by SE.
  tenant: ""
  environment: prod                    # prod | staging | dev | poc
  commonLabels:
    app.kubernetes.io/part-of: efe-stack
    efe.io/managed-by: helm
  externalPostgres:
    enabled: false
    secretRef:
      name: efe-postgres-external
      key: connection_string

  # ─── PR #13 cross-chart wiring : efe-server → efe-meta-swarm.
  # When the `efe-meta-swarm` sub-chart is enabled (cf. block at
  # the bottom of this file), the operator MUST also flip
  # `global.metaSwarm.enabled = true` so the sibling `efe-server`
  # Deployment picks up the `EFE_META_SWARM_*` env vars.
  #
  # Why TWO flags : Helm 3 does NOT propagate a sibling sub-chart's
  # values to another sub-chart — only `global.*` propagates.  The
  # sub-chart's own `enabled` flag is required by Helm's
  # `condition: efe-meta-swarm.enabled` (Chart.yaml dependency).
  # The `global.metaSwarm.enabled` flag is consumed by efe-server's
  # template.  In a future PR (#14), the umbrella may introduce
  # a values-yaml-pre-processor that syncs them automatically.
  metaSwarm:
    enabled: false
    # If empty, defaults to `<release>-efe-meta-swarm-controller`.
    controllerServiceName: ""
    controllerServicePort: 50080
    connectTimeoutMs: 3500
    callTimeoutMs: 15000
    healthProbeAtStartup: true

# ─── efe-server (Rust gRPC service) ───────────────────────────────────
efe-server:
  enabled: true
  replicas: 3
  image:
    repository: efe-server
    tag: ""                            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    grpcPort: 50051
    metricsPort: 9090
    healthPort: 8081
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetClassifyRPS: 200
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
  networkPolicy:
    enabled: true
  byok:
    backend: env                       # env|file|aws-kms|gcp-kms|azure-kv|vault|pkcs11
    awsKmsKeyId: ""
  serviceAccount:
    create: true
    annotations: {}
  envOverrides: []
  auditHmacSecretRef:
    name: efe-audit-hmac
    key: seed
  features:
    m20HelperToolsEnabled: false
    m21Mode2Enabled: false
    m22Mode3Enabled: false
    d8AdminEnabled: false

# ─── mcp-server (Python HTTP service) ─────────────────────────────────
mcp-server:
  enabled: true
  replicas: 2
  image:
    repository: mcp-server
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8080
    metricsPort: 9091
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  profile: agent-native-deploy
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
  networkPolicy:
    enabled: true

# ─── portal-admin (Next.js, Sprint C) ─────────────────────────────────
portal-admin:
  enabled: false                       # default OFF until Sprint C ships
  replicas: 3
  image:
    repository: portal-admin
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 3000
  ingress:
    enabled: true
    className: nginx
    host: ""                           # defaults to portal.{global.domain}
    tls:
      enabled: true
      issuerRef:
        kind: ClusterIssuer
        name: letsencrypt-prod
  sso:
    issuer: ""
    clientId: efe-portal
    clientSecretRef:
      name: efe-portal-sso
      key: client-secret
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# ─── postgres-operator (CrunchyData PGO) ──────────────────────────────
postgres-operator:
  enabled: true
  cluster:
    enabled: true
    name: efe-postgres
    postgresVersion: 16
    instances:
      - name: instance1
        replicas: 3
        dataVolumeClaimSpec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 100Gi
          storageClassName: ""         # falls back to global.storageClass
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 4
            memory: 16Gi
  backup:
    pgbackrest:
      repos:
        - name: repo1
          s3:
            bucket: ""
            endpoint: s3.amazonaws.com
            region: ""
          schedules:
            full: "0 1 * * 0"
            differential: "0 1 * * 1-6"
            incremental: "0 */4 * * *"
  monitoring:
    enabled: true

# ─── redis-stack ──────────────────────────────────────────────────────
redis-stack:
  enabled: true
  image:
    repository: redis/redis-stack-server
    tag: 7.4-v0
    pullPolicy: IfNotPresent
  storage: 50Gi
  storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2
      memory: 8Gi
  authToken:
    enabled: true
    secretRef:
      name: efe-redis-auth
      key: token
  persistence:
    enabled: true
    aofEnabled: true
    aofFsync: everysec
    rdbCompression: true
  maxMemoryPolicy: noeviction          # critical for caching correctness
  exporter:
    enabled: true
    image:
      repository: oliver006/redis_exporter
      tag: v1.62.0

# External Redis (used when redis-stack.enabled=false)
externalRedis:
  enabled: false
  host: ""
  port: 6379
  authTokenSecretRef:
    name: efe-redis-external-auth
    key: token

# ─── observability ────────────────────────────────────────────────────
observability:
  enabled: true
  prometheus:
    enabled: true
    retention: 30d
    persistentVolumeSize: 100Gi
    storageClass: ""
    scrapeInterval: 15s
  grafana:
    enabled: true
    adminPasswordSecretRef:
      name: efe-grafana-admin
      key: admin-password
    dashboards:
      efeOverview: true
      efeMode3: true
      efeCompliance: true
    persistentVolumeSize: 10Gi
  loki:
    enabled: true
    retention: 30d
    persistentVolumeSize: 200Gi
  tempo:
    enabled: true
    samplingRate: 0.01
    retention: 7d
  alertmanager:
    enabled: true

# ─── M29 Data rights — Presidio sidecar ──────────────────────────────
# Microsoft Presidio analyzer (FR + EN). Default OFF — enable once
# `tenant_feature.pii_policy != 'off'` is needed for at least one
# tenant. See `docs/EFE_M29_DATA_RIGHTS_ARCHITECTURE.md`.
efe-pii:
  enabled: false
  presidio:
    replicas: 2

# ─── M28 Streaming + Events ──────────────────────────────────────────
# NATS JetStream 3-node cluster for the internal event bus. Default
# OFF — enable when : (a) efe-edge is already running with Redis +
# PgBouncer, (b) the operator has provisioned the NATS Secret
# out-of-band, (c) SQL migration 0022 is applied. See
# `docs/EFE_M28_STREAMING_EVENTS_ARCHITECTURE.md`.
efe-nats:
  enabled: false
  nats:
    replicas: 3
    persistence:
      size: 20Gi

# ─── M27 Commercial Edge ─────────────────────────────────────────────
# Envoy + ratelimit + Redis Cluster + PgBouncer. Default OFF — opt-in
# once the cluster is M27-ready (cert-manager + Cloudflare account +
# pre-provisioned PG replica). See
# `docs/EFE_M27_COMMERCIAL_EDGE_ARCHITECTURE.md` § 21 for the staged
# rollout plan. The sub-chart's own values.yaml has the detailed
# configuration ; override here only what differs per environment.
efe-edge:
  enabled: false
  envoy:
    replicas: 3
    oidc:
      issuer: "https://oidc.efe.example.com"
      audiences:
        - "efe-classification"
        - "efe-agent-runtime"
      jwksUri: "https://oidc.efe.example.com/.well-known/jwks.json"
    upstream:
      grpcCluster: "efe-stack-efe-server"
      grpcPort: 50051
      restCluster: "efe-stack-efe-server"
      restPort: 8080
      agentRestCluster: "efe-stack-efe-server"
      agentRestPort: 8088
  redis:
    replicas: 6
    persistence:
      size: 8Gi
  pgbouncer:
    replicas: 2
    upstream:
      host: "efe-stack-postgres-rw"
      port: 5432
      database: efe
      readReplicaHost: "efe-stack-postgres-ro"
      readReplicaPort: 5432

# ─── Network ──────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true

networkPolicy:
  defaultDeny: true                    # baseline NetworkPolicy = deny-all

podSecurityPolicy:
  enforce: restricted

# ─── Init job : DB migrations ─────────────────────────────────────────
migrations:
  enabled: true
  image:
    repository: efe-server-migrate
    tag: ""
  backoffLimit: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ─── Phase-2 meta-swarm sub-chart (PR #13) ────────────────────────────
# Off by default ; enable in environment-specific overrides.  Cf.
# `docs/EFE_A1_PHASE2_PR13_ARCHITECTURE.md`.
#
# IMPORTANT (PR #13 cross-chart wiring) : flip `global.metaSwarm.enabled`
# to `true` (block above) at the same time you set this `enabled: true`.
# `efe-meta-swarm.enabled` controls whether the sub-chart's resources
# render (Helm dependency `condition:`) ; `global.metaSwarm.enabled`
# controls whether `efe-server` picks up the `EFE_META_SWARM_*` env
# vars (Helm 3 does not auto-propagate between sub-charts).
efe-meta-swarm:
  enabled: false
