suite: efe-stack umbrella tests
templates:
  - secret-audit-hmac.yaml
  - networkpolicy-default-deny.yaml
  - migrations-job.yaml
release:
  name: test
  namespace: efe-test
chart:
  appVersion: 1.6.0
tests:
  - it: emits default-deny NetworkPolicy when enabled
    set:
      global.tenant: acme
      networkPolicy.defaultDeny: true
    template: networkpolicy-default-deny.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - lengthEqual:
          path: spec.policyTypes
          count: 2

  - it: skips default-deny when disabled
    set:
      global.tenant: acme
      networkPolicy.defaultDeny: false
    template: networkpolicy-default-deny.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: emits migrations Job
    set:
      global.tenant: acme
      migrations.enabled: true
    template: migrations-job.yaml
    asserts:
      - documentIndex: 1
      - isKind:
          of: Job
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "ghcr\\.io/efe-ai/efe-server-migrate:.*"
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade

  - it: skips migrations Job when disabled
    set:
      global.tenant: acme
      migrations.enabled: false
    template: migrations-job.yaml
    asserts:
      - hasDocuments:
          count: 0
