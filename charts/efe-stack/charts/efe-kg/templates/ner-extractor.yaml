{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efe-kg.fullname" . }}-ner
  labels:
    {{- include "efe-kg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nerExtractor.replicas }}
  selector:
    matchLabels:
      {{- include "efe-kg.selectorLabels" . | nindent 6 }}
      component: ner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "efe-kg.selectorLabels" . | nindent 8 }}
        component: ner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.nerExtractor.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ner
          image: "{{ .Values.nerExtractor.image.repository }}:{{ .Values.nerExtractor.image.tag }}"
          imagePullPolicy: {{ .Values.nerExtractor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nerExtractor.service.port }}
              protocol: TCP
          env:
            - name: NER_LANGUAGES
              value: {{ join "," .Values.nerExtractor.languages | quote }}
            - name: NER_MODEL_NAME
              value: {{ .Values.nerExtractor.modelName | quote }}
            - name: PORT
              value: {{ .Values.nerExtractor.service.port | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.nerExtractor.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-kg.fullname" . }}-ner
  labels:
    {{- include "efe-kg.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nerExtractor.service.type }}
  ports:
    - name: http
      port: {{ .Values.nerExtractor.service.port }}
      targetPort: http
      appProtocol: http
  selector:
    {{- include "efe-kg.selectorLabels" . | nindent 4 }}
    component: ner
{{- end }}

{{- if and .Values.enabled .Values.snapshotCron.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "efe-kg.fullname" . }}-snapshot
  labels:
    {{- include "efe-kg.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.snapshotCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "efe-kg.selectorLabels" . | nindent 12 }}
            component: snapshot
        spec:
          restartPolicy: OnFailure
          containers:
            - name: snapshotter
              image: "{{ .Values.snapshotCron.image.repository }}:{{ .Values.snapshotCron.image.tag }}"
              args:
                - "--bucket={{ .Values.snapshotBucket.name }}"
                - "--region={{ .Values.snapshotBucket.region }}"
                - "--prefix={{ .Values.snapshotBucket.prefix }}"
{{- end }}

{{- if and .Values.enabled .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-kg.fullname" . }}-ner
  labels:
    {{- include "efe-kg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "efe-kg.selectorLabels" . | nindent 6 }}
      component: ner
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.upstreamNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
