enabled: true

image:
  repository: redis/redis-stack-server
  tag: 7.4-v0
  pullPolicy: IfNotPresent

storage: 50Gi
storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2
    memory: 8Gi

authToken:
  enabled: true
  secretRef:
    name: efe-redis-auth
    key: token

# Round-5 DT-OPS-20 fix : PDB **default OFF** because redis-stack
# ships as a single-replica StatefulSet — `minAvailable: 1` with
# only 1 replica would block all voluntary node drains. Flip to
# true ONLY if you have scaled to ≥ 2 replicas with proper redis
# replication topology in place.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

persistence:
  enabled: true
  aofEnabled: true
  aofFsync: everysec
  rdbCompression: true

maxMemoryPolicy: noeviction

exporter:
  enabled: true
  image:
    repository: oliver006/redis_exporter
    tag: v1.62.0

global:
  storageClass: gp3
  imageRegistry: ghcr.io/efe-ai
