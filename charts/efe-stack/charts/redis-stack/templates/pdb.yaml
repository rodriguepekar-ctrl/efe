{{- /*
Round-5 DT-OPS-20 fix : the redis-stack chart was missing a PDB.
redis-stack ships as a single-replica StatefulSet by design (no
replication topology in the chart), so a `minAvailable: 1` PDB would
*block* node drains entirely — the operator would have to disable
the PDB manually each time. Therefore this PDB is **default OFF**
in values.yaml and documents the trade-off. Operators who scale
redis-stack to ≥ 2 replicas (with proper redis replication wiring)
should flip `podDisruptionBudget.enabled: true`.
*/ -}}
{{- if and .Values.enabled .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "redis-stack.fullname" . }}
  labels:
    {{- include "redis-stack.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "redis-stack.selectorLabels" . | nindent 6 }}
{{- end }}
