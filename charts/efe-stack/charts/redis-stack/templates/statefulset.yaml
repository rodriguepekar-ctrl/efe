{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis-stack.fullname" . }}
  labels:
    {{- include "redis-stack.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis-stack.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "redis-stack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redis-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-stack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authToken.secretRef.name }}
                  key: {{ .Values.authToken.secretRef.key }}
            - name: REDIS_ARGS
              value: >-
                --requirepass $(REDIS_AUTH_TOKEN)
                --maxmemory-policy {{ .Values.maxMemoryPolicy }}
                {{- if .Values.persistence.aofEnabled }}
                --appendonly yes
                --appendfsync {{ .Values.persistence.aofFsync }}
                {{- end }}
                {{- if .Values.persistence.rdbCompression }}
                --rdbcompression yes
                {{- end }}
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_AUTH_TOKEN" PING | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Redis needs to write AOF
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
        {{- if .Values.exporter.enabled }}
        - name: redis-exporter
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          ports:
            - name: exporter
              containerPort: 9121
              protocol: TCP
          env:
            - name: REDIS_ADDR
              value: localhost:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authToken.secretRef.name }}
                  key: {{ .Values.authToken.secretRef.key }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage | default "50Gi" }}
        storageClassName: {{ .Values.storageClass | default .Values.global.storageClass }}
{{- end }}
