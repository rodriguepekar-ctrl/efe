{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-stack.fullname" . }}
  labels:
    {{- include "redis-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
    {{- if .Values.exporter.enabled }}
    - name: metrics
      port: 9121
      targetPort: exporter
      protocol: TCP
    {{- end }}
  selector:
    {{- include "redis-stack.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-stack.fullname" . }}-headless
  labels:
    {{- include "redis-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "redis-stack.selectorLabels" . | nindent 4 }}
{{- end }}
