{{- if and .Values.enabled .Values.authToken.enabled }}
{{/*
  If the SecretRef target doesn't exist, generate one.
  The token is stable across upgrades thanks to the `lookup` trick.

  IMPORTANT : `randAlphaNum 48` MUST be called once and stored in
  $token, then reused — calling it twice would produce two different
  passwords, breaking auth between the Redis server and the connection
  string consumed by efe-server / mcp-server.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.authToken.secretRef.name }}
{{- if not $existing }}
{{- $token := randAlphaNum 48 -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authToken.secretRef.name }}
  labels:
    {{- include "redis-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{ .Values.authToken.secretRef.key }}: {{ $token | quote }}
  connection_string: {{ printf "redis://:%s@%s:6379" $token (include "redis-stack.fullname" .) | quote }}
{{- end }}
{{- end }}
