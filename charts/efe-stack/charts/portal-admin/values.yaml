# Portal-admin sub-chart, default DISABLED until Sprint C ships the Next.js code.

enabled: false
replicas: 3

# Round-5 DT-OPS-20 fix : PDB enabled by default since replicas=3
# tolerates losing 1 pod ; tune minAvailable=2 if business requires
# strict 2/3 quorum during node maintenance.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: portal-admin
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 3000

ingress:
  enabled: true
  className: nginx
  host: ""
  tls:
    enabled: true
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt-prod

sso:
  issuer: ""
  clientId: efe-portal
  clientSecretRef:
    name: efe-portal-sso
    key: client-secret

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

global:
  imageRegistry: ghcr.io/efe-ai
  imagePullSecrets: []
  domain: efe.example.com
  tenant: ""
