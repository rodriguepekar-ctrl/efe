{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "portal-admin.fullname" . }}
  labels:
    {{- include "portal-admin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort | default 3000 }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "portal-admin.selectorLabels" . | nindent 4 }}
{{- end }}
