{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efe-pii.fullname" . }}
  labels:
    {{- include "efe-pii.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.presidio.replicas }}
  selector:
    matchLabels:
      {{- include "efe-pii.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "efe-pii.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.presidio.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: presidio
          image: "{{ .Values.presidio.image.repository }}:{{ .Values.presidio.image.tag }}"
          imagePullPolicy: {{ .Values.presidio.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.presidio.service.port }}
              protocol: TCP
          env:
            - name: ANALYZER_LANGUAGES
              value: {{ join "," .Values.presidio.languages | quote }}
            - name: PORT
              value: {{ .Values.presidio.service.port | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.presidio.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Presidio model cache needs writable /tmp
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-pii.fullname" . }}
  labels:
    {{- include "efe-pii.labels" . | nindent 4 }}
spec:
  type: {{ .Values.presidio.service.type }}
  ports:
    - name: http
      port: {{ .Values.presidio.service.port }}
      targetPort: http
      appProtocol: http
  selector:
    {{- include "efe-pii.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if and .Values.enabled .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-pii.fullname" . }}
  labels:
    {{- include "efe-pii.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "efe-pii.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.upstreamNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.presidio.service.port }}
  egress:
    # DNS only — Presidio does not reach out.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
