{{- if and .Values.enabled .Values.crons.rollupHour.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "efe-stripe.fullname" . }}-rollup-hour
  labels:
    {{- include "efe-stripe.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.crons.rollupHour.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "efe-stripe.selectorLabels" . | nindent 12 }}
            component: rollup-hour
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rollup
              image: "{{ .Values.crons.rollupHour.image.repository }}:{{ .Values.crons.rollupHour.image.tag }}"
              imagePullPolicy: IfNotPresent
              args: ["--period", "hour"]
              env:
                - name: EFE_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: efe-region-config
                      key: region
{{- end }}
