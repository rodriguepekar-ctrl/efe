enabled: false

# Stripe webhook receiver Deployment.
receiver:
  replicas: 2
  image:
    repository: efe-ai/efe-stripe-receiver
    tag: "2.6.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8080
  # The webhook is exposed via the Cloudflare-fronted ingress at
  # https://api.efe.ai/v1/billing/webhook . Cloudflare's IP allow-list
  # only forwards Stripe's published webhook IPs.
  ingress:
    enabled: true
    path: /v1/billing/webhook
    tls:
      enabled: true
      secretName: efe-stripe-tls

# Cron jobs.
crons:
  rollupHour:
    enabled: true
    schedule: "5 * * * *"     # 5 min past every hour
    image:
      repository: efe-ai/efe-stripe-rollup
      tag: "2.6.0"
  rollupDay:
    enabled: true
    schedule: "30 0 * * *"    # 00:30 UTC
    image:
      repository: efe-ai/efe-stripe-rollup
      tag: "2.6.0"
  invoicer:
    enabled: true
    schedule: "0 4 1 * *"     # 04:00 UTC, 1st of each month
    image:
      repository: efe-ai/efe-stripe-invoicer
      tag: "2.6.0"
  reconciler:
    enabled: true
    schedule: "0 */6 * * *"   # every 6h
    image:
      repository: efe-ai/efe-stripe-reconciler
      tag: "2.6.0"

# Stripe API key + signing secret. Stored in a K8s secret managed by
# external-secrets (AWS Secrets Manager backend).
secrets:
  name: efe-stripe-secrets
  apiKey:
    secretKey: api_key          # value is `sk_live_...` or `sk_test_...`
  signingSecret:
    secretKey: signing_secret   # value is `whsec_...`
  returnUrlBase:
    secretKey: portal_return_url

# Network policy.
networkPolicy:
  enabled: true
  upstreamNamespace: efe-system
  prometheusNamespace: monitoring
  cloudflareIpsSecretName: cloudflare-ips   # ConfigMap injected by external-secrets

# Service monitor.
serviceMonitor:
  enabled: true
  interval: 30s
