enabled: false

# Snapshot CronJob — serializes the index to S3 every 6 h.
snapshotCron:
  enabled: true
  schedule: "15 */6 * * *"
  image:
    repository: efe-ai/efe-vector-snapshotter
    tag: "2.7.0"
    pullPolicy: IfNotPresent

# Replay Job — one-shot, fired by an operator after a pod-restart
# to rebuild collections from the latest snapshot.
replayJob:
  enabled: true
  image:
    repository: efe-ai/efe-vector-replayer
    tag: "2.7.0"

# pgvector init container — optional, for tenants who chose the
# pgvector backend instead of the in-process HNSW one.
pgvector:
  enabled: false
  version: "0.7.4"

# S3 bucket holding snapshots.
snapshotBucket:
  name: efe-vector-snapshots
  region: eu-west-1
  prefix: vector

# Resource budget.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 4Gi

networkPolicy:
  enabled: true
  upstreamNamespace: efe-system
  prometheusNamespace: monitoring

serviceMonitor:
  enabled: true
  interval: 30s
