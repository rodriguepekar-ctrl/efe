{{- if and .Values.enabled .Values.snapshotCron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "efe-vector.fullname" . }}-snapshot
  labels:
    {{- include "efe-vector.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.snapshotCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 12   # last 3 days at 6h cadence
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "efe-vector.selectorLabels" . | nindent 12 }}
            component: snapshot
        spec:
          restartPolicy: OnFailure
          containers:
            - name: snapshotter
              image: "{{ .Values.snapshotCron.image.repository }}:{{ .Values.snapshotCron.image.tag }}"
              imagePullPolicy: {{ .Values.snapshotCron.image.pullPolicy }}
              args:
                - "--bucket={{ .Values.snapshotBucket.name }}"
                - "--region={{ .Values.snapshotBucket.region }}"
                - "--prefix={{ .Values.snapshotBucket.prefix }}"
              env:
                - name: EFE_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: efe-region-config
                      key: region
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
{{- end }}
{{- if and .Values.enabled .Values.replayJob.enabled }}
---
# The replay job is templated but NOT scheduled — operators fire it
# manually via `kubectl create job --from=...`.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "efe-vector.fullname" . }}-replay-template
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
  labels:
    {{- include "efe-vector.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        {{- include "efe-vector.selectorLabels" . | nindent 8 }}
        component: replay-template
    spec:
      restartPolicy: OnFailure
      containers:
        - name: replayer
          image: "{{ .Values.replayJob.image.repository }}:{{ .Values.replayJob.image.tag }}"
          args: ["--noop"]   # template only — real replays override via env
{{- end }}
