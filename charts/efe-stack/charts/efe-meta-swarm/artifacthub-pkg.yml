# Recommended dependencies (operator hints).  Not Helm dependencies ;
# just informational.
recommendations:
  - url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
  - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager

# Pre-flight install commands (visible in ArtifactHub UI).
install: |
  # Install dependencies first :
  helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  helm repo add jetstack https://charts.jetstack.io
  helm install prom prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace
  helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true

  # Install the meta-swarm sub-chart (umbrella) :
  helm install efe ./charts/efe-stack \
    --namespace efe --create-namespace \
    --set efe-meta-swarm.enabled=true \
    --set efe-meta-swarm.image.tag=0.3.0 \
    --set global.metaSwarm.enabled=true \
    -f charts/efe-stack/charts/efe-meta-swarm/examples/values-prod.yaml
