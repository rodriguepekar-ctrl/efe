version: "0.2.0"
name: efe-meta-swarm
displayName: EFE Phase-2 meta-swarm controller + N participants
createdAt: "2026-05-14T00:00:00Z"
description: |
  Production-grade Helm sub-chart for the EFE meta-swarm controller + N participants
  (joint contractive iteration workhorse, Phase 2).  Ships with multi-environment
  values flavors (dev / staging / prod / canary), Helm pre/post-upgrade hooks
  (manifest snapshot + SIGHUP-all), Prometheus alerts, Grafana dashboard,
  controller PriorityClass, bundle weight-loader sidecar placeholder, and
  cert-manager TLS bootstrap stubs.

homeURL: https://efe.example.com/meta-swarm

logoURL: https://efe.example.com/static/meta-swarm.png

