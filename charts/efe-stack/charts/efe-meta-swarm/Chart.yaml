apiVersion: v2
name: efe-meta-swarm
description: |
  EFE Phase-2 meta-swarm — controller + N participants for the
  joint contractive iteration workhorse (Phase-1 `MetaSwarm::iterate`
  packaged for production).  Disabled by default ; flip
  `enabled: true` in `efe-meta-swarm:` of the umbrella values.yaml
  to bring up 1 controller + 3 participants (Kovant scenario).

  PR #16 (this version) layers : production-grade mutual TLS with
  cert-manager wiring, rustls-backed runtime, inotify-driven
  zero-downtime cert rotation, strict SAN verification, TLS 1.3-only
  default, ECDSA-P256 keys, 4 new Prometheus metrics + 3 alerts, a
  wait-for-Certificate pre-install Helm hook, and a values schema
  that gates algorithm × size cross-product.  Backward-compatible
  with PR #14 (TLS off by default).

  PR #14 layers : multi-env values flavors, Helm pre/post-upgrade
  hooks (snapshot + SIGHUP-all), 6 Prometheus alerts, Grafana
  dashboard, controller PriorityClass, bundle weight-loader sidecar
  placeholder, cert-manager TLS stubs.
type: application
version: 0.6.0
appVersion: "0.6.1"
kubeVersion: ">=1.28.0-0"
home: https://efe.example.com/meta-swarm
