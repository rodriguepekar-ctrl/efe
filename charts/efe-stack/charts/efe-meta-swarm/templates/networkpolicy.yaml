{{- if and .Values.enabled .Values.networkPolicy.enabled }}
---
# Default-deny ingress + egress on every meta-swarm pod.  Specific
# allow-lists below explicitly permit the legitimate traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-deny-all
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "efe-meta-swarm.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
# Allow efe-server → controller (gRPC) + Prometheus → metrics ports
# on the controller.  PR #13 also allows the helm-test probe Pod
# (label `app.kubernetes.io/component: test`) to reach the gRPC
# port so `helm test` succeeds under deny-by-default NetworkPolicy
# enforcement (was a silent failure mode in the initial PR #13 draft).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-meta-swarm.controllerName" . }}-allow-ingress
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  podSelector:
    matchLabels:
      {{- include "efe-meta-swarm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    - from:
        # efe-server pods in the configured namespace selector
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: efe-server
        # helm-test Pod (same chart's selectorLabels + component=test).
        # The test Pod lives in the same namespace as the controller,
        # so the namespaceSelector is implicit (same-namespace pods).
        - podSelector:
            matchLabels:
              {{- include "efe-meta-swarm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
      ports:
        - protocol: TCP
          port: {{ .Values.controller.service.grpcPort }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.prometheusNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.controller.service.metricsPort }}
---
# Allow the helm-test Pod (component=test) egress to controller +
# DNS — so `helm test` probes can reach the controller under
# deny-by-default NetworkPolicy.  Without this, the test Pod's
# egress is denied by the deny-all rule above.
{{- if .Values.tests.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-test-egress
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
spec:
  podSelector:
    matchLabels:
      {{- include "efe-meta-swarm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: test
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "efe-meta-swarm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.controller.service.grpcPort }}
    # DNS lookups for the controller's Service FQDN.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
---
# Allow controller → participants (gRPC fan-out) + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-controller-egress
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  podSelector:
    matchLabels:
      {{- include "efe-meta-swarm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "efe-meta-swarm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: participant
      ports:
        {{- range $p := .Values.participants }}
        - protocol: TCP
          port: {{ $p.service.grpcPort }}
        {{- end }}
    # Allow DNS lookups (kube-dns lives in kube-system by convention).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow participants ingress from controller + Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-participants-allow-ingress
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: participant
spec:
  podSelector:
    matchLabels:
      {{- include "efe-meta-swarm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: participant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "efe-meta-swarm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        {{- range $p := .Values.participants }}
        - protocol: TCP
          port: {{ $p.service.grpcPort }}
        {{- end }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.prometheusNamespaceSelector | nindent 12 }}
      ports:
        {{- range $p := .Values.participants }}
        - protocol: TCP
          port: {{ $p.service.metricsPort }}
        {{- end }}
{{- end }}

{{- /*
  PR #14 (§ 17) — additional NetworkPolicies for the Helm hook Jobs
  + bundle sidecar (egress allow under deny-by-default).
*/}}
{{- if and .Values.enabled .Values.networkPolicy.enabled .Values.hooks.enabled }}
---
# Hook Job egress : K8s API server + DNS.  Without this rule, the
# pre-upgrade-snapshot + post-upgrade-sighup Jobs are blocked by
# the deny-all baseline.
#
# PR #14 audit pass — the K8s API server is reached via the
# `kubernetes` Service in the `default` namespace, but the Service's
# ClusterIP is on the service CIDR and is NOT a pod IP.  A
# `namespaceSelector: default` only matches pods in that namespace ;
# it does NOT match the API server ClusterIP.  Result : hooks were
# silently blocked the moment networkPolicy + hooks were both
# enabled (e.g. the kovant-prod scenario).  Fix : `ipBlock`-based
# egress to any non-link-local IPv4 on port 443.  Operators wanting
# to restrict further should override `networkPolicy.hookEgressCidrs`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-hook-egress
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: hook
spec:
  podSelector:
    matchLabels:
      {{- include "efe-meta-swarm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hook
  policyTypes: [Egress]
  egress:
    # K8s API server (Service ClusterIP, not a pod IP — namespaceSelector
    # does NOT match it).  Default allows any non-link-local IP ; tighten
    # via `networkPolicy.hookEgressCidrs` for cluster-specific lockdown.
    - to:
        {{- range .Values.networkPolicy.hookEgressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
            except:
              - 169.254.0.0/16        # link-local (IMDS, kube-proxy)
              - 169.254.169.254/32    # cloud metadata
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- if and .Values.enabled .Values.networkPolicy.enabled .Values.bundle.sidecar.enabled }}
---
# Bundle sidecar egress to the configured bundle endpoint.  When the
# sidecar is on `pause:3.9` (Phase 2) this is a no-op ; PR #15 wires
# the real polling logic that consumes this allow rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-bundle-egress
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: participant
spec:
  podSelector:
    matchLabels:
      {{- include "efe-meta-swarm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: participant
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.bundle.endpointNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.bundle.endpointPort | default 443 }}
{{- end }}
