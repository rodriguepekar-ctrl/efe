{{- /*
PR #16 § 21 — 3 PrometheusRule alerts for the TLS subsystem.

| Alert                               | Severity | Cause                                |
| ----------------------------------- | -------- | ------------------------------------ |
| MetaSwarmTlsCertExpiringSoon        | warning  | cert-manager rotation stuck          |
| MetaSwarmTlsHandshakeFailureRate    | critical | chain mismatch / SAN drift / replay  |
| MetaSwarmTlsRotationStuck           | warning  | no successful reload in N hours      |

Renders ONLY when both `alerts.enabled=true` AND `tls.enabled=true` ;
turning either off makes the rule disappear cleanly.
*/ -}}
{{- if and .Values.enabled .Values.alerts.enabled .Values.tls.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-tls
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    prometheus: efe
spec:
  groups:
    - name: efe-meta-swarm.tls
      interval: 60s
      rules:
        - alert: MetaSwarmTlsCertExpiringSoon
          expr: |
            min(efe_meta_swarm_tls_cert_expiry_seconds) by (cert_name)
              < {{ .Values.tls.rotation.alertExpiringHours }} * 3600
          for: 5m
          labels:
            severity: warning
            component: meta-swarm
          annotations:
            summary: "TLS cert {{`{{ $labels.cert_name }}`}} expiring < {{ .Values.tls.rotation.alertExpiringHours }}h"
            description: |
              cert-manager should have rotated this cert 7 days
              before expiry (`renewBefore: 168h`).  If this alert
              fires, cert-manager may be stuck.  Investigate :
              `kubectl describe certificate {{`{{ $labels.cert_name }}`}} -n {{ .Release.Namespace }}`.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#tls-cert-expiring"

        - alert: MetaSwarmTlsHandshakeFailureRate
          expr: |
            (
              sum(rate(efe_meta_swarm_tls_handshake_total{result="fail"}[5m])) by (role)
              /
              sum(rate(efe_meta_swarm_tls_handshake_total[5m])) by (role)
            ) > {{ .Values.tls.rotation.alertHandshakeFailurePct }} / 100
          for: 5m
          labels:
            severity: critical
            component: meta-swarm
          annotations:
            summary: "TLS handshake failure rate > {{ .Values.tls.rotation.alertHandshakeFailurePct }}% on {{`{{ $labels.role }}`}}"
            description: |
              Likely causes : cert chain mismatch, CA stale, SAN
              mismatch, protocol downgrade attempt.  Drill down via
              the failure_reason label :
              `sum by (failure_reason) (rate(efe_meta_swarm_tls_handshake_total{result="fail"}[5m]))`.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#tls-handshake-failure"

        - alert: MetaSwarmTlsRotationStuck
          expr: |
            (time() - max(efe_meta_swarm_tls_reload_at_seconds))
              > {{ .Values.tls.rotation.alertStuckHours }} * 3600
          for: 1h
          labels:
            severity: warning
            component: meta-swarm
          annotations:
            summary: "TLS cert rotation stuck (no reload in {{ .Values.tls.rotation.alertStuckHours }}h)"
            description: |
              cert-manager should rotate every 23 days (30d duration
              − 7d renewBefore).  If we haven't seen a successful
              reload in {{ .Values.tls.rotation.alertStuckHours }}h,
              cert-manager is broken or the inotify watcher is
              wedged.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#tls-rotation-stuck"
{{- end }}
