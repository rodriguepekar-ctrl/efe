{{- /*
PR #17 § 20 — 5 PrometheusRule alerts derived from the 14 new
operational metrics.

| Alert                              | Severity | Cause                                |
| ---------------------------------- | -------- | ------------------------------------ |
| MetaSwarmIterateDurationP99High    | warning  | p99 Iterate latency > SLO budget     |
| MetaSwarmIterateErrorRateHigh      | critical | > 0.1 % Iterate calls failing        |
| MetaSwarmStepErrorRateHigh         | warning  | per-participant Step error rate high |
| MetaSwarmParticipantDown           | critical | participant_up gauge == 0            |
| MetaSwarmSafetyViolationsSpike     | warning  | safety violation rate-per-second high|

Renders ONLY when both `alerts.enabled=true` AND the parent sub-chart
is `enabled=true`.  Sister to the PR #16 TLS rule + the PR #14 reload
rule ; coexists peacefully.
*/ -}}
{{- if and .Values.enabled .Values.alerts.enabled }}
{{- $t := .Values.alerts.thresholds | default dict -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-operational
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    prometheus: efe
spec:
  groups:
    - name: efe-meta-swarm.operational
      interval: 60s
      rules:
        - alert: MetaSwarmIterateDurationP99High
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(efe_meta_swarm_iterate_duration_seconds_bucket[5m])))
              > {{ $t.iterateP99HighSeconds | default 5.0 }}
          for: 5m
          labels:
            severity: warning
            component: meta-swarm
          annotations:
            summary: "Iterate p99 latency > {{ $t.iterateP99HighSeconds | default 5.0 }}s"
            description: |
              99-th percentile end-to-end Iterate latency is above the
              SLO budget.  Drill in via the `result` label to see if
              failures are dominating :
              `sum(rate(efe_meta_swarm_iterate_total{result!="ok"}[5m]))
               / sum(rate(efe_meta_swarm_iterate_total[5m]))`.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#iterate-p99-high"

        - alert: MetaSwarmIterateErrorRateHigh
          expr: |
            (
              sum(rate(efe_meta_swarm_iterate_total{result="error"}[5m]))
              /
              sum(rate(efe_meta_swarm_iterate_total[5m]))
            ) > {{ $t.iterateErrorRatePct | default 0.1 }} / 100
          for: 5m
          labels:
            severity: critical
            component: meta-swarm
          annotations:
            summary: "Iterate error rate > {{ $t.iterateErrorRatePct | default 0.1 }}%"
            description: |
              Operators chasing the dominant failure_reason :
              `sum by (failure_reason) (rate(efe_meta_swarm_iterate_total{result="error"}[5m]))`.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#iterate-error-rate"

        - alert: MetaSwarmStepErrorRateHigh
          expr: |
            (
              sum by (participant_id) (rate(efe_meta_swarm_step_total{result="error"}[5m]))
              /
              sum by (participant_id) (rate(efe_meta_swarm_step_total[5m]))
            ) > {{ $t.stepErrorRatePct | default 0.5 }} / 100
          for: 5m
          labels:
            severity: warning
            component: meta-swarm
          annotations:
            summary: "Step error rate > {{ $t.stepErrorRatePct | default 0.5 }}% on {{`{{ $labels.participant_id }}`}}"
            description: |
              Per-participant Step error rate above budget.  Likely
              causes : dim mismatch, participant restart, manifest
              drift.  Inspect the failure_reason breakdown :
              `sum by (failure_reason) (rate(efe_meta_swarm_step_total{result="error", participant_id="{{`{{ $labels.participant_id }}`}}"}[5m]))`.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#step-error-rate"

        - alert: MetaSwarmParticipantDown
          expr: |
            min by (participant_id) (efe_meta_swarm_participant_up) == 0
          for: 1m
          labels:
            severity: critical
            component: meta-swarm
          annotations:
            summary: "Participant {{`{{ $labels.participant_id }}`}} down (up=0)"
            description: |
              The controller's `participant_up` gauge for this
              participant has been 0 for at least 1 minute.  Check
              the participant Pod status :
              `kubectl get pod -l app.kubernetes.io/component=participant -l efe.io/participant-id={{`{{ $labels.participant_id }}`}}`.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#participant-down"

        - alert: MetaSwarmSafetyViolationsSpike
          expr: |
            sum by (kind, participant_id) (rate(efe_meta_swarm_safety_violations_total[1m]))
              > {{ $t.safetyViolationRatePerS | default 0.01 }}
          for: 1m
          labels:
            severity: warning
            component: meta-swarm
          annotations:
            summary: "Safety violation rate > {{ $t.safetyViolationRatePerS | default 0.01 }}/s ({{`{{ $labels.kind }}`}}, {{`{{ $labels.participant_id }}`}})"
            description: |
              Phase-2's contractive algorithm should produce ≈ 0
              violations.  A spike indicates either a manifest
              misconfig (radius/poly constraint too tight) or an
              algorithmic regression.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#safety-violations-spike"
{{- end }}
