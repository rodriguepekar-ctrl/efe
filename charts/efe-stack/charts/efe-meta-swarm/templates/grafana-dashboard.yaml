{{- if and .Values.enabled .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-dashboard
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    # PR #14 AD11 — Grafana sidecar auto-import marker.  Works with
    # `kube-prometheus-stack`'s default Grafana sidecar without a
    # `Dashboard` CR.
    grafana_dashboard: "1"
  annotations:
    # AD30 — folder hint for the auto-imported dashboard.
    grafana_folder: "efe-meta-swarm"
data:
  efe-meta-swarm.json: |-
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
{{- end }}
