{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-meta-swarm.controllerName" . }}
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
    efe.io/meta-swarm-role: controller
spec:
  type: {{ .Values.controller.service.type | default "ClusterIP" }}
  ports:
    - name: grpc
      port: {{ .Values.controller.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      appProtocol: {{ .Values.controller.service.appProtocol | default "grpc" | quote }}
    - name: metrics
      port: {{ .Values.controller.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "efe-meta-swarm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
{{- end }}
