{{- /*
PR #16 § 13.3 — ClusterIssuer variant of the cert-manager Issuer.
Renders ONLY when `tls.certManager.clusterIssuer=true` ; otherwise
the namespace-scoped Issuer in tls-issuer.yaml is used instead.

Use case : cross-namespace deploys where multiple EFE installs share
a single org-wide CA Secret stored in a different namespace.
*/ -}}
{{- if and .Values.enabled .Values.tls.enabled .Values.tls.certManager.enabled .Values.tls.certManager.clusterIssuer }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-issuer
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.tls.certManager.issuerType "selfSigned" }}
  selfSigned: {}
  {{- else if eq .Values.tls.certManager.issuerType "ca" }}
  ca:
    secretName: {{ required "tls.certManager.caSecretName must be set when issuerType=ca" .Values.tls.certManager.caSecretName }}
  {{- else }}
  {{- fail (printf "efe-meta-swarm: tls.certManager.issuerType=%q is not supported (use selfSigned or ca)" .Values.tls.certManager.issuerType) }}
  {{- end }}
{{- end }}
