{{- /*
PR #19 § 33 — Alertmanager routing additions.

This template renders a ConfigMap (NOT a full Alertmanager
config Secret — that lives in the kube-prometheus-stack chart).
The cluster Alertmanager chart consumes this ConfigMap via the
`alertmanager.alertmanagerSpec.alertmanagerConfigSelector` label
selector + the `AlertmanagerConfig` CRD pattern.

Two render modes :
  - `mode: alertmanagerconfig` (recommended)  ⇒ emits an
    AlertmanagerConfig CRD scoped to the meta-swarm namespace.
    kube-prometheus-stack merges it via namespace selector.
  - `mode: raw-fragment`                      ⇒ emits a plain
    ConfigMap operators can post-render into their cluster-
    wide Alertmanager Secret.

Rendering gate :
  `.Values.enabled`
  `.Values.alerts.enabled`
  `.Values.alerts.pr19.enabled`               — PR #19 alert pack must exist
  `.Values.alerts.pr19.alertmanager.enabled`  (default true)

Audit-pass : without `.Values.alerts.pr19.enabled` in the guard, an
operator setting `pr19.enabled=false` + `pr19.alertmanager.enabled=true`
would produce an AlertmanagerConfig that routes alerts which never
fire (because the PrometheusRule wasn't rendered).
*/ -}}
{{- if and .Values.enabled .Values.alerts.enabled .Values.alerts.pr19.enabled .Values.alerts.pr19.alertmanager.enabled }}
{{- $am  := .Values.alerts.pr19.alertmanager -}}
{{- $mode := $am.mode | default "alertmanagerconfig" -}}
{{- if eq $mode "alertmanagerconfig" }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-pr19
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    # kube-prometheus-stack default selector
    alertmanagerConfig: {{ $am.selectorLabel | default "efe" | quote }}
    efe.pr: "19"
spec:
  # AD29 — 3-branch fan-out : critical → page, warning → ticket,
  #         info / default → log-only.  AD30 + AD31 enforce
  #         inhibition + compliance audit fork.
  route:
    groupBy: ['alertname', 'cluster', 'env']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    receiver: meta-swarm-sre-ticket
    matchers:
      - { name: service, value: meta-swarm }
    routes:
      # 1. Critical → PagerDuty
      - matchers:
          - { name: service,  value: meta-swarm }
          - { name: severity, value: critical }
        receiver: meta-swarm-sre-page
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h
        # SLO burn-rate sub-route — even tighter cadence
        routes:
          - matchers:
              - { name: slo_id, value: iterate-availability }
            receiver: meta-swarm-sre-page
            groupWait: 10s
            repeatInterval: 1h
        continue: true
      # 2. Warning → Slack ticket
      - matchers:
          - { name: service,  value: meta-swarm }
          - { name: severity, value: warning }
        receiver: meta-swarm-sre-ticket
        continue: true
      # 3. Audit fork — every meta-swarm alert (regardless of severity)
      - matchers:
          - { name: service, value: meta-swarm }
        receiver: compliance-audit-loki

  # AD30 — inhibition rules
  inhibitRules:
    - sourceMatch:
        - { name: alertname, value: ControllerNotServing }
        - { name: severity,  value: critical }
      targetMatch:
        - { name: service, value: meta-swarm }
      equal: [cluster, env]
    - sourceMatch:
        - { name: alertname, value: SLOBudgetBurnFast14x }
        - { name: severity,  value: critical }
      targetMatch:
        - { name: alertname, value: IterateFailureRateHigh }
      equal: [cluster, env, service]
    - sourceMatch:
        - { name: alertname, value: SLOBudgetBurnSlow6x }
        - { name: severity,  value: warning }
      targetMatch:
        - { name: alertname, value: IterateFailureRateHigh }
        - { name: severity,  value: warning }
      equal: [cluster, env, service]

    # PR #18 ↔ PR #19 overlap : when A6 OTelExporterFailing fires
    # (PR #19 threshold = 10 % drop), it inhibits the lower-threshold
    # MetaSwarmOtelDropRateHigh (PR #18, 1 %).  Both alerts on the
    # same root cause → operator gets ONE alert at the more severe
    # threshold. Audit-pass G7 fix.
    - sourceMatch:
        - { name: alertname, value: OTelExporterFailing }
      targetMatch:
        - { name: alertname, value: MetaSwarmOtelDropRateHigh }
      equal: [cluster, env]

  receivers:
    - name: meta-swarm-sre-page
      pagerdutyConfigs:
        - sendResolved: true
          routingKey:
            name: {{ $am.pagerduty.secretName | default "alertmanager-pagerduty-meta-swarm" | quote }}
            key:  {{ $am.pagerduty.routingKeyKey | default "routing-key" | quote }}
          description: '{{`{{ template "pagerduty.default.description" . }}`}}'
          details:
            - key: runbook
              value: '{{`{{ .CommonAnnotations.runbook_url }}`}}'
            - key: dashboard
              value: '{{`{{ .CommonAnnotations.dashboard_url }}`}}'
            - key: severity
              value: '{{`{{ .CommonLabels.severity }}`}}'

    - name: meta-swarm-sre-ticket
      slackConfigs:
        - sendResolved: true
          apiURL:
            name: {{ $am.slack.secretName | default "alertmanager-slack-meta-swarm" | quote }}
            key:  {{ $am.slack.urlKey      | default "webhook-url"                | quote }}
          channel: {{ $am.slack.channel    | default "#meta-swarm-alerts"         | quote }}
          title: '[{{`{{ .Status | toUpper }}`}}] {{`{{ .CommonLabels.alertname }}`}}'
          text: |
            *Summary*: {{`{{ .CommonAnnotations.summary }}`}}
            *Description*: {{`{{ .CommonAnnotations.description }}`}}
            *Runbook*: <{{`{{ .CommonAnnotations.runbook_url }}`}}|Open>
            *Dashboard*: <{{`{{ .CommonAnnotations.dashboard_url }}`}}|Open>

    - name: compliance-audit-loki
      webhookConfigs:
        - sendResolved: true
          url: {{ $am.audit.lokiUrl | default "http://loki-gateway.monitoring.svc:3100/audit/alerts" | quote }}
{{- else }}
# mode: raw-fragment — post-renderer-friendly snippet
# (Operators paste this into their cluster Alertmanager config Secret.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-pr19-am-fragment
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    efe.pr: "19"
    efe.alertmanager.fragment: "true"
data:
  routing.yaml: |-
    # Raw Alertmanager routing fragment (paste into cluster Secret).
    # See `alertmanagerconfig` mode for the CRD-driven version.
    route:
      group_by: ['alertname', 'cluster', 'env']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: cluster-default
      routes:
        - match: {service: meta-swarm, severity: critical}
          receiver: meta-swarm-sre-page
          continue: true
          group_wait: 30s
          repeat_interval: 4h
        - match: {service: meta-swarm, severity: warning}
          receiver: meta-swarm-sre-ticket
          continue: true
        - match: {service: meta-swarm}
          receiver: compliance-audit-loki
{{- end }}
{{- end }}
