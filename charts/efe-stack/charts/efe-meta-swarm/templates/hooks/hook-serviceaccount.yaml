{{- if and .Values.enabled .Values.hooks.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "efe-meta-swarm.hookServiceAccountName" . }}
  labels:
    {{- include "efe-meta-swarm.hookLabels" . | nindent 4 }}
  annotations:
    # Created earlier than the snapshot/sighup Jobs so they have a
    # subject to bind to.  Helm orders within a phase by weight.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: true
{{- end }}
