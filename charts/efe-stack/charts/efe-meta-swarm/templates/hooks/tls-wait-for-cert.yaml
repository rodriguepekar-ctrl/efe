{{- /*
PR #16 § 12 — wait-for-Certificate Helm hook.

Runs at weight -5 (pre-install + pre-upgrade) so it executes AFTER
the hook SA / Role / RoleBinding (-20 / -19 / -18) and the
pre-upgrade-snapshot Job (-10) but BEFORE the
controller / participant Deployments and the post-upgrade-sighup
hook (+10).

Purpose : poll `Certificate.status.conditions[?type=Ready].status` for
every controller + participant cert until they all flip to "True",
or fail the install / upgrade after `tls.waitForCertTimeoutSeconds`.

Without this hook, the first reconcile of the runtime Deployments
references a `Secret/<name>-tls` that doesn't yet exist
(cert-manager has not yet finished issuing).  Pods crashloop until
cert-manager catches up, leaking customer-visible "stuck install"
slowness.  This Job collapses that delay onto a single deterministic
wait at install time.
*/ -}}
{{- if and .Values.enabled .Values.tls.enabled .Values.tls.certManager.enabled .Values.hooks.enabled }}
{{- $timeout := .Values.tls.waitForCertTimeoutSeconds | default 300 | int -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "efe-meta-swarm.hookName" (list . "tls-wait-cert") }}
  labels:
    {{- include "efe-meta-swarm.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "efe-meta-swarm.hookLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "efe-meta-swarm.hookServiceAccountName" . }}
      # PR #14 — hook pods need K8s API access ; SA token mounted on
      # the hook Job pods, not on runtime pods.
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        {{- include "efe-meta-swarm.commonPodSecurityContext" . | nindent 8 }}
      containers:
        - name: wait-cert
          image: {{ .Values.hooks.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "efe-meta-swarm.commonContainerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits:   {cpu: 100m, memory: 128Mi}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TIMEOUT_S
              value: {{ $timeout | quote }}
            - name: CERTS
              value: >-
                {{ include "efe-meta-swarm.controllerTlsSecretName" . }}
                {{- range $p := .Values.participants }}
                {{ include "efe-meta-swarm.participantTlsSecretName" (list $ $p.id) }}
                {{- end }}
          # readOnlyRootFilesystem=true (from commonContainerSecurityContext)
          # is fine here — we don't write to disk.
          command:
            - sh
            - -c
            - |
              set -eu
              echo "── PR #16 wait-for-Certificate hook ──"
              echo "namespace=$NAMESPACE  certs=$CERTS  timeout=${TIMEOUT_S}s"
              deadline=$(( $(date +%s) + TIMEOUT_S ))
              for cert in $CERTS ; do
                until kubectl -n "$NAMESPACE" get certificate "$cert" \
                      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' \
                      2>/dev/null | grep -q True ; do
                  if [ "$(date +%s)" -ge "$deadline" ] ; then
                    echo "✗ timeout waiting for Certificate/$cert (${TIMEOUT_S}s)"
                    kubectl -n "$NAMESPACE" describe certificate "$cert" || true
                    exit 1
                  fi
                  echo "  waiting for Certificate/$cert ..."
                  sleep 5
                done
                echo "  ✓ Certificate/$cert Ready"
              done
              echo "✓ all Certificates Ready"
{{- end }}
