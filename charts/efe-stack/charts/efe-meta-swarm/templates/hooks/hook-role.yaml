{{- if and .Values.enabled .Values.hooks.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "efe-meta-swarm.hookServiceAccountName" . }}
  labels:
    {{- include "efe-meta-swarm.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-19"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # ─── pre-upgrade-snapshot Job ────────────────────────────────
  # Read live ConfigMap, create + update backup ConfigMaps,
  # annotate the live ConfigMap with the next backup index.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]

  # ─── post-upgrade-sighup Job ─────────────────────────────────
  # Discover the Deployments via labels, wait for rollout, exec the
  # SIGHUP signal in the controller + each participant pod.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # `kubectl rollout status` watches ReplicaSets too.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]

  # ─── PR #16 — tls-wait-for-cert Job ──────────────────────────
  # Polls `Certificate.status.conditions[?type=Ready].status`.  Read-
  # only — no create/update — to keep the blast radius minimal.
  {{- if .Values.tls.enabled }}
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list"]
  {{- end }}
{{- end }}
