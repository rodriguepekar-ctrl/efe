{{- if .Values.enabled }}
{{- range $p := .Values.participants }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efe-meta-swarm.participantName" (list $ $p.id) }}
  labels:
    {{- include "efe-meta-swarm.labels" $ | nindent 4 }}
    app.kubernetes.io/component: participant
    efe.io/meta-swarm-role: participant
    efe.io/participant-id: {{ $p.id | quote }}
spec:
  replicas: {{ $p.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "efe-meta-swarm.selectorLabels" $ | nindent 6 }}
      efe.io/participant-id: {{ $p.id | quote }}
  template:
    metadata:
      labels:
        {{- include "efe-meta-swarm.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: participant
        efe.io/meta-swarm-role: participant
        efe.io/participant-id: {{ $p.id | quote }}
      annotations:
        # PR #13 AD4 : NO `checksum/config`.
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $p.service.metricsPort }}"
        prometheus.io/path: "/metrics"
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "efe-meta-swarm.participantServiceAccountName" (list $ $p.id) }}
      automountServiceAccountToken: false
      # PR #13 hardening — see controller-deployment.yaml for rationale.
      enableServiceLinks: false
      # PR #14 (AD7) — when the bundle weight-loader sidecar is
      # enabled, the sidecar needs `/proc` visibility into the
      # participant container so it can `kill -HUP 1` after writing
      # new weights.  Without `shareProcessNamespace`, each container
      # has an isolated PID namespace.  T26 trust-boundary documented
      # in PR #14 architecture § 13.4.
      {{- if $.Values.bundle.sidecar.enabled }}
      shareProcessNamespace: true
      {{- end }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "efe-meta-swarm.commonPodSecurityContext" $ | nindent 8 }}
      containers:
        - name: participant
          image: {{ include "efe-meta-swarm.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["participant"]
          ports:
            - name: grpc
              containerPort: {{ $p.service.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $p.service.metricsPort }}
              protocol: TCP
          env:
            - name: EFE_META_SWARM_PARTICIPANT_ID
              value: {{ $p.id | quote }}
            - name: EFE_META_SWARM_PARTICIPANT_ADDR
              value: "0.0.0.0:{{ $p.service.grpcPort }}"
            - name: EFE_META_SWARM_PARTICIPANT_METRICS
              value: "0.0.0.0:{{ $p.service.metricsPort }}"
            - name: EFE_META_SWARM_MANIFEST
              value: /etc/efe-meta-swarm/manifest.yaml
            - name: EFE_META_SWARM_WORKER_THREADS
              value: "1"
            {{- if $.Values.tls.enabled }}
            # PR #14 — TLS env vars when cert-manager Certificate
            # is mounted at /etc/efe-meta-swarm/tls.  PR #16 wires
            # the binary's tonic-tls integration + mutual TLS.
            - name: EFE_META_SWARM_TLS_REQUIRED
              value: "true"
            - name: EFE_META_SWARM_TLS_CERT
              value: /etc/efe-meta-swarm/tls/tls.crt
            - name: EFE_META_SWARM_TLS_KEY
              value: /etc/efe-meta-swarm/tls/tls.key
            - name: EFE_META_SWARM_TLS_CA
              value: /etc/efe-meta-swarm/tls/ca.crt
            # PR #16 — mutual TLS knobs (AD8 / AD6 / AD11).
            # PR #14 audit pattern : `ternary` instead of `default`.
            - name: EFE_META_SWARM_TLS_MUTUAL
              value: {{ ternary "true" "false" ($.Values.tls.mutual | default false) | quote }}
            - name: EFE_META_SWARM_TLS_MIN_PROTOCOL
              value: {{ $.Values.tls.minProtocolVersion | default "1.3" | quote }}
            {{- if $.Values.tls.mutual }}
            # When `mutual: true`, the participant accepts ONLY the
            # controller's cert SAN (single-controller topology).
            # Pre-computed in `_helpers.tpl` for a clean quoted string.
            - name: EFE_META_SWARM_TLS_ALLOWED_PEER_SANS
              value: {{ include "efe-meta-swarm.participantAllowedControllerSans" $ | quote }}
            {{- end }}
            {{- end }}
            {{- if $.Values.tracing.otel.enabled }}
            # PR #18 § 25.2 — explicit OTEL_SERVICE_NAME for each
            # participant Deployment so traces are attributed to the
            # correct participant role.
            - name: OTEL_SERVICE_NAME
              value: "efe-meta-swarm-participant-{{ $p.id }}"
            - name: OTEL_RESOURCE_ATTRIBUTES_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(OTEL_RESOURCE_ATTRIBUTES_NS);k8s.pod.name=$(OTEL_RESOURCE_ATTRIBUTES_POD);k8s.node.name=$(OTEL_RESOURCE_ATTRIBUTES_NODE);meta_swarm.participant.id={{ $p.id }}"
            {{- end }}
            {{- with $p.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $.Values.tracing.otel.enabled }}
          # PR #18 § 25.2 — consume the otel-env ConfigMap.
          envFrom:
            - configMapRef:
                name: {{ include "efe-meta-swarm.fullname" $ }}-otel-env
          {{- end }}
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            {{- include "efe-meta-swarm.commonContainerSecurityContext" $ | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ $p.service.grpcPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ $p.service.grpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: manifest
              mountPath: /etc/efe-meta-swarm
              readOnly: true
            {{- if $.Values.bundle.sidecar.enabled }}
            # PR #14 — read-only mount of the shared weights volume
            # so the participant binary can re-read the bundle file on
            # SIGHUP without taking a write lock.  Sidecar has the RW
            # mount (below).
            - name: weights
              mountPath: /var/lib/efe-meta-swarm/weights
              readOnly: true
            {{- end }}
            {{- if $.Values.tls.enabled }}
            # PR #14 — TLS Secret from cert-manager Certificate.
            - name: tls
              mountPath: /etc/efe-meta-swarm/tls
              readOnly: true
            {{- end }}
        {{- if $.Values.bundle.sidecar.enabled }}
        # PR #14 — bundle weight-loader sidecar (AD7-AD9).  Phase-2
        # uses a `pause` placeholder ; PR #15 swaps for the real
        # polling binary.
        {{- include "efe-meta-swarm.sidecarContainer" (list $ $p) | nindent 8 }}
        {{- end }}
      volumes:
        - name: manifest
          configMap:
            name: {{ include "efe-meta-swarm.fullname" $ }}-manifest
        {{- if $.Values.bundle.sidecar.enabled }}
        # PR #14 — emptyDir tmpfs for bundle weights.  `medium: Memory`
        # avoids disk wear ; sizeLimit caps the volume.
        - name: weights
          emptyDir:
            medium: Memory
            sizeLimit: {{ $.Values.bundle.sidecar.weightsSizeLimit | default "256Mi" }}
        {{- end }}
        {{- if $.Values.tls.enabled }}
        # PR #14 audit pass — trunc-safe helper ; MUST match the
        # Certificate.spec.secretName in tls-certificate.yaml.
        - name: tls
          secret:
            secretName: {{ include "efe-meta-swarm.participantTlsSecretName" (list $ $p.id) }}
            optional: false
        {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
{{- end }}
{{- end }}
