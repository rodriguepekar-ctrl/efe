{{- /*
PR #18 § 25.4 — 3 PrometheusRule alerts for the OTel exporter
health surface.  Consumes the 3 metrics added by PR #18 :

| Alert                              | Severity | Cause                                |
| ---------------------------------- | -------- | ------------------------------------ |
| MetaSwarmOtelExporterDown          | warning  | no spans exported in 5m while traffic is flowing |
| MetaSwarmOtelDropRateHigh          | warning  | > 1 % of spans dropped                |
| MetaSwarmOtelSamplingDrift         | info     | observed sample rate ± 50 % from target |

Renders ONLY when `alerts.enabled=true` AND `tracing.otel.enabled=true`.
*/ -}}
{{- if and .Values.enabled .Values.alerts.enabled .Values.tracing.otel.enabled }}
{{- $sampler_arg := .Values.tracing.otel.samplerArg | default "0.01" -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "efe-meta-swarm.fullname" . }}-otel
  labels:
    {{- include "efe-meta-swarm.labels" . | nindent 4 }}
    prometheus: efe
spec:
  groups:
    - name: efe-meta-swarm.otel
      interval: 60s
      rules:
        - alert: MetaSwarmOtelExporterDown
          expr: |
            rate(efe_meta_swarm_otel_exported_spans_total[5m]) == 0
              and on() sum(rate(efe_meta_swarm_iterate_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
            component: meta-swarm
          annotations:
            summary: "OTel exporter silent while traffic is flowing"
            description: |
              The OpenTelemetry exporter has not exported a single
              span in the last 5 minutes while Iterate traffic is
              ongoing.  Likely : collector down / network partition.
              Inspect `efe_meta_swarm_otel_dropped_spans_total{reason}`
              for the dominant failure mode.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#otel-exporter-down"

        - alert: MetaSwarmOtelDropRateHigh
          expr: |
            (
              sum(rate(efe_meta_swarm_otel_dropped_spans_total[5m]))
              /
              clamp_min(sum(rate(efe_meta_swarm_otel_exported_spans_total[5m]))
                + sum(rate(efe_meta_swarm_otel_dropped_spans_total[5m])), 1)
            ) > 0.01
          for: 5m
          labels:
            severity: warning
            component: meta-swarm
          annotations:
            summary: "OTel drop rate > 1 % over 5 m"
            description: |
              The exporter is dropping > 1 % of spans.  Most common
              cause : sampling rate too high relative to collector
              capacity.  Inspect `dropped_spans_total{reason}` :
                queue_full → reduce samplerArg or scale up collector
                export_error → check collector connectivity / TLS
                timeout → collector overloaded
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#otel-drop-rate-high"

        - alert: MetaSwarmOtelSamplingDrift
          expr: |
            abs(
              (sum(rate(efe_meta_swarm_otel_exported_spans_total[5m]))
                / clamp_min(sum(rate(efe_meta_swarm_iterate_total[5m])), 1))
              - {{ $sampler_arg }}
            ) > {{ $sampler_arg }} * 0.5
          for: 30m
          labels:
            severity: info
            component: meta-swarm
          annotations:
            summary: "OTel observed sampling rate drifts > 50 % from target {{ $sampler_arg }}"
            description: |
              The ratio of exported spans to iterate calls is not
              within ± 50 % of the configured rate ({{ $sampler_arg }}).
              Either the `always_on_error` overlay is force-sampling
              many errors (in which case investigate the underlying
              error rate) OR the inner sampler is misconfigured.
            runbook_url: "{{ .Values.alerts.runbookBaseUrl }}#otel-sampling-drift"
{{- end }}
