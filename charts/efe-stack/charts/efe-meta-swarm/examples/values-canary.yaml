# efe-meta-swarm — CANARY flavor (alongside production).
# Small slice : 1 controller + 1 participant ; alternate tenant slug.
# Deploy as a SEPARATE Helm release (e.g. `helm install efe-stack-canary`)
# in the same namespace as the main release.
# Cf. `docs/EFE_A1_PHASE2_PR14_ARCHITECTURE.md` § 7.4.

enabled: true

image:
  tag: "0.3.1-canary"             # newer image than prod

global:
  tenant: kovant-canary           # distinguishing label

manifest:
  meta:
    dim: 16
    safety:
      kind: box
      radius: 50.0
  iteration:
    max_iters: 100
    tolerance: 1.0e-4
    alpha_default: 0.55            # slightly different α — the canary's reason for being
    coupling_gamma: 0.2
    deterministic: true
    max_wall_ms: 15000

controller:
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 1Gi}

# Single participant for the canary slice.
participants:
  - id: canary-scoring
    dim: 16
    kappa: 0.6
    seed: 11
    service: {grpcPort: 50091, metricsPort: 9101}
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits:   {cpu: 500m, memory: 512Mi}

networkPolicy:
  enabled: true
  # Different ingressNamespaceSelector — only efe-canary clients
  # can reach the canary controller.
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: efe-canary

metrics:
  serviceMonitor:
    enabled: true
    labels:
      prometheus: efe-canary      # routed to canary's Prometheus

alerts:
  enabled: true
  # Canary alerts at warning severity (don't page on-call for canary issues).
  severity:
    ReloadFailureRate: warning
    ReloadLatencyP99High: info
    ReloadingStuck: warning
    ControllerDown: warning
    ParticipantDown: info
    ReloadGenNotAdvancing: info

dashboard:
  enabled: true

hooks:
  enabled: true                   # canary still wants auto-reload
  postUpgrade:
    ignoreFailures: true          # canary : don't block upgrade on hook fail

bundle:
  sidecar:
    enabled: false

tls:
  enabled: false

priorityClass:
  enabled: false                  # canary doesn't deserve priority over prod
