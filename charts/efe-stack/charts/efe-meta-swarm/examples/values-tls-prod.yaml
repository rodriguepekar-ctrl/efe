# ─────────────────────────────────────────────────────────────────────
# values-tls-prod.yaml — production overlay with mutual TLS enabled.
#
# Use case : kovant-prod, kovant-canary post-W2 of M27.
#
# Usage :
#   helm upgrade tst ./charts/efe-stack \
#     -n efe \
#     -f charts/efe-stack/charts/efe-meta-swarm/examples/values-prod.yaml \
#     -f charts/efe-stack/charts/efe-meta-swarm/examples/values-tls-prod.yaml
#
# Reference : docs/EFE_A1_PHASE2_PR16_ARCHITECTURE.md § 28.1.
# ─────────────────────────────────────────────────────────────────────

efe-meta-swarm:
  enabled: true

  tls:
    enabled: true
    mutual: true                          # production target — full mTLS
    minProtocolVersion: "1.3"             # TLS 1.3-only (AD6)
    legacyRsa: false                      # ECDSA-P256 only
    additionalSans: []                    # extra DNS SANs if needed
    caBundleConfigMap: ""                 # plug in cross-cluster trust root here
    waitForCertTimeoutSeconds: 300

    certManager:
      enabled: true
      clusterIssuer: false                # namespace-scoped Issuer
      issuerType: ca                      # production : CA-signed (NOT selfSigned)
      caSecretName: "my-org-root-ca"      # operator must pre-create this Secret

      privateKey:
        algorithm: ECDSA
        size: 256
        rotationPolicy: Always

      duration: 720h                       # 30 days
      renewBefore: 168h                    # renew 7 days early

    rotation:
      alertExpiringHours: 168              # alert at 7-day mark
      alertStuckHours: 1080                # alert if no rotation in 45d
      alertHandshakeFailurePct: 1.0        # 1 % failure rate over 5 min

  # Production-grade alerts MUST be on.
  alerts:
    enabled: true
    runbookBaseUrl: "https://efe.example.com/runbook/meta-swarm"
