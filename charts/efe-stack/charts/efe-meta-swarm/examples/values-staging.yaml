# efe-meta-swarm — STAGING flavor (pre-prod cluster).
# Production-equivalent surface scaled down ; alerts + dashboard ON.
# Cf. `docs/EFE_A1_PHASE2_PR14_ARCHITECTURE.md` § 7.2.

enabled: true

image:
  tag: "0.3.0"

manifest:
  meta:
    dim: 16
    safety:
      kind: box
      radius: 50.0
  iteration:
    max_iters: 100
    tolerance: 1.0e-4
    alpha_default: 0.5
    coupling_gamma: 0.2
    deterministic: true
    max_wall_ms: 15000

controller:
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 2Gi}

participants:
  - id: supplier-scoring
    dim: 16
    kappa: 0.6
    seed: 11
    service: {grpcPort: 50091, metricsPort: 9101}
    resources:
      requests: {cpu: 300m, memory: 384Mi}
      limits:   {cpu: 1,    memory: 1Gi}
  - id: contract-risk
    dim: 16
    kappa: 0.7
    seed: 22
    service: {grpcPort: 50092, metricsPort: 9102}
    resources:
      requests: {cpu: 300m, memory: 384Mi}
      limits:   {cpu: 1,    memory: 1Gi}
  - id: spend-categorization
    dim: 16
    kappa: 0.5
    seed: 33
    service: {grpcPort: 50093, metricsPort: 9103}
    resources:
      requests: {cpu: 300m, memory: 384Mi}
      limits:   {cpu: 1,    memory: 1Gi}

networkPolicy:
  enabled: true

metrics:
  serviceMonitor:
    enabled: true
    interval: 15s                 # tighter scrape in staging

alerts:
  enabled: true
  severity:
    ReloadFailureRate: warning    # not critical in staging
    ReloadLatencyP99High: warning
    ReloadingStuck: critical
    ControllerDown: critical
    ParticipantDown: warning
    ReloadGenNotAdvancing: info

dashboard:
  enabled: true

hooks:
  enabled: true
  preUpgrade:
    snapshotEnabled: true
    backupRingSize: 5
  postUpgrade:
    sighupEnabled: true
    serial: true
    ignoreFailures: true          # staging-friendly : don't block on hook failure

bundle:
  sidecar:
    enabled: false                # PR #15+ will flip

tls:
  enabled: false                  # PR #16 will flip

priorityClass:
  enabled: false                  # staging usually has plenty of capacity
