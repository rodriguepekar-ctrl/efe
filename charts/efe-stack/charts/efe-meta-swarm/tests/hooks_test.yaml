# PR #14 — helm-unittest assertions for the Helm pre/post-upgrade hooks.
# Cf. `docs/EFE_A1_PHASE2_PR14_ARCHITECTURE.md` § 24.1.
suite: efe-meta-swarm hooks

templates:
  - hooks/pre-upgrade-snapshot.yaml
  - hooks/post-upgrade-sighup.yaml
  - hooks/hook-serviceaccount.yaml
  - hooks/hook-role.yaml
  - hooks/hook-rolebinding.yaml

tests:
  - it: hooks disabled by default — 0 documents
    set:
      enabled: true
      image:
        tag: "test"
    asserts:
      - hasDocuments:
          count: 0

  - it: hooks enabled — each hook template renders one document
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: AC11 — pre-upgrade Job has weight -10
    template: hooks/pre-upgrade-snapshot.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"

  - it: AC12 — post-upgrade Job has weight 10 and hook=post-upgrade,post-install
    template: hooks/post-upgrade-sighup.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade,post-install
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "10"

  - it: AC14 — Role grants configmaps (CRUD) + pods/exec (least privilege)
    template: hooks/hook-role.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      # ConfigMap CRUD for pre-upgrade-snapshot (read live, create/update backups).
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list", "create", "update", "patch"]
          any: true
      # pods/exec for post-upgrade-sighup (`kubectl exec ... kill -HUP 1`).
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/exec"]
            verbs: ["create"]
          any: true
      # Deployments get/list for `kubectl exec deploy/...` resolution.
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list"]
          any: true

  - it: hook SA mounts token (needed for kubectl API calls)
    template: hooks/hook-serviceaccount.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  # ───────────────────────────────────────────────────────────────────
  # AC13 (audit) — Hook SA + Role + RoleBinding MUST themselves be
  # installed as pre-install/pre-upgrade hooks with weights that order
  # them BEFORE the Job hooks that consume them.  Without this, the
  # snapshot/sighup Jobs reference an SA that doesn't exist yet and
  # fail with `serviceaccount … not found`.
  # ───────────────────────────────────────────────────────────────────

  - it: AC13 (audit) — Hook SA is itself a pre-install/pre-upgrade hook (weight -20)
    template: hooks/hook-serviceaccount.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"

  - it: AC13 (audit) — Hook Role is pre-install/pre-upgrade (weight -19)
    template: hooks/hook-role.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-19"

  - it: AC13 (audit) — Hook RoleBinding is pre-install/pre-upgrade (weight -18)
    template: hooks/hook-rolebinding.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-18"
      # RoleBinding must reference the same Role + SA name.
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-efe-meta-swarm-hooks
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-efe-meta-swarm-hooks
      - equal:
          path: roleRef.kind
          value: Role

  # ───────────────────────────────────────────────────────────────────
  # PR #14 audit pass — regression guard for the `ignoreFailures: false`
  # boolean default bug.  Prior buggy template used `| default true`
  # which Helm/Sprig treats as falsy for `false`, silently rewriting
  # the operator's explicit prod fail-fast setting back to `true`.
  # ───────────────────────────────────────────────────────────────────

  - it: AC32 (audit) — ignoreFailures default (true) renders IGNORE_FAIL "true"
    template: hooks/post-upgrade-sighup.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGNORE_FAIL
            value: "true"
          any: true

  - it: AC32 (audit) — ignoreFailures=false (prod strict) renders IGNORE_FAIL "false"
    template: hooks/post-upgrade-sighup.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
        postUpgrade:
          ignoreFailures: false      # prod fail-fast mode
    asserts:
      # The bug : `| default true` made this assertion FAIL because the
      # env value rendered as "true" instead of "false".  The ternary
      # fix lets `false` pass through untouched.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGNORE_FAIL
            value: "false"
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGNORE_FAIL
            value: "true"

  - it: AC32 (audit) — ignoreFailures=true (explicit) renders IGNORE_FAIL "true"
    template: hooks/post-upgrade-sighup.yaml
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
        postUpgrade:
          ignoreFailures: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGNORE_FAIL
            value: "true"
          any: true
