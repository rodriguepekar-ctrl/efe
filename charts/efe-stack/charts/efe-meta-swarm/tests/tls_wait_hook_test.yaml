# PR #16 — helm-unittest assertions for the wait-for-Certificate hook.
#
# Covers :
#   AC16 — Hook runs at weight -5 (pre-install + pre-upgrade)
#   AC17 — Hook respects `tls.waitForCertTimeoutSeconds`
#
suite: efe-meta-swarm TLS wait-for-cert hook

templates:
  - hooks/tls-wait-for-cert.yaml

tests:
  - it: hook NOT rendered when tls.enabled=false
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
      tls:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: hook NOT rendered when hooks.enabled=false (even with tls.enabled=true)
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: false
      tls:
        enabled: true
        certManager:
          enabled: true
          issuerType: selfSigned
    asserts:
      - hasDocuments:
          count: 0

  - it: AC16 — Hook rendered at weight -5 for pre-install + pre-upgrade
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
      tls:
        enabled: true
        certManager:
          enabled: true
          issuerType: selfSigned
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: AC17 — Hook uses tls.waitForCertTimeoutSeconds env var
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
      tls:
        enabled: true
        waitForCertTimeoutSeconds: 600
        certManager:
          enabled: true
          issuerType: selfSigned
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIMEOUT_S
            value: "600"
          any: true

  - it: Hook CERTS env var lists controller + 3 participants
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
      tls:
        enabled: true
        certManager:
          enabled: true
          issuerType: selfSigned
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=='CERTS')].value
          pattern: ".*controller-tls.*supplier-scoring-tls.*contract-risk-tls.*spend-categorization-tls.*"

  - it: Hook respects backoffLimit=0 (no retries)
    set:
      enabled: true
      image:
        tag: "test"
      hooks:
        enabled: true
      tls:
        enabled: true
        certManager:
          enabled: true
          issuerType: selfSigned
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 0
