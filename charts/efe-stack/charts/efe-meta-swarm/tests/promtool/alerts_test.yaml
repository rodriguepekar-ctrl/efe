# PR #19 § 41.1 + § 41.2 — promtool synthetic-series test suite.
#
# Run via :
#   helm template efe-meta-swarm charts/efe-stack/charts/efe-meta-swarm \
#     --set enabled=true \
#     --set image.tag=test \
#     --set alerts.enabled=true \
#     --set alerts.pr19.enabled=true \
#     --show-only templates/pr19-prometheusrule.yaml \
#     | yq '.spec.groups' > /tmp/rules.yaml
#
#   promtool test rules charts/efe-stack/charts/efe-meta-swarm/tests/promtool/alerts_test.yaml
#
# (The CI workflow `.github/workflows/dashboards.yml` automates this.)
#
# Tests cover :
#   - The 6 recording rules emit at the right values (A.1 / A.5 from arch doc).
#   - A1 fires above 5 % error rate, doesn't fire at 4 %.
#   - A2 fires when p99 > 5 s sustained 5m.
#   - A3 fires when participant_up == 0 sustained 2m.
#   - A5 fires when controller `up == 0` sustained 1m.
#   - A9 (fast burn) fires only when BOTH 5m and 1h windows exceed 14.4×.
#   - A10 (slow burn) fires only when BOTH 1h and 6h windows exceed 6×.

rule_files:
  - rendered_rules.yaml

evaluation_interval: 30s

tests:

  # ───────────────────────────────────────────────────────────────
  # Test 1 — Recording rule R1 emits the expected rate
  # ───────────────────────────────────────────────────────────────
  - name: "R1 iterate_total:rate5m matches manual rate computation"
    interval: 30s
    input_series:
      # 100 ok/s sustained for 30 minutes (60 samples × 30s)
      - series: 'efe_meta_swarm_iterate_total{result="ok"}'
        values: '0+50x60'   # 50 increments per sample → 100/s after 5m smoothing
      # 5 errors/s sustained
      - series: 'efe_meta_swarm_iterate_total{result="error"}'
        values: '0+2x60'
    promql_expr_test:
      - expr: 'efe_msw:iterate_total:rate5m{result="ok"}'
        eval_time: 10m
        exp_samples:
          - labels: '{result="ok",owner="meta-swarm-sre"}'
            value: 1.6666666666666667    # 50/30s ≈ 1.67/s
      - expr: 'efe_msw:iterate_total:rate5m{result="error"}'
        eval_time: 10m
        exp_samples:
          - labels: '{result="error",owner="meta-swarm-sre"}'
            value: 0.06666666666666667

  # ───────────────────────────────────────────────────────────────
  # Test 2 — A1 IterateFailureRateHigh fires above 5%, not below
  # ───────────────────────────────────────────────────────────────
  - name: "A1 fires at 6% error rate sustained 5m"
    interval: 30s
    input_series:
      - series: 'efe_meta_swarm_iterate_total{result="ok"}'
        values: '0+94x40'
      - series: 'efe_meta_swarm_iterate_total{result="error"}'
        values: '0+6x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: IterateFailureRateHigh
        exp_alerts:
          - exp_labels:
              service: meta-swarm
              team: meta-swarm-sre
              severity: critical
              runbook_id: MSW1
              component: meta-swarm
            exp_annotations:
              summary: "Meta-swarm iterate failure rate > 5% over 5m"

  - name: "A1 does NOT fire at 4% error rate"
    interval: 30s
    input_series:
      - series: 'efe_meta_swarm_iterate_total{result="ok"}'
        values: '0+96x40'
      - series: 'efe_meta_swarm_iterate_total{result="error"}'
        values: '0+4x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: IterateFailureRateHigh
        exp_alerts: []   # explicitly no alert

  # ───────────────────────────────────────────────────────────────
  # Test 3 — A3 ParticipantDown fires after 2m of up==0
  # ───────────────────────────────────────────────────────────────
  - name: "A3 fires when participant_up==0 for 2m"
    interval: 30s
    input_series:
      - series: 'efe_meta_swarm_participant_up{participant_id="p-canary"}'
        values: '0x10'   # 10 samples of 0 → 5 minutes
    alert_rule_test:
      - eval_time: 3m
        alertname: ParticipantDown
        exp_alerts:
          - exp_labels:
              service: meta-swarm
              team: meta-swarm-sre
              severity: warning
              runbook_id: MSW3
              participant_id: p-canary
              component: meta-swarm
            exp_annotations:
              summary: "Participant p-canary unreachable for ≥ 2m"

  - name: "A3 does NOT fire when up==1"
    interval: 30s
    input_series:
      - series: 'efe_meta_swarm_participant_up{participant_id="p-canary"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: ParticipantDown
        exp_alerts: []

  # ───────────────────────────────────────────────────────────────
  # Test 4 — A5 ControllerNotServing fires after 1m of up==0
  # ───────────────────────────────────────────────────────────────
  - name: "A5 fires when controller up==0 for 1m"
    interval: 30s
    input_series:
      - series: 'up{job="efe-meta-swarm-controller", instance="ctrl-0"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: ControllerNotServing
        exp_alerts:
          - exp_labels:
              service: meta-swarm
              team: meta-swarm-sre
              severity: critical
              runbook_id: MSW5
              instance: ctrl-0
              job: efe-meta-swarm-controller
              component: meta-swarm

  # ───────────────────────────────────────────────────────────────
  # Test 5 — A9 SLOBudgetBurnFast14x — both windows must exceed
  # ───────────────────────────────────────────────────────────────
  # Threshold computation : default availability 99.9% → error budget 0.001
  #                         fast multiplier 14.4 → threshold 0.0144 (1.44%)
  # Both 5m AND 1h windows must exceed.
  - name: "A9 fires when both 5m and 1h error rate > 1.44%"
    interval: 30s
    input_series:
      - series: 'efe_meta_swarm_iterate_total{result="ok"}'
        values: '0+98x140'  # 70 minutes of data (enough for both windows)
      - series: 'efe_meta_swarm_iterate_total{result="error"}'
        values: '0+2x140'   # 2% error rate — exceeds 1.44%
    alert_rule_test:
      - eval_time: 70m
        alertname: SLOBudgetBurnFast14x
        exp_alerts:
          - exp_labels:
              service: meta-swarm
              team: meta-swarm-sre
              severity: critical
              runbook_id: MSW9
              slo_id: iterate-availability
              burn_rate: fast
              component: meta-swarm

  - name: "A9 does NOT fire when only short window exceeds (transient blip)"
    interval: 30s
    input_series:
      # First 5m at 5% errors, then 65m clean → 5m window high, 1h average low
      - series: 'efe_meta_swarm_iterate_total{result="ok"}'
        values: '0+95x10 0+100x130'
      - series: 'efe_meta_swarm_iterate_total{result="error"}'
        values: '0+5x10 0+0x130'
    alert_rule_test:
      - eval_time: 70m
        alertname: SLOBudgetBurnFast14x
        exp_alerts: []   # 1h window dilutes the 5m blip below threshold

  # ───────────────────────────────────────────────────────────────
  # Test 6 — A10 SLOBudgetBurnSlow6x
  # ───────────────────────────────────────────────────────────────
  # Threshold : 6 × 0.001 = 0.006 (0.6 %)
  - name: "A10 fires when both 1h and 6h error rate > 0.6%"
    interval: 30s
    input_series:
      - series: 'efe_meta_swarm_iterate_total{result="ok"}'
        values: '0+99x720'  # 6 hours
      - series: 'efe_meta_swarm_iterate_total{result="error"}'
        values: '0+1x720'   # 1% error rate exceeds 0.6%
    alert_rule_test:
      - eval_time: 6h30m
        alertname: SLOBudgetBurnSlow6x
        exp_alerts:
          - exp_labels:
              service: meta-swarm
              team: meta-swarm-sre
              severity: warning
              runbook_id: MSW10
              slo_id: iterate-availability
              burn_rate: slow
              component: meta-swarm

  # ───────────────────────────────────────────────────────────────
  # Test 7 — A6 OTelExporterFailing fires above 10% drop sustained
  # ───────────────────────────────────────────────────────────────
  - name: "A6 fires at 15% drop rate sustained 10m"
    interval: 30s
    input_series:
      - series: 'efe_meta_swarm_otel_exported_spans_total'
        values: '0+85x40'
      - series: 'efe_meta_swarm_otel_dropped_spans_total{reason="queue_full"}'
        values: '0+15x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: OTelExporterFailing
        exp_alerts:
          - exp_labels:
              service: meta-swarm
              team: meta-swarm-sre
              severity: warning
              runbook_id: MSW6
              component: meta-swarm

  # ───────────────────────────────────────────────────────────────
  # Test 8 — A7 SafetyViolationSpike fires above 0.1/s
  # ───────────────────────────────────────────────────────────────
  - name: "A7 fires when safety violation rate > 0.1/s sustained 5m"
    interval: 30s
    input_series:
      - series: 'efe_meta_swarm_safety_violations_total{participant_id="p-bad",kind="box"}'
        values: '0+1x40'   # 1 per 30s = 0.033/s
      - series: 'efe_meta_swarm_safety_violations_total{participant_id="p-bad",kind="poly"}'
        values: '0+5x40'   # 5 per 30s = 0.17/s — total ≈ 0.2/s > 0.1
    alert_rule_test:
      - eval_time: 10m
        alertname: SafetyViolationSpike
        exp_alerts:
          - exp_labels:
              service: meta-swarm
              team: meta-swarm-sre
              severity: warning
              runbook_id: MSW7
              component: meta-swarm

  # ───────────────────────────────────────────────────────────────
  # Test 9 — A4 TLSCertExpiringSoon fires < 7 days
  # ───────────────────────────────────────────────────────────────
  # Uses a static cert_expiry timestamp 5 days in the future relative
  # to eval_time.
  - name: "A4 fires when cert expires in 5 days (< 7-day threshold)"
    interval: 1m
    input_series:
      - series: 'efe_meta_swarm_tls_cert_expiry_seconds{cert_name="msw-controller",subject_cn="controller.efe.internal"}'
        # Test framework treats `time()` at eval_time=2h as a constant ;
        # we encode expiry = eval_time + 5 days = 432000s + 7200s offset.
        # Simplest representation : constant ~ 439200 epoch-seconds for
        # the entire window.  Promtool aligns eval_time to the test's
        # virtual epoch at 0, so the gauge values are simply 5 * 86400
        # = 432000 (5 days in seconds, relative to the virtual zero).
        values: '432000x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: TLSCertExpiringSoon
        exp_alerts:
          - exp_labels:
              service: meta-swarm
              team: meta-swarm-sre
              severity: warning
              runbook_id: MSW4
              cert_name: msw-controller
              subject_cn: controller.efe.internal
              component: meta-swarm
