# PR #18 — helm-unittest for the OTel ConfigMap + 3 alerts.
suite: efe-meta-swarm PR #18 OTel surface

templates:
  - otel-configmap.yaml
  - pr18-prometheusrule.yaml

tests:
  - it: ConfigMap NOT rendered when tracing.otel.enabled=false
    template: otel-configmap.yaml
    set:
      enabled: true
      image:
        tag: "test"
    asserts:
      - hasDocuments:
          count: 0

  - it: ConfigMap renders with default OTel env vars
    template: otel-configmap.yaml
    set:
      enabled: true
      image:
        tag: "test"
      tracing:
        otel:
          enabled: true
          endpoint: "http://otel-collector.observability.svc:4317"
          samplerArg: "0.01"
          deploymentEnvironment: "prod"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc:4317"
      - equal:
          path: data.OTEL_TRACES_SAMPLER
          value: "parentbased_traceidratio"
      - equal:
          path: data.OTEL_TRACES_SAMPLER_ARG
          value: "0.01"
      - equal:
          path: data.OTEL_DEPLOYMENT_ENVIRONMENT
          value: "prod"

  - it: PrometheusRule NOT rendered when alerts.enabled=false
    template: pr18-prometheusrule.yaml
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: false
      tracing:
        otel:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: PrometheusRule NOT rendered when tracing.otel.enabled=false
    template: pr18-prometheusrule.yaml
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: true
      tracing:
        otel:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: AC21 — 3 alerts render when both enabled
    template: pr18-prometheusrule.yaml
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: true
        runbookBaseUrl: "https://example.com/runbook"
      tracing:
        otel:
          enabled: true
          samplerArg: "0.01"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - lengthEqual:
          path: spec.groups[0].rules
          count: 3
      - equal:
          path: spec.groups[0].rules[0].alert
          value: MetaSwarmOtelExporterDown
      - equal:
          path: spec.groups[0].rules[1].alert
          value: MetaSwarmOtelDropRateHigh
      - equal:
          path: spec.groups[0].rules[2].alert
          value: MetaSwarmOtelSamplingDrift

  - it: Severity labels match architecture (warning/warning/info)
    template: pr18-prometheusrule.yaml
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: true
      tracing:
        otel:
          enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: warning
      - equal:
          path: spec.groups[0].rules[1].labels.severity
          value: warning
      - equal:
          path: spec.groups[0].rules[2].labels.severity
          value: info

  - it: Sampler arg threshold appears in drift PromQL
    template: pr18-prometheusrule.yaml
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: true
      tracing:
        otel:
          enabled: true
          samplerArg: "0.1"
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "- 0.1\\)"
