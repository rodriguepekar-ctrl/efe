# PR #14 — helm-unittest assertions for per-tenant label propagation.
suite: efe-meta-swarm tenant labels

templates:
  - configmap-manifest.yaml
  - controller-deployment.yaml
  - participant-deployment.yaml

tests:
  - it: AC28 — efe.io/tenant defaults to "default" when global.tenant unset
    set:
      enabled: true
      image:
        tag: "test"
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["efe.io/tenant"]
          value: default

  - it: AC28 — efe.io/tenant propagates from global.tenant override
    set:
      enabled: true
      image:
        tag: "test"
      global:
        tenant: kovant-prod
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["efe.io/tenant"]
          value: kovant-prod

  - it: AC28 — tenant label appears on every resource family
    template: controller-deployment.yaml
    set:
      enabled: true
      image:
        tag: "test"
      global:
        tenant: kovant-canary
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["efe.io/tenant"]
          value: kovant-canary

  # ───────────────────────────────────────────────────────────────────
  # PR #14 audit pass — commonLabels propagation (GAP B).  Verify that
  # umbrella-set `global.commonLabels` flow through `_helpers.tpl`
  # labels block at the correct indentation under `metadata.labels`.
  # ───────────────────────────────────────────────────────────────────

  - it: AC28 (audit) — global.commonLabels propagate to controller Deployment
    template: controller-deployment.yaml
    set:
      enabled: true
      image:
        tag: "test"
      global:
        tenant: kovant-prod
        commonLabels:
          cost-center: kovant
          efe.io/managed-by: helm
    asserts:
      - equal:
          path: metadata.labels["cost-center"]
          value: kovant
      - equal:
          path: metadata.labels["efe.io/managed-by"]
          value: helm
      # Plus the standard chart labels still present.
      - equal:
          path: metadata.labels["efe.io/tenant"]
          value: kovant-prod
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: efe

  - it: AC28 (audit) — commonLabels propagate to participant Deployments too
    template: participant-deployment.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-efe-meta-swarm-participant-supplier-scoring
    set:
      enabled: true
      image:
        tag: "test"
      global:
        commonLabels:
          cost-center: kovant
    asserts:
      - equal:
          path: metadata.labels["cost-center"]
          value: kovant
