# PR #19 helm-unittest — PrometheusRule + AlertmanagerConfig rendering.
#
# Verifies :
#   - The PrometheusRule renders only when both `enabled` and
#     `alerts.enabled` AND `alerts.pr19.enabled` are true (AC1).
#   - All 10 alert names are present (AC7).
#   - All 6 recording rules are present (AC12).
#   - Every alert carries the required `service`, `team`, `severity`,
#     `runbook_id` labels (AC9).
#   - Every alert carries a `runbook_url` annotation (AC8).
#   - SLO-burn alerts (A9 / A10) carry the `slo_id` + `burn_rate` labels.
#   - AlertmanagerConfig CRD renders with the 3 receivers + 3 inhibition rules.
#   - STABILITY_CONTRACT version annotation == "1.1".
suite: efe-meta-swarm PR #19 alerts surface

templates:
  - pr19-prometheusrule.yaml
  - pr19-alertmanager-routing-configmap.yaml

tests:
  # ───────────────────────────────────────────────────────────────
  # Rendering gates
  # ───────────────────────────────────────────────────────────────

  - it: pr19 PrometheusRule NOT rendered when sub-chart disabled
    template: pr19-prometheusrule.yaml
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: pr19 PrometheusRule NOT rendered when alerts.enabled=false
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts:
        enabled: false
        pr19:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: pr19 PrometheusRule NOT rendered when alerts.pr19.enabled=false
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts:
        enabled: true
        pr19:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: pr19 PrometheusRule renders 1 document when fully enabled
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts:
        enabled: true
        pr19:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.labels.efe\.pr
          value: "19"
      - equal:
          path: metadata.annotations.efe\.stability_contract\.version
          value: "1.1"

  # ───────────────────────────────────────────────────────────────
  # Alert names — STABILITY_CONTRACT v1.1 commitments (AC10)
  # ───────────────────────────────────────────────────────────────

  - it: All 10 alert names are present
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts: { enabled: true, pr19: { enabled: true } }
    asserts:
      - matchRegex:
          path: spec.groups[1].rules[0].alert
          pattern: "^IterateFailureRateHigh$"
      - matchRegex:
          path: spec.groups[1].rules[1].alert
          pattern: "^IterateLatencyP99Critical$"
      - matchRegex:
          path: spec.groups[1].rules[2].alert
          pattern: "^SLOBudgetBurnFast14x$"
      - matchRegex:
          path: spec.groups[1].rules[3].alert
          pattern: "^SLOBudgetBurnSlow6x$"
      - matchRegex:
          path: spec.groups[2].rules[0].alert
          pattern: "^ParticipantDown$"
      - matchRegex:
          path: spec.groups[2].rules[1].alert
          pattern: "^TLSCertExpiringSoon$"
      - matchRegex:
          path: spec.groups[2].rules[2].alert
          pattern: "^OTelExporterFailing$"
      - matchRegex:
          path: spec.groups[2].rules[3].alert
          pattern: "^SafetyViolationSpike$"
      - matchRegex:
          path: spec.groups[2].rules[4].alert
          pattern: "^ManifestReloadFailureSpike$"
      - matchRegex:
          path: spec.groups[3].rules[0].alert
          pattern: "^ControllerNotServing$"

  # ───────────────────────────────────────────────────────────────
  # Recording rule names (STABILITY_CONTRACT v1.1, AC12 + AC13)
  # ───────────────────────────────────────────────────────────────

  - it: "All 6 recording rules are present with the efe_msw: prefix"
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts: { enabled: true, pr19: { enabled: true } }
    asserts:
      - equal:
          path: spec.groups[0].name
          value: efe-meta-swarm.recording
      - matchRegex:
          path: spec.groups[0].rules[0].record
          pattern: "^efe_msw:iterate_total:rate5m$"
      - matchRegex:
          path: spec.groups[0].rules[1].record
          pattern: "^efe_msw:iterate_total:rate30m$"
      - matchRegex:
          path: spec.groups[0].rules[2].record
          pattern: "^efe_msw:iterate_total:rate1h$"
      - matchRegex:
          path: spec.groups[0].rules[3].record
          pattern: "^efe_msw:iterate_total:rate6h$"
      - matchRegex:
          path: spec.groups[0].rules[4].record
          pattern: "^efe_msw:iterate_duration:p95_5m$"
      - matchRegex:
          path: spec.groups[0].rules[5].record
          pattern: "^efe_msw:iterate_duration:p99_5m$"

  # ───────────────────────────────────────────────────────────────
  # Mandatory alert labels + annotations (AC8 + AC9)
  # ───────────────────────────────────────────────────────────────

  - it: A1 IterateFailureRateHigh has the 5 mandatory labels + runbook_url
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts: { enabled: true, pr19: { enabled: true } }
    asserts:
      - equal:
          path: spec.groups[1].rules[0].alert
          value: IterateFailureRateHigh
      - equal:
          path: spec.groups[1].rules[0].labels.service
          value: meta-swarm
      - equal:
          path: spec.groups[1].rules[0].labels.team
          value: meta-swarm-sre
      - equal:
          path: spec.groups[1].rules[0].labels.severity
          value: critical
      - equal:
          path: spec.groups[1].rules[0].labels.runbook_id
          value: MSW1
      - matchRegex:
          path: spec.groups[1].rules[0].annotations.runbook_url
          pattern: ".*/RB_PR19_MSW1\\.md$"

  - it: A9 SLOBudgetBurnFast14x carries slo_id + burn_rate labels
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts: { enabled: true, pr19: { enabled: true } }
    asserts:
      - equal:
          path: spec.groups[1].rules[2].alert
          value: SLOBudgetBurnFast14x
      - equal:
          path: spec.groups[1].rules[2].labels.slo_id
          value: iterate-availability
      - equal:
          path: spec.groups[1].rules[2].labels.burn_rate
          value: "fast"
      - equal:
          path: spec.groups[1].rules[2].labels.severity
          value: critical

  - it: A5 ControllerNotServing fires after 1m with critical severity
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts: { enabled: true, pr19: { enabled: true } }
    asserts:
      - equal:
          path: spec.groups[3].rules[0].alert
          value: ControllerNotServing
      - equal:
          path: spec.groups[3].rules[0].for
          value: 1m
      - equal:
          path: spec.groups[3].rules[0].labels.severity
          value: critical

  # ───────────────────────────────────────────────────────────────
  # Custom SLO target override (AC14)
  # ───────────────────────────────────────────────────────────────

  - it: SLO target override propagates to the burn-rate expression
    template: pr19-prometheusrule.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts:
        enabled: true
        pr19:
          enabled: true
          slo:
            iterateAvailabilityTarget: 0.9999  # stricter than default
    asserts:
      # Error budget = 1 - 0.9999 = 0.0001 ; A9 expression must
      # reference this value (the chart inlines the literal).
      - matchRegex:
          path: spec.groups[1].rules[2].expr
          pattern: "14\\.4"
      # Note: the budget arithmetic is computed by the template helper
      # via `sub 1.0 $availTarget` — the rendered expression contains
      # `14.4 * 0.0001` once the helper inlines the multiplier.

  # ───────────────────────────────────────────────────────────────
  # AlertmanagerConfig CRD (PR #19 § 33)
  # ───────────────────────────────────────────────────────────────

  - it: AlertmanagerConfig CRD renders with 3 receivers + 3 inhibition rules
    template: pr19-alertmanager-routing-configmap.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts:
        enabled: true
        pr19:
          enabled: true
          alertmanager:
            enabled: true
            mode: alertmanagerconfig
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: AlertmanagerConfig
      - lengthEqual:
          path: spec.receivers
          count: 3
      - lengthEqual:
          path: spec.inhibitRules
          count: 3
      - contains:
          path: spec.receivers
          content:
            name: meta-swarm-sre-page
      - contains:
          path: spec.receivers
          content:
            name: meta-swarm-sre-ticket
      - contains:
          path: spec.receivers
          content:
            name: compliance-audit-loki

  - it: Alertmanager raw-fragment mode emits a plain ConfigMap
    template: pr19-alertmanager-routing-configmap.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts:
        enabled: true
        pr19:
          enabled: true
          alertmanager:
            enabled: true
            mode: raw-fragment
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels.efe\.alertmanager\.fragment
          value: "true"

  - it: Alertmanager not rendered when pr19.alertmanager.enabled=false
    template: pr19-alertmanager-routing-configmap.yaml
    set:
      enabled: true
      image: { tag: "test" }
      alerts:
        enabled: true
        pr19:
          enabled: true
          alertmanager:
            enabled: false
    asserts:
      - hasDocuments:
          count: 0
