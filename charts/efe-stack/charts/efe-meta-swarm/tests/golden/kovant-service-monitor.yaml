      annotations:
        # PR #13 AD4 : NO `checksum/config`.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tst-efe-meta-swarm-participant-supplier-scoring
      automountServiceAccountToken: false
      # PR #13 hardening — see controller-deployment.yaml for rationale.
      enableServiceLinks: false
      # PR #14 (AD7) — when the bundle weight-loader sidecar is
      # enabled, the sidecar needs `/proc` visibility into the
      # participant container so it can `kill -HUP 1` after writing
      # new weights.  Without `shareProcessNamespace`, each container
      # has an isolated PID namespace.  T26 trust-boundary documented
      # in PR #14 architecture § 13.4.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: participant
          image: "ghcr.io/efe-ai/efe-meta-swarm-server:0.2.0-snapshot"
          imagePullPolicy: IfNotPresent
          args: ["participant"]
          ports:
            - name: grpc
              containerPort: 50091
              protocol: TCP
            - name: metrics
              containerPort: 9101
              protocol: TCP
          env:
            - name: EFE_META_SWARM_PARTICIPANT_ID
              value: "supplier-scoring"
            - name: EFE_META_SWARM_PARTICIPANT_ADDR
              value: "0.0.0.0:50091"
            - name: EFE_META_SWARM_PARTICIPANT_METRICS
              value: "0.0.0.0:9101"
            - name: EFE_META_SWARM_MANIFEST
              value: /etc/efe-meta-swarm/manifest.yaml
            - name: EFE_META_SWARM_WORKER_THREADS
              value: "1"
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          livenessProbe:
            tcpSocket:
              port: 50091
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50091
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: manifest
              mountPath: /etc/efe-meta-swarm
              readOnly: true
      volumes:
        - name: manifest
          configMap:
            name: tst-efe-meta-swarm-manifest
      terminationGracePeriodSeconds: 30
