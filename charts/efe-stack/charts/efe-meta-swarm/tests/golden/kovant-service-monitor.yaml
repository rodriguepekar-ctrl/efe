apiVersion: v1
kind: ConfigMap
metadata:
  name: tst-efe-meta-swarm-manifest
  labels:
    helm.sh/chart: efe-meta-swarm-0.2.0
    app.kubernetes.io/name: efe-meta-swarm
    app.kubernetes.io/instance: tst
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: efe
    efe.io/tenant: "default"
    efe.io/meta-swarm-role: shared
  annotations:
    efe.io/manifest-schema-version: "v0.2.0"
data:
  # The whole Phase-2 manifest YAML.  Both the controller and every
  # participant mount this ConfigMap at `/etc/efe-meta-swarm/manifest.yaml`
  # and set `EFE_META_SWARM_MANIFEST=/etc/efe-meta-swarm/manifest.yaml`.
  #
  # SIGHUP-driven reload (PR #12) re-reads from this path ; the
  # operator's edit-then-`helm upgrade`-then-`kill -HUP` workflow is
  # documented in the runbook (PR #13 § 41).
  #
  # PR #13 AD4 : NO `checksum/config` annotation is propagated to
  # pod templates ; pod restart on ConfigMap change would defeat
  # the SIGHUP design.  Operator triggers reload explicitly.
  manifest.yaml: |-
    version: "v0.2.0"
    meta:
      dim: 16
      safety:
        kind: box
        radius: 50
    participants:
      - id: supplier-scoring
        dim: 8
        kappa: 0.6
        seed: 11
        blas_backend: "none"
      - id: contract-risk
        dim: 8
        kappa: 0.7
        seed: 22
        blas_backend: "none"
      - id: spend-categorization
        dim: 8
        kappa: 0.5
        seed: 33
        blas_backend: "none"
    iteration:
      max_iters:      100
      tolerance:      0.0001
      alpha_default:  0.5
      coupling_gamma: 0.2
      deterministic:  true
      max_wall_ms:    15000
