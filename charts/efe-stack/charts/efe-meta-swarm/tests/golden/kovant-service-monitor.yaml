      # participant container so it can `kill -HUP 1` after writing
      # new weights.  Without `shareProcessNamespace`, each container
      # has an isolated PID namespace.  T26 trust-boundary documented
      # in PR #14 architecture § 13.4.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: participant
          image: "ghcr.io/efe-ai/efe-meta-swarm-server:0.2.0-snapshot"
          imagePullPolicy: IfNotPresent
          args: ["participant"]
          ports:
            - name: grpc
              containerPort: 50093
              protocol: TCP
            - name: metrics
              containerPort: 9103
              protocol: TCP
          env:
            - name: EFE_META_SWARM_PARTICIPANT_ID
              value: "spend-categorization"
            - name: EFE_META_SWARM_PARTICIPANT_ADDR
              value: "0.0.0.0:50093"
            - name: EFE_META_SWARM_PARTICIPANT_METRICS
              value: "0.0.0.0:9103"
            - name: EFE_META_SWARM_MANIFEST
              value: /etc/efe-meta-swarm/manifest.yaml
            - name: EFE_META_SWARM_WORKER_THREADS
              value: "1"
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          livenessProbe:
            tcpSocket:
              port: 50093
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50093
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: manifest
              mountPath: /etc/efe-meta-swarm
              readOnly: true
      volumes:
        - name: manifest
          configMap:
            name: tst-efe-meta-swarm-manifest
      terminationGracePeriodSeconds: 30
