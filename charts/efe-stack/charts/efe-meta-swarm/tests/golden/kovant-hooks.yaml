# Source: efe-meta-swarm/templates/hooks/post-upgrade-sighup.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: tst-efe-meta-swarm-hook-post-upgrade-sighup
  labels:
    helm.sh/chart: efe-meta-swarm-0.2.0
    app.kubernetes.io/name: efe-meta-swarm
    app.kubernetes.io/instance: tst
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: efe
    efe.io/tenant: "default"
    app.kubernetes.io/component: hook
  annotations:
    "helm.sh/hook": post-upgrade,post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        helm.sh/chart: efe-meta-swarm-0.2.0
        app.kubernetes.io/name: efe-meta-swarm
        app.kubernetes.io/instance: tst
        app.kubernetes.io/version: "0.3.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: efe
        efe.io/tenant: "default"
        app.kubernetes.io/component: hook
    spec:
      restartPolicy: Never
      serviceAccountName: tst-efe-meta-swarm-hooks
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sighup
          image: "bitnami/kubectl:1.28"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 256Mi}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONTROLLER_DEPLOY
              value: tst-efe-meta-swarm-controller
            # PR #14 audit fix — DO NOT use `| default true` on a
            # boolean : Helm/Sprig treats `false` as an empty value, so
            # `| default true` silently rewrites an explicit
            # `hooks.postUpgrade.ignoreFailures: false` (prod fail-fast
            # mode) back to `true`.  We use `ternary` against the merged
            # value, which preserves the explicit `false` from the
            # operator's values file.  values.yaml carries the
            # `ignoreFailures: true` default so the merged value is
            # always a boolean.
            - name: IGNORE_FAIL
              value: "true"
          command:
            - sh
            - -c
            - |
              set -eu

              echo "── PR #14 post-upgrade SIGHUP-all ──"
              echo "namespace=$NAMESPACE  controller=$CONTROLLER_DEPLOY  ignoreFail=$IGNORE_FAIL"

              sighup_pod() {
                local deploy="$1"
                echo "Waiting for $deploy rollout..."
                kubectl -n "$NAMESPACE" rollout status \
                  "deploy/$deploy" --timeout=120s
                echo "SIGHUP $deploy ..."
                if ! kubectl -n "$NAMESPACE" exec "deploy/$deploy" -- kill -HUP 1 ; then
                  if [ "$IGNORE_FAIL" = "true" ] ; then
                    echo "⚠ $deploy SIGHUP failed ; continuing (ignoreFailures=true)"
                    return 0
                  else
                    echo "✗ $deploy SIGHUP failed (ignoreFailures=false)"
                    return 1
                  fi
                fi
                echo "✓ $deploy SIGHUP delivered"
              }

              # 1) Controller.
              sighup_pod "$CONTROLLER_DEPLOY"

              # 2) Every participant.
              sighup_pod "tst-efe-meta-swarm-participant-supplier-scoring"
              sighup_pod "tst-efe-meta-swarm-participant-contract-risk"
              sighup_pod "tst-efe-meta-swarm-participant-spend-categorization"

              echo "✓ SIGHUP-all complete"
