# Source: efe-meta-swarm/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tst-efe-meta-swarm
  labels:
    helm.sh/chart: efe-meta-swarm-0.2.0
    app.kubernetes.io/name: efe-meta-swarm
    app.kubernetes.io/instance: tst
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: efe
    efe.io/tenant: "default"
    prometheus: efe
  annotations:
    # Operator-facing pointer ; alerts also embed `runbook_url`.
    efe.io/runbook-base-url: "https://efe.example.com/runbook/meta-swarm"
spec:
  groups:
    # ─── Group : reload ────────────────────────────────────────────
    - name: efe-meta-swarm.reload
      interval: 30s
      rules:

        - alert: MetaSwarmReloadFailureRate
          expr: |
            sum(rate(efe_meta_swarm_reload_failures_total[5m]))
              by (namespace, role)
            > 0.1
          for: 5m
          labels:
            severity: "critical"
            component: meta-swarm
          annotations:
            summary: "Meta-swarm reload failure rate is elevated"
            description: |
              The reload (SIGHUP / ReloadConfig RPC) failure rate is > 0.1/sec for 5 minutes.
              Operator action : `kubectl logs deploy/tst-efe-meta-swarm-controller` to inspect rejection reason.
            runbook_url: "https://efe.example.com/runbook/meta-swarm#reload-failures"

        - alert: MetaSwarmReloadLatencyP99High
          expr: |
            histogram_quantile(0.99,
              sum(rate(efe_meta_swarm_reload_duration_microseconds_bucket[5m]))
              by (le, namespace, role)
            ) > 1000000
          for: 10m
          labels:
            severity: "warning"
            component: meta-swarm
          annotations:
            summary: "Meta-swarm reload p99 latency > 1 sec"
            description: |
              The 99th percentile reload duration exceeds 1 second.  Expected : < 25 µs.
              Investigate large manifests or slow validation.
            runbook_url: "https://efe.example.com/runbook/meta-swarm#reload-latency"

        - alert: MetaSwarmReloadingStuck
          expr: |
            avg_over_time(efe_meta_swarm_health_status{status="RELOADING"}[1m]) > 0.5
          for: 1m
          labels:
            severity: "critical"
            component: meta-swarm
          annotations:
            summary: "Controller stuck in RELOADING state"
            description: |
              The controller has been in RELOADING (status=3) for over 1 minute.
              Expected : < 25 µs.  Likely a crashed swap mid-flight.  Operator action :
              `kubectl rollout restart deploy/tst-efe-meta-swarm-controller`.
            runbook_url: "https://efe.example.com/runbook/meta-swarm#reloading-stuck"

    # ─── Group : availability ──────────────────────────────────────
    - name: efe-meta-swarm.availability
      interval: 30s
      rules:

        - alert: MetaSwarmControllerDown
          expr: |
            up{job=~".*meta-swarm-controller.*"} == 0
          for: 5m
          labels:
            severity: "critical"
            component: meta-swarm
          annotations:
            summary: "Meta-swarm controller is DOWN"
            runbook_url: "https://efe.example.com/runbook/meta-swarm#controller-down"

        - alert: MetaSwarmParticipantDown
          expr: |
            up{job=~".*meta-swarm-participant-.*"} == 0
          for: 5m
          labels:
            severity: "warning"
            component: meta-swarm
          annotations:
            summary: "Meta-swarm participant {{ $labels.job }} is DOWN"
            runbook_url: "https://efe.example.com/runbook/meta-swarm#participant-down"

    # ─── Group : reload-gen freshness ──────────────────────────────
    - name: efe-meta-swarm.reload-freshness
      interval: 60s
      rules:

        - alert: MetaSwarmReloadGenNotAdvancing
          # Best-effort detection : reload_gen flat for 24h.
          # The cross-correlation with kube_configmap_info would be
          # more precise but requires kube-state-metrics ; skipping
          # to keep the alert dependency-light.
          expr: |
            increase(efe_meta_swarm_reload_gen[24h]) == 0
          for: 1h
          labels:
            severity: "info"
            component: meta-swarm
          annotations:
            summary: "reload_gen hasn't advanced in 24h — operator may have forgotten SIGHUP"
            description: |
              The manifest may have been edited but the SIGHUP hook didn't fire (or fired but reload was rejected).
              Inspect : `kubectl logs deploy/tst-efe-meta-swarm-controller | grep reload`
            runbook_url: "https://efe.example.com/runbook/meta-swarm#reload-gen-stale"
