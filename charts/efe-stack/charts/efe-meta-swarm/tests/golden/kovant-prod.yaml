# Source: efe-meta-swarm/templates/networkpolicy.yaml
# Allow efe-server → controller (gRPC) + Prometheus → metrics ports
# on the controller.  PR #13 also allows the helm-test probe Pod
# (label `app.kubernetes.io/component: test`) to reach the gRPC
# port so `helm test` succeeds under deny-by-default NetworkPolicy
# enforcement (was a silent failure mode in the initial PR #13 draft).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tst-efe-meta-swarm-controller-allow-ingress
  labels:
    helm.sh/chart: efe-meta-swarm-0.2.0
    app.kubernetes.io/name: efe-meta-swarm
    app.kubernetes.io/instance: tst
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: efe
    efe.io/tenant: "default"
    app.kubernetes.io/component: controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: efe-meta-swarm
      app.kubernetes.io/instance: tst
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    - from:
        # efe-server pods in the configured namespace selector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: efe
          podSelector:
            matchLabels:
              app.kubernetes.io/name: efe-server
        # helm-test Pod (same chart's selectorLabels + component=test).
        # The test Pod lives in the same namespace as the controller,
        # so the namespaceSelector is implicit (same-namespace pods).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: efe-meta-swarm
              app.kubernetes.io/instance: tst
              app.kubernetes.io/component: test
      ports:
        - protocol: TCP
          port: 50080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9091
