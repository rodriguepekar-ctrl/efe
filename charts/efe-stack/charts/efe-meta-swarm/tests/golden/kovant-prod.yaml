apiVersion: apps/v1
kind: Deployment
metadata:
  name: tst-efe-meta-swarm-controller
  labels:
    helm.sh/chart: efe-meta-swarm-0.2.0
    app.kubernetes.io/name: efe-meta-swarm
    app.kubernetes.io/instance: tst
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: efe
    efe.io/tenant: "default"
    app.kubernetes.io/component: controller
    efe.io/meta-swarm-role: controller
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1            # single-replica Deployment ; rolling restart drops the controller briefly (PR12-R7 — documented in runbook)
  selector:
    matchLabels:
      app.kubernetes.io/name: efe-meta-swarm
      app.kubernetes.io/instance: tst
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: efe-meta-swarm
        app.kubernetes.io/instance: tst
        app.kubernetes.io/component: controller
        efe.io/meta-swarm-role: controller
      annotations:
        # PR #13 AD4 : NO `checksum/config` ; reload is SIGHUP-driven.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tst-efe-meta-swarm-controller
      automountServiceAccountToken: false
      # PR #13 hardening — disable the automatic injection of
      # `<SVC_NAME>_SERVICE_HOST/_PORT` env vars from every Service
      # in the namespace.  Both security (smaller attack surface)
      # and hygiene (env vars stay predictable).
      enableServiceLinks: false
      # PR #14 — high priority so the controller survives resource
      # pressure ; default user pods (1000) get evicted first.
      # PR #14 audit pass — go through the trunc-safe helper to match
      # the PriorityClass cluster-scoped name.
      priorityClassName: tst-efe-meta-swarm-controller-priority
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "ghcr.io/efe-ai/efe-meta-swarm-server:0.3.0"
          imagePullPolicy: IfNotPresent
          args: ["controller"]
          ports:
            - name: grpc
              containerPort: 50080
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: EFE_META_SWARM_CONTROLLER_ADDR
              value: "0.0.0.0:50080"
            - name: EFE_META_SWARM_CONTROLLER_METRICS
              value: "0.0.0.0:9091"
            - name: EFE_META_SWARM_MANIFEST
              value: /etc/efe-meta-swarm/manifest.yaml
            - name: EFE_META_SWARM_PARTICIPANTS
              value: "supplier-scoring=tst-efe-meta-swarm-participant-supplier-scoring.efe.svc:50091,contract-risk=tst-efe-meta-swarm-participant-contract-risk.efe.svc:50092,spend-categorization=tst-efe-meta-swarm-participant-spend-categorization.efe.svc:50093"
            - name: EFE_META_SWARM_DISCOVERY
              value: "static-localhost"
            - name: EFE_META_SWARM_MAX_INFLIGHT
              value: "10"
            - name: EFE_META_SWARM_DEFAULT_MAX_WALL_MS
              value: "15000"
            - name: EFE_META_SWARM_WORKER_THREADS
              value: "2"
            - name: EFE_META_SWARM_RELOAD_DRAIN_TIMEOUT_S
              value: "30"
            - name: EFE_META_SWARM_REFLECTION
              value: "false"
            - name: EFE_META_SWARM_TLS_REQUIRED
              # PR #14 — when `tls.enabled: true`, the chart-side
              # cert-manager Certificate provisioning forces TLS on
              # the binary side regardless of the legacy
              # `controller.config.tlsRequired` knob.  PR #16 wires
              # the binary's tonic-tls integration.
              value: "false"
          resources:
            limits:
              cpu: 2
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            tcpSocket:
              port: 50080
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 50080
            timeoutSeconds: 3
          volumeMounts:
            - name: manifest
              mountPath: /etc/efe-meta-swarm
              readOnly: true
      volumes:
        - name: manifest
          configMap:
            name: tst-efe-meta-swarm-manifest
      terminationGracePeriodSeconds: 35
