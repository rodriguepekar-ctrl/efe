# PR #19 helm-unittest — Dashboards ConfigMap fan-out.
#
# Verifies :
#   - 9 ConfigMaps render, one per dashboard, when fully enabled.
#   - Every ConfigMap carries `grafana_dashboard=1` label (sidecar discovery).
#   - Every ConfigMap carries `efe.dashboard.uid=efe-msw-<base>` label.
#   - Datasource UID injection (Prometheus + Tempo) propagates from values.
#   - `dashboard.pr19.enabled=false` toggles the pack off cleanly.
suite: efe-meta-swarm PR #19 dashboards surface

templates:
  - pr19-dashboards-configmap.yaml

tests:

  - it: PR #19 dashboard pack NOT rendered when sub-chart disabled
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: PR #19 dashboard pack NOT rendered when dashboard.enabled=false
    set:
      enabled: true
      image: { tag: "test" }
      dashboard:
        enabled: false
        pr19: { enabled: true }
    asserts:
      - hasDocuments:
          count: 0

  - it: PR #19 dashboard pack NOT rendered when dashboard.pr19.enabled=false
    set:
      enabled: true
      image: { tag: "test" }
      dashboard:
        enabled: true
        pr19: { enabled: false }
    asserts:
      - hasDocuments:
          count: 0

  - it: PR #19 dashboard pack renders 9 ConfigMaps when fully enabled
    set:
      enabled: true
      image: { tag: "test" }
      dashboard:
        enabled: true
        pr19:
          enabled: true
          datasources:
            prometheusUid: prometheus
            tempoUid: tempo-efe
    asserts:
      - hasDocuments:
          count: 9

  - it: Every ConfigMap carries the sidecar discovery label grafana_dashboard=1
    set:
      enabled: true
      image: { tag: "test" }
      dashboard:
        enabled: true
        pr19: { enabled: true }
    asserts:
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
        documentIndex: 0
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
        documentIndex: 4
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
        documentIndex: 8
      - equal:
          path: metadata.annotations.grafana_folder
          value: "efe-meta-swarm"
        documentIndex: 0

  - it: STABILITY_CONTRACT v1.1 tier annotation is present
    set:
      enabled: true
      image: { tag: "test" }
      dashboard:
        enabled: true
        pr19: { enabled: true }
    asserts:
      - equal:
          path: metadata.annotations.efe\.stability_contract\.tier
          value: "Dashboard UID"
        documentIndex: 0
      - equal:
          path: metadata.annotations.efe\.stability_contract\.version
          value: "1.1"
        documentIndex: 0

  - it: efe.pr label tagged as "19" on all dashboard ConfigMaps
    set:
      enabled: true
      image: { tag: "test" }
      dashboard:
        enabled: true
        pr19: { enabled: true }
    asserts:
      - equal:
          path: metadata.labels.efe\.pr
          value: "19"
        documentIndex: 0
      - equal:
          path: metadata.labels.efe\.pr
          value: "19"
        documentIndex: 8

  - it: Every dashboard data key matches the dashboard file name
    set:
      enabled: true
      image: { tag: "test" }
      dashboard:
        enabled: true
        pr19: { enabled: true }
    asserts:
      # The Glob iteration is deterministic by sort order.  Asserting
      # one representative case is sufficient — the loop body is the
      # same for every iteration.
      - matchRegex:
          path: metadata.name
          pattern: "-dash-efe-msw-(overview|iterate|participant|reload|otel|tls|safety|runtime|traces)$"
        documentIndex: 0
