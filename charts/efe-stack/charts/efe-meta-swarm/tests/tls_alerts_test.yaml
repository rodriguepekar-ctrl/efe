# PR #16 § 21 — helm-unittest assertions for tls-prometheusrule.yaml.
#
# Covers :
#   AC22 — 3 alerts rendered when alerts.enabled + tls.enabled
#
suite: efe-meta-swarm TLS PrometheusRule alerts

templates:
  - tls-prometheusrule.yaml

tests:
  - it: PrometheusRule NOT rendered when alerts.enabled=false
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: false
      tls:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: PrometheusRule NOT rendered when tls.enabled=false
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: true
      tls:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: AC22 — 3 alerts when alerts.enabled + tls.enabled
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: true
        runbookBaseUrl: "https://efe.example.com/runbook/meta-swarm"
      tls:
        enabled: true
        rotation:
          alertExpiringHours: 168
          alertStuckHours: 1080
          alertHandshakeFailurePct: 1.0
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: apiVersion
          value: monitoring.coreos.com/v1
      - lengthEqual:
          path: spec.groups[0].rules
          count: 3
      - equal:
          path: spec.groups[0].rules[0].alert
          value: MetaSwarmTlsCertExpiringSoon
      - equal:
          path: spec.groups[0].rules[1].alert
          value: MetaSwarmTlsHandshakeFailureRate
      - equal:
          path: spec.groups[0].rules[2].alert
          value: MetaSwarmTlsRotationStuck

  - it: Severity labels match the architecture doc (warning/critical/warning)
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: true
      tls:
        enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: warning
      - equal:
          path: spec.groups[0].rules[1].labels.severity
          value: critical
      - equal:
          path: spec.groups[0].rules[2].labels.severity
          value: warning

  - it: PromQL uses the configured alertExpiringHours threshold
    set:
      enabled: true
      image:
        tag: "test"
      alerts:
        enabled: true
      tls:
        enabled: true
        rotation:
          alertExpiringHours: 72                   # 3-day window override
          alertStuckHours: 1080
          alertHandshakeFailurePct: 1.0
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: ".*< 72 \\* 3600.*"
