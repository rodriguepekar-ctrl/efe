# efe-nats sub-chart values. Merged under `efe-nats` key in the
# umbrella `charts/efe-stack/values.yaml`.

enabled: false  # opt-in : flip to true when the cluster is M28-ready.

# ── NATS server ───────────────────────────────────────────────────────
nats:
  replicas: 3   # Raft requires ≥ 3 for HA
  image:
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  service:
    type: ClusterIP
    clientPort: 4222
    monitoringPort: 8222
    clusterPort: 6222
    leafnodesPort: 7422
  # JetStream global limits — per-stream limits are set when a stream
  # is auto-created by the publisher (efe-events ensure_*_stream).
  jetstream:
    enabled: true
    maxMemoryStore: "1Gi"
    maxFileStore: "15Gi"

# ── Authentication ────────────────────────────────────────────────────
auth:
  enabled: true
  # Pre-existing Secret containing the NATS issuer JWK + per-pod creds.
  # Created out-of-band by SRE (`nats-server generate` + `nsc`).
  secretName: efe-nats-creds
  # Default user for in-cluster pods. ACL is defined in the configmap.
  user: "efe-svc"

# ── NetworkPolicy ────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # Pods allowed to reach NATS client port (4222) :
  upstreamNamespace: efe-system
