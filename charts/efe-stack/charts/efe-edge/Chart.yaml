apiVersion: v2
name: efe-edge
description: |
  M27 Commercial Edge sub-chart — Envoy API gateway, Lyft ratelimit-service,
  Redis Cluster (3 master + 3 replica), and PgBouncer. Sits between
  Cloudflare (configured via Terraform) and the existing `efe-server`
  pods, providing edge auth, distributed rate limit, hot caches, and
  PG connection pooling.
type: application
version: 0.1.0
appVersion: "2.2.0"
keywords:
