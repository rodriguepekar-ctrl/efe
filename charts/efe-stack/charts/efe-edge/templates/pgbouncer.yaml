{{- if and .Values.enabled .Values.pgbouncer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe-edge.fullname" . }}-pgbouncer
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
data:
  pgbouncer.ini: |
    [databases]
    efe = host={{ .Values.pgbouncer.upstream.host }} port={{ .Values.pgbouncer.upstream.port }} dbname={{ .Values.pgbouncer.upstream.database }} pool_size={{ .Values.pgbouncer.config.poolSize }} reserve_pool_size={{ .Values.pgbouncer.config.reservePoolSize }}
    efe_ro = host={{ .Values.pgbouncer.upstream.readReplicaHost }} port={{ .Values.pgbouncer.upstream.readReplicaPort }} dbname={{ .Values.pgbouncer.upstream.database }} pool_size={{ mul .Values.pgbouncer.config.poolSize 2 }} reserve_pool_size={{ .Values.pgbouncer.config.reservePoolSize }}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = {{ .Values.pgbouncer.config.poolMode }}
    max_client_conn = {{ .Values.pgbouncer.config.maxClientConn }}
    default_pool_size = {{ .Values.pgbouncer.config.poolSize }}
    reserve_pool_size = {{ .Values.pgbouncer.config.reservePoolSize }}
    reserve_pool_timeout = {{ .Values.pgbouncer.config.reservePoolTimeout }}
    query_timeout = {{ .Values.pgbouncer.config.queryTimeout }}
    query_wait_timeout = {{ .Values.pgbouncer.config.queryWaitTimeout }}
    server_idle_timeout = {{ .Values.pgbouncer.config.serverIdleTimeout }}
    server_lifetime = {{ .Values.pgbouncer.config.serverLifetime }}
    server_reset_query = {{ .Values.pgbouncer.config.serverResetQuery | quote }}
    stats_period = 60
    log_connections = 0
    log_disconnections = 0
    admin_users = pgbouncer_admin
    stats_users = pgbouncer_stats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efe-edge.fullname" . }}-pgbouncer
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      {{- include "efe-edge.pgbouncer.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "efe-edge.pgbouncer.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/pgbouncer.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # postgres in edoburu/pgbouncer
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "efe-edge.pgbouncer.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pgbouncer
          image: "{{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}"
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          ports:
            - name: pgbouncer
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: userlist
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "efe-edge.fullname" . }}-pgbouncer
        - name: userlist
          secret:
            secretName: {{ .Values.pgbouncer.auth.userlistSecret }}
            items:
              - key: {{ .Values.pgbouncer.auth.userlistKey }}
                path: userlist.txt
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-edge.fullname" . }}-pgbouncer
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: pgbouncer
      protocol: TCP
      appProtocol: postgresql
  selector:
    {{- include "efe-edge.pgbouncer.selectorLabels" . | nindent 4 }}
{{- end }}
