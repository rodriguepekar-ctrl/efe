{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# Default-deny + selective allow for Envoy + ratelimit + Redis + PgBouncer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-edge.fullname" . }}-envoy
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "efe-edge.envoy.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Inbound : only from cloudflared (Argo Tunnel) or in-cluster
    # health probes (allow internal monitoring tools).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.edgeNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.envoy.service.port }}
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              prometheus: kube-prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.envoy.service.adminPort }}
  egress:
    # Outbound : efe-server (upstream).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.upstreamNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.envoy.upstream.grpcPort }}
        - protocol: TCP
          port: {{ .Values.envoy.upstream.restPort }}
        - protocol: TCP
          port: {{ .Values.envoy.upstream.agentRestPort }}
    # Outbound : ratelimit-service.
    - to:
        - podSelector:
            matchLabels:
              {{- include "efe-edge.ratelimit.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8081
    # Outbound : Redis (for jwt_authn revocation list).
    - to:
        - podSelector:
            matchLabels:
              {{- include "efe-edge.redis.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
    # Outbound : JWKS (external HTTPS to OIDC issuer).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-edge.fullname" . }}-redis
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "efe-edge.redis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # From Envoy + ratelimit + efe-server.
    - from:
        - podSelector:
            matchLabels:
              {{- include "efe-edge.envoy.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "efe-edge.ratelimit.selectorLabels" . | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.upstreamNamespace }}
      ports:
        - protocol: TCP
          port: 6379
    # Cluster bus.
    - from:
        - podSelector:
            matchLabels:
              {{- include "efe-edge.redis.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 16379
  egress:
    # Cluster bus
    - to:
        - podSelector:
            matchLabels:
              {{- include "efe-edge.redis.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 16379
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
