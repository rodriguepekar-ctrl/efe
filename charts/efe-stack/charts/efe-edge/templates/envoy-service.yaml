{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-edge.fullname" . }}-envoy
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.envoy.service.type }}
  ports:
    - name: https
      port: {{ .Values.envoy.service.port }}
      targetPort: https
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "efe-edge.envoy.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if and .Values.enabled .Values.envoy.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "efe-edge.fullname" . }}-envoy
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "efe-edge.fullname" . }}-envoy
  minReplicas: {{ .Values.envoy.hpa.minReplicas }}
  maxReplicas: {{ .Values.envoy.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.envoy.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- if and .Values.enabled .Values.envoy.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "efe-edge.fullname" . }}-envoy
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.envoy.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "efe-edge.envoy.selectorLabels" . | nindent 6 }}
{{- end }}
