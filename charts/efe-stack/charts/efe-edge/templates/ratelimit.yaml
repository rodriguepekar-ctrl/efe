{{- if and .Values.enabled .Values.ratelimit.enabled }}
# Lyft ratelimit-service : the gRPC backend Envoy calls into for
# distributed token-bucket decisions. State lives in Redis.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe-edge.fullname" . }}-ratelimit
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.ratelimit.defaultDescriptor | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efe-edge.fullname" . }}-ratelimit
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ratelimit.replicas }}
  selector:
    matchLabels:
      {{- include "efe-edge.ratelimit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "efe-edge.ratelimit.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ tpl (toYaml .Values.ratelimit.defaultDescriptor) . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ratelimit
          image: "{{ .Values.ratelimit.image.repository }}:{{ .Values.ratelimit.image.tag }}"
          imagePullPolicy: {{ .Values.ratelimit.image.pullPolicy }}
          command: ["/bin/ratelimit"]
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: USE_STATSD
              value: "false"
            - name: RUNTIME_ROOT
              value: "/data"
            - name: RUNTIME_SUBDIRECTORY
              value: "ratelimit"
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: RUNTIME_IGNOREDOTFILES
              value: "true"
            - name: REDIS_SOCKET_TYPE
              value: "tcp"
            - name: REDIS_URL
              value: "{{ include "efe-edge.fullname" . }}-redis:6379"
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.passwordSecret }}
                  key: {{ .Values.redis.auth.passwordKey }}
                  optional: true
            - name: REDIS_PIPELINE_WINDOW
              value: "10ms"
            - name: REDIS_PIPELINE_LIMIT
              value: "100"
            - name: REDIS_POOL_SIZE
              value: "10"
            - name: USE_PROMETHEUS
              value: "true"
            - name: PROMETHEUS_ADDR
              value: ":9090"
            - name: PORT
              value: "8080"
            - name: GRPC_PORT
              value: "8081"
            - name: GRPC_SERVER_USE_TLS
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ratelimit.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "efe-edge.fullname" . }}-ratelimit
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-edge.fullname" . }}-ratelimit
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "efe-edge.ratelimit.selectorLabels" . | nindent 4 }}
{{- end }}
