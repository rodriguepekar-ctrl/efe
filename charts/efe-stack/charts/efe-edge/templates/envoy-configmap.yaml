{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe-edge.fullname" . }}-envoy
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    # M27 — Envoy bootstrap for EFE Commercial Edge.
    node:
      id: efe-envoy-${HOSTNAME}
      cluster: efe-edge

    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{ .Values.envoy.service.adminPort }}

    static_resources:
      listeners:
        - name: listener_https
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.envoy.service.port }}
          listener_filters:
            - name: envoy.filters.listener.tls_inspector
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              start_time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                              status: "%RESPONSE_CODE%"
                              dur_ms: "%DURATION%"
                              corr_id: "%REQ(X-CORRELATION-ID)%"
                              tenant: "%REQ(X-TENANT-ID)%"
                              ua: "%REQ(USER-AGENT)%"
                              src_ip: "%REQ(CF-CONNECTING-IP)%"
                              upstream: "%UPSTREAM_HOST%"
                              upstream_cluster: "%UPSTREAM_CLUSTER%"
                    common_http_protocol_options:
                      idle_timeout: 60s
                      max_connection_duration: 300s
                      max_stream_duration: 60s
                    http2_protocol_options:
                      max_concurrent_streams: 100
                    route_config:
                      name: edge_routes
                      virtual_hosts:
                        - name: efe_api
                          domains: ["*"]
                          routes:
                            # gRPC
                            - match:
                                prefix: "/efe.v1."
                                grpc: {}
                              route:
                                cluster: efe-server-grpc
                                timeout: 30s
                              rate_limits:
                                - actions:
                                    - generic_key:
                                        descriptor_value: "v1_per_tenant"
                                    - request_headers:
                                        header_name: x-tenant-id
                                        descriptor_key: "tenant"
                            - match:
                                prefix: "/efe.agent_runtime.v1."
                                grpc: {}
                              route:
                                cluster: efe-server-grpc
                                timeout: 60s
                            # REST agent — M26 + M27 wired to port 8088.
                            - match:
                                prefix: "/v1/agent/"
                                headers:
                                  - name: ":path"
                                    string_match:
                                      contains: "/stream"
                              route:
                                cluster: efe-server-agent-rest
                                timeout: 0s         # SSE no timeout
                            - match:
                                prefix: "/v1/agent/"
                              route:
                                cluster: efe-server-agent-rest
                                timeout: 30s
                            # Auth (unauthenticated)
                            - match:
                                prefix: "/v1/auth/"
                              route:
                                cluster: efe-server-rest
                                timeout: 10s
                            # Healthz
                            - match:
                                path: "/healthz"
                              route:
                                cluster: efe-server-rest
                            # Catch-all v1
                            - match:
                                prefix: "/v1/"
                              route:
                                cluster: efe-server-rest
                                timeout: 30s
                              rate_limits:
                                - actions:
                                    - generic_key:
                                        descriptor_value: "v1_per_tenant"
                                    - request_headers:
                                        header_name: x-tenant-id
                                        descriptor_key: "tenant"
                            # v2 placeholder (410 Gone)
                            - match:
                                prefix: "/v2/"
                              direct_response:
                                status: 410
                                body:
                                  inline_string: '{"error":"v2_not_yet_available"}'
                            # Default 404
                            - match:
                                prefix: "/"
                              direct_response:
                                status: 404
                                body:
                                  inline_string: '{"error":"not_found"}'
                    http_filters:
                      # 1. CORS
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      # 2. JWT auth
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            efe_oidc:
                              issuer: {{ .Values.envoy.oidc.issuer | quote }}
                              audiences:
                                {{- range .Values.envoy.oidc.audiences }}
                                - {{ . | quote }}
                                {{- end }}
                              remote_jwks:
                                http_uri:
                                  uri: {{ .Values.envoy.oidc.jwksUri | quote }}
                                  cluster: jwks-cache
                                  timeout: 5s
                                cache_duration: 600s
                              forward: true
                              forward_payload_header: x-jwt-payload
                              payload_in_metadata: jwt_payload
                              claim_to_headers:
                                - header_name: x-token-sub
                                  claim_name: sub
                                - header_name: x-tenant-id
                                  claim_name: tenant
                                - header_name: x-roles
                                  claim_name: roles
                          rules:
                            - match: { prefix: "/healthz" }
                            - match: { prefix: "/v1/auth/" }
                            - match: { prefix: "/v1/" }
                              requires: { provider_name: efe_oidc }
                            - match: { prefix: "/v2/" }
                              requires: { provider_name: efe_oidc }
                            - match: { prefix: "/efe." }
                              requires: { provider_name: efe_oidc }
                      # 3. Distributed rate limit
                      - name: envoy.filters.http.ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                          domain: efe_edge
                          failure_mode_deny: false
                          rate_limited_as_resource_exhausted: true
                          rate_limit_service:
                            transport_api_version: V3
                            grpc_service:
                              envoy_grpc:
                                cluster_name: ratelimit-service
                              timeout: 0.25s
                      # 4. Local fallback ratelimit
                      - name: envoy.filters.http.local_ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: http_local_rate_limiter
                          token_bucket:
                            max_tokens: 10000
                            tokens_per_fill: 10000
                            fill_interval: 60s
                          filter_enabled:
                            default_value: { numerator: 100, denominator: HUNDRED }
                          filter_enforced:
                            default_value: { numerator: 100, denominator: HUNDRED }
                      # 5. Router
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: efe-server-grpc
          connect_timeout: 1s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: efe-server-grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.envoy.upstream.grpcCluster }}
                          port_value: {{ .Values.envoy.upstream.grpcPort }}

        - name: efe-server-rest
          connect_timeout: 1s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: efe-server-rest
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.envoy.upstream.restCluster }}
                          port_value: {{ .Values.envoy.upstream.restPort }}

        - name: efe-server-agent-rest
          connect_timeout: 1s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: efe-server-agent-rest
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.envoy.upstream.agentRestCluster }}
                          port_value: {{ .Values.envoy.upstream.agentRestPort }}

        - name: ratelimit-service
          connect_timeout: 0.25s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: ratelimit-service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "efe-edge.fullname" . }}-ratelimit
                          port_value: 8081

        - name: jwks-cache
          connect_timeout: 5s
          type: LOGICAL_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: jwks-cache
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: oidc.efe.ai
                          port_value: 443
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: oidc.efe.ai

    overload_manager:
      refresh_interval: 0.25s
      resource_monitors:
        - name: "envoy.resource_monitors.fixed_heap"
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
            max_heap_size_bytes: 805306368
      actions:
        - name: "envoy.overload_actions.shrink_heap"
          triggers:
            - name: "envoy.resource_monitors.fixed_heap"
              threshold: { value: 0.9 }
        - name: "envoy.overload_actions.stop_accepting_requests"
          triggers:
            - name: "envoy.resource_monitors.fixed_heap"
              threshold: { value: 0.95 }

    stats_sinks:
      - name: envoy.stat_sinks.metrics_service
        typed_config:
          "@type": type.googleapis.com/envoy.config.metrics.v3.MetricsServiceConfig
{{- end }}
