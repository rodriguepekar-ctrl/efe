{{- if and .Values.enabled .Values.cloudflared.enabled }}
# cloudflared — Argo Tunnel daemon. Connects to the Cloudflare edge and
# routes inbound traffic to the in-cluster Envoy gateway. Removes the
# need for a public origin IP (scan-immune).
#
# Runs as a Deployment with 2 replicas (HA) ; not a DaemonSet because
# only the edge of the edge needs tunnels, not every node. Replicas
# are independent connections to CF and the tunnel auto-load-balances.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe-edge.fullname" . }}-cloudflared
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
data:
  config.yaml: |
    tunnel: {{ .Values.cloudflared.tunnelId | quote }}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: {{ .Values.cloudflared.publicHostname | quote }}
        service: http://{{ include "efe-edge.fullname" . }}-envoy:{{ .Values.envoy.service.port }}
        originRequest:
          noTLSVerify: true
          connectTimeout: 5s
          tlsTimeout: 5s
          keepAliveTimeout: 90s
          keepAliveConnections: 100
          http2Origin: true
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efe-edge.fullname" . }}-cloudflared
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: {{ .Values.cloudflared.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: efe-cloudflared
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: efe-cloudflared
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2000"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/cloudflared.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: efe-cloudflared
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy }}
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "efe-edge.fullname" . }}-cloudflared
        - name: creds
          secret:
            secretName: {{ .Values.cloudflared.credentialsSecret }}
            items:
              - key: credentials.json
                path: credentials.json
---
# Allow cloudflared to reach the Envoy service in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-edge.fullname" . }}-cloudflared
  labels:
    {{- include "efe-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: efe-cloudflared
  policyTypes: [Egress]
  egress:
    # To Envoy
    - to:
        - podSelector:
            matchLabels:
              {{- include "efe-edge.envoy.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.envoy.service.port }}
    # To Cloudflare edge (anywhere on TCP 443/7844)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 7844         # cloudflared egress port
        - protocol: UDP
          port: 7844
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
