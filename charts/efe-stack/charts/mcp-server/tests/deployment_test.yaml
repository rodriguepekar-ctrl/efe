suite: mcp-server deployment tests
templates:
  - deployment.yaml
release:
  name: test
  namespace: efe-test
chart:
  appVersion: 1.6.0
tests:
  - it: should render with default values
    set:
      global.tenant: acme
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].name
          value: mcp-server

  - it: respects profile setting
    set:
      global.tenant: acme
      profile: agent-native-deploy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EFE_MCP_TOOL_PROFILE
            value: agent-native-deploy

  - it: points to efe-server backend in same release
    set:
      global.tenant: acme
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EFE_BACKEND_GRPC_URL
            value: http://test-mcp-server-efe-server.efe-test.svc.cluster.local:50051
        not: true                       # release name is "test", efe-server suffix differs
      - matchRegex:
          path: spec.template.spec.containers[0].env[1].value
          pattern: "^http://test-efe-server\\."

  - it: skips when enabled=false
    set:
      global.tenant: acme
      enabled: false
    asserts:
      - hasDocuments:
          count: 0
