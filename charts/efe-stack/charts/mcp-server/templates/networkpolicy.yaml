{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-server.fullname" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # External clients (via ingress).
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpPort | default 8800 }}
    # portal-admin can call mcp-server tools.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-admin
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpPort | default 8800 }}
    # Prometheus scrape metrics.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.service.metricsPort | default 9091 }}
  egress:
    # efe-server backend gRPC.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: efe-server
      ports:
        - protocol: TCP
          port: 50051
    # DNS.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
