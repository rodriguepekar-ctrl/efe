{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-server.fullname" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort | default 8800 }}
      targetPort: http
      protocol: TCP
      appProtocol: http
    - name: metrics
      port: {{ .Values.service.metricsPort | default 9091 }}
      targetPort: metrics
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "mcp-server.selectorLabels" . | nindent 4 }}
{{- end }}
