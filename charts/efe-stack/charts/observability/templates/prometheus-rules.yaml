{{- if and .Values.enabled .Values.prometheus.alertRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: efe-alerts
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: efe.critical
      interval: 30s
      rules:
        # RB-01 : Postgres data volume saturation.
        - alert: EfePostgresDiskFull
          expr: |
            (kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"data-efe-postgres-.*"}
             / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"data-efe-postgres-.*"}) > 0.85
          for: 5m
          labels:
            severity: P1
            runbook: RB-01
          annotations:
            summary: "Postgres data volume > 85% full ({{`{{ $labels.persistentvolumeclaim }}`}})"
            description: "Postgres PVC is nearing capacity. Consult RB-01."
            runbook_url: "https://efe.example.com/docs/runbooks/RUNBOOK_RB_01_DB_DISK_FULL"

        # RB-02 : LLM circuit breaker open.
        - alert: EfeLlmBreakerOpen
          expr: increase(efe_llm_breaker_state{state="open"}[5m]) > 0
          for: 5m
          labels:
            severity: P2
            runbook: RB-02
          annotations:
            summary: "LLM circuit breaker open for provider {{`{{ $labels.provider }}`}}"
            description: "Mode-2 / Mode-3 calls degraded. Consult RB-02."
            runbook_url: "https://efe.example.com/docs/runbooks/RUNBOOK_RB_02_LLM_BREAKER_OPEN"

        # RB-03 : Audit chain HMAC broken (P0).
        - alert: EfeAuditChainBroken
          expr: efe_audit_chain_verify_failure_total > 0
          for: 1m
          labels:
            severity: P0
            runbook: RB-03
          annotations:
            summary: "Audit chain HMAC verification FAILED at audit_id={{`{{ $labels.first_broken_id }}`}}"
            description: "GDPR Art. 22 / Art. 33 implications. Page CTO + DPO immediately."
            runbook_url: "https://efe.example.com/docs/runbooks/RUNBOOK_RB_03_AUDIT_CHAIN_BROKEN"

        # RB-04 : abnormal KMS BYOK key activity (sentinel).
        - alert: EfeKmsByokAbnormalActivity
          expr: |
            rate(efe_byok_decrypt_failures_total[5m]) > 0.1
          for: 5m
          labels:
            severity: P0
            runbook: RB-04
          annotations:
            summary: "Abnormal BYOK decrypt failure rate ({{`{{ $value }}`}}/s)"
            description: "Investigate KMS key compromise. Consult RB-04."
            runbook_url: "https://efe.example.com/docs/runbooks/RUNBOOK_RB_04_KMS_BYOK_ROTATION"

        # RB-05 : Tenant BudgetExhausted.
        - alert: EfeTenantBudgetExhausted
          expr: efe_tenant_budget_remaining_usd <= 0
          for: 10m
          labels:
            severity: P3
            runbook: RB-05
          annotations:
            summary: "Tenant {{`{{ $labels.tenant }}`}} budget exhausted"
            description: "Mode-2 / Mode-3 calls failing for tenant. Account exec follow-up."
            runbook_url: "https://efe.example.com/docs/runbooks/RUNBOOK_RB_05_BUDGET_EXHAUSTED"

        # RB-06 : efe-server CrashLoopBackOff.
        - alert: EfeServerCrashLoopBackOff
          expr: rate(kube_pod_container_status_restarts_total{container="efe-server"}[15m]) > 0.5
          for: 10m
          labels:
            severity: P1
            runbook: RB-06
          annotations:
            summary: "efe-server pod {{`{{ $labels.pod }}`}} CrashLoopBackOff"
            description: "Restart rate > 0.5/min over last 15 min. Consult RB-06."
            runbook_url: "https://efe.example.com/docs/runbooks/RUNBOOK_RB_06_CRASH_LOOP"

    - name: efe.warning
      interval: 60s
      rules:
        - alert: EfeClassifyP99HighLatency
          expr: histogram_quantile(0.99, sum(rate(efe_classify_duration_ms_bucket[5m])) by (le)) > 500
          for: 10m
          labels:
            severity: P2
          annotations:
            summary: "p99 classify latency > 500ms"
            description: "Performance degradation detected on classify pipeline."

        - alert: EfeMode3ConvergenceRateLow
          expr: |
            sum(rate(efe_mode3_calls_total{converged="true"}[1h])) /
            sum(rate(efe_mode3_calls_total[1h])) < 0.7
          for: 30m
          labels:
            severity: P3
          annotations:
            summary: "Mode-3 convergence rate < 70%"
            description: "Many Mode-3 calls hitting max_turns ; review queue likely growing."
{{- end }}
