{{- if and .Values.enabled .Values.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: efe-server
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: efe-server
  endpoints:
    - port: metrics
      interval: {{ .Values.prometheus.scrapeInterval | default "15s" }}
      path: /metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
---
