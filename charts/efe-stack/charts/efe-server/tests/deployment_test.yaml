suite: efe-server deployment tests
templates:
  - deployment.yaml
release:
  name: test
  namespace: efe-test
chart:
  appVersion: 1.6.0
tests:
  - it: should render with default values
    set:
      global.tenant: acme
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.containers[0].name
          value: efe-server
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "ghcr\\.io/efe-ai/efe-server:1\\.6\\.[0-9]+"

  - it: respects replicas override
    set:
      global.tenant: acme
      replicas: 7
    asserts:
      - equal:
          path: spec.replicas
          value: 7

  - it: includes audit HMAC seed env
    set:
      global.tenant: acme
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EFE_AUDIT_HMAC_SEED
            valueFrom:
              secretKeyRef:
                name: efe-audit-hmac
                key: seed

  - it: enforces nonroot security context
    set:
      global.tenant: acme
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532

  - it: drops all capabilities
    set:
      global.tenant: acme
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]

  - it: sets readOnlyRootFilesystem
    set:
      global.tenant: acme
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: includes prometheus scrape annotations
    set:
      global.tenant: acme
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9090"

  - it: skips when enabled=false
    set:
      global.tenant: acme
      enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses external Postgres secret when configured
    set:
      global.tenant: acme
      global.externalPostgres.enabled: true
      global.externalPostgres.secretRef.name: my-pg-external
      global.externalPostgres.secretRef.key: dburl
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EFE_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: my-pg-external
                key: dburl
