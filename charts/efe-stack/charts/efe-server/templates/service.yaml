{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-server.fullname" . }}
  labels:
    {{- include "efe-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort | default 50051 }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
    - name: metrics
      port: {{ .Values.service.metricsPort | default 9090 }}
      targetPort: metrics
      protocol: TCP
      appProtocol: http
    - name: health
      port: {{ .Values.service.healthPort | default 8081 }}
      targetPort: health
      protocol: TCP
      appProtocol: http
    {{- if .Values.agentRestGateway.enabled }}
    # D93 — M26 REST gateway /v1/agent/*. Mounted on a dedicated port so
    # callers can target it via service DNS without hitting gRPC or
    # the health-probe sidecar.
    - name: agent-rest
      port: {{ .Values.service.agentRestPort | default 8088 }}
      targetPort: agent-rest
      protocol: TCP
      appProtocol: http
    {{- end }}
  selector:
    {{- include "efe-server.selectorLabels" . | nindent 4 }}
{{- end }}
