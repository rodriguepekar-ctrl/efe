{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe-server.fullname" . }}
  labels:
    {{- include "efe-server.labels" . | nindent 4 }}
data:
  EFE_BYOK_BACKEND: {{ .Values.byok.backend | quote }}
  {{- if eq .Values.byok.backend "aws-kms" }}
  EFE_BYOK_AWS_KMS_KEY_ID: {{ .Values.byok.awsKmsKeyId | quote }}
  {{- end }}
  EFE_FEATURE_M20_HELPER_TOOLS_ENABLED: {{ .Values.features.m20HelperToolsEnabled | quote }}
  EFE_FEATURE_M21_MODE2_ENABLED: {{ .Values.features.m21Mode2Enabled | quote }}
  EFE_FEATURE_M22_MODE3_ENABLED: {{ .Values.features.m22Mode3Enabled | quote }}
  EFE_FEATURE_D8_ADMIN_ENABLED: {{ .Values.features.d8AdminEnabled | quote }}
  EFE_TENANT_SLUG: {{ .Values.global.tenant | quote }}
  EFE_ENVIRONMENT: {{ .Values.global.environment | default "prod" | quote }}
{{- end }}
