{{- /*
  Clé HKDF de provenance (server-side). SIGNE la chaîne ; n'authentifie AUCUN provider.
  - existingSecret défini  → on n'émet rien (Vault/externalSecrets gère).
  - sinon → on génère une clé aléatoire au 1er install, CONSERVÉE aux upgrades (lookup).
  Ce n'est JAMAIS une clé d'API provider.
*/ -}}
{{- if and .Values.hkdf.enabled (not .Values.hkdf.existingSecret) -}}
{{- $name := include "efe-swarm-gateway.hkdfSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $master := "" -}}
{{- if and $existing $existing.data (index $existing.data "master") -}}
{{- $master = index $existing.data "master" -}}
{{- else -}}
{{- $master = randAlphaNum 64 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "efe-swarm-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep   # ne pas détruire la clé à l'uninstall (re-preuve historique)
type: Opaque
data:
  master: {{ $master | quote }}
{{- end }}
