{{- if and .Values.ollama.enabled .Values.ollama.provision.enabled .Values.ollama.persistence.enabled -}}
{{- $fullName := include "efe-swarm-gateway.fullname" . -}}
{{- $claim := .Values.ollama.persistence.existingClaim | default (printf "%s-ollama-models" $fullName) -}}
---
# Provisionne les modèles dans le PVC AVANT le runtime. NÉCESSITE un egress TEMPORAIRE
# (pull depuis le registre Ollama). Le runtime, lui, reste egress=deny (souverain).
# En air-gap strict : laissez provision.enabled=false et pré-chargez le PVC hors-bande.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-provision
  labels:
    {{- include "efe-swarm-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.ollama.provision.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "efe-swarm-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: provision
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: provision
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          env:
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "→ démarrage du daemon Ollama pour le provisioning…"
              ollama serve &
              PID=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              {{- range .Values.ollama.models }}
              echo "→ ollama pull {{ . }}"
              ollama pull {{ . | quote }}
              {{- end }}
              echo "✓ modèles provisionnés dans le PVC ; arrêt du daemon."
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: {{ $claim }}
{{- if .Values.ollama.provision.allowEgress }}
---
# NetworkPolicy DÉDIÉE au Job de provisioning : autorise l'egress (pull des modèles).
# Distincte du runtime egress=deny — la souveraineté du runtime n'est pas affaiblie.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-provision
  labels:
    {{- include "efe-swarm-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "efe-swarm-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: provision
  policyTypes:
    - Egress
  egress:
    - {}   # provisioning : egress ouvert (temporaire, le temps du pull)
{{- end }}
{{- end }}
