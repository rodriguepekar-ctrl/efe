{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "efe-swarm-gateway.fullname" . }}
  labels:
    {{- include "efe-swarm-gateway.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels:
      {{- include "efe-swarm-gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
  # /metrics expose : efe_swarm_prov_* (provenance) · swarm_* (substrat) · efe_swarm_dash_*
  # (dashboard live). Agrégés sur tous les runs du tenant.
{{- end }}
