{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy -}}
{{- $hasRouter := and .Values.router.enabled .Values.router.egressToNamespace -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-swarm-gateway.fullname" . }}
  labels:
    {{- include "efe-swarm-gateway.labels" . | nindent 4 }}
  annotations:
    # LE garde-fou de souveraineté à la couche cluster : par défaut ce pod ne peut PAS
    # joindre l'extérieur (egress=deny). Complète le garde-fou applicatif (build_local_backend
    # refuse un endpoint non-local). Défense en profondeur : egress=0 prouvé deux fois.
    efe.ai/sovereignty: "egress=deny"
spec:
  podSelector:
    matchLabels:
      {{- include "efe-swarm-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # ── INGRESS : qui peut atteindre la passerelle (port {{ .Values.gateway.port }}) ──
  ingress:
    - from:
        {{- if $np.ingress.allowSameNamespace }}
        # Tout pod du namespace courant (resserrez via fromPodSelectors en prod).
        - podSelector: {}
        {{- end }}
        {{- range $np.ingress.fromNamespaceSelectors }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- range $np.ingress.fromPodSelectors }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
  # ── EGRESS : SOUVERAIN — deny-all par défaut ; on n'ouvre que le strict nécessaire ──
  {{- if or $np.egress.allowDns $hasRouter $np.egress.extra }}
  egress:
    {{- if $np.egress.allowDns }}
    # DNS du cluster uniquement (résolution de Services internes). Aucun egress Internet.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.egress.dnsNamespaceSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if $hasRouter }}
    # Mode Network (OPT-IN, NON souverain) : egress vers le routeur frontière server-side.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.router.egressToNamespace | quote }}
      ports:
        {{- range .Values.router.egressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with $np.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  # Aucune règle d'egress → DENY-ALL total (souveraineté maximale / air-gap).
  egress: []
  {{- end }}
{{- end }}
