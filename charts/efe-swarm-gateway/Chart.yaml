apiVersion: v2
name: efe-swarm-gateway
description: |
  EFE — Phase 5 : passerelle d'essaim souveraine (self-host keyless, le mode phare).

  Déploie `efe-swarm-gateway` (POST /v1/swarm/run · GET /v1/swarm/verify/:id — le moat ·
  /metrics · /dashboard live) avec un **sidecar Ollama** (modèle LOCAL, boucle locale
  127.0.0.1) et une **NetworkPolicy egress=deny** : la souveraineté prouvée à la couche
  cluster (défense en profondeur avec le garde-fou applicatif G2).

  Souverain (rien ne sort de l'hôte) · local (zéro clé, zéro egress) · vérifiable
  (re-preuve hors-ligne) — ce qu'aucun provider hébergé n'offre.

  ⚠️ Aucune clé provider. La seule clé est la HKDF de provenance (Secret server-side),
  qui SIGNE la chaîne — elle n'authentifie aucun provider.
type: application
