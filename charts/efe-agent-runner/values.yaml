# Default values for efe-agent-runner.
# Production deployments MUST override:
#   - imageWhitelist (cosign-verified pinned digests)
#   - kvm.required (true on bare-metal nodes)
#   - egress.allowedHosts (per tenant via ConfigMap)

nameOverride: ""
fullnameOverride: ""

# ── Feature flag ──────────────────────────────────────────────────
# Master switch. Default OFF. The Rust binary refuses to start the
# reconcile loop until this is true *and* DPIA is signed for the tenant.
agentRuntimeEnabled: false

# ── Image ──────────────────────────────────────────────────────────
controller:
  image:
    repository: ghcr.io/efe-ai/efe-agent-runner
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  replicas: 2     # M26 : HA replicas + PDB
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  serviceAccount:
    create: true
    name: efe-agent-runner

agentCore:
  # MUST be set to a cosign-verified pinned digest in production.
  image:
    repository: ghcr.io/efe-ai/agent-core
    digest: ""  # e.g. sha256:abcd... (REQUIRED in prod)
  cosign:
    keyRef: ""  # KMS key ref or PEM path

# ── Image whitelist ────────────────────────────────────────────────
# Comma-separated repo@digest list. Loaded into env
# EFE_M25_IMAGE_WHITELIST. Empty → reject everything.
imageWhitelist: ""

# ── KVM / Firecracker ──────────────────────────────────────────────
kvm:
  required: true
  hostPath: /dev/kvm
firecracker:
  binaryPath: /usr/local/bin/firecracker
  kernelPath: /opt/efe/firecracker/vmlinux
  udsDir: /var/run/firecracker

# ── Network egress ─────────────────────────────────────────────────
egress:
  allowDns: true
  allowLlmRouter: true
  allowMcpServer: true
  allowedHosts: []     # FQDN list via egress proxy with TLS pinning

# ── Database ───────────────────────────────────────────────────────
database:
  url: ""              # postgres://... (provided by efe-server config)
  existingSecret: efe-server-postgres
  existingSecretKey: dsn

# ── Audit ──────────────────────────────────────────────────────────
audit:
  hmacKeySecret: efe-audit-hmac-key
  hmacKeySecretKey: key
approval:
  hmacKeySecret: efe-approval-hmac-key
  hmacKeySecretKey: key

# ── Sunset clause ──────────────────────────────────────────────────
sunset:
  enabled: true
  evaluateAtMonths: 12
  minActiveTenants: 2

# ── CRDs (installed by the install hook) ───────────────────────────
crds:
  install: true

# ── Admission webhook ──────────────────────────────────────────────
# M26 : ENABLED by default for STABLE channel. Webhook server runs as
# a sidecar HTTPS endpoint in the controller pod (port 8443).
# cert-manager auto-rotates the TLS cert every 90 days.
admissionWebhook:
  enabled: true
  failurePolicy: Fail
  certManager:
    enabled: true
    # Production : reference a pre-existing ClusterIssuer that signs
    # against your corporate CA. Override at install time.
    issuerRef: efe-ca-issuer
    # D93 — bootstrap mode : `true` provisions a self-signed Issuer in
    # the release namespace and uses it instead of `issuerRef`. Right
    # for k3d, local dev, or fresh clusters without a CA. Production
    # MUST set `false` and use a real ClusterIssuer.
    bootstrap: false

# ── vsock-relayer (M26) ────────────────────────────────────────────
vsockRelayer:
  enabled: true
  image:
    repository: ghcr.io/efe-ai/vsock-relayer
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  llmRouterUrl: "https://efe-llm-router.efe-system.svc.cluster.local:50051"
  mcpServerUrl: "https://efe-mcp-server.efe-system.svc.cluster.local:8080"
  auditEndpoint: "http://efe-mcp-server.efe-system.svc.cluster.local:8080/v1/audit/append"
  tls:
    llmClientSecret: vsock-relayer-llm-client
    mcpClientSecret: vsock-relayer-mcp-client
  caBundleConfigMap: efe-ca-bundle
  jwtPubSecret: efe-relay-jwt-key
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── SLO + alerting (M26) ───────────────────────────────────────────
slo:
  enabled: true

alertmanager:
  enabled: true
  pagerdutySecret: efe-agent-pagerduty
  slackWebhookSecret: efe-agent-slack-webhook

# ── Service monitor (Prometheus Operator) ──────────────────────────
serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s

# ── Pod security ───────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
