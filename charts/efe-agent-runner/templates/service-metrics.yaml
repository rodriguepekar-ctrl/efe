# ClusterIP service for Prometheus scraping the controller's
# `/metrics` endpoint (port 9091). The Deployment exposes the port
# but a Service is required for the namespaced NetworkPolicy egress
# rule (`efe-agent-runtime-metrics-scrape`) to match cleanly.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-metrics
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    {{- include "efe-agent-runner.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
