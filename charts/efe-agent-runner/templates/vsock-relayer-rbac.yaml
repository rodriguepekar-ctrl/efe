{{- if .Values.vsockRelayer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-vsock-relayer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: vsock-relayer
---
# Minimal cluster role : the relayer is a stateless proxy ; it does NOT
# need to talk to the K8s API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-vsock-relayer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-vsock-relayer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "efe-agent-runner.fullname" . }}-vsock-relayer
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: {{ include "efe-agent-runner.fullname" . }}-vsock-relayer
{{- end }}
