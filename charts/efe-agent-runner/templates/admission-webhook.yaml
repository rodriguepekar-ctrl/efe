{{- if .Values.admissionWebhook.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-admission
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
  {{- if .Values.admissionWebhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/efe-agent-runner-webhook-cert"
  {{- end }}
webhooks:
  - name: validate.agentruns.efe.ai
    failurePolicy: {{ .Values.admissionWebhook.failurePolicy }}
    sideEffects: None
    admissionReviewVersions: [v1]
    rules:
      - apiGroups: ["efe.ai"]
        apiVersions: [v1]
        resources: [agentruns]
        operations: [CREATE, UPDATE]
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "efe-agent-runner.fullname" . }}-webhook
        path: /validate-agentrun
        port: 8443
    timeoutSeconds: 5
  - name: validate.agentruntemplates.efe.ai
    failurePolicy: {{ .Values.admissionWebhook.failurePolicy }}
    sideEffects: None
    admissionReviewVersions: [v1]
    rules:
      - apiGroups: ["efe.ai"]
        apiVersions: [v1]
        resources: [agentruntemplates]
        operations: [CREATE, UPDATE]
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "efe-agent-runner.fullname" . }}-webhook
        path: /validate-agentruntemplate
        port: 8443
    timeoutSeconds: 5
{{- end -}}
