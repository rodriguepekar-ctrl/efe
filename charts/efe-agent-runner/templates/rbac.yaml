{{- if .Values.controller.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount.name | default (include "efe-agent-runner.fullname" .) }}
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-controller
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
rules:
  - apiGroups: ["efe.ai"]
    resources: [agentruns, agentruns/status, agentruntemplates, agentruntemplates/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Read-only on pods/secrets/configmaps to enforce admission webhook.
  - apiGroups: [""]
    resources: [pods, configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-controller
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "efe-agent-runner.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: {{ .Values.controller.serviceAccount.name | default (include "efe-agent-runner.fullname" .) }}
{{- end -}}
