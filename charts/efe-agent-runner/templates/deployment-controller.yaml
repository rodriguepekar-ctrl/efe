apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-controller
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "efe-agent-runner.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "efe-agent-runner.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccount.name | default (include "efe-agent-runner.fullname" .) }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: EFE_FEATURE_AGENT_RUNTIME_ENABLED
              value: {{ .Values.agentRuntimeEnabled | quote }}
            - name: EFE_M25_IMAGE_WHITELIST
              value: {{ .Values.imageWhitelist | quote }}
            - name: EFE_M25_COSIGN_KEY_REF
              value: {{ .Values.agentCore.cosign.keyRef | quote }}
            - name: EFE_FC_KERNEL
              value: {{ .Values.firecracker.kernelPath | quote }}
            - name: EFE_FC_UDS_DIR
              value: {{ .Values.firecracker.udsDir | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            - name: EFE_AUDIT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.audit.hmacKeySecret }}
                  key: {{ .Values.audit.hmacKeySecretKey }}
            - name: EFE_APPROVAL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.approval.hmacKeySecret }}
                  key: {{ .Values.approval.hmacKeySecretKey }}
            - name: EFE_M25_METRICS_ADDR
              value: "0.0.0.0:9091"
            - name: EFE_LOG_FORMAT
              value: "json"
            {{- if .Values.admissionWebhook.enabled }}
            # D93 — admission webhook env vars (M26 assembly fix D-3).
            - name: EFE_M26_WEBHOOK_ENABLED
              value: "true"
            - name: EFE_M26_WEBHOOK_ADDR
              value: "0.0.0.0:8443"
            - name: EFE_M26_WEBHOOK_TLS_CERT
              value: "/var/run/webhook-tls/tls.crt"
            - name: EFE_M26_WEBHOOK_TLS_KEY
              value: "/var/run/webhook-tls/tls.key"
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
            {{- if .Values.admissionWebhook.enabled }}
            - name: webhook
              containerPort: 8443
              protocol: TCP
            {{- end }}
          {{- if .Values.admissionWebhook.enabled }}
          # D93 — mount cert-manager-issued cert/key (M26 assembly fix D-4).
          volumeMounts:
            - name: webhook-tls
              mountPath: /var/run/webhook-tls
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      {{- if .Values.admissionWebhook.enabled }}
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ include "efe-agent-runner.fullname" . }}-webhook-tls
            optional: false
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
