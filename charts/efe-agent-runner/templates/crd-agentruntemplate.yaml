{{- if .Values.crds.install -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentruntemplates.efe.ai
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
spec:
  group: efe.ai
  scope: Namespaced
  names:
    kind: AgentRunTemplate
    listKind: AgentRunTemplateList
    plural: agentruntemplates
    singular: agentruntemplate
    shortNames: [art, agtmpl]
    categories: [efe, ai]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [tenantId, slug, displayName, profile, defaultProvider, defaultModel,
                         systemPrompt, toolWhitelist]
              properties:
                tenantId: {type: string, pattern: '^[a-z0-9_-]{1,64}$'}
                slug: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
                displayName: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                profile:
                  type: string
                  enum: [research_lite, catalog_curator, triage_agent]
                defaultProvider: {type: string}
                defaultModel: {type: string}
                systemPrompt: {type: string, minLength: 1, maxLength: 32768}
                toolWhitelist:
                  type: array
                  items: {type: string}
                  minItems: 1
                maxSteps: {type: integer, minimum: 1, maximum: 200, default: 25}
                defaultTimeoutSeconds: {type: integer, minimum: 60, maximum: 14400, default: 1800}
                defaultMaxCostCents: {type: integer, minimum: 1, default: 50}
                requireApprovalForWrites: {type: boolean, default: true}
                createdBy: {type: string}
            status:
              type: object
              properties:
                version: {type: integer}
                deprecated: {type: boolean}
      subresources:
        status: {}
{{- end -}}
