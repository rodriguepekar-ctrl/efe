{{- if .Values.slo.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-slo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
    prometheus: kube-prometheus
spec:
  groups:
    - name: efe-agent-runtime-slo
      interval: 30s
      rules:
        # SLO 1 — sandbox escape MUST be 0.
        - alert: AgentSandboxEscapeAttempt
          expr: increase(efe_agent_sandbox_escape_attempts_total[1m]) > 0
          for: 0s
          labels:
            severity: P0
            team: efe-agent
            slo_id: sandbox_escape
          annotations:
            summary: "P0 — sandbox escape attempt detected"
            description: |
              Tenant {{`{{ $labels.tenant }}`}} kind={{`{{ $labels.kind }}`}}.
              Runbook : https://efe.ai/docs/runbooks/M26#5-1-sandbox-escape

        # SLO 2 — audit chain HMAC verification MUST never fail.
        - alert: AgentAuditChainHmacFailure
          expr: increase(efe_agent_audit_hmac_verify_failures_total[5m]) > 0
          for: 0s
          labels:
            severity: P0
            slo_id: audit_chain_hmac
          annotations:
            summary: "P0 — audit chain HMAC verify failed"

        # SLO 3 — image whitelist rejections must be < 5/day (above = attack).
        - alert: AgentImageWhitelistAttacks
          expr: increase(efe_agent_image_rejected_whitelist_total[24h]) > 5
          for: 5m
          labels:
            severity: P2
            slo_id: image_whitelist
          annotations:
            summary: "P2 — many image whitelist rejections in 24h"

        # SLO 4 — provisioning P99 latency.
        - alert: AgentProvisioningSlow
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(efe_agent_microvm_provision_duration_seconds_bucket[5m]))
            ) > 5
          for: 10m
          labels:
            severity: P1
            slo_id: provisioning_p99
          annotations:
            summary: "P1 — microVM provisioning P99 > 5s"

        # SLO 5 — failure rate.
        - alert: AgentRunFailureRateHigh
          expr: |
            sum(increase(efe_agent_runs_total{status="FAILED"}[1h]))
              / sum(increase(efe_agent_runs_total[1h])) > 0.02
          for: 30m
          labels:
            severity: P2
            slo_id: failure_rate
          annotations:
            summary: "P2 — agent run failure rate > 2%"

        # SLO 7 — approval response latency.
        - alert: AgentApprovalLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(efe_agent_approval_response_latency_seconds_bucket[1h]))
            ) > 3600
          for: 1h
          labels:
            severity: P2
            slo_id: approval_p95
          annotations:
            summary: "P2 — 95th approval response latency > 1h"

        # SLO 8 — approval expiry.
        - alert: AgentApprovalExpiringTooMuch
          expr: |
            sum(increase(efe_agent_approval_expired_total[24h]))
              / sum(increase(efe_agent_approval_response_latency_seconds_count[24h])) > 0.05
          for: 1h
          labels:
            severity: P3
            slo_id: approval_expiry
          annotations:
            summary: "P3 — approval expiry rate > 5%"

        # SLO 9 — cost cap response time.
        - alert: AgentCostCapResponseSlow
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(efe_agent_cost_cap_terminate_duration_seconds_bucket[1h]))
            ) > 60
          for: 30m
          labels:
            severity: P1
            slo_id: cost_cap_response
          annotations:
            summary: "P1 — cost cap → SIGTERM P99 > 60s"

        # SLO 10 — REST gateway availability.
        - alert: AgentRestGatewayDown
          expr: |
            avg_over_time(up{job="efe-server",endpoint="/v1/agent"}[5m]) < 0.995
          for: 10m
          labels:
            severity: P1
            slo_id: rest_gateway_uptime
          annotations:
            summary: "P1 — REST gateway availability < 99.5%"

        # SLO 11 — admission webhook availability.
        - alert: AgentWebhookDown
          expr: |
            avg_over_time(up{job="efe-agent-runner-webhook"}[5m]) < 0.999
          for: 5m
          labels:
            severity: P0
            slo_id: webhook_uptime
          annotations:
            summary: "P0 — admission webhook availability < 99.9%"

        # SLO 12 — DB pool saturation.
        - alert: AgentDbPoolSaturated
          expr: |
            (sqlx_pool_active_connections / sqlx_pool_size_max) > 0.8
          for: 5m
          labels:
            severity: P2
            slo_id: db_pool
          annotations:
            summary: "P2 — DB pool > 80% saturated"

        # SLO 14 — GDPR Art. 17 cascade SLA.
        - alert: AgentGdprCascadeOverdue
          expr: |
            time() - efe_agent_gdpr_cascade_oldest_pending_seconds > (30 * 86400)
          for: 1h
          labels:
            severity: P1
            slo_id: gdpr_art17_sla
          annotations:
            summary: "P1 — pending GDPR Art. 17 cascade older than 30 days"
{{- end }}
