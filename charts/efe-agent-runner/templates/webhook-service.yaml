{{- if .Values.admissionWebhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-agent-runner.fullname" . }}-webhook
  labels:
    {{- include "efe-agent-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  selector:
    {{- include "efe-agent-runner.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: webhook
      port: 8443
      targetPort: 8443
      protocol: TCP
{{- end }}
