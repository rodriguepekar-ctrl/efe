{{- /*
PR #20 — metrics-only Service.  Headless because there's no need to
route traffic to the pods (Prometheus scrapes them directly via the
ServiceMonitor's pod-IP-derived endpoints).
*/ -}}
{{- if and .Values.enabled .Values.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe-loadgen.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-loadgen.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "efe-loadgen.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.prometheus.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
