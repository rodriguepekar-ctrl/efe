{{- /*
PR #20 § 24.3 — NetworkPolicy egress lockdown.

Only allows the loadgen pod to reach :
  1. Meta-swarm controllers (the gRPC target)
  2. OTel collector (trace export)
  3. (Optional) participants if --target-role=participant

Ingress restricted to Prometheus scrape (metrics port).
*/ -}}
{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe-loadgen.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-loadgen.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "efe-loadgen.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowPrometheusScrape }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
  egress:
    # DNS resolution (kube-system → CoreDNS).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Controller gRPC endpoint.
    {{- with .Values.networkPolicy.allowedControllerSelector }}
    - to:
        - podSelector:
            {{- toYaml . | nindent 12 }}
    {{- end }}
    # OTel collector.
    {{- with .Values.networkPolicy.allowedCollectorSelector }}
    - to:
        - podSelector:
            {{- toYaml . | nindent 12 }}
      ports:
        - port: 4317
          protocol: TCP
    {{- end }}
    # Participants (optional — only when --target-role=participant).
    {{- with .Values.networkPolicy.allowedParticipantSelector }}
    - to:
        - podSelector:
            {{- toYaml . | nindent 12 }}
    {{- end }}
{{- end }}
