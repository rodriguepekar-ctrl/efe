[project]
name = "efe"
version = "0.0.1"
description = "Ephemeral Fluid Swarm - Python SDK and ML stack"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "EFE Team", email = "eng@efe.ai" }]
keywords = ["ai", "inference", "swarm", "latent", "multi-agent"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "grpcio>=1.65",
    "protobuf>=5.27",
    "safetensors>=0.4",
    "pydantic>=2.7",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]
ml = [
    "torch>=2.5,<3.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
]
triton = ["triton>=3.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-macros-plugin>=1.0",
]

[project.scripts]
efe-cli = "efe.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/efe"]

[tool.hatch.build.targets.sdist]
include = ["python/efe", "README.md", "LICENSE"]

[tool.uv]
dev-dependencies = ["efe[dev]"]

[tool.pytest.ini_options]
testpaths = ["tests", "python/efe"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov-config=pyproject.toml"
markers = [
    "gpu: require GPU (CUDA)",
    "slow: slow test (> 1s)",
    "integration: integration test",
]

[tool.coverage.run]
source = ["python/efe"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
