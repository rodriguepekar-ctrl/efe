# EFE M25 — Agent profile registry.
#
# Each profile bundles : sandbox resources + default tool whitelist +
# default LLM provider/model + cost defaults. Mounted into the
# efe-agent-runner controller pod via the Helm chart's ConfigMap.
#
# Tenants opt-in to specific profiles via
# `tenant_feature.m25_allowed_profiles`.
#
# Slugs MUST match the `agent_run.profile` enum semantics expected by
# `crates/efe-agent-runner/src/profile.rs`.

profiles:
  - slug: research_lite
    display_name: "Research lite"
    description: |
      Read-only research agent. Safe-by-default :
        - tools : web_search, fetch_url, efe_classify, efe_query_events
        - no writes
        - 25 step max, 30 min timeout, $0.50 cap
    resources:
      vcpus: 1
      memory_mib: 512
      rootfs_image: "ghcr.io/efe-ai/agent-core:2.0.0"
      kernel_image: "/opt/efe/firecracker/vmlinux"
      initramfs: null
    default_tool_whitelist:
      - web_search
      - fetch_url
      - efe_classify
      - efe_query_events
    require_approval_for_writes: true
    default_provider: openai
    default_model: gpt-4o-mini
    default_max_steps: 25
    default_timeout_seconds: 1800
    default_max_cost_cents: 50

  - slug: catalog_curator
    display_name: "Catalog curator"
    description: |
      Catalog editing agent. EVERY write requires approval.
        - tools : efe_classify, efe_query_events, efe_upsert_catalog,
                  efe_retune_centroids
        - 50 step max, 60 min timeout, $2 cap
    resources:
      vcpus: 2
      memory_mib: 1024
      rootfs_image: "ghcr.io/efe-ai/agent-core:2.0.0"
      kernel_image: "/opt/efe/firecracker/vmlinux"
      initramfs: null
    default_tool_whitelist:
      - efe_classify
      - efe_query_events
      - efe_upsert_catalog
      - efe_retune_centroids
    require_approval_for_writes: true
    default_provider: anthropic
    default_model: claude-3-5-sonnet
    default_max_steps: 50
    default_timeout_seconds: 3600
    default_max_cost_cents: 200

  - slug: triage_agent
    display_name: "Event triage"
    description: |
      Reads ingest events, classifies, may reroute (writes need approval).
        - tools : efe_classify, efe_query_events, efe_ingest_events
        - 30 step max, 20 min timeout, $0.25 cap
    resources:
      vcpus: 1
      memory_mib: 512
      rootfs_image: "ghcr.io/efe-ai/agent-core:2.0.0"
      kernel_image: "/opt/efe/firecracker/vmlinux"
      initramfs: null
    default_tool_whitelist:
      - efe_classify
      - efe_query_events
      - efe_ingest_events
    require_approval_for_writes: true
    default_provider: openai
    default_model: gpt-4o-mini
    default_max_steps: 30
    default_timeout_seconds: 1200
    default_max_cost_cents: 25
