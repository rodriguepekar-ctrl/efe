#                            efe-slo-rollup
#  ──────────────────────────────────────────────────────────────────
#  PR #22 — 4 SLOs + multi-tier rollup compute pipeline + signed
#  quarterly evidence.  Cross-cutting consumer of PR #17 (metrics),
#  PR #19 (recording rules), PR #20 (loadgen feature `slo-source`),
#  PR #21 (bench summaries).
#
#  Reference : docs/EFE_A1_PHASE2_PR22_ARCHITECTURE.md
#  Stability : STABILITY_CONTRACT v1.4 § 22 (frozen ≥ 6 chart-minors).

[package]
name        = "efe-slo-rollup"
version     = "0.1.0"
edition     = "2021"
license     = "UNLICENSED"
description = "EFE 4-SLO surface + multi-tier rollup compute (PR #22)."
homepage    = "https://efe.example.com/slos"
repository  = "https://github.com/efe-ai/efe"
keywords    = ["slo", "rollup", "compliance", "burn-rate", "efe"]
categories  = ["command-line-utilities", "development-tools"]
publish     = false

[[bin]]
name = "efe-slo-rollup"
path = "src/main.rs"

[lib]
name = "efe_slo_rollup"
path = "src/lib.rs"

[features]
default = []
# AD2 — opt-in PR #20 loadgen integration as an in-process source.
# When enabled, the `slos/rollup/src/source/loadgen_lib.rs` module
# becomes available and exposes `LoadgenLibSource`.
loadgen-source = ["dep:efe-meta-swarm-loadgen"]
# T97 — compile-time PII-label guard (Phase-3 G.12 hardens this with a
# real proc-macro lint ; Phase-2 ships a feature flag + manual review).
deny-pii = []
# NB : cosign signing/verification is **runtime-gated** via
# `--cosign-disabled` (Helm values) — no Cargo feature needed since
# the cosign binary is invoked via Command::new and gracefully
# degrades when absent (AD46).

[dependencies]
# Workspace shared.
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }
uuid        = { workspace = true }
futures     = { workspace = true }
async-trait = { workspace = true }

# crate-specific
clap        = { version = "4.5", features = ["derive", "env", "wrap_help"] }
humantime   = "2.1"
chrono      = { version = "0.4", features = ["serde", "clock"] }
glob        = "0.3"
serde_yaml  = "0.9"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2        = "0.10"
hex         = "0.4"
base64      = "0.22"
tempfile    = "3.10"
parking_lot = "0.12"

# Optional integrations.
efe-meta-swarm-loadgen = { path = "../../tools/loadgen", optional = true }

[dev-dependencies]
proptest = "1.5"
