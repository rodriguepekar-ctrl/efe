# PR #22 § 16.2 — frozen values surface (STABILITY_CONTRACT v1.4 § 22.6).

# Chart version under measurement (REQUIRED — no default).
chartVersion: ""

# Cardinality-capped region label (T104).
region: global

# Run mode : "dev" (default) or "staging".  "production" is rejected
# at template-time (analog of PR #21 AD11 / T86).
mode: dev

image:
  repository: ghcr.io/efe/efe-slo-rollup
  tag: 0.1.0
  pullPolicy: IfNotPresent

storage:
  backend: pvc        # pvc | s3 | gcs
  pvc:
    enabled: true
    size: 50Gi
    storageClassName: ""
  s3:
    bucket: ""
    keyPrefix: slos/

cronjobs:
  hourly:
    schedule: "0 * * * *"
    enabled: true
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi
  monthly:
    schedule: "0 3 1 * *"
    enabled: true
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi
  quarterly:
    schedule: "0 4 1 1,4,7,10 *"
    enabled: true
    resources:
      requests:
        cpu: 800m
        memory: 2Gi
      limits:
        cpu: 4
        memory: 8Gi

cosign:
  identity: ""        # required when quarterly is enabled
  disabled: false

prometheus:
  url: http://prometheus.monitoring.svc:9090

# Pod-level hardening (AD22 / T103).
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# Namespace-scoped RBAC (T103 + T104 — Role, NOT ClusterRole).
rbac:
  create: true
  namespaceScoped: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
