{{- if .Values.cronjobs.quarterly.enabled -}}
{{- include "efe-slo-rollup.validate" . -}}
{{- if and (not .Values.cosign.disabled) (not .Values.cosign.identity) -}}
{{- fail "cronjobs.quarterly requires cosign.identity (or set cosign.disabled=true)" -}}
{{- end -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "efe-slo-rollup.fullname" . }}-quarterly
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-slo-rollup.labels" . | nindent 4 }}
    slo.efe/cronjob: quarterly
spec:
  schedule: "{{ .Values.cronjobs.quarterly.schedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "efe-slo-rollup.selectorLabels" . | nindent 12 }}
            slo.efe/cronjob: quarterly
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "efe-slo-rollup.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          containers:
            - name: rollup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  MONTH=$(date -u -d '1 day ago' +%m)
                  YEAR=$(date -u -d '1 day ago' +%Y)
                  # Previous quarter : (current month - 1) // 3 + 1, but rolled back.
                  Q=$(( ( (10#$MONTH - 1) / 3 ) + 1 ))
                  if [ "$Q" = "1" ] ; then Q=4 ; YEAR=$(( YEAR - 1 )) ; else Q=$(( Q - 1 )) ; fi
                  PERIOD="Q${Q}-${YEAR}"
                  /usr/local/bin/efe-slo-rollup rollup \
                    --stage t3 \
                    --period "$PERIOD" \
                    --chart-version "{{ .Values.chartVersion }}" \
                    --region "{{ .Values.region }}" \
                    --storage-root /var/run/slos \
                    {{- if .Values.cosign.disabled }}
                    --cosign-disabled
                    {{- else }}
                    --cosign-identity "{{ .Values.cosign.identity }}"
                    {{- end }}
              env:
                - name: RUST_LOG
                  value: "info"
              resources:
                {{- toYaml .Values.cronjobs.quarterly.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /var/run/slos
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              {{- if .Values.storage.pvc.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "efe-slo-rollup.fullname" . }}-data
              {{- else }}
              emptyDir: {}
              {{- end }}
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
{{- end -}}
