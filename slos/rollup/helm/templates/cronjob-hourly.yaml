{{- if .Values.cronjobs.hourly.enabled -}}
{{- include "efe-slo-rollup.validate" . -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "efe-slo-rollup.fullname" . }}-hourly
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-slo-rollup.labels" . | nindent 4 }}
    slo.efe/cronjob: hourly
spec:
  schedule: "{{ .Values.cronjobs.hourly.schedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "efe-slo-rollup.selectorLabels" . | nindent 12 }}
            slo.efe/cronjob: hourly
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "efe-slo-rollup.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          containers:
            - name: rollup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              args:
                - "compute"
                - "--window"
                - "1h"
                - "--offset"
                - "1h"
                - "--chart-version"
                - "{{ .Values.chartVersion }}"
                - "--region"
                - "{{ .Values.region }}"
                - "--prom-url"
                - "{{ .Values.prometheus.url }}"
                - "--storage-root"
                - "/var/run/slos"
              env:
                - name: RUST_LOG
                  value: "info"
              resources:
                {{- toYaml .Values.cronjobs.hourly.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /var/run/slos
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              {{- if .Values.storage.pvc.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "efe-slo-rollup.fullname" . }}-data
              {{- else }}
              emptyDir: {}
              {{- end }}
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
{{- end -}}
