{{- if .Values.rbac.create -}}
{{- include "efe-slo-rollup.validate" . -}}
# PR #22 T103/T104 — strictly namespace-scoped (Role, not ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "efe-slo-rollup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-slo-rollup.labels" . | nindent 4 }}
rules:
  # Read pods + services + endpoints to discover the Prometheus endpoint.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Bind to PVC for daily/monthly storage.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "efe-slo-rollup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-slo-rollup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "efe-slo-rollup.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "efe-slo-rollup.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
