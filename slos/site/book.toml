# PR #22 § 12 — mdbook source.
[book]
title    = "EFE Public SLOs"
authors  = ["EFE Platform Team"]
language = "en"
multilingual = false
src      = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/efe-ai/efe/tree/main/slos"
edit-url-template  = "https://github.com/efe-ai/efe/edit/main/slos/site/{path}"
no-section-label = true

# T100 mitigation — disable any inline JS the theme might inject.
playground.copyable = false
playground.copy-js  = false
search.enable       = true
