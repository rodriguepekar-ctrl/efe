# Sprint Φ-D-LATACT D91 — Burn-rate 4×3 matrix alerts (= 12 cells).
# Cf. docs/EFE_P1_LATENCE_P2_ACTIVATION_COMPLETION_ARCHITECTURE.md § 6.
#
# 4 windows = 1h / 6h / 24h / 72h.
# 3 severities = critical / major / watch.
# = 12 cells total.

groups:
  - name: p1_burn_4x3
    interval: 30s
    rules:

      # ── Window 1h (= burst detection) ──────────────────────────
      - alert: P1BurnCritical1h
        expr: |
          (sum(rate(efe_swarm_failures_total[1h])) /
           sum(rate(efe_swarm_requests_total[1h]))) /
          (1 - 0.99) > 14.4
        for: 2m
        labels:
          severity: critical
          window: "1h"
          slo_cell: "crit_1h"
        annotations:
          summary: "Burn rate critical: 14.4× over 1h"
          runbook: "docs/runbook/latact_burn_critical.md"

      - alert: P1BurnMajor1h
        expr: |
          (sum(rate(efe_swarm_failures_total[1h])) /
           sum(rate(efe_swarm_requests_total[1h]))) /
          (1 - 0.99) > 7.0
        for: 5m
        labels:
          severity: major
          window: "1h"
          slo_cell: "maj_1h"

      - alert: P1BurnWatch1h
        expr: |
          (sum(rate(efe_swarm_failures_total[1h])) /
           sum(rate(efe_swarm_requests_total[1h]))) /
          (1 - 0.99) > 2.0
        for: 15m
        labels:
          severity: watch
          window: "1h"
          slo_cell: "watch_1h"

      # ── Window 6h (= sustained dégradation) ─────────────────────
      - alert: P1BurnCritical6h
        expr: |
          (sum(rate(efe_swarm_failures_total[6h])) /
           sum(rate(efe_swarm_requests_total[6h]))) /
          (1 - 0.99) > 6.0
        for: 10m
        labels:
          severity: critical
          window: "6h"
          slo_cell: "crit_6h"

      - alert: P1BurnMajor6h
        expr: |
          (sum(rate(efe_swarm_failures_total[6h])) /
           sum(rate(efe_swarm_requests_total[6h]))) /
          (1 - 0.99) > 3.0
        for: 15m
        labels:
          severity: major
          window: "6h"
          slo_cell: "maj_6h"

      - alert: P1BurnWatch6h
        expr: |
          (sum(rate(efe_swarm_failures_total[6h])) /
           sum(rate(efe_swarm_requests_total[6h]))) /
          (1 - 0.99) > 1.0
        for: 30m
        labels:
          severity: watch
          window: "6h"
          slo_cell: "watch_6h"

      # ── Window 24h (= daily review) ─────────────────────────────
      - alert: P1BurnCritical24h
        expr: |
          (sum(rate(efe_swarm_failures_total[24h])) /
           sum(rate(efe_swarm_requests_total[24h]))) /
          (1 - 0.99) > 3.0
        for: 30m
        labels:
          severity: critical
          window: "24h"
          slo_cell: "crit_24h"

      - alert: P1BurnMajor24h
        expr: |
          (sum(rate(efe_swarm_failures_total[24h])) /
           sum(rate(efe_swarm_requests_total[24h]))) /
          (1 - 0.99) > 1.5
        for: 1h
        labels:
          severity: major
          window: "24h"
          slo_cell: "maj_24h"

      - alert: P1BurnWatch24h
        expr: |
          (sum(rate(efe_swarm_failures_total[24h])) /
           sum(rate(efe_swarm_requests_total[24h]))) /
          (1 - 0.99) > 0.5
        for: 2h
        labels:
          severity: watch
          window: "24h"
          slo_cell: "watch_24h"

      # ── Window 72h (= weekly trend) ─────────────────────────────
      - alert: P1BurnCritical72h
        expr: |
          (sum(rate(efe_swarm_failures_total[72h])) /
           sum(rate(efe_swarm_requests_total[72h]))) /
          (1 - 0.99) > 1.0
        for: 1h
        labels:
          severity: critical
          window: "72h"
          slo_cell: "crit_72h"

      - alert: P1BurnMajor72h
        expr: |
          (sum(rate(efe_swarm_failures_total[72h])) /
           sum(rate(efe_swarm_requests_total[72h]))) /
          (1 - 0.99) > 0.5
        for: 3h
        labels:
          severity: major
          window: "72h"
          slo_cell: "maj_72h"

      - alert: P1BurnWatch72h
        expr: |
          (sum(rate(efe_swarm_failures_total[72h])) /
           sum(rate(efe_swarm_requests_total[72h]))) /
          (1 - 0.99) > 0.2
        for: 6h
        labels:
          severity: watch
          window: "72h"
          slo_cell: "watch_72h"
