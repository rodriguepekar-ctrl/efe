syntax = "proto3";
package efe.v1;

import "google/protobuf/timestamp.proto";
import "efe/v1/types.proto";

// Main public service.
//
// Authentication: every RPC except `Health` requires a `Bearer` JWT in
// the `authorization` metadata. See `M10_ARCHITECTURE.md` §8 + M4 §10.
//
// **Sprint D32** (M4 §12) — `ExecuteStreaming` is no longer a skeleton :
// it emits one `StreamChunk` per fusion round (`RoundUpdate`) and one
// final `FinalVerdict` chunk wrapping the unary `ExecuteResponse`.
service SwarmService {
  // Unary inference.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // Server-streaming inference.
  //
  // **D32 contract** : the server emits N+1 chunks where N = number
  // of fusion rounds executed.
  //   * Chunks 1..N : `oneof = round_update`.
  //   * Chunk N+1 : `oneof = final` with the full `ExecuteResponse`,
  //     OR `oneof = error` when the swarm fails irrecoverably.
  //
  // Buffer = mpsc::channel(64) ; SLO S-2 first-chunk p99 ≤ 50 ms ;
  // SLO S-10 client-cancel cleanup ≤ 1 s.
  rpc ExecuteStreaming(ExecuteRequest) returns (stream StreamChunk);

  // Describe a spec's shape without running inference.
  rpc DescribeSpec(DescribeSpecRequest) returns (DescribeSpecResponse);
}

message ExecuteRequest {
  // Optional correlation id (generated server-side if empty).
  string request_id = 1;
  // Raw user prompt (audit only).
  string raw_prompt = 2;
  SwarmSpec spec = 3;
  DecodeMode decode_mode = 4;
  google.protobuf.Timestamp deadline = 5;
}

message ExecuteResponse {
  string swarm_id = 1;
  string request_id = 2;
  DecodedOutput output = 3;
  float confidence = 4;
  Verdict verdict = 5;
  uint32 rounds_executed = 6;
  float total_ms = 7;
  float alignment_delta = 8;
}

// **Sprint D32** — server-streaming chunk.
//
// The `oneof` is exhaustive on the client side : a switch on the
// payload variant must cover all four arms. New variants are gated
// behind an explicit minor-version bump of `efe.v1` (M10 §11).
message StreamChunk {
  oneof payload {
    // Per-round telemetry. Useful for progress UIs and early-abort
    // logic on the client (e.g. stop streaming when confidence ≥ 0.9).
    RoundUpdate round_update = 1;

    // Final response (success). Same shape as unary `Execute`.
    FinalVerdict final = 2;

    // Generic server event (warnings, deprecation notices, …). Not
    // emitted by D32 default but reserved for future multiplexing.
    ServerEvent event = 3;

    // Final response (error). The server emits this then closes the
    // stream. Mutually exclusive with `final`.
    StreamError error = 4;
  }
}

// **D32** — per-round update.
message RoundUpdate {
  uint32 round = 1;
  // Variance of nano-agents within the swarm at this round.
  float variance = 2;
  // Cumulative confidence so far ; monotonic-ish (may dip on a
  // re-roll round, but trends upward).
  float confidence_so_far = 3;
  // Number of nano-agents still active (not converged-out).
  uint32 active_agents = 4;
  // Wall time elapsed since the request was accepted (ms).
  float elapsed_ms = 5;
}

// **D32** — final verdict envelope.
message FinalVerdict {
  ExecuteResponse response = 1;
}

// **D32** — error envelope. Mirrors `tonic::Status` but as proto so
// gRPC client libraries that don't expose Status can still see the
// error code + message via the stream.
message StreamError {
  // gRPC status code (mirrors `tonic::Code` numeric enum).
  uint32 code = 1;
  string message = 2;
  // Optional structured details (key/value).
  map<string, string> details = 3;
}

message DescribeSpecRequest {
  SwarmSpec spec = 1;
}

message DescribeSpecResponse {
  bool valid = 1;
  repeated string errors = 2;
  uint64 hbm_bytes_estimate = 3;
  uint32 rounds_expected = 4;
}

message ServerEvent {
  string kind = 1;
  string message = 2;
  map<string, string> labels = 3;
}
