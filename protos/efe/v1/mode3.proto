// Sprint **D37** (M4 § 14) — Mode-3 service : k swarms parallèles +
// agrégation pour décisions critiques (self-consistency style).
//
// Architecture : `docs/EFE_SERVER_ARCHITECTURE.md` § 14.
//
// SLO contracts :
//   * S-4 latency : Mode-3 p99 ≤ 3 × Mode-1 p99 (parallelism amortizes
//     k≥2, dominated by the slowest sub-swarm).
//   * S-12 hard cap : k ≤ 5. Inputs above 5 are clamped server-side
//     (no error — the server logs `k_clamped=true`).
//
// Aggregators (D37 default impls) :
//   * "mean"     — element-wise mean of centroids ; confidence = mean
//                  confidence ; output = nearest-anchor of mean centroid.
//   * "weighted" — weighted by per-sub-swarm confidence.
//   * "median"   — coordinate-wise median (robust to one outlier).

syntax = "proto3";
package efe.v1.mode3;

import "google/protobuf/empty.proto";
import "efe/v1/types.proto";

service Mode3Service {
  // Synchronous fan-out + aggregate. Returns ONE response with the
  // aggregated verdict + every sub-verdict.
  rpc Execute(Mode3ExecuteRequest) returns (Mode3ExecuteResponse);

  // Server-streaming variant. Emits ONE `SubVerdict` per sub-swarm
  // as it completes (in arrival order, not request order), then the
  // final aggregated verdict, then closes.
  rpc SubscribeVerdict(Mode3ExecuteRequest) returns (stream Mode3StreamChunk);

  // Cancel an in-flight Mode-3 execution by request_id. Best-effort :
  // sub-swarms already past their `dissolve` round may complete.
  rpc Cancel(CancelRequest) returns (google.protobuf.Empty);
}

// =====================================================================
// Request / response
// =====================================================================

message Mode3ExecuteRequest {
  string query_text = 1;
  // Number of parallel sub-swarms. Server clamps to [1, 5] (S-12).
  // 0 → defaults to 3.
  uint32 k = 2;
  // Sub-mode for each call. "mode1" or "mode2". Default "mode1".
  string mode_per_call = 3;
  // Required when mode_per_call = "mode2".
  string llm_router_id = 4;
  // Aggregator id. "mean" | "weighted" | "median". Default "mean".
  string aggregator = 5;
  string tenant_id = 6;
  string request_id = 7;
  // Base seed. The k sub-swarms use seeds (seed, seed+1, …, seed+k-1)
  // to ensure determinism + diversity at the same time.
  uint64 seed = 8;
  uint32 top_k_anchors = 9;     // forwarded to mode2 sub-calls.
  uint32 max_rounds = 10;
}

message Mode3ExecuteResponse {
  // Aggregated verdict (final answer).
  Verdict final_verdict = 1;
  // Per-sub-swarm verdicts in arrival order (not stable across runs).
  repeated SubVerdict sub_verdicts = 2;
  AggregationMetadata aggregation = 3;
  // Echoed (server-assigned if empty in request).
  string request_id = 4;
  // Total wall time, including the slowest sub-swarm + aggregation.
  float total_ms = 5;
  // True when input k was > 5 ; the actual k used = 5.
  bool k_clamped = 6;
  // Effective k after clamping.
  uint32 k_effective = 7;
}

message SubVerdict {
  // Index in [0, k_effective). Stable for the duration of the request.
  uint32 swarm_idx = 1;
  Verdict verdict = 2;
  uint32 latency_ms = 3;
  // Mirrors `mode_per_call`. Useful when routing per-sub-swarm
  // decisions (deferred to D38).
  string mode_used = 4;
  // Per-sub-swarm seed (seed_base + swarm_idx).
  uint64 seed_used = 5;
}

message AggregationMetadata {
  string strategy = 1;
  // Sum of per-sub-swarm confidences.
  float total_confidence = 2;
  // Std deviation of confidences across sub-verdicts (proxy for
  // disagreement). High dispersion → flag the request for human
  // review.
  float dispersion = 3;
  // Effective sample size after deduplication of identical labels.
  uint32 effective_n = 4;
}

// =====================================================================
// Streaming
// =====================================================================

message Mode3StreamChunk {
  oneof payload {
    // One per completing sub-swarm. Emitted in arrival order.
    SubVerdict sub = 1;
    // Emitted ONCE at the end, after every sub-swarm has produced
    // its verdict and the aggregator has run.
    Mode3FinalVerdict final = 2;
    Mode3StreamError error = 3;
  }
}

message Mode3FinalVerdict {
  Mode3ExecuteResponse response = 1;
}

message Mode3StreamError {
  uint32 code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// =====================================================================
// Cancel
// =====================================================================

message CancelRequest {
  string request_id = 1;
  string tenant_id = 2;
}
