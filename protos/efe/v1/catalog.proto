// Sprint D12 — Catalog admin endpoints + versioning.
//
// Mirror of the (M9-era) cone-side `AdminService` in admin.proto,
// extended for the catalog use case : versioned anchor catalogs
// stored server-side, monotonic per (tenant, name), immutable
// post-register.
//
// Lives in a SEPARATE file (vs. adding to admin.proto) so :
//
//   * Stub regeneration is scoped to a single file.
//   * RBAC stays clean — `admin:catalog:*` and `admin:cone:*`
//     remain orthogonal scopes (cf. d12 architecture §14, decision #6).
//   * Forward-compatibility — legacy clients on M9-era admin.proto
//     are not re-broken by this change.
//
// Architecture: docs/bench/d12_catalog_admin_versioning_architecture.md.

syntax = "proto3";
package efe.v1.catalog;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// =====================================================================
// Service
// =====================================================================

service CatalogService {
  // Register a new catalog version. Atomic. The server assigns
  // the integer version (monotonic +1 per (tenant, name)).
  rpc RegisterCatalog(RegisterCatalogRequest) returns (CatalogHandle);

  // Apply an evolution op, returning the new (incremented) version.
  rpc EvolveCatalog(EvolveCatalogRequest) returns (CatalogHandle);

  // Fetch a specific version by canonical key.
  rpc GetCatalog(GetCatalogRequest) returns (CanonicalCatalog);

  // List all (tenant, name) tuples for a tenant. Page-paginated.
  rpc ListCatalogs(ListCatalogsRequest) returns (ListCatalogsResponse);

  // List versions for a specific (tenant, name).
  rpc ListCatalogVersions(ListCatalogVersionsRequest)
      returns (ListCatalogVersionsResponse);

  // Delete a specific catalog version. force=true cascades.
  rpc DeleteCatalog(DeleteCatalogRequest) returns (google.protobuf.Empty);
}

// =====================================================================
// Reference
// =====================================================================

// Lightweight server-side catalog reference. Mirror of types.ConeRef.
message CatalogRef {
  string tenant = 1;
  string name = 2;       // catalog name, [a-z][a-z0-9_-]{0,62}
  uint32 version = 3;    // integer, monotonic per (tenant, name)
}

// =====================================================================
// Content
// =====================================================================

message CatalogContent {
  EmbedderSpec embedder = 1;
  repeated CatalogClass classes = 2;
  ConePolicy cone_policy = 3;
  ThresholdPolicy thresholds = 4;
}

message EmbedderSpec {
  string family = 1;     // "sentence-transformers"
  string model = 2;      // e.g. "paraphrase-multilingual-MiniLM-L12-v2"
  uint32 dim = 3;
  string normalize = 4;  // "l2"
}

message CatalogClass {
  string name = 1;
  string description = 2;
  repeated string canonical_sentences = 3;
  string color = 4;
  bool deprecated = 5;
}

message ConePolicy {
  float max_projection_distance = 1;
}

message ThresholdPolicy {
  float confidence_high = 1;
  float confidence_medium = 2;
}

// =====================================================================
// Canonical (returned form, includes audit metadata)
// =====================================================================

message CanonicalCatalog {
  CatalogContent content = 1;
  CatalogMetadata metadata = 2;

  // Server-side compiled anchors. Optional in responses ; populated
  // only when the caller has admin:catalog:read AND the request
  // sets `include_compiled=true` to avoid bloating every list/get
  // payload with float blobs.
  repeated CompiledClass compiled = 3;
}

message CatalogMetadata {
  google.protobuf.Timestamp created_at = 1;
  string created_by = 2;        // sub claim
  string description = 3;
  string parent_key = 4;        // canonical key of previous version, "" if v1
  string evolution_op = 5;      // "register" | "append_class" | etc.
  map<string, string> labels = 6;
  string content_sha256 = 7;    // immutability witness
}

message CompiledClass {
  string class_name = 1;
  bytes anchors_blob = 2;        // (N, dim) f32 little-endian
  uint32 num_anchors = 3;
  string embedder_fingerprint = 4;
}

// =====================================================================
// Register
// =====================================================================

message RegisterCatalogRequest {
  string tenant = 1;
  string name = 2;
  string version = 3;            // SemVer-shaped, informational ; server assigns integer
  CatalogContent content = 4;
  string created_by = 5;
  string description = 6;
  map<string, string> labels = 7;
}

message CatalogHandle {
  // Canonical key "tenant/name@vN" — N is the integer version.
  string key = 1;
  CanonicalCatalog catalog = 2;
}

// =====================================================================
// Evolve
// =====================================================================

message EvolveCatalogRequest {
  string from_key = 1;            // canonical key of source version
  CatalogEvolutionOp op = 2;
  CatalogMetadata metadata_override = 3;
}

message CatalogEvolutionOp {
  oneof op {
    AppendClassOp append_class = 1;
    RemoveClassOp remove_class = 2;
    UpdateThresholdsOp update_thresholds = 3;
    ReplaceClassAnchorsOp replace_class_anchors = 4;
    RecompileOp recompile = 5;
  }
}

message AppendClassOp {
  CatalogClass cls = 1;           // proto3 reserves `class` ; use `cls`
}

message RemoveClassOp {
  string class_name = 1;
}

message UpdateThresholdsOp {
  ThresholdPolicy thresholds = 1;
}

message ReplaceClassAnchorsOp {
  string class_name = 1;
  repeated string canonical_sentences = 2;
}

message RecompileOp {
  EmbedderSpec new_embedder = 1;
}

// =====================================================================
// Read
// =====================================================================

message GetCatalogRequest {
  string key = 1;                 // canonical key
  bool include_compiled = 2;      // requires admin:catalog:read
}

message ListCatalogsRequest {
  string tenant = 1;              // MUST match JWT tenant_id
  int32 page_size = 2;            // default 100, max 500
  string page_token = 3;          // empty for first page
}

message ListCatalogsResponse {
  // Server fills `tenant` to the caller's tenant on every entry.
  // Catalog refs from foreign tenants are NEVER returned.
  repeated CatalogRefSummary catalogs = 1;
  string next_page_token = 2;
}

// CatalogRefSummary = CatalogRef + lightweight stats. Used for list
// responses where full content would bloat the wire.
message CatalogRefSummary {
  string tenant = 1;
  string name = 2;
  uint32 latest_version = 3;
  uint32 num_classes = 4;
  uint32 num_anchors = 5;
}

message ListCatalogVersionsRequest {
  string tenant = 1;
  string name = 2;
}

message ListCatalogVersionsResponse {
  // Sorted ascending by integer version.
  repeated string keys = 1;       // each entry is a canonical key "tenant/name@vN"
}

// =====================================================================
// Delete
// =====================================================================

message DeleteCatalogRequest {
  string key = 1;                 // canonical key
  bool force = 2;
}
