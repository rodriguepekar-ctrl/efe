syntax = "proto3";
package efe.v1;

// Shared type definitions for the `efe.v1` API surface.
//
// These messages mirror `efe_core::types` domain types 1:1 where
// possible, with a stable wire layout. Additions are allowed in this
// package as long as they respect the versioning rules documented in
// `M10_ARCHITECTURE.md` §4.5.

// Complete swarm specification — mirrors `efe_core::types::SwarmSpec`.
message SwarmSpec {
  // Server generates if empty.
  string swarm_id = 1;
  // Problem embedding. `len == dim_latent` enforced by the bridge.
  repeated float problem_embedding = 2;
  uint32 dim_latent = 3;
  repeated PopulationEntry population = 4;
  uint32 max_rounds = 5;
  ConvergenceThresholds convergence = 6;
  oneof cone_source {
    AlignmentCone alignment_cone = 7;
    ConeRef alignment_cone_ref = 8;
  }
  ResourceBudget budget = 9;
}

message PopulationEntry {
  // `"na-sem"`, `"na-log"`, or `"na-crit"`.
  string template_code = 1;
  uint32 count = 2;
}

message ConvergenceThresholds {
  float epsilon_variance = 1;
  float epsilon_gradient = 2;
  float epsilon_stability = 3;
  uint32 stability_window = 4;
}

message AlignmentCone {
  repeated Anchor anchors = 1;
  float max_projection_distance = 2;
}

message Anchor {
  repeated float values = 1;
}

// Reference to a cone stored in the registry (M9).
message ConeRef {
  string tenant = 1;
  string task = 2;
  uint32 version = 3;
}

message ResourceBudget {
  uint32 max_wall_clock_ms = 1;
  float max_energy_wh = 2;
  uint64 max_hbm_bytes = 3;
  uint32 max_recursion_depth = 4;
}

// Output decoding mode.
message DecodeMode {
  oneof mode {
    TextMode text = 1;
    PassThroughMode pass_through = 2;
  }
}

message TextMode {
  uint32 max_tokens = 1;
}

message PassThroughMode {}

message DecodedOutput {
  oneof payload {
    string text = 1;
    RawCentroid raw = 2;
  }
}

message RawCentroid {
  repeated float values = 1;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_CONTINUE = 1;
  VERDICT_CONVERGED = 2;
  VERDICT_DIVERGENCE = 3;
  VERDICT_MODE_COLLAPSE = 4;
}
