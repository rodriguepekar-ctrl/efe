syntax = "proto3";
package efe.v1.admin;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "efe/v1/types.proto";

// Admin / governance surface. Requires elevated scopes.
//
// Sprint **D21** (M4 § 9) — extends the M9 cone-scoped surface with
// 8 catalog-scoped RPCs (`ListCatalogs`, `GetCatalog`, `DeleteCatalog`,
// `ReloadBundle`, `PinCatalog`, `EvolveCatalog`, `ReloadCatalog`,
// `ListAuditEvents`).
//
// **Naming note** — `ListCatalogs/GetCatalog/DeleteCatalog/EvolveCatalog`
// also exist on `efe.v1.catalog.CatalogService` (D12-bis). The
// AdminService variants live here so operators can call **all admin
// surfaces under one credential** (`scope=admin`) instead of switching
// between `scope=admin` for cone ops and `scope=admin:catalog:*` for
// catalog ops. Backend delegation is identical (same `CatalogRegistry`
// trait) — only the RBAC perimeter differs.
service AdminService {
  // M9 cone management — 6 RPCs, scope `admin`.
  rpc RegisterCone(RegisterConeRequest) returns (ConeHandle);
  rpc EvolveCone(EvolveConeRequest) returns (ConeHandle);
  rpc GetCone(GetConeRequest) returns (CanonicalCone);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc DeleteCone(DeleteConeRequest) returns (google.protobuf.Empty);
  rpc BreachHistory(BreachHistoryRequest) returns (BreachHistoryResponse);

  // ──────────────────────────────────────────────────────────────────
  // **Sprint D21** — 7 catalog-scoped admin RPCs + 1 audit RPC.
  // ──────────────────────────────────────────────────────────────────

  // List catalog refs for a tenant. Page-paginated (max 500 rows / page).
  rpc ListCatalogs(ListCatalogsAdminRequest) returns (ListCatalogsAdminResponse);

  // Fetch one catalog version by canonical key (`tenant/name@vN`).
  rpc GetCatalog(GetCatalogAdminRequest) returns (GetCatalogAdminResponse);

  // Delete a catalog version (soft by default ; force=true cascades).
  rpc DeleteCatalog(DeleteCatalogAdminRequest) returns (DeleteCatalogAdminResponse);

  // Live bundle reload — wired in D27. D21 declares the RPC ; D27
  // ships the atomic `Arc<Bundle>` swap inside `EmbedderRegistry`.
  rpc ReloadBundle(ReloadBundleRequest) returns (ReloadBundleResponse);

  // Pin a catalog version (prevents auto-rotation while a known-good
  // version is being validated).
  rpc PinCatalog(PinCatalogRequest) returns (PinCatalogResponse);

  // Apply a catalog evolution op (bumps integer version).
  rpc EvolveCatalog(EvolveCatalogAdminRequest) returns (EvolveCatalogAdminResponse);

  // Force-refresh the in-memory catalog cache from PG (after an
  // out-of-band write by another replica or a manual SQL patch).
  rpc ReloadCatalog(ReloadCatalogRequest) returns (ReloadCatalogResponse);

  // Server-stream audit events (HMAC-chained). Scope `audit`.
  // Streams in batches of 100 ; the client keeps reading until the
  // server closes the stream (when `until_unix_ms` is reached).
  rpc ListAuditEvents(ListAuditEventsRequest) returns (stream AuditEventProto);
}

// =====================================================================
// M9 cone messages — preserved unchanged.
// =====================================================================

message RegisterConeRequest {
  string tenant = 1;
  string task = 2;
  uint32 version = 3;
  efe.v1.AlignmentCone cone = 4;
  string created_by = 5;
  string description = 6;
  map<string, string> labels = 7;
}

message ConeHandle {
  string key = 1;
  CanonicalCone cone = 2;
}

message CanonicalCone {
  efe.v1.AlignmentCone cone = 1;
  ConeMetadata metadata = 2;
}

message ConeMetadata {
  google.protobuf.Timestamp created_at = 1;
  string created_by = 2;
  string description = 3;
  string parent_key = 4;
  string evolution_op = 5;
  map<string, string> labels = 6;
}

message EvolveConeRequest {
  string from_key = 1;
  ConeEvolutionOp op = 2;
  ConeMetadata metadata_override = 3;
}

message ConeEvolutionOp {
  oneof op {
    efe.v1.Anchor append_anchor = 1;
    uint32 remove_anchor_idx = 2;
    ReplaceAnchorOp replace_anchor = 3;
    float update_radius = 4;
    float scale_anchors = 5;
    string union_with_key = 6;
  }
}

message ReplaceAnchorOp {
  uint32 idx = 1;
  efe.v1.Anchor anchor = 2;
}

message GetConeRequest {
  string key = 1;
}

message ListVersionsRequest {
  string tenant = 1;
  string task = 2;
}

message ListVersionsResponse {
  repeated string keys = 1;
}

message DeleteConeRequest {
  string key = 1;
  bool force = 2;
}

message BreachHistoryRequest {
  uint32 limit = 1;
  string tenant = 2;
  string task = 3;
  float min_magnitude = 4;
}

message BreachHistoryResponse {
  repeated BreachReport reports = 1;
}

message BreachReport {
  string cone_key = 1;
  string swarm_id = 2;
  float observed_delta = 3;
  float cone_radius = 4;
  google.protobuf.Timestamp timestamp = 5;
  string context = 6;
}

// =====================================================================
// **Sprint D21** — Catalog-scoped admin messages.
//
// Naming convention : suffix `Admin` on the message name to disambiguate
// from the equivalent shapes in `efe.v1.catalog.*` (which live in a
// different package, same nominal name). This avoids a Rust-side
// generated-name clash when both packages are `use`d in the same
// handler.
// =====================================================================

message ListCatalogsAdminRequest {
  string tenant = 1;          // MUST match JWT tenant_id claim.
  uint32 page_size = 2;       // default 100, max 500.
  string page_token = 3;      // empty for the first page.
}

message ListCatalogsAdminResponse {
  repeated CatalogRefSummaryAdmin catalogs = 1;
  string next_page_token = 2;
}

// Mirror of `efe.v1.catalog.CatalogRefSummary` — duplicated in the
// admin namespace so this proto file stays self-contained (no
// cross-package import). Field tags identical for wire compat.
message CatalogRefSummaryAdmin {
  string tenant = 1;
  string name = 2;
  uint32 latest_version = 3;
  uint32 num_classes = 4;
  uint32 num_anchors = 5;
}

message GetCatalogAdminRequest {
  string key = 1;             // canonical "tenant/name@vN" ; empty version = latest
  bool include_compiled = 2;
}

message GetCatalogAdminResponse {
  string key = 1;
  // Lightweight summary (full content lives on `CatalogService.GetCatalog`
  // for callers that need the raw `CatalogContent`).
  CatalogRefSummaryAdmin summary = 2;
  string content_sha256 = 3;
  google.protobuf.Timestamp created_at = 4;
}

message DeleteCatalogAdminRequest {
  string key = 1;
  bool force = 2;             // cascade-delete every transitive descendant
  bool soft_delete = 3;       // mark deleted, keep PG row (recommended prod)
}

message DeleteCatalogAdminResponse {
  bool deleted = 1;
  string audit_id = 2;        // HMAC-chained event id (D14-bis)
}

// =====================================================================
// **Sprint D21 / D27** — `ReloadBundle` RPC.
//
// D21 ships the proto + handler skeleton that returns
// `Status::Unimplemented("D27 pending")`.
//
// D27 (cf. M4 § 11) wires the atomic `Arc<Bundle>` swap inside
// `EmbedderRegistry::reload()`.
// =====================================================================

message ReloadBundleRequest {
  // Either `bundle_oci_ref` (OCI registry pull) or `bundle_path`
  // (filesystem) MUST be set. Setting both is rejected with
  // InvalidArgument.
  string bundle_oci_ref = 1;
  string bundle_path = 2;
  string tenant_id = 3;
  // Optional load-policy override (default = registry policy).
  string signature_policy = 4;  // "skip" | "warn" | "require"
  bool require_sbom = 5;
  bool ack_non_redistributable = 6;
}

message ReloadBundleResponse {
  // Server-assigned correlation id for follow-up health checks.
  string reload_id = 1;
  ReloadStatus status = 2;
  string error_message = 3;     // populated when status = FAILED
  uint64 duration_ms = 4;
  string old_bundle_id = 5;     // empty when no previous active bundle
  string new_bundle_id = 6;
}

enum ReloadStatus {
  RELOAD_STATUS_UNSPECIFIED = 0;
  RELOAD_STATUS_PENDING = 1;
  RELOAD_STATUS_LOADING = 2;
  RELOAD_STATUS_SMOKE_OK = 3;
  RELOAD_STATUS_ACTIVE = 4;
  RELOAD_STATUS_FAILED = 5;
}

// =====================================================================
// **Sprint D21** — `PinCatalog` RPC.
// =====================================================================

message PinCatalogRequest {
  string tenant = 1;
  string name = 2;
  uint32 version = 3;
  // Pin TTL ; 0 = pin forever (until explicit unpin).
  uint64 pin_until_unix_ms = 4;
}

message PinCatalogResponse {
  bool pinned = 1;
  // Echo of the pin TTL ; 0 means no expiry.
  uint64 expires_at_unix_ms = 2;
  string audit_id = 3;
}

// =====================================================================
// **Sprint D21** — `EvolveCatalog` RPC (admin namespace).
// =====================================================================

message EvolveCatalogAdminRequest {
  string from_key = 1;
  string evolution_kind = 2;    // "append_class" | "remove_class" | …
  string evolution_payload_json = 3;  // serde-deserialised by handler
  string created_by = 4;
  string description = 5;
}

message EvolveCatalogAdminResponse {
  string new_key = 1;
  uint32 new_version = 2;
  string audit_id = 3;
  string content_sha256 = 4;
}

// =====================================================================
// **Sprint D21** — `ReloadCatalog` RPC.
// =====================================================================

message ReloadCatalogRequest {
  string tenant = 1;
  string name = 2;
}

message ReloadCatalogResponse {
  bool reloaded = 1;
  // Latest version observed after the cache refresh.
  uint32 latest_version = 2;
  string audit_id = 3;
}

// =====================================================================
// **Sprint D21** — `ListAuditEvents` RPC (server-stream, scope=audit).
// =====================================================================

message ListAuditEventsRequest {
  string tenant_id = 1;
  // Half-open interval [since, until). When until = 0, server treats
  // it as "now" and closes the stream once the live tail is exhausted.
  uint64 since_unix_ms = 2;
  uint64 until_unix_ms = 3;
  // Optional action prefix filter (e.g. "catalog." or "cone.register").
  string action_filter = 4;
  // Server caps page size internally at 100. Client cannot exceed it.
  uint32 max_per_page = 5;
}

message AuditEventProto {
  // UUID v7 for monotonic-by-time ordering.
  string event_id = 1;
  uint64 ts_unix_ms = 2;
  string action = 3;
  string tenant_id = 4;
  string principal = 5;
  // Canonical JSON payload (same shape as audit_events.signed_payload).
  string payload_json = 6;
  // Hex HMAC-SHA-256 of (prev_signature || payload_json), 64 chars.
  string signature_hex = 7;
  // Hex HMAC-SHA-256 of the previous event ; "" for the genesis row.
  string prev_signature_hex = 8;
}
