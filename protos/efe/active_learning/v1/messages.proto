// efe.active_learning.v1 — message definitions (M24).

syntax = "proto3";
package efe.active_learning.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ─── Common enums ────────────────────────────────────────────────────

enum QueueStatus {
    QUEUE_STATUS_UNSPECIFIED = 0;
    QUEUE_STATUS_ENQUEUED = 1;
    QUEUE_STATUS_LABELING = 2;
    QUEUE_STATUS_LLM_LABELED = 3;
    QUEUE_STATUS_AWAITING_REVIEW = 4;
    QUEUE_STATUS_CONFIRMED = 5;
    QUEUE_STATUS_REJECTED = 6;
    QUEUE_STATUS_FAILED = 7;
    QUEUE_STATUS_TOMBSTONED = 8;
}

enum RetuneRunStatus {
    RETUNE_STATUS_UNSPECIFIED = 0;
    RETUNE_STATUS_TUNING = 1;
    RETUNE_STATUS_EVAL_RUNNING = 2;
    RETUNE_STATUS_EVAL_PASS = 3;
    RETUNE_STATUS_EVAL_FAIL = 4;
    RETUNE_STATUS_PROMOTED = 5;
    RETUNE_STATUS_ROLLED_BACK = 6;
    RETUNE_STATUS_ABORTED = 7;
}

enum StakesTier {
    STAKES_TIER_UNSPECIFIED = 0;
    STAKES_TIER_LOW = 1;
    STAKES_TIER_MEDIUM = 2;
    STAKES_TIER_HIGH = 3;
}

enum Urgency {
    URGENCY_UNSPECIFIED = 0;
    URGENCY_STANDARD = 1;
    URGENCY_REGULATORY = 2;
    URGENCY_CATASTROPHIC = 3;
}

// ─── Queue management ────────────────────────────────────────────────

message ListGoldLabelQueueRequest {
    string tenant_id = 1;
    QueueStatus status_filter = 2;
    string catalog_id = 3;
    uint32 limit = 4;
}

message ListGoldLabelQueueResponse {
    repeated GoldLabelQueueItem items = 1;
}

message GoldLabelQueueItem {
    string id = 1;
    string catalog_id = 2;
    string content_hash = 3;
    string sentence_redacted = 4;
    string proposed_class_id = 5;
    float observed_confidence = 6;
    QueueStatus status = 7;
    google.protobuf.Timestamp enqueued_at = 8;
    int32 failure_count = 9;
}

message GetGoldLabelProposalRequest { string proposal_id = 1; }

message GetGoldLabelProposalResponse {
    string id = 1;
    string queue_id = 2;
    string proposed_class_id = 3;
    float llm_confidence = 4;
    string llm_rationale = 5;
    string llm_call_audit_id = 6;
    string prompt_template_name = 7;
    uint32 prompt_template_version = 8;
    bool auto_confirmed = 9;
    google.protobuf.Timestamp created_at = 10;
}

// ─── Review actions ──────────────────────────────────────────────────

message ConfirmGoldLabelRequest {
    string proposal_id = 1;
    string rationale = 2;
}

message EditAndConfirmGoldLabelRequest {
    string proposal_id = 1;
    string final_class_id = 2;
    string rationale = 3;
}

message ConfirmGoldLabelResponse {
    string review_id = 1;
}

message RejectGoldLabelRequest {
    string proposal_id = 1;
    string rationale = 2;
}

message RejectGoldLabelResponse {
    string review_id = 1;
}

// ─── Retune ──────────────────────────────────────────────────────────

message TriggerBundleRetuneRequest {
    string tenant_id = 1;
    string catalog_id = 2;
    bool force_below_threshold = 3;
}

message TriggerBundleRetuneResponse {
    string retune_run_id = 1;
    google.protobuf.Timestamp started_at = 2;
}

message ListRetuneRunsRequest {
    string tenant_id = 1;
    string catalog_id = 2;
    uint32 limit = 3;
}

message ListRetuneRunsResponse {
    repeated RetuneRunSummary runs = 1;
}

message RetuneRunSummary {
    string id = 1;
    string catalog_id = 2;
    string parent_taxonomy_version_id = 3;
    string new_taxonomy_version_id = 4;
    string new_bundle_semver = 5;
    int64 training_examples_count = 6;
    int64 holdout_examples_count = 7;
    google.protobuf.Timestamp started_at = 8;
    google.protobuf.Timestamp completed_at = 9;
    RetuneRunStatus status = 10;
    bool flagged_for_promotion = 11;
    string triggered_by = 12;
}

message GetRetuneRunRequest { string run_id = 1; }
message GetRetuneRunResponse {
    RetuneRunSummary summary = 1;
    google.protobuf.Struct eval_metrics = 2;
}

// ─── Promotion ───────────────────────────────────────────────────────

message PromoteRetunedBundleRequest {
    string retune_run_id = 1;
    bool skip_canary = 2;     // tenant_admin only
}

message PromoteRetunedBundleResponse {
    string new_active_taxonomy_version_id = 1;
    google.protobuf.Timestamp canary_started_at = 2;
}

message RollbackPromotionRequest {
    string retune_run_id = 1;
    string reason = 2;
}

message RollbackPromotionResponse {
    string restored_active_version_id = 1;
}

// ─── GDPR Art. 17 ────────────────────────────────────────────────────

message TriggerGdprArt17ErasureRequest {
    string tenant_id = 1;
    string catalog_id = 2;
    Urgency urgency = 3;
    repeated string content_hashes = 4;
    string requester_subject_id = 5;
    string reason = 6;
}

message TriggerGdprArt17ErasureResponse {
    string rebuild_request_id = 1;
    google.protobuf.Timestamp sla_deadline = 2;
    uint32 affected_count = 3;
}

message ListGdprErasureRequestsRequest {
    string tenant_id = 1;
}

message ListGdprErasureRequestsResponse {
    repeated GdprErasureRequest requests = 1;
}

message GdprErasureRequest {
    string id = 1;
    string catalog_id = 2;
    Urgency urgency = 3;
    google.protobuf.Timestamp request_received_at = 4;
    google.protobuf.Timestamp sla_deadline = 5;
    google.protobuf.Timestamp completed_at = 6;
    uint32 affected_count = 7;
    string status = 8;
}

// ─── Stats ───────────────────────────────────────────────────────────

message GetActiveLearningStatsRequest {
    string tenant_id = 1;
    string catalog_id = 2;
}

message GetActiveLearningStatsResponse {
    uint64 queue_enqueued = 1;
    uint64 queue_labeling = 2;
    uint64 queue_awaiting_review = 3;
    uint64 queue_failed = 4;
    int64 oldest_open_age_seconds = 5;
    uint64 total_gold_examples = 6;
    uint64 total_holdout_examples = 7;
    uint64 retune_runs_last_30d = 8;
    uint64 promotions_last_30d = 9;
    uint64 cost_cents_today = 10;
    uint64 cost_cents_last_30d = 11;
}

message GetEffectiveBundleVersionRequest {
    string tenant_id = 1;
    string catalog_id = 2;
}

message GetEffectiveBundleVersionResponse {
    string taxonomy_version_id = 1;
    string semver = 2;
    string retune_run_id = 3;
    google.protobuf.Timestamp promoted_at = 4;
}

// ─── DPO consent ─────────────────────────────────────────────────────

message RegisterDpoConsentRequest {
    string tenant_id = 1;
    string signer_name = 2;
    string addendum_hash = 3;          // sha256 of signed PDF
    google.protobuf.Timestamp signed_at = 4;
    google.protobuf.Timestamp expires_at = 5;
}

message RegisterDpoConsentResponse {
    google.protobuf.Timestamp signed_at = 1;
    google.protobuf.Timestamp expires_at = 2;
}
