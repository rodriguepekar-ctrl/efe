# PR #15 — Checkov configuration.
# Cf. docs/EFE_A1_PHASE2_PR15_ARCHITECTURE.md § 21.
#
# Checkov is a SECONDARY signal (soft-fail in Job 10).  It overlaps
# Trivy and Polaris ; the value-add is that it catches a different
# class of K8s anti-patterns (e.g. "container missing imagePullPolicy",
# "Deployment has no ServiceAccount").
#
# Locally :  checkov -d <rendered-dir> --framework kubernetes --config-file .checkov.yaml
# In CI :    Job 10 / Checkov

framework:
  - kubernetes

# Soft-fail : never returns non-zero on findings.  Findings go to SARIF
# → GitHub Code Scanning.  This keeps Checkov informational.
soft-fail: true

# Output format : SARIF only.  No pretty-print to keep CI logs tight.
output:
  - sarif

output-file-path: /tmp/checkov.sarif

# Skip these checks — already covered by Polaris (Job 11) with EFE
# severity tiering, or by Conftest (Job 08) with our own Rego rules.
# Disabling here avoids duplicate-finding noise.
skip-check:
  # CKV_K8S_8  — liveness probe missing : Polaris owns this.
  - CKV_K8S_8
  # CKV_K8S_9  — readiness probe missing : Polaris owns this.
  - CKV_K8S_9
  # CKV_K8S_22 — readOnlyRootFilesystem : already enforced via Rego (security_context.rego).
  - CKV_K8S_22
  # CKV_K8S_23 — capabilities drop : enforced via Rego.
  - CKV_K8S_23
  # CKV_K8S_28 — capabilities drop ALL : enforced via Rego.
  - CKV_K8S_28
  # CKV_K8S_29 — securityContext at pod level : enforced via Rego.
  - CKV_K8S_29
  # CKV_K8S_30 — securityContext at container level : enforced via Rego.
  - CKV_K8S_30
  # CKV_K8S_43 — image tag pinning : our Rego rule no_latest_tag.rego is stricter.
  - CKV_K8S_43

# Hard-fail on these (overrides soft-fail) — they're security-critical
# enough that we WANT the SARIF to surface in Code Scanning even though
# the job itself is soft-fail.  Polaris doesn't catch this class.
hard-fail-on:
  - CKV_K8S_25       # Minimize the admission of containers with NET_RAW capability
  - CKV_K8S_31       # Ensure that the seccomp profile is set to docker/default or runtime/default

# Skip path patterns — already linted upstream or rendered-but-not-author.
skip-path:
  - charts/efe-stack/charts/efe-meta-swarm/tests/golden/
  - charts/efe-stack/charts/efe-meta-swarm/tests/__snapshot__/

# Enable Checkov 3.x's improved K8s ruleset (separate from the legacy
# 2.x rules).  Removes the deprecated CKV_K8S_27 (capabilities NET_RAW)
# in favour of the more-precise CKV2_K8S_27.
external-checks-dir: []
