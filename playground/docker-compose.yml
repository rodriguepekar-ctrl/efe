# EFE Playground — Docker Compose stack.
#
# Usage :
#   docker compose -f playground/docker-compose.yml up
#
# Open : http://localhost:8765/
#
# Override real embedder :
#   INSTALL_REAL_EMBEDDER=yes docker compose -f playground/docker-compose.yml up --build

version: "3.9"

services:
  playground:
    build:
      context: ..
      dockerfile: playground/Dockerfile
      args:
        INSTALL_REAL_EMBEDDER: "${INSTALL_REAL_EMBEDDER:-no}"
    image: efe-playground:1.0
    container_name: efe-playground
    ports:
      - "8765:8765"
    environment:
      - EFE_PLAYGROUND_BACKEND=auto
      - EFE_PLAYGROUND_AUDIT_KEY=playground-dev-audit-key-do-not-use-in-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:8765/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Security : non-root + read-only root FS + no new privileges
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
