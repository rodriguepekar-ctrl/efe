#                            efe-bench-harness
#  ──────────────────────────────────────────────────────────────────
#  PR #21 — public-bench harness.  Cross-version reproducible
#  benchmark + chaos orchestrator for the meta-swarm gRPC L2 surface.
#  PR #24 — public bench results pipeline (11 badges + 5 JSON API
#  endpoints + signed quarterly evidence + gh-pages deploy).
#
#  Reference : docs/EFE_A1_PHASE2_PR21_ARCHITECTURE.md
#              docs/EFE_A1_PHASE2_PR24_ARCHITECTURE.md
[package]
name        = "efe-bench-harness"
version     = "0.2.0"
edition     = "2021"
license     = "UNLICENSED"
description = "Public-bench harness + public-results publisher (PR #21 + PR #24)."
homepage    = "https://efe.example.com/bench"
repository  = "https://github.com/efe-ai/efe"
keywords    = ["bench", "chaos", "meta-swarm", "phase-2", "regression"]
categories  = ["command-line-utilities", "development-tools::testing"]
publish     = false

[[bin]]
name = "efe-bench-harness"
path = "src/main.rs"

[lib]
name = "efe_bench_harness"
path = "src/lib.rs"

[dependencies]
# Workspace shared
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = "0.9"
thiserror   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }
uuid        = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }

# Workspace internal — PR #20 loadgen consumed as a library (AD2).
efe-meta-swarm-loadgen = { path = "../../tools/loadgen" }

# Workspace internal — PR #23 § 10 : cluster-provisioner extracted to
# a shared crate (was previously inline at `src/cluster/`).  AC6
# guarantees byte-identical behaviour for PR #21 callers via the
# compat shim in `src/cluster/mod.rs`.
efe-cluster-provisioner = { path = "../../crates/efe-cluster-provisioner" }

# Harness-specific
clap        = { version = "4.5", features = ["derive", "env", "wrap_help"] }
humantime   = "2.1"
glob        = "0.3"
parking_lot = "0.12"
chrono      = { version = "0.4", features = ["serde", "clock"] }
tempfile    = "3.10"   # loadgen::profile_yaml_from_scenario writes a temp profile YAML

# PR #24 — publish module deps :
sha2        = "0.10"   # tamper-evidence on /api/history.json (AD19)
hex         = "0.4"    # SHA encoding
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }   # AD34 — fetch SLO snapshot

[dev-dependencies]
proptest = "1.5"
regex    = "1.10"  # D-T : cross-PR regex consistency tests (test-only).
