{{- if .Values.output.persistentVolumeClaim.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "efe-bench-harness.fullname" . }}-results
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-bench-harness.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.output.persistentVolumeClaim.size }}
  {{- with .Values.output.persistentVolumeClaim.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end -}}
