{{- if .Values.rbac.create -}}
{{- if not .Values.rbac.namespaceScoped -}}
{{- fail "rbac.namespaceScoped must be true (PR #21 AD21 / T93)" -}}
{{- end -}}
# PR #21 AD21 / T93 — strictly namespace-scoped (Role, not ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "efe-bench-harness.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-bench-harness.labels" . | nindent 4 }}
rules:
  # Watch pods (to confirm chart readiness + record chaos events).
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  # Apply chaos-mesh CRDs (only the kinds referenced under
  # deploy/chaos/pr21_meta_swarm/).
  - apiGroups: ["chaos-mesh.org"]
    resources: ["podchaos", "networkchaos", "stresschaos"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Read services / endpoints to resolve the controller URL.
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "efe-bench-harness.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe-bench-harness.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "efe-bench-harness.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "efe-bench-harness.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
