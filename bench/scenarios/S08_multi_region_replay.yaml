# PR #21 § 7.8 — S08 : multi-region weighted traffic.
# Requires `--provisioner=external` with a kubeconfig containing 3 contexts.

schema_version: 1
id: S08_multi_region_replay
description: "3-region weighted replay, 500 QPS each region"
duration: "20m"

cluster:
  provisioner: external
  # Operator supplies a kubeconfig with us-east, eu-west, ap-south contexts.

loadgen:
  version: 1
  name: S08-loadgen
  target:
    endpoints:
      - url: "grpc://ctrl.us-east.efe.svc:50051"
        weight: 0.4
      - url: "grpc://ctrl.eu-west.efe.svc:50051"
        weight: 0.3
      - url: "grpc://ctrl.ap-south.efe.svc:50051"
        weight: 0.3
    role: controller
    conns_per_target: 4
    per_request_deadline: "5s"
  pattern:
    type: constant
    qps: 1500   # ≈ 500 per region after weighted split
  workload:
    type: mixed
    mix:
      iterate: 0.95
      state:   0.05
  termination:
    duration: "20m"
  run:
    seed: 42
    mode: staging

chaos: []

results:
  collect_prom_snapshot: true

tolerance:
  p95_ms_max_delta_pct: 15
  p99_ms_max_delta_pct: 25
  error_rate_max_delta_pp: 0.5
  # Cross-region variance is the Phase-3 SLO ; for v0.6.0 we just
  # validate per-region p95 stays within tolerance.
