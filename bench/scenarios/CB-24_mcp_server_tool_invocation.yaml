# CB-24 — MCP server tool-invocation latency.
# Exercises `mcp-server/` (Model Context Protocol server).

schema_version: 1
suite: CB
id: CB-24_mcp_server_tool_invocation
family: integration
subsystem: mcp-server
description: "10k MCP tool invocations across 12 registered tools, 30s"
duration: "30s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    mcp_replicas: 1

loadgen:
  version: 1
  name: CB-24-loadgen
  target:
    endpoints:
      - url: "http://efe-mcp-server.efe.svc:8081/mcp"
        weight: 1.0
    role: mcp-client
    conns_per_target: 4
    per_request_deadline: "2s"
  pattern: { type: closed-loop-fixed, total_requests: 10000 }
  workload:
    type: mcp-tool-mix
    tool_mix:
      list_tools: 0.10
      describe_tool: 0.10
      invoke_simple: 0.40
      invoke_with_args: 0.25
      invoke_streaming: 0.15
  rate: { mode: closed-loop, max_concurrency: 32 }
  termination: { duration: "30s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-24-result.ndjson }
  run: { seed: 26024, mode: staging, allow_mutation: false }

chaos: []
results:
  collect_prom_snapshot: true
  emit_metrics: [tool_invoke_p99_ms, list_tools_p99_us, streaming_first_byte_p99_ms, schema_validation_pct]

tolerance:
  tool_invoke_p99_ms_max_delta_pct: 20
  streaming_first_byte_p99_ms_max_delta_pct: 25
  schema_validation_pct_absolute_min: 100.0
