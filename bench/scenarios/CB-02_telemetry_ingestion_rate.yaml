# CB-02 — Telemetry ingestion rate.
# Exercises `efe-telemetry` under ramped OTel span/metric load.
# Meta-Swarm NOT required.
#
# Frozen under STABILITY § 27.1 + § 27.2.
# Reference baseline : bench/baselines/CB-02.json

schema_version: 1
suite: CB
id: CB-02_telemetry_ingestion_rate
family: data-plane
subsystem: efe-telemetry
description: "Ramp 1k → 100k spans/sec over 60s, no MS"
duration: "60s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    telemetry_replicas: 1
    otel_collector_memory: "1Gi"

loadgen:
  version: 1
  name: CB-02-loadgen
  target:
    endpoints:
      - url: "grpc://efe-telemetry.efe.svc:4317"
        weight: 1.0
    role: otel-exporter
    conns_per_target: 8
    per_request_deadline: "500ms"
  pattern:
    type: linear-ramp
    qps_start: 1000
    qps_end: 100000
    ramp_duration: "50s"
  workload:
    type: otel-mixed
    span_size_bytes: 256
    spans_per_trace_mean: 5
    metric_points_per_second: 1000
  rate:
    mode: closed-loop
    max_concurrency: 500
  termination:
    duration: "60s"
  output:
    format: ndjson
    file: /var/run/loadgen/CB-02-result.ndjson
  run:
    seed: 26002
    mode: staging
    allow_mutation: true

chaos: []

results:
  collect_prom_snapshot: true
  collect_chaos_events: false
  emit_metrics:
    - max_sustained_spans_per_sec
    - per_span_overhead_us
    - propagation_p99_ms
    - drop_rate_pct

tolerance:
  max_sustained_spans_per_sec_min_delta_pct: -10
  propagation_p99_ms_max_delta_pct: 20
  drop_rate_pct_absolute_max: 0.0
