# PR #21 § 7.3 — S03 : capacity ceiling discovery.
# Ramp from 1 QPS to 5000 QPS ; stop when SLO breaches.

schema_version: 1
id: S03_ramp_to_breakdown
description: "20-min ramp 1→5000 QPS — capacity ceiling discovery"
duration: "20m"

cluster:
  provisioner: kind
  topology:
    controller_replicas: 3
    participant_replicas: 5

loadgen:
  version: 1
  name: S03-loadgen
  target:
    endpoints:
      - url: "grpc://efe-meta-swarm-controller.efe.svc:50051"
        weight: 1.0
    role: controller
    conns_per_target: 16
    per_request_deadline: "5s"
  pattern:
    type: ramp
    initial_qps: 1
    final_qps:   5000
    shape:       linear
    duration:    "20m"
  workload:
    type: mixed
    mix: { iterate: 1.0 }
  rate:
    mode: hybrid
    max_concurrency: 2000
  termination:
    duration: "20m"
    until_slo:
      iterate-availability: 0.95   # stop when availability drops below 95%
      iterate-latency-p99:  5.0
  run:
    seed: 42
    mode: staging

chaos: []

results:
  collect_prom_snapshot: true

tolerance:
  # Capacity ceiling is noisier — wider tolerance.
  p95_ms_max_delta_pct: 20
  p99_ms_max_delta_pct: 30
  throughput_qps_min_delta_pct: -30
