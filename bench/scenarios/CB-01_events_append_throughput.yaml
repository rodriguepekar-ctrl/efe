# CB-01 — Event-sourcing append throughput.
#
# Exercises `efe-events` under sustained append load.  Meta-Swarm
# coordination NOT required ; the event store runs as a standalone
# subsystem.
#
# Subsystem owner : data-plane team.
# Frozen under STABILITY § 27.1 + § 27.2.
# Reference baseline : bench/baselines/CB-01.json
# Catalogue : docs/architecture/EFE_CORE_BENCHMARK_CATALOGUE.md § 4.1

schema_version: 1
suite: CB
id: CB-01_events_append_throughput
family: data-plane
subsystem: efe-events
description: "Sustained 10k events/sec append throughput for 60s, no MS"
duration: "60s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    events_replicas: 1
    storage_size: "20Gi"

loadgen:
  version: 1
  name: CB-01-loadgen
  target:
    endpoints:
      - url: "grpc://efe-events.efe.svc:50061"
        weight: 1.0
    role: event-writer
    conns_per_target: 4
    per_request_deadline: "1s"
  pattern:
    type: constant
    qps: 10000
  workload:
    type: events-append
    event_size_bytes_mean: 512
    event_size_bytes_p99: 2048
    event_type_mix:
      created: 0.4
      updated: 0.4
      deleted: 0.1
      compacted: 0.1
  rate:
    mode: closed-loop
    max_concurrency: 200
  termination:
    duration: "60s"
  output:
    format: ndjson
    file: /var/run/loadgen/CB-01-result.ndjson
  run:
    seed: 26001
    mode: staging
    allow_mutation: true

chaos: []

results:
  collect_prom_snapshot: true
  collect_chaos_events: false
  emit_metrics:
    - append_rate_per_sec
    - append_p50_ms
    - append_p99_ms
    - storage_growth_mb_per_sec
    - error_rate_pct

tolerance:
  append_rate_per_sec_min_delta_pct: -10
  append_p99_ms_max_delta_pct: 20
  storage_growth_mb_per_sec_max_delta_pct: 5
  error_rate_pct_absolute_max: 0.0
