# CB-25 — SLO portal rollup throughput.
# Exercises `slos/rollup/` (15 source files) end-to-end.

schema_version: 1
suite: CB
id: CB-25_slos_rollup_throughput
family: compliance
subsystem: slos-rollup
description: "Rollup of 1 quarter (90 days) of SLI metrics across 4 SLO families"
duration: "600s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    slos_rollup_replicas: 1
    fixture_dataset: "bench/fixtures/CB-25_one_quarter_slis.ndjson"

loadgen:
  version: 1
  name: CB-25-runner
  target:
    binary: "efe-slos-rollup"
    subcommand: "rollup --quarter Q2-2026"
  pattern: { type: single-shot }
  workload:
    type: slos-rollup
    fixture: "/fixtures/CB-25_one_quarter_slis.ndjson"
    slo_families:
      - latency_p99
      - error_budget
      - throughput_floor
      - cost_per_request
  rate: { mode: serial, max_concurrency: 1 }
  termination: { duration: "600s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-25-result.ndjson }
  run: { seed: 26025, mode: staging, allow_mutation: true }

chaos: []
results:
  collect_prom_snapshot: true
  emit_metrics: [rollup_duration_sec, slis_per_sec_processed, peak_memory_mb, oracle_match_pct]

tolerance:
  rollup_duration_sec_max_delta_pct: 15
  oracle_match_pct_absolute_min: 100.0
  peak_memory_mb_max_delta_pct: 20
