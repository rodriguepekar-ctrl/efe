# CB-22 — Metering ingestion standalone (independent of billing rollup).
# Complements CB-12 which exercises billing+metering jointly.

schema_version: 1
suite: CB
id: CB-22_metering_ingestion_standalone
family: compliance
subsystem: efe-metering
description: "50k metering events/sec ingestion for 60s, no rollup"
duration: "60s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    metering_replicas: 1
    storage_buffer_mb: 256

loadgen:
  version: 1
  name: CB-22-loadgen
  target:
    endpoints:
      - url: "grpc://efe-metering.efe.svc:50211"
        weight: 1.0
    role: meter-producer
    conns_per_target: 8
    per_request_deadline: "200ms"
  pattern: { type: constant, qps: 50000 }
  workload:
    type: metering-events
    event_distribution:
      classify: 0.50
      embed: 0.25
      retrieve: 0.15
      tool_call: 0.10
    event_size_bytes_mean: 256
  rate: { mode: closed-loop, max_concurrency: 200 }
  termination: { duration: "60s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-22-result.ndjson }
  run: { seed: 26022, mode: staging, allow_mutation: true }

chaos: []
results:
  collect_prom_snapshot: true
  emit_metrics: [ingest_rate_per_sec, ingest_p99_ms, drop_rate_pct, storage_growth_mb_per_sec]

tolerance:
  ingest_rate_per_sec_min_delta_pct: -10
  ingest_p99_ms_max_delta_pct: 20
  drop_rate_pct_absolute_max: 0.0
