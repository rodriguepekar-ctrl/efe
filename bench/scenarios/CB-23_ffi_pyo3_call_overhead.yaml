# CB-23 — PyO3 Python ↔ Rust FFI call overhead.
# Exercises `efe-ffi` (M3, D25) in-process Python integration.

schema_version: 1
suite: CB
id: CB-23_ffi_pyo3_call_overhead
family: integration
subsystem: efe-ffi
description: "1M PyO3 FFI calls measuring per-call boundary overhead"
duration: "60s"
requires_meta_swarm: false
runs_in_process: true

cluster:
  provisioner: none

loadgen:
  version: 1
  name: CB-23-runner
  target:
    binary: "python3"
    args: ["bench/ffi/cb23_pyo3_overhead.py"]
  pattern: { type: single-shot }
  workload:
    type: ffi-roundtrip
    call_iterations: 1000000
    payload_shapes:
      - empty
      - small_dict
      - large_string
      - numpy_ndarray_1k
      - numpy_ndarray_1m
  rate: { mode: serial, max_concurrency: 1 }
  termination: { duration: "60s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-23-result.ndjson }
  run: { seed: 0, mode: ci, allow_mutation: false }

chaos: []
results:
  emit_metrics: [empty_call_ns, small_dict_call_ns, large_string_call_us, ndarray_1k_us, ndarray_1m_ms]

tolerance:
  empty_call_ns_absolute_max: 500
  small_dict_call_ns_absolute_max: 2000
  large_string_call_us_max_delta_pct: 15
  ndarray_1k_us_max_delta_pct: 15
  ndarray_1m_ms_max_delta_pct: 15
