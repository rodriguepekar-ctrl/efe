# PR #21 § 7.9 — S09 : 2-hour soak.  Runs on dedicated soak runner.

schema_version: 1
id: S09_soak_2h_stability
description: "2-hour soak test — leak / drift detection"
duration: "2h"

cluster:
  provisioner: external   # soak uses a long-lived test cluster
  topology:
    controller_replicas: 2
    participant_replicas: 3

loadgen:
  version: 1
  name: S09-loadgen
  target:
    endpoints:
      - url: "grpc://efe-meta-swarm-controller.efe.svc:50051"
        weight: 1.0
    role: controller
    conns_per_target: 4
    per_request_deadline: "5s"
  pattern:
    type: constant
    qps: 50
  workload:
    type: mixed
    mix:
      iterate: 0.95
      state:   0.05
  rate:
    mode: hybrid
    max_concurrency: 100
  termination:
    duration: "2h"
  run:
    seed: 42
    mode: staging

chaos: []

results:
  collect_prom_snapshot: true

tolerance:
  # Soak focus : drift, not absolute values.
  p50_ms_max_delta_pct: 25
  p95_ms_max_delta_pct: 25
  p99_ms_max_delta_pct: 35
  error_rate_max_delta_pp: 0.3
  # Phase-3 : drift sub-metric (last 30min vs first 30min p95).
