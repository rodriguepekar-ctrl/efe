# CB-A2 — Workspace test-suite total duration.
# Meta-benchmark : the time CI pays on every PR.
#
# Frozen under STABILITY § 27.1 + § 27.2.
# Reference baseline : bench/baselines/CB-A2.json

schema_version: 1
suite: CB
id: CB-A2_workspace_test_duration
family: meta-bench
subsystem: workspace
description: "Single full `cargo test --workspace --all-features` from clean state"
duration: "900s"
requires_meta_swarm: false
runs_in_process: true

cluster:
  provisioner: none

loadgen:
  version: 1
  name: CB-A2-runner
  target:
    binary: "cargo"
    subcommand: "test"
    args: ["--workspace", "--all-features", "--no-fail-fast"]
  pattern:
    type: single-shot
  workload:
    type: workspace-test-suite
    pre_clean: true
    record_compile_time: true
    record_test_time: true
  rate:
    mode: serial
    max_concurrency: 1
  termination:
    after_iterations: 1
  output:
    format: ndjson
    file: /var/run/loadgen/CB-A2-result.ndjson
  run:
    seed: 0
    mode: ci
    allow_mutation: false

chaos: []

results:
  emit_metrics:
    - total_duration_sec
    - compile_duration_sec
    - test_duration_sec
    - tests_executed
    - tests_passed
    - tests_failed
    - tests_ignored

tolerance:
  total_duration_sec_absolute_max: 600
  compile_duration_sec_absolute_max: 480
  tests_failed_absolute_max: 0
