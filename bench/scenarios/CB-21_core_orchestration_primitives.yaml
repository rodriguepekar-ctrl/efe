# CB-21 — Core orchestration primitives latency.
# Exercises `efe-core` types + errors + orchestration paths.
# In-process microbenchmarks ; no cluster needed.

schema_version: 1
suite: CB
id: CB-21_core_orchestration_primitives
family: inference
subsystem: efe-core
description: "Core type construction + error propagation + orchestration primitives"
duration: "60s"
requires_meta_swarm: false
runs_in_process: true

cluster:
  provisioner: none

loadgen:
  version: 1
  name: CB-21-runner
  target:
    binary: "cargo"
    subcommand: "bench"
    args: ["-p", "efe-core", "--bench", "core_primitives", "--", "--quick"]
  pattern: { type: single-shot }
  workload:
    type: criterion-bench
    expected_groups:
      - tenant_id_construction
      - error_propagation_layered
      - orchestration_step_dispatch
      - context_clone_cost
  rate: { mode: serial, max_concurrency: 1 }
  termination: { duration: "60s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-21-result.ndjson }
  run: { seed: 0, mode: ci, allow_mutation: false }

chaos: []
results:
  emit_metrics: [tenant_id_p99_ns, error_propagation_p99_ns, dispatch_p99_ns, context_clone_p99_ns]

tolerance:
  tenant_id_p99_ns_max_delta_pct: 20
  error_propagation_p99_ns_max_delta_pct: 20
  dispatch_p99_ns_max_delta_pct: 20
  context_clone_p99_ns_max_delta_pct: 20
