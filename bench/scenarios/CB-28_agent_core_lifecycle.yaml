# CB-28 — Agent core lifecycle latency.
# Exercises `agent-core/` (9 source files) lifecycle path.

schema_version: 1
suite: CB
id: CB-28_agent_core_lifecycle
family: integration
subsystem: agent-core
description: "1k agent lifecycle round-trips (create → invoke → tear-down), 60s"
duration: "60s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    agent_core_replicas: 1

loadgen:
  version: 1
  name: CB-28-loadgen
  target:
    endpoints:
      - url: "grpc://efe-agent-core.efe.svc:50231"
        weight: 1.0
    role: agent-control-client
    conns_per_target: 4
    per_request_deadline: "5s"
  pattern: { type: closed-loop-fixed, total_requests: 1000 }
  workload:
    type: agent-lifecycle
    lifecycle_phases:
      - create
      - configure
      - invoke
      - inspect
      - teardown
  rate: { mode: closed-loop, max_concurrency: 16 }
  termination: { duration: "60s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-28-result.ndjson }
  run: { seed: 26028, mode: staging, allow_mutation: true }

chaos: []
results:
  collect_prom_snapshot: true
  emit_metrics: [lifecycle_p99_ms, per_phase_p99_ms, leak_count, completed_per_sec]

tolerance:
  lifecycle_p99_ms_max_delta_pct: 20
  leak_count_absolute_max: 0
  completed_per_sec_min_delta_pct: -10
