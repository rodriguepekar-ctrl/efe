# PR #21 § 7.2 — S02 : production-like canary load.
# Validates dashboards + alerts under realistic traffic.

schema_version: 1
id: S02_canary_1000qps_15min
description: "15-min canary load at 1000 QPS, mixed 95/5"
duration: "15m"

cluster:
  provisioner: kind
  topology:
    controller_replicas: 3
    participant_replicas: 5

loadgen:
  version: 1
  name: S02-loadgen
  target:
    endpoints:
      - url: "grpc://efe-meta-swarm-controller.efe.svc:50051"
        weight: 1.0
    role: controller
    conns_per_target: 8
    per_request_deadline: "3s"
  pattern:
    type: constant
    qps: 1000
  workload:
    type: mixed
    mix:
      iterate: 0.95
      state:   0.05
  rate:
    mode: hybrid
    max_concurrency: 500
  termination:
    duration: "15m"
  output:
    format: ndjson
    file: /var/run/loadgen/S02-result.ndjson
  run:
    seed: 42
    mode: staging

chaos: []

results:
  collect_prom_snapshot: true

tolerance:
  p50_ms_max_delta_pct: 15
  p95_ms_max_delta_pct: 15
  p99_ms_max_delta_pct: 20
  error_rate_max_delta_pp: 0.3
  throughput_qps_min_delta_pct: -10
