# PR #21 § 7.6 — S06 : TLS cert expiry mid-run.

schema_version: 1
id: S06_chaos_cert_expiry
description: "Chaos : TLS cert expires mid-run, cert-manager auto-rotates"
duration: "10m"

cluster:
  provisioner: kind
  topology:
    controller_replicas: 2
    participant_replicas: 3
  namespace: efe-bench-s06

loadgen:
  version: 1
  name: S06-loadgen
  target:
    endpoints:
      - url: "grpcs://efe-meta-swarm-controller.efe.svc:50051"
        weight: 1.0
    mtls:
      cert_path: /etc/efe/tls/tls.crt
      key_path:  /etc/efe/tls/tls.key
      ca_path:   /etc/efe/tls/ca.crt
      expected_san: "efe-meta-swarm-controller.efe.svc"
  pattern:
    type: constant
    qps: 100
  workload:
    type: mixed
    mix: { iterate: 1.0 }
  termination:
    duration: "10m"
  run:
    seed: 42
    mode: staging
    chaos_marker: "S06-cert-expiry"

chaos:
  - id: cert-rotation
    at_offset: "2m"
    crd_file: pr21_meta_swarm/cert-expiry.yaml

results:
  collect_prom_snapshot: true
  collect_chaos_events: true

tolerance:
  # 30 s rotation window allows some error rate but recovery should be clean.
  p99_ms_max_delta_pct: 25
  error_rate_max_delta_pp: 1.0
  recovery_time_s_max_delta_s: 30
