# CB-12 — Billing rollup computation against monthly metering trace.
# Exercises `efe-billing` + `efe-metering` end to end.
#
# Frozen under STABILITY § 27.1 + § 27.2.
# Reference baseline : bench/baselines/CB-12.json

schema_version: 1
suite: CB
id: CB-12_billing_rollup_computation
family: compliance
subsystem: efe-billing
description: "Rollup a 30-day synthetic metering trace (~1M events / tenant)"
duration: "300s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    billing_replicas: 1
    metering_replicas: 1
    billing_memory_limit: "2Gi"
    fixture_dataset: "bench/fixtures/CB-12_one_tenant_month.ndjson"

loadgen:
  version: 1
  name: CB-12-loadgen
  target:
    endpoints:
      - url: "grpc://efe-billing.efe.svc:50161"
        weight: 1.0
    role: rollup-driver
    conns_per_target: 1
    per_request_deadline: "300s"
  pattern:
    type: single-shot
  workload:
    type: billing-rollup
    fixture: "/fixtures/CB-12_one_tenant_month.ndjson"
    expected_events: 1000000
  rate:
    mode: serial
    max_concurrency: 1
  termination:
    duration: "300s"
  output:
    format: ndjson
    file: /var/run/loadgen/CB-12-result.ndjson
  run:
    seed: 26012
    mode: staging
    allow_mutation: true

chaos: []

results:
  collect_prom_snapshot: true
  emit_metrics:
    - rollup_duration_sec
    - oracle_match_pct
    - peak_memory_mb
    - events_per_sec_processed

tolerance:
  rollup_duration_sec_max_delta_pct: 15
  oracle_match_pct_absolute_min: 100.0
  peak_memory_mb_max_delta_pct: 20
