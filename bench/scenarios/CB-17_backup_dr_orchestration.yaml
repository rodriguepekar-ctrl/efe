# CB-17 — Backup orchestration end-to-end time.
# Exercises `efe-backup` (D17) backup + restore round-trip.

schema_version: 1
suite: CB
id: CB-17_backup_dr_orchestration
family: data-plane
subsystem: efe-backup
description: "Backup → restore round-trip for synthetic 10GB tenant dataset"
duration: "1800s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    backup_replicas: 1
    s3_endpoint_mocked: true
    fixture_size_gb: 10

loadgen:
  version: 1
  name: CB-17-runner
  target:
    binary: "efe-backup"
    subcommand: "snapshot-restore-cycle"
  pattern: { type: single-shot }
  workload:
    type: backup-restore-roundtrip
    snapshot_compression: zstd
    parallel_streams: 4
    integrity_verification: blake3
  rate: { mode: serial, max_concurrency: 1 }
  termination: { duration: "1800s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-17-result.ndjson }
  run: { seed: 26017, mode: staging, allow_mutation: true }

chaos: []
results:
  collect_prom_snapshot: true
  emit_metrics: [snapshot_duration_sec, restore_duration_sec, peak_memory_mb, integrity_verified_pct, throughput_mb_per_sec]

tolerance:
  snapshot_duration_sec_max_delta_pct: 15
  restore_duration_sec_max_delta_pct: 15
  integrity_verified_pct_absolute_min: 100.0
