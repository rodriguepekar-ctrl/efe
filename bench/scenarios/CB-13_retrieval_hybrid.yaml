# CB-13 — Hybrid retrieval (BM25 sparse + RRF fusion + dense) latency.
# Exercises `efe-retrieval` (M32).  Meta-Swarm NOT required.

schema_version: 1
suite: CB
id: CB-13_retrieval_hybrid
family: data-plane
subsystem: efe-retrieval
description: "10k hybrid queries (BM25 + dense + RRF) over 60s"
duration: "60s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    retrieval_replicas: 1
    corpus_size: 1000000
    embedding_dim: 768

loadgen:
  version: 1
  name: CB-13-loadgen
  target:
    endpoints:
      - url: "grpc://efe-retrieval.efe.svc:50171"
        weight: 1.0
    role: retrieval-client
    conns_per_target: 8
    per_request_deadline: "2s"
  pattern:
    type: constant
    qps: 167
  workload:
    type: retrieval-hybrid
    bm25_share: 0.40
    dense_share: 0.40
    hybrid_rrf_share: 0.20
    k_top: 20
    rrf_constant: 60
  rate: { mode: closed-loop, max_concurrency: 32 }
  termination: { duration: "60s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-13-result.ndjson }
  run: { seed: 26013, mode: staging, allow_mutation: false }

chaos: []
results:
  collect_prom_snapshot: true
  emit_metrics: [retrieval_p99_ms, recall_at_20_pct, rrf_overhead_us, qps_at_saturation]

tolerance:
  retrieval_p99_ms_max_delta_pct: 20
  recall_at_20_pct_absolute_min: 92.0
  rrf_overhead_us_max_delta_pct: 15
  qps_at_saturation_min_delta_pct: -10
