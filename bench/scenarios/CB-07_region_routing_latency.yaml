# CB-07 — Region-routing decision latency.
# Exercises `efe-region` across 4 declared regions.
#
# Frozen under STABILITY § 27.1 + § 27.2.
# Reference baseline : bench/baselines/CB-07.json

schema_version: 1
suite: CB
id: CB-07_region_routing_latency
family: control-plane
subsystem: efe-region
description: "50k routing decisions across 4 regions in 10s"
duration: "10s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    region_replicas: 1
    declared_regions:
      - eu-north-1
      - eu-west-1
      - us-east-1
      - ap-southeast-1

loadgen:
  version: 1
  name: CB-07-loadgen
  target:
    endpoints:
      - url: "grpc://efe-region.efe.svc:50111"
        weight: 1.0
    role: region-client
    conns_per_target: 8
    per_request_deadline: "100ms"
  pattern:
    type: closed-loop-fixed
    total_requests: 50000
  workload:
    type: region-routing
    origin_region_distribution:
      eu-north-1: 0.55
      eu-west-1: 0.25
      us-east-1: 0.15
      ap-southeast-1: 0.05
  rate:
    mode: closed-loop
    max_concurrency: 256
  termination:
    duration: "10s"
  output:
    format: ndjson
    file: /var/run/loadgen/CB-07-result.ndjson
  run:
    seed: 26007
    mode: staging
    allow_mutation: false

chaos: []

results:
  collect_prom_snapshot: true
  emit_metrics:
    - decision_p50_us
    - decision_p99_us
    - routing_correctness_pct
    - internal_cache_hit_rate_pct

tolerance:
  decision_p99_us_max_delta_pct: 25
  routing_correctness_pct_absolute_min: 100.0
  internal_cache_hit_rate_pct_absolute_delta_pp_max: 3
