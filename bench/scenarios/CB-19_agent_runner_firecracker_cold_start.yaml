# CB-19 — Firecracker microVM cold-start (agent runner).
# Exercises `efe-agent-runner` (M25 EXPERIMENTAL) sandbox path.

schema_version: 1
suite: CB
id: CB-19_agent_runner_firecracker_cold_start
family: control-plane
subsystem: efe-agent-runner
description: "20 Firecracker microVM cold-starts with minimal LLM-agent payload"
duration: "300s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    agent_runner_replicas: 1
    firecracker_kernel: "vmlinux-frozen-5.10"
    rootfs_image: "frozen-agent-rootfs-v1.4"
    kvm_required: true

loadgen:
  version: 1
  name: CB-19-runner
  target:
    binary: "efe-agent-runner"
    subcommand: "spawn --agent minimal --teardown"
  pattern:
    type: serial
    iterations: 20
  workload:
    type: microvm-cold-start
    agent_payload_kb: 64
    cooldown_between_runs_s: 2
  rate: { mode: serial, max_concurrency: 1 }
  termination: { duration: "300s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-19-result.ndjson }
  run: { seed: 26019, mode: staging, allow_mutation: true }

chaos: []
results:
  collect_prom_snapshot: true
  emit_metrics: [vm_boot_p99_ms, agent_ready_p99_ms, teardown_p99_ms, escape_attempts_detected]

tolerance:
  vm_boot_p99_ms_absolute_max: 500
  agent_ready_p99_ms_absolute_max: 2000
  teardown_p99_ms_absolute_max: 1000
  escape_attempts_detected_absolute_max: 0
