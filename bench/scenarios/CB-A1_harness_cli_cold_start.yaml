# CB-A1 — Bench harness CLI cold-start time.
# Meta-benchmark : measures the binary's own startup behaviour.
#
# Frozen under STABILITY § 27.1 + § 27.2.
# Reference baseline : bench/baselines/CB-A1.json

schema_version: 1
suite: CB
id: CB-A1_harness_cli_cold_start
family: meta-bench
subsystem: efe-bench
description: "50 cold-start invocations of `efe-bench-harness validate`"
duration: "60s"
requires_meta_swarm: false
runs_in_process: true

cluster:
  provisioner: none

loadgen:
  version: 1
  name: CB-A1-runner
  target:
    binary: "efe-bench-harness"
    subcommand: "validate"
    args: ["bench/scenarios/CB-01_events_append_throughput.yaml"]
  pattern:
    type: serial
    iterations: 50
  workload:
    type: cli-cold-start
    cooldown_between_runs_ms: 100
  rate:
    mode: serial
    max_concurrency: 1
  termination:
    after_iterations: 50
  output:
    format: ndjson
    file: /var/run/loadgen/CB-A1-result.ndjson
  run:
    seed: 0
    mode: ci
    allow_mutation: false

chaos: []

results:
  emit_metrics:
    - cold_start_median_ms
    - cold_start_p99_ms

tolerance:
  cold_start_median_ms_absolute_max: 200
  cold_start_p99_ms_absolute_max: 500
