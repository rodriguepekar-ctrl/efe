# CB-18 — Admin CLI tenant onboarding latency.
# Exercises `efe-admin` (D8) 30-min POC onboarding wizard.

schema_version: 1
suite: CB
id: CB-18_admin_tenant_onboarding
family: control-plane
subsystem: efe-admin
description: "10 cold tenant onboarding flows (clean tenant → first classify) in 60s"
duration: "60s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    admin_replicas: 1
    server_replicas: 1

loadgen:
  version: 1
  name: CB-18-runner
  target:
    binary: "efe-admin"
    subcommand: "tenant onboard --wizard --noninteractive"
  pattern:
    type: serial
    iterations: 10
  workload:
    type: tenant-onboarding-flow
    steps_per_flow: 7
    skip_dns_propagation_wait: true
    teardown_between_runs: true
  rate: { mode: serial, max_concurrency: 1 }
  termination: { duration: "60s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-18-result.ndjson }
  run: { seed: 26018, mode: staging, allow_mutation: true }

chaos: []
results:
  collect_prom_snapshot: true
  emit_metrics: [onboarding_total_sec_p50, onboarding_total_sec_p99, per_step_p99_ms, attestation_chain_present_pct]

tolerance:
  onboarding_total_sec_p99_absolute_max: 1800
  per_step_p99_ms_max_delta_pct: 25
  attestation_chain_present_pct_absolute_min: 100.0
