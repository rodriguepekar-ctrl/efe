# CB-A4 — Helm chart install time (meta-benchmark).
# Measures `charts/` install latency end-to-end on kind.

schema_version: 1
suite: CB
id: CB-A4_helm_chart_install_time
family: meta-bench
subsystem: charts
description: "5 cold-installs of the EFE umbrella Helm chart on fresh kind"
duration: "1800s"
requires_meta_swarm: false
runs_in_process: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  prepull_images: true

loadgen:
  version: 1
  name: CB-A4-runner
  target:
    binary: "helm"
    subcommand: "install efe charts/efe --wait --timeout 300s"
  pattern: { type: serial, iterations: 5 }
  workload:
    type: helm-install-cycle
    teardown_between_runs: true
    expected_resources_min: 25
  rate: { mode: serial, max_concurrency: 1 }
  termination: { duration: "1800s" }
  output: { format: ndjson, file: /var/run/loadgen/CB-A4-result.ndjson }
  run: { seed: 0, mode: ci, allow_mutation: true }

chaos: []
results:
  emit_metrics:
    - install_median_sec
    - install_p99_sec
    - resources_created
    - readiness_median_sec

tolerance:
  install_median_sec_absolute_max: 240
  install_p99_sec_absolute_max: 300
  readiness_median_sec_absolute_max: 180
