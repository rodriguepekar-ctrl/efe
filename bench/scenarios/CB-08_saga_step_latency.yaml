# CB-08 — Saga step-latency and throughput.
# Exercises `efe-saga` with multi-step transactions + rollback.
#
# Frozen under STABILITY § 27.1 + § 27.2.
# Reference baseline : bench/baselines/CB-08.json

schema_version: 1
suite: CB
id: CB-08_saga_step_latency
family: control-plane
subsystem: efe-saga
description: "1k sagas with 80% success / 20% forced rollback, 30s"
duration: "30s"
requires_meta_swarm: false

cluster:
  provisioner: kind
  kind_image: kindest/node:v1.30.0
  topology:
    saga_replicas: 1
    saga_storage: "5Gi"

loadgen:
  version: 1
  name: CB-08-loadgen
  target:
    endpoints:
      - url: "grpc://efe-saga.efe.svc:50121"
        weight: 1.0
    role: saga-orchestrator-client
    conns_per_target: 4
    per_request_deadline: "5s"
  pattern:
    type: closed-loop-fixed
    total_requests: 1000
  workload:
    type: saga-mixed
    step_count_min: 3
    step_count_max: 12
    success_share: 0.8
    rollback_share: 0.2
    per_step_latency_target_ms: 50
  rate:
    mode: closed-loop
    max_concurrency: 32
  termination:
    duration: "30s"
  output:
    format: ndjson
    file: /var/run/loadgen/CB-08-result.ndjson
  run:
    seed: 26008
    mode: staging
    allow_mutation: true

chaos: []

results:
  collect_prom_snapshot: true
  emit_metrics:
    - step_p50_ms
    - step_p99_ms
    - saga_p50_ms
    - saga_p99_ms
    - completed_sagas_per_sec
    - rollback_success_pct

tolerance:
  saga_p99_ms_max_delta_pct: 20
  completed_sagas_per_sec_min_delta_pct: -10
  rollback_success_pct_absolute_min: 100.0
