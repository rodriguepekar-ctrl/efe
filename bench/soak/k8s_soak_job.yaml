# bench/soak/k8s_soak_job.yaml — Sprint D9.4 24 h soak runner.
#
# Deploys a sidecar Job that runs `bench/soak/run_soak_test.sh` for
# 24 h against the in-cluster `efe.efe.svc.cluster.local:50051`
# Service. Samples RSS via Prometheus (assumes the Helm chart's
# ServiceMonitor is enabled and prometheus-operator is reachable
# at `monitoring.svc:9090` — adjust if your cluster differs).
#
# Prerequisites:
#   * efe-server installed via `helm install efe deploy/helm/efe`
#     in namespace `efe`.
#   * prometheus-operator running in `monitoring` namespace OR
#     reachable URL passed via the `PROM_URL` env.
#
# Apply:
#   kubectl apply -f bench/soak/k8s_soak_job.yaml
#
# Monitor:
#   kubectl logs -n efe -l job-name=efe-soak -f
#
# Inspect after completion:
#   kubectl cp efe/$(kubectl get pod -n efe -l job-name=efe-soak \
#       -o jsonpath='{.items[0].metadata.name}'):/work/soak/ \
#       ./target/soak/
#   open ./target/soak/leak_report.md

apiVersion: batch/v1
kind: Job
metadata:
  name: efe-soak
  namespace: efe
  labels:
    app.kubernetes.io/name: efe
    app.kubernetes.io/component: soak-test
    app.kubernetes.io/sprint: d9
spec:
  # The Job is one-shot — no parallelism, no retries on success.
  parallelism: 1
  completions: 1
  # 24 h soak + 30 min margin for the leak detector + artifact pickup.
  activeDeadlineSeconds: 90000     # 25 h
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800  # keep logs/artefacts 7 days
  template:
    metadata:
      labels:
        app.kubernetes.io/name: efe
        app.kubernetes.io/component: soak-test
    spec:
      restartPolicy: Never
      serviceAccountName: efe-soak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # nobody — distroless default
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
      containers:
        - name: soak-runner
          # Use a slim image with python3, curl, ghz, bash. The
          # `efe-bench` image is published alongside `efe-server`
          # by the release workflow (D9.6).
          image: ghcr.io/efe-project/efe-bench:0.1.9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ENDPOINT
              value: "efe.efe.svc.cluster.local:50051"
            - name: DURATION
              value: "24h"
            - name: PROM_URL
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
            - name: PROM_QUERY
              # The SLO covers the *server* RSS, not the bench
              # container's. ServiceMonitor scrapes label
              # `app=efe`, so this query matches both
              # main + canary deployments.
              value: 'process_resident_memory_bytes{app="efe"}'
            - name: SLOPE_THRESHOLD_BPS
              value: "870"
            - name: OUTPUT_DIR
              value: "/work/soak"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -Eeuo pipefail
              cd /work
              git clone --depth 1 https://github.com/efe-project/efe.git src
              bash src/bench/soak/run_soak_test.sh \
                --duration "$DURATION" \
                --endpoint "$ENDPOINT" \
                --rss-source prometheus \
                --prom-url "$PROM_URL" \
                --prom-query "$PROM_QUERY" \
                --slope-threshold "$SLOPE_THRESHOLD_BPS" \
                --output-dir "$OUTPUT_DIR"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
---
# Dedicated SA for the soak Job. It does NOT need k8s API access ;
# automountServiceAccountToken=false on the pod ensures no token is
# mounted. The SA exists primarily for audit clarity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: efe-soak
  namespace: efe
  labels:
    app.kubernetes.io/name: efe
    app.kubernetes.io/component: soak-test
automountServiceAccountToken: false
