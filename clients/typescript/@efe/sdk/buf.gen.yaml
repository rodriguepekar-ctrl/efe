# Sprint D24 (Φ-B) — buf generate config (TS codegen).
#
# Two plugins :
#   1. protoc-gen-es           : message classes (Verdict enum, ExecuteRequest, ...)
#   2. protoc-gen-connect-es   : RPC client / service descriptors compatible
#                                 with @grpc/grpc-js (Node) AND connect-web (Browser).
#
# `import_extension=.js` is REQUIRED for ESM — generated .ts files
# import siblings via `.js` extension (NodeNext resolution).

version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-es
    out: src/_generated
    opt:
      - target=ts
      - import_extension=.js
  - local: protoc-gen-connect-es
    out: src/_generated
    opt:
      - target=ts
      - import_extension=.js
