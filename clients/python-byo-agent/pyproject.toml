[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efe-agent"
version = "0.20.0"
description = "BYO-LLM agent SDK for the EFE (Engaging Fluide Éphémère) classification platform — M20"
readme = "efe_byo_agent/README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "EFE Team", email = "engineering@efe-project.org"}]
keywords = ["efe", "classification", "llm", "mcp", "agent", "byo-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
# Hosted commercial providers
anthropic     = ["anthropic>=0.45.0"]
openai        = ["openai>=1.50.0"]
bedrock       = ["boto3>=1.35.0"]
azure-openai  = ["openai>=1.50.0", "azure-identity>=1.18.0"]
vertex        = ["google-cloud-aiplatform>=1.70.0"]

# Self-host : VLLMProvider + LlamaCppProvider delegate to OpenAIProvider,
# so the openai SDK is required here too.
vllm          = ["openai>=1.50.0"]
llama-cpp     = ["openai>=1.50.0"]

# Local on-device
mlx           = ["mlx-lm>=0.20.0"]

# Bundle of all hosted providers (for power-users with multi-vendor setups).
all           = [
    "anthropic>=0.45.0",
    "openai>=1.50.0",
    "boto3>=1.35.0",
    "azure-identity>=1.18.0",
    "google-cloud-aiplatform>=1.70.0",
    "mlx-lm>=0.20.0",
]

# Test / dev tooling.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "respx>=0.20",
]

[project.scripts]
efe-agent = "efe_byo_agent.cli:main"

[project.urls]
Homepage      = "https://github.com/efe-project/efe"
Documentation = "https://github.com/efe-project/efe/tree/main/docs"
Repository    = "https://github.com/efe-project/efe"
Issues        = "https://github.com/efe-project/efe/issues"
Architecture  = "https://github.com/efe-project/efe/blob/main/docs/EFE_M20_BYO_LLM_AGENT_SDK_ARCHITECTURE.md"

[tool.setuptools.packages.find]
where   = ["."]
include = ["efe_byo_agent*"]

[tool.setuptools.package-data]
efe_byo_agent = [
    "prompts/*.md",
    "py.typed",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
