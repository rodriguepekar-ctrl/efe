<svg xmlns="http://www.w3.org/2000/svg" width="1360" viewBox="0 0 680 270" role="img"><rect x="0" y="0" width="680" height="4000" fill="#ffffff"/>
<title>La mesure de Lipschitz qui arbitre l'hypothèse H1</title>
<desc>Diagramme en barres horizontales : le certificat analytique beta-1 environ 0,17 est réfuté ; la sonde mesure L-chapeau 0,366 en topologie fixe et 0,691 en topologie dynamique ; le seuil H1 vaut 1. Les mesures sont des bornes inférieures, property-testées, non certifiées.</desc>
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#12161c}
.th{font-size:14px;font-weight:500;fill:#12161c}
.ts{font-size:12px;fill:#3a4552}
rect.box{fill:#f4f6f9;stroke:#b4b2a9;stroke-width:0.5}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.7;stroke-dasharray:3 3;fill:none}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}
.c-green>text.th{fill:#27500A}.c-green>text.ts{fill:#3B6D11}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}
.c-amber>text.th{fill:#633806}.c-amber>text.ts{fill:#854F0B}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}
.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
circle.c-teal{fill:#5DCAA5;stroke:#0F6E56}
marker path{stroke:#5f5e5a}
</style><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#888780" stroke-width="1.5"/></pattern>
</defs>
<line x1="170" y1="40" x2="170" y2="192" stroke="#c3c2b7" stroke-width="1"/>
<text class="ts" x="160" y="70" text-anchor="end" dominant-baseline="central">β₁ (forme fermée)</text>
<rect x="170" y="60" width="67" height="20" rx="2" fill="#D3D1C7"/>
<rect x="170" y="60" width="67" height="20" rx="2" fill="url(#hatch)"/>
<text class="ts" x="245" y="70" dominant-baseline="central">0.17 · réfuté comme certificat</text>
<text class="ts" x="160" y="120" text-anchor="end" dominant-baseline="central">L̂ · topologie fixe</text>
<rect x="170" y="110" width="144" height="20" rx="2" fill="#378ADD"/>
<text class="t" x="322" y="120" dominant-baseline="central">0.366</text>
<text class="ts" x="160" y="170" text-anchor="end" dominant-baseline="central">L̂ · topo. dynamique</text>
<rect x="170" y="160" width="272" height="20" rx="2" fill="#185FA5"/>
<text class="t" x="450" y="170" dominant-baseline="central">0.691</text>
<line x1="564" y1="42" x2="564" y2="192" stroke="#E24B4A" stroke-width="1" stroke-dasharray="5 4"/>
<text class="ts" x="564" y="30" text-anchor="middle" dominant-baseline="central">seuil H1 · L = 1</text>
<text class="ts" x="170" y="205" text-anchor="middle" dominant-baseline="central">0</text>
<text class="ts" x="367" y="205" text-anchor="middle" dominant-baseline="central">0.5</text>
<text class="ts" x="564" y="205" text-anchor="middle" dominant-baseline="central">1.0</text>
<text class="ts" x="385" y="238" text-anchor="middle" dominant-baseline="central">bornes inférieures (sonde adverse M1.c) · property-testé, non certifié</text>
</svg>
