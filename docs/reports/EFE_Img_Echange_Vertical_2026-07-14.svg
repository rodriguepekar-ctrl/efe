<svg xmlns="http://www.w3.org/2000/svg" width="1360" viewBox="0 0 680 440" role="img"><rect x="0" y="0" width="680" height="4000" fill="#ffffff"/>
<title>Le vertical d'agrégation : nano-agents, essaim, méta-essaim</title>
<desc>En bas, l'intérieur d'un essaim : sept nano-agents dont un actif relié aux autres par des lignes d'attention d'épaisseur variable. Au milieu, trois essaims exposés comme opérateurs Phi. En haut, le méta-consensus z qui agrège par moyenne uniforme et renvoie un pull en pointillés (couplage de Krasnoselskii-Mann).</desc>
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#12161c}
.th{font-size:14px;font-weight:500;fill:#12161c}
.ts{font-size:12px;fill:#3a4552}
rect.box{fill:#f4f6f9;stroke:#b4b2a9;stroke-width:0.5}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.7;stroke-dasharray:3 3;fill:none}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}
.c-green>text.th{fill:#27500A}.c-green>text.ts{fill:#3B6D11}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}
.c-amber>text.th{fill:#633806}.c-amber>text.ts{fill:#854F0B}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}
.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
circle.c-teal{fill:#5DCAA5;stroke:#0F6E56}
marker path{stroke:#5f5e5a}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-purple">
  <rect x="190" y="40" width="300" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">z · méta-consensus</text>
  <text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">Ψ moyenne uniforme + projection P_C</text>
</g>
<line x1="175" y1="178" x2="268" y2="106" class="arr" marker-end="url(#arrow)"/>
<line x1="395" y1="178" x2="340" y2="106" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="178" x2="412" y2="106" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="106" x2="140" y2="176" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
<g class="node c-teal">
  <rect x="50" y="180" width="250" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="175" y="198" text-anchor="middle" dominant-baseline="central">essaim 1 → Φ₁(x)</text>
  <text class="ts" x="175" y="216" text-anchor="middle" dominant-baseline="central">fusion itérée → h★</text>
</g>
<g class="node c-teal">
  <rect x="320" y="180" width="150" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="395" y="208" text-anchor="middle" dominant-baseline="central">essaim 2 → Φ₂</text>
</g>
<g class="node c-teal">
  <rect x="490" y="180" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="208" text-anchor="middle" dominant-baseline="central">essaim 3 → Φ₃</text>
</g>
<line x1="55" y1="240" x2="55" y2="276" class="leader"/>
<line x1="295" y1="240" x2="295" y2="276" class="leader"/>
<rect x="50" y="280" width="250" height="100" rx="8" fill="none" stroke="#888780" stroke-width="0.7" stroke-dasharray="4 3"/>
<text class="ts" x="175" y="296" text-anchor="middle" dominant-baseline="central">intérieur d'un essaim</text>
<line x1="142" y1="320" x2="83" y2="320" stroke="#1D9E75" stroke-width="0.8" opacity="0.35"/>
<line x1="142" y1="320" x2="108" y2="320" stroke="#1D9E75" stroke-width="1.5" opacity="0.55"/>
<line x1="142" y1="320" x2="133" y2="320" stroke="#1D9E75" stroke-width="2.5" opacity="0.9"/>
<line x1="158" y1="320" x2="167" y2="320" stroke="#1D9E75" stroke-width="2.5" opacity="0.9"/>
<line x1="158" y1="320" x2="192" y2="320" stroke="#1D9E75" stroke-width="1.5" opacity="0.55"/>
<line x1="158" y1="320" x2="217" y2="320" stroke="#1D9E75" stroke-width="0.8" opacity="0.35"/>
<circle class="c-gray" cx="75" cy="320" r="8" stroke-width="0.5"/>
<circle class="c-gray" cx="100" cy="320" r="8" stroke-width="0.5"/>
<circle class="c-gray" cx="125" cy="320" r="8" stroke-width="0.5"/>
<circle class="c-teal" cx="150" cy="320" r="8" stroke-width="1"/>
<circle class="c-gray" cx="175" cy="320" r="8" stroke-width="0.5"/>
<circle class="c-gray" cx="200" cy="320" r="8" stroke-width="0.5"/>
<circle class="c-gray" cx="225" cy="320" r="8" stroke-width="0.5"/>
<text class="ts" x="175" y="360" text-anchor="middle" dominant-baseline="central">N lignes h_i · attention N×N</text>
<rect x="70" y="405" width="10" height="10" rx="2" fill="#7F77DD"/>
<text class="ts" x="86" y="410" dominant-baseline="central">méta-consensus</text>
<rect x="210" y="405" width="10" height="10" rx="2" fill="#1D9E75"/>
<text class="ts" x="226" y="410" dominant-baseline="central">essaims (Φ)</text>
<line x1="330" y1="410" x2="358" y2="410" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="ts" x="366" y="410" dominant-baseline="central">pull γ (couplage Krasnoselskii–Mann)</text>
</svg>
