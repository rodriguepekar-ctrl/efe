site_name: EFE Documentation
site_description: Ephemeral Fluid Swarm - multi-agent inference via shared latent space
site_url: https://docs.efe.ai
repo_url: https://github.com/efe-ai/efe
edit_uri: edit/main/docs/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Sprint D10 — zero-drift code↔docs. Allows ``--8<-- "examples/01_…"``
      # to inline a snippet from a real, tested example file.
      check_paths: true
      base_path:
        - "."
        - ".."
        - "../examples"
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

# Sprint D10 plugins — mkdocstrings (auto API ref) + mike (versioning).
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["../clients/python"]
          options:
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            show_source: false
            members_order: source
            filters: ["!^_"]   # hide private symbols (efe_tool._internal etc.)
  # `mike` is configured but the actual ``mike deploy`` happens in CI
  # (see ``.github/workflows/docs.yml`` and ``release.yml``).

# Diátaxis-aligned navigation (Sprint D10 §5.1).
nav:
  - Home: index.md
  - Tutorial:
      - Quickstart: tutorial/quickstart.md
      - Concepts: tutorial/concepts.md
      - Your first classifier: tutorial/your-first-classifier.md
  - How-to:
      - Install: howto/install.md
      - Authentication: howto/auth.md
      - Custom catalog: howto/custom-catalog.md
      - Catalog admin (server-side): howto/catalog-admin.md
      - Catalog evolution: howto/catalog-evolution.md
      - Observability: howto/observability.md
      - Observability setup (D13): howto/observability-setup.md
      - Cardinality management (D13): howto/cardinality-management.md
      - Streaming: howto/streaming.md
      - Retries: howto/retries.md
      - Language detection: howto/language-detection.md
      - Multi-tenant deployment: howto/multi-tenant.md
  - Reference:
      - API: reference/api.md
      - CLI: reference/cli.md
      - Errors: reference/errors.md
      - Catalog schema: reference/catalog-schema.md
      - Catalog RPC (CatalogService): reference/catalog-rpc.md
      - Dashboard catalog (D13): reference/dashboard-catalog.md
      - Environment variables: reference/env-vars.md
      - Tenant claims: reference/tenant-claims.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Why anchors: explanation/why-anchors.md
      - Hybrid (Plan B): explanation/hybrid.md
      - Trade-offs: explanation/tradeoffs.md
      - Security model: explanation/security-model.md
      - Observability architecture (D13): explanation/observability-architecture.md
  - Concepts (legacy):
      - Architecture: concepts/architecture.md
      - Glossary: concepts/glossary.md
  - ADRs:
      - Index: adr/index.md
      - ADR-001 Tech Stack: adr/ADR-001-tech-stack.md
  - Contributing: contributing.md
