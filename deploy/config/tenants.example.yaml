# Example tenants.yaml — reference for the production file mounted
# by `configmap-tenants.yaml` on each pod. Copy to
# deploy/k8s/overlays/<env>/tenants.yaml and edit.
#
# Semantics:
#   classify_qps   — token-bucket sustained rate
#   classify_burst — token-bucket burst capacity
#   admin_qps      — per-tenant rate on the AdminService
#   catalogs       — allow-list; requests for other catalogs return PERMISSION_DENIED
#   priority       — "high" | "medium" | "low" ; under global overload, low
#                    tenants are shed first.
#   billing_account — chargeback destination (passed to chargeback.sh)

version: 1
tenants:
  team-support:
    classify_qps: 1000
    classify_burst: 2000
    admin_qps: 10
    catalogs: [support_triage]
    priority: high
    billing_account: cc-42-support
  team-fraud:
    classify_qps: 500
    classify_burst: 1000
    admin_qps: 10
    catalogs: [support_triage, fraud_alert]
    priority: high
    billing_account: cc-17-fraud
  team-legal:
    classify_qps: 100
    classify_burst: 200
    admin_qps: 5
    catalogs: [legal_triage]
    priority: medium
    billing_account: cc-33-legal
default:
  classify_qps: 20
  classify_burst: 50
  admin_qps: 0
  catalogs: []
  priority: low
  billing_account: cc-00-default
