# PR #21 § 8.4 — SIGHUP reload storm (kubectl exec via chaos-mesh).
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: reload-storm
  namespace: ${BENCH_NAMESPACE}
spec:
  action: pod-failure   # placeholder ; chaos-mesh kind exec wraps the shell command
  mode: one
  selector:
    labelSelectors:
      app.kubernetes.io/name: efe-meta-swarm
      app.kubernetes.io/component: controller
  duration: "13m"
  # Phase-3 : when chaos-mesh ships a CronJob-style ExecChaos, replace
  # this with a proper `kill -HUP 1` loop.  For now the harness drives
  # the storm via kubectl exec in a side-task.
