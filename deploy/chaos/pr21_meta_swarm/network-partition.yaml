# PR #21 § 8.2 — chaos-mesh NetworkChaos : partition controller↔participants for 60 s.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition
  namespace: ${BENCH_NAMESPACE}
spec:
  action: partition
  mode: all
  selector:
    labelSelectors:
      app.kubernetes.io/name: efe-meta-swarm
      app.kubernetes.io/component: participant
  direction: both
  target:
    mode: all
    selector:
      labelSelectors:
        app.kubernetes.io/name: efe-meta-swarm
        app.kubernetes.io/component: controller
  duration: "60s"
