# Sprint **Φ-D D31 (Bundle completion)** — fusion sustained ghz config.
#
# Cf. `docs/EFE_CUDA_KERNELS_COMPLETION_ARCHITECTURE.md` § 15 artefact #15.
#
# Profile bench sustained 10 min sur T4 fp16 + bundle MiniLM-L12-v2,
# Mode-1. Cible : reproduire les conditions contractuelles SLO-C-1
# (= 200 ms p99 GPU, 4 vCPU + 1 NVIDIA T4, 200 RPS, 3 réplicas).
#
# **Différence vs soak_24h.yaml** :
# - sustained_fusion = 10 min × 200 RPS (= bench de référence p99)
# - soak_24h         = 24 h × 100 RPS (= bench mem-leak detection)
#
# Sortie : JSON parseable par `criterion_to_slo.py` puis
# `check_slo.py` contre `bench_baselines/v0.6.0/cuda_slos.yaml`.
#
# ## SLO gated par ce bench
#
# - `SLO-CUDA-FUSION-TOTAL` (= p99 ≤ 100 ms / 10 rounds total)
# - `SLO-P1-BUDGET-7` (= source indirecte via étage 7 P1)
# - `SLO-C-1` (= 200 ms p99 GPU contractuel)
#
# ## Usage
#
# ```bash
# # Sur le runner self-hosted GPU T4 :
# ghz --config deploy/load-tests/gpu/fusion_sustained.yaml \
#     --output target/bench/fusion_sustained.json
# python scripts/bench/criterion_to_slo.py \
#     --criterion target/criterion \
#     --output target/bench/fusion_compliance.json
# python eval/scripts/check_slo.py \
#     --baseline bench_baselines/v0.6.0/cuda_slos.yaml \
#     --measure target/bench/fusion_compliance.json
# ```

proto: ../../../crates/efe-server/proto/v1/swarm.proto
import-paths:
  - ../../../crates/efe-server/proto
  - ../../../crates/efe-server/proto/v1
call: efe.v1.SwarmService.Execute

# Charge sustained 10 min × 200 RPS = 120 000 requests
total: 120000
concurrency: 64
rps: 200
duration: 10m

# Connexion mTLS prod-shaped
insecure: false
cert: ../../../deploy/certs/p1-client.pem
key: ../../../deploy/certs/p1-client-key.pem
cacert: ../../../deploy/certs/ca.pem
authority: efe-server-gpu.efe.svc.cluster.local

# Payloads — réutilise ceux de P1 (= 100 prompts variés multilingues)
data-file: ../p1/p1_payloads.json

# Metadata gRPC
metadata:
  authorization: "Bearer ${GHZ_JWT_TOKEN}"
  x-correlation-id: "fusion-${id}"
  grpc-timeout: "300m"                # 300 ms = 200 ms SLO + 50 % marge
  x-bench-run-id: "fusion-${GHZ_RUN_ID}"

# Connexions
connections: 4
keepalive: 30s

# Pas de ramp (= sustained direct)
load-step: 0
load-step-duration: 0
load-end: 200

# Skip warmup
skip-first: 200

# Output
format: json
enable-compression: false

# Tags propagés dans l'output JSON
tags:
  workload: gpu_fusion
  spec: sustained
  duration: 10m
  rps: "200"
  slo: SLO-CUDA-FUSION-TOTAL
  contract_clause: P1-§3.1
