# Sprint **D19 (P1-Foundation)** — ghz config for the sustained P1
# load test.
#
# Cf. `docs/EFE_P1_SURFACE_ARCHITECTURE.md` § 6.5.
#
# ## Profile
#
# - 200 RPS sustained, 64 concurrent virtual users.
# - 10 min duration → ≈ 120 000 requests.
# - mTLS obligatoire (la mesure doit refléter la prod).
# - Output JSON pour ingestion par `eval/scripts/check_slo.py`.
#
# ## Lancement
#
# ```bash
# ghz --config deploy/load-tests/p1/p1_sustained.yaml \
#     --host localhost:50051 \
#     --output target/bench_p1_sustained.json \
#     --format json
# ```
#
# ## Variantes
#
# - `p1_smoke.yaml` (TBD) : 10 RPS × 30 s pour smoke test.
# - `p1_stress.yaml` (TBD) : ramp 200 → 400 RPS sur 5 min.
# - `p1_spike.yaml` (TBD) : pic 1000 RPS pendant 30 s.

proto: ../../../crates/efe-server/proto/v1/swarm.proto
import-paths:
  - ../../../crates/efe-server/proto
  - ../../../crates/efe-server/proto/v1
call: efe.v1.SwarmService.Execute

# Charge sustained
total: 120000      # = 200 RPS × 600 s
concurrency: 64
rps: 200
duration: 10m

# Connexion
insecure: false
cert: ../../../deploy/certs/p1-client.pem
key: ../../../deploy/certs/p1-client-key.pem
cacert: ../../../deploy/certs/ca.pem
authority: efe-server.efe.svc.cluster.local

# Payload — 100 entrées tirées au hasard du dataset.
data-file: ./p1_payloads.json
# `data-file` est un tableau JSON ; ghz pick une entrée aléatoire à
# chaque requête (cf. ghz docs).

# Metadata gRPC pour l'authent (mTLS + JWT tenant fictif "ghz-bench")
metadata:
  authorization: "Bearer ${GHZ_JWT_TOKEN}"
  x-correlation-id: "${id}"
  grpc-timeout: "300m"          # 300 ms (= 200 ms SLO + 50 % marge mesure)
  x-bench-run-id: "${GHZ_RUN_ID}"

# Connexions
connections: 4
keepalive: 30s

# Mesures
load-step: 0          # pas de ramp
load-step-duration: 0
load-end: 200

# Output / formats
format: json
skip-first: 100       # skip warmup requests
enable-compression: false

# Tags propagés dans l'output
tags:
  workload: p1
  spec: sustained
  rps: "200"
  duration: 10m
  rtt_budget_ms: "200"
