## M32 — Vector Search alerting rules.
## Family label = M32-VEC.

groups:
  - name: efe-m32-vector
    rules:
      - alert: M32VectorSearchHighErrorRate
        expr: |
          sum by(mode) (rate(efe_vector_search_total{mode!="",outcome="err"}[5m]))
            / on(mode)
          sum by(mode) (rate(efe_vector_search_total[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
          family: M32-VEC
        annotations:
          summary: "Vector search 5xx > 1% on mode {{ $labels.mode }}"
          runbook_url: https://docs.efe.ai/runbooks/RB_M32_INDEX_OOM

      - alert: M32VectorSearchP99HighLatency
        expr: |
          histogram_quantile(0.99,
            sum by(mode, le) (rate(efe_vector_search_duration_ms_bucket[5m]))) > 50
        for: 10m
        labels:
          severity: warning
          family: M32-VEC
        annotations:
          summary: "Vector search p99 > 50 ms on mode {{ $labels.mode }}"
          runbook_url: https://docs.efe.ai/runbooks/RB_M32_INDEX_OOM

      - alert: M32SnapshotFailing
        expr: |
          sum(rate(efe_vector_snapshot_duration_ms_count{outcome="err"}[1h])) > 0
        for: 30m
        labels:
          severity: critical
          family: M32-VEC
        annotations:
          summary: "Vector snapshot failing for > 30 min"
          runbook_url: https://docs.efe.ai/runbooks/RB_M32_SNAPSHOT_FAILED

      - alert: M32RecallRegression
        expr: |
          efe_vector_recall_at_10 < 900   # gauge ×1000 ; 900 = recall 0.90
        for: 30m
        labels:
          severity: warning
          family: M32-VEC
        annotations:
          summary: "Recall@10 dropped below 0.90 on model {{ $labels.model }}"
          runbook_url: https://docs.efe.ai/runbooks/RB_M32_RECALL_REGRESSION

      - alert: M32CollectionApproachingCap
        expr: |
          efe_vector_collection_size > 8000000   # 80% of default cap
        for: 1h
        labels:
          severity: warning
          family: M32-VEC
        annotations:
          summary: "Vector collection {{ $labels.collection }} > 8M docs"
          runbook_url: https://docs.efe.ai/runbooks/RB_M32_INDEX_OOM

      - alert: M32SnapshotMissing
        expr: |
          time() - max(vector_snapshot_last_success_unix_ts) > 86400
        for: 1h
        labels:
          severity: warning
          family: M32-VEC
        annotations:
          summary: "No successful snapshot in the last 24h"
          runbook_url: https://docs.efe.ai/runbooks/RB_M32_SNAPSHOT_FAILED
