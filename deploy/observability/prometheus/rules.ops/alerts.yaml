# Sprint Φ-D-OPS (D97) — Master alert pack for the OPS surface.
#
# Sev1 — Page immediately (PagerDuty, 24/7).
# Sev2 — Page primary on-call within business-hours window.
# Sev3 — Slack channel #efe-watch, no page.
# Sev4 — Ticketed Linear, no notification.
#
# Cf. `docs/EFE_OPERATIONAL_PRODUCTION_ARCHITECTURE.md` § 10.

groups:
- name: ops.master.sev1
  rules:
  - alert: OpsMasterGateFailNightly
    expr: efe_master_gate_failed{job="ops-nightly"} == 1
    for: 5m
    labels:
      severity: critical
      pd_service: efe-platform
      runbook: docs/runbooks/ops_master_gate_fail.md
    annotations:
      summary: |
        Master gate failed in last nightly run — see
        target/ops/master_report.md.

  - alert: OpsRegionDown
    expr: |
      sum by (region) (up{job=~"efe-server|mcp-server"}) == 0
    for: 5m
    labels:
      severity: critical
      pd_service: efe-platform
      runbook: docs/runbooks/M26_DR_PLAYBOOK.md
    annotations:
      summary: "Region {{ $labels.region }} has no responsive pods."

  - alert: OpsKmsUnavailable
    expr: efe_kms_reachability == 0
    for: 2m
    labels:
      severity: critical
      pd_service: efe-platform
      runbook: docs/runbooks/general_secret_rotation_playbook.md
    annotations:
      summary: KMS unreachable — encryption + audit signing degraded.

- name: ops.master.sev2
  rules:
  - alert: OpsCanaryStuck
    expr: |
      (time() - efe_canary_started_at_seconds) > 86400
      and on(release_id) efe_canary_state{state="active"} == 1
    for: 30m
    labels:
      severity: major
      pd_service: efe-release
      runbook: docs/runbooks/ops_master_gate_fail.md
    annotations:
      summary: "Canary {{ $labels.release_id }} active > 24 h."

  - alert: OpsBudgetOverrun
    expr: |
      (efe_tenant_spend_usd / efe_tenant_budget_usd) > 1.10
    for: 1h
    labels:
      severity: major
      pd_service: efe-finops
      runbook: docs/runbooks/ops_chargeback_overrun.md
    annotations:
      summary: |
        Tenant {{ $labels.tenant }} spent
        {{ $value | printf "%.2f" }}× of monthly budget.

  - alert: OpsPostmortemOverdue
    expr: efe_postmortem_overdue_count > 0
    for: 6h
    labels:
      severity: major
      pd_service: efe-eng
      runbook: docs/runbooks/ops_postmortem_overdue.md
    annotations:
      summary: |
        {{ $value }} postmortem(s) overdue (> 48 h after Sev1/Sev2
        resolution).

- name: ops.master.sev3
  rules:
  - alert: OpsAlLoopStale
    expr: efe_al_last_promotion_age_hours > 168
    for: 1h
    labels:
      severity: watch
      slack_channel: efe-watch
      runbook: docs/runbooks/M24_ACTIVE_LEARNING_RUNBOOK.md
    annotations:
      summary: "AL loop has not promoted in {{ $value | printf '%.0f' }} h."

  - alert: OpsTrustCenterStale
    expr: efe_trust_center_stale_count > 0
    for: 24h
    labels:
      severity: watch
      slack_channel: efe-trust
      runbook: docs/runbooks/ops_postmortem_overdue.md
    annotations:
      summary: "{{ $value }} trust-center evidence row(s) stale."

- name: ops.master.sev4
  rules:
  - alert: OpsDrDrillSoon
    expr: efe_dr_drill_days_since_last > 80
    for: 24h
    labels:
      severity: ticket
      runbook: docs/runbooks/ops_dr_drill_failure.md
    annotations:
      summary: |
        Last DR drill {{ $value | printf "%.0f" }} days ago — quarterly
        cadence imminently breached at 100 days.
