## M33 — Knowledge Graph + GraphRAG alerting rules.
## Family label = M33-KG.

groups:
  - name: efe-m33-kg
    rules:
      - alert: M33NerExtractorDown
        expr: |
          sum(rate(efe_kg_extractor_duration_ms_count{outcome="err"}[5m])) > 0.5
        for: 10m
        labels:
          severity: critical
          family: M33-KG
        annotations:
          summary: "NER extractor 5xx > 0.5 rps"
          runbook_url: https://docs.efe.ai/runbooks/RB_M33_NER_DOWN

      - alert: M33GraphRagP99HighLatency
        expr: |
          histogram_quantile(0.99,
            sum by(mode, le) (rate(efe_graphrag_search_duration_ms_bucket[5m]))) > 100
        for: 10m
        labels:
          severity: warning
          family: M33-KG
        annotations:
          summary: "GraphRAG p99 > 100 ms"
          runbook_url: https://docs.efe.ai/runbooks/RB_M33_GRAPHRAG_LATENCY_HIGH

      - alert: M33GraphApproachingCap
        expr: efe_kg_graph_size > 5000000
        for: 1h
        labels:
          severity: warning
          family: M33-KG
        annotations:
          summary: "Graph cardinality > 5 M (50% of cap)"
          runbook_url: https://docs.efe.ai/runbooks/RB_M33_GRAPH_OOM

      - alert: M33EntityResolutionDrift
        expr: |
          histogram_quantile(0.95, sum by(le) (rate(efe_kg_resolution_merges_total_bucket[1h]))) > 256
        for: 1h
        labels:
          severity: warning
          family: M33-KG
        annotations:
          summary: "Entity-resolution merging > 256 entities / batch"
          runbook_url: https://docs.efe.ai/runbooks/RB_M33_RESOLUTION_DRIFT
