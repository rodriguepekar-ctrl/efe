## Sprint **D19 (P2-Foundation)** — Prometheus recording rules.
##
## Pre-computed aggregates feeding the `efe-p2-funnel.json` Grafana
## dashboard. Cf. `docs/EFE_P2_SELF_SERVICE_ARCHITECTURE.md` § 8.

groups:
  - name: efe-p2-quantiles
    interval: 30s
    rules:
      # ───────────────────────────────────────────────────────────
      # T-T-First-Classify p50/p90/p99 par plan_target
      # ───────────────────────────────────────────────────────────
      - record: efe:p2_ttfc_p50_seconds
        expr: |
          histogram_quantile(
            0.50,
            sum by (plan_target, le) (
              rate(efe_p2_funnel_t_to_first_classify_seconds_bucket[5m])
            )
          )

      - record: efe:p2_ttfc_p90_seconds
        expr: |
          histogram_quantile(
            0.90,
            sum by (plan_target, le) (
              rate(efe_p2_funnel_t_to_first_classify_seconds_bucket[5m])
            )
          )

      - record: efe:p2_ttfc_p99_seconds
        expr: |
          histogram_quantile(
            0.99,
            sum by (plan_target, le) (
              rate(efe_p2_funnel_t_to_first_classify_seconds_bucket[5m])
            )
          )

      # ───────────────────────────────────────────────────────────
      # T-T-Aha p90
      # ───────────────────────────────────────────────────────────
      - record: efe:p2_aha_p90_seconds
        expr: |
          histogram_quantile(
            0.90,
            sum by (plan_target, le) (
              rate(efe_p2_funnel_t_to_aha_seconds_bucket[5m])
            )
          )

      # ───────────────────────────────────────────────────────────
      # Provisioning p99 par cloud × layer
      # ───────────────────────────────────────────────────────────
      - record: efe:p2_provisioning_p99_seconds
        expr: |
          histogram_quantile(
            0.99,
            sum by (cloud, layer, le) (
              rate(efe_p2_funnel_provisioning_seconds_bucket[5m])
            )
          )

  - name: efe-p2-rates
    interval: 30s
    rules:
      # ───────────────────────────────────────────────────────────
      # Conversion rate sandbox → POC (fenêtre 90 jours = volume)
      # ───────────────────────────────────────────────────────────
      - record: efe:p2_conversion_sandbox_to_poc:90d
        expr: |
          sum(increase(efe_p2_funnel_completed_total{plan_target="poc",outcome="success"}[90d]))
          /
          sum(increase(efe_p2_funnel_completed_total{plan_target="sandbox",outcome="success"}[90d]))

      # ───────────────────────────────────────────────────────────
      # Abandon rate par étape sur 1 h
      # ───────────────────────────────────────────────────────────
      - record: efe:p2_abandon_rate_by_step:1h
        expr: |
          sum by (step) (rate(efe_p2_funnel_drop_total[1h]))
          /
          sum(rate(efe_p2_funnel_started_total[1h]))

      # ───────────────────────────────────────────────────────────
      # Burn rates (3 fenêtres canoniques)
      # ───────────────────────────────────────────────────────────
      - record: efe:p2_burn_rate:1h
        expr: |
          (
            1 - (
              sum(rate(efe_p2_funnel_t_to_first_classify_seconds_bucket{plan_target="poc",le="1800"}[1h]))
              /
              sum(rate(efe_p2_funnel_t_to_first_classify_seconds_count{plan_target="poc"}[1h]))
            )
          ) / 0.10

      - record: efe:p2_burn_rate:6h
        expr: |
          (
            1 - (
              sum(rate(efe_p2_funnel_t_to_first_classify_seconds_bucket{plan_target="poc",le="1800"}[6h]))
              /
              sum(rate(efe_p2_funnel_t_to_first_classify_seconds_count{plan_target="poc"}[6h]))
            )
          ) / 0.10

      - record: efe:p2_burn_rate:24h
        expr: |
          (
            1 - (
              sum(rate(efe_p2_funnel_t_to_first_classify_seconds_bucket{plan_target="poc",le="1800"}[24h]))
              /
              sum(rate(efe_p2_funnel_t_to_first_classify_seconds_count{plan_target="poc"}[24h]))
            )
          ) / 0.10

  - name: efe-p2-cloud-parity
    interval: 1m
    rules:
      # ───────────────────────────────────────────────────────────
      # p90 par cloud — feed à P2_CLOUD_PARITY_DEGRADED
      # ───────────────────────────────────────────────────────────
      - record: efe:p2_ttfc_p90_by_cloud:1h
        expr: |
          histogram_quantile(
            0.90,
            sum by (cloud, le) (
              rate(efe_p2_funnel_t_to_first_classify_seconds_bucket{plan_target="poc"}[1h])
            )
          )

  - name: efe-p2-human-intervention
    interval: 5m
    rules:
      # ───────────────────────────────────────────────────────────
      # Human intervention ratio (24 h) — derived metric provided
      # par un sidecar SQL ; ici on agrège seulement.
      #
      # NOTE : `efe_p2_session_ticket_corr` est émis par un cron
      # daily qui joint `onboarding_sessions` × `support_tickets`
      # (livraison D20+). En attendant, ce recording rule renvoie
      # 0 ; la métrique upstream sera 0 ou absente.
      # ───────────────────────────────────────────────────────────
      - record: efe:p2_human_intervention_ratio:24h
        expr: |
          (
            sum(increase(efe_p2_session_ticket_corr_total[24h]))
            /
            clamp_min(
              sum(increase(efe_p2_funnel_completed_total[24h])),
              1
            )
          ) or vector(0)
