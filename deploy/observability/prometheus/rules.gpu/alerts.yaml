## Sprint **Φ-D D30 (Bundle completion)** — Prometheus alerting
## rules pour le GPU substrate.
##
## Cf. `docs/EFE_CUDA_KERNELS_COMPLETION_ARCHITECTURE.md` § 13 + § 17.
##
## Inventaire (8 alertes) :
##
## | Alert                          | Sévérité | Fenêtre | Trigger |
## |--------------------------------|----------|---------|---------|
## | GPU_FUSION_ROUND_SLOW          | critical | 5 min   | p99 > 10 ms |
## | GPU_FUSION_TOTAL_SLOW          | critical | 5 min   | p99 > 100 ms |
## | GPU_KERNEL_FAILURE_BURST       | critical | 1 min   | fail rate > 0.01 % |
## | GPU_OOM_BURST                  | critical | 1 min   | OOM > 1/h |
## | GPU_SM_OCCUPANCY_LOW           | warning  | 15 min  | < 0.20 |
## | GPU_NCCL_ALLREDUCE_SLOW        | warning  | 5 min   | p99 > 10 ms |
## | GPU_PINNED_HOST_POOL_BLOAT     | warning  | 30 min  | > 200 MiB |
## | GPU_DRIVER_DRIFT               | critical | 0       | driver_version_info changed |

groups:
  - name: efe-gpu-fusion-slo
    interval: 30s
    rules:
      ## ─────────────────────────────────────────────────────────
      ## GPU_FUSION_ROUND_SLOW — critical (= SLO-CUDA-FUSION-ROUND)
      ## ─────────────────────────────────────────────────────────
      - alert: GPU_FUSION_ROUND_SLOW
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(efe_gpu_kernel_duration_seconds_bucket{kernel="fusion_round"}[5m])
            )
          ) > 0.010
        for: 5m
        labels:
          severity: critical
          family: P1
          slo: SLO-CUDA-FUSION-ROUND
        annotations:
          summary: "Fusion round p99 > 10 ms (SLO-CUDA-FUSION-ROUND)"
          description: |
            Le p99 d'un round de fusion CUDA dépasse 10 ms.
            Conséquence : SLO-P1-BUDGET-7 (= 100 ms pour 10 rounds)
            et SLO-C-1 (= 200 ms p99 GPU) en danger.

            Causes typiques :
              - GPU heat throttling (cf. SM occupancy)
              - VRAM saturation (cf. arena reset cadence)
              - Tile size mal calibré (cf. efe-server tune)
          runbook_url: https://docs.efe.ai/runbooks/cuda_kernel_regression

      ## ─────────────────────────────────────────────────────────
      ## GPU_FUSION_TOTAL_SLOW — critical
      ## ─────────────────────────────────────────────────────────
      - alert: GPU_FUSION_TOTAL_SLOW
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(efe_p1_fusion_round_duration_seconds_bucket{mode="mode1"}[5m])
            )
          ) * 10 > 0.100
        for: 5m
        labels:
          severity: critical
          family: P1
          slo: SLO-CUDA-FUSION-TOTAL
        annotations:
          summary: "Fusion 10 rounds p99 > 100 ms"
          description: |
            La fusion totale (= 10 rounds) p99 dépasse 100 ms.
            SLO-C-1 (200 ms p99 GPU) compromis si > 90 ms p99
            sur 30 min consécutives.
          runbook_url: https://docs.efe.ai/runbooks/cuda_kernel_regression

      ## ─────────────────────────────────────────────────────────
      ## GPU_KERNEL_FAILURE_BURST — critical
      ## ─────────────────────────────────────────────────────────
      - alert: GPU_KERNEL_FAILURE_BURST
        expr: |
          (
            sum(rate(efe_gpu_kernel_calls_total{outcome="fail"}[5m]))
            / sum(rate(efe_gpu_kernel_calls_total[5m]))
          ) > 0.0001
        for: 5m
        labels:
          severity: critical
          family: P1
        annotations:
          summary: "GPU kernel failure rate > 0.01 % (SLO-CUDA-KERNEL-FAILURE-RATE)"
          description: |
            > 0.01 % des kernel calls échouent. Indique typiquement :
              - Driver instability (= cf. P1_FINGERPRINT_DRIFT)
              - Heat throttling crossing thermal limit
              - PCIe link degraded
          runbook_url: https://docs.efe.ai/runbooks/cuda_kernel_regression

  - name: efe-gpu-memory
    interval: 30s
    rules:
      ## ─────────────────────────────────────────────────────────
      ## GPU_OOM_BURST — critical
      ## ─────────────────────────────────────────────────────────
      - alert: GPU_OOM_BURST
        expr: increase(efe_gpu_oom_total[1h]) > 1
        for: 1m
        labels:
          severity: critical
          family: P1
          slo: SLO-CUDA-OOM-RATE
        annotations:
          summary: "GPU OOM events > 1/h (circuit breaker insuffisant)"
          description: |
            Plus de 1 OOM par heure. Circuit breaker shrink-batch-retry
            ne suffit pas → arena calibration cassée OU multi-tenant
            sharing too aggressive.
          runbook_url: https://docs.efe.ai/runbooks/gpu_oom_recovery

      ## ─────────────────────────────────────────────────────────
      ## GPU_PINNED_HOST_POOL_BLOAT — warning
      ## ─────────────────────────────────────────────────────────
      - alert: GPU_PINNED_HOST_POOL_BLOAT
        expr: efe_gpu_pinned_host_pool_bytes > 209715200    # > 200 MiB
        for: 30m
        labels:
          severity: warning
          family: P1
        annotations:
          summary: "Pinned host pool > 200 MiB (= fuite free-list)"
          description: |
            Le pinned host pool dépasse 200 MiB. Indique typiquement
            une fuite : `PinnedBuf::drop` ne ré-ajoute pas le buffer
            dans le free-list, alors que des allocs continuent.

  - name: efe-gpu-occupancy
    interval: 30s
    rules:
      ## ─────────────────────────────────────────────────────────
      ## GPU_SM_OCCUPANCY_LOW — warning
      ## ─────────────────────────────────────────────────────────
      - alert: GPU_SM_OCCUPANCY_LOW
        expr: avg_over_time(efe_gpu_sm_occupancy_ratio[15m]) < 0.20
        for: 15m
        labels:
          severity: warning
          family: P1
        annotations:
          summary: "SM occupancy < 20 % sustained 15 min (over-provisioned)"
          description: |
            Le GPU est sous-utilisé. Causes possibles :
              - Charge en baisse (= traffic shaping client-side)
              - Batch coalescer désactivé (= solo requests)
              - Tile size sub-optimal → moins de blocks/SM
          runbook_url: https://docs.efe.ai/runbooks/gpu_oom_recovery

  - name: efe-gpu-nccl
    interval: 30s
    rules:
      ## ─────────────────────────────────────────────────────────
      ## GPU_NCCL_ALLREDUCE_SLOW — warning
      ## ─────────────────────────────────────────────────────────
      - alert: GPU_NCCL_ALLREDUCE_SLOW
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(efe_gpu_nccl_allreduce_seconds_bucket[5m]))
          ) > 0.010
        for: 5m
        labels:
          severity: warning
          family: P1
        annotations:
          summary: "NCCL all-reduce p99 > 10 ms (= dégrade multi-GPU)"
          description: |
            NCCL all-reduce p99 dépasse 10 ms. Indique :
              - PCIe link degradé (= cf. nvlink-monitor)
              - Topology mismatch (= GPU loin l'un de l'autre)
              - Multi-tenant contention sur le bus
          runbook_url: https://docs.efe.ai/runbooks/multi_gpu_failover

  - name: efe-gpu-driver-info
    interval: 5m
    rules:
      ## ─────────────────────────────────────────────────────────
      ## GPU_DRIVER_DRIFT — critical
      ## ─────────────────────────────────────────────────────────
      ## L'instrument `efe_gpu_driver_version_info` est setté à 1
      ## pour la combo active. Tout changement de labels = différente
      ## série Prometheus → cette alerte fire si une nouvelle série
      ## émerge sans qu'une re-baseline ait été signée.
      - alert: GPU_DRIVER_DRIFT
        expr: |
          count(count by (driver, cuda_runtime, kernels_sha) (efe_gpu_driver_version_info)) > 1
        for: 1m
        labels:
          severity: critical
          family: P1
          slo: SLO-C-1
        annotations:
          summary: "GPU driver/kernels stack drift across replicas"
          description: |
            Plusieurs combinaisons (driver, cuda_runtime, kernels_sha)
            détectées simultanément sur le fleet. Indique :
              - Rolling upgrade in-flight (= attendu et OK)
              - Replicas avec versions différentes (= bug deploy)

            Si le drift dépasse 1 h, l'opposabilité juridique SLO-C-1
            est suspendue (= chaque replica a un fingerprint distinct).
          runbook_url: https://docs.efe.ai/runbooks/gpu_driver_upgrade
