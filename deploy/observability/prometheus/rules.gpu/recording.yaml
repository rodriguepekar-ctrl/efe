## Sprint **Φ-D D30 (Bundle completion)** — Recording rules pour
## le dashboard `efe-gpu-kernels`.
##
## Cf. `docs/EFE_CUDA_KERNELS_COMPLETION_ARCHITECTURE.md` § 10.

groups:
  - name: efe-gpu-quantiles
    interval: 30s
    rules:
      # Quantiles par kernel — feed le panel "p99 par kernel"
      - record: efe:gpu_kernel_p99_seconds
        expr: |
          histogram_quantile(
            0.99,
            sum by (kernel, le) (rate(efe_gpu_kernel_duration_seconds_bucket[5m]))
          )

      - record: efe:gpu_kernel_p50_seconds
        expr: |
          histogram_quantile(
            0.50,
            sum by (kernel, le) (rate(efe_gpu_kernel_duration_seconds_bucket[5m]))
          )

      # Quantile spécifique fusion_round (= source SLO-CUDA-FUSION-ROUND)
      - record: efe:gpu_fusion_round_p99_seconds
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(efe_gpu_kernel_duration_seconds_bucket{kernel="fusion_round"}[5m])
            )
          )

      # Quantile NCCL all-reduce
      - record: efe:gpu_nccl_allreduce_p99_seconds
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(efe_gpu_nccl_allreduce_seconds_bucket[5m]))
          )

  - name: efe-gpu-rates
    interval: 30s
    rules:
      # Kernel failure rate (= source SLO-CUDA-KERNEL-FAILURE-RATE)
      - record: efe:gpu_kernel_failure_rate:5m
        expr: |
          sum(rate(efe_gpu_kernel_calls_total{outcome="fail"}[5m]))
            / sum(rate(efe_gpu_kernel_calls_total[5m]))

      # OOM events / heure
      - record: efe:gpu_oom_per_hour
        expr: increase(efe_gpu_oom_total[1h])

      # Arena reset cadence ratio (vs RPS) — feed l'alerte
      # GPU_ARENA_RESET_LAGS si > 1.2× ; en steady-state on attend ≈ 1.
      - record: efe:gpu_arena_reset_vs_rps_ratio
        expr: |
          sum(rate(efe_gpu_arena_reset_total[5m]))
            / sum(rate(efe_swarm_duration_seconds_count[5m]))

  - name: efe-gpu-occupancy
    interval: 1m
    rules:
      # SM occupancy moyenne par device (= avg sur 10 min)
      - record: efe:gpu_sm_occupancy_avg:10m
        expr: avg_over_time(efe_gpu_sm_occupancy_ratio[10m])

      # GPU utilization ratio (= NVML utilization.gpu / 100)
      - record: efe:gpu_utilization_avg:10m
        expr: avg_over_time(efe_gpu_utilization_ratio[10m])
