## M31 — FinOps + Stripe Billing alerting rules.
##
## 8 alerts : 4 metering + 4 billing.
## Family label = M31-FIN.

groups:
  - name: efe-m31-metering
    rules:
      - alert: M31MeterFlushFailing
        expr: |
          sum(rate(efe_meter_redis_errors_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          family: M31-FIN
        annotations:
          summary: "Metering Redis errors > 0.5 RPS"
          description: |
            The metering plane is dropping events to Redis. Counters
            buffer in-process up to {{ "max_age" }} ; beyond that we
            rely on NATS mirror replay.
          runbook_url: https://docs.efe.ai/runbooks/RB_M31_REDIS_OUTAGE

      - alert: M31RollupLagHigh
        expr: efe_rollup_lag_seconds > 7200
        for: 15m
        labels:
          severity: warning
          family: M31-FIN
        annotations:
          summary: "Rollup lag > 2h on {{ $labels.period }}"
          description: |
            The {{ $labels.period }} rollup cron has not completed
            for over 2 hours. Invoice generation will be late.
          runbook_url: https://docs.efe.ai/runbooks/RB_M31_ROLLUP_BACKLOG

      - alert: M31MeterFlushSlow
        expr: |
          histogram_quantile(0.99, sum by(le) (rate(efe_meter_flush_duration_ms_bucket[5m]))) > 500
        for: 15m
        labels:
          severity: warning
          family: M31-FIN
        annotations:
          summary: "Meter flush p99 > 500 ms"
          description: |
            Background flush p99 latency is degraded. Buffered events
            may accumulate and saturate process memory.
          runbook_url: https://docs.efe.ai/runbooks/RB_M31_REDIS_OUTAGE

      - alert: M31MeterIncOverhead
        expr: |
          histogram_quantile(0.99, sum by(le) (rate(efe_meter_inc_duration_us_bucket{outcome="ok"}[5m]))) > 1000
        for: 15m
        labels:
          severity: warning
          family: M31-FIN
        annotations:
          summary: "meter_inc hot-path p99 > 1 ms"
          description: |
            The buffered fast path is taking > 1 ms ; user requests
            are paying metering overhead. Possible mutex contention.
          runbook_url: https://docs.efe.ai/runbooks/RB_M31_REDIS_OUTAGE

  - name: efe-m31-billing
    rules:
      - alert: M31StripeApiDegraded
        expr: |
          sum by(endpoint) (rate(efe_stripe_api_errors_total[5m])) > 1
        for: 10m
        labels:
          severity: critical
          family: M31-FIN
        annotations:
          summary: "Stripe API errors > 1 RPS on {{ $labels.endpoint }}"
          description: |
            Stripe is returning errors. Invoice creation may be
            blocked. The reconciler will re-attempt every 6h.
          runbook_url: https://docs.efe.ai/runbooks/RB_M31_STRIPE_API_DEGRADED

      - alert: M31WebhookProcessingErrors
        expr: |
          sum(rate(efe_stripe_webhook_received_total{outcome="err"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          family: M31-FIN
        annotations:
          summary: "Stripe webhook processing failure > 0.1 RPS"
          description: |
            Webhook handler is failing. State mirror may drift.
            Reconciler picks up drift within 6h.
          runbook_url: https://docs.efe.ai/runbooks/RB_M31_INVOICE_RECONCILIATION_FAILED

      - alert: M31BudgetExceededStorm
        expr: |
          sum(rate(efe_budget_exceeded_total[15m])) > 5
        for: 5m
        labels:
          severity: warning
          family: M31-FIN
        annotations:
          summary: "Budget alerts firing at > 5 events / 15 min"
          description: |
            Likely false positive cascade (mis-configured threshold).
            See runbook for triage.
          runbook_url: https://docs.efe.ai/runbooks/RB_M31_BUDGET_ALERT_STORM

      - alert: M31InvoiceDraftStuck
        expr: |
          sum(efe_invoice_status_total{status="draft"})
            - sum(efe_invoice_status_total{status="finalized"}) > 5
        for: 1h
        labels:
          severity: warning
          family: M31-FIN
        annotations:
          summary: "More than 5 invoices stuck in `draft` for > 1h"
          description: |
            Invoicer cron is behind or failing to finalize. Check
            cron logs + Stripe API health.
          runbook_url: https://docs.efe.ai/runbooks/RB_M31_STRIPE_API_DEGRADED
