## Sprint D13 — Loki server config example.
##
## Single-instance Loki with object storage + multi-tenant
## ``X-Scope-OrgID``. Suitable for Tier 2 partner pilots ; for
## fleet-scale deployments, switch to the distributed mode (cf.
## https://grafana.com/docs/loki/latest/get-started/deployment-modes/).
##
## Customize before applying :
##   - storage bucket name
##   - schema period
##   - retention durations per stream
##
## Compatible with Loki 2.9+.

auth_enabled: true            # required for X-Scope-OrgID multi-tenancy

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      bucketnames: efe-loki-prod
      region: eu-west-1
      ## Use IAM roles ; never bake static credentials into YAML.

schema_config:
  configs:
    - from: 2026-04-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: efe_index_
        period: 24h

ingester:
  max_chunk_age: 1h
  chunk_target_size: 1572864     # 1.5 MiB
  chunk_idle_period: 30m
  chunk_retain_period: 1m

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: s3
  retention_delete_delay: 2h

##
## Per-stream retention via labels :
##   * audit    — 7 years (compliance, cf. security model)
##   * security — 90 days
##   * request  — 14 days
##   * classify — 30 days
##   * evolution — 90 days
##
limits_config:
  retention_period: 14d        # default fallback
  retention_stream:
    - selector: '{stream="audit"}'
      priority: 10
      period: 2555d            # ~ 7 years (compliance)
    - selector: '{stream="security"}'
      priority: 9
      period: 90d
    - selector: '{stream="evolution"}'
      priority: 8
      period: 90d
    - selector: '{stream="classify"}'
      priority: 7
      period: 30d
    - selector: '{stream="request"}'
      priority: 6
      period: 14d
  ## Per-tenant ingest quotas — protect Loki from one tenant
  ## flooding. Override per-tenant via runtime config.
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  ## Cardinality cap on label combinations.
  max_streams_per_user: 10000

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory

## Runtime overrides (per-tenant) — example :
##
##   overrides:
##     tenant-acme:
##       max_streams_per_user: 50000
##       ingestion_rate_mb:   100
##     tenant-globex:
##       max_streams_per_user: 5000
##
## Stored in a separate runtime.yaml file ; reference here :
runtime_config:
  file: /etc/loki/runtime.yaml

analytics:
  reporting_enabled: false
