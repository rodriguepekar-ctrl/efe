apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: efe

# `resources:` replaces the deprecated `bases:` keyword (Kustomize v5).
resources:
  - ../../base

commonLabels:
  efe.project/environment: prod

# Prod MUST pin an immutable tag (or better, digest) — no "latest".
images:
  - name: ghcr.io/efe-project/efe
    newTag: "0.1.0"
    # Uncomment once digest is known:
    # digest: "sha256:abc..."

patches:
  - target: { kind: HorizontalPodAutoscaler, name: efe-server }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 3 }
      - { op: replace, path: /spec/maxReplicas, value: 30 }
  - target: { kind: Deployment, name: efe-server }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: "2"
          memory: "1536Mi"
          ephemeral-storage: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - { name: EFE_BACKEND,         value: "mvp" }
          - { name: EFE_CATALOG_STORE,   value: "s3://efe-catalogs-prod/" }
          - { name: EFE_TENANTS_CONFIG,  value: "/etc/efe/tenants.yaml" }
          - { name: EFE_JWT_PUBLIC_KEYS, value: "/etc/efe/jwt-keys/" }
          - { name: EFE_AUDIT_SINK,      value: "/var/lib/efe/audit" }
          - { name: RUST_LOG,            value: "info,efe=info" }
