# Staging tenants — looser quotas, verbose log.
version: 1
tenants:
  team-support:
    classify_qps: 100
    classify_burst: 200
    admin_qps: 20
    catalogs: [support_triage]
    priority: medium
    billing_account: cc-42-support-staging
  qa-team:
    classify_qps: 500
    classify_burst: 1000
    admin_qps: 100
    catalogs: [support_triage, fraud_alert, billing_escalation]
    priority: medium
    billing_account: cc-99-qa
default:
  classify_qps: 50
  classify_burst: 100
  admin_qps: 0
  catalogs: []
  priority: low
  billing_account: cc-00-default
