apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: efe-staging

# `resources:` replaces the deprecated `bases:` keyword (Kustomize v5).
resources:
  - ../../base

namePrefix: ""
nameSuffix: ""

commonLabels:
  efe.project/environment: staging

images:
  - name: ghcr.io/efe-project/efe
    newTag: staging-latest

# Smaller footprint in staging.
patches:
  - target: { kind: HorizontalPodAutoscaler, name: efe-server }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 2 }
      - { op: replace, path: /spec/maxReplicas, value: 6 }
  - target: { kind: PodDisruptionBudget, name: efe-server }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 1 }
  - target: { kind: Deployment, name: efe-server }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: "250m"
          memory: "512Mi"
          ephemeral-storage: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: "1"
          memory: "1Gi"
          ephemeral-storage: "256Mi"
      # Point at the staging catalog bucket.
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - { name: EFE_BACKEND,        value: "mvp" }
          - { name: EFE_CATALOG_STORE,  value: "s3://efe-catalogs-staging/" }
          - { name: EFE_TENANTS_CONFIG, value: "/etc/efe/tenants.yaml" }
          - { name: RUST_LOG,           value: "debug,efe=debug" }

configMapGenerator:
  - name: efe-tenants
    behavior: replace
    files:
      - tenants.yaml
