apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: efe-server
  namespace: efe
  labels:
    app.kubernetes.io/name: efe-server
spec:
  # With replicas=3 and minAvailable=2, voluntary disruptions (node
  # drains, cluster upgrades) can only evict ONE pod at a time.
  # Eviction is serialised, matching the rolling-update contract.
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: efe-server
