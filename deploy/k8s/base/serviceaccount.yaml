apiVersion: v1
kind: ServiceAccount
metadata:
  name: efe-server
  namespace: efe
  labels:
    app.kubernetes.io/name: efe-server
    app.kubernetes.io/component: data-plane
# efe-server NEVER talks to the Kubernetes API, so we do not mount
# the projected SA token. This closes one attack vector entirely.
automountServiceAccountToken: false
