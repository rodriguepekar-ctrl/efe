apiVersion: v1
kind: ConfigMap
metadata:
  name: efe-tenants
  namespace: efe
  labels:
    app.kubernetes.io/name: efe-server
data:
  tenants.yaml: |
    # EFE tenants — rate limit + priority per client team.
    # Edits here are picked up on rolling restart (see
    # deployment.yaml `checksum/tenants` annotation).
    #
    # Fields:
    #   classify_qps: sustained rate (RPS) under which requests are NOT 429'd
    #   classify_burst: token bucket burst allowance
    #   admin_qps: control-plane rate (writes are rare; leave low)
    #   catalogs: whitelist of catalogs this tenant may use
    #   priority: "high" > "medium" > "low" — high priority is the LAST to be
    #             shed under global overload
    #   billing_account: chargeback destination (internal cost center code)
    version: 1
    tenants:
      team-support:
        classify_qps: 1000
        classify_burst: 2000
        admin_qps: 10
        catalogs: [support_triage]
        priority: high
        billing_account: cc-42-support

      team-fraud:
        classify_qps: 500
        classify_burst: 1000
        admin_qps: 10
        catalogs: [support_triage, fraud_alert]
        priority: high
        billing_account: cc-17-fraud

      team-billing:
        classify_qps: 300
        classify_burst: 600
        admin_qps: 10
        catalogs: [support_triage, billing_escalation]
        priority: high
        billing_account: cc-09-billing

      team-legal:
        classify_qps: 100
        classify_burst: 200
        admin_qps: 5
        catalogs: [legal_triage]
        priority: medium
        billing_account: cc-33-legal

      team-churn:
        classify_qps: 100
        classify_burst: 500
        admin_qps: 0
        catalogs: [support_triage, churn_predictor]
        priority: low        # batch; first to be shed under overload
        billing_account: cc-88-churn

    # Defaults applied when a tenant is not listed (dev / staging).
    default:
      classify_qps: 20
      classify_burst: 50
      admin_qps: 0
      catalogs: []         # must explicitly include catalogs
      priority: low
      billing_account: cc-00-default
