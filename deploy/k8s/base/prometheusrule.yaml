apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: efe-server-slo
  namespace: efe
  labels:
    app.kubernetes.io/name: efe-server
    release: prometheus
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    # -------------------------------------------------------------
    # SLO burn-rate alerts — https://sre.google/workbook/alerting-on-slos/
    # -------------------------------------------------------------
    - name: efe.slo.burn
      interval: 30s
      rules:
        # Fast burn (2-h budget → page)
        - alert: EfeErrorBudgetBurnFast
          expr: |
            (
              sum(rate(efe_classify_errors_total[5m]))
              / sum(rate(efe_classify_requests_total[5m]))
            ) > (14.4 * 0.005)
          for: 2m
          labels:
            severity: critical
            service: efe
            slo: availability
            burn_rate: "14.4x"
          annotations:
            summary: "EFE error budget burning 14.4× the sustainable rate"
            description: |
              Current 5-min error rate {{ $value | humanizePercentage }} is burning
              the 30-day error budget 14.4× faster than sustainable. At this rate
              the budget exhausts in 2 hours.
            runbook: "https://wiki/runbook/efe#errorbudget-fast"
            dashboard: "https://grafana/d/efe-overview"

        # Slow burn (24-h budget → P2)
        - alert: EfeErrorBudgetBurnSlow
          expr: |
            (
              sum(rate(efe_classify_errors_total[1h]))
              / sum(rate(efe_classify_requests_total[1h]))
            ) > (3 * 0.005)
          for: 15m
          labels:
            severity: warning
            service: efe
            slo: availability
            burn_rate: "3x"
          annotations:
            summary: "EFE error budget burning 3× over 1 hour"

    # -------------------------------------------------------------
    # Direct RED alerts — immediate symptoms.
    # -------------------------------------------------------------
    - name: efe.red
      interval: 30s
      rules:
        - alert: EfeLatencyP95High
          expr: |
            histogram_quantile(0.95,
              sum by (catalog, le) (rate(efe_classify_duration_seconds_bucket[5m]))
            ) > 2
          for: 10m
          labels: { severity: warning, service: efe, slo: latency }
          annotations:
            summary: "EFE p95 latency > 2 s on catalog {{ $labels.catalog }}"
            runbook: "https://wiki/runbook/efe#latency-p95"

        - alert: EfeLatencyP99High
          expr: |
            histogram_quantile(0.99,
              sum by (catalog, le) (rate(efe_classify_duration_seconds_bucket[5m]))
            ) > 3
          for: 10m
          labels: { severity: warning, service: efe, slo: latency }

        - alert: EfeTenantQuotaBreach
          expr: |
            sum by (tenant) (rate(efe_classify_errors_total{grpc_code="RESOURCE_EXHAUSTED"}[5m])) > 10
          for: 5m
          labels: { severity: info, service: efe }
          annotations:
            summary: "Tenant {{ $labels.tenant }} hitting rate-limit repeatedly"
            description: |
              Consider negotiating a quota bump via `#efe-capacity`.

    # -------------------------------------------------------------
    # Infrastructure alerts.
    # -------------------------------------------------------------
    - name: efe.infra
      interval: 30s
      rules:
        - alert: EfePodRestartLoop
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="efe",pod=~"efe-server-.+"}[10m]) > 0.3
          for: 5m
          labels: { severity: warning, service: efe }
          annotations:
            summary: "Pod {{ $labels.pod }} restarting > 0.3 / 10 min"

        - alert: EfePodNotReady
          expr: |
            kube_pod_status_ready{namespace="efe",condition="false",pod=~"efe-server-.+"} == 1
          for: 10m
          labels: { severity: critical, service: efe }

        - alert: EfeMemoryPressureHigh
          expr: |
            container_memory_working_set_bytes{namespace="efe",pod=~"efe-server-.+"}
            / container_spec_memory_limit_bytes{namespace="efe",pod=~"efe-server-.+"}
            > 0.9
          for: 10m
          labels: { severity: warning, service: efe }

        - alert: EfeCPUThrottlingHigh
          expr: |
            rate(container_cpu_cfs_throttled_seconds_total{namespace="efe",pod=~"efe-server-.+"}[5m]) > 1
          for: 10m
          labels: { severity: warning, service: efe }

        - alert: EfeCatalogStaleOnFleet
          expr: |
            (time() - max(efe_catalog_loaded_timestamp_seconds)) > 600
          for: 2m
          labels: { severity: warning, service: efe }

        - alert: EfeCertMTLSExpiringSoon
          expr: |
            (min(certmanager_certificate_expiration_timestamp_seconds{name=~"efe-.+"}) - time()) < 172800
          labels: { severity: warning, service: efe }
          annotations:
            summary: "EFE mTLS cert expires in < 48 h"
