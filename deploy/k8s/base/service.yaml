---
# Data plane service — receives client Classify RPCs.
apiVersion: v1
kind: Service
metadata:
  name: efe-server
  namespace: efe
  labels:
    app.kubernetes.io/name: efe-server
    app.kubernetes.io/component: data-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: efe-server
  ports:
    - { name: grpc,    port: 50051, targetPort: data,   protocol: TCP, appProtocol: grpc }
    - { name: metrics, port: 9090,  targetPort: metrics, protocol: TCP }
---
# Admin plane service — restricted namespace access via NetworkPolicy.
apiVersion: v1
kind: Service
metadata:
  name: efe-server-admin
  namespace: efe
  labels:
    app.kubernetes.io/name: efe-server
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: efe-server
  ports:
    - { name: grpc-admin, port: 50052, targetPort: admin, protocol: TCP, appProtocol: grpc }
---
# Headless service for gRPC-native load balancing (round-robin via SRV).
apiVersion: v1
kind: Service
metadata:
  name: efe-server-headless
  namespace: efe
  labels:
    app.kubernetes.io/name: efe-server
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: efe-server
  ports:
    - { name: grpc, port: 50051, targetPort: data, protocol: TCP }
  publishNotReadyAddresses: false
