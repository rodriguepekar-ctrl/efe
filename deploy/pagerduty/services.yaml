# Sprint Φ-D-OPS (D97) — PagerDuty service + escalation declarative config.
#
# Idempotent input for `pulumi-pagerduty` / `terraform-provider-pagerduty`.
# Each service maps to one team & one routing key. The alert router
# (`scripts/ops/alert_router.py`) decides which service to fire based
# on Prometheus alert labels.
#
# Cf. `docs/EFE_OPERATIONAL_PRODUCTION_ARCHITECTURE.md` § 10.

apiVersion: pagerduty.efe.io/v1
kind: PagerDutyConfig
metadata:
  generated_by: scripts/ops/alert_router.py
  sprint: phi-d-ops

services:
  - id:               efe-platform
    name:             "EFE Platform (Sev1 catch-all)"
    description:      "Mode-1/2/3 hot path, KMS, audit chain."
    escalation_policy: ep-platform-24x7
    auto_resolve_timeout_seconds: 14400
    acknowledgement_timeout_seconds: 600
    alert_creation: "create_alerts_and_incidents"
    integrations:
      - type: prometheus
        vendor: prometheus
        routing_key_env: PD_ROUTING_KEY_PLATFORM

  - id:               efe-release
    name:             "EFE Release Pipeline"
    description:      "Canary rollouts, helm gates, master gate."
    escalation_policy: ep-release-business
    auto_resolve_timeout_seconds: 28800

  - id:               efe-finops
    name:             "EFE FinOps"
    description:      "Budget overrun, cost-per-tenant, chargeback drift."
    escalation_policy: ep-finops-business
    auto_resolve_timeout_seconds: 86400

  - id:               efe-saga
    name:             "EFE Saga Orchestrator"
    description:      "Tenant lifecycle, GDPR erasure cascade."
    escalation_policy: ep-platform-24x7

  - id:               efe-dpo
    name:             "EFE DPO / Compliance"
    description:      "Audit chain breaks, AI Act / GDPR controls stale."
    escalation_policy: ep-dpo-business
    auto_resolve_timeout_seconds: 86400

  - id:               efe-eng
    name:             "EFE Engineering Leadership"
    description:      "Postmortem overdue, master gate chronic fail."
    escalation_policy: ep-eng-business
    auto_resolve_timeout_seconds: 172800

escalation_policies:
  - id:   ep-platform-24x7
    name: "Platform 24×7 rotation"
    rules:
      - escalation_delay_in_minutes: 5
        targets: [primary_oncall_sre]
      - escalation_delay_in_minutes: 15
        targets: [secondary_oncall_sre]
      - escalation_delay_in_minutes: 30
        targets: [eng_director]

  - id:   ep-release-business
    name: "Release business hours"
    rules:
      - escalation_delay_in_minutes: 10
        targets: [release_lead]
      - escalation_delay_in_minutes: 30
        targets: [eng_director]

  - id:   ep-finops-business
    name: "FinOps business hours"
    rules:
      - escalation_delay_in_minutes: 30
        targets: [finops_lead]
      - escalation_delay_in_minutes: 120
        targets: [cfo_delegate]

  - id:   ep-dpo-business
    name: "DPO business hours"
    rules:
      - escalation_delay_in_minutes: 30
        targets: [dpo_primary]
      - escalation_delay_in_minutes: 120
        targets: [legal_counsel]

  - id:   ep-eng-business
    name: "Engineering leadership business hours"
    rules:
      - escalation_delay_in_minutes: 240
        targets: [eng_director]

# Alert → service routing rules consumed by `alert_router.py`.
routing_rules:
  - match: {ops_master_slo: SLO-OPS-AVAILABILITY}
    service: efe-platform
  - match: {ops_master_slo: SLO-OPS-E2E-P99-MODE1}
    service: efe-platform
  - match: {ops_master_slo: SLO-OPS-E2E-P99-MODE2}
    service: efe-platform
  - match: {ops_master_slo: SLO-OPS-E2E-P99-MODE3}
    service: efe-platform
  - match: {ops_master_slo: SLO-OPS-COMPLIANCE-POSTURE}
    service: efe-dpo
  - match: {ops_master_slo: SLO-OPS-AUDIT-CHAIN-INTACT}
    service: efe-dpo
  - match: {ops_master_slo: SLO-OPS-PROVISION-P95}
    service: efe-saga
  - match: {ops_master_slo: SLO-OPS-LIFECYCLE-INVARIANTS}
    service: efe-saga
  - match: {ops_master_slo: SLO-OPS-CANARY-ROLLBACK-RATE}
    service: efe-release
  - match: {ops_master_slo: SLO-OPS-MTTR}
    service: efe-eng
  - match: {ops_master_slo: SLO-OPS-POSTMORTEM-VELOCITY}
    service: efe-eng
  - match: {ops_master_slo: SLO-OPS-DR-DRILL-CADENCE}
    service: efe-platform
  - match: {ops_master_slo: SLO-OPS-BUDGET-OVERRUN}
    service: efe-finops
  - match: {ops_master_slo: SLO-OPS-AL-COST-PER-LABEL}
    service: efe-finops
  - match: {ops_master_slo: SLO-OPS-COST-PER-TENANT}
    service: efe-finops
  - match: {ops_master_slo: SLO-OPS-ACCURACY-AGGREGATE}
    service: efe-platform
  - match: {ops_master_slo: SLO-OPS-STREAM-LOSS}
    service: efe-platform
  - match: {ops_master_slo: SLO-OPS-CLOUD-PARITY}
    service: efe-release
  - match: {ops_master_slo: SLO-OPS-STREAM-LAG-P99}
    service: efe-platform
  - match: {ops_master_slo: SLO-OPS-AL-LOOP-FRESHNESS}
    service: efe-eng
