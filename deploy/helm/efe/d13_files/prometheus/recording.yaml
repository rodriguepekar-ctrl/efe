## Sprint D13 — recording rules.
##
## Pre-computed aggregates fed to the 6 Grafana dashboards. Each
## rule has a target evaluation cost ≤ 50 ms on a 10k-series Prom
## instance ; the goal is to keep dashboard renders under 3 s
## (SLO D13-OBS-1).
##
## Naming convention :
##   - Single-colon ``efe:`` namespace (one colon = recording rule
##     output, not a raw exposed metric).
##   - Suffix ``_<windows>`` indicates the smoothing window
##     (5m / 1h / 1d).
##
## Cardinality budget : the topk(20, …) rule caps long-tail
## tenants ; the others stay below 200 series each.
##
## Validated by ``promtool check rules`` in
## ``.github/workflows/bench-observability.yml``.

groups:
  - name: efe-d13-recording
    interval: 30s
    rules:
      ## 1. Per-tenant p99 latency, all RPCs combined.
      ##
      ## Used by dashboards 01, 02, 06.
      - record: efe:rpc_p99_latency_seconds:5m
        expr: |
          histogram_quantile(0.99,
            sum by (le, tenant) (
              rate(efe_grpc_request_duration_seconds_bucket[5m])
            )
          )

      ## 2. Per-tenant error rate (fraction).
      ##
      ## Used by dashboards 01, 02 + alert D13ObsHighErrorRate.
      - record: efe:rpc_error_rate:5m
        expr: |
          sum by (tenant) (
            rate(efe_grpc_requests_total{code!="OK"}[5m])
          )
          / on(tenant) group_left()
          sum by (tenant) (
            rate(efe_grpc_requests_total[5m])
          )

      ## 3. Top 20 tenants by RPS — cardinality cap for long tail.
      ##
      ## Used by dashboards 01, 02. Avoids querying all `n_tenants`
      ## series in dashboard render.
      - record: efe:top20_tenants_by_rps:5m
        expr: |
          topk(20,
            sum by (tenant) (
              rate(efe_grpc_requests_total[5m])
            )
          )

      ## 4. Catalog evolution rate per op_tag and tenant.
      ##
      ## Used by dashboard 03 + alert D13ObsClassifyDriftHigh
      ## (z-score baseline).
      - record: efe:catalog_evolve_rate:5m
        expr: |
          sum by (op_tag, tenant) (
            rate(efe_audit_events_total{action="evolve"}[5m])
          )

      ## 5. Active versions per (tenant, name).
      ##
      ## Sampled at 1m for the dashboard 03 chain visualisation +
      ## alert D13ObsCatalogVersionExplosion.
      - record: efe:catalog_chain_depth:1m
        expr: |
          max by (tenant, name) (efe_catalog_versions_per_name)

      ## 6. Per-tenant CPU minutes (for cost dashboard).
      ##
      ## Joined with kube_pod metadata to attribute container CPU
      ## back to the tenant namespace label.
      - record: efe:cpu_minutes_per_tenant:1h
        expr: |
          sum by (namespace) (
            rate(container_cpu_usage_seconds_total{
              namespace=~"tenant-.+"
            }[1h])
          ) * 60

      ## 7. Per-tenant RAM GB-hours (for cost dashboard).
      ##
      ## Average working-set memory over the trailing hour, in GB.
      - record: efe:ram_gb_hours_per_tenant:1h
        expr: |
          avg_over_time(
            (
              sum by (namespace) (
                container_memory_working_set_bytes{
                  namespace=~"tenant-.+"
                }
              ) / 1e9
            )[1h:5m]
          )

  ## Higher-window downsampling group : :1h and :1d aggregates
  ## from the :5m base. Retained 365 days on object storage for
  ## long-window capacity-planning queries.
  - name: efe-d13-recording-1h
    interval: 5m
    rules:
      - record: efe:rpc_p99_latency_seconds:1h
        expr: |
          avg_over_time(efe:rpc_p99_latency_seconds:5m[1h])

      - record: efe:rpc_error_rate:1h
        expr: |
          avg_over_time(efe:rpc_error_rate:5m[1h])

      - record: efe:catalog_evolve_rate:1h
        expr: |
          avg_over_time(efe:catalog_evolve_rate:5m[1h])

  - name: efe-d13-recording-1d
    interval: 1h
    rules:
      - record: efe:rpc_p99_latency_seconds:1d
        expr: |
          avg_over_time(efe:rpc_p99_latency_seconds:1h[1d])

      - record: efe:rpc_error_rate:1d
        expr: |
          avg_over_time(efe:rpc_error_rate:1h[1d])
