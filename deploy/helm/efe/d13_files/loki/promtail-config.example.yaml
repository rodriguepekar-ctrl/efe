## Sprint D13 — promtail example config.
##
## Drop-in configuration for promtail to ship efe-server logs to
## Loki with the structured-log labels documented in
## ``docs/howto/observability-setup.md``.
##
## DO NOT use as-is in production. Customize :
##   - Loki endpoint
##   - Tenant ID source (depends on K8s namespace convention)
##   - JWT redaction patterns (already in pipeline_stages)
##
## Compatible with promtail 2.9+.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: ""  # if Loki multi-tenant, derive at relabel time
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: efe-server
    kubernetes_sd_configs:
      - role: pod
        selectors:
          - role: pod
            label: "app.kubernetes.io/name=efe-server"

    pipeline_stages:
      ## 1. Parse the structured JSON.
      - json:
          expressions:
            schema_version: schema_version
            stream:         stream
            level:          level
            request_id:     request_id
            tenant_id:      tenant_id
            principal:      principal
            ## Keep extra fields available to the line_format.
            rpc:            rpc
            duration_ms:    duration_ms
            status_code:    status_code

      ## 2. Promote a small subset of fields to Loki labels (kept
      ##    bounded for cardinality). request_id, principal, etc.
      ##    stay in the line content.
      - labels:
          stream:
          level:
          tenant_id:

      ## 3. Use the JSON timestamp as the canonical event time.
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      ## 4. Redact JWT tokens preventively. The Bearer pattern is
      ##    the most common leak vector — strip it before storage.
      ##
      ##    NB : redaction is best-effort. The proper fix is the
      ##    server NOT logging tokens — promtail is a backstop.
      - replace:
          expression: 'Bearer\s+[A-Za-z0-9._\-]+'
          replace: 'Bearer ***REDACTED***'

      ## 5. Drop DEBUG-level logs unless `EFE_LOG_LEVEL=debug` is
      ##    set on the pod.
      - match:
          selector: '{level="DEBUG"}'
          stages:
            - drop:
                expression: '.*'

    relabel_configs:
      ## Add namespace + pod labels for richer queries.
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      ## Map K8s tenant.efe.ai/owner label to a Loki `tenant`
      ## label (in addition to tenant_id from JSON).
      ##
      ## The two should always agree ; if they don't, surface as
      ## a security event.
      - source_labels: [__meta_kubernetes_pod_label_tenant_efe_ai_owner]
        target_label: namespace_tenant
