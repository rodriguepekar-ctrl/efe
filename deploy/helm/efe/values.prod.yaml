# Production overlay — strict SLOs + pinned digest.
replicaCount: 3

image:
  # Override at release time to the exact digest published by the
  # release workflow. Never use a floating tag in production.
  digest: ""
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 30
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  requests:
    cpu: "1"
    memory: "1Gi"
  limits:
    cpu: "4"
    memory: "4Gi"

pdb:
  enabled: true
  minAvailable: 2

audit:
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "standard-rwo"

config:
  rustLog: "info,efe=info"
  auth:
    enabled: true
    allowInsecureDev: false
  rateLimit:
    enabled: true
    defaultCapacity: 1000
    defaultRefill: 400.0
  idempotency:
    enabled: true
    cacheCapacity: 100000
    ttlMs: 600000

networkPolicy:
  enabled: true

prometheusRule:
  thresholds:
    errorRate: 0.005         # 0.5 % tight prod threshold
    latencyP95Seconds: 0.9
    confidenceP50: 0.85
    ratelimitDropsPerSec: 50
