# Sprint D27 (Φ-C) — helm-unittest fixtures for bundle reload Helm hook.
#
# Run via : helm unittest deploy/helm/efe/
#
# Pin tested by `test_m12_helm_extension_helm_unittest_d27_present`.
suite: Bundle reload Helm post-upgrade hook (D27)
templates:
  - d27-bundle-reload-hook.yaml
release:
  name: efe
  namespace: efe-test
tests:
  - it: not rendered when bundleReload.enabled=false (default)
    set:
      bundleReload.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rendered as a Job with helm.sh/hook=post-upgrade when enabled
    set:
      bundleReload.enabled: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-succeeded,before-hook-creation

  - it: uses canonical bitnami/kubectl image by default
    set:
      bundleReload.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^bitnami/kubectl:[0-9.]+$

  - it: enforces strict securityContext (non-root + readOnlyRootFs + drop ALL)
    set:
      bundleReload.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
