# Sprint D40 (Φ-D) — helm-unittest verification for DR drill quarterly CronJob.
#
# This template ALREADY EXISTS post-D17/D40 audit pass. M12
# verifies the schedule + compliance labels + retention.
#
# Run via : helm unittest deploy/helm/efe/
#
# Pin tested by `test_m12_helm_extension_helm_unittest_d40_present`.
suite: DR drill quarterly CronJob (D40 verification)
templates:
  - d40-dr-drill-quarterly-cronjob.yaml
release:
  name: efe
  namespace: efe-test
tests:
  - it: not rendered when backup.drillQuarterly.enabled=false
    set:
      backup.enabled: true
      backup.drillQuarterly.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rendered as a CronJob with quarterly schedule when enabled
    set:
      backup.enabled: true
      backup.drillQuarterly.enabled: true
    asserts:
      - isKind:
          of: CronJob
      - matchRegex:
          path: spec.schedule
          pattern: ^[0-9*/]+ [0-9*/]+ [0-9*/]+ \*/3 \*$

  - it: enforces concurrencyPolicy=Forbid (no concurrent drills)
    set:
      backup.enabled: true
      backup.drillQuarterly.enabled: true
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  - it: declares 4-framework compliance via labels
    set:
      backup.enabled: true
      backup.drillQuarterly.enabled: true
    asserts:
      - equal:
          path: metadata.labels["compliance.efe.ai/framework"]
          value: "soc2,iso27001,nis2,rgpd"
      - equal:
          path: metadata.labels["compliance.efe.ai/cadence"]
          value: quarterly

  - it: declares SOC 2 / ISO 27001 / NIS2 / RGPD criteria
    set:
      backup.enabled: true
      backup.drillQuarterly.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["compliance.efe.ai/soc2-criterion"]
          value: "CC9.1"
      - equal:
          path: metadata.annotations["compliance.efe.ai/iso27001-control"]
          value: "A.17.1.3"
      - equal:
          path: metadata.annotations["compliance.efe.ai/nis2-article"]
          value: "Art21.2(c)"
      - equal:
          path: metadata.annotations["compliance.efe.ai/rgpd-article"]
          value: "Art32.1(c,d)"
