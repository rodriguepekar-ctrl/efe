# Default values for the EFE Helm chart (M12.8).
#
# Every value below has a sane default for a 3-replica prod-grade
# deployment. Override per-environment with `values.staging.yaml`
# or `values.prod.yaml` (see the `deploy/helm/efe/` directory).

# =====================================================================
# Image
# =====================================================================
image:
  repository: ghcr.io/efe-project/efe
  # Empty tag falls back to .Chart.AppVersion for a predictable default.
  tag: ""
  # Recommended in prod: pin by digest (e.g. "sha256:abc123...").
  # When set, the digest takes precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# =====================================================================
# Replicas / scaling
# =====================================================================
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  # For HPA 3..N this keeps at least 2 pods up during voluntary disruptions.
  minAvailable: 2

# =====================================================================
# Resources
# =====================================================================
# **Audit fix D18-A11** — pre-fix this block was duplicated by a
# second top-level ``resources:`` mapping at line ~884 with
# ``memory: 8Gi/10Gi`` (D18 raised the floor for D16 bundles). YAML
# last-wins silently dropped this block in favour of the D18 sizing.
# The unified block below preserves D18's higher floor since prod
# pods carry the bundle in memory ; small dev installs still work
# (the requests are upper bounds — a 2 GiB pod won't actually
# consume 8 GiB).
resources:
  requests:
    memory: "8Gi"
    cpu: "1000m"
  limits:
    memory: "10Gi"
    cpu: "2000m"

# =====================================================================
# Security context
# =====================================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false  # efe-server never talks to the k8s API

# =====================================================================
# Service
# =====================================================================
# **Audit fix D18-A11** — pre-fix this block was duplicated by a
# second top-level ``service:`` mapping at the bottom of the file
# (``service: { headless: true, port: 50051 }``). YAML last-wins
# silently overrode this entire block in Helm rendering, replacing
# ``service.type``, ``service.grpcPort``, etc. with whatever the
# duplicate happened to redefine. The unification below removes the
# duplicate and folds D18's ``headless: true`` default in.
service:
  type: ClusterIP
  grpcPort: 50051
  metricsPort: 9090
  annotations: {}

  # ─── Sprint D9 amendment A5, refreshed by D18 audit ──────────────
  # ``headless: true`` is REQUIRED when scaling beyond 1 replica
  # because a regular ClusterIP service does L4 round-robin via
  # kube-proxy, which sticks every gRPC client (HTTP/2 multiplexes N
  # streams over 1 connection) to a SINGLE backend. The result is
  # "1 replica at 100 % CPU, others idle".
  #
  # With ``headless: true`` the DNS lookup returns N pod IPs, and
  # gRPC client-side ``round_robin`` LB distributes connections
  # across replicas. See ``docs/bench/d9_deep_analysis_supplement.md``
  # §5 + D18 architecture § 12.1.
  #
  # **Audit fix D18-A11** flipped the default from ``false`` to
  # ``true`` to match the D18 expected production posture (>= 3
  # replicas). Single-replica dev clusters can opt back to the
  # legacy L4 path with ``--set service.headless=false``.
  headless: true
  # The legacy block had only ``grpcPort`` ; D18 introduced a
  # ``port`` alias. Keep both so existing operator overrides work.
  port: 50051

# =====================================================================
# Tenant labelling — Sprint D9 amendment A9
# =====================================================================
# A single string identifier propagated as the
# ``app.kubernetes.io/tenant`` label on every k8s object emitted by
# this chart. Used by D11 multi-tenant ResourceQuota/LimitRange
# (Phase 2 milestone) — set NOW so that promoting a deployment to
# multi-tenant doesn't require a chart refactor.
#
# Default ``"default"`` is harmless on single-tenant installs.
#
# Sprint D11 extension — Tier 2 isolation block (opt-in).
# When ``namespace.isolated: true``, the chart additionally renders
# ``ResourceQuota``, ``LimitRange``, and a NetworkPolicy ingress
# scoped to the tenant's authorised consumer namespaces. Cf.
# ``docs/bench/d11_per_tenant_isolation_architecture.md`` §6.
tenant:
  id: "default"

  # Optional cardinality safeguard. When non-empty, the
  # ServiceMonitor's metricRelabeling drops samples whose
  # ``tenant`` label isn't in this list. Catches cardinality-bomb
  # attacks (HAZOP vector #12). Default empty = trust the JWT.
  allowlist: []

  # ─── Tier 2 isolation block ─────────────────────────────────────
  namespace:
    # Master toggle for Tier 2. When false (default), the chart
    # behaves exactly as Tier 1 (D9/D10 single-tenant) — fully
    # backward compatible.
    isolated: false

    resourceQuota:
      enabled: false
      # CPU + memory caps for the *aggregate* of all pods in the
      # namespace. Pinned the same value for `requests` and
      # `limits` to enforce GUARANTEED reservation (cf. spec §6.2).
      cpu: "4"
      memory: "8Gi"
      pods: "10"
      # Optional extra hard caps (services, configmaps, etc.).
      services: "5"
      extra: {}

    limitRange:
      enabled: false
      defaultCpu: "500m"
      defaultMemory: "512Mi"
      maxCpu: "2"
      maxMemory: "2Gi"

    networkPolicy:
      tenantIngress:
        enabled: false
        # Ingress is allowed ONLY from namespaces matching ALL of
        # these labels. The conventional contract is
        # ``tenant.efe.ai/owner: <tenant-id>``.
        allowFromNamespaceLabels:
          tenant.efe.ai/owner: "default"
        # Plus the monitoring namespace(s). Default matches the
        # standard prometheus-operator install location.
        allowFromMonitoringNamespaces:
          - "monitoring"
        # Operator-supplied extra ``from:`` blocks.
        extraFrom: []

# =====================================================================
# Helm chart tests — Sprint D9 amendment A6
# =====================================================================
# `helm test efe` runs every Pod tagged with the `helm.sh/hook: test`
# annotation. We ship two probes:
#
#   1. test-grpc-health  (always-on) — runs `grpc_health_probe`
#      against the in-cluster Service. Catches "service unreachable".
#
#   2. test-semantic-smoke (opt-in)   — runs 3 known classify queries
#      via the bundled SDK and checks that the returned label matches
#      the expected intent. Catches "service answers but wrong label"
#      (cache stale, model corrupt). Closes HAZOP gap #4.
#
# The semantic test requires the `efe-bench` image which is published
# alongside `efe-server` by the release workflow (D9.6). Default
# OFF until that image is in GHCR for v0.1.9.
tests:
  # Sprint D11 — Tier 2 only. Probes the gRPC health endpoint with
  # a fake-signature Bearer token to confirm the auth interceptor
  # rejects unauthenticated calls. Defense-in-depth complement to
  # the per-tenant NetworkPolicy. Disabled by default (the bench
  # image must exist in your registry).
  crossTenantDenial:
    enabled: false
    image: "ghcr.io/efe-project/efe-bench:0.1.11"

  semanticSmoke:
    # ⚠ The image referenced below is NOT yet built by the standard
    # release workflow as of v0.1.9 — only `efe-server` is. Setting
    # ``enabled: true`` without first building the bench image will
    # cause the helm test to fail with `ImagePullBackOff`. Either:
    #   * leave disabled (default), OR
    #   * publish your own image with the SDK + bash + python3 at
    #     `image:` and set `enabled: true`. A reference Dockerfile
    #     is in `clients/python/Dockerfile.bench` (TODO D9.7).
    enabled: false
    # Override with whatever bench image you've built.
    image: "ghcr.io/efe-project/efe-bench:0.1.9"

  # Sprint D12-bis — verifies that the gRPC `efe.v1.catalog.CatalogService`
  # is reachable post-install. Uses the bundled `grpc_health_probe`
  # in the server image with the per-service flag — no bench image
  # dependency, so this can default to ``true``. The catalog service
  # is unconditionally attached by the runtime ; this test catches
  # regressions where the wire-up is dropped or the service name
  # registered with the health reporter drifts from the proto.
  catalogReachable:
    enabled: true

# =====================================================================
# Application configuration
# The Helm chart materialises these into an EFE_* environment variable
# ConfigMap; every key matches the matrix in M12_ARCHITECTURE.md
# §Annexe F.
# =====================================================================
config:
  listenAddr: "0.0.0.0:50051"
  metricsAddr: "0.0.0.0:9090"
  requestTimeoutMs: 30000
  maxConcurrentStreams: 1024
  enableAdmin: true
  rustLog: "info,efe=info"
  logFormat: "json"
  auditLogPath: "/var/lib/efe/audit/audit.jsonl"
  auth:
    enabled: true
    jwtAudience: "efe.v1"
    jwtIssuer: ""
    allowInsecureDev: false
    secretsFile: "/etc/efe/secrets/hs256"
    # =========================================================
    # Sprint **D15** — OIDC tenant onboarding + IdP integration.
    #
    # When `oidc.enabled = true`, the runtime IGNORES `secretsFile`
    # above and validates JWTs through the multi-issuer OIDC path
    # (Auth0, Keycloak, Okta, Azure AD…). Cf.
    # `docs/bench/d15_onboarding_idp_architecture.md`.
    #
    # Operational checklist before flipping to true :
    #   1. `efe-onboard preflight` returns 0 ;
    #   2. `oidcIssuersFile` Secret is mounted at the path below
    #      and contains a valid JSON array of `IssuerConfig`
    #      records ;
    #   3. The `tenants` table contains at least one `active`
    #      tenant (otherwise no token will validate).
    #
    # Cardinality budget : every issuer adds ~13 Prometheus series
    # via `efe_oidc_tokens_validated_total{issuer, outcome}` etc.
    # — capped by the architecture at 10 issuers per cluster.
    oidc:
      enabled: false
      # Path where the K8s Secret will be mounted (read-only).
      # The Secret content is a JSON array of `IssuerConfig` —
      # see deploy/config/oidc-issuers.example.json for a template.
      #
      # **Audit fix D15-M7** — the path moved from `/etc/efe/oidc-issuers.json`
      # to `/etc/efe/oidc/oidc-issuers.json` to avoid the OIDC Secret
      # mount shadowing other files under `/etc/efe/`. Operators
      # upgrading from v0.1.15-pre-audit MUST update their Secret
      # references accordingly.
      issuersFile: "/etc/efe/oidc/oidc-issuers.json"
      # JWKS pull cache TTL — how often the periodic refresh task
      # re-fetches each `jwks_url`. Default 300 (5 min) matches
      # OIDC vendor recommendations (Auth0 / Okta cache hint).
      jwksTtlS: 300
      # Per-fetch HTTP timeout — caps the blast radius of a slow
      # IdP. Default 5 s.
      jwksFetchTimeoutMs: 5000
      # Retry budget per refresh call. Backoff doubles each
      # attempt. Default 3 → ~7 s worst-case attempt window.
      jwksRetryMax: 3
      # Initial backoff in ms — doubles per retry.
      jwksBackoffMs: 1000
      # Stale-while-revalidate window. When a refresh fails AND
      # the cache age is between `jwksTtlS` and
      # `jwksTtlS + graceStaleS`, the cache continues to serve
      # tokens AND increments `efe_jwks_stale_total`. Past that
      # window, every signature check fails closed.
      graceStaleS: 3600
      # Name of an EXISTING K8s Secret containing the issuers
      # descriptor (one key, JSON value). The deployment mounts
      # it read-only at `issuersFile`. Leave empty to skip the
      # mount entirely (then `oidc.enabled` should be `false`).
      existingSecretName: ""
      # Key inside the Secret. Defaults to `oidc-issuers.json` —
      # rename only if your secret manager already uses a different
      # key (Vault / ESO).
      existingSecretKey: "oidc-issuers.json"
  # =========================================================
  # Sprint **D16** — embedder bundling.
  #
  # Two paths coexist :
  #
  #   * `backend: legacy` (default) — pre-D16 path. The runtime
  #     delegates to `LocalSTEmbedder` which lazy-fetches from
  #     HuggingFace Hub at first encode. No bundle mounted.
  #
  #   * `backend: bundle` — D16 byte-exact pinning. The pod
  #     mounts a verified bundle from a K8s Secret (or PVC, or
  #     a directory pre-populated by an `oras pull` initContainer).
  #     Fail-closed at boot if signature/hash check fails.
  #
  # Operational checklist before flipping to `bundle` :
  #   1. `efe-bundle keygen` (locally) → push public.b64url to
  #      `pubkeys.json` Secret ;
  #   2. `efe-bundle pack ...` in CI → publish bundle artifact ;
  #   3. wire `bundle.existingSecretName` to mount the bundle ;
  #   4. wire `bundle.trustStoreSecretName` to mount pubkeys.json ;
  #   5. flip `embedder.backend: bundle` and rollout.
  #
  # Cf. `docs/bench/d16_embedder_bundling_architecture.md`.
  embedder:
    backend: "legacy"
    bundle:
      # Path inside the pod where the bundle directory will be
      # accessible. The K8s Secret mounts at this sub-path.
      path: "/etc/efe/bundles/active"

      # Signature policy:
      #   - "required" (prod default)
      #   - "warn" (staging window before signing CI is wired)
      #   - "skip" (Tier 1 dev only — refused in production tier)
      requireSignature: "required"

      # Path to the Ed25519 trust store JSON inside the pod.
      trustStorePath: "/etc/efe/bundles/pubkeys.json"

      # SBOM requirement (prod hardening). Refuses bundles whose
      # manifest doesn't declare a `sbom_path`.
      requireSbom: true

      # Operator acknowledgement for non-redistributable licenses
      # (CC-BY-NC, OpenRAIL-M variants). Default false → loader
      # refuses such bundles. Set after legal review.
      acknowledgeNonRedistributable: false

      # Load step timeout (seconds). Caps worst-case time for
      # parse + sig + hash + runtime init.
      loadTimeoutS: 60

      # Per-encode timeout (milliseconds). Caps worst-case
      # inference latency.
      encodeTimeoutMs: 500

      # Existing Secret with the bundle (alternative to PVC or
      # initContainer). Single-key Secret per file ; the K8s
      # mount projection turns it into a directory tree under
      # `path` above.
      existingSecretName: ""

      # Trust-store Secret. Single-key (`pubkeys.json`).
      trustStoreSecretName: ""
  rateLimit:
    enabled: true
    defaultCapacity: 500
    defaultRefill: 200.0
    anonymousCapacity: 50
    anonymousRefill: 10.0
  idempotency:
    enabled: true
    cacheCapacity: 50000
    ttlMs: 300000
  # =========================================================
  # Sprint D12-bis — Catalog admin storage backend.
  #
  # The CatalogService (gRPC) is unconditionally attached by
  # the server runtime ; this block only selects WHERE catalog
  # versions are persisted and what hard quotas guard the
  # in-memory or SQL path.
  #
  #   * `backend: memory` (default) — in-process registry, no
  #     persistence across pod restarts. Suited for v0.1.x
  #     and demo/staging.
  #   * `backend: postgres` — RESERVED for D14 ; the binary
  #     fails fast at boot with a clear error (cf.
  #     `runtime.rs::Server::build`). Do NOT enable until the
  #     SQL implementation lands.
  #
  # Audit D12-bis fix C2 — quotas below MUST mirror
  # `crates/efe-server/src/catalog/policy.rs::DEFAULT_*`
  # constants exactly. The pin test
  # `scripts/tests/test_d12bis_catalog_helm_render.py::test_values_yaml_quotas_match_efe_server_defaults`
  # asserts byte-for-byte equality, so any drift surfaces in
  # CI rather than as a silent operator confusion.
  #
  # These values are rendered to env vars consumed by
  # `ServerConfig::from_env` and propagated to the registry
  # via `ServerBuilder::build` (audit fix C1).
  # =========================================================
  catalog:
    backend: "memory"
    maxNamesPerTenant: 100      # = policy::DEFAULT_MAX_NAMES_PER_TENANT
    maxVersionsPerName: 1000    # = policy::DEFAULT_MAX_VERSIONS_PER_NAME
    maxClassesPerCatalog: 256   # = policy::DEFAULT_MAX_CLASSES_PER_CATALOG
    maxSentencesPerClass: 64    # = policy::DEFAULT_MAX_SENTENCES_PER_CLASS
    # =========================================================
    # Sprint D14 — Postgres backend configuration.
    #
    # Active uniquement quand `backend: "postgres"`. Pour
    # `backend: "memory"` (la valeur par défaut), ce bloc est
    # ignoré côté code et le ConfigMap rend des valeurs
    # neutres (pas d'env vars `EFE_PG_*` rendues — voir le
    # `{{- if eq .Values.config.catalog.backend "postgres" }}`
    # dans `templates/configmap.yaml`).
    #
    # Trois chemins pour le password :
    #   1. `existingSecretName` — recommandé Tier 2/3.
    #   2. `externalSecretName` — external-secrets operator
    #      (Tier 3 prod).
    #   3. `password` inline — Tier 1 dev only, visible dans
    #      `kubectl describe pod`.
    #
    # Cf. docs/bench/d14_postgres_catalog_backend_architecture.md
    # § 16 pour le détail des trois chemins + recommandation
    # postgres operator.
    # =========================================================
    postgres:
      host: "efe-pg.efe-catalog.svc.cluster.local"
      port: 5432
      database: "efe_catalog_db"
      user: "efe_catalog"
      sslMode: "prefer"           # disable | prefer | require | verify-ca | verify-full
      existingSecretName: ""      # name of an existing Secret with a `password` key
      existingSecretKey: "password"
      externalSecretName: ""      # external-secrets operator path (out-of-chart)
      password: ""                # inline (Tier 1 only)
      # Pool sizing — cf. § 8.1 of the architecture doc.
      poolMaxConnections: 8
      poolMinConnections: 2
      poolAcquireTimeoutMs: 5000
      poolMaxLifetimeS: 1800
      poolIdleTimeoutS: 600
      poolTestBeforeAcquire: true
    # =========================================================
    # Sprint D14-bis — HMAC-chained tamper-evident audit log.
    #
    # Off by default. Enabling this turns the legacy
    # `tracing::info!(target="audit", …)` sink (D12) into the
    # `HmacChainedAuditSink` (D14-bis), which signs every audit
    # event with HMAC-SHA-256 and persists it in the `audit_events`
    # SQL table (forward migration `0003_audit_events.sql`).
    #
    # Required for SOC 2 Type II / HIPAA §164.312(b) / GDPR
    # Article 32 / NIST 800-53 AU-9 compliance.
    #
    # Architecture : docs/bench/d14bis_hmac_audit_chain_architecture.md
    # =========================================================
    audit:
      signing:
        # Master switch.
        enabled: false
        # Path to the HMAC keys file inside the pod (mounted via
        # the audit-hmac volume below).
        keysFile: "/etc/efe/secrets/audit-hmac/hmac.keys"
        # Reference to a Kubernetes Secret with a `hmac.keys` key
        # holding the file content. Recommended for Tier 2/3 ;
        # external-secrets operator can manage it (out-of-chart).
        existingSecretName: ""
        existingSecretKey: "hmac.keys"
        # When true, every signed event is also forwarded to the
        # legacy TracingAuditSink so existing Loki/Splunk pipelines
        # continue to receive the audit stream.
        chainToTracing: true
        # Periodic self-verify cadence in seconds. Set to 0 to
        # disable. Recommended : 3600 (1 h).
        selfVerifyEverySeconds: 3600
  # =========================================================
  # Sprint **D13-bis** — OpenTelemetry SDK real implementation.
  #
  # When `otel.enabled = true`, the pod exports spans via OTLP/gRPC
  # to the configured collector. Without this, the dashboards' OTel
  # Traces panels stay empty (D13 only wired the dashboards, not
  # the SDK).
  #
  # Operational checklist :
  #   1. Ensure an OTel collector is reachable at `otel.endpoint`
  #      (in-cluster `otel-collector.efe.svc:4317` is the default) ;
  #   2. Verify NetworkPolicy egress allows the collector port ;
  #   3. Flip `otel.enabled: true` and rollout.
  #
  # Cf. `docs/bench/d13bis_otel_sdk_real_architecture.md`.
  observability:
    otel:
      # Master switch.
      enabled: false
      # OTLP/gRPC endpoint of the collector. Plaintext acceptable
      # in-cluster ; use `https://` for cross-cluster (Grafana Cloud).
      endpoint: "http://efe-otel-collector.efe.svc.cluster.local:4317"
      # Head-based sampling ratio ∈ [0, 1]. 0.05 = 5 % (architecture
      # default). Bump to 0.25 for debug bursts, restore to 0.05 in
      # steady state.
      sampleRate: 0.05
      # Force-sample errored spans (status_code = ERROR). Architecture
      # § 5.4 — works at span-creation time via the
      # ErrorBoostingSampler ; tail-sampling for slow paths lives at
      # the collector (cf. tail_sampling processor).
      forceSampleOnError: true
      # Resource attribute service.name. Default `efe-server`.
      serviceName: "efe-server"
      # Resource attribute service.version. Empty → derives from
      # the binary's CARGO_PKG_VERSION at build time.
      serviceVersion: ""
      # Resource attribute deployment.environment.name. Examples :
      # `production`, `staging`, `dev`. Renders to EFE_DEPLOY_ENV.
      deployEnv: ""
      # Hard-fail boot if the SDK init fails. Default false →
      # degrade gracefully (Prometheus + logs still work).
      failOnError: false

  shutdown:
    drainMs: 25000
    forceAbortMs: 30000

# =====================================================================
# Secrets
#
# Recommended in production: use `externalSecretName` (external-secrets
# operator) or `existingSecretName` (self-managed Secret) so that
# secret material is NEVER stored in values.yaml.
#
# `inline.keys` is a dev-only fallback; it creates a Secret managed by
# Helm. Do NOT use in production.
# =====================================================================
secrets:
  externalSecretName: ""
  existingSecretName: ""
  inline:
    enabled: false
    keys: []   # list of base64-url-encoded HS256 keys

# =====================================================================
# Audit log persistence (M11 audit.jsonl, M12 §5.4)
# =====================================================================
audit:
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""   # empty → cluster default storage class
    accessMode: ReadWriteOnce
    mountPath: "/var/lib/efe/audit"

# =====================================================================
# Probes (M12.4)
# =====================================================================
livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2
  successThreshold: 1

startupProbe:
  initialDelaySeconds: 1
  periodSeconds: 2
  failureThreshold: 30

# =====================================================================
# Network policy (M12.9)
# =====================================================================
networkPolicy:
  enabled: true
  # Each entry is a `from` selector. Defaults cover ingress-nginx and
  # the kube-prometheus-stack Prometheus pod selector.
  allowedSources:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  # Egress is restricted to DNS by default. Add more if the backend
  # needs to reach external services (e.g. OTLP collector).
  allowedEgress: []

# =====================================================================
# Prometheus Operator CRDs
# Enable only if kube-prometheus-stack (or any Prometheus Operator)
# is installed and watches the release namespace.
# =====================================================================
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels: {}
  # When null, the ServiceMonitor is scoped to its own namespace only.
  # Set to an explicit list of namespaces to allow Prometheus in
  # another namespace to discover the target.
  namespaceSelector: {}

prometheusRule:
  enabled: true
  labels:
    release: kube-prometheus-stack
  # Thresholds can be overridden per-environment. Defaults match the
  # M12 §17.1 SLO targets.
  thresholds:
    errorRate: 0.01           # 1 %
    latencyP95Seconds: 0.9
    confidenceP50: 0.80
    ratelimitDropsPerSec: 100
    pvcAvailableFraction: 0.1

# =====================================================================
# Placement
# =====================================================================
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: efe
          topologyKey: kubernetes.io/hostname

# `terminationGracePeriodSeconds` should equal
# `config.shutdown.drainMs / 1000 + ~5s` so Kubernetes does not SIGKILL
# before the binary finishes flushing telemetry.
#
# **Audit fix D18-A11** — pre-fix this key was duplicated at the
# bottom of the file (``terminationGracePeriodSeconds: 60`` ; D18
# raised the budget to cover the 3-phase shutdown sequence). YAML
# last-wins silently overrode this 30 s value with 60 s, so
# operators thought they had 30 s but actually had 60 s. We unify
# on the D18-canonical 60 s here.
terminationGracePeriodSeconds: 60

# =====================================================================
# Extra env vars / volumes / annotations (escape hatches)
# =====================================================================
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
podAnnotations: {}
podLabels: {}

# =====================================================================
# Sprint D13 — observability dashboards
# =====================================================================
#
# Cf. ``docs/bench/d13_observability_dashboards_architecture.md``.
# All blocks below are opt-in (default OFF) so the chart stays
# backward-compatible for single-tenant deployments. Tier 2 partner
# rollouts should set ``observability.dashboards.enabled = true`` and
# ``observability.recordingRules.enabled = true`` at minimum.
observability:
  dashboards:
    # When true, render the 6 D13 dashboards as ConfigMaps with the
    # `grafana_dashboard=1` label. Compatible with the
    # `kiwigrid/k8s-sidecar` Grafana sidecar's auto-discovery.
    enabled: false
    # Grafana folder where the dashboards land.
    folder: "EFE"
    # Default dashboard refresh interval (panel-level overrides win).
    refresh: "30s"
    # When true, expose the 6 dashboards' UIDs as Helm test fixtures
    # for `helm test` validation.
    helmTestEnabled: true

  recordingRules:
    # When true, ship the 7 D13 recording rules + 2 downsample tiers
    # (:1h, :1d) as a PrometheusRule resource.
    enabled: false
    interval: "30s"

  alerts:
    # When true, ship the 10 D13 alerts. Each alert carries a
    # `runbook_url` annotation pointing to docs.efe.ai/runbooks/.
    enabled: false
    # Per-alert overrides (severity, for clause). Example :
    #   D13ObsHighErrorRate:
    #     severity: warning
    #     for: 15m
    overrides: {}

  cardinality:
    # Threshold for the D13ObsCardinalityBomb alert. Tune up for
    # very-large deployments (> 1000 tenants). Architecture default
    # 50000 series.
    panicBudget: 50000

  loki:
    enabled: false
    # Push endpoint, e.g. http://loki:3100/loki/api/v1/push.
    endpoint: ""
    # When true, ship the example promtail config as a ConfigMap so
    # operators can copy-paste rather than start from scratch.
    promtailExample: true

  tempo:
    enabled: false
    # OTLP/gRPC endpoint, e.g. http://tempo-distributor:4317.
    endpoint: ""

  otel:
    # When true, the server initialises OpenTelemetry SDK at startup
    # and emits spans for every RPC. Threaded into EFE_OTEL_* env
    # vars consumed by efe-server.
    enabled: false
    # Head-based sampling ratio (0..1). Default 0.05 = 5 %.
    sampleRate: 0.05
    # When true, force-sample every error span regardless of
    # sampleRate. Recommended ON in production.
    forceSampleOnError: true

  multiTenancy:
    # When true, the chart assumes Mimir / Cortex / Thanos behind
    # the Grafana Prometheus datasource and threads the tenant id
    # via the X-Scope-OrgID header. Cf. architecture D13 § 12.
    enabled: false

# =====================================================================
# Sprint D17 — Backup + Disaster Recovery
# Cf. docs/bench/d17_backup_dr_architecture.md
# =====================================================================
backup:
  # Master switch. When false, none of the D17 templates render.
  enabled: false

  # Insert dev-only secret values into the Secret object so a
  # `helm install` against a kind cluster has working defaults.
  # MUST be false in production ; SealedSecrets / Vault should
  # populate the real values.
  devSecretValues: false

  # Annotations on the backup ServiceAccount, useful for IRSA
  # (`eks.amazonaws.com/role-arn: ...`) or workload-identity bindings.
  serviceAccountAnnotations: {}

  storage:
    type: s3                      # only s3 supported in v0.1.18
    bucket: ""                    # REQUIRED when enabled=true
    region: ""                    # REQUIRED when enabled=true
    endpoint: ""                  # optional ; for MinIO / S3-compat

  retention:
    fullWeeks: 4
    diffDays: 14
    walDays: 14
    vaultDays: 30
    bundleWeeks: 4

  alerts:
    enabled: true
    rpoTargetSeconds: 300         # 5 min RPO target
    rtoTargetSeconds: 1800        # 30 min RTO target
    backupStaleSeconds: 86400     # 24 h
    drillStaleSeconds: 1209600    # 14 d

  # Integration with D14-bis HMAC chain : every snapshot/restore/
  # delete operation emits a structured row.
  audit:
    chainEvents: true

  # Operation-level timeouts.
  snapshotTimeoutSeconds: 1800
  restoreTimeoutSeconds: 1200

  # Schedule of the four base CronJobs. Each maps to one entry in
  # `templates/d17-backup-cronjobs.yaml`.
  cronJobs:
    postgres-full:
      enabled: true
      schedule: "0 6 * * 0"        # Sunday 06:00 UTC
      source: postgres
      kind: full
      activeDeadlineSeconds: 5400
    postgres-diff:
      enabled: true
      schedule: "0 6 * * 1-6"      # Mon-Sat 06:00 UTC
      source: postgres
      kind: diff
      activeDeadlineSeconds: 1800
    vault-snapshot:
      enabled: true
      schedule: "30 6 * * *"       # daily 06:30 UTC
      source: vault
      kind: vault_snapshot
      activeDeadlineSeconds: 600
    bundle-sync:
      enabled: true
      schedule: "0 7 * * 0"        # Sunday 07:00 UTC
      source: bundles
      kind: bundle_sync
      activeDeadlineSeconds: 3600

  # Bundles backup configuration : the source bucket is what the
  # D16 EFE_EMBEDDER_BACKEND=bundle pipeline reads from ; the dest
  # is the cross-region replicated backup bucket.
  bundles:
    sourceBucket: ""              # REQUIRED when enabled=true
    destBucket: ""                # REQUIRED when enabled=true
    crossRegion: false

  # Vault config — the same Vault instance D14-bis HMAC keys + D15
  # OIDC issuers are stored in.
  vault:
    addr: "https://vault.efe.svc.cluster.local:8200"
    tokenSecretRef:
      name: ""                    # SealedSecret-managed secret name
      key: token

  # Postgres pgBackRest config.
  postgres:
    stanza: main
    configPath: /etc/pgbackrest/pgbackrest.conf

  # Weekly DR drill CronJob configuration.
  drill:
    enabled: true
    schedule: "0 3 * * 0"          # Sunday 03:00 UTC
    namespace: efe-dr-drill
    rtoTargetSeconds: 1800
    activeDeadlineSeconds: 2700
    image: ""                     # default = same as efe-server
    imageTag: ""                  # default = same as efe-server

  # ───────────────────────────────────────────────────────────────────
  # Sprint **D40 (Φ-F)** — Quarterly DR drill (extends weekly drill).
  #
  # Cf. `docs/EFE_BACKUP_EXTENSION_ARCHITECTURE.md` § 9.
  #
  # The quarterly drill is the formal compliance evidence layer
  # (SOC 2 CC9.1 / ISO 27001 A.17.1.3 / NIS2 Art. 21 / RGPD Art. 32).
  # It rejoue the runbook end-to-end : kind cluster from-scratch +
  # Helm install + restore + Hello-World workflow + verifier suite +
  # immutable evidence pack (Object Lock COMPLIANCE 7 ans).
  # ───────────────────────────────────────────────────────────────────
  drillQuarterly:
    enabled: true
    # 1st of Jan / Apr / Jul / Oct at 04:00 UTC. 4 drills/year minimum.
    schedule: "0 4 1 1,4,7,10 *"
    namespace: efe-dr-drill-quarterly
    rtoTargetSeconds: 2700        # 45 min (vs 30 min weekly)
    activeDeadlineSeconds: 3600   # 60 min hard timeout
    image: ""                     # default = same as efe-server
    imageTag: ""                  # default = same as efe-server
    # **Audit fix M7-D40-A9 (MED)** — helm upgrade timeout configurable.
    helmTimeout: "5m"
    # **Audit fix M7-D40-A18 (HIGH)** — `devSecretValues=true` is dev-only.
    # In production the secrets come from SealedSecrets / external-secrets ;
    # the drill MUST NOT inject the chart's dev defaults. Set to true ONLY
    # when running the drill against a kind cluster locally.
    devSecretValues: false
    helloWorld:
      enabled: true
      tenantId: "drill-helloworld-tenant"
      catalogName: "helloworld-catalog"
      className: "greeting"
      sentence: "Hello, world!"
      maxLatencyMs: 60000         # 60 s SLO D40-DR-2
      fallbackMockBundle: false   # B-2 — refuse mock embedder by default
      # **Audit fix M7-D40-A14 (CRIT)** — Hello-World steps now use
      # grpcurl against the gRPC services directly (the previous
      # `efe-server admin <cmd>` paths did not exist in the v0.1.18
      # binary). The endpoint defaults to localhost:50051 (the
      # in-pod gRPC port) ; override for sidecar / mesh setups.
      grpcEndpoint: "localhost:50051"
    complianceEvidence:
      enabled: true
      bucket: "efe-compliance-evidence"
      objectLockMode: "COMPLIANCE"  # AWS S3 Object Lock — immutable
      retentionYears: 7
      attestationKeyId: "drill-attestation-2026"
      pvcSize: "20Gi"
      storageClassName: ""        # cluster default

# =====================================================================
# Sprint D18 — Multi-réplica + bench D12
# Cf. docs/bench/d18_multi_replica_bench_d12_architecture.md
# =====================================================================
replicas:
  # HPA min/max bounds. min ≥ 2 recommended for production HA.
  # `replicas.min: 1` reste valide pour dev clusters (preserves
  # backward compatibility with single-replica deployments).
  min: 3
  max: 10
  # Toggle the D18 PrometheusRule for replica-count alerting.
  alerts:
    enabled: true

# PodAntiAffinity to spread replicas across nodes.
podAntiAffinity:
  enabled: true
  # `preferredDuringSchedulingIgnoredDuringExecution` allows
  # scheduling to succeed even on small clusters (vs strict required).
  type: preferredDuringSchedulingIgnoredDuringExecution
  weight: 100

# topologySpreadConstraints across availability zones.
topologySpreadConstraints:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
  topologyKey: topology.kubernetes.io/zone

podDisruptionBudget:
  enabled: true
  minAvailable: 2

hpa:
  enabled: true
  cpuTarget: 70
  scaleUpStabilizationSeconds: 30
  scaleDownStabilizationSeconds: 300

# **Audit fix D18-A11** — the duplicates
# (``service``, ``terminationGracePeriodSeconds``, ``resources``)
# previously placed here have been folded into the canonical
# top-level blocks earlier in this file. Only the genuinely-new
# D18 keys remain below : ``shutdown.*`` (3-phase budgets) and
# ``leaderElection.*`` (K8s coordination lease config).

# Graceful shutdown sequencing (D18 § 11). The 3-phase budget
# (drain_rpc + audit_flush + pg_close) MUST stay strictly below
# `terminationGracePeriodSeconds` so the kubelet has at least 1 s
# of slack to send SIGKILL after every phase finishes.
shutdown:
  drainMs: 10000           # phase 1 — drain RPC
  auditFlushMs: 10000      # phase 2 — flush AuditEmitter
  pgCloseMs: 30000         # phase 3 — close pg pool + flush OTel

leaderElection:
  enabled: true
  leaseDurationSeconds: 15
  renewDeadlineSeconds: 10
  leaseName: "efe-leader"

# =====================================================================
# Sprint D28 (Φ-D) — GPU runtime
# Cf. docs/EFE_KERNELS_ARCHITECTURE.md § 19.
# =====================================================================
#
# Default OFF — single-tenant CPU clusters keep working as before.
# Flip to true on a node pool that exposes `nvidia.com/gpu` via the
# NVIDIA device plugin.
#
# **Audit fix K-A3** — pre-fix the chart had no surface for the GPU
# substrate ; setting `EFE_RUNTIME_GPU_ENABLED=true` in extraEnv had
# no effect because the deployment.yaml did not request a GPU
# resource limit. The block below adds both the env-var path
# (consumed by configmap.yaml) AND the hardware request path
# (consumed by deployment.yaml).
runtime:
  # Master switch.
  gpuEnabled: false

  # Device ordinal (0-based).
  gpuDeviceOrdinal: 0

  # VRAM high-water mark percent (1-95). Default 80.
  gpuMemoryHwmPercent: 80

  # Stream pool size. Default 4.
  gpuStreams: 4

  # Comma-separated ordinals for multi-GPU sharding (D30). Empty =
  # single-GPU.
  gpuShardOrdinals: ""

  # Fallback policy when a GPU op fails mid-request : `strict` (default)
  # or `cpu_on_error`.
  gpuFallbackPolicy: "strict"

  # Debug-only NaN/Inf scan after each kernel. Off in prod (perf cost).
  gpuCheckFinite: false

  # Hardware request : when `gpuEnabled=true`, the deployment
  # template adds `resources.limits."nvidia.com/gpu": gpuCount` to
  # each pod, scheduling them only on GPU-enabled nodes.
  gpuCount: 1

  # NodeSelector / tolerations / runtimeClassName for GPU pods.
  # The defaults match the NVIDIA device plugin convention. Override
  # if your cluster uses a different label/taint scheme.
  nodeSelector:
    nvidia.com/gpu.present: "true"

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  # Some clusters require `runtimeClassName: nvidia` to inject the
  # NVIDIA container runtime. Leave empty when the default runtime
  # already loads `libcuda.so` (e.g. EKS GPU AMIs).
  runtimeClassName: ""
