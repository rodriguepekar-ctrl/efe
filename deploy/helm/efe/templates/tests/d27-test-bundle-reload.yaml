{{- /*
Sprint D27 (Φ-C) — helm test Pod : verify bundle admin RPC is reachable.

Run via : helm test <release> -n <namespace>

This Pod hits the admin endpoint `/admin/bundle-info` to confirm
the efe-server pods are responsive AND the bundle hash matches
the expected value from `.Values.bundle.manifestSha256`.

Pin tested by `test_m12_helm_extension_test_pod_bundle_reload_present`.
*/}}
{{- if and .Values.bundleReload.enabled (default false .Values.tests.bundleReload.enabled) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "efe.fullname" . }}-test-bundle-reload
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe.labels" . | nindent 4 }}
    efe.io/sprint: D27
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: default
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - /bin/sh
        - -c
        - |
          set -euo pipefail
          echo "[$(date -u +%FT%TZ)] D27 bundle admin RPC test"
          ADMIN_URL="http://{{ .Values.bundleReload.adminEndpoint.service | default (include "efe.fullname" .) }}:{{ .Values.bundleReload.adminEndpoint.port | default 8080 }}{{ .Values.bundleReload.adminEndpoint.bundleInfoPath | default "/admin/bundle-info" }}"
          echo "Querying ${ADMIN_URL}..."

          BODY=$(wget --timeout=10 -qO- "${ADMIN_URL}" 2>/dev/null || echo "")
          if [ -z "${BODY}" ]; then
            echo "❌ FAIL : admin endpoint not reachable"
            exit 1
          fi
          echo "✅ admin endpoint reachable"
          echo "Response : ${BODY}"

          # Parse manifestSha256 (simple grep-based — no jq in busybox).
          CURRENT=$(echo "${BODY}" | sed -n 's/.*"manifestSha256":"\([^"]*\)".*/\1/p')
          EXPECTED='{{ .Values.bundle.manifestSha256 | default "" }}'

          if [ -z "${CURRENT}" ]; then
            echo "⚠ admin response missing manifestSha256 field"
            exit 0  # not a hard fail (bundle may not yet be loaded)
          fi

          if [ -z "${EXPECTED}" ]; then
            echo "✅ Current bundle hash : ${CURRENT} (no expected pin in values)"
            exit 0
          fi

          if [ "${CURRENT}" = "${EXPECTED}" ]; then
            echo "✅ Bundle hash matches expected : ${CURRENT}"
            exit 0
          else
            echo "❌ FAIL : bundle hash mismatch"
            echo "  current  = ${CURRENT}"
            echo "  expected = ${EXPECTED}"
            exit 1
          fi
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
{{- end }}
