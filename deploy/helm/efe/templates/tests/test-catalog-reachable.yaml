{{/*
Sprint D12-bis — `helm test` catalog reachability smoke.

Verifies that the `efe.v1.catalog.CatalogService` is attached to
the running pod's gRPC surface. PASS ⇔ the per-service health
probe returns SERVING for the catalog service (set by
``runtime.rs::set_serving::<CatalogServiceServer<...>>()``).

This catches the "binary built without catalog wired" failure
mode — D12-bis pre-fix the catalog protos compiled but no handler
was attached to the tonic router, and there was no boot-time
indicator. With this test, ``helm install`` followed by
``helm test`` will block any release that ships without catalog.

Disabling: opt-out via ``tests.catalogReachable.enabled = false``
when running on a cluster that intentionally builds the binary
without ``catalog.proto`` (none of the supported deploy paths
do this — kept as a safety valve only).

Cleanup: ``hook-delete-policy: hook-succeeded,hook-failed`` ensures
the pod is GC'd regardless of outcome.
*/}}
{{- if .Values.tests.catalogReachable.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "efe.fullname" . }}-test-catalog-reachable
  labels: {{- include "efe.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "efe.serviceAccountName" . }}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: catalog-health
      image: {{ include "efe.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command:
        - /usr/local/bin/grpc_health_probe
        # The per-service flag is the canonical way to probe a
        # specific gRPC service's health entry. The exact name
        # MUST match what the server sets via
        # `set_serving::<CatalogServiceServer<...>>` — the
        # tonic-health crate uses the fully-qualified protobuf
        # service name, i.e. `efe.v1.catalog.CatalogService`.
        - -addr={{ include "efe.fullname" . }}:{{ .Values.service.grpcPort }}
        - -service=efe.v1.catalog.CatalogService
        - -connect-timeout=5s
        - -rpc-timeout=2s
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
{{- end }}
