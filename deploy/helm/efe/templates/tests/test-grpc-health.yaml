{{/*
Sprint D9.A6 amendment — `helm test` grpc-health smoke.

Runs the bundled `grpc_health_probe` against the freshly-installed
service. PASS ⇔ the gRPC health endpoint returns SERVING within
the timeout. This catches the "container starts but never binds"
failure mode (e.g. config typo, port collision).

Invocation::

    helm test efe -n efe

Notes:
  * The Pod uses the same image as the server so we know the
    grpc_health_probe binary is present at /usr/local/bin/.
  * `helm.sh/hook: test` makes Helm collect this as a test pod.
  * `helm.sh/hook-delete-policy: hook-succeeded,hook-failed` cleans
    up the test pod regardless of outcome — leaving it Pending
    forever is the most common helm-test footgun.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "efe.fullname" . }}-test-grpc-health
  labels: {{- include "efe.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "efe.serviceAccountName" . }}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: grpc-health
      image: {{ include "efe.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command:
        - /usr/local/bin/grpc_health_probe
        - -addr={{ include "efe.fullname" . }}:{{ .Values.service.grpcPort }}
        - -connect-timeout=5s
        - -rpc-timeout=2s
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
