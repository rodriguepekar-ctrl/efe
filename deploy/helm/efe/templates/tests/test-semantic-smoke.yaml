{{/*
Sprint D9.A6 amendment — `helm test` SEMANTIC smoke.

Address HAZOP failure mode #4 from the deep-analysis supplement:
the gRPC service answers 200 OK but with the WRONG label (cache
stale, model corrupt). The grpc-health probe (test-grpc-health.yaml)
catches "service unreachable" but NOT "service answers gibberish".

This pod runs three known-good classify queries and checks the
returned labels match the expected intents. Failure ⇒ the chart
test fails.

Opt-in via ``tests.semanticSmoke.enabled`` — disabled by default
because it requires the test image to ship a Python client +
fixtures (ghcr.io/efe-project/efe-bench published alongside
efe-server in D9.6). Once that image is published, flip the
default to ``true``.

Invocation::

    helm test efe -n efe --filter name=efe-test-semantic
*/}}
{{- if .Values.tests.semanticSmoke.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "efe.fullname" . }}-test-semantic
  labels: {{- include "efe.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "efe.serviceAccountName" . }}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: semantic-smoke
      image: {{ .Values.tests.semanticSmoke.image | default "ghcr.io/efe-project/efe-bench:0.1.9" }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false  # python tempdir
        capabilities:
          drop: ["ALL"]
      env:
        - name: EFE_GRPC_HOST
          value: "{{ include "efe.fullname" . }}:{{ .Values.service.grpcPort }}"
        - name: EFE_TENANT
          value: {{ include "efe.tenantId" . | quote }}
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import sys
          # Three known-good cases — the same fixtures used by the
          # ghz harness and `examples/hybrid_classification.py`.
          cases = [
              # (text,                                        expected_intent_prefix)
              ("Ma carte a été débitée sans mon consentement.", "fraud"),
              ("Where can I see previous invoices?",            "question"),
              ("L'application plante quand j'ouvre le menu.",   "bug"),
          ]
          # Use the high-level python client published by the SDK.
          # NB: this requires the test image to bundle the SDK ;
          # ghcr.io/efe-project/efe-bench:0.1.9 does (see D9.6
          # release.yml). For an early ad-hoc smoke, the operator
          # can disable this test (`tests.semanticSmoke.enabled=false`).
          from efe_tool.integrations.hybrid_decoder import HybridClassifier
          from efe_tool.client import EfeClient
          host = os.environ["EFE_GRPC_HOST"]
          tenant = os.environ.get("EFE_TENANT", "default")
          cli = EfeClient(host=host, tenant=tenant, insecure=True)
          decoder = HybridClassifier(client=cli)
          failures = []
          for text, expected in cases:
              result = decoder.predict(text)
              label = (result.label or "").lower()
              if expected not in label:
                  failures.append((text, expected, label))
                  print(f"FAIL: {text!r} expected ~{expected}, got {label}")
              else:
                  print(f"OK:   {text!r} -> {label}")
          if failures:
              sys.exit(1)
          print("semantic smoke: all 3 cases match expected intents")
          PY
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
{{- end }}
