{{- /*
  Sprint **D40 (Φ-F)** — Quarterly DR drill CronJob.

  Post-audit pass 1 — defects M7-D40-A6 + M7-D40-A17 + M7-D40-A24 fixed
  (cf. CHANGELOG audit fixes section).

  EXTENDS the D17 weekly drill (`d17-dr-drill-cronjob.yaml`,
  schedule "0 3 * * 0", 5 verifiers) with :

    * **Schedule trimestriel** : 1st of each quarter (Jan/Apr/Jul/Oct)
      at 04:00 UTC.
    * **Hello-World runbook** business workflow end-to-end (D40 §10).
    * **Compliance evidence pack** (Object Lock COMPLIANCE, 7-yr).
    * **RTO target relaxed** to 45 min (overhead bootstrap-from-zero).
    * **4 compliance frameworks** asserted via metadata labels :
      SOC 2 CC9.1 / ISO 27001 A.17.1.3 / NIS2 Art. 21 / RGPD Art. 32.

  Cf. `docs/EFE_BACKUP_EXTENSION_ARCHITECTURE.md` § 9.3.
  Cf. `docs/compliance/dr_drill_quarterly_evidence.md`.
*/}}
{{- if and .Values.backup.enabled .Values.backup.drillQuarterly.enabled }}
{{- /*
  Audit fix M7-D40-A6 (CRIT) — `complianceEvidence.enabled` gates BOTH
  the PVC creation AND the volume mount. Pre-audit a config with
  `complianceEvidence.enabled=false` rendered the CronJob with a
  volumeMount referencing a PVC that doesn't exist → CrashLoopBackOff.
  Post-audit the volumeMount + volume are conditionally rendered.
*/}}
{{- $evidenceEnabled := .Values.backup.drillQuarterly.complianceEvidence.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "efe.fullname" . }}-dr-drill-quarterly
  labels: {{- include "efe.labels" . | nindent 4 }}
    app.kubernetes.io/component: dr-drill-quarterly
    compliance.efe.ai/framework: "soc2,iso27001,nis2,rgpd"
    compliance.efe.ai/cadence: quarterly
  annotations:
    compliance.efe.ai/soc2-criterion: "CC9.1"
    compliance.efe.ai/iso27001-control: "A.17.1.3"
    compliance.efe.ai/nis2-article: "Art21.2(c)"
    compliance.efe.ai/rgpd-article: "Art32.1(c,d)"
    compliance.efe.ai/evidence-bucket: {{ .Values.backup.drillQuarterly.complianceEvidence.bucket | quote }}
    compliance.efe.ai/retention-years: {{ .Values.backup.drillQuarterly.complianceEvidence.retentionYears | quote }}
spec:
  schedule: {{ .Values.backup.drillQuarterly.schedule | quote }}
  concurrencyPolicy: Forbid
  # 8 quarters of history ≈ 2 years on-cluster (long-term archive
  # lives in S3 Object Lock — see complianceEvidence.bucket).
  successfulJobsHistoryLimit: 8
  failedJobsHistoryLimit: 8
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # Hard timeout 60 min — beyond that the drill is considered
      # hung ; activeDeadlineSeconds aborts it cleanly so the next
      # quarter can run.
      activeDeadlineSeconds: {{ default 3600 .Values.backup.drillQuarterly.activeDeadlineSeconds }}
      backoffLimit: 0   # drills don't retry — failure is signal (B-5)
      template:
        metadata:
          labels: {{- include "efe.labels" . | nindent 12 }}
            app.kubernetes.io/component: dr-drill-quarterly
            compliance.efe.ai/framework: "soc2,iso27001,nis2,rgpd"
        spec:
          restartPolicy: Never
          # Reuse the D17 backup ServiceAccount — it already has the
          # RBAC needed to talk to the postgres + vault + S3 backends.
          serviceAccountName: {{ include "efe.fullname" . }}-backup
          containers:
            - name: efe-dr-drill-quarterly
              image: {{ default .Values.image.repository .Values.backup.drillQuarterly.image }}:{{ default .Values.image.tag .Values.backup.drillQuarterly.imageTag }}
              imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
              command:
                - "/usr/local/bin/run_quarterly_drill.sh"
              args:
                - "--cluster-name=efe-drill-q-{{ .Release.Name }}"
                # **Audit fix M7-D40-A17 (CRIT)** — backup-id is
                # auto-resolved at runtime via `efe-backup list`
                # (the env var below opts into auto-resolution).
                - "--target-env=drill"
                - "--namespace={{ .Release.Namespace }}"
                {{- if $evidenceEnabled }}
                - "--evidence-dir=/var/lib/efe/compliance-evidence"
                {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "efe.fullname" . }}-config
              env:
                # === D17 baseline env ===
                - name: EFE_BACKUP_RTO_TARGET_S
                  value: {{ default 2700 .Values.backup.drillQuarterly.rtoTargetSeconds | quote }}
                # === D40 backup auto-resolve (Audit fix M7-D40-A17) ===
                - name: EFE_BACKUP_AUTO_RESOLVE
                  value: "true"
                - name: EFE_DRILL_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: EFE_DRILL_HELM_TIMEOUT
                  value: {{ default "5m" .Values.backup.drillQuarterly.helmTimeout | quote }}
                # **Audit fix M7-D40-A18 (HIGH)** — devSecretValues
                # is `false` in production. The base release secrets
                # come from SealedSecrets / external-secrets, not
                # from the chart's dev defaults.
                - name: EFE_DRILL_DEV_SECRET_VALUES
                  value: {{ default false .Values.backup.drillQuarterly.devSecretValues | quote }}
                # === D40 Hello-World env ===
                - name: EFE_HELLOWORLD_ENABLED
                  value: {{ .Values.backup.drillQuarterly.helloWorld.enabled | quote }}
                - name: EFE_HELLOWORLD_TENANT_ID
                  value: {{ .Values.backup.drillQuarterly.helloWorld.tenantId | quote }}
                - name: EFE_HELLOWORLD_CATALOG_NAME
                  value: {{ .Values.backup.drillQuarterly.helloWorld.catalogName | quote }}
                - name: EFE_HELLOWORLD_CLASS_NAME
                  value: {{ .Values.backup.drillQuarterly.helloWorld.className | quote }}
                - name: EFE_HELLOWORLD_SENTENCE
                  value: {{ .Values.backup.drillQuarterly.helloWorld.sentence | quote }}
                - name: EFE_HELLOWORLD_MAX_LATENCY_MS
                  value: {{ .Values.backup.drillQuarterly.helloWorld.maxLatencyMs | quote }}
                - name: EFE_HELLOWORLD_FALLBACK_MOCK
                  value: {{ .Values.backup.drillQuarterly.helloWorld.fallbackMockBundle | quote }}
                # gRPC endpoint for the Hello-World workflow's grpcurl calls.
                - name: EFE_GRPC_ENDPOINT
                  value: {{ default "localhost:50051" .Values.backup.drillQuarterly.helloWorld.grpcEndpoint | quote }}
                # === D40 compliance evidence env ===
                - name: EFE_COMPLIANCE_EVIDENCE_BUCKET
                  value: {{ .Values.backup.drillQuarterly.complianceEvidence.bucket | quote }}
                - name: EFE_COMPLIANCE_EVIDENCE_RETENTION_YEARS
                  value: {{ .Values.backup.drillQuarterly.complianceEvidence.retentionYears | quote }}
                - name: EFE_ATTESTATION_KEY_ID
                  value: {{ .Values.backup.drillQuarterly.complianceEvidence.attestationKeyId | quote }}
                # Path to the Ed25519 private key for outcome attestation.
                # Populated from a SealedSecret / external-secret in prod ;
                # in dev / kind, the Helm chart leaves it unset (the script
                # degrades gracefully — outcome still emitted unsigned).
                - name: EFE_ATTESTATION_PRIVKEY_PATH
                  value: "/etc/efe/attestation/privkey.bin"
              resources:
                requests:
                  # Heavier than the D17 weekly drill : kind-in-pod +
                  # MinIO + cnpg need real compute.
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "8"
                  memory: 16Gi
              volumeMounts:
                {{- /*
                  Audit fix M7-D40-A6 — only mount the evidence PVC
                  when complianceEvidence.enabled. Otherwise skip the
                  mount + the script defaults to a relative
                  `./.ci-evidence/...` directory which is ephemeral.
                */}}
                {{- if $evidenceEnabled }}
                - name: compliance-evidence
                  mountPath: /var/lib/efe/compliance-evidence
                {{- end }}
                # Docker-in-Docker socket — kind-in-pod requires the
                # Docker socket from the host to spin nested containers.
                - name: dind
                  mountPath: /var/run/docker.sock
                # Attestation private key (mounted from SealedSecret).
                - name: attestation-key
                  mountPath: /etc/efe/attestation
                  readOnly: true
          volumes:
            {{- if $evidenceEnabled }}
            - name: compliance-evidence
              persistentVolumeClaim:
                claimName: {{ include "efe.fullname" . }}-compliance-evidence
            {{- end }}
            - name: dind
              hostPath:
                path: /var/run/docker.sock
                type: Socket
            - name: attestation-key
              secret:
                secretName: {{ include "efe.fullname" . }}-attestation-key
                optional: true   # graceful degradation in dev (B-3 caveat)
{{- if $evidenceEnabled }}
---
# Companion PVC for compliance evidence persistence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "efe.fullname" . }}-compliance-evidence
  labels: {{- include "efe.labels" . | nindent 4 }}
    app.kubernetes.io/component: dr-drill-quarterly
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "20Gi" .Values.backup.drillQuarterly.complianceEvidence.pvcSize | quote }}
  {{- with .Values.backup.drillQuarterly.complianceEvidence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
