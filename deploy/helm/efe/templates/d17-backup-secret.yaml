{{- /*
  Sprint D17 — Backup + DR : Secret references for backup credentials.

  This template renders only when `backup.enabled = true`. The
  actual secret values are NOT in the chart — they are managed
  by SealedSecrets / Vault / external secrets controllers and
  referenced by name only. The CronJob templates mount these
  secrets read-only into the backup pods.

  Cf. `docs/bench/d17_backup_dr_architecture.md` § 11 (encryption)
  + § 21.
*/}}
{{- if .Values.backup.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "efe.fullname" . }}-backup-config
  labels: {{- include "efe.labels" . | nindent 4 }}
  annotations:
    # Tag so SealedSecrets / external-secrets controllers can
    # reconcile this object without trampling the values it owns.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  # Operator-injected values via existingSecret references in
  # values.yaml ; this stub is here so dev clusters using
  # `--set backup.devSecretValues=true` get a working default.
  {{- if .Values.backup.devSecretValues }}
  pgbackrest_cipher_pass: "dev-only-passphrase-NOT-for-production"
  vault_token: "hvs.dev-only-token-NOT-for-production"
  {{- end }}
{{- end }}
