{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "efe.fullname" . }}
  labels:
    {{- include "efe.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "efe.selectorLabels" . | nindent 6 }}
  {{- with .Values.serviceMonitor.namespaceSelector }}
  namespaceSelector: {{- toYaml . | nindent 4 }}
  {{- end }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        {{- if .Values.tenant.namespace.isolated }}
        # Sprint D11.2 — stamp the `tenant` label from the
        # namespace's `tenant.efe.ai/owner` label (preferred) or,
        # fallback, by extracting from a `tenant-<id>` namespace
        # naming convention. The two rules together produce a
        # consistent `tenant` label even if the operator forgot to
        # set the namespace label.
        # Cf. docs/bench/d11_per_tenant_isolation_architecture.md §6.5.
        - sourceLabels: [__meta_kubernetes_namespace_label_tenant_efe_ai_owner]
          regex: "(.+)"
          replacement: "$1"
          targetLabel: tenant
        - sourceLabels: [__meta_kubernetes_namespace]
          regex: "tenant-(.+)"
          replacement: "$1"
          targetLabel: tenant
        {{- end }}
      {{- if .Values.tenant.allowlist }}
      # Sprint D11.2 — defensive cardinality cap. Drop metrics whose
      # ``tenant`` label isn't in the operator-managed allowlist.
      # Catches cardinality-bomb attacks (HAZOP vector #12). With an
      # empty allowlist (default), no filtering happens — Tier 1
      # trusts the JWT issuer to limit the tenant_id values it mints.
      metricRelabelings:
        - sourceLabels: [tenant]
          regex: '({{ join "|" .Values.tenant.allowlist }})'
          action: keep
      {{- end }}
{{- end -}}
