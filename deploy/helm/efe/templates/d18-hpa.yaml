{{- /*
  Sprint D18 — HorizontalPodAutoscaler for efe-server replicas.

  Auto-scales between `replicas.min` and `replicas.max` based on
  CPU utilisation. v0.1.19 ships CPU-based autoscaling ; the
  custom-metric (p95 latency) auto-scaling is deferred to D18-bis
  once the prometheus-adapter is wired into the cluster.

  Cf. `docs/bench/d18_multi_replica_bench_d12_architecture.md` § 12.2.
*/}}
{{- if and (default true .Values.hpa.enabled) (gt (int .Values.replicas.max) (int .Values.replicas.min)) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "efe.fullname" . }}-hpa
  labels: {{- include "efe.labels" . | nindent 4 }}
    app.kubernetes.io/component: multi-replica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "efe.fullname" . }}
  minReplicas: {{ .Values.replicas.min }}
  maxReplicas: {{ .Values.replicas.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ default 70 .Values.hpa.cpuTarget }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ default 30 .Values.hpa.scaleUpStabilizationSeconds }}
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: {{ default 300 .Values.hpa.scaleDownStabilizationSeconds }}
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
{{- end }}
