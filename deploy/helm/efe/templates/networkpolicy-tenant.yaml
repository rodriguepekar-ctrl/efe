{{/*
Sprint D11.2 — Tier 2 NetworkPolicy: per-tenant ingress restriction.

Activated by ``tenant.namespace.networkPolicy.tenantIngress.enabled``.
Defense-in-depth ON TOP OF the JWT auth check: even if the JWT
layer were bypassed (compromised IDP, mis-issued token), kube-proxy
+ CNI deny ingress from any namespace not labelled as the tenant's
authorised consumer.

Allowed sources (default):
  1. Namespaces carrying the labels in
     ``allowFromNamespaceLabels`` (e.g.
     ``tenant.efe.ai/owner: <tenant-id>``).
  2. The monitoring namespace (Prometheus scrape on the metrics
     port). Hard-coded to the standard
     ``kubernetes.io/metadata.name: monitoring`` label that
     prometheus-operator installs by default. Override via
     ``allowFromMonitoringNamespaces``.

Architecture: docs/bench/d11_per_tenant_isolation_architecture.md §6.4.

NB: this template is INDEPENDENT from ``templates/networkpolicy.yaml``
(the existing chart's egress NetworkPolicy from the M11/M12 era).
The two coexist — both are activated independently.
*/}}
{{- if and
    .Values.tenant.namespace.isolated
    .Values.tenant.namespace.networkPolicy.tenantIngress.enabled
-}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "efe.fullname" . }}-tenant-ingress
  labels: {{- include "efe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "efe.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- /*
           Tenant-owned consumer namespaces.
           Each label/value pair is matched as AND ;
           multiple from-blocks are OR.
        */ -}}
        - namespaceSelector:
            matchLabels:
              {{- range $key, $val := .Values.tenant.namespace.networkPolicy.tenantIngress.allowFromNamespaceLabels }}
              {{ $key }}: {{ $val | quote }}
              {{- end }}
        {{- /*
           Monitoring namespace(s) — Prometheus scrape.
        */ -}}
        {{- range .Values.tenant.namespace.networkPolicy.tenantIngress.allowFromMonitoringNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- /* Optional extra ingress sources (operator-supplied). */}}
        {{- with .Values.tenant.namespace.networkPolicy.tenantIngress.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: grpc
          protocol: TCP
        - port: metrics
          protocol: TCP
{{- end -}}
