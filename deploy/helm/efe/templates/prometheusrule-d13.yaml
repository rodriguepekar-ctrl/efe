{{- /*
  Sprint D13 — PrometheusRule resource bundling :
    * 7 recording rules (efe:* namespace)
    * 2 downsample groups (:1h, :1d)
    * 10 alerts (D13Obs* namespace)

  Opt-in :
    * recording rules : ``observability.recordingRules.enabled``
    * alerts          : ``observability.alerts.enabled``

  Both flags can be combined or used independently. The runbook_url
  annotations are mandatory and pinned by
  ``scripts/tests/test_d13_alert_runbook_links.py``.
*/ -}}
{{- if or .Values.observability.recordingRules.enabled .Values.observability.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "efe.fullname" . }}-d13
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
{{- if .Values.observability.recordingRules.enabled }}
{{- $recordingFile := .Files.Get "d13_files/prometheus/recording.yaml" }}
{{- $recording := $recordingFile | fromYaml }}
{{- range $recording.groups }}
    - name: {{ .name }}
      interval: {{ .interval | default $.Values.observability.recordingRules.interval }}
      rules:
        {{- toYaml .rules | nindent 8 }}
{{- end }}
{{- end }}
{{- if .Values.observability.alerts.enabled }}
{{- $alertsFile := .Files.Get "d13_files/prometheus/alerts.yaml" }}
{{- $alerts := $alertsFile | fromYaml }}
{{- range $alerts.groups }}
    - name: {{ .name }}
      rules:
        {{- range .rules }}
        - alert: {{ .alert }}
          expr: |
            {{- .expr | nindent 12 }}
          for: {{ .for }}
          labels:
            {{- toYaml .labels | nindent 12 }}
          annotations:
            {{- toYaml .annotations | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
