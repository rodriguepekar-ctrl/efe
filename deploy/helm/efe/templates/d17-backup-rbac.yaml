{{- /*
  Sprint D17 — Backup + DR : ServiceAccount + minimal RBAC for the
  backup CronJob.

  The backup pods need :
    * read-only access to the secrets containing the cipher pass
      and the Vault token ;
    * read-only watch on the backup-history ConfigMap (for distributed
      retention pruning, future use) ;
    * pod-exec on the drill namespace for the DR drill.

  Cf. `docs/bench/d17_backup_dr_architecture.md` § 21.2.
*/}}
{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "efe.fullname" . }}-backup
  labels: {{- include "efe.labels" . | nindent 4 }}
  {{- with .Values.backup.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "efe.fullname" . }}-backup
  labels: {{- include "efe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - {{ include "efe.fullname" . }}-backup-config
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "efe.fullname" . }}-backup
  labels: {{- include "efe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "efe.fullname" . }}-backup
subjects:
  - kind: ServiceAccount
    name: {{ include "efe.fullname" . }}-backup
{{- end }}
