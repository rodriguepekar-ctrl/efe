apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe.fullname" . }}-config
  labels: {{- include "efe.labels" . | nindent 4 }}
data:
  # --- Core server ---
  EFE_LISTEN_ADDR: {{ .Values.config.listenAddr | quote }}
  EFE_METRICS_ADDR: {{ .Values.config.metricsAddr | quote }}
  EFE_REQUEST_TIMEOUT_MS: {{ .Values.config.requestTimeoutMs | quote }}
  EFE_MAX_CONCURRENT_STREAMS: {{ .Values.config.maxConcurrentStreams | quote }}
  EFE_ENABLE_ADMIN: {{ .Values.config.enableAdmin | quote }}
  RUST_LOG: {{ .Values.config.rustLog | quote }}
  EFE_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  EFE_AUDIT_LOG_PATH: {{ .Values.config.auditLogPath | quote }}

  # --- Auth ---
  EFE_AUTH_ENABLED: {{ .Values.config.auth.enabled | quote }}
  EFE_JWT_AUDIENCE: {{ .Values.config.auth.jwtAudience | quote }}
  {{- if .Values.config.auth.jwtIssuer }}
  EFE_JWT_ISSUER: {{ .Values.config.auth.jwtIssuer | quote }}
  {{- end }}
  EFE_AUTH_ALLOW_INSECURE_DEV: {{ .Values.config.auth.allowInsecureDev | quote }}
  EFE_JWT_SECRETS_FILE: {{ .Values.config.auth.secretsFile | quote }}

  # --- Sprint D15 — OIDC tenant onboarding + IdP integration ---
  # When `oidc.enabled = true`, the runtime ignores
  # `EFE_JWT_SECRETS_FILE` and validates JWTs through the
  # multi-issuer OIDC path (RS256/ES256 + JWKS pull cache).
  # Cf. `docs/bench/d15_onboarding_idp_architecture.md`.
  EFE_OIDC_ENABLED: {{ .Values.config.auth.oidc.enabled | quote }}
  EFE_OIDC_ISSUERS_FILE: {{ .Values.config.auth.oidc.issuersFile | quote }}
  EFE_OIDC_JWKS_TTL_S: {{ .Values.config.auth.oidc.jwksTtlS | quote }}
  EFE_OIDC_JWKS_FETCH_TIMEOUT_MS: {{ .Values.config.auth.oidc.jwksFetchTimeoutMs | quote }}
  EFE_OIDC_JWKS_RETRY_MAX: {{ .Values.config.auth.oidc.jwksRetryMax | quote }}
  EFE_OIDC_JWKS_BACKOFF_MS: {{ .Values.config.auth.oidc.jwksBackoffMs | quote }}
  EFE_OIDC_GRACE_STALE_S: {{ .Values.config.auth.oidc.graceStaleS | quote }}

  # --- Sprint D16 — Embedder bundling ---
  # When `backend = bundle`, the runtime loads a verified bundle from
  # `EFE_BUNDLE_PATH` instead of fetching from HuggingFace Hub at
  # first encode. Cf. `docs/bench/d16_embedder_bundling_architecture.md`.
  EFE_EMBEDDER_BACKEND: {{ .Values.config.embedder.backend | quote }}
  EFE_BUNDLE_PATH: {{ .Values.config.embedder.bundle.path | quote }}
  EFE_BUNDLE_REQUIRE_SIGNATURE: {{ .Values.config.embedder.bundle.requireSignature | quote }}
  EFE_BUNDLE_TRUST_STORE: {{ .Values.config.embedder.bundle.trustStorePath | quote }}
  EFE_BUNDLE_REQUIRE_SBOM: {{ .Values.config.embedder.bundle.requireSbom | quote }}
  EFE_BUNDLE_ACK_NONREDIST: {{ .Values.config.embedder.bundle.acknowledgeNonRedistributable | quote }}
  EFE_BUNDLE_LOAD_TIMEOUT_S: {{ .Values.config.embedder.bundle.loadTimeoutS | quote }}
  EFE_EMBEDDER_ENCODE_TIMEOUT_MS: {{ .Values.config.embedder.bundle.encodeTimeoutMs | quote }}

  # --- Rate-limit ---
  EFE_RATELIMIT_ENABLED: {{ .Values.config.rateLimit.enabled | quote }}
  EFE_RATELIMIT_CAPACITY: {{ .Values.config.rateLimit.defaultCapacity | quote }}
  EFE_RATELIMIT_REFILL: {{ .Values.config.rateLimit.defaultRefill | quote }}
  EFE_RATELIMIT_ANON_CAP: {{ .Values.config.rateLimit.anonymousCapacity | quote }}
  EFE_RATELIMIT_ANON_REFILL: {{ .Values.config.rateLimit.anonymousRefill | quote }}

  # --- Idempotency ---
  EFE_IDEMPOTENCY_ENABLED: {{ .Values.config.idempotency.enabled | quote }}
  EFE_IDEMPOTENCY_CAPACITY: {{ .Values.config.idempotency.cacheCapacity | quote }}
  EFE_IDEMPOTENCY_TTL_MS: {{ .Values.config.idempotency.ttlMs | quote }}

  # --- Catalog (Sprint D12-bis) ---
  # `backend=memory` is the default ; `postgres` (D14) persists state.
  EFE_CATALOG_BACKEND: {{ .Values.config.catalog.backend | quote }}
  EFE_CATALOG_MAX_NAMES_PER_TENANT: {{ .Values.config.catalog.maxNamesPerTenant | quote }}
  EFE_CATALOG_MAX_VERSIONS_PER_NAME: {{ .Values.config.catalog.maxVersionsPerName | quote }}
  EFE_CATALOG_MAX_CLASSES_PER_CATALOG: {{ .Values.config.catalog.maxClassesPerCatalog | quote }}
  EFE_CATALOG_MAX_SENTENCES_PER_CLASS: {{ .Values.config.catalog.maxSentencesPerClass | quote }}

  # --- Sprint D14 — Postgres backend ---
  # Rendered only when `backend: "postgres"`. The `EFE_PG_PASSWORD`
  # env var is NEVER rendered into the ConfigMap (which is plain
  # text in etcd) ; the deployment.yaml looks up the password from a
  # Secret referenced by `existingSecretName` / `externalSecretName`.
  {{- if eq .Values.config.catalog.backend "postgres" }}
  EFE_PG_HOST: {{ .Values.config.catalog.postgres.host | quote }}
  EFE_PG_PORT: {{ .Values.config.catalog.postgres.port | quote }}
  EFE_PG_DATABASE: {{ .Values.config.catalog.postgres.database | quote }}
  EFE_PG_USER: {{ .Values.config.catalog.postgres.user | quote }}
  EFE_PG_SSL_MODE: {{ .Values.config.catalog.postgres.sslMode | quote }}
  EFE_PG_POOL_MAX_CONNECTIONS: {{ .Values.config.catalog.postgres.poolMaxConnections | quote }}
  EFE_PG_POOL_MIN_CONNECTIONS: {{ .Values.config.catalog.postgres.poolMinConnections | quote }}
  EFE_PG_POOL_ACQUIRE_TIMEOUT_MS: {{ .Values.config.catalog.postgres.poolAcquireTimeoutMs | quote }}
  EFE_PG_POOL_MAX_LIFETIME_S: {{ .Values.config.catalog.postgres.poolMaxLifetimeS | quote }}
  EFE_PG_POOL_IDLE_TIMEOUT_S: {{ .Values.config.catalog.postgres.poolIdleTimeoutS | quote }}
  EFE_PG_POOL_TEST_BEFORE_ACQUIRE: {{ .Values.config.catalog.postgres.poolTestBeforeAcquire | quote }}
  {{- end }}

  # --- Sprint D14-bis — Audit signing (HMAC-chained tamper-evident log) ---
  # Active uniquement quand `audit.signing.enabled = true` AND
  # `backend = postgres`. La validate() côté code refuse au boot si
  # signing.enabled=true et backend != postgres.
  {{- if and (eq .Values.config.catalog.backend "postgres") .Values.config.catalog.audit.signing.enabled }}
  EFE_AUDIT_SIGNING_ENABLED: "true"
  EFE_AUDIT_HMAC_SECRETS_FILE: {{ .Values.config.catalog.audit.signing.keysFile | quote }}
  EFE_AUDIT_CHAIN_TO_TRACING: {{ .Values.config.catalog.audit.signing.chainToTracing | quote }}
  EFE_AUDIT_SELF_VERIFY_EVERY_S: {{ .Values.config.catalog.audit.signing.selfVerifyEverySeconds | quote }}
  {{- end }}

  # --- Sprint D13-bis — OpenTelemetry SDK real ---
  # When `otel.enabled = true`, the runtime exports spans via OTLP/gRPC
  # to the configured collector. Cf.
  # `docs/bench/d13bis_otel_sdk_real_architecture.md`.
  EFE_OTEL_ENABLED: {{ .Values.config.observability.otel.enabled | quote }}
  {{- if .Values.config.observability.otel.enabled }}
  EFE_OTEL_ENDPOINT: {{ .Values.config.observability.otel.endpoint | quote }}
  EFE_OTEL_SAMPLE_RATE: {{ .Values.config.observability.otel.sampleRate | quote }}
  EFE_OTEL_FORCE_SAMPLE_ON_ERROR: {{ .Values.config.observability.otel.forceSampleOnError | quote }}
  EFE_OTEL_SERVICE_NAME: {{ .Values.config.observability.otel.serviceName | quote }}
  {{- if .Values.config.observability.otel.serviceVersion }}
  EFE_OTEL_SERVICE_VERSION: {{ .Values.config.observability.otel.serviceVersion | quote }}
  {{- end }}
  {{- if .Values.config.observability.otel.deployEnv }}
  EFE_DEPLOY_ENV: {{ .Values.config.observability.otel.deployEnv | quote }}
  {{- end }}
  EFE_OBSERVABILITY_FAIL_ON_OTEL_ERROR: {{ .Values.config.observability.otel.failOnError | quote }}
  {{- end }}

  # --- Shutdown ---
  EFE_SHUTDOWN_DRAIN_MS: {{ .Values.config.shutdown.drainMs | quote }}
  EFE_SHUTDOWN_FORCE_ABORT_MS: {{ .Values.config.shutdown.forceAbortMs | quote }}

  # --- Sprint D17 — Backup + DR ---
  # When `backup.enabled = true`, the efe-backup CLI + CronJobs
  # consume these env vars. Cf.
  # `docs/bench/d17_backup_dr_architecture.md`.
  EFE_BACKUP_ENABLED: {{ .Values.backup.enabled | quote }}
  {{- if .Values.backup.enabled }}
  EFE_BACKUP_STORAGE_TYPE: {{ .Values.backup.storage.type | quote }}
  EFE_BACKUP_STORAGE_BUCKET: {{ .Values.backup.storage.bucket | quote }}
  EFE_BACKUP_STORAGE_REGION: {{ .Values.backup.storage.region | quote }}
  {{- if .Values.backup.storage.endpoint }}
  EFE_BACKUP_STORAGE_ENDPOINT: {{ .Values.backup.storage.endpoint | quote }}
  {{- end }}
  EFE_BACKUP_RPO_TARGET_S: {{ .Values.backup.alerts.rpoTargetSeconds | quote }}
  EFE_BACKUP_RTO_TARGET_S: {{ .Values.backup.alerts.rtoTargetSeconds | quote }}
  EFE_BACKUP_PG_STANZA: {{ .Values.backup.postgres.stanza | quote }}
  EFE_BACKUP_PG_CONFIG_PATH: {{ .Values.backup.postgres.configPath | quote }}
  EFE_BACKUP_VAULT_ADDR: {{ .Values.backup.vault.addr | quote }}
  EFE_BACKUP_BUNDLES_SOURCE: {{ .Values.backup.bundles.sourceBucket | quote }}
  EFE_BACKUP_BUNDLES_DEST: {{ .Values.backup.bundles.destBucket | quote }}
  EFE_BACKUP_CROSS_REGION: {{ .Values.backup.bundles.crossRegion | quote }}
  EFE_BACKUP_AUDIT_CHAIN_EVENTS: {{ .Values.backup.audit.chainEvents | quote }}
  EFE_BACKUP_SNAPSHOT_TIMEOUT_S: {{ .Values.backup.snapshotTimeoutSeconds | quote }}
  EFE_BACKUP_RESTORE_TIMEOUT_S: {{ .Values.backup.restoreTimeoutSeconds | quote }}
  {{- end }}

  # --- Sprint D18 — Multi-réplica ---
  # Cf. docs/bench/d18_multi_replica_bench_d12_architecture.md.
  #
  # **Audit fix D18-A12** — pre-fix the block also rendered
  # `EFE_SHUTDOWN_DRAIN_MS` from `Values.shutdown.drainMs`, which
  # silently shadowed the canonical render above (legacy
  # `Values.config.shutdown.drainMs` ; line 122). Renamed to
  # `EFE_SHUTDOWN_DRAIN_RPC_MS` so the D18 phase-1 timeout is
  # uniquely addressable while the legacy global drain stays
  # operator-tunable through `config.shutdown.drainMs`.
  EFE_REPLICAS_MIN: {{ .Values.replicas.min | quote }}
  EFE_REPLICAS_MAX: {{ .Values.replicas.max | quote }}
  EFE_LEADER_ELECTION_ENABLED: {{ default true .Values.leaderElection.enabled | quote }}
  EFE_LEADER_LEASE_NAME: {{ default "efe-leader" .Values.leaderElection.leaseName | quote }}
  EFE_LEADER_LEASE_DURATION_S: {{ default 15 .Values.leaderElection.leaseDurationSeconds | quote }}
  EFE_LEADER_RENEW_DEADLINE_S: {{ default 10 .Values.leaderElection.renewDeadlineSeconds | quote }}
  EFE_SHUTDOWN_DRAIN_RPC_MS: {{ default 10000 .Values.shutdown.drainMs | quote }}
  EFE_SHUTDOWN_AUDIT_FLUSH_MS: {{ default 10000 .Values.shutdown.auditFlushMs | quote }}
  EFE_SHUTDOWN_PG_CLOSE_MS: {{ default 30000 .Values.shutdown.pgCloseMs | quote }}

  # --- Sprint D28 (Φ-D) — GPU runtime ---
  # Cf. docs/EFE_KERNELS_ARCHITECTURE.md § 19.
  #
  # **Audit fix K-A3** — pre-fix the operator could set
  # `EFE_RUNTIME_GPU_*` in their environment but the Helm chart
  # rendered nothing in the ConfigMap, so the env never reached
  # the pod. The block below renders all 7 vars unconditionally
  # (defaults match `RuntimeConfig::default()`) so a single
  # `--set runtime.gpuEnabled=true` flips the runtime to GPU.
  #
  # NB : the chart also conditionally adds `nvidia.com/gpu`
  # resource limits in `templates/deployment.yaml` (cf. § K-A3
  # below) when `runtime.gpuEnabled=true`.
  EFE_RUNTIME_GPU_ENABLED: {{ default false .Values.runtime.gpuEnabled | quote }}
  EFE_RUNTIME_GPU_DEVICE_ORDINAL: {{ default 0 .Values.runtime.gpuDeviceOrdinal | quote }}
  EFE_RUNTIME_GPU_MEMORY_HWM_PERCENT: {{ default 80 .Values.runtime.gpuMemoryHwmPercent | quote }}
  EFE_RUNTIME_GPU_STREAMS: {{ default 4 .Values.runtime.gpuStreams | quote }}
  EFE_RUNTIME_GPU_SHARD_ORDINALS: {{ default "" .Values.runtime.gpuShardOrdinals | quote }}
  EFE_RUNTIME_GPU_FALLBACK_POLICY: {{ default "strict" .Values.runtime.gpuFallbackPolicy | quote }}
  EFE_RUNTIME_GPU_CHECK_FINITE: {{ default false .Values.runtime.gpuCheckFinite | quote }}
