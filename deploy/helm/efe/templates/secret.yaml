{{- if and .Values.secrets.inline.enabled (not .Values.secrets.existingSecretName) (not .Values.secrets.externalSecretName) -}}
# ⚠️  Inline secrets — DEV ONLY.
#
# This Secret is rendered by Helm from values.yaml and therefore ends
# up in your releases history in plain base64. Production deployments
# MUST set `secrets.externalSecretName` (external-secrets operator) or
# `secrets.existingSecretName` (self-managed Secret) and disable this
# path by leaving `secrets.inline.enabled: false`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "efe.fullname" . }}-secrets
  labels: {{- include "efe.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One key per line; matches the format consumed by `main.rs`.
  hs256: |
    {{- range .Values.secrets.inline.keys }}
    {{ . }}
    {{- end }}
{{- end -}}
