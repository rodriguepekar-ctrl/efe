{{- /*
  Sprint D17 — PodDisruptionBudget for the backup CronJob pods.

  Backup jobs are short-lived but during the run we don't want
  the cluster autoscaler / node drain to evict them mid-flight
  (would corrupt the pgBackRest in-flight base backup).

  This PDB ensures at most one backup pod is voluntarily disrupted
  at a time. Since CronJobs spawn at most one job per schedule and
  concurrencyPolicy=Forbid, this effectively says "don't evict
  the running backup".
*/}}
{{- if .Values.backup.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "efe.fullname" . }}-backup-pdb
  labels: {{- include "efe.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: backup
{{- end }}
