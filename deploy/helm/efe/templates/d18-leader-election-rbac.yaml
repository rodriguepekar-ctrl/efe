{{- /*
  Sprint D18 — RBAC for K8s Lease-based leader election.

  Cf. architecture § 8.3.

  The efe-server pods need permission to GET/CREATE/UPDATE the
  `Lease` object named `efe-leader` in their own namespace.
  Principle of least privilege : we restrict to a single named
  resource.

  Pre-requisite : the ServiceAccount under which efe-server runs
  is `{{ include "efe.serviceAccountName" . }}` (default :
  `<release>-efe`).
*/}}
{{- if default true .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "efe.fullname" . }}-leader-election
  labels: {{- include "efe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
    resourceNames:
      - {{ default "efe-leader" .Values.leaderElection.leaseName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "efe.fullname" . }}-leader-election
  labels: {{- include "efe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "efe.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ default (include "efe.fullname" .) .Values.serviceAccount.name }}
{{- end }}
