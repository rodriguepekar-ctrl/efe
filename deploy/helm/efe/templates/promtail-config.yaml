{{- /*
  Sprint D13 — promtail example ConfigMap (opt-in).

  When ``observability.loki.enabled = true`` AND
  ``observability.loki.promtailExample = true``, ship the example
  promtail config as a ConfigMap so the cluster operator can mount
  it on a sidecar / DaemonSet without copy-pasting from the docs.

  The user is expected to override the Loki endpoint and the
  client tenant_id at deployment time.
*/ -}}
{{- if and .Values.observability.loki.enabled .Values.observability.loki.promtailExample }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efe.fullname" . }}-promtail-example
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe.labels" . | nindent 4 }}
    efe.observability/component: promtail-example
data:
  promtail-config.yaml: |-
    {{- .Files.Get "d13_files/loki/promtail-config.example.yaml" | nindent 4 }}
{{- end }}
