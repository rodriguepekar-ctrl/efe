{{- /*
  Sprint D18 — PodDisruptionBudget for multi-replica efe-server.

  Pre-D18, no PDB existed → cluster autoscaler / node-drain could
  evict all replicas simultaneously → 100 % downtime.

  D18 ships `minAvailable: 2` (default), ensuring at least 2 of N
  replicas remain ready during a voluntary disruption (drain,
  upgrade, rebalancing).

  Cf. `docs/bench/d18_multi_replica_bench_d12_architecture.md` § 14.
*/}}
{{- if and (gt (int .Values.replicas.min) 1) (default true .Values.podDisruptionBudget.enabled) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "efe.fullname" . }}-pdb
  labels: {{- include "efe.labels" . | nindent 4 }}
    app.kubernetes.io/component: multi-replica
spec:
  minAvailable: {{ default 2 .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "efe.selectorLabels" . | nindent 6 }}
{{- end }}
