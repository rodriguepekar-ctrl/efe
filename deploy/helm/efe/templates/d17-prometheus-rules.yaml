{{- /*
  Sprint D17 — Backup + DR : Prometheus recording rules + alerts.

  Cf. `docs/bench/d17_backup_dr_architecture.md` § 19.3 + § 20.

  7 alerts (A-D17-1 to 7) covering :
    * stale backups (full > 24h or diff > 1h)
    * elevated failure rate
    * RPO violation
    * stale DR drill
    * RTO violation in last drill
    * missing cipher passphrase
    * S3 endpoint unreachable
*/}}
{{- if and .Values.backup.enabled .Values.backup.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "efe.fullname" . }}-d17-rules
  labels: {{- include "efe.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-alerts
spec:
  groups:
    - name: d17_backup_recording
      interval: 30s
      rules:
        - record: efe:backup_failure_rate_5m
          expr: |
            sum by (source, type) (rate(efe_backup_runs_total{result="failed"}[5m]))
            /
            clamp_min(sum by (source, type) (rate(efe_backup_runs_total[5m])), 1e-9)

        - record: efe:backup_age_seconds
          expr: time() - efe_backup_last_success_timestamp

        - record: efe:dr_drill_age_seconds
          expr: time() - efe_dr_drill_last_success_timestamp

    - name: d17_backup_alerts
      interval: 1m
      rules:
        - alert: D17BackupStaleFull
          expr: efe:backup_age_seconds{type="full"} > 86400
          for: 10m
          labels:
            severity: critical
            sprint: D17
          annotations:
            summary: "D17 : full backup stale (> 24 h)"
            description: "No successful full backup for {{`{{ $value | humanizeDuration }}`}}. RPO is being silently extended ; investigate the CronJob immediately."
            runbook: "docs/runbook/D17-1.md"

        - alert: D17BackupStaleDiff
          expr: efe:backup_age_seconds{type="diff"} > 3600
          for: 10m
          labels:
            severity: high
            sprint: D17
          annotations:
            summary: "D17 : diff backup stale (> 1 h)"
            description: "No successful diff backup for {{`{{ $value | humanizeDuration }}`}} ; full-recovery time degrades."
            runbook: "docs/runbook/D17-1.md"

        - alert: D17BackupFailureRate
          expr: efe:backup_failure_rate_5m > 0.1
          for: 10m
          labels:
            severity: high
            sprint: D17
          annotations:
            summary: "D17 : backup failure rate > 10 %"
            description: "{{`{{ $labels.source }}/{{ $labels.type }}`}} failing at {{`{{ $value | humanizePercentage }}`}} of attempts."
            runbook: "docs/runbook/D17-2.md"

        - alert: D17BackupRpoViolation
          expr: efe_backup_rpo_seconds > {{ default 300 .Values.backup.alerts.rpoTargetSeconds }}
          for: 5m
          labels:
            severity: critical
            sprint: D17
          annotations:
            summary: "D17 : RPO violation"
            description: "RPO is {{`{{ $value | humanizeDuration }}`}} (target {{ default 300 .Values.backup.alerts.rpoTargetSeconds }} s). WAL archiving may be stuck."
            runbook: "docs/runbook/D17-3.md"

        - alert: D17DrDrillStale
          expr: efe:dr_drill_age_seconds > {{ default 1209600 .Values.backup.alerts.drillStaleSeconds }}
          for: 30m
          labels:
            severity: critical
            sprint: D17
          annotations:
            summary: "D17 : DR drill not run in > 14 days"
            description: "Last successful DR drill {{`{{ $value | humanizeDuration }}`}} ago. Compliance / SOC2 risk."
            runbook: "docs/runbook/D17-4.md"

        - alert: D17DrRtoViolation
          expr: histogram_quantile(0.95, sum by (le) (rate(efe_dr_drill_duration_seconds_bucket[1d]))) > {{ default 1800 .Values.backup.alerts.rtoTargetSeconds }}
          for: 30m
          labels:
            severity: high
            sprint: D17
          annotations:
            summary: "D17 : DR drill p95 exceeds RTO target"
            description: "p95 drill duration {{`{{ $value | humanizeDuration }}`}} > RTO target {{ default 1800 .Values.backup.alerts.rtoTargetSeconds }} s."
            runbook: "docs/runbook/D17-5.md"

        - alert: D17BackupS3Unreachable
          expr: up{job="efe-backup-s3-probe"} == 0
          for: 5m
          labels:
            severity: critical
            sprint: D17
          annotations:
            summary: "D17 : S3 backup endpoint unreachable"
            description: "blackbox probe to the backup bucket has been failing for 5 m ; backups are blocked."
            runbook: "docs/runbook/D17-7.md"
{{- end }}
