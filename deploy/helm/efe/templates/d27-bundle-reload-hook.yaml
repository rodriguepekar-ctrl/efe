{{- /*
Sprint D27 (Φ-C) — Live bundle reload Helm post-upgrade hook Job.

Cf. docs/EFE_HELM_CHART_EXTENSION_ARCHITECTURE.md §11.

When `.Values.bundleReload.enabled = true`, a Job runs after each
`helm upgrade` to trigger a hot bundle swap on the running efe-server
pods WITHOUT a rolling restart.

Idempotency :
  - The Job first fetches the CURRENT bundle hash via the admin RPC.
  - If it equals `.Values.bundle.manifestSha256`, the Job skips
    (returns 0 immediately).
  - Otherwise, it POSTs to `/admin/bundle-reload` with the expected
    hash + waits for confirmation.

Helm hook annotations :
  - `helm.sh/hook: post-upgrade`           : runs after the Deployment apply.
  - `helm.sh/hook-weight: "10"`            : runs after RBAC (weight 1-3).
  - `helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation`
                                              : auto-cleanup on success.

Pin tested by `test_m12_helm_extension_bundle_reload_hook_present`.
*/}}
{{- if .Values.bundleReload.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "efe.fullname" . }}-bundle-reload
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efe.labels" . | nindent 4 }}
    efe.io/sprint: D27
    efe.io/feature: bundle-reload
  annotations:
    helm.sh/hook: {{ .Values.bundleReload.hookTiming | default "post-upgrade" }}
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
    efe.io/audit-fix-marker: "M12-D27-bundle-reload-hook"
spec:
  backoffLimit: {{ .Values.bundleReload.retries | default 3 }}
  activeDeadlineSeconds: {{ .Values.bundleReload.timeout | default 300 }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "efe.labels" . | nindent 8 }}
        app.kubernetes.io/component: bundle-reload
        efe.io/feature: bundle-reload
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "efe.fullname" . }}-bundle-reload
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bundle-reload
          image: "{{ .Values.bundleReload.image.repository | default "bitnami/kubectl" }}:{{ .Values.bundleReload.image.tag | default "1.30" }}"
          imagePullPolicy: {{ .Values.bundleReload.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          env:
            - name: ADMIN_HOST
              value: {{ .Values.bundleReload.adminEndpoint.service | default (include "efe.fullname" .) }}
            - name: ADMIN_PORT
              value: {{ .Values.bundleReload.adminEndpoint.port | default 8080 | quote }}
            - name: ADMIN_PATH
              value: {{ .Values.bundleReload.adminEndpoint.path | default "/admin/bundle-reload" }}
            - name: BUNDLE_INFO_PATH
              value: {{ .Values.bundleReload.adminEndpoint.bundleInfoPath | default "/admin/bundle-info" }}
            - name: EXPECTED_HASH
              value: {{ .Values.bundle.manifestSha256 | default "" | quote }}
            - name: TIMEOUT
              value: {{ .Values.bundleReload.timeout | default 300 | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              echo "[$(date -u +%FT%TZ)] Bundle reload Job starting"
              echo "Target  : http://${ADMIN_HOST}:${ADMIN_PORT}${ADMIN_PATH}"
              echo "Expect  : ${EXPECTED_HASH}"

              # Audit fix M12-A2 (HIGH) — pre-fix this script used `wget`
              # but the canonical `bitnami/kubectl:1.30` image is built
              # on `bitnami/minideb-extras-base` which DOES ship `curl`
              # (used by kubectl examples + health checks) but does NOT
              # guarantee `wget`. At runtime : `/bin/sh: wget: not found`
              # → Job exits 127 → reload silently skipped → bundle
              # version drift between values.yaml and running pods.
              # Post-fix uses `curl` (deterministic, also more idiomatic
              # for HTTP-API ops than wget).

              if [ -z "${EXPECTED_HASH}" ]; then
                echo "⚠ EXPECTED_HASH empty — bundle.manifestSha256 not set in values"
                echo "  Skipping reload (no-op when hash is unknown)."
                exit 0
              fi

              # Fetch current hash (idempotency check). `curl -fsS`:
              #   -f : fail silently on HTTP errors (4xx/5xx → exit non-zero)
              #   -s : silent (no progress meter)
              #   -S : show errors even with -s
              # `--max-time 10` : 10-second hard timeout.
              CURRENT=$(curl -fsS --max-time 10 \
                  "http://${ADMIN_HOST}:${ADMIN_PORT}${BUNDLE_INFO_PATH}" 2>/dev/null \
                  | sed -n 's/.*"manifestSha256":"\([^"]*\)".*/\1/p' \
                  || echo "unknown")
              echo "Current : ${CURRENT}"

              if [ "${CURRENT}" = "${EXPECTED_HASH}" ]; then
                echo "✅ Already at expected hash — skipping reload (idempotent)"
                exit 0
              fi

              # Trigger reload (with retries). POST application/json body.
              echo "Triggering bundle reload..."
              PAYLOAD="{\"manifestSha256\":\"${EXPECTED_HASH}\"}"
              for i in 1 2 3; do
                if curl -fsS --max-time 60 \
                    -X POST \
                    -H 'Content-Type: application/json' \
                    -d "${PAYLOAD}" \
                    "http://${ADMIN_HOST}:${ADMIN_PORT}${ADMIN_PATH}"; then
                  echo "✅ Reload succeeded (attempt $i)"
                  exit 0
                fi
                echo "Attempt $i failed ; retry in 10s..."
                sleep 10
              done
              echo "❌ Reload failed after 3 attempts"
              exit 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
