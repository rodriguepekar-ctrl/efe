apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe.fullname" . }}
  labels: {{- include "efe.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.headless }}
  # Sprint D9.A5 — headless Service for client-side gRPC load balancing.
  # See values.yaml ``service.headless`` and
  # docs/bench/d9_deep_analysis_supplement.md §5.
  clusterIP: None
  {{- end }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      appProtocol: http
  selector: {{- include "efe.selectorLabels" . | nindent 4 }}
