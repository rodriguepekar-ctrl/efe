{{/*
Sprint D11.2 — Tier 2 multi-tenant LimitRange.

LimitRange enforces per-pod resource boundaries inside the namespace.
Defends against:

  * Forgotten ``resources.limits`` on a sidecar / debug container
    that would otherwise default to 0 (uncapped).
  * Pods sized larger than this tenant's per-pod allowance,
    which would defeat ``ResourceQuota.pods`` count.

The policy:
  * ``default`` / ``defaultRequest`` — applied when the pod
    spec doesn't declare a value (matches the EFE chart's
    ``resources`` block).
  * ``max`` — hard cap : a pod requesting more than this is
    rejected at admission time.

Architecture: docs/bench/d11_per_tenant_isolation_architecture.md §6.3.
*/}}
{{- if and .Values.tenant.namespace.isolated .Values.tenant.namespace.limitRange.enabled -}}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "efe.fullname" . }}-limits
  labels: {{- include "efe.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu:    {{ .Values.tenant.namespace.limitRange.defaultCpu    | default "500m" | quote }}
        memory: {{ .Values.tenant.namespace.limitRange.defaultMemory | default "512Mi" | quote }}
      defaultRequest:
        cpu:    {{ .Values.tenant.namespace.limitRange.defaultCpu    | default "500m" | quote }}
        memory: {{ .Values.tenant.namespace.limitRange.defaultMemory | default "512Mi" | quote }}
      max:
        cpu:    {{ .Values.tenant.namespace.limitRange.maxCpu        | default "2"     | quote }}
        memory: {{ .Values.tenant.namespace.limitRange.maxMemory     | default "2Gi"   | quote }}
      min:
        cpu:    "10m"
        memory: "16Mi"
{{- end -}}
