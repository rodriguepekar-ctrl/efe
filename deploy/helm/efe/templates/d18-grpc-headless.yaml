{{- /*
  Sprint D18 — Headless Service for client-side gRPC load balancing.

  Pre-D18, the standard ClusterIP Service kept gRPC clients pinned
  to a single replica per HTTP/2 connection (kube-proxy iptables
  routing per-connection, not per-request). Under multi-replica,
  this caused uneven load distribution.

  D18 ships a headless Service (clusterIP: None) that resolves to
  all Pod IPs ; the gRPC client (tonic) does client-side LB across
  the resolved endpoints.

  Cf. `docs/bench/d18_multi_replica_bench_d12_architecture.md` § 12.1.
*/}}
{{- if default true .Values.service.headless }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efe.fullname" . }}-grpc-headless
  labels: {{- include "efe.labels" . | nindent 4 }}
    app.kubernetes.io/component: multi-replica
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector: {{- include "efe.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ default 50051 .Values.service.port }}
      protocol: TCP
      targetPort: grpc
{{- end }}
