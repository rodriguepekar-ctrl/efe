[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efe-platform"
version = "0.1.0"
description = "EFE Platform — unified bot + swarm orchestration layer over the Rust Ephemeral Fluid Swarm core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "EFE Platform Team", email = "efe-platform@example.com" },
]
keywords = ["efe", "swarm", "llm", "agent", "orchestration", "grpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Wire + async plumbing
    "grpcio>=1.62",
    "protobuf>=4.25",
    "httpx>=0.27",
    "anyio>=4.3",
    # Data contracts
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    # Observability
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    # Utilities
    "typing-extensions>=4.10",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# LLM providers (one of them needed to run the bot end-to-end).
claude = ["anthropic>=0.30"]
openai = ["openai>=1.30"]
llm = ["anthropic>=0.30", "openai>=1.30"]

# HTTP API surface.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "starlette>=0.36",
    "sse-starlette>=2.0",
]

# Client library pulled from the efe-tool package (same repo).
client = ["efe-tool>=0.1.0"]

# Development + testing tooling.
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
efe-platform = "efe_platform.cli:main"

[project.urls]
Homepage = "https://github.com/efe-project/efe"
Documentation = "https://github.com/efe-project/efe/blob/main/ARCHITECTURE_GLOBALE.md"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "efe_platform*", "efe_ft*", "efe_orch*", "efe_worker*", "efe_gate*",
    "efe_registry*", "efe_inference*", "efe_rollout*", "efe_drift*",
]

[tool.setuptools.package-data]
efe_platform = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "ANN", "RUF"]
ignore = [
    # `Any` in tightly-scoped bridge code is fine.
    "ANN401",
    # Exception naming: our platform-level exceptions use intent-revealing names
    # (``BudgetExceeded``, ``UnknownTool``) rather than a trailing ``Error``
    # suffix. This is a deliberate API choice.
    "N818",
    # FastAPI's `Depends(...)` idiom has to appear as a default argument.
    "B008",
    # We intentionally suppress some exceptions in close()-style helpers.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",       # no annotations required in tests
    "S101",      # assert is the point
    "B017",      # pytest.raises(Exception) is OK in bounds-checking tests
    "E402",      # importorskip pattern needs late imports
    "F841",      # a deliberately-unused var clarifies a test's intent
]
"tests_ft/*" = [
    "ANN",
    "S101",
    "B017",
    "E402",
    "F841",
]
"tests_orch/*" = [
    "ANN",
    "S101",
    "B017",
    "E402",
    "F841",
]
"tests_worker/*" = [
    "ANN",
    "S101",
    "B017",
    "E402",
    "F841",
    "B007",
    "N806",
    "RUF100",
    "RUF012",
]
"tests_gate/*" = [
    "ANN",
    "S101",
    "B017",
    "E402",
    "F841",
    "B007",
    "N806",
    "RUF100",
    "RUF012",
    "SIM118",
    "I001",
]
"tests_registry/*" = [
    "ANN",
    "S101",
    "B017",
    "E402",
    "F841",
    "B007",
    "N806",
    "RUF059",
    "RUF100",
    "RUF012",
    "SIM118",
    "I001",
]
"tests_inference/*" = [
    "ANN",
    "S101",
    "B017",
    "E402",
    "F841",
    "B007",
    "N806",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF059",
    "RUF100",
    "RUF012",
    "SIM118",
    "I001",
]
"tests_rollout/*" = [
    "ANN",
    "S101",
    "B017",
    "E402",
    "F841",
    "B007",
    "N806",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF059",
    "RUF100",
    "RUF012",
    "SIM118",
    "I001",
    "B011",
]
"tests_drift/*" = [
    "ANN",
    "S101",
    "B017",
    "E402",
    "F841",
    "B007",
    "N806",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF059",
    "RUF100",
    "RUF012",
    "SIM118",
    "I001",
    "B011",
]
# Methods modules legitimately use Greek letters / math symbols in
# docstrings and one-letter ``F`` alias for ``torch.nn.functional``
# (community standard).
"src/efe_worker/methods/*" = ["N806", "RUF002", "RUF003", "F841"]
"src/efe_gate/metrics/stats/*" = ["RUF001", "RUF002", "RUF003", "N806"]
"src/efe_gate/comparator/*" = ["N806", "RUF002"]
"src/efe_gate/decision/*" = ["RUF002"]
"src/efe_gate/champion/*" = ["RUF002"]
"src/efe_gate/services/*" = ["RUF002"]
"src/efe_gate/rollback/*" = ["RUF002"]
"src/efe_registry/*" = ["RUF002"]
"src/efe_inference/*" = ["RUF001", "RUF002"]
"src/efe_rollout/*" = ["RUF001", "RUF002", "RUF003"]
"src/efe_drift/*" = ["RUF001", "RUF002", "RUF003"]
"src/efe_gate/observability/*" = ["RUF001", "RUF002"]
# Snapshot docstring explains math with × for multiplication.
"src/efe_worker/data/samplers/*" = ["RUF002"]
"src/efe_worker/data/snapshot.py" = ["RUF001", "RUF002"]
"src/efe_worker/transport/s3.py" = ["SIM108"]
"examples/*" = [
    "ANN",
    "E402",
]
"src/efe_platform/bot/providers/__init__.py" = [
    "E402",      # lazy optional-extra imports
]
"src/efe_platform/api/http_app.py" = [
    "E402",      # FastAPI import is inside build_app() for optional-extra reasons
]
"src/efe_platform/cli.py" = [
    "E402",      # uvicorn / FastAPI are imported lazily per subcommand
]
"src/efe_platform/swarm/_grpc_transport.py" = [
    "E402",      # grpcio stubs are imported lazily at module top
]
# Top-level __init__.py re-exports are intentionally grouped by theme
# (comments above each block) rather than sorted alphabetically.
"src/efe_platform/__init__.py" = ["RUF022"]
"src/efe_platform/swarm/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["tests/", "examples/"]
# Generated/optional modules we intentionally don't audit.
[[tool.mypy.overrides]]
module = [
    "efe_tool._proto.*",
    "efe.v1.*",
    "grpc.*",
    "grpc.aio.*",
    "anthropic.*",
    "openai.*",
    "fastapi.*",
    "fastapi.responses",
    "starlette.*",
    "sse_starlette.*",
    "uvicorn.*",
    "yaml",
    "opentelemetry",
    "opentelemetry.*",
    "tomllib",
    "prometheus_client",
    "structlog",
    "structlog.*",
    "kubernetes_asyncio",
    "kubernetes_asyncio.*",
    "boto3",
    "pyarrow",
    "pyarrow.*",
    "peft",
    "peft.*",
    "vllm",
    "vllm.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "httpx",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
