# Support triage catalog — routes inbound customer messages into 4 classes.
# Compiled with sentence-transformers/all-MiniLM-L6-v2 (dim=384).
# See MODE1_ARCHITECTURE.md §8.1 for the schema.

apiVersion: efe.mode1/v1
kind: AnchorCatalog

metadata:
  name: support_triage
  version: "1.0.0"
  created_at: 2026-04-19T12:00:00Z
  author: efe-demo@example.com
  description: >
    Zero-shot triage of support tickets into {fraud, bug, question, billing}
    using a pre-trained sentence-transformers model and an ephemeral
    fluid swarm consensus.

embedder:
  family: sentence-transformers
  model: paraphrase-multilingual-MiniLM-L12-v2
  dim: 384
  normalize: l2

cone_policy:
  # L2 distance between raw centroid and its projection onto the cone.
  # The MVP default 0.5 is tolerant enough for cross-lingual inputs.
  max_projection_distance: 0.5
  registered_in_m9: false   # optional — set true once the AdminService path is wired

thresholds:
  confidence_high: 0.60     # ≥ → trusted label, act on it
  confidence_medium: 0.50   # [medium, high[ → label with warning
  # < confidence_medium → reject (LLM asks a clarifying question)

classes:
  - name: fraud
    description: Suspicion of fraud, unauthorised charges, or account compromise.
    color: red
    canonical_sentences:
      - "Someone charged my card without my consent."
      - "I think my account has been hacked."
      - "There's a transaction on my statement I don't recognise."
      - "I received an email asking for my password, is this legitimate?"
      - "My card was used in a country I've never visited."
      - "J'ai été débité d'une somme que je n'ai pas autorisée."
      - "Je pense que quelqu'un a piraté mon compte."
      - "Quelqu'un a utilisé ma carte bancaire sans mon autorisation."
      - "Débit non autorisé sur ma carte bancaire."
      - "Transaction frauduleuse sur mon compte bancaire."
      - "Ma carte bancaire a été utilisée sans mon consentement."

  - name: bug
    description: Technical problem, error, or broken feature in the product.
    color: orange
    canonical_sentences:
      - "The app keeps crashing every time I try to log in."
      - "I'm getting a 500 error on the checkout page."
      - "The page stays blank after I click the button."
      - "Nothing happens when I try to upload a file."
      - "The notifications never arrive since the last update."
      - "L'application plante dès que j'ouvre le menu paramètres."
      - "J'ai une erreur rouge quand je clique sur envoyer."

  - name: question
    description: Functional or how-to question about the product.
    color: blue
    canonical_sentences:
      - "How do I export all my data to a CSV file?"
      - "Where can I change my notification preferences?"
      - "Is there a way to schedule a post for later?"
      - "Can I share a project with a collaborator?"
      - "How do I reset my two-factor authentication?"
      - "Comment télécharger mon historique de commandes ?"
      - "Où puis-je modifier l'adresse de livraison par défaut ?"

  - name: billing
    description: Billing, subscription, invoice, or payment-method question.
    color: green
    canonical_sentences:
      - "When will I receive my invoice for this month?"
      - "I want to cancel my subscription."
      - "Can I change my payment method from card to bank transfer?"
      - "I was charged twice for the same order."
      - "How do I upgrade to the annual plan?"
      - "Je voudrais recevoir une facture avec mon numéro de TVA."
      - "Pourquoi ai-je été facturé alors que j'ai annulé mon abonnement ?"
