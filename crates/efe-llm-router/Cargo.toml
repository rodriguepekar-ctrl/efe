[package]
name = "efe-llm-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "M21 — LLMRouter microservice : multi-provider abstraction + cost governance + caching + circuit breaker"

[dependencies]
efe-prompts      = { path = "../efe-prompts" }
tokio            = { workspace = true }
async-trait      = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow           = { workspace = true }
http             = { workspace = true }
futures          = { workspace = true }
parking_lot      = "0.12"
sha2             = "0.10"
hmac             = "0.12"
hex              = "0.4"
chrono           = { version = "0.4", features = ["serde"] }
rust_decimal     = { version = "1.36", features = ["serde"] }
sqlx             = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "rust_decimal", "uuid"] }
redis            = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
reqwest          = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dashmap          = { workspace = true }
tonic            = { workspace = true, optional = true }
prost            = { workspace = true, optional = true }
uuid             = { workspace = true }
bincode          = { workspace = true }
once_cell        = "1.19"

[dev-dependencies]
mockito          = "1.5"
proptest         = "1.5"
serial_test      = "3.1"
tempfile         = "3.10"

[build-dependencies]
tonic-build      = { workspace = true, optional = true }

[features]
default          = ["server"]
server           = ["dep:tonic", "dep:prost", "dep:tonic-build"]
# Provider features (compile-time opt-in to keep binary small)
anthropic        = []
openai           = []
bedrock          = []
azure-openai     = []
vertex           = []
mistral          = []
vllm             = ["openai"]      # vLLM uses OpenAI-compat
hf-tgi           = ["openai"]      # HF TGI uses OpenAI-compat
all-providers    = ["anthropic", "openai", "bedrock", "azure-openai", "vertex", "mistral", "vllm", "hf-tgi"]

[[bin]]
name = "efe-llm-router"
path = "src/main.rs"
required-features = ["server"]
