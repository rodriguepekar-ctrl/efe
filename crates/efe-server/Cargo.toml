[package]
name = "efe-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC server exposing the EFE swarm service"

[dependencies]
efe-core = { path = "../efe-core" }
efe-telemetry = { path = "../efe-telemetry" }

# Sprint **D28 (Φ-D)** — optional GPU compute substrate. Pulled in
# only when the parent build activates `--features cuda` ; default
# build keeps efe-server CPU-only and immune to CUDA toolchain
# requirements (Mac/Windows CI stays green).
efe-kernels = { path = "../efe-kernels" }    # ← audit fix Φ-D.A3 : non-optional pour exposer GpuFingerprint::empty() sans CUDA

# D93 (M26 assembly) — REST gateway under `/v1/agent/*` calls into
# the M25 `AgentRuntimeService` in-process via the adapter pattern.
# `async-trait` already declared via the workspace below.
efe-agent-runner = { path = "../efe-agent-runner" }

# M27 Commercial Edge — Redis cache plane + tenant quota counters.
efe-cache = { path = "../efe-cache" }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
once_cell = "1.20"
prometheus = { version = "0.13", default-features = false, features = ["process"] }

# M28 Streaming + Events + Webhooks — typed envelope + NATS pub/sub.
# `hmac`, `sha2`, `hex`, `url` are already direct deps further below ;
# we just rely on them.
efe-events = { path = "../efe-events" }
rand = "0.8"
async-nats = { version = "0.36", features = ["server_2_10"] }
ring = "0.17"

# M29 Data rights + customer compliance — PII analyzer + canonicalize +
# circuit breaker + redactor.
efe-pii = { path = "../efe-pii" }

# M30 Multi-modal + GPU + Multi-region.
efe-multimodal = { path = "../efe-multimodal" }
efe-region = { path = "../efe-region" }

# M31 FinOps + Cost Governance + Stripe Billing.
efe-metering = { path = "../efe-metering" }
efe-billing = { path = "../efe-billing" }
serde_urlencoded = "0.7"

# M32 Vector Search + Hybrid Retrieval.
efe-vector = { path = "../efe-vector" }
efe-retrieval = { path = "../efe-retrieval" }

# M33 Knowledge Graph + GraphRAG.
efe-kg = { path = "../efe-kg" }
efe-graphrag = { path = "../efe-graphrag" }

# Phase-2 / PR #11 — meta-swarm wire types + tonic-generated clients.
# Plumbing only : `efe-server` builds a `MetaSwarmClient` at startup
# when `EFE_META_SWARM_ENABLED=true`, holds it on its runtime state,
# but **does not** route requests through it.  PR #15 will wire the
# dispatch.  Cf. `docs/EFE_A1_PHASE2_PR11_ARCHITECTURE.md`.
efe-meta-swarm-proto = { path = "../efe-meta-swarm-proto" }

# Async runtime + tracing
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Error handling + serde
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

# gRPC stack
tonic = { workspace = true }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tower = { workspace = true }
http = { workspace = true }

# M26 REST gateway (`/v1/agent/*`) — axum + SSE + serde_json.
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "matched-path", "query"] }
async-stream = "0.3"

# Auth + rate limit
jsonwebtoken = { workspace = true }
dashmap = { workspace = true }

# Config : base64 decoding for HS256 secrets file (M12.9 rotation format).
# A direct dep makes the decoding surface explicit and immune to
# transitive upgrades of `jsonwebtoken`.
base64 = "0.22"

# ---------------------------------------------------------------------
# Sprint D14 — Postgres-backed catalog registry.
#
# We use sqlx in **runtime-checked** mode (the `query()` /
# `query_as` family rather than the `query!()` macros) so the
# build does not require a live PG instance or a checked-in
# `.sqlx/` cache. Compile-time check is delegated to the
# integration tests under `tests/d14_postgres_*.rs`, which use
# a real PG via testcontainers.
#
# `chrono` is brought in only for `TIMESTAMPTZ` translation in
# observation queries ; the canonical timestamp is still
# `created_at_unix_ms: i64` per the D12 trait shape.
#
# `xxhash-rust` provides a fast 64-bit hash for the
# `pg_advisory_xact_lock` ID (cf. § 5.3 of the architecture).
# ---------------------------------------------------------------------
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "json",
    "migrate",
    "macros",
    # Sprint D14-bis — UUID type conversion for the `event_id` column
    # in `audit_events`. sqlx's uuid feature pulls the `uuid` crate
    # at the right version transitively.
    "uuid",
] }
# Note : `chrono` is brought in transitively by sqlx's `chrono` feature
# (we enabled it on the sqlx crate). Sprint **D15** re-introduces a
# direct dep with `default-features = false` + `serde` so the tenant
# CRUD layer (`auth/tenants.rs`) can decode `TIMESTAMPTZ` columns into
# `DateTime<Utc>` and serialise tenants as JSON for the CLI / API
# without re-rolling the date types. We disable `clock` to keep the
# binary minimal — the only `now()` calls live server-side in the
# Postgres `default now()` clauses.
chrono = { version = "0.4", default-features = false, features = [
    "serde", "std",
] }
# Sprint **D15 audit fix H3** — explicit `url` dep for the OIDC issuers
# validator. Previously we just checked `s.starts_with("https://")`
# which accepted "https://" alone (empty host) as valid. The `url::Url::parse`
# check rejects malformed URLs at issuers-file load time. The crate is
# already pulled in transitively by sqlx ; we just promote it to a
# direct dep so refactors of sqlx don't silently break us.
url = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# Note : `secrecy` was tried but its API in 0.8 doesn't compose with
# `[u8; 32]` (no Zeroize impl out of the box). The audit HMAC keys
# are wrapped in the in-crate `HmacKey` newtype which provides a
# `Debug` redaction without external deps. Cf. `audit_keys.rs`.
# Sprint D14 — SHA-256 for the deterministic `content_sha256` column.
# We hash the canonical JSON of `CatalogContent` (no HashMap, only
# BTreeMap → field-order-stable serde output), so identical content
# produces identical sha hex strings across registers / mirrors / replays.
sha2 = "0.10"
# Sprint D14-bis — RFC 2104 HMAC over SHA-256 for the chained audit log.
# `hmac` crate v0.12 is the de facto standard ; integrates with `sha2`
# via the `Hmac<Sha256>` type alias. Audit fix : the implementation
# guards against length-extension by construction (HMAC is the
# RFC 2104 nested wrapper).
hmac = "0.12"

# Sprint D15 — OIDC integration : HTTP fetch for the JWKS endpoint
# (`/.well-known/jwks.json`). `reqwest` is the de facto async HTTP
# client in the Rust ecosystem. We use the `rustls-tls` feature to
# avoid pulling OpenSSL (consistent with sqlx feature choice).
# `json` for serde_json round-trip on the JWKS document.
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
# Sprint D15 — `clap` v4 for the `efe-onboard` CLI argument parsing.
# The runtime (efe-server, efe-verify-audit) uses hand-rolled args
# parsing ; `efe-onboard` has more subcommands (preflight, activate,
# suspend, list) so clap's derive API pays for itself.
clap = { version = "4.5", features = ["derive"] }

# Sprint D16 — Embedder bundling. Ed25519 detached signature
# verification on the bundle manifest (Cosign-style). The
# `ed25519-dalek` v2 crate is the Rust reference implementation
# (RustCrypto org, audited, used by the Tor project). We disable
# default-features to avoid the optional `getrandom` initialiser
# (we never generate keys at runtime — only verify ; the
# `efe-bundle keygen` CLI re-enables it via the `rand_core` feature).
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "zeroize", "rand_core"] }
# Sprint D16 — hex encoding for the 64-char SHA-256 fingerprint
# columns + the 64-char Ed25519 signature display. We use lowercase
# hex everywhere (matches Postgres' `encode(..., 'hex')` and the
# audit-events HMAC representation D14-bis).
hex = "0.4"
# Sprint D16 — `rand_core` (CSPRNG via OsRng) for `efe-bundle keygen`.
# Indirect via ed25519-dalek's `rand_core` feature ; explicit re-export
# here so the CLI can `use rand_core::OsRng` without a separate dep.
rand_core = { version = "0.6", features = ["std"] }

[build-dependencies]
tonic-build = { workspace = true }
# Provides a platform-specific `protoc` binary so the build script does
# not depend on a system-wide `protoc` install. Critical for
# reproducible builds on fresh dev machines and CI runners.
protoc-bin-vendored = "3.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
# M12 config tests: write ephemeral files for HS256 secrets scenarios
# without leaking state between parallel tests.
tempfile = "3.10"
# Sprint D14 — `once_cell` provides the static lazy `OnceCell`
# used by the PG integration tests (`tests/d14_postgres_*.rs`)
# to share a single connection pool across tests. Unlike
# testcontainers, this keeps the dev-dep tree compatible with
# rust-version 1.85 ; the integration tests are gated on the
# `EFE_PG_TEST_URL` env var so machines without Postgres skip
# them silently rather than fail.
once_cell = "1.19"
# Sprint D15 — `wiremock` provides a mock HTTP server for the
# JWKS-fetch integration tests (`tests/d15_oidc_integration.rs`).
# Runs in-process — no Docker / testcontainers — so CI is
# hermetic. Pinned to 0.5 for rustc 1.85 compat.
wiremock = "0.5"
# Sprint D1 — Bench Foundation (real strategies). Exercises
# `build_mvp_backend`, the canonical wiring used by the production
# server, so the metrics published in `BENCHMARKS.md` reflect what
# real clients pay for, not a mock harness.
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support", "async_tokio"] }
# `peak_alloc` is used as the global allocator in `real_memory.rs`
# only — installing it globally would alter timing in the latency
# benches.
peak_alloc = "0.3"
serde_json = { workspace = true }
# Sprint **D19 (P1-Foundation)** — AST parser used by
# `tests/p1_hot_path_lint.rs` to walk the hot-path Rust modules
# and refuse banned constructs (Vec::new, Box::new, tokio::sleep,
# unwrap, etc.). Default features (`full`, `parsing`) are enough.
syn = { version = "2.0", features = ["full", "visit", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
# `walkdir` is only used by the hot-path lint to walk the listed
# module paths. Cheap dev-only.
walkdir = "2.5"

# ---------------------------------------------------------------------
# Sprint D1 bench targets.
#
# `real_strategies_e2e` measures the production wiring end-to-end
# (genesis + fusion ×N + consensus + dissolution + alignment).
# `real_memory` measures heap peak / alloc count under the same
# wiring, isolated in its own binary because it installs
# `peak_alloc` as the global allocator.
# ---------------------------------------------------------------------
[[bench]]
name = "real_strategies_e2e"
harness = false

[[bench]]
name = "real_memory"
harness = false

# ---------------------------------------------------------------------
# Sprint D4 — Server RPC bench (real gRPC stack on loopback TCP).
#
# Measures the production gRPC wire end-to-end : tonic transport +
# codec + interceptors (rate-limit, idempotency) + bridge proto↔domain
# + backend (D1 chain). 4 criterion groups : full_stack, minimal_stack
# (baseline for Δ_interceptors), concurrent (8c throughput), codec_only
# (prost encode/decode round-trip). See
# `docs/bench/d4_server_rpc_architecture.md`.
# ---------------------------------------------------------------------
[[bench]]
name = "server_rpc"
harness = false

# ---------------------------------------------------------------------
# Sprint D1 — BLAS pass-through features.
#
# These features forward to `efe-core` so a bench operator can write
# `cargo bench -p efe-server --features accelerate` (or `openblas`)
# and get a BLAS-accelerated bench run, while the default build stays
# on the naïve linear-algebra path. The `cfg(feature = "...")` checks
# in the bench code only see *local* features, so we MUST mirror the
# flag here rather than try to detect `efe-core`'s feature directly.
# ---------------------------------------------------------------------
[features]
default = []
accelerate = ["efe-core/accelerate"]
openblas = ["efe-core/openblas"]
# Sprint **D28 (Φ-D)** — pull in `efe-kernels` so the runtime can
# instantiate `CudaBackend`. Cf. `docs/EFE_KERNELS_ARCHITECTURE.md` § 25.
cuda = ["efe-kernels/cuda"]
nccl = ["cuda", "efe-kernels/nccl"]
# Sprint **D22** (M4 § 10.2) — mTLS support via `tonic/tls`. Off by
# default (dev / Tier-1 stay TLS-less). Production Tier-2/3 builds
# enable this so the runtime can wire `tonic::transport::ServerTlsConfig`
# from PEM files at boot.
tls = ["tonic/tls"]

[lib]
name = "efe_server"
path = "src/lib.rs"

[[bin]]
name = "efe-server"
path = "src/main.rs"

# Sprint D14-bis — CLI for tamper-evident audit log verification.
# Reads the `audit_events` table + the keys file, replays the chain
# from genesis, and reports any tampering / deletion / reordering.
# Operators run this against a snapshot or live PG to produce
# regulatory audit reports (SOC 2, HIPAA, GDPR Article 32).
[[bin]]
name = "efe-verify-audit"
path = "src/bin/efe_verify_audit.rs"

# Sprint **D15** — `efe-onboard` CLI : tenant registry management
# (preflight, register, activate, suspend, list, get). Binary lives
# next to `efe-verify-audit` under `src/bin/`.
[[bin]]
name = "efe-onboard"
path = "src/bin/efe_onboard.rs"

# Sprint **D16** — `efe-bundle` CLI : embedder bundle management
# (keygen, pack, sign, verify, inspect). Architecture
# `docs/bench/d16_embedder_bundling_architecture.md` § 6.
[[bin]]
name = "efe-bundle"
path = "src/bin/efe_bundle.rs"
