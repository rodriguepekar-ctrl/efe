[package]
name        = "efe-cache"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "M27 — Redis-backed embedding + LLM response + tenant quota cache."

[dependencies]
# Workspace crates we mirror types from (none yet — keep it light).
tokio            = { workspace = true }
tracing          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }

# Crypto + binary serialization for cache values.
sha2             = "0.10"
hmac             = "0.12"
hex              = "0.4"
bincode          = { workspace = true }

# Time.
chrono           = { version = "0.4", features = ["serde"] }

# Redis : same major version as efe-llm-router (workspace coherence).
# `connection-manager` for single-instance pooled, `cluster-async` for
# Redis Cluster mode. Both behind one crate.
redis = { version = "0.27", features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
    "cluster-async",
    "script",
] }

# Metrics.
prometheus       = { version = "0.13", default-features = false, features = ["process"] }
once_cell        = "1.20"

[dev-dependencies]
tokio            = { workspace = true, features = ["test-util", "macros"] }
anyhow           = { workspace = true }

[features]
default = []
# Enable when the test environment exposes EFE_REDIS_TEST_URL.
integration-tests = []
