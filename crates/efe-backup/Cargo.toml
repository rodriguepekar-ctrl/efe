[package]
name = "efe-backup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sprint D17 — Backup + Disaster Recovery orchestrator for EFE."

[lints.rust]
# D17 audit-prevention : strict lints so the audit pass surfaces
# defects we would otherwise miss. Pattern from efe-server crate.
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# Sprint D17 — Ed25519 detached signatures on backup manifests
# (re-uses the algorithm + format documented in D16 ; the backup
# manifest is signed at snapshot time + verified at restore time
# against a separate trust store distinct from the bundle one
# for compartmentalization, cf. T-DR-5 mitigation).
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "zeroize"] }
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# Sprint D17 — D14-bis audit chain integration : the backup
# orchestrator emits structured events in the HMAC-chained audit
# log so backup operations are tamper-evident.
efe-telemetry = { path = "../efe-telemetry" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "zeroize", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# ----------------------------------------------------------------------
# Binary : `efe-backup` CLI
# ----------------------------------------------------------------------

[[bin]]
name = "efe-backup"
path = "src/bin/efe_backup.rs"

[dependencies.clap]
version = "4.5"
features = ["derive", "env"]

[dependencies.tracing-subscriber]
workspace = true
