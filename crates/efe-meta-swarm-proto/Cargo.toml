[package]
name         = "efe-meta-swarm-proto"
version      = "0.2.0"
edition      = "2021"
rust-version = "1.88"
description  = "Protocol Buffers + tonic-generated client/server stubs for the EFE meta-swarm gRPC surface (MetaSwarmService + MetaParticipantService). Sprint A1 Phase 2."
publish      = false                # carve-out R5-B1 — UNLICENSED until Phase 5
license      = "Apache-2.0"          # advisory only ; effective at Phase 5

# ─────────────────────────────────────────────────────────────────────
# Runtime dependencies.
# ─────────────────────────────────────────────────────────────────────
[dependencies]
tonic       = { workspace = true }
prost       = { workspace = true }
prost-types = { workspace = true }

# Optional : serde derives on generated message types.  Used by
# `bench_public/` (PR #21) to emit JSON for the HTML report, and by
# future Phase-3 customer-facing CLI tools.
serde       = { workspace = true, optional = true }

# ─────────────────────────────────────────────────────────────────────
# Build dependencies — only needed at compile time.
# ─────────────────────────────────────────────────────────────────────
[build-dependencies]
tonic-build         = { workspace = true }
protoc-bin-vendored = "3.1"      # bundled `protoc` ; same version as efe-server/build.rs

# ─────────────────────────────────────────────────────────────────────
# Cargo features.
# ─────────────────────────────────────────────────────────────────────
[features]
default = []

# Derive serde::{Serialize, Deserialize} on every generated message.
# ~50 kB binary size overhead.  Required by `bench_public` + future
# CLI / SDK tools.
serde-derives = ["dep:serde"]

# Drop server stubs.  ~30 % code-gen size reduction.  Used by builds
# that only consume the surface (e.g. a CLI client).
client-only = []

# Drop client stubs.  Mirror of `client-only`.  Used by builds that
# only expose the surface (controller-only / participant-only
# binaries that don't make outbound calls).
server-only = []

# Convenience meta-feature : everything.  Used by `cargo doc` + CI
# matrix when validating the full surface.
full = ["serde-derives"]

# ─────────────────────────────────────────────────────────────────────
# Dev dependencies — for the cross-crate smoke test.
# ─────────────────────────────────────────────────────────────────────
[dev-dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }

# ─────────────────────────────────────────────────────────────────────
# docs.rs configuration.
# ─────────────────────────────────────────────────────────────────────
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
