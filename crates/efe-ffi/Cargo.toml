[package]
name = "efe-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings for EFE — in-process Python integration (M3, Sprint D25)."

[lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
# Φ-C-FFI Completion audit : `priority = -1` rend ces denies
# **overridable** par les `#![cfg_attr(test, allow(...))]` dans
# lib.rs. Sans `priority`, Cargo.toml `deny` aurait précédence
# absolue → tous les tests `#[test]` qui utilisent `.unwrap()`
# auraient échoué sous `cargo clippy --tests` (= pré-existant
# avant Φ-C-FFI mais jamais detecté car CI n'invoquait pas
# clippy --tests).
unwrap_used = { level = "deny", priority = -1 }
expect_used = { level = "deny", priority = -1 }
todo = { level = "deny", priority = -1 }
unimplemented = { level = "deny", priority = -1 }

# ---------------------------------------------------------------------
# Sprint **D25 (Φ-C)** — `efe-ffi` becomes the Python in-process
# substrate of EFE. Cf. `docs/EFE_FFI_ARCHITECTURE.md`.
#
# Dependency direction is **`efe-ffi → efe-core` (transitively →
# efe-kernels)**, never the reverse. The crate produces a `cdylib`
# (loadable from Python) AND an `rlib` (so Rust-side benches can
# link). Without `--features pyo3-extension` the workspace still
# compiles but the resulting binary is not loadable from Python.
# ---------------------------------------------------------------------

[lib]
name = "efe_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
efe-core = { path = "../efe-core" }

# Φ-C-FFI Completion (D26) — production caller for the FFI Prometheus
# instruments (8 metrics in `efe-telemetry::metrics::ffi_instruments`).
# Direction respects the workspace : efe-ffi → efe-telemetry → opentelemetry.
efe-telemetry = { path = "../efe-telemetry" }

# Optional GPU substrate ; pulled only when --features cuda.
efe-kernels = { path = "../efe-kernels", optional = true }

# Φ-C-FFI Completion (D26) — sync Mutex for the LRU bundle cache
# (decision D7 § 19 : sync is correct since classify_zero_copy is
# itself sync `#[pyfunction]` ; tokio::sync::Mutex would introduce
# pointless async↔sync blocking).
parking_lot = "0.12"

# PyO3 0.21 — Python bindings.
# `extension-module` makes the crate produce a CPython extension
# module that does NOT link the Python library — required for wheel
# builds (= `maturin build`) and `cdylib` artefacts loaded by an
# external Python interpreter.
#
# **Gated behind an opt-in feature** so `cargo test --workspace` keeps
# working : tests run a Rust binary that needs to LINK the Python
# library (= `auto-initialize` in dev-deps embeds a Python). The
# `extension-module` feature and the test binary's Python embed are
# mutually exclusive ; gating is therefore mandatory.
#
# Cf. https://pyo3.rs/main/faq.html#i-cant-run-cargo-test-or-i-cant-build-in-a-cargo-workspace-im-getting-undefined-references-to-python-symbols
#
# `abi3-py310` activates Python 3.10+ stable ABI : a single wheel
# covers Python 3.10, 3.11, 3.12, 3.13.
pyo3 = { version = "0.21", default-features = false, features = [
    "abi3-py310",
    "macros",
] }

# numpy 0.21 — typed `PyArray*` for zero-copy interop.
numpy = "0.21"

# Async bridge between tokio and Python asyncio.
pyo3-async-runtimes = { version = "0.21", features = ["tokio-runtime"] }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
# `auto-initialize` lets Rust `#[test]`s create a Python interpreter
# on demand. Workspace cargo test uses the embedded Python (CI runner
# must have Python ≥ 3.10 available — same bar as maturin).
pyo3 = { version = "0.21", features = ["auto-initialize", "abi3-py310"] }
criterion = "0.5"
# Φ-C-FFI Completion — static `Send + Sync` enforcement on the
# LRU cache (DF4 + D-FFI-4 doctrine). Dev-only (zero runtime cost).
static_assertions = "1.1"

[features]
default = []
# Produces a CPython extension module (= cdylib loadable from Python
# without linking the Python library). REQUIRED when building wheels
# via `maturin build`, MUST BE OFF for `cargo test --workspace` (the
# test binary embeds Python via `auto-initialize`).
#
# Canonical invocations :
#   maturin build --release --features extension-module
#   cargo  build  -p efe-ffi --release --features extension-module
#   cargo  test   --workspace                                    # OFF
extension-module = ["pyo3/extension-module"]
# Enables the GPU substrate. Wheel publishing matrix uses this on
# Linux x86_64 (where nvcc is available in the manylinux container).
cuda = ["dep:efe-kernels", "efe-kernels/cuda"]
# Multi-GPU collectives via NCCL ; implies cuda.
nccl = ["cuda", "efe-kernels/nccl"]

# ---------------------------------------------------------------------
# Φ-C-FFI Completion — Criterion bench harness.
# Mesure le coût pur de la couche FFI hors gRPC.
# Cf. `crates/efe-ffi/benches/ffi_overhead.rs` + § 14.1 du doc archi.
# ---------------------------------------------------------------------
[[bench]]
name = "ffi_overhead"
harness = false

# ---------------------------------------------------------------------
# When **building this crate alone** (`cargo build -p efe-ffi`) the
# `cdylib` artifact requires Python headers at link time on some
# platforms ; the canonical build path is `maturin develop` (dev) or
# `maturin build --release` (CI). The `rlib` artifact compiles
# without Python on every workspace `cargo build`.
# ---------------------------------------------------------------------
