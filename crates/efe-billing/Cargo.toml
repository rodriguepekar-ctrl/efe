[package]
name        = "efe-billing"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "M31 — Stripe billing client + invoice builder + budget alerts + reconciliation."

[dependencies]
tokio            = { workspace = true }
tracing          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
once_cell        = "1.20"
chrono           = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac             = "0.12"
sha2             = "0.10"
hex              = "0.4"

efe-metering    = { path = "../efe-metering" }

# Stripe HTTP client.
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Metrics.
prometheus       = { version = "0.13", default-features = false, features = ["process"] }

[dev-dependencies]
tokio            = { workspace = true, features = ["test-util", "macros"] }
anyhow           = { workspace = true }

[features]
default = []
# Real Stripe integration tests. Requires `STRIPE_TEST_KEY`.
stripe-live = []
