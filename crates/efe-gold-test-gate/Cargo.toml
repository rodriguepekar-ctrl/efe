[package]
name = "efe-gold-test-gate"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "M50 — Sprint 11 N19 : Gold-test gate TIER-1 (HMAC-chained ledger, hermetic Firecracker runner, three-strategy assertion engine, operator bypass)."
publish = false

[lib]
name = "efe_gold_test_gate"
path = "src/lib.rs"

[dependencies]
efe-nano-sdk = { path = "../efe-nano-sdk", version = "0.0.1" }
efe-publisher-identity = { path = "../efe-publisher-identity", version = "0.0.1" }

tokio        = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
uuid         = { workspace = true }
tracing      = { workspace = true }

dashmap      = "6.1"
sha2         = "0.10"
hmac         = "0.12"
chrono       = { version = "0.4", features = ["serde"] }

# **Sprint 12 — N20** : HTTP client for OpenAI / Cohere embedding providers.
# Workspace-wide reqwest 0.12, JSON+rustls features.
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
proptest = "1.5"
# **N20** : HTTP mocking for embedding-provider tests.
wiremock = "0.6"

[[bin]]
name = "efe-gold"
path = "src/bin/efe_gold.rs"

[[bin]]
name = "efe-gold-verify"
path = "src/bin/efe_gold_verify.rs"
