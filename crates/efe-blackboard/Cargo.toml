[package]
name = "efe-blackboard"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "M50 — Sprint 13 N21 : Shared blackboard + EventBus for inter-agent communication in a swarm DAG."
publish = false

[lib]
name = "efe_blackboard"
path = "src/lib.rs"

[dependencies]
efe-nano-sdk = { path = "../efe-nano-sdk", version = "0.0.1" }

tokio       = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
uuid        = { workspace = true }
tracing     = { workspace = true }

dashmap     = "6.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# Example `swarm_slm` only : real Mode-C `LlmClient` trait + keyless `BuiltinLlmClient`.
# efe-nano does NOT depend on efe-blackboard, so this dev-dep introduces no cycle.
efe-nano = { path = "../efe-nano", version = "0.0.1" }
# Example `swarm_slm` only : real network SLM backend (POST /completion → llama-server).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
