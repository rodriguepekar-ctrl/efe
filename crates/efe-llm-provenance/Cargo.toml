[package]
name = "efe-llm-provenance"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "M50 — Sprint 9 N17 : LLM provenance — per-call forensic record, ModelRegistry, ProvenanceStore, ProvenanceCollector, query API."
publish = false

[lib]
name = "efe_llm_provenance"
path = "src/lib.rs"

[dependencies]
efe-nano-sdk = { path = "../efe-nano-sdk", version = "0.0.1" }

tokio        = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
uuid         = { workspace = true }
tracing      = { workspace = true }

dashmap      = "6.1"
blake3       = "1.5"
chrono       = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
