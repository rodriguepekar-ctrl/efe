[package]
name        = "efe-kg"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "M33 — Knowledge-graph plane : entity + relation + graph + traversal."

[dependencies]
tokio            = { workspace = true }
tracing          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
once_cell        = "1.20"
parking_lot      = "0.12"
uuid             = { workspace = true }
sha2             = "0.10"
hex              = "0.4"

# HTTP client for the NER extractor (Triton / sidecar).
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Metrics.
prometheus       = { version = "0.13", default-features = false, features = ["process"] }

[dev-dependencies]
tokio            = { workspace = true, features = ["test-util", "macros"] }
anyhow           = { workspace = true }
criterion        = { version = "0.5", default-features = false, features = [
    "plotters", "cargo_bench_support",
] }

[features]
default = []

# M33 perf rewrite (G1-G4) — proves the BFS callback + bulk-upsert
# gains.
[[bench]]
name = "perf_g1_g4"
harness = false
