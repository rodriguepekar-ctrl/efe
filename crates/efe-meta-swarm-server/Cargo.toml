[package]
name         = "efe-meta-swarm-server"
version      = "0.2.0"
edition      = "2021"
rust-version = "1.88"
description  = "Tonic-based gRPC servers for the EFE meta-swarm : a controller binary + a participant binary. Sprint A1 Phase 2 (PR #6) scaffold."
publish      = false
license      = "Apache-2.0"

# Two binaries from the same crate.  See AD1 in
# docs/EFE_A1_PHASE2_PR06_ARCHITECTURE.md.
[[bin]]
name = "controller"
path = "src/bin/controller.rs"

[[bin]]
name = "participant"
path = "src/bin/participant.rs"

# ─────────────────────────────────────────────────────────────────────
# Runtime dependencies.
# ─────────────────────────────────────────────────────────────────────
[dependencies]
# Wire protocol (PR #5).
efe-meta-swarm-proto = { path = "../efe-meta-swarm-proto" }

# Phase-1 algorithms (PR #8 wires them into the controller).
# Couche 3 M2 — `provenance` câble le scellement re-prouvable DANS le moteur
# (`MetaSwarm::iterate_with_provenance`). Sans elle le contrôleur ne sait pas sceller ;
# avec elle il PEUT, et ne le fait que si un tenant est configuré (cf. controller::provenance).
efe-meta-swarm = { path = "../efe-meta-swarm", features = ["provenance"] }
# Couche 3 · 3a — le vocabulaire d'ancrage (AnchorRecord + son format de ligne). On dépend de
# provenance-dag et NON de provenance-bridge : celui-ci tire blake3/ed25519/chrono et les deux
# piles de provenance, ce qui serait un mauvais marché pour six champs de texte.
provenance-dag = { path = "../provenance-dag", version = "0.0.1" }

# M1.b — L'UNIQUE analyseur d'autorité du dépôt. Crate FEUILLE, zéro dépendance : l'arête est
# gratuite et ne soude aucun périmètre. Ce crate hébergeait les deux DERNIÈRES copies de
# l'analyseur, et l'une d'elles COUPAIT TLS vers un hôte distant (cf. src/tls/mod.rs).
# Ne pas réécrire de découpage d'URL ici : `grep '"://"'` est gardé par
# `scella-authority/tests/un_seul_analyseur.rs`, exemptions VIDES depuis M1.b.
scella-authority = { path = "../scella-authority" }

# Couche 3 M1.d — OPTIONAL, gated by the `core-integration` feature (see
# [features]).  efe-mode1 provides `mode1::build_mvp_controller` (Voie A, extrait par R1) ;
# efe-core provides the SwarmSpec types the manifest `controller` block maps
# to ;  sha2 hashes that block into the wire `config_hash`.
# R1 — la FEUILLE, et non plus `efe-server`. C'est tout l'objet de R1 : la fermeture à
# `core-integration` passe de 27 crates du dépôt à 10, pour la même fonction servie.
efe-mode1 = { path = "../efe-mode1", optional = true }
efe-core   = { path = "../efe-core",   optional = true }
sha2       = { version = "0.10" }   # Couche 3 M2/v4 — config_hash déclaré, hors feature

# gRPC.
#
# PR #16 adds the `tls` feature to tonic — the workspace declaration
# pins `tonic = { version = "0.12", features = ["transport"] }` ;
# adding `tls` here is additive (Cargo features union across the
# dependency graph).  Tonic-tls re-exports rustls 0.23 + tokio-rustls
# 0.26 (the same versions we depend on directly above).
tonic       = { workspace = true, features = ["tls"] }
prost       = { workspace = true }
prost-types = { workspace = true }
tower       = { workspace = true }

# Async runtime.
tokio        = { workspace = true }
tokio-stream = { workspace = true }
futures      = { workspace = true }
async-trait  = { workspace = true }
tokio-util   = "0.7"  # `sync::CancellationToken` is exposed in default features
# (drop-guard for cancel propagation lives in tokio-util ; the
# `scopeguard` crate originally listed in the PR #8 architecture
# is therefore not needed.)

# Error + logging.
thiserror          = { workspace = true }
uuid               = { workspace = true }   # Couche 3 M2 — parse du tenant de provenance
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }

# Config / serde.
serde      = { workspace = true }
serde_yaml = "0.9"
serde_json = { workspace = true }

# Metrics — Prometheus client (empty registry in PR #6 ; populated in PR #17).
prometheus     = "0.13"

# Tiny HTTP server for the /metrics endpoint.
hyper          = { version = "1.0", features = ["server", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
bytes          = "1.6"

# Signal handling (placeholders for PR #12 SIGHUP).
signal-hook = "0.3"

# Atomic Arc<T> swap for PR #12 participant reload (architecture § 12).
# Lock-free read path on `IterationParams.load()` ; one atomic store on
# the swap.  ~ 200 LOC dependency ; verified via `cargo tree` to add no
# transitive bloat.
arc-swap = "1.7"

# ─────────────────────────────────────────────────────────────────────
# PR #16 — mTLS + cert-manager wiring.
#
# All TLS deps are pure-Rust (no OpenSSL FFI).  rustls is consumed via
# tonic's optional `tls` feature ; `rustls-pemfile` parses the PEM
# blobs cert-manager writes to the Secret mount.  `notify` watches the
# mount for cert rotations (inotify on Linux ; FSEvents/kqueue fallback
# elsewhere).  `x509-parser` extracts `notBefore`/`notAfter` for the
# `efe_meta_swarm_tls_cert_expiry_seconds` gauge.
#
# Versions are pinned to match the tonic 0.12 rustls family (rustls
# 0.23 via tokio-rustls 0.26).  Changing any of these requires a full
# `cargo check --workspace --all-features` validation, per AD30 of
# `docs/EFE_A1_PHASE2_PR16_ARCHITECTURE.md`.
rustls          = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile  = "2.1"
tokio-rustls    = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
notify          = { version = "6.1", default-features = false, features = ["macos_fsevent"] }
x509-parser     = "0.16"
rustls-pki-types = "1.7"

# ─────────────────────────────────────────────────────────────────────
# PR #17 — Prometheus metrics surface deps.
#
# `dashmap` powers the cardinality circuit-breaker's
# `(metric, labels) → ()` seen-set with lock-free reads and bucketed
# writes (T47 mitigation, AD7 ceiling).
#
# `regex` is used by the PII redaction filter ; the PII pattern is
# compiled once via `OnceLock` and shared process-wide.  No
# per-observation allocation for clean inputs (T49 mitigation).
dashmap = "5.5"
regex   = "1.10"

# ─────────────────────────────────────────────────────────────────────
# PR #18 — OpenTelemetry distributed tracing surface.
#
# The 4 crates below form the OpenTelemetry-rs stack at version 0.27
# (with `tracing-opentelemetry` 0.28 matching that family).  They power :
#
#   * `opentelemetry`                — core API (TraceId, SpanContext, KeyValue).
#   * `opentelemetry_sdk`            — TracerProvider + BatchSpanProcessor +
#                                      Sampler implementations (feature
#                                      `rt-tokio` ties it into our tokio
#                                      runtime so spans can be exported
#                                      asynchronously without blocking the
#                                      gRPC handler).
#   * `opentelemetry-otlp`           — OTLP/gRPC exporter (feature
#                                      `grpc-tonic` reuses our tonic 0.12
#                                      stack — no second HTTP/2 client).
#   * `opentelemetry-semantic-conventions`
#                                     — frozen attribute-name constants
#                                       (`SERVICE_NAME`, `RPC_SYSTEM`, etc.)
#                                       so we don't drift from semconv
#                                       v1.27.
#   * `tracing-opentelemetry`        — the bridge that turns every
#                                       `tracing::info_span!` into an OTel
#                                       span + propagates attribute records
#                                       through `Span::record(..)`.
#
# Cf. `docs/EFE_A1_PHASE2_PR18_ARCHITECTURE.md` § 17 + § 23.  All four
# are required deps (NOT feature-gated) per AD23 — the SDK's runtime
# disable knob (`OTEL_SDK_DISABLED=true`) is the no-op fallback.
opentelemetry                      = { version = "0.27", default-features = false, features = ["trace"] }
opentelemetry_sdk                  = { version = "0.27", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp                 = { version = "0.27", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.27", features = ["semconv_experimental"] }
tracing-opentelemetry              = { version = "0.28", default-features = false, features = ["tracing-log"] }

# ─────────────────────────────────────────────────────────────────────
# Cargo features.
# ─────────────────────────────────────────────────────────────────────
[features]
default = ["tls"]

# Plumbing only in PR #6.  PR #18 will ship the tonic-reflection
# integration that this flag enables.
reflection = []

# PR #16 — TLS / mTLS support.  Off-by-default at the binary level
# is impossible (rustls types appear in public APIs that the bin
# crates use), but **runtime** activation still requires
# `EFE_META_SWARM_TLS_REQUIRED=true` at startup.  The feature gate is
# only used to drop the tonic-tls glue when the operator does NOT
# want to ship a TLS-aware binary.
tls = ["tonic/tls"]

# Couche 3 M1.d — the served participant can wrap the REAL efe-core bridge
# (`efe_meta_swarm::LocalParticipant` over `efe_server::mode1::
# build_mvp_controller`).  Off by default : the default dependency graph
# carries ZERO efe-core/efe-server crates (verify with
# `cargo tree -p efe-meta-swarm-server -e normal`), and an efe-core manifest
# row on a default-built binary fails CONSTRUCTION (never a silent mock).
# `sha2` computes the wire `config_hash` of the manifest controller block.
core-integration = ["efe-meta-swarm/core-integration", "dep:efe-mode1", "dep:efe-core"]

# ─────────────────────────────────────────────────────────────────────
# Dev dependencies.
# ─────────────────────────────────────────────────────────────────────
[dev-dependencies]
tokio   = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }
tonic   = { workspace = true }
efe-meta-swarm-proto = { path = "../efe-meta-swarm-proto" }
# Couche 3 M2 — LE tiers sceptique de la DoD. En dev-dépendance SEULEMENT : le binaire
# servi ne doit rien lier du vérifieur, sinon « re-prouvé par un tiers » deviendrait
# « re-prouvé par du code que le serveur embarque » — ce qui ne prouve plus rien.
verify-meta-mini = { path = "../verify-meta-mini" }
tempfile = "3.10"
reqwest  = { version = "0.12", default-features = false, features = ["http2"] }

# PR #12 — SIGHUP smoke tests share the process-wide signal handler
# table.  `serial_test` ensures the three tests run one at a time so
# kernel-delivered SIGHUPs don't leak between concurrent test threads.
serial_test = "3"
# Unix signal handling for PR #10's `ProcessHarness::sigterm_*` graceful
# drain tests.  `child.kill()` only sends SIGKILL ; SIGTERM is needed to
# exercise the binary's signal handlers + drain path.  `cfg(unix)` is
# enforced inside `tests/common/multiprocess.rs`.
libc = "0.2"

# PR #16 — `rcgen` lets the TLS integration tests generate ECDSA-P256
# certs and matching PKCS#8 private keys at runtime, mirroring what
# cert-manager would write to the Secret mount in production.  Pure
# Rust, no OpenSSL FFI ; matches our crypto-stack policy.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# M1.b — `CancellationToken`, pour appeler la VRAIE `connect_with_tls` depuis un test
# d'intégration plutôt que d'en recopier le corps (ce serait la copie que M1 combat).
tokio-util = "0.7"

# ─────────────────────────────────────────────────────────────────────
# Profile override : panic = "unwind".
# ─────────────────────────────────────────────────────────────────────
# Phase 1 sets `panic = "abort"` workspace-wide.  PR #6 needs unwind
# so Drop runs on panic during in-flight Iterate (participant cancel
# + sidecar persistence).  Cf. AD2 of
# docs/EFE_A1_PHASE2_PR06_ARCHITECTURE.md.
#
# Cargo emits the warning "profiles for the non root package will be
# ignored" but the binary itself uses this profile when produced by
# `cargo build -p efe-meta-swarm-server`.  Verified on macOS aarch64
# + linux x86_64 with cargo 1.88.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"
