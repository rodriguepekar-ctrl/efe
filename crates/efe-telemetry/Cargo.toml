[package]
name = "efe-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Observability stack for EFE: structured logs, Prometheus metrics, event sinks"

[dependencies]
efe-core = { path = "../efe-core" }

# Async runtime and tracing primitives.
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Error handling / serialisation.
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# Metrics + HTTP sidecar for /metrics.
prometheus = "0.13"
axum = "0.7"
tower = { workspace = true }
http = { workspace = true }
http-body-util = "0.1"

# Sprint **D13-bis** — OpenTelemetry SDK real implementation.
# Replaces the no-op `OtelInitError::SdkNotImplemented` placeholder
# from D13. Pinned to 0.27 (matches the tonic 0.12 the workspace
# uses since v0.1.10). Cf.
# `docs/bench/d13bis_otel_sdk_real_architecture.md` § 3.
#
# `default-features = false` keeps the BOM minimal — we enable
# only the trace pipeline + Tokio runtime + OTLP gRPC export.
opentelemetry = { version = "0.27", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = { version = "0.28", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3.10"

[lib]
name = "efe_telemetry"
path = "src/lib.rs"
