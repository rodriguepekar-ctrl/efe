[package]
name        = "efe-metering"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "M31 — per-tenant real-time usage metering (Redis-backed counters + rollup)."

[dependencies]
tokio            = { workspace = true }
tracing          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
once_cell        = "1.20"
chrono           = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# M31 perf — parking_lot::Mutex is ~ 4× faster than std::sync::Mutex
# under contention and lets us drop the `.await` on the hot path that
# tokio::sync::Mutex required (each `.await` triggers a scheduler
# yield, blowing the < 1 µs SLO from the architecture doc).
parking_lot      = "0.12"

# Metrics.
prometheus       = { version = "0.13", default-features = false, features = ["process"] }

[dev-dependencies]
tokio            = { workspace = true, features = ["test-util", "macros"] }
anyhow           = { workspace = true }
# Criterion drives `benches/meter_inc_throughput.rs` for perf
# regression detection. async_tokio feature lets us bench async fns.
criterion        = { version = "0.5", default-features = false, features = [
    "plotters", "cargo_bench_support", "async_tokio",
] }

[features]
default = []

# M31 perf bench harness.
[[bench]]
name = "meter_inc_throughput"
harness = false
