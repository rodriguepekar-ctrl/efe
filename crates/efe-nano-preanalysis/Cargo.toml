[package]
name = "efe-nano-preanalysis"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "M50 — Sprint 13 N21 : six reference pre-analysis agents that implement the SwarmAgent trait — NER, sentiment, language, PII redact, summary, schema-validation."
publish = false

[lib]
name = "efe_nano_preanalysis"
path = "src/lib.rs"

[dependencies]
efe-nano-sdk             = { path = "../efe-nano-sdk", version = "0.0.1" }
efe-blackboard           = { path = "../efe-blackboard", version = "0.0.1" }
efe-swarm-orchestrator   = { path = "../efe-swarm-orchestrator", version = "0.0.1" }
# Sprint 15 N23 G12 : catalogue back-fill + NanoRunner shim trait
# so the gateway dag_registry can wire each agent through the N23
# adapter (signature gate, gold gate, idempotency cache, envelope).
efe-nano-swarm-adapter   = { path = "../efe-nano-swarm-adapter", version = "0.0.1" }

tokio       = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
uuid        = { workspace = true }
tracing     = { workspace = true }
regex       = "1.10"
chrono      = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2        = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
