[package]
name = "efe-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CUDA kernels and Rust bindings for EFE (M2 GPU substrate)."
build = "build.rs"

[lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

# ---------------------------------------------------------------------
# Sprint **D28 (Φ-D)** — `efe-kernels` becomes the GPU substrate of
# EFE. Cf. `docs/EFE_KERNELS_ARCHITECTURE.md`.
#
# Dependency direction is **`efe-kernels → efe-core`** (and never the
# reverse). `efe-core` defines the `ComputeBackend` trait and ships
# the `CpuBackend` reference impl. `efe-kernels` provides the
# `CudaBackend` impl behind the `cuda` Cargo feature so default
# builds (no CUDA toolkit) remain green on Mac/Linux/Windows.
# ---------------------------------------------------------------------

[dependencies]
efe-core = { path = "../efe-core" }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
half = { version = "2.4" }
rand = "0.8"
rand_pcg = "0.3"
rand_distr = "0.4"

# **Sprint Φ-D D32 (Bundle completion)** — sérialisation du
# `GpuFingerprint` (cf. src/fingerprint.rs) en JSON canonique + hash
# SHA-256 pour intégration dans le `host_fingerprint_sha256` global.
# Sans la feature `cuda`, les fields GPU sont None → JSON contient
# uniquement les Option::None → SHA stable.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10" }

# `cudarc` is the safe Rust binding to the CUDA driver, runtime,
# cuBLAS, cuBLASLt, cuRAND and NCCL. Pulled in only when the `cuda`
# feature is active. Pinned to a 0.10.x minor to avoid silent ABI
# drift between minor releases.
cudarc = { version = "0.10", optional = true, default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
proptest = "1.4"

[build-dependencies]
# `cc` invokes `nvcc` when the `cuda` feature is active. The check
# is deliberately permissive : if `nvcc` is absent we degrade to a
# Rust-only build (the `cuda` feature panics at runtime if
# `CudaBackend::new` is called, but the workspace still compiles).
cc = { version = "1.0", optional = true }

# ---------------------------------------------------------------------
# Cargo features
# ---------------------------------------------------------------------
#
# * `cuda`              — the CUDA backend itself. Pulls cudarc + cc.
# * `nccl`              — multi-GPU collectives via NCCL (D30).
# * `fp16`              — half-precision support (post-GA opt).
# * `auto_check_finite` — debug-only NaN/Inf scan after each kernel.
# * `mock_gpu`          — unit-test escape hatch that compiles
#                         `CudaBackend` against a software simulator
#                         when no GPU is present. Used by CI matrix
#                         `test-gpu-smoke` when a GPU runner is
#                         unavailable.
[features]
default = []
cuda = ["dep:cudarc", "dep:cc", "cudarc/driver", "cudarc/cublas", "cudarc/cublaslt", "cudarc/curand"]
nccl = ["cuda", "cudarc/nccl"]
fp16 = ["cuda", "cudarc/f16"]
auto_check_finite = ["cuda"]
mock_gpu = []

# ---------------------------------------------------------------------
# When **building this crate alone** (`cargo build -p efe-kernels`)
# without the `cuda` feature, only the public re-exports + the
# fallback `is_cuda_available() -> bool` const fn ship. Calling
# `CudaBackend::new` then returns
# `CudaError::DeviceUnavailable` so callers get a clear error.
# ---------------------------------------------------------------------
