[package]
name = "efe-nano"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }       # UNLICENSED (commercial)
repository = { workspace = true }
description = "M50 — EFE Nano Agent Swarm runtime : catalog + dispatcher + Mode A/B/C executors + audit trace + billing."
publish = false

[lib]
name = "efe_nano"
path = "src/lib.rs"

[dependencies]
# Public types come from the SDK crate (depend-on-SDK pattern).
efe-nano-sdk = { path = "../efe-nano-sdk", version = "0.0.1" }

# Core async + DB
tokio            = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
tracing          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
uuid             = { workspace = true }

# Per-crate deps
jsonschema       = { version = "0.17", features = ["draft202012"] }
dashmap          = "6.1"
semver           = { version = "1.0", features = ["serde"] }
chrono           = { version = "0.4", features = ["serde"] }
sha2             = "0.10"            # SHA-256 for input hashing (Sprint 1 audit)

# Nano agent deps (Sprint 2-3)
quick-xml        = "0.36"            # xml_validate
regex            = "1.10"            # regex_extract (DoS-protected via size limit)
pulldown-cmark   = "0.12"            # markdown_extract_headings
csv              = "1.3"             # csv_normalize
sqlparser        = "0.52"            # sql_parse_safe

# Sprint 4 (Phase 2 — Mode B Local Model Runtime) :
# - No ONNX dep yet : Phase 2 ships builtin pure-Rust deterministic models.
#   The seam to swap in `tract-onnx = "0.21"` later is `LocalModel::infer`.
# - No Firecracker dep yet : Phase 2 ships a stub VmPool that executes in-
#   process while preserving acquire/release/permit/hit-miss semantics.
#   Real Firecracker integration via `efe-agent-runner` lands Sprint 8.

# Sprint 6 (Phase 2 — Audit HMAC chain + Replay engine) :
hkdf             = "0.12"            # HKDF-SHA256 per-tenant key derivation
hmac             = "0.12"            # HMAC-SHA256 chained audit trail
hex              = "0.4"             # hex encoding for chain payload hashes
# Postgres backend (PostgresChainStore) is a deployment-time impl behind
# the ChainStore trait. The Sprint 6 ship uses InMemoryChainStore for tests
# + the in-repo demo.  Production wiring :
# sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Sprint 8 N11 (Phase 3 — Firecracker pool) :
# `libc` is needed only on Linux for `libc::kill(SIGTERM/SIGKILL)`
# wrapped inside the `signal` submodule of
# `runtime::pool::firecracker::lifecycle`.  Target-specific so macOS
# dev doesn't pull it.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
