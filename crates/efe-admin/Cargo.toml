[package]
name = "efe-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "EFE admin CLI — tenant onboarding self-service (Sprint GLOSS A / D8)"

[[bin]]
name = "efe-admin"
path = "src/main.rs"

[dependencies]
# CLI parsing — pinned to versions compatible with workspace rust-version = 1.85.
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"

# Async runtime
tokio = { workspace = true, features = ["full"] }

# HTTP client (mcp-server)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# UX (pinned : 7.2+ uses let-chains which require Rust 1.88, our workspace is 1.85)
comfy-table = "~7.1"
indicatif = "~0.17"
colored = "2"
dialoguer = { version = "0.11", default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
humantime = "2"

# Validation
regex = "1"
once_cell = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Filesystem helpers
dirs = "5"
shellexpand = "3"

[dev-dependencies]
# Test fixtures
tempfile = "3"
mockito = "~1.5"
serial_test = "3"

[features]
default = []
# Enables OAuth2 device flow (post-MVP). Off in v1.0.0.
sso = []

[lints.rust]
missing_docs = "allow"     # CLI is application code, not library
unused_must_use = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
