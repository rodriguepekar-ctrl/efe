# Sprint Φ-D-LATACT D93 — Saga orchestrator crate.
# Cf. docs/EFE_P1_LATENCE_P2_ACTIVATION_COMPLETION_ARCHITECTURE.md § 9.

[package]
name = "efe-saga"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Distributed transaction saga orchestrator for EFE P2 self-service."

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
