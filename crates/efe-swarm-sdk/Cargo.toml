[package]
name = "efe-swarm-sdk"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Phase 5 — SDK unifié : swarm.run(task, topology, budget). TopologySpec (T1/T2/T3/Consensus/Auto), ClientMode (Keyless/Self-host/Network), budget plafonné, provenance auto-câblée (provenance_root re-vérifiable)."
publish = false

[features]
# B0.3 — seam de test CI Mode C. Expose le point d'injection de backend
# (SwarmBuilder::with_local_backend) + ScriptedBackend (backend déterministe, sans réseau),
# pour rendre le chemin Mode C COMPLET exécutable en CI sans Ollama ni GPU. DÉSACTIVÉ par
# défaut : inerte et absent de la prod (I-SEAM). Les tests INLINE l'utilisent via cfg(test) ;
# les tests d'INTÉGRATION via `--features test-util`.
test-util = []

[lib]
name = "efe_swarm_sdk"
path = "src/lib.rs"

[dependencies]
efe-swarm-topology   = { path = "../efe-swarm-topology", version = "0.0.1" }
efe-swarm-provenance = { path = "../efe-swarm-provenance", version = "0.0.1" }
efe-swarm-memory     = { path = "../efe-swarm-memory", version = "0.0.1" }  # ADR-019 (MEM-2) : recall/learn
efe-blackboard       = { path = "../efe-blackboard", version = "0.0.1" }  # WriteSink (cast du sink)
efe-nano-sdk         = { path = "../efe-nano-sdk", version = "0.0.1" }

serde       = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
tokio       = { workspace = true, features = ["sync", "rt", "time"] }

[dev-dependencies]
serde_json   = { workspace = true }
tokio        = { workspace = true, features = ["macros", "rt-multi-thread"] }
# ADR-016 : le test Mode C RÉEL re-dérive la clé tenant (test_key ∘ TenantId::system).
efe-nano-sdk = { path = "../efe-nano-sdk", version = "0.0.1" }
uuid         = { workspace = true }  # ADR-019 (MEM-2) : run_id des MemoryUpdate de test
