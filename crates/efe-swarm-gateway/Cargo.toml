[package]
name = "efe-swarm-gateway"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Phase 5 Inc.2 — passerelle HTTP du SDK essaim : POST /v1/swarm/run + GET /v1/swarm/verify/:id (le moat exposé : re-preuve indépendante) + /metrics. axum 0.7, mergeable (.nest) ou standalone."
publish = false

[lib]
name = "efe_swarm_gateway"
path = "src/lib.rs"

# Binaire **production** : sélectionne `EnvHkdf` (master server-side), bind 0.0.0.0,
# arrêt gracieux SIGTERM/Ctrl-C, câble store/oidc/pii/router depuis l'env.
[[bin]]
name = "efe-swarm-gateway"
path = "src/main.rs"

[features]
default = []
# Expose `InMemoryRunStore::tamper_first_output` hors `#[cfg(test)]` pour permettre
# un test de falsification depuis un harnais externe. OFF par défaut (jamais en prod).
tamper-testkit = []
# `PgRunStore` (prod) : persistance Postgres write-once des records (la preuve durable).
postgres = ["dep:sqlx"]
# `OidcVerifier` (prod) : auth `Caller` via JWT OIDC ES256 (clé PUBLIQUE server-side ;
# aucune clé manipulée). Remplace l'extracteur d'en-têtes dev.
oidc = ["dep:jsonwebtoken"]
# PII opt-in par tenant (G9) : caviarde sorties + previews. Détection LOCALE (regex, sans
# réseau → souverain) + le redactor `efe-pii`. OFF par défaut (Off = no-op).
pii = ["dep:efe-pii", "dep:regex"]

[dependencies]
efe-swarm-sdk        = { path = "../efe-swarm-sdk", version = "0.0.1" }
efe-swarm-provenance = { path = "../efe-swarm-provenance", version = "0.0.1" }  # verify_swarm + AgentCallRecord + métriques
efe-swarm-topology   = { path = "../efe-swarm-topology", version = "0.0.1" }    # AgentFleet (flotte partagée)
efe-swarm-dashboard  = { path = "../efe-swarm-dashboard", version = "0.0.1" }   # DashboardBus + observer (Inc.3)
efe-blackboard       = { path = "../efe-blackboard", version = "0.0.1" }        # SubstrateMetrics (/metrics)
efe-nano-sdk         = { path = "../efe-nano-sdk", version = "0.0.1" }          # TenantId

axum         = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
tokio        = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-stream = { workspace = true }             # BroadcastStream (SSE)
async-stream = "0.3"                            # stream! (SSE)
futures      = { workspace = true }             # Stream combinators (firehose)
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
uuid         = { workspace = true }

# Prod (feature-gated) — la passerelle légère/dev reste inchangée par défaut.
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "uuid"], optional = true }
jsonwebtoken = { workspace = true, optional = true }
efe-pii = { path = "../efe-pii", version = "0.0.1", optional = true }   # redactor (pur, local) + PolicyKind
regex   = { version = "1", optional = true }                            # détecteur PII LOCAL (souverain)

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower = { workspace = true }                    # ServiceExt::oneshot (tests axum)
http-body-util = "0.1"                          # collecte du corps de réponse dans les tests
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
