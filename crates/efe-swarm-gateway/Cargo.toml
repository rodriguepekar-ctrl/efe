[package]
name = "efe-swarm-gateway"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Phase 5 Inc.2 — passerelle HTTP du SDK essaim : POST /v1/swarm/run + GET /v1/swarm/verify/:id (le moat exposé : re-preuve indépendante) + /metrics. axum 0.7, mergeable (.nest) ou standalone."
publish = false

[lib]
name = "efe_swarm_gateway"
path = "src/lib.rs"

# Binaire **production** : sélectionne `EnvHkdf` (master server-side), bind 0.0.0.0,
# arrêt gracieux SIGTERM/Ctrl-C, câble store/oidc/pii/router depuis l'env.
[[bin]]
name = "efe-swarm-gateway"
path = "src/main.rs"

[features]
default = []
# Expose `InMemoryRunStore::tamper_first_output` hors `#[cfg(test)]` pour permettre
# un test de falsification depuis un harnais externe. OFF par défaut (jamais en prod).
tamper-testkit = []
# Démo locale **sans clé** : expose `test_support::synthetic_mode_c_run` hors `#[cfg(test)]`
# pour l'exemple `local_receipt_demo`. Même motif que `tamper-testkit` — un harnais externe a
# besoin du fixture — et OFF par défaut (jamais en prod).
demo = []
# **M5 — le pont vers le registre réglementaire.** OFF par défaut, et c'est structurel : ce dépôt
# porte DEUX produits séparables — le coin (la passerelle souveraine à reçu) et l'expansion (le
# registre d'évidence réglementaire). L'analyse « produit unique » avait explicitement conclu de ne
# PAS les fusionner : l'un exige de l'acheteur qu'il route son trafic par la passerelle, l'autre ne
# demande que des points d'observation. Joindre n'est pas souder — la feature rend la séparation
# MÉCANIQUE, et un test la garde (`tests/deux_produits_separables.rs`).
#
# Coût marginal quand elle est active : UN crate. `provenance-dag` est déjà dans la fermeture par
# défaut (via `provenance-bridge`, qui produit les bundles), et `reg-evidence` n'en dépend que.
reg-evidence = ["dep:reg-evidence"]
# `PgRunStore` (prod) : persistance Postgres write-once des records (la preuve durable).
postgres = ["dep:sqlx"]
# `OidcVerifier` (prod) : auth `Caller` via JWT OIDC ES256 (clé PUBLIQUE server-side ;
# aucune clé manipulée). Remplace l'extracteur d'en-têtes dev.
oidc = ["dep:jsonwebtoken"]
# PII opt-in par tenant (G9) : caviarde sorties + previews. Détection LOCALE (regex, sans
# réseau → souverain) + le redactor `efe-pii`. OFF par défaut (Off = no-op).
pii = ["dep:efe-pii", "dep:regex"]
# Couche 2 (frontière) : sert la coordination multi-LLM (Claude/Gemini/GPT) via
# `efe-coordinator` (fan-out + 5 missions dans `efe-multi-llm`). OFF par défaut → build
# **byte-identique** (deps non compilées). ON = compile les 3 providers frontière du
# coordinator. L'activation **runtime** reste gouvernée par `EFE_LLM_FRONTIER_ENABLED`.
frontier-llm = ["dep:efe-coordinator", "dep:efe-multi-llm", "dep:provenance-capture", "efe-coordinator/anthropic", "efe-coordinator/openai", "efe-coordinator/gemini"]

[dependencies]
efe-swarm-sdk        = { path = "../efe-swarm-sdk", version = "0.0.1" }
efe-swarm-provenance = { path = "../efe-swarm-provenance", version = "0.0.1" }  # verify_swarm + AgentCallRecord + métriques
# Fil P (P.2) : la dérivation + le scellement du bundle de provenance (pile B). La gateway ne
# dépend PAS de provenance-dag directement, sauf pour le type de clé rendu par derive_bundle_key.
provenance-bridge    = { path = "../provenance-bridge", version = "0.0.1" }     # bundle_from_run + stack_b_key
provenance-dag       = { path = "../provenance-dag", version = "0.0.1" }        # TenantKey (type de retour)
efe-swarm-memory     = { path = "../efe-swarm-memory", version = "0.0.1" }      # ADR-019 (MEM-3) : store + endpoints mémoire
efe-swarm-topology   = { path = "../efe-swarm-topology", version = "0.0.1" }    # AgentFleet (flotte partagée)
efe-swarm-dashboard  = { path = "../efe-swarm-dashboard", version = "0.0.1" }   # DashboardBus + observer (Inc.3)
efe-blackboard       = { path = "../efe-blackboard", version = "0.0.1" }        # SubstrateMetrics (/metrics)
efe-nano-sdk         = { path = "../efe-nano-sdk", version = "0.0.1" }          # TenantId

axum         = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
tokio        = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-stream = { workspace = true }             # BroadcastStream (SSE)
async-stream = "0.3"                            # stream! (SSE)
futures      = { workspace = true }             # Stream combinators (firehose)
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
uuid         = { workspace = true }

# Prod (feature-gated) — la passerelle légère/dev reste inchangée par défaut.
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "uuid"], optional = true }
jsonwebtoken = { workspace = true, optional = true }
efe-pii = { path = "../efe-pii", version = "0.0.1", optional = true }   # redactor (pur, local) + PolicyKind
regex   = { version = "1", optional = true }                            # détecteur PII LOCAL (souverain)

# Couche 2 (feature `frontier-llm`) : moteur de coordination multi-LLM + 5 missions.
# Optionnels → absents du build par défaut. Le coordinator tire reqwest 0.12 (client
# frontière) ; AUCUN tonic/prost (ni l'un ni l'autre n'en dépend) → pas de conflit de versions.
efe-coordinator = { path = "../efe-coordinator", version = "0.0.1", optional = true }  # Coordinator + providers Claude/GPT/Gemini
efe-multi-llm   = { path = "../efe-multi-llm",   version = "0.0.1", optional = true }  # 5 missions (servies en M3)
provenance-capture = { path = "../provenance-capture", version = "0.0.1", optional = true }
# M5 : la dérivation d'évidence réglementaire. Optionnel — voir la feature `reg-evidence`.
reg-evidence = { path = "../reg-evidence", version = "0.0.1", optional = true }  # egress guard is_local_endpoint (réutilisé — pas de 3e copie)

# L'exemple de démo consomme `test_support`, exposé par la feature `demo` seule. Sans cette
# déclaration, `cargo test -p efe-swarm-gateway` (qui construit TOUS les targets) échoue à
# compiler l'exemple — défaut introduit avec la démo et attrapé par la suite complète de M0.
[[example]]
name = "local_receipt_demo"
required-features = ["demo"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower = { workspace = true }                    # ServiceExt::oneshot (tests axum)
http-body-util = "0.1"                          # collecte du corps de réponse dans les tests
ed25519-dalek = "2.1"                           # Fil P (P.3) : vérifier une attestation servie avec la SEULE clé publique
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
