#                       efe-cluster-provisioner
#  ──────────────────────────────────────────────────────────────────
#  PR #23 § 10 — extracted from PR #21 `bench/harness/src/cluster/`.
#  Shared by PR #21 bench-harness + PR #23 smoke.  Frozen surface in
#  STABILITY_CONTRACT v1.5 § 23.6.

[package]
name        = "efe-cluster-provisioner"
version     = "0.1.0"
edition     = "2021"
license     = "UNLICENSED"
description = "Cluster provisioner abstraction (kind / k3s / external) — shared by bench + smoke (PR #23)."
homepage    = "https://efe.example.com/"
repository  = "https://github.com/efe-ai/efe"
keywords    = ["kubernetes", "kind", "k3s", "cluster", "provisioner"]
categories  = ["development-tools::testing"]
publish     = false

[lib]
name = "efe_cluster_provisioner"
path = "src/lib.rs"

[dependencies]
tokio       = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
