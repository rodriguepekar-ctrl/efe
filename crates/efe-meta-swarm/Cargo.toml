[package]
name        = "efe-meta-swarm"
version     = "0.1.0"
edition     = "2021"
authors     = ["EFE Engineering <eng@efe.example.com>"]
license     = "UNLICENSED"
description = "Sprint A1 Phase 1 — hierarchical (meta-)swarm coordination layer for EFE."
repository  = "https://github.com/efe-ai/efe"
readme      = "README.md"
publish     = false

# -----------------------------------------------------------------------------
# Sprint A1 — Phase 1 — Core implementation (mai-juillet 2026).
#
# This crate is a workspace member but is *intentionally not depended on*
# by `efe-server` during Phase 1.  The production binary remains
# byte-identical to the pre-A1 release (master gate verifies SHA-256).
#
# Activation surfaces for the end-user, by phase :
#   * Phase 1 (now)         :  cargo run --example three_swarms_kovant
#   * Phase 2 (Q3 2026)     :  + EFE_META_SWARM_ENABLED + gRPC service
#   * Phase 3 (Q3 2026)     :  + AdminService.SetTenantFeature(meta_swarm)
#   * Phase 4 (Q4 2026)     :  + SDK clients v0.4.0 (Apache-2.0)
#   * Phase 5 (Dec 2026)    :  + GA, tarification, étude de cas client
#
# Architecture reference :  docs/EFE_A1_HIERARCHICAL_SWARMS_ARCHITECTURE.md
# Phase 1 reference      :  docs/EFE_A1_PHASE1_ARCHITECTURE.md
# Roadmap (5 paliers L0-L5) :  docs/EFE_A1_ROADMAP_USER_ACTIVATABLE.md
# -----------------------------------------------------------------------------

[lib]
name = "efe_meta_swarm"
path = "src/lib.rs"

[features]
default            = []
# Opt-in to the attention-weighted meta-operator (= Section 6 of the A5
# paper).  Default-off because it loses global non-expansiveness ;  see
# Theorem 6.5 of A5 and Sections 6.4-6.7 for the recovery conditions.
attention-weighted = []
# Opt-in to npz file loading for lifts/pulls.  Default-off so the crate
# compiles with minimal dependencies in Phase 1.  Wired up in Phase 2.
file-loading       = ["dep:ndarray", "dep:ndarray-npy"]
# Opt-in to the real `efe-core::SwarmController` adapter
# (`LocalParticipant`).  Default-off in Phase 1 so the workspace master
# gate "efe-server binary byte-identical" invariant remains satisfied
# (no transitive linker change).  Phase 2 will flip this on by default.
core-integration   = ["dep:efe-core", "dep:tokio"]
# Couche 3 M1.a (Voie A) — the end-to-end participant seam test only. Pulls efe-server
# (its `mode1::build_mvp_controller`) to construct a REAL `SwarmController`. Kept OFF the
# `core-integration` production path so the served `LocalParticipant` never links the heavy
# `efe-server` crate ; enable ONLY to run `tests/integration_local_participant.rs`.
integration-test   = ["core-integration", "dep:efe-server"]
# Câble la provenance re-prouvable DANS le moteur (chaque pas de consensus scellé au fil de
# l'itération, via un StepObserver). Off par défaut : le seam (trait StepObserver + run(obs)) est
# TOUJOURS compilé et crypto-free ; seul le sink HMAC + l'API iterate_with_provenance sont gatés, pour
# garder le graphe de build par défaut minimal (l'invariant "binaire efe-server byte-identique" est de
# toute façon tenu, efe-meta-swarm n'étant pas lié à efe-server).
provenance         = ["dep:efe-meta-verify", "dep:efe-audit-core", "dep:efe-nano-sdk"]

# -----------------------------------------------------------------------------
# Dependencies — workspace-shared where possible.
# -----------------------------------------------------------------------------

[dependencies]
# Workspace-shared (declared in /Cargo.toml [workspace.dependencies]).
serde      = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
# Crate-local (no equivalent in workspace).
rayon      = "1.10"
serde_yaml = "0.9"
# Optional, gated by `file-loading` feature ; activated in Phase 2.
ndarray       = { version = "0.15", optional = true }
ndarray-npy   = { version = "0.8",  optional = true }
# Optional, gated by `core-integration` feature ; activates LocalParticipant.
# `tokio` and `efe-core` are workspace deps but pulled in only when this
# feature is enabled so the default-build dependency graph of
# `efe-meta-swarm` stays small (= zero transitive impact on efe-server).
efe-core      = { path = "../efe-core", optional = true }
tokio         = { workspace = true,     optional = true }
# Optional, gated by the `integration-test` feature (Couche 3 M1.a, Voie A) : the real
# `SwarmController` construction (Mode-1 fusion on stub templates) lives in efe-server::mode1.
# Pulled ONLY for the M1.a e2e test — never for the default build nor the production
# `core-integration` path (the served bridge must stay decoupled from the heavy efe-server crate).
efe-server    = { path = "../efe-server", optional = true }
# Optional, gated by the `provenance` feature : le câblage de la provenance dans le moteur
# (src/provenance.rs). efe-meta-verify fournit le sceau incrémental (MetaChainState) + les types ;
# efe-audit-core la crypto partagée (chain_hmac + HKDF) ; efe-nano-sdk le TenantId. Pull-in UNIQUEMENT
# quand la feature est active ⇒ graphe de build par défaut inchangé.
efe-meta-verify = { path = "../efe-meta-verify", optional = true }
efe-audit-core  = { path = "../efe-audit-core",  optional = true }
efe-nano-sdk    = { path = "../efe-nano-sdk",     optional = true }

[dev-dependencies]
proptest    = "1.5"
criterion   = { version = "0.5", features = ["html_reports"] }
insta       = "1.39"
tempfile    = "3.10"
# JSON snapshots (PR #3 Cat 14) + le bundle de démo provenance (variante altérée) + tests de fidélité.
serde_json  = { workspace = true }

# -----------------------------------------------------------------------------
# Benches + examples (declared explicitly so cargo can resolve them).
# -----------------------------------------------------------------------------

[[bench]]
name = "three_swarms_kovant_latency"
harness = false

[[example]]
name = "two_swarms_uniform"
path = "examples/two_swarms_uniform.rs"

[[example]]
name = "three_swarms_kovant"
path = "examples/three_swarms_kovant.rs"

[[example]]
name = "multimodal_three_swarms"
path = "examples/multimodal_three_swarms.rs"

[[example]]
name = "safety_violation_attempt"
path = "examples/safety_violation_attempt.rs"

[[example]]
name = "meta_provenance"
path = "examples/meta_provenance.rs"
required-features = ["provenance"]

# -----------------------------------------------------------------------------
# Lints — local to the crate.  Aligned with the conventions used by
# `efe-core` (warn rust + clippy::all + clippy::pedantic with pragmatic
# allows).  We chose local lints (rather than a workspace-level
# `[workspace.lints]` block) because the workspace root currently does
# not define one ; promoting these lints workspace-wide is out of scope
# for sprint A1 Phase 1.
# -----------------------------------------------------------------------------

[lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[lints.clippy]
all      = "warn"
pedantic = { level = "warn", priority = -1 }
# Pragmatic exceptions (match efe-core conventions).
module_name_repetitions  = "allow"
too_many_lines           = "allow"
must_use_candidate       = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
cast_precision_loss      = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
doc_markdown             = "allow"
