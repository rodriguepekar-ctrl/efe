[package]
name = "efe-swarm-orchestrator"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "M50 — Sprint 13 N21 : Swarm DAG orchestrator — declarative multi-agent pre-analysis DAG with layered scheduling, conditional edges, per-agent timeout, and best-effort isolation."
publish = false

[lib]
name = "efe_swarm_orchestrator"
path = "src/lib.rs"

[dependencies]
efe-nano-sdk = { path = "../efe-nano-sdk", version = "0.0.1" }
efe-blackboard = { path = "../efe-blackboard", version = "0.0.1" }

tokio       = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
uuid        = { workspace = true }
tracing     = { workspace = true }
futures     = "0.3"
dashmap     = "6.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
efe-agentic-bridge = { path = "../efe-agentic-bridge", version = "0.0.1" }
efe-nano-preanalysis = { path = "../efe-nano-preanalysis", version = "0.0.1" }
wiremock = "0.6"

