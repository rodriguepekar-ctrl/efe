[package]
name = "efe-publisher-identity"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "M50 — Sprint 10 N18 : publisher identity (Ed25519 signatures, KYC ladder, sanctions screening, revocation cascade, publish ledger HMAC-chained)."
publish = false

[lib]
name = "efe_publisher_identity"
path = "src/lib.rs"

[dependencies]
efe-nano-sdk = { path = "../efe-nano-sdk", version = "0.0.1" }

tokio        = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
uuid         = { workspace = true }
tracing      = { workspace = true }

dashmap         = "6.1"
ed25519-dalek   = { version = "2.1", features = ["rand_core"] }
rand_core       = { version = "0.6", features = ["std"] }
sha2            = "0.10"
hmac            = "0.12"
chrono          = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
proptest = "1.5"

[[bin]]
name = "efe-publishers"
path = "src/bin/efe_publishers.rs"

[[bin]]
name = "efe-publisher-verify"
path = "src/bin/efe_publisher_verify.rs"
