[package]
name        = "efe-region"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "M30 — Region awareness + cross-region health + failover + DR drill harness."

[dependencies]
tokio            = { workspace = true }
tracing          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
once_cell        = "1.20"
uuid             = { workspace = true }

# HTTP probe (cross-region health).
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Metrics.
prometheus       = { version = "0.13", default-features = false, features = ["process"] }

[dev-dependencies]
tokio            = { workspace = true, features = ["test-util", "macros"] }
anyhow           = { workspace = true }

[features]
default = []
# Drill harness — runs against staging only.
dr-drill = []
