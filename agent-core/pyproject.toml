[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "2.0.0"
description = "EFE M25 — Python agent core (runs inside Firecracker microVM)"
authors = [{name = "EFE Engineering", email = "eng@efe.example.com"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    # Minimal, audited dep set. NO requests/urllib3 — all HTTP via the
    # mcp-server proxy.
    "httpx[http2]>=0.27,<0.29",   # talks to LLM router pod via vsock-relay
    "anyio>=4.4",
    "pydantic>=2.7",
    "structlog>=24.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
