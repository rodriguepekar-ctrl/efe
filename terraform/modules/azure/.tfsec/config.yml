# tfsec configuration for the EFE Azure module — documents intentional
# exemptions with rationale.

exclude:
  # AKS authorized_ip_ranges is left empty by default to let the SE
  # configure it per-deployment (typically the SE's office VPN egress
  # range). Documented in the README as "MUST be set for production".
  # tfsec considers empty list as full access ; documentation handles it.
  - azure-container-limit-authorized-ips

  # Key Vault keys have `rotation_policy.expire_after = "P365D"` which
  # is the modern way to enforce expiration. tfsec rule looks for the
  # legacy `not_before_date` / `expiration_date` fields. False positive.
  - azure-keyvault-ensure-key-expiry

  # HMAC seed secret + Postgres credentials secret are deliberately
  # `ignore_changes = [value]` — they are NEVER rotated during normal
  # operation (rotation requires the documented RB-04 procedure).
  # An expiry timer would force surprise rotation = data loss.
  - azure-keyvault-ensure-secret-expiry

minimum_severity: HIGH
