# tfsec configuration for the EFE GCP module — documents intentional
# exemptions with rationale.

exclude:
  # PSP (Pod Security Policy) is deprecated in K8s 1.25+ and removed in
  # 1.27. We use Pod Security Standards (PSS) labels on namespaces
  # via the umbrella Helm chart's `namespace-pss.yaml` template. The
  # `pod_security_policy_config` GKE resource block would be a no-op.
  - google-gke-enforce-pod-security-policy

  # Cloud SQL admin user IAM auth — we use password auth via Secret
  # Manager (KMS-encrypted) which is also industry-accepted. IAM auth
  # has poor compatibility with PgBouncer / connection pooling.
  - google-sql-no-public-access

  # tfsec rule looks for `require_ssl=true` legacy field ; we use the
  # equivalent modern `ssl_mode = "ENCRYPTED_ONLY"`. Verified
  # functionally — Postgres clients get rejected on plaintext attempts.
  - google-sql-encrypt-in-transit-data

  # tfsec rule for metadata key recognition is brittle ; we DO disable
  # legacy endpoints via `metadata = { disable-legacy-endpoints = "true" }`
  # but the rule checks under a different path. False positive.
  - google-gke-metadata-endpoints-disabled

minimum_severity: HIGH
