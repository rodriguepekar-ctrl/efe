# tfsec configuration : ignore findings inherited from upstream
# Terraform AWS modules (terraform-aws-modules/eks/aws, vpc/aws). These
# represent default networking constructs (NACLs, security groups
# attached to NAT egress) that are industry-standard for EKS + VPC
# baseline deployments. Each ignore is documented with rationale.

exclude:
  # Default NACLs from `terraform-aws-modules/vpc/aws` allow all traffic
  # in/out by design — refining them at the module level is not exposed
  # via inputs (would require forking the upstream module).
  - aws-ec2-no-excessive-port-access
  - aws-ec2-no-public-ingress-acl

  # EKS managed node groups create security groups that must allow egress
  # to public endpoints (kubelet → control plane, image pulls from public
  # registries). Restricting this would break EKS bootstrapping.
  - aws-ec2-no-public-egress-sgr

  # RDS IAM authentication : we use password auth via Secrets Manager
  # (with KMS encryption). IAM auth has poor compatibility with PgBouncer
  # / connection pooling layers commonly used by efe-server.
  - aws-rds-enable-iam-auth

  # VPC Flow Logs are explicitly enabled in vpc.tf via
  # `enable_flow_log = true` — tfsec doesn't follow the module override.
  - aws-ec2-require-vpc-flow-logs-for-all-vpcs

minimum_severity: HIGH
